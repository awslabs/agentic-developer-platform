# Resource quotas per namespace
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: default-quota
  namespace: adp-gateway
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    pods: "50"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: default-quota
  namespace: adp-agent-runtime
spec:
  hard:
    requests.cpu: "16"
    requests.memory: 32Gi
    limits.cpu: "32"
    limits.memory: 64Gi
    pods: "100"
