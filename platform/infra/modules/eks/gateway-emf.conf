[FILTER]
    Name                  rewrite_tag
    Match_Regex           ^application\.var\.log\.containers\.bedrockgateway-[^_]+_adp-gateway_bedrockgateway-[a-f0-9]{6,64}\.log$
    Rule                  $log_processed['_aws']['CloudWatchMetrics'][0]['Namespace'] ^BedrockGateway$ gateway-emf.$TAG false
    Emitter_Name          gateway_emf
    Emitter_Storage.type  filesystem
    Emitter_Mem_Buf_Limit  5M

[OUTPUT]
    Name                cloudwatch_logs
    Match               gateway-emf.*
    region              ${AWS_REGION}
    log_group_name      /aws/containerinsights/${CLUSTER_NAME}/application
    log_stream_prefix   ${HOST_NAME}-
    auto_create_group   true
    extra_user_agent    container-insights
    log_key             log
    Retry_Limit         1
    storage.total_limit_size  50M
