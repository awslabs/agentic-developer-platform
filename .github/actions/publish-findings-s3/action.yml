name: Publish findings to S3 rendezvous
description: >
  Copy a tool's findings file (or directory) to the per-run rendezvous prefix
  the Security Summary / baseline-update jobs read. Replaces the GitHub Actions
  artifact handoff, which is unreliable under storage-quota pressure.
inputs:
  path:
    description: 'Local findings file or directory to publish'
    required: true
  tool-name:
    description: 'Tool that produced the findings (checkov, semgrep, bandit, cfn-nag, npm-audit, grype, detect-secrets)'
    required: true
  bucket:
    description: 'S3 bucket name (account-suffixed security-scans bucket)'
    required: true
  source-revision:
    description: 'Verified source revision represented by these findings; defaults to the workflow revision'
    required: false
    default: ''
  dest-prefix:
    description: >
      Optional destination prefix within the bucket, e.g.
      'security-agent/runs/2026-08-30/'. A trailing slash is added if absent.
      Leave unset to keep the legacy 'findings/<run_id>/<tool-name>/' layout the
      Security Summary and baseline-update jobs read.

      Exists because a caller's IAM role may be confined to a prefix that the
      legacy layout falls outside of. The nightly security-agent role
      (adp-<env>-securityagent-nightly-policy) grants s3:PutObject only under
      'security-agent/*', so publishing there under 'findings/...' fails
      AccessDenied AFTER the metered review has run and been paid for (#4517).
    required: false
    default: ''
runs:
  using: composite
  steps:
    - shell: bash
      env:
        FINDINGS_PATH: ${{ inputs.path }}
        TOOL_NAME: ${{ inputs.tool-name }}
        FINDINGS_BUCKET: ${{ inputs.bucket }}
        SOURCE_REVISION: ${{ inputs.source-revision }}
        DEST_PREFIX: ${{ inputs.dest-prefix }}
        ACTION_RUN_ID: ${{ github.run_id }}
        ACTION_RUN_ATTEMPT: ${{ github.run_attempt }}
      run: |
        SOURCE_REVISION="${SOURCE_REVISION:-${GITHUB_SHA}}"
        if [[ ! "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::findings source revision must be a full lowercase commit SHA"
          exit 1
        fi
        if [ ! -e "$FINDINGS_PATH" ]; then
          echo "::warning::findings path '$FINDINGS_PATH' not found for $TOOL_NAME — scanner may have crashed; nothing to publish"
          exit 0
        fi
        # Unset dest-prefix reproduces the legacy destination exactly for callers
        # outside the one-off producer, which passes an attempt-scoped prefix.
        PREFIX="$DEST_PREFIX"
        if [ -z "$PREFIX" ]; then
          PREFIX="findings/${ACTION_RUN_ID}/${TOOL_NAME}/"
        fi
        # `aws s3 cp` treats a destination without a trailing slash as an object
        # key, which would silently write the findings to a KEY named after the
        # prefix instead of into it.
        case "$PREFIX" in
          */) ;;
          *) PREFIX="$PREFIX/" ;;
        esac
        DEST="s3://${FINDINGS_BUCKET}/$PREFIX"
        if [ -d "$FINDINGS_PATH" ]; then
          aws s3 cp "$FINDINGS_PATH" "$DEST" --recursive \
            --metadata "commit=${SOURCE_REVISION},run-attempt=${ACTION_RUN_ATTEMPT}"
        else
          aws s3 cp "$FINDINGS_PATH" "$DEST" \
            --metadata "commit=${SOURCE_REVISION},run-attempt=${ACTION_RUN_ATTEMPT}"
        fi
        echo "Published $TOOL_NAME findings to $DEST"
