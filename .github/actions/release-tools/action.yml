name: ADP release tools
description: Install tools used by the immutable release path
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
    - uses: hashicorp/setup-terraform@v4
      with:
        terraform_version: '1.14.6'
        terraform_wrapper: false
    - uses: azure/setup-kubectl@v4
      with:
        version: 'v1.35.0'
    - shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y skopeo zip jq
        python -m pip install 'boto3>=1.42,<2' PyYAML pytest
