name: Trusted webhook-code identity
description: Exchange protected-environment GitHub OIDC for the webhook-code role; no ambient credential fallback.
inputs:
  role_arn:
    description: Role ARN from the protected environment's ADP_WEBHOOK_CODE_ROLE_ARN variable
    required: true
  region:
    required: true
    description: Target region
runs:
  using: composite
  steps:
    - name: Validate trusted execution context
      shell: bash
      env:
        WEBHOOK_CODE_ROLE_ARN: ${{ inputs.role_arn }}
      run: |
        set -euo pipefail
        test "$GITHUB_REF" = refs/heads/main
        test "$GITHUB_RUN_ATTEMPT" = 1
        test "$GITHUB_EVENT_NAME" = workflow_dispatch -o "$GITHUB_EVENT_NAME" = workflow_call
        [[ "$WEBHOOK_CODE_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/adp-[a-z0-9-]+-trusted-webhook-code$ ]]
        test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
        test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
    - uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.role_arn }}
        aws-region: ${{ inputs.region }}
        role-session-name: webhook-code-${{ github.run_id }}-${{ github.run_attempt }}
        role-duration-seconds: "3600"
        unset-current-credentials: true
        force-skip-oidc: false
        role-chaining: false
        mask-aws-account-id: true
