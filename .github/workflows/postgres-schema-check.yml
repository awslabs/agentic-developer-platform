name: Postgres Schema Check (one-shot)

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: dev
  PGSSLMODE: require

jobs:
  check:
    name: Probe schema
    if: github.ref == 'refs/heads/main'
    env:
      ADP_DB_USER: ${{ vars.ADP_DB_USER }}
    environment: adp-deploy-dev
    permissions:
      contents: read
      id-token: write
    runs-on:
      group: adp-deployment
      labels: arc-runner-deployment
    steps:
      - uses: actions/checkout@v7
      - name: Verify source belongs to reviewed main history
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$GITHUB_SHA"
          git merge-base --is-ancestor HEAD FETCH_HEAD

      - name: Establish trusted deployment identity
        uses: ./.github/actions/trusted-deployment
        with:
          role_arn: ${{ vars.ADP_DEPLOY_ROLE_ARN }}
          region: ${{ vars.ADP_DEPLOY_REGION || 'us-east-1' }}

      - name: Install psql + jq
        run: |
          set -euo pipefail
          for tool in aws terraform kubectl helm jq zip unzip curl git python3 node npm psql; do
            command -v "$tool" >/dev/null || { echo "::error::Reviewed runner image is missing $tool"; exit 1; }
          done
      # The gateway RDS master user is IAM-auth-only (BG_RDS_IAM_AUTH=true) —
      # password authentication is disabled in-database, so the secret's
      # .password is dead and reading it yields "PAM authentication failed".
      # Mint a short-lived IAM auth token instead. Same sequence as
      # platform/evals/cli-onboarding/run-eval.sh resolve_db_creds().
      # The token is valid 15 minutes, so this step runs immediately before psql.
      - name: Resolve RDS connection (IAM auth token)
        run: |
          set -euo pipefail
          PGHOST=$(aws ssm get-parameter \
            --name "/adp/${ENVIRONMENT}/gateway/rds-host" \
            --region "$AWS_REGION" \
            --query Parameter.Value --output text)
          PGDATABASE=$(aws ssm get-parameter \
            --name "/adp/${ENVIRONMENT}/gateway/rds-database-name" \
            --region "$AWS_REGION" \
            --query Parameter.Value --output text)
          if [ -z "$PGHOST" ] || [ -z "$PGDATABASE" ]; then
            echo "::error::Could not resolve RDS host/database from SSM for ${ENVIRONMENT}"
            exit 1
          fi

          # The rds!db-* secret is read for the username only — never the password.
          PGUSER="${ADP_DB_USER:?Configure the reviewed database username in the protected deployment environment}"

          PGPASSWORD=$(aws rds generate-db-auth-token \
            --hostname "$PGHOST" --port 5432 \
            --username "$PGUSER" --region "$AWS_REGION")
          if [ -z "$PGPASSWORD" ]; then
            echo "::error::Failed to mint an RDS IAM auth token for ${PGUSER}@${PGHOST}"
            exit 1
          fi
          echo "::add-mask::$PGPASSWORD"

          echo "PGHOST=$PGHOST" >> "$GITHUB_ENV"
          echo "PGDATABASE=$PGDATABASE" >> "$GITHUB_ENV"
          echo "PGUSER=$PGUSER" >> "$GITHUB_ENV"
          echo "PGPASSWORD=$PGPASSWORD" >> "$GITHUB_ENV"

      - name: Probe
        run: |
          set -euo pipefail
          echo "=== Alembic current revision ==="
          psql -t -c "SELECT version_num FROM alembic_version;"
          echo
          echo "=== Tables ==="
          psql -c "\dt"
          echo
          echo "=== organizations ==="
          psql -c "SELECT id, name, created_at FROM organizations ORDER BY created_at;"
          echo
          echo "=== departments ==="
          psql -c "SELECT id, name, org_id FROM departments ORDER BY org_id, id;"
          echo
          echo "=== teams ==="
          psql -c "SELECT id, name, department_id, org_id FROM teams ORDER BY org_id, id;"
          echo
          echo "=== users ==="
          psql -c "SELECT id, email, team_id, org_id, cognito_sub FROM users ORDER BY org_id, id;"
          echo
          echo "=== user_identities ==="
          psql -c "SELECT id, org_id, user_id, provider, provider_user_id, provider_username FROM user_identities ORDER BY provider, provider_user_id;" || echo "(table missing)"
          echo
          echo "=== channel_tenant_map ==="
          psql -c "SELECT id, provider, provider_scope_id, org_id, created_at FROM channel_tenant_map ORDER BY provider, provider_scope_id;" || echo "(table missing)"
