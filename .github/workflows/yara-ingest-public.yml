name: yara-ingest-public
'on':
  schedule:
  - cron: 0 * * * *
  workflow_dispatch: {}
concurrency:
  group: yara-ingest-public
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  ingest:
    if: github.ref == 'refs/heads/main'
    environment: adp-rules-dev
    permissions:
      contents: read
      id-token: write
    runs-on: ${{ vars.ARC_RUNNER_LABEL || 'arc-runner-org' }}
    steps:
    - uses: actions/checkout@v7
    - name: Install YARA + AWS CLI
      run: |
        set -e
        # YARA + jq
        if ! command -v yara >/dev/null 2>&1; then
          sudo apt-get update -qq
          sudo apt-get install -y -qq yara jq
        fi
        # AWS CLI (ARC runner image may not ship with v2)
        if ! command -v aws >/dev/null 2>&1; then
          curl -sL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscli.zip
          unzip -q /tmp/awscli.zip -d /tmp
          sudo /tmp/aws/install
          rm -rf /tmp/awscli.zip /tmp/aws
        fi
        yara --version
        aws --version
    - name: Establish public rules identity
      uses: aws-e/adp/.github/actions/trusted-rules@main
      with:
        role_arn: ${{ vars.ADP_RULES_ROLE_ARN }}
        region: ${{ vars.ADP_DEPLOY_REGION || 'us-east-1' }}
    - name: Run cyber app automation
      uses: ./modules/domain-apps/cyber/ci/yara-ingest-public
