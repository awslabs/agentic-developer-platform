# =============================================================================
# Agent Context — Service Deployment Workflow
# =============================================================================
# Deploys agent-context K8s services (namespace, RBAC, ConfigMap, Zoekt,
# LiteLLM proxy, DeepWiki, CronJobs, KEDA ScaledJob) to EKS.
#
# Prerequisite: agent-context-infra-apply.yml has been run (creates IAM, S3,
# SQS, DynamoDB, ECR). Images must be built (agent-context-images-build.yml).
#
# This is the manual-trigger equivalent of running `deploy.sh` locally.
# =============================================================================

name: Agent Context Deploy

on:
  # Auto-deploy: chain off a successful image build on main so a merge that
  # rebuilds context-mcp / ingestion images actually rolls out to the cluster.
  # (Previously deploy was manual-only, so new images sat in ECR un-deployed.)
  # workflow_run carries no inputs, so the deploy job falls back to config /
  # IRSA for the account and "latest built image" for tags — the dev default.
  workflow_run:
    workflows: ["Agent Context Images Build"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      customer_account_id:
        description: 'Target AWS account ID (12 digits). Overrides config file.'
        required: false
        default: ''
        type: string
      customer_aws_label:
        description: 'Vaulted credential label for the target account.'
        required: false
        default: ''
        type: string
      customer_user_id:
        description: 'ADP users.id UUID for the linked-account owner.'
        required: false
        default: ''
        type: string
      environment:
        description: 'Deployment environment (dev/staging/prod). Overrides config.'
        required: false
        default: ''
        type: string
      skip_litellm_verify:
        description: 'Skip LiteLLM endpoint verification (faster, for re-deploys)'
        type: boolean
        default: false
      skip_deepwiki:
        description: 'Skip DeepWiki deployment'
        type: boolean
        default: false
      skip_migrations:
        description: 'Skip DB migrations (alembic upgrade head)'
        type: boolean
        default: false
      ingestion_image_tag:
        description: 'Ingestion full source SHA or sha256 digest (default: latest published digest)'
        required: false
        default: ''
      ingestion_only:
        description: 'Promote only ingestion job images; preserve running Jobs and other configuration'
        type: boolean
        default: false
      ingestion_expected_image:
        description: 'Required for ingestion_only: exact current full ingestion digest reference'
        type: string
        default: ''
      deepwiki_only:
        description: 'Promote only DeepWiki image, preserving all live service configuration'
        type: boolean
        default: false
      deepwiki_expected_image:
        description: 'Required for deepwiki_only: exact current full DeepWiki digest reference'
        type: string
        default: ''
      deepwiki_image_tag:
        description: 'DeepWiki source tag or sha256 digest (default: latest runtime digest)'
        required: false
        default: ''
        type: string

concurrency:
  group: agent-context-deploy
  cancel-in-progress: false

env:
  NAMESPACE: agent-context

jobs:
  deploy:
    name: Deploy Services
    runs-on: arc-runner-org
    environment: adp-context-deploy-${{ inputs.environment || 'dev' }}
    timeout-minutes: 30
    # Manual dispatch always runs; auto (workflow_run) only on a successful build.
    if: github.ref == 'refs/heads/main' && inputs.deepwiki_only != true && inputs.ingestion_only != true && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')

    permissions:
      contents: read
      pull-requests: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Verify source belongs to reviewed main history
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$GITHUB_SHA"
          git merge-base --is-ancestor HEAD FETCH_HEAD

      - name: Establish trusted deployment identity
        uses: ./.github/actions/trusted-deployment
        with:
          role_arn: ${{ vars.ADP_DEPLOY_ROLE_ARN }}
          region: ${{ vars.ADP_DEPLOY_REGION || 'us-east-1' }}

      - name: Load deployment config
        uses: ./.github/actions/load-deploy-config
        with:
          account_id: ${{ inputs.customer_account_id }}
          environment: ${{ inputs.environment }}
          customer_account_id: ${{ inputs.customer_account_id }}
          customer_aws_label: ${{ inputs.customer_aws_label }}
          customer_user_id: ${{ inputs.customer_user_id }}

      - name: Set derived variables
        run: |
          echo "ECR_REGISTRY=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com" >> "$GITHUB_ENV"
          echo "EKS_CLUSTER=adp-${ENVIRONMENT}-eks-cluster" >> "$GITHUB_ENV"

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig --name "${{ env.EKS_CLUSTER }}" --region "${{ env.AWS_REGION }}"
          echo "Cluster access configured:"
          kubectl cluster-info 2>/dev/null | head -2 || true

      - name: Verify AWS account
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          echo "Account: $ACCOUNT"
          if [ "$ACCOUNT" != "${{ env.ACCOUNT_ID }}" ]; then
            echo "::error::Wrong AWS account! Expected ${{ env.ACCOUNT_ID }}, got $ACCOUNT"
            exit 1
          fi

      - name: Verify existing context storage
        run: |
          # Release authority is confined to the existing namespace. Platform
          # setup owns Namespace, StorageClass, CSI driver and PersistentVolume.
          kubectl wait --for=jsonpath='{.status.phase}'=Bound pvc/platform-data \
            -n "$NAMESPACE" --timeout=30s
          kubectl wait --for=jsonpath='{.status.phase}'=Bound pvc/zoekt-index \
            -n "$NAMESPACE" --timeout=30s

      - name: Deploy ConfigMap
        run: |
          cd modules/agent-context
          source scripts/_common.sh
          load_config "$(pwd)"

          # Issue #2213: Read SQS queue URL from SSM (published by agent-context
          # infra-apply). Overrides the empty default from config.env; enables the
          # KEDA ScaledJob deployment gate downstream.
          SQS_QUEUE_URL=$(aws ssm get-parameter \
            --name "/adp/${ENVIRONMENT}/agent-context/ingestion-queue-url" \
            --query "Parameter.Value" --output text 2>/dev/null || echo "")
          echo "SQS_QUEUE_URL=${SQS_QUEUE_URL:-(not set)}"

          # Issue #2433: Read Neptune endpoint from SSM (published by agent-context
          # infra-apply). Overrides the empty default from config.env.
          NEPTUNE_ENDPOINT=$(aws ssm get-parameter \
            --name "/adp/${ENVIRONMENT}/agent-context/neptune-endpoint" \
            --query "Parameter.Value" --output text 2>/dev/null || echo "")
          NEPTUNE_PORT=$(aws ssm get-parameter \
            --name "/adp/${ENVIRONMENT}/agent-context/neptune-port" \
            --query "Parameter.Value" --output text 2>/dev/null || echo "8182")
          echo "NEPTUNE_ENDPOINT=${NEPTUNE_ENDPOINT:-(not set)}"
          echo "NEPTUNE_PORT=${NEPTUNE_PORT}"

          # Issue #3233: Read Neptune Bulk Loader role ARN from SSM (published by
          # agent-context infra-apply). When set, ingestion uses the Bulk Loader
          # API instead of openCypher UNWIND; empty → UNWIND fallback.
          NEPTUNE_BULK_LOAD_ROLE_ARN=$(aws ssm get-parameter \
            --name "/adp/${ENVIRONMENT}/agent-context/neptune-bulk-load-role-arn" \
            --query "Parameter.Value" --output text 2>/dev/null || echo "")
          echo "NEPTUNE_BULK_LOAD_ROLE_ARN=${NEPTUNE_BULK_LOAD_ROLE_ARN:-(not set)}"

          # Issue #2049/#2213: in-cluster gateway URL for the worker status
          # callback (worker indexing/complete/failed -> knowledge_assets row).
          # Without this the registry status is stuck at "queued" in the UI.
          GATEWAY_CALLBACK_URL="http://bedrockgateway.adp-gateway.svc.cluster.local"
          echo "GATEWAY_CALLBACK_URL=${GATEWAY_CALLBACK_URL}"

          # Export all variables needed for template substitution
          export NAMESPACE AWS_REGION SQS_QUEUE_URL DYNAMO_TABLE DEEPWIKI_ENABLED
          export GRAPHRAG_ENABLED NEPTUNE_ENDPOINT NEPTUNE_PORT NEPTUNE_BULK_LOAD_ROLE_ARN OPENSEARCH_ENDPOINT
          export WIKI_LLM_MODEL GITHUB_APP_ID_SECRET GITHUB_APP_KEY_SECRET GITHUB_APP_OWNER
          export S3_VECTORS_BUCKET_NAME S3_VECTORS_REGION S3_FILES_BUCKET S3_CONTENT_PREFIX ZOEKT_URL
          export GATEWAY_CALLBACK_URL

          # Use the same existing ACL database configuration as deploy.sh.
          resolve_acl_config || exit 1

          template_file manifests/agent-context-configmap.yaml | kubectl apply -f -
          echo "ConfigMap agent-context-config deployed"

      - name: Apply RBAC (trusted deployment access to agent-context namespace)
        continue-on-error: true
        run: |
          cd modules/agent-context
          source scripts/_common.sh
          load_config "$(pwd)"

          export NAMESPACE
          template_file manifests/ingestion-rbac.yaml | kubectl apply -f - \
            || echo "WARNING: Cannot apply RBAC (likely pre-existing). Continuing."
          echo "RBAC: adp:trusted-deployment → ingestion-pipeline-role"

      - name: Resolve automatic ingestion image without replacing unrelated builds
        if: github.event_name == 'workflow_run'
        env:
          TRIGGER_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          IMAGE=$(python3 modules/agent-context/scripts/resolve-auto-ingestion-image.py)
          echo "ADP_RESOLVED_INGESTION_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Run DB migrations (in-cluster Job)
        if: ${{ inputs.skip_migrations != true }}
        env:
          ADP_INPUT_146F27724A: ${{ inputs.ingestion_image_tag }}
        run: |
          set -e
          cd modules/agent-context
          source scripts/_common.sh
          load_config "$(pwd)"

          # Resolve RDS host from SSM (published by infra-apply)
          RDS_HOST=$(aws ssm get-parameter \
            --name "/adp/${{ env.ENVIRONMENT }}/rds/endpoint" \
            --region "${{ env.AWS_REGION }}" \
            --query 'Parameter.Value' --output text 2>/dev/null || echo "")
          if [ -z "$RDS_HOST" ]; then
            echo "::error::RDS host not found in SSM (/adp/${{ env.ENVIRONMENT }}/rds/endpoint). Run infra-apply first."
            exit 1
          fi

          # Determine ingestion image (same logic as CronJob step)
          INGESTION_REPO="adp-${{ env.ENVIRONMENT }}-agent-context-ingestion"
          INPUT_TAG="${ADP_INPUT_146F27724A}"
          if [ -n "${ADP_RESOLVED_INGESTION_IMAGE:-}" ]; then
            MIGRATION_IMAGE="$ADP_RESOLVED_INGESTION_IMAGE"
          elif [ -n "$INPUT_TAG" ]; then
            if [[ "$INPUT_TAG" == sha256:* ]]; then
              MIGRATION_IMAGE="${{ env.ECR_REGISTRY }}/${INGESTION_REPO}@${INPUT_TAG}"
            else
              MIGRATION_IMAGE="${{ env.ECR_REGISTRY }}/${INGESTION_REPO}:${INPUT_TAG}"
            fi
          else
            LATEST_TAG=$(aws ecr describe-images --repository-name "${INGESTION_REPO}" --filter tagStatus=TAGGED \
              --region ${{ env.AWS_REGION }} --query 'sort_by(imageDetails,&imagePushedAt)[-1].imageDigest' \
              --output text 2>/dev/null || echo "")
            if [ -n "$LATEST_TAG" ] && [ "$LATEST_TAG" != "None" ]; then
              MIGRATION_IMAGE="${{ env.ECR_REGISTRY }}/${INGESTION_REPO}@${LATEST_TAG}"
            else
              echo "::error::No ingestion image found in ECR. Run images-build first."
              exit 1
            fi
          fi

          MIGRATION_IMAGE=$(python3 ../../platform/scripts/resolve-ecr-image.py "$MIGRATION_IMAGE")
          echo "ADP_RESOLVED_INGESTION_IMAGE=$MIGRATION_IMAGE" >> "$GITHUB_ENV"

          # Generate unique Job ID (short git SHA + timestamp)
          MIGRATION_JOB_ID="$(date +%s)-$(echo $GITHUB_SHA | head -c 7)"

          # Template and apply migration Job
          export NAMESPACE="${{ env.NAMESPACE }}"
          export SERVICE_ACCOUNT="${SERVICE_ACCOUNT:-agent-context-sa}"
          export INGESTION_IMAGE="$MIGRATION_IMAGE"
          export AC_RDS_HOST="$RDS_HOST"
          export AC_RDS_PORT="5432"
          export AC_RDS_USERNAME="agent_context_svc"
          export AC_RDS_DBNAME="agent_context"
          export AC_AWS_REGION="${{ env.AWS_REGION }}"
          export MIGRATION_JOB_ID

          echo "Launching migration Job (image: ${MIGRATION_IMAGE})..."
          echo "  RDS host: ${RDS_HOST}"
          template_file manifests/migration-job.yaml | kubectl apply -f -

          # Wait for Job completion (blocking — deploy fails if migration fails)
          JOB_NAME="agent-context-migration-${MIGRATION_JOB_ID}"
          echo "Waiting for Job ${JOB_NAME} to complete..."
          if ! kubectl wait --for=condition=complete "job/${JOB_NAME}" \
            -n ${{ env.NAMESPACE }} --timeout=240s 2>/dev/null; then
            # Check if it failed (not just timed out)
            JOB_STATUS=$(kubectl get job "${JOB_NAME}" -n ${{ env.NAMESPACE }} \
              -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}' 2>/dev/null || echo "")
            if [ "$JOB_STATUS" = "True" ]; then
              echo "::error::Migration Job FAILED. Logs:"
              kubectl logs "job/${JOB_NAME}" -n ${{ env.NAMESPACE }} --tail=50 || true
              exit 1
            fi
            # Timed out — check once more
            COMPLETE=$(kubectl get job "${JOB_NAME}" -n ${{ env.NAMESPACE }} \
              -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}' 2>/dev/null || echo "")
            if [ "$COMPLETE" != "True" ]; then
              echo "::error::Migration Job timed out (240s). Logs:"
              kubectl logs "job/${JOB_NAME}" -n ${{ env.NAMESPACE }} --tail=50 || true
              exit 1
            fi
          fi

          echo "✅ Migration Job completed successfully"
          kubectl logs "job/${JOB_NAME}" -n ${{ env.NAMESPACE }} --tail=20 || true
      - name: Create ServiceAccount (IRSA)
        run: |
          cd modules/agent-context
          source scripts/_common.sh
          load_config "$(pwd)"

          # Get IRSA role ARN from Terraform state
          IRSA_ROLE_ARN=""
          if [ -d terraform/.terraform ]; then
            IRSA_ROLE_ARN=$(cd terraform && terraform output -raw irsa_role_arn 2>/dev/null || echo "")
          fi
          # Fallback: construct from naming convention using resolved inputs
          if [ -z "$IRSA_ROLE_ARN" ]; then
            IRSA_ROLE_ARN="arn:aws:iam::${{ env.ACCOUNT_ID }}:role/adp-${{ env.ENVIRONMENT }}-agent-context-irsa"
          fi
          export IRSA_ROLE_ARN

          if [ -f kubernetes/serviceaccount.yaml ]; then
            template_file kubernetes/serviceaccount.yaml | kubectl apply -f -
            echo "ServiceAccount ${SERVICE_ACCOUNT} with IRSA: ${IRSA_ROLE_ARN}"
          else
            # Create basic SA with IRSA annotation
            cat <<EOF | kubectl apply -f -
          apiVersion: v1
          kind: ServiceAccount
          metadata:
            name: ${SERVICE_ACCOUNT}
            namespace: ${NAMESPACE}
            annotations:
              eks.amazonaws.com/role-arn: "${IRSA_ROLE_ARN}"
          EOF
            echo "ServiceAccount ${SERVICE_ACCOUNT} created with IRSA: ${IRSA_ROLE_ARN}"
          fi

      - name: Deploy Zoekt (code search)
        run: |
          cd modules/agent-context
          source scripts/_common.sh
          load_config "$(pwd)"

          python3 scripts/ensure-zoekt-auth.py --namespace "${NAMESPACE}"
          export NAMESPACE SERVICE_ACCOUNT ZOEKT_IMAGE
          template_file manifests/zoekt.yaml | kubectl apply -f -
          echo "Zoekt webserver deployed (image: ${ZOEKT_IMAGE})"

      - name: Deploy LiteLLM Proxy
        run: |
          cd modules/agent-context
          source scripts/_common.sh
          load_config "$(pwd)"

          export NAMESPACE BEDROCK_EMBEDDING_MODEL BEDROCK_EMBEDDING_DIMENSION BEDROCK_REGION
          export BEDROCK_VLM_MODEL VLM_MAX_CONCURRENT VLM_MAX_RETRIES
          export SERVICE_ACCOUNT LITELLM_PORT LITELLM_IMAGE

          # Determine image: use ECR-built image if available, else default
          LITELLM_REPO="adp-${ENVIRONMENT}-agent-context-litellm-proxy"
          LITELLM_ECR="${ECR_REGISTRY}/${LITELLM_REPO}"
          # Check for latest tag in ECR
          LATEST_TAG=$(aws ecr describe-images --repository-name "${LITELLM_REPO}" \
            --region ${{ env.AWS_REGION }} --query 'sort_by(imageDetails,&imagePushedAt)[-1].imageTags[0]' \
            --output text 2>/dev/null || echo "")
          if [ -n "$LATEST_TAG" ] && [ "$LATEST_TAG" != "None" ]; then
            export LITELLM_IMAGE="${LITELLM_ECR}:${LATEST_TAG}"
            echo "Using ECR image: ${LITELLM_IMAGE}"
          else
            echo "Using default image: ${LITELLM_IMAGE}"
          fi

          template_file manifests/litellm-config.yaml | kubectl apply -f -
          template_file manifests/litellm-proxy.yaml | kubectl apply -f -
          # The image is pinned to the mutable ":latest" tag, so `kubectl apply`
          # sees no manifest diff on a rebuild and would leave the old pod
          # running. Force a rollout so the new image is actually pulled.
          kubectl rollout restart deploy/litellm-proxy -n ${NAMESPACE} || true
          echo "LiteLLM proxy deployed"

      - name: Deploy DeepWiki ConfigMap
        if: ${{ inputs.skip_deepwiki != true }}
        run: |
          cd modules/agent-context
          source scripts/_common.sh
          load_config "$(pwd)"

          if [ "${DEEPWIKI_ENABLED:-true}" = "true" ]; then
            export NAMESPACE
            template_file manifests/deepwiki-configmap.yaml | kubectl apply -f -
            echo "deepwiki-config ConfigMap deployed"
          else
            echo "DeepWiki disabled — skipping ConfigMap"
          fi

      - name: Deploy DeepWiki
        if: ${{ inputs.skip_deepwiki != true }}
        env:
          ADP_INPUT_DEEPWIKI_IMAGE_TAG: ${{ inputs.deepwiki_image_tag }}
        run: |
          cd modules/agent-context
          source scripts/_common.sh
          load_config "$(pwd)"

          if [ "${DEEPWIKI_ENABLED:-true}" = "true" ]; then
            # The upstream default does not support our nonroot, read-only
            # manifest. Deploy the hardened project build by immutable digest.
            export ENVIRONMENT AWS_REGION ECR_REGISTRY
            DEEPWIKI_IMAGE=$(bash scripts/resolve-deepwiki-image.sh "${ADP_INPUT_DEEPWIKI_IMAGE_TAG:-}")
            export NAMESPACE SERVICE_ACCOUNT DEEPWIKI_PORT DEEPWIKI_IMAGE LITELLM_PORT BEDROCK_REGION
            template_file manifests/deepwiki.yaml | kubectl apply -f -
            echo "DeepWiki deployed"
          else
            echo "DeepWiki disabled (DEEPWIKI_ENABLED=false)"
          fi

      - name: Deploy Context MCP Server (Door)
        run: |
          cd modules/agent-context
          source scripts/_common.sh
          load_config "$(pwd)"

          # Resolve context-mcp image from ECR (same pattern as LiteLLM)
          CONTEXT_MCP_REPO="adp-${ENVIRONMENT}-agent-context-context-mcp"
          CONTEXT_MCP_ECR="${ECR_REGISTRY}/${CONTEXT_MCP_REPO}"
          LATEST_TAG=$(aws ecr describe-images --repository-name "${CONTEXT_MCP_REPO}" \
            --region ${{ env.AWS_REGION }} --query 'sort_by(imageDetails,&imagePushedAt)[-1].imageTags[0]' \
            --output text 2>/dev/null || echo "")
          if [ -n "$LATEST_TAG" ] && [ "$LATEST_TAG" != "None" ]; then
            export CONTEXT_MCP_IMAGE="${CONTEXT_MCP_ECR}:${LATEST_TAG}"
            echo "Using ECR image: ${CONTEXT_MCP_IMAGE}"
          else
            echo "::warning::No ECR image found for context-mcp. Using default: ${CONTEXT_MCP_IMAGE}"
            echo "Run the images-build workflow to build the context-mcp image first."
          fi

          DOOR_VERIFICATION_KEYS_SHA256=$(python3 scripts/ensure-door-identity.py --namespace "${NAMESPACE}")
          export DOOR_VERIFICATION_KEYS_SHA256
          export NAMESPACE SERVICE_ACCOUNT CONTEXT_MCP_IMAGE
          template_file manifests/context-mcp.yaml | kubectl apply -f -
          # The image is pinned to the mutable ":latest" tag, so `kubectl apply`
          # sees no manifest diff on a rebuild and would leave the old pod
          # running. Force a rollout so the new image is actually pulled.
          kubectl rollout restart deploy/context-mcp -n ${NAMESPACE} || true
          echo "Context MCP Server deployed"

          # Restrict who can reach the Door (#4073 finding #8). Defence in depth
          # behind the DOOR_API_KEY check in door/auth.py — see the header
          # comment in the manifest for why this is the weaker of the two.
          template_file manifests/networkpolicy.yaml | kubectl apply -f -
          echo "NetworkPolicy context-mcp-ingress applied"

      - name: Deploy Ingestion CronJob + KEDA ScaledJob
        env:
          ADP_INPUT_146F27724A: ${{ inputs.ingestion_image_tag }}
        run: |
          cd modules/agent-context
          source scripts/_common.sh
          load_config "$(pwd)"

          # Issue #2213: Read SQS queue URL from SSM (same source as ConfigMap step)
          SQS_QUEUE_URL=$(aws ssm get-parameter \
            --name "/adp/${ENVIRONMENT}/agent-context/ingestion-queue-url" \
            --query "Parameter.Value" --output text 2>/dev/null || echo "")
          echo "SQS_QUEUE_URL=${SQS_QUEUE_URL:-(not set — ScaledJob will be skipped)}"

          # Determine ingestion image
          INGESTION_REPO="adp-${ENVIRONMENT}-agent-context-ingestion"
          INPUT_TAG="${ADP_INPUT_146F27724A}"
          if [ -n "${ADP_RESOLVED_INGESTION_IMAGE:-}" ]; then
            INGESTION_IMAGE="$ADP_RESOLVED_INGESTION_IMAGE"
          elif [ -n "$INPUT_TAG" ]; then
            if [[ "$INPUT_TAG" == sha256:* ]]; then
              INGESTION_IMAGE="${ECR_REGISTRY}/${INGESTION_REPO}@${INPUT_TAG}"
            else
              INGESTION_IMAGE="${ECR_REGISTRY}/${INGESTION_REPO}:${INPUT_TAG}"
            fi
          else
            # Get latest built tag
            LATEST_TAG=$(aws ecr describe-images --repository-name "${INGESTION_REPO}" --filter tagStatus=TAGGED \
              --region ${{ env.AWS_REGION }} --query 'sort_by(imageDetails,&imagePushedAt)[-1].imageDigest' \
              --output text 2>/dev/null || echo "")
            if [ -n "$LATEST_TAG" ] && [ "$LATEST_TAG" != "None" ]; then
              INGESTION_IMAGE="${ECR_REGISTRY}/${INGESTION_REPO}@${LATEST_TAG}"
            fi
          fi
          INGESTION_IMAGE=$(python3 ../../platform/scripts/resolve-ecr-image.py "$INGESTION_IMAGE")
          export INGESTION_IMAGE
          echo "Ingestion image: ${INGESTION_IMAGE}"

          # Create content ConfigMap
          kubectl create configmap ingestion-content-config \
            --from-file=repos.txt=index_content/repos.txt \
            --from-file=urls.txt=index_content/urls.txt \
            --from-file=docs.txt=index_content/docs.txt \
            --from-file=accounts.txt=index_content/accounts.txt \
            -n ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

          # Deploy CronJob
          export NAMESPACE SERVICE_ACCOUNT INGESTION_REFRESH_SCHEDULE SQS_QUEUE_URL DYNAMO_TABLE
          template_file manifests/repo-refresh-cronjob.yaml | kubectl apply -f -
          echo "Ingestion CronJob deployed"

          if [ "${VULN_SCAN_ENABLED:-true}" = true ]; then
            export VULN_SCAN_SCHEDULE
            template_file manifests/vuln-scan-cronjob.yaml | kubectl apply -f -
            echo "Vulnerability scanner CronJob deployed with the same verified image"
          fi

          # Deploy KEDA ScaledJob (if SQS configured)
          if [ -n "${SQS_QUEUE_URL:-}" ] && [ -f manifests/ingestion-scaledjob.yaml ]; then
            export DEEPWIKI_URL="http://deepwiki.${NAMESPACE}.svc.cluster.local:8001"
            export LLM_BASE_URL="http://litellm-proxy.${NAMESPACE}.svc.cluster.local:4000/v1"
            export DEEPWIKI_ENABLED GRAPHRAG_ENABLED NEPTUNE_ENDPOINT NEPTUNE_PORT OPENSEARCH_ENDPOINT
            export WIKI_LLM_MODEL ECR_REGISTRY
            template_file manifests/ingestion-scaledjob.yaml | kubectl apply -f -
            echo "KEDA ScaledJob deployed"
          fi
      - name: Wait for rollouts
        env:
          SKIP_DEEPWIKI: ${{ inputs.skip_deepwiki == true }}
        run: |
          set -euo pipefail
          cd modules/agent-context
          source scripts/_common.sh
          load_config "$(pwd)"
          echo "Waiting for deployments to be ready..."
          failed=0
          for deployment in zoekt-webserver litellm-proxy context-mcp; do
            kubectl rollout status "deploy/$deployment" -n "$NAMESPACE" --timeout=300s || failed=1
          done
          if [ "$SKIP_DEEPWIKI" != "true" ] && [ "${DEEPWIKI_ENABLED:-true}" = "true" ]; then
            kubectl rollout status deploy/deepwiki -n "$NAMESPACE" --timeout=300s || failed=1
          fi
          if [ "$failed" != 0 ]; then
            kubectl get pods -n "$NAMESPACE" -o wide || true
            # /ready exposes only status and exception type, never credentials.
            # Query every MCP replica so an old healthy pod cannot hide the new
            # replica's ACL failure while a rolling update is stalled.
            for pod in $(kubectl get pods -n "$NAMESPACE" -l app.kubernetes.io/name=context-mcp -o name); do
              echo "ACL readiness for $pod:"
              kubectl exec -n "$NAMESPACE" "$pod" -c context-mcp -- python3 -c \
                'import http.client; c=http.client.HTTPConnection("127.0.0.1",5100,timeout=5); c.request("GET","/ready"); r=c.getresponse(); print(r.status, r.read(4096).decode())' || true
            done
            echo "::error::Agent Context deployment did not become ready."
            exit 1
          fi

      - name: Verify deployment
        run: |
          echo "=== Pod Status ==="
          kubectl get pods -n ${{ env.NAMESPACE }} -o wide
          echo ""
          echo "=== Services ==="
          kubectl get svc -n ${{ env.NAMESPACE }}
          echo ""
          echo "=== PVCs ==="
          kubectl get pvc -n ${{ env.NAMESPACE }}
          echo ""
          echo "=== CronJobs ==="
          kubectl get cronjob -n ${{ env.NAMESPACE }}
          echo ""

          # Structural check: no OpenViking/Sourcebot pods
          if kubectl get pods -n ${{ env.NAMESPACE }} -l app.kubernetes.io/name=openviking 2>/dev/null | grep -q Running; then
            echo "::error::OpenViking pod found — should not exist in new stack!"
            exit 1
          fi
          if kubectl get pods -n ${{ env.NAMESPACE }} -l app.kubernetes.io/name=sourcebot 2>/dev/null | grep -q Running; then
            echo "::error::Sourcebot pod found — should not exist in new stack!"
            exit 1
          fi
          echo "✅ No legacy OpenViking/Sourcebot pods found (correct)"

      - name: Summary
        if: always()
        run: |
          {
            echo "## Agent Context Deploy"
            echo ""
            echo "| Resource | Status |"
            echo "|----------|--------|"
            echo "| Namespace | $(kubectl get ns ${{ env.NAMESPACE }} -o jsonpath='{.status.phase}' 2>/dev/null || echo 'MISSING') |"
            echo "| Zoekt | $(kubectl get deploy zoekt-webserver -n ${{ env.NAMESPACE }} -o jsonpath='{.status.readyReplicas}/{.spec.replicas}' 2>/dev/null || echo 'N/A') |"
            echo "| LiteLLM | $(kubectl get deploy litellm-proxy -n ${{ env.NAMESPACE }} -o jsonpath='{.status.readyReplicas}/{.spec.replicas}' 2>/dev/null || echo 'N/A') |"
            echo "| Context MCP | $(kubectl get deploy context-mcp -n ${{ env.NAMESPACE }} -o jsonpath='{.status.readyReplicas}/{.spec.replicas}' 2>/dev/null || echo 'N/A') |"
            echo "| PVC | $(kubectl get pvc platform-data -n ${{ env.NAMESPACE }} -o jsonpath='{.status.phase}' 2>/dev/null || echo 'N/A') |"
            echo "| Ingestion CronJob | $(kubectl get cronjob ingestion-refresh -n ${{ env.NAMESPACE }} -o jsonpath='{.spec.schedule}' 2>/dev/null || echo 'N/A') |"
            echo ""
            echo "**Images running:**"
            echo '```'
            kubectl get pods -n ${{ env.NAMESPACE }} -o jsonpath='{range .items[*]}{.metadata.name}: {.spec.containers[0].image}{"\n"}{end}' 2>/dev/null || echo "Unable to query"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  promote-deepwiki:
    name: Promote DeepWiki image only
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.deepwiki_only == true && inputs.ingestion_only != true
    runs-on: arc-runner-org
    environment: adp-context-deploy-${{ inputs.environment || 'dev' }}
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Verify source belongs to reviewed main history
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$GITHUB_SHA"
          git merge-base --is-ancestor HEAD FETCH_HEAD
      - name: Establish trusted deployment identity
        uses: ./.github/actions/trusted-deployment
        with:
          role_arn: ${{ vars.ADP_DEPLOY_ROLE_ARN }}
          region: ${{ vars.ADP_DEPLOY_REGION || 'us-east-1' }}
      - name: Load deployment config
        uses: ./.github/actions/load-deploy-config
        with:
          account_id: ${{ inputs.customer_account_id }}
          environment: ${{ inputs.environment }}
          customer_account_id: ${{ inputs.customer_account_id }}
          customer_aws_label: ${{ inputs.customer_aws_label }}
          customer_user_id: ${{ inputs.customer_user_id }}
      - name: Promote verified DeepWiki image
        env:
          ADP_INPUT_DEEPWIKI_IMAGE_TAG: ${{ inputs.deepwiki_image_tag }}
          DEEPWIKI_EXPECTED_IMAGE: ${{ inputs.deepwiki_expected_image }}
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$ACCOUNT_ID"
          [[ "$ADP_INPUT_DEEPWIKI_IMAGE_TAG" =~ ^sha256:[0-9a-f]{64}$ ]]
          export ECR_REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws eks update-kubeconfig --name "adp-${ENVIRONMENT}-eks-cluster" --region "$AWS_REGION"
          DEEPWIKI_IMAGE=$(bash modules/agent-context/scripts/resolve-deepwiki-image.sh "$ADP_INPUT_DEEPWIKI_IMAGE_TAG")
          export DEEPWIKI_IMAGE
          python3 modules/agent-context/scripts/promote-deepwiki-image.py
      - name: Retain promotion receipt
        uses: actions/upload-artifact@v7
        with:
          name: deepwiki-promotion-receipt
          path: deepwiki-promotion-receipt.json
          if-no-files-found: error

  promote-ingestion:
    name: Promote ingestion image only
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.ingestion_only == true && inputs.deepwiki_only != true
    runs-on: arc-runner-org
    environment: adp-context-deploy-${{ inputs.environment || 'dev' }}
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Verify source belongs to reviewed main history
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$GITHUB_SHA"
          git merge-base --is-ancestor HEAD FETCH_HEAD
      - name: Establish trusted deployment identity
        uses: ./.github/actions/trusted-deployment
        with:
          role_arn: ${{ vars.ADP_DEPLOY_ROLE_ARN }}
          region: ${{ vars.ADP_DEPLOY_REGION || 'us-east-1' }}
      - name: Load deployment config
        uses: ./.github/actions/load-deploy-config
        with:
          account_id: ${{ inputs.customer_account_id }}
          environment: ${{ inputs.environment }}
          customer_account_id: ${{ inputs.customer_account_id }}
          customer_aws_label: ${{ inputs.customer_aws_label }}
          customer_user_id: ${{ inputs.customer_user_id }}
      - name: Promote verified ingestion image
        env:
          ADP_INPUT_INGESTION_IMAGE_TAG: ${{ inputs.ingestion_image_tag }}
          INGESTION_EXPECTED_IMAGE: ${{ inputs.ingestion_expected_image }}
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = "$ACCOUNT_ID"
          [[ "$ADP_INPUT_INGESTION_IMAGE_TAG" =~ ^sha256:[0-9a-f]{64}$ ]]
          export ECR_REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          aws eks update-kubeconfig --name "adp-${ENVIRONMENT}-eks-cluster" --region "$AWS_REGION"
          INGESTION_IMAGE=$(python3 platform/scripts/resolve-ecr-image.py "${ECR_REGISTRY}/adp-${ENVIRONMENT}-agent-context-ingestion@${ADP_INPUT_INGESTION_IMAGE_TAG}")
          export INGESTION_IMAGE
          python3 modules/agent-context/scripts/promote-ingestion-image.py
      - name: Retain promotion receipt
        uses: actions/upload-artifact@v7
        with:
          name: ingestion-promotion-receipt
          path: ingestion-promotion-receipt.json
          if-no-files-found: error
