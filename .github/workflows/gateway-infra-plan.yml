name: Gateway Infra Plan

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'modules/gateway/infra/**'
      - 'modules/L5-services/infra/**'
      - 'environments/dev/modules/gateway.tfvars'
      - 'environments/dev/modules/gateway-backend.tfvars'
      # Documentation-only changes do not start this workflow.
      - '!docs/**'
      - '!**/docs/**'
      - '!**/README*'
      - '!**/CHANGELOG*'
      - '!**/CONTRIBUTING*'
      - '!**/*.rst'
    branches:
      - main

env:
  AWS_REGION: us-east-1
  TF_VAR_environment: dev
  MODULE_NAME: gateway
  TF_WORKING_DIR: modules/gateway/infra
  BACKEND_CONFIG: environments/dev/modules/gateway-backend.tfvars
  VAR_FILE: environments/dev/modules/gateway.tfvars

jobs:
  plan:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch')
    name: Terraform Plan
    environment: adp-deploy-dev
    runs-on: arc-runner-org
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - name: Verify source belongs to reviewed main history
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$GITHUB_SHA"
          git merge-base --is-ancestor HEAD FETCH_HEAD

      - name: Establish trusted deployment identity
        uses: ./.github/actions/trusted-deployment
        with:
          role_arn: ${{ vars.ADP_DEPLOY_ROLE_ARN }}
          region: ${{ vars.ADP_DEPLOY_REGION || 'us-east-1' }}

      - name: Install required CLI tools
        run: |
          set -euo pipefail
          for tool in aws terraform kubectl helm jq zip unzip curl git python3 node npm; do
            command -v "$tool" >/dev/null || { echo "::error::Reviewed runner image is missing $tool"; exit 1; }
          done
      # The committed backend tfvars keeps the literal
      # "adp-terraform-state-ACCOUNT_ID" placeholder (the real account id is
      # never committed). Resolve it at runtime from the runner's own identity
      # and override the bucket on init, matching deploy-all.sh's pattern.
      - name: Resolve Terraform state bucket
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "ADP_STATE_BUCKET=adp-terraform-state-${ACCOUNT_ID}" >> "$GITHUB_ENV"
          echo "Resolved state bucket: adp-terraform-state-${ACCOUNT_ID}"

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="../../../${{ env.BACKEND_CONFIG }}" \
            -backend-config="bucket=${ADP_STATE_BUCKET}" \
            -input=false -reconfigure

      - name: Retain native credential owner input
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -euo pipefail
          umask 077
          NATIVE_INPUTS="$RUNNER_TEMP/gateway-native-inputs.tfvars.json"
          terraform show -json | python3 ../../../platform/scripts/native_credential_inputs.py > "$NATIVE_INPUTS"
          echo "ADP_NATIVE_INPUTS=$NATIVE_INPUTS" >> "$GITHUB_ENV"

      - name: Retain Product dispatch input
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          # Empty retains live intent; explicit true/false is a protected rollout.
          ADP_PRODUCT_STORY_DISPATCH_ENABLED: ${{ vars.ADP_PRODUCT_STORY_DISPATCH_ENABLED }}
        run: |
          set -euo pipefail
          umask 077
          DISPATCH_INPUTS="$RUNNER_TEMP/gateway-dispatch-inputs.tfvars.json"
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          terraform show -json | python3 ../../../platform/scripts/product_dispatch_inputs.py \
            --account "$ACCOUNT_ID" --region "$AWS_REGION" --environment "$TF_VAR_environment" > "$DISPATCH_INPUTS"
          echo "ADP_DISPATCH_INPUTS=$DISPATCH_INPUTS" >> "$GITHUB_ENV"

      - name: Retain protected Atlassian MCP provider pins
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          GATEWAY_URL: ${{ vars.ADP_FOUNDATION_GATEWAY_URL }}
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          export ACCOUNT_ID
          bash ../../../scripts/atlassian-mcp-gateway-pins.sh reuse

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_atlassian_forge: ${{ vars.ADP_ATLASSIAN_FORGE_CONFIG_JSON || 'null' }}
        run: |
          set -e
          PIN_ARGS=()
          if [[ -n "${ADP_ATLASSIAN_PINS:-}" ]]; then PIN_ARGS=(-var-file="$ADP_ATLASSIAN_PINS"); fi
          terraform plan -var-file="../../../${{ env.VAR_FILE }}" -var-file="$ADP_NATIVE_INPUTS" "${PIN_ARGS[@]}" -var-file="$ADP_DISPATCH_INPUTS" -out=tfplan -no-color 2>&1 | tee /tmp/plan-output.txt

      - name: Post or update PR comment
        uses: actions/github-script@v9
        if: always() && github.event_name == 'pull_request'
        env:
          PLAN_OUTPUT: ${{ steps.plan.outcome }}
        with:
          script: |
            const fs = require('fs');
            const marker = `<!-- tf-plan:${{ env.MODULE_NAME }} -->`;
            let planText = '';
            try {
              planText = fs.readFileSync('/tmp/plan-output.txt', 'utf8');
            } catch (e) {
              planText = 'Plan output not available.';
            }
            if (planText.length > 60000) {
              planText = planText.substring(0, 60000) + '\n\n... (truncated)';
            }
            const status = process.env.PLAN_OUTPUT === 'success' ? ':white_check_mark:' : ':x:';
            const body = `${marker}\n${status} **Terraform Plan — \`${{ env.MODULE_NAME }}\`**\n\n<details>\n<summary>Plan output</summary>\n\n\`\`\`\n${planText}\n\`\`\`\n\n</details>\n\n*Updated: ${new Date().toISOString()} | Run: [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Summary
        if: always()
        run: |
          echo "## Terraform Plan -- ${{ env.MODULE_NAME }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Module**: ${{ env.MODULE_NAME }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status**: ${{ steps.plan.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Working dir**: ${{ env.TF_WORKING_DIR }}" >> "$GITHUB_STEP_SUMMARY"

  validate-pr-config:
    name: Terraform PR Configuration
    if: github.event_name == 'pull_request'
    runs-on: arc-runner-org
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.2
      - name: Validate without state or deployment credentials
        working-directory: modules/gateway/infra
        run: |
          terraform init -backend=false -input=false
          terraform validate -no-color
