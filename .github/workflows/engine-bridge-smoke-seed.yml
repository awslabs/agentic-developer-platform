name: Engine Bridge Smoke Seed (one-shot)

# One-shot dev helper for the #4527 GitHub command bridge smoke.
#
# The bridge resolves a commenter's GitHub account to a platform identity
# INSIDE the org that owns the repo's installation (aws-e). The operator's
# GitHub account is linked only in their personal org, so every command is
# refused with the uniform message. Same ad-hoc-onboarding class as
# seed-hosted-tenant.yml (pre-admin-API); idempotent, dev only.
#
# probe: read-only dump of orchestration flows/nodes per org + the relevant
#        identity rows, to see which plans a GitHub command could reach.
# seed:  INSERT a users row + github user_identities row for the operator in
#        the target org (ON CONFLICT DO NOTHING).

on:
  workflow_dispatch:
    inputs:
      do_seed:
        description: 'Actually run the seed INSERTs (false = probe only)'
        required: false
        type: boolean
        default: false
      plan_issue_ref:
        description: 'Issue number to bind a scratch running plan to in the target org (empty = skip plan seeding)'
        required: false
        default: ''

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: dev
  PGSSLMODE: require
  # Target org + operator identity (dev constants for the #4527 smoke).
  ORG_ID: aws-e
  TEAM_ID: 62be86b8-4f72-485b-8547-5dae539d921e
  GH_USER_ID: "20402445"
  GH_LOGIN: PranavSharma1000
  SEED_USER_ID: 1fb07e6f-8108-41a2-964d-5f76d63895fe
  SEED_IDENTITY_ID: 58250791-8973-47ce-a97f-583c1b3252e0
  SEED_FLOW_ID: c0febcf7-b448-48c3-a4e7-f7f04156bea8
  SEED_NODE_ID: 2ae2310d-d678-4d00-bca5-d3708de02186
  SEED_MEMBERSHIP_ID: 40439edf-3ad2-45d2-9f19-ec6ed80c9960

jobs:
  run:
    name: Probe and (optionally) seed
    if: github.ref == 'refs/heads/main'
    env:
      ADP_DB_USER: ${{ vars.ADP_DB_USER }}
    environment: adp-deploy-dev
    permissions:
      contents: read
      id-token: write
    runs-on:
      group: adp-deployment
      labels: arc-runner-deployment
    steps:
      - uses: actions/checkout@v7
      - name: Verify source belongs to reviewed main history
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$GITHUB_SHA"
          git merge-base --is-ancestor HEAD FETCH_HEAD

      - name: Establish trusted deployment identity
        uses: ./.github/actions/trusted-deployment
        with:
          role_arn: ${{ vars.ADP_DEPLOY_ROLE_ARN }}
          region: ${{ vars.ADP_DEPLOY_REGION || 'us-east-1' }}

      - name: Install psql + jq
        run: |
          set -euo pipefail
          for tool in aws terraform kubectl helm jq zip unzip curl git python3 node npm psql; do
            command -v "$tool" >/dev/null || { echo "::error::Reviewed runner image is missing $tool"; exit 1; }
          done
      # Same IAM-auth sequence as postgres-schema-check.yml: the master user is
      # IAM-auth-only, the secret is read for the username only.
      - name: Resolve RDS connection (IAM auth token)
        run: |
          set -euo pipefail
          PGHOST=$(aws ssm get-parameter \
            --name "/adp/${ENVIRONMENT}/gateway/rds-host" \
            --region "$AWS_REGION" \
            --query Parameter.Value --output text)
          PGDATABASE=$(aws ssm get-parameter \
            --name "/adp/${ENVIRONMENT}/gateway/rds-database-name" \
            --region "$AWS_REGION" \
            --query Parameter.Value --output text)
          PGUSER="${ADP_DB_USER:?Configure the reviewed database username in the protected deployment environment}"
          PGPASSWORD=$(aws rds generate-db-auth-token \
            --hostname "$PGHOST" --port 5432 \
            --username "$PGUSER" --region "$AWS_REGION")
          echo "::add-mask::$PGPASSWORD"
          echo "PGHOST=$PGHOST" >> "$GITHUB_ENV"
          echo "PGDATABASE=$PGDATABASE" >> "$GITHUB_ENV"
          echo "PGUSER=$PGUSER" >> "$GITHUB_ENV"
          echo "PGPASSWORD=$PGPASSWORD" >> "$GITHUB_ENV"

      - name: Probe (read-only)
        run: |
          set -euo pipefail
          echo "=== orchestration_flows by org ==="
          psql -c "SELECT id, org_id, slug, state, intent_ref, left(title,50) AS title FROM orchestration_flows ORDER BY org_id, created_at;"
          echo "=== orchestration_nodes by org ==="
          psql -c "SELECT id, org_id, flow_id, kind, state, issue_ref, left(title,50) AS title FROM orchestration_nodes ORDER BY org_id, created_at;"
          echo "=== operator identity rows (github ${GH_USER_ID}) ==="
          psql -c "SELECT id, org_id, user_id, team_id, provider_username FROM user_identities WHERE provider='github' AND provider_user_id='${GH_USER_ID}';"
          echo "=== users in org ${ORG_ID} ==="
          psql -c "SELECT id, email, team_id, role FROM users WHERE org_id='${ORG_ID}';"

      - name: Seed operator identity in target org
        if: inputs.do_seed == true
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<SQL
          INSERT INTO users (id, org_id, team_id, email, name, role, is_shadow, created_at)
          VALUES ('${SEED_USER_ID}', '${ORG_ID}', '${TEAM_ID}',
                  '${GH_LOGIN}@github.onboard', '${GH_LOGIN}', 'org_admin', false, now())
          ON CONFLICT (id) DO NOTHING;

          INSERT INTO user_identities (id, org_id, user_id, team_id, provider,
                  provider_user_id, provider_username, verification_method, verified_at, created_at)
          VALUES ('${SEED_IDENTITY_ID}', '${ORG_ID}', '${SEED_USER_ID}', '${TEAM_ID}',
                  'github', '${GH_USER_ID}', '${GH_LOGIN}', 'admin_manual', now(), now())
          ON CONFLICT (provider, provider_user_id, org_id) DO NOTHING;

          -- Authority comes from tenant_memberships, not users.role (#3987):
          -- without an active membership row the role lookup demotes to MEMBER
          -- (least-privilege default), which lacks plan:approve and refuses
          -- every engine command. Upsert so a re-run repairs role/is_active.
          INSERT INTO tenant_memberships (id, user_id, tenant_id, role, is_active, joined_via, created_at)
          VALUES ('${SEED_MEMBERSHIP_ID}', '${SEED_USER_ID}', '${ORG_ID}', 'org_admin', true, 'org_membership', now())
          ON CONFLICT (user_id, tenant_id)
          DO UPDATE SET role='org_admin', is_active=true, updated_at=now();
          SQL
          echo "=== verify ==="
          psql -c "SELECT id, org_id, user_id, team_id FROM user_identities WHERE provider='github' AND provider_user_id='${GH_USER_ID}' AND org_id='${ORG_ID}';"

      # A `halt` is flow-scoped and only moves nodes in running/awaiting_gate
      # (engine_commands._HALTABLE_STATES), and the command's flow is resolved by
      # the commented issue's number — so the smoke needs one RUNNING story node
      # in the target org bound to the scratch issue. Freshly seeded, it sits far
      # below the stall threshold (hours, derived from the pod deadline).
      - name: Seed scratch plan bound to issue
        if: inputs.do_seed == true && inputs.plan_issue_ref != ''
        env:
          ADP_INPUT_45206566FE: ${{ inputs.plan_issue_ref }}
        run: |
          set -euo pipefail
          if [[ ! "${ADP_INPUT_45206566FE}" =~ ^[0-9]+$ ]]; then
            echo "::error::plan_issue_ref must be a positive integer"
            exit 1
          fi
          ISSUE_REF='${ADP_INPUT_45206566FE}'
          psql -v ON_ERROR_STOP=1 <<SQL
          INSERT INTO orchestration_flows (id, org_id, slug, title, intent_ref, state, created_at)
          VALUES ('${SEED_FLOW_ID}', '${ORG_ID}', 'bridge-smoke-4527',
                  'Engine bridge smoke (#4527)', NULL, 'pending', now())
          ON CONFLICT (id) DO NOTHING;

          INSERT INTO orchestration_nodes (id, org_id, flow_id, epic_ref, wave_ref, node_ref,
                  kind, state, title, issue_ref, attempts, created_at)
          VALUES ('${SEED_NODE_ID}', '${ORG_ID}', '${SEED_FLOW_ID}', 'e1', 'w1', 'n1',
                  'story', 'running', 'Bridge smoke story', '${ISSUE_REF}', 0, now())
          ON CONFLICT (id) DO NOTHING;

          -- Re-arm on re-dispatch: a prior smoke may have left the node halted.
          UPDATE orchestration_nodes SET state='running', issue_ref='${ISSUE_REF}', updated_at=now()
          WHERE id='${SEED_NODE_ID}';
          SQL
          echo "=== verify plan ==="
          psql -c "SELECT id, org_id, kind, state, issue_ref FROM orchestration_nodes WHERE flow_id='${SEED_FLOW_ID}';"
