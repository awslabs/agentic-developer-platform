name: Gateway Frontend Deploy

on:
  push:
    branches: [main]
    paths:
      - 'modules/gateway/frontend/**'
      - '.github/workflows/gateway-frontend-deploy.yml'
      # Documentation-only changes do not start this workflow.
      - '!docs/**'
      - '!**/docs/**'
      - '!**/README*'
      - '!**/CHANGELOG*'
      - '!**/CONTRIBUTING*'
      - '!**/*.rst'
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        type: string
        default: dev

concurrency:
  group: gateway-frontend-release-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: arc-runner-org
    environment: adp-frontend-deploy-${{ inputs.environment || 'dev' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify reviewed main source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$GITHUB_SHA"
          git merge-base --is-ancestor HEAD FETCH_HEAD

      - name: Establish frontend publishing identity
        uses: ./.github/actions/trusted-deployment
        with:
          role_arn: ${{ vars.ADP_FRONTEND_DEPLOY_ROLE_ARN }}
          region: ${{ vars.ADP_DEPLOY_REGION || 'us-east-1' }}

      - name: Load deployment config
        uses: ./.github/actions/load-deploy-config
        with:
          environment: ${{ inputs.environment || 'dev' }}

      - name: Resolve frontend configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail
          test "$ACCOUNT_ID" = "$(aws sts get-caller-identity --query Account --output text)"
          get_ssm() { aws ssm get-parameter --name "/adp/${ENVIRONMENT}/gateway/$1" --query Parameter.Value --output text; }
          pool=$(get_ssm cognito-user-pool-id)
          client=$(get_ssm cognito-client-id)
          domain=$(get_ssm cognito-domain)
          broker=$(get_ssm github-auth-broker-url)
          ws=$(get_ssm agent-ws-url 2>/dev/null || true)
          bucket=$(get_ssm frontend-bucket)
          distribution=$(get_ssm cloudfront-id)
          cloudfront_domain=$(get_ssm cloudfront-domain)
          for value in "$pool" "$client" "$domain" "$broker" "$bucket" "$distribution" "$cloudfront_domain"; do
            test -n "$value" && test "$value" != None
          done
          {
            echo "VITE_COGNITO_USER_POOL_ID=$pool"
            echo "VITE_COGNITO_CLIENT_ID=$client"
            echo "VITE_COGNITO_DOMAIN=$domain"
            echo "VITE_GITHUB_AUTH_BROKER_URL=$broker"
            echo "VITE_AGENT_WS_URL=$ws"
            echo "bucket=$bucket"
            echo "distribution=$distribution"
            echo "cloudfront_domain=$cloudfront_domain"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build frontend
        working-directory: modules/gateway/frontend
        env:
          VITE_API_URL: /api
          VITE_COGNITO_REGION: ${{ vars.ADP_DEPLOY_REGION || 'us-east-1' }}
          VITE_COGNITO_USER_POOL_ID: ${{ steps.config.outputs.VITE_COGNITO_USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ steps.config.outputs.VITE_COGNITO_CLIENT_ID }}
          VITE_COGNITO_DOMAIN: ${{ steps.config.outputs.VITE_COGNITO_DOMAIN }}
          VITE_GITHUB_AUTH_BROKER_URL: ${{ steps.config.outputs.VITE_GITHUB_AUTH_BROKER_URL }}
          VITE_AGENT_WS_URL: ${{ steps.config.outputs.VITE_AGENT_WS_URL }}
        run: |
          npm ci
          npm run build

      - name: Publish and verify frontend
        shell: bash
        env:
          BUCKET: ${{ steps.config.outputs.bucket }}
          DISTRIBUTION: ${{ steps.config.outputs.distribution }}
          CLOUDFRONT_DOMAIN: ${{ steps.config.outputs.cloudfront_domain }}
        run: |
          set -euo pipefail
          aws s3 sync modules/gateway/frontend/dist/ "s3://${BUCKET}/" \
            --delete --exclude 'cfn-templates/*' --only-show-errors
          invalidation=$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION" --paths '/*' \
            --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id "$DISTRIBUTION" --id "$invalidation"
          for attempt in {1..10}; do
            curl -fsS "https://${CLOUDFRONT_DOMAIN}/settings/agent-models" \
              -o "$RUNNER_TEMP/published-index.html"
            if cmp -s modules/gateway/frontend/dist/index.html "$RUNNER_TEMP/published-index.html"; then
              break
            fi
            echo "Waiting for published index (attempt $attempt)"
            sleep 3
          done
          cmp modules/gateway/frontend/dist/index.html "$RUNNER_TEMP/published-index.html"
          curl -fsS "https://${CLOUDFRONT_DOMAIN}/api/health" |
            python3 -c 'import json,sys; assert json.load(sys.stdin)["status"] == "healthy"'

      - name: Record frontend release evidence
        env:
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          ADP_RELEASE_SOURCE: ${{ github.sha }}
          ADP_RELEASE_DEFINITION: ${{ github.workflow_sha }}
          ADP_RELEASE_WORKFLOW: .github/workflows/gateway-frontend-deploy.yml
        run: python3 modules/gateway/scripts/deployment-release-evidence.py gateway-frontend

      - uses: actions/upload-artifact@v4
        with:
          name: adp-release-gateway-frontend-${{ github.run_attempt }}
          path: ${{ runner.temp }}/adp-release-gateway-frontend/release.json
          if-no-files-found: error
          retention-days: 30
