name: Superplane Executor Build

# Explicit release action. No push trigger or automatic promotion/deployment.
on:
  workflow_dispatch:
    inputs:
      account_id:
        description: Selected AWS account
        required: true
      region:
        description: Selected AWS region
        required: true
      project_name:
        description: Existing CodeBuild project using releases/buildspecs/executor.yml
        required: true
      state_bucket:
        description: Existing source artifact bucket
        required: true
      python_image:
        description: Reviewed Python 3.12 image by sha256 digest
        required: true

concurrency:
  group: superplane-executor-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: arc-runner-org
    permissions:
      contents: read
    env:
      ACCOUNT_ID: ${{ inputs.account_id }}
      AWS_REGION: ${{ inputs.region }}
      PROJECT_NAME: ${{ inputs.project_name }}
      STATE_BUCKET: ${{ inputs.state_bucket }}
      PYTHON_IMAGE: ${{ inputs.python_image }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate release inputs and existing build target
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ACCOUNT_ID" =~ ^[0-9]{12}$ ]]
          [[ "$AWS_REGION" =~ ^[a-z]{2}(-[a-z]+)+-[0-9]+$ ]]
          [[ "$PROJECT_NAME" =~ ^[A-Za-z0-9_-]{1,150}$ ]]
          [[ "$STATE_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]]
          [[ "$PYTHON_IMAGE" =~ ^[a-zA-Z0-9./:_-]+@sha256:[a-f0-9]{64}$ ]]
          python3 -m pip install --quiet PyYAML
          python3 modules/domain-apps/superplane/releases/resolve_lock.py superplane-executor >> "$GITHUB_ENV"
          test "$(aws sts get-caller-identity --query Account --output text)" = "$ACCOUNT_ID"
          test "$(aws codebuild batch-get-projects --names "$PROJECT_NAME" --query 'projects[0].source.buildspec' --output text)" = modules/domain-apps/superplane/releases/buildspecs/executor.yml
      - name: Build maintained executor and shared contracts
        uses: ./.github/actions/codebuild-run
        with:
          project_name: ${{ inputs.project_name }}
          region: ${{ inputs.region }}
          state_bucket: ${{ inputs.state_bucket }}
          environment_variables: >-
            "name=AWS_REGION,value=${{ env.AWS_REGION }}"
            "name=ACCOUNT_ID,value=${{ env.ACCOUNT_ID }}"
            "name=REGISTRY,value=${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
            "name=ECR_REPO,value=${{ env.ECR_REPO }}"
            "name=ORIGIN_REPOSITORY,value=${{ env.ORIGIN_REPOSITORY }}"
            "name=ORIGIN_REVISION,value=${{ env.ORIGIN_REVISION }}"
            "name=SOURCE_PATH,value=${{ env.SOURCE_PATH }}"
            "name=SUPERPLANE_SOURCE_DIR,value=${{ env.SUPERPLANE_SOURCE_DIR }}"
            "name=IMAGE_TAG,value=${{ github.sha }}"
            "name=PYTHON_IMAGE,value=${{ env.PYTHON_IMAGE }}"
      - name: Record the produced digest for release review
        shell: bash
        run: |
          set -euo pipefail
          aws ecr describe-images --repository-name "$ECR_REPO" --image-ids "imageTag=$GITHUB_SHA" --query 'imageDetails[0].imageDigest' --output text >> "$GITHUB_STEP_SUMMARY"
