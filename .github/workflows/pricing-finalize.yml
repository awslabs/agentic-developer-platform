name: Gateway Pricing Finalize

# Resume after the reviewed pricing infra apply when the first release's hard
# finalization gate found missing infrastructure. Run at the reviewed release ref.
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Full commit SHA of the already deployed and reviewed gateway release.'
        required: true
      allow_partial_refresh:
        description: 'Resume scheduling with retained older rates after reviewing source gaps. Freshness alarms remain active.'
        required: false
        type: boolean
        default: false
      account_id:
        description: 'Target AWS account. Empty uses deployment config.'
        required: false
        default: ''
      environment:
        description: 'Target environment.'
        required: false
        default: 'dev'
      customer_account_id:
        description: 'Customer-linked AWS account, when using cross-account deployment.'
        required: false
        default: ''
      customer_aws_label:
        description: 'Vaulted customer AWS credential label.'
        required: false
        default: ''
      customer_user_id:
        description: 'ADP user UUID for customer credential resolution.'
        required: false
        default: ''

concurrency:
  group: gateway-release-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  finalize:
    if: github.ref == 'refs/heads/main'
    environment: adp-deploy-${{ inputs.environment || 'dev' }}
    runs-on: arc-runner-org
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}
      - name: Verify source belongs to reviewed main history
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$GITHUB_SHA"
          git merge-base --is-ancestor HEAD FETCH_HEAD

      - name: Establish trusted deployment identity
        uses: ./.github/actions/trusted-deployment
        with:
          role_arn: ${{ vars.ADP_DEPLOY_ROLE_ARN }}
          region: ${{ vars.ADP_DEPLOY_REGION || 'us-east-1' }}

      - name: Load deployment config
        uses: ./.github/actions/load-deploy-config
        with:
          account_id: ${{ inputs.account_id }}
          environment: ${{ inputs.environment }}
          customer_account_id: ${{ inputs.customer_account_id }}
          customer_aws_label: ${{ inputs.customer_aws_label }}
          customer_user_id: ${{ inputs.customer_user_id }}
      - name: Install kubectl
        run: |
          set -euo pipefail
          for tool in aws terraform kubectl helm jq zip unzip curl git python3 node npm; do
            command -v "$tool" >/dev/null || { echo "::error::Reviewed runner image is missing $tool"; exit 1; }
          done
      - name: Verify release pricing and activate its schedule
        env:
          PRICING_RELEASE_SHA: ${{ inputs.release_sha }}
          PRICING_ALLOW_PARTIAL: ${{ inputs.allow_partial_refresh }}
        run: |
          set -euo pipefail
          [[ "$PRICING_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "A full release SHA is required" >&2; exit 1; }
          [ "$(git rev-parse HEAD)" = "$PRICING_RELEASE_SHA" ] || { echo "Checkout does not match the release SHA" >&2; exit 1; }
          PRICING_IMAGE="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/adp-gateway:${PRICING_RELEASE_SHA}"
          PRICING_RECOVERY_ARGS=()
          if [ "$PRICING_ALLOW_PARTIAL" = "true" ]; then PRICING_RECOVERY_ARGS+=(--allow-partial-refresh); fi
          python3 modules/gateway/scripts/pricing-rollout.py finalize "${PRICING_RECOVERY_ARGS[@]}" \
            --account-id "$ACCOUNT_ID" --environment "$ENVIRONMENT" \
            --expected-image "$PRICING_IMAGE"
