name: Superplane Platform Monitor Build

# Builds the pinned Superplane Platform Monitor image — Issue #5041 (U2), EPIC #4910.
#
# Pattern copied from cyber-worker-build.yml (zip source -> S3 -> CodeBuild -> ECR), which
# is the established image-build lane in this repo. Two things differ deliberately, and
# both are the point of this story:
#
# 1. THE REF COMES FROM THE LOCK, NOT FROM THIS FILE. The revision to build is read from
#    modules/domain-apps/superplane/releases/superplane.lock.yaml by resolve_lock.py. No
#    branch name, no `:latest`, no `github.sha` standing in for an upstream revision. An
#    unchanged lock therefore yields identical inputs on every run (R2 acc. 3). If you find
#    yourself adding a ref to this file, the lock has stopped being the mechanism.
#
# 2. IT FAILS CLOSED ON SOURCE ACCESS. Building this image needs read access to
#    aws-innovate/AISuperPlane that ADP does not have. The resolve step exits 78 and says
#    which mechanisms would fix it. This lane is NOT written as though
#    `actions/checkout` of the upstream repository will work: the hosted token is scoped to
#    this repository, so that checkout fails for everyone, and a lane built on it would
#    report a confusing transient-looking error instead of a named missing grant.
#
# The read-only reference snapshot (planning branch, ai-super-plane/reference/) is NOT a
# build input — building from it would ship evidence as a product and pin a stale revision.
# tests/test_build_source_is_declared.py asserts this file references neither.
#
# The ECR push target and the digest write-back are present but gated behind the resolve
# step. Source acquisition remains an explicit integration task after the grant;
# the offline buildspec and source-directory contract are present and tested.

on:
  # Triggered by the lock, because the lock is what determines what gets built. Changing
  # the pinned revision is the event that should cause a rebuild.
  push:
    branches: [main]
    paths:
      - 'modules/domain-apps/superplane/releases/superplane.lock.yaml'
      - 'modules/domain-apps/superplane/releases/resolve_lock.py'
      - 'modules/domain-apps/superplane/releases/build-image.sh'
      - 'modules/domain-apps/superplane/releases/buildspecs/monitor.yml'
      - '.github/workflows/superplane-monitor-build.yml'
  workflow_dispatch: {}

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: dev
  CODEBUILD_PROJECT: adp-dev-superplane-monitor
  LOCK_IMAGE: superplane-platform-monitor

concurrency:
  group: superplane-monitor-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Superplane Platform Monitor Image
    runs-on: arc-runner-org
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Install PyYAML for the lock resolver
        run: python3 -m pip install --quiet --disable-pip-version-check pyyaml

      # ── 1. Resolve the build ref FROM THE LOCK ─────────────────────────
      # Exit 78 means the lock is fine but the upstream access grant is missing. That is a
      # deliberate stop with a named cause, so the log says what to obtain rather than
      # leaving somebody to guess at a checkout failure.
      - name: Resolve pinned revision from the release lock
        run: |
          set -euo pipefail
          set +e
          OUT=$(python3 modules/domain-apps/superplane/releases/resolve_lock.py "${LOCK_IMAGE}")
          RC=$?
          set -e
          echo "$OUT"
          if [ "$RC" -eq 78 ]; then
            {
              echo "### Superplane Platform Monitor build — blocked"
              echo ""
              echo "The upstream source-access mechanism is unresolved, so there is no"
              echo "authorized way to obtain the pinned revision. This is a missing access"
              echo "grant, not a build failure. See \`source_access\` in"
              echo "\`modules/domain-apps/superplane/releases/superplane.lock.yaml\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          [ "$RC" -eq 0 ] || exit "$RC"
          echo "$OUT" >> "$GITHUB_ENV"

      - name: Load deployment config
        uses: ./.github/actions/load-deploy-config

      - name: Install zip + AWS CLI
        run: |
          set -e
          if ! command -v zip >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends zip unzip curl
          fi
          if ! command -v aws >/dev/null 2>&1; then
            curl -sL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscli.zip
            unzip -q /tmp/awscli.zip -d /tmp
            sudo /tmp/aws/install
            rm -rf /tmp/awscli.zip /tmp/aws
          fi
          aws --version

      # ── 2. Obtain the pinned upstream source ───────────────────────────
      # Intentionally the only place that acquires source, and intentionally not written
      # yet: the mechanism is unresolved, so writing one would be choosing an access grant
      # this story does not get to choose. Unreachable today (the resolve step stops first).
      - name: Fetch pinned upstream source
        run: |
          set -euo pipefail
          echo "::error::No authorized mechanism to fetch ${UPSTREAM_REPOSITORY} at ${UPSTREAM_REVISION}."
          echo "Record the granted mechanism in source_access and implement verified acquisition here."
          echo "Stage the verified revision under modules/domain-apps/superplane/releases/source/,"
          echo "with .superplane-revision recording the verified full commit before packaging."
          exit 1

      # ── 3. Ensure CodeBuild project exists ─────────────────────────────
      - name: Ensure CodeBuild project
        run: |
          set -euo pipefail
          CB_ROLE_NAME="adp-${ENVIRONMENT}-codebuild-role"
          SERVICE_ROLE_ARN=$(aws iam get-role \
            --role-name "$CB_ROLE_NAME" \
            --query 'Role.Arn' --output text 2>/dev/null || echo "")
          if [ -z "$SERVICE_ROLE_ARN" ]; then
            echo "${CB_ROLE_NAME} missing — a separately approved build-role setup is required; this domain lane does not deploy platform infrastructure." >&2
            exit 1
          fi

          SOURCE_LOC="${STATE_BUCKET}/codebuild/adp-source.zip"
          EXISTS=$(aws codebuild batch-get-projects \
            --names "${CODEBUILD_PROJECT}" \
            --region "${AWS_REGION}" \
            --query 'projects | length(@)' --output text 2>/dev/null || echo "0")

          CMD="create-project"
          [ "$EXISTS" -gt 0 ] && CMD="update-project"

          aws codebuild $CMD --region "${AWS_REGION}" \
            --name "${CODEBUILD_PROJECT}" \
            --source "{\"type\":\"S3\",\"location\":\"$SOURCE_LOC\",\"buildspec\":\"modules/domain-apps/superplane/releases/buildspecs/monitor.yml\"}" \
            --artifacts '{"type":"NO_ARTIFACTS"}' \
            --environment '{
              "type":"LINUX_CONTAINER",
              "image":"aws/codebuild/amazonlinux2-x86_64-standard:5.0",
              "computeType":"BUILD_GENERAL1_MEDIUM",
              "privilegedMode":true
            }' \
            --service-role "$SERVICE_ROLE_ARN" > /dev/null

      # ── 4. Build via CodeBuild ─────────────────────────────────────────
      # IMAGE_TAG is the pinned upstream revision, not github.sha: the tag should identify
      # what was built, and github.sha identifies the ADP commit that triggered it.
      - name: Build image via CodeBuild
        id: build
        uses: ./.github/actions/codebuild-run
        with:
          project_name: ${{ env.CODEBUILD_PROJECT }}
          region: ${{ env.AWS_REGION }}
          state_bucket: ${{ env.STATE_BUCKET }}
          environment_variables: >-
            "name=AWS_REGION,value=${{ env.AWS_REGION }}"
            "name=ENVIRONMENT,value=${{ env.ENVIRONMENT }}"
            "name=ACCOUNT_ID,value=${{ env.ACCOUNT_ID }}"
            "name=REGISTRY,value=${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
            "name=ECR_REPO,value=${{ env.ECR_REPO }}"
            "name=UPSTREAM_REVISION,value=${{ env.UPSTREAM_REVISION }}"
            "name=UPSTREAM_PATH,value=${{ env.UPSTREAM_PATH }}"
            "name=IMAGE_TAG,value=${{ env.UPSTREAM_REVISION }}"

      # ── 5. Report the digest that was actually produced ────────────────
      # The digest is read back from ECR rather than assumed, so the value that reaches the
      # lock is the registry's own answer. Moving it into `images` (and removing the
      # `pending_images` entry) is a reviewed commit, not an automated push: the lock is a
      # human-auditable record of what we chose to run.
      - name: Report produced digest
        run: |
          set -euo pipefail
          DIGEST=$(aws ecr describe-images \
            --repository-name "${ECR_REPO}" \
            --image-ids "imageTag=${UPSTREAM_REVISION}" \
            --region "${AWS_REGION}" \
            --query 'imageDetails[0].imageDigest' --output text)
          {
            echo "### Superplane Platform Monitor build"
            echo ""
            echo "- **Upstream revision**: \`${UPSTREAM_REVISION}\`"
            echo "- **ECR repository**: \`${ECR_REPO}\`"
            echo "- **Digest**: \`${DIGEST}\`"
            echo ""
            echo "Update \`images.${LOCK_IMAGE}\` in the release lock to this digest and"
            echo "remove its \`pending_images\` entry, in a reviewed commit."
          } >> "$GITHUB_STEP_SUMMARY"
