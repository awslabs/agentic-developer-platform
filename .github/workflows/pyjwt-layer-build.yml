name: PyJWT Layer Build

# Builds the PyJWT Lambda layer via CodeBuild and uploads to S3.
# Gateway Infra Terraform references the artifact at:
#   s3://adp-terraform-state-<ACCOUNT_ID>/lambda-layers/pyjwt-py313.zip

on:
  push:
    paths:
      - 'modules/gateway/lambda/layers/pyjwt/**'
      - 'codebuild/bs-pyjwt-layer.yml'
      - '.github/workflows/pyjwt-layer-build.yml'
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: dev
  CODEBUILD_PROJECT: adp-dev-pyjwt-layer

jobs:
  build:
    name: Build PyJWT Lambda Layer
    if: github.ref == 'refs/heads/main'
    runs-on: arc-runner-org
    environment: adp-build-dev
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Verify source belongs to reviewed main history
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$GITHUB_SHA"
          git merge-base --is-ancestor HEAD FETCH_HEAD

      - name: Establish trusted build identity
        uses: ./.github/actions/trusted-build
        with:
          role_arn: ${{ vars.ADP_BUILD_ROLE_ARN }}
          region: ${{ vars.ADP_DEPLOY_REGION || 'us-east-1' }}

      - name: Load deployment config
        uses: ./.github/actions/load-deploy-config

      - name: Install zip + AWS CLI (bootstrap)
        run: |
          set -euo pipefail
          for tool in aws terraform kubectl helm jq zip unzip curl git python3 node npm; do
            command -v "$tool" >/dev/null || { echo "::error::Reviewed runner image is missing $tool"; exit 1; }
          done
      - name: Verify Terraform-managed CodeBuild project
        run: |
          set -euo pipefail
          EXISTS=$(aws codebuild batch-get-projects \
            --names "${CODEBUILD_PROJECT}" \
            --region "${AWS_REGION}" \
            --query 'projects | length(@)' --output text 2>/dev/null || echo "0")
          if [ "$EXISTS" -ne 1 ]; then
            echo "::error::${CODEBUILD_PROJECT} is missing — apply platform/infra before running this build lane."
            exit 1
          fi
      - name: Build layer via CodeBuild
        id: build
        uses: ./.github/actions/codebuild-run
        with:
          project_name: ${{ env.CODEBUILD_PROJECT }}
          region: ${{ env.AWS_REGION }}
          state_bucket: ${{ env.STATE_BUCKET }}
          environment_variables: >-
            "name=AWS_REGION,value=${{ env.AWS_REGION }}"
            "name=ACCOUNT_ID,value=${{ env.ACCOUNT_ID }}"
            "name=STATE_BUCKET,value=${{ env.STATE_BUCKET }}"

      - name: Verify artifact exists
        run: |
          aws s3 ls "s3://${STATE_BUCKET}/lambda-layers/pyjwt-py313.zip" --region "${AWS_REGION}"

      - name: Summary
        run: |
          echo "## PyJWT Lambda Layer Built" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Artifact**: s3://${STATE_BUCKET}/lambda-layers/pyjwt-py313.zip" >> "$GITHUB_STEP_SUMMARY"
          echo "- **CodeBuild**: ${{ steps.build.outputs.build_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Gateway Infra Apply can now reference this layer from S3." >> "$GITHUB_STEP_SUMMARY"
