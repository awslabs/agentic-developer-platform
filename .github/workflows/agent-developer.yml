name: "@agent-developer - Developer"

# Developer agent handles:
# - Code implementation
# - Unit tests
# - PRs

on:
  issues:
    types: [labeled]
  # Enable reusable workflow calls from other repos
  workflow_call:
    inputs:
      issue_number:
        description: 'Issue number to work on'
        required: true
        type: number
      repo_owner:
        description: 'Repository owner'
        required: true
        type: string
      repo_name:
        description: 'Repository name'
        required: true
        type: string
      target_repo:
        description: 'Full target repo (owner/name) to checkout and work on'
        required: true
        type: string

concurrency:
  group: agent-developer-${{ inputs.issue_number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  work:
    if: github.event_name == 'workflow_call' || github.event.label.name == 'agent-developer'
    runs-on: arc-runner-agent
    permissions:
      contents: write
      issues: write
      pull-requests: write

    env:
      # Gateway-first opt-in rollout; actual policy remains report_only.
      ADP_ARC_MODEL_POLICY_ENABLED: ${{ vars.ADP_ARC_MODEL_POLICY_ENABLED || 'false' }}
      ADP_AGENT_CONTROL_ENDPOINT: ${{ vars.ADP_ARC_MODEL_CONTROL_ENDPOINT }}
      AGENT_TYPE: developer
      ISSUE_NUMBER: ${{ inputs.issue_number || github.event.issue.number }}
      REPO_OWNER: ${{ inputs.repo_owner || github.repository_owner }}
      REPO_NAME: ${{ inputs.repo_name || github.event.repository.name }}
      TARGET_REPO: ${{ inputs.target_repo || github.repository }}

    steps:
      - name: Install AWS CLI
        run: |
          if ! command -v aws &>/dev/null; then
            curl -s "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
            unzip -q /tmp/awscliv2.zip -d /tmp && sudo /tmp/aws/install
          fi

      - name: Verify dedicated developer identity
        env:
          EXPECTED_AGENT_ROLE_ARN: ${{ vars.ADP_AGENT_WORKFLOW_ROLE_ARN }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_AGENT_ROLE_ARN" =~ ^arn:aws:iam::([0-9]{12}):role/([A-Za-z0-9+=,.@_-]+-agent-workflow)$ ]] || {
            echo "::error::Configure the verified dedicated agent-workflow role ARN"
            exit 1
          }
          expected_account="${BASH_REMATCH[1]}"
          expected_role="${BASH_REMATCH[2]}"
          actual_arn=$(aws sts get-caller-identity --query Arn --output text)
          case "$actual_arn" in
            "arn:aws:sts::${expected_account}:assumed-role/${expected_role}/"*) ;;
            *) echo "::error::Developer workflow is not using its dedicated identity"; exit 1 ;;
          esac

      - name: Get App Credentials from AWS Secrets Manager
        id: aws-secrets
        run: |
          SECRET_PREFIX="${{ vars.SECRET_PREFIX || 'adp/aws-e' }}"
          AWS_REGION="${{ vars.AWS_REGION || 'us-east-1' }}"
          echo "Fetching GitHub App credentials from AWS Secrets Manager..."
          GH_APP_ID=$(aws secretsmanager get-secret-value --secret-id "${SECRET_PREFIX}/gh-app-dev-id" --query SecretString --output text --region "$AWS_REGION")
          GH_APP_KEY=$(aws secretsmanager get-secret-value --secret-id "${SECRET_PREFIX}/gh-app-dev-key" --query SecretString --output text --region "$AWS_REGION")
          echo "::add-mask::$GH_APP_KEY"
          echo "app_id=$GH_APP_ID" >> $GITHUB_OUTPUT
          echo "app_key<<EOF" >> $GITHUB_OUTPUT
          echo "$GH_APP_KEY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          # Using dedicated DEV app for separate rate limits (5000 req/hr)
          # --- Previous GitHub Secrets approach (commented for reference) ---
          # app-id: ${{ secrets.GH_APP_DEV_ID }}
          # private-key: ${{ secrets.GH_APP_DEV_PRIVATE_KEY }}
          # Fallback to shared app if DEV app has issues:
          # app-id: ${{ vars.GH_APP_ID }}
          # private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          # --- Now using AWS Secrets Manager ---
          app-id: ${{ steps.aws-secrets.outputs.app_id }}
          private-key: ${{ steps.aws-secrets.outputs.app_key }}
          owner: ${{ env.REPO_OWNER }}

      - name: Remove trigger label
        if: github.event_name != 'workflow_call'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          curl -s -X DELETE \
            -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/issues/$ISSUE_NUMBER/labels/agent-developer" || true

      - name: Checkout agent code (adp)
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.AGENT_SOURCE_REPO || 'aws-e/adp' }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
          path: adp-agent

      - name: Checkout target repository
        uses: actions/checkout@v7
        with:
          repository: ${{ env.TARGET_REPO }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
          path: workspace

      - name: Configure Git for GitHub App
        env:
          # --- Previous GitHub Secrets approach (commented for reference) ---
          # GH_APP_ID: ${{ secrets.GH_APP_DEV_ID }}
          # Fallback: GH_APP_ID: ${{ vars.GH_APP_ID }}
          # --- Now using AWS Secrets Manager ---
          GH_APP_ID: ${{ steps.aws-secrets.outputs.app_id }}
        run: |
          git config --global user.email "${GH_APP_ID}+adp-agent[bot]@users.noreply.github.com"
          git config --global user.name "adp-agent[bot]"

      - name: Install tools
        run: |
          if ! command -v gh &>/dev/null; then
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt-get update -qq && sudo apt-get install -y -qq gh
          fi
          # AWS CLI for infrastructure tasks
          if ! command -v aws &>/dev/null; then
            curl -s "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
            unzip -q /tmp/awscliv2.zip -d /tmp && sudo /tmp/aws/install
          fi

      - name: Update board status to In Progress
        uses: ./adp-agent/modules/agent-factory/actions/update-board-status
        with:
          token: ${{ steps.app-token.outputs.token }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          status: 'In Progress'
          workflow-run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          owner: ${{ env.REPO_OWNER }}
          repo: ${{ env.REPO_NAME }}

      - name: Post start comment
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ env.TARGET_REPO }}
        run: |
          gh issue comment $ISSUE_NUMBER -R "$GH_REPO" --body "## @agent-developer Started

          **Status**: In Progress
          **Started**: $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          **Logs**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Implementing code..."

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: adp-agent/modules/agent-factory/agent/package-lock.json

      - name: Install dependencies
        working-directory: ./adp-agent/modules/agent-factory/agent
        run: npm ci

      - name: Build agent
        working-directory: ./adp-agent/modules/agent-factory/agent
        run: npm run build

      - name: Verify gateway model authority before the harness
        if: vars.ADP_ARC_MODEL_POLICY_ENABLED == 'true'
        working-directory: ./adp-agent/modules/agent-factory/agent
        run: npx ts-node src/arc-model-preflight.ts

      - name: Prepare private GitHub runtime directory
        env:
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          auth_dir=$(mktemp -d "$RUNNER_TEMP_DIR/adp-github.XXXXXXXX")
          chmod 700 "$auth_dir"
          echo "ADP_GITHUB_AUTH_DIR=$auth_dir" >> "$GITHUB_ENV"
          echo "ADP_TOKEN_FILE=$auth_dir/token" >> "$GITHUB_ENV"

      - name: Run @agent-developer
        id: agent
        working-directory: ./adp-agent/modules/agent-factory/agent
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_APP_ID: ${{ steps.aws-secrets.outputs.app_id }}
          GH_APP_PRIVATE_KEY: ${{ steps.aws-secrets.outputs.app_key }}
          GH_APP_INSTALLATION_ID: ${{ steps.app-token.outputs.installation-id }}
          ADP_REQUIRE_RENEWABLE_GITHUB: 'true'
          ADP_AGENT_SOURCE_DIR: ${{ github.workspace }}/adp-agent
          ISSUE_NUMBER: ${{ env.ISSUE_NUMBER }}
          REPO_OWNER: ${{ env.REPO_OWNER }}
          REPO_NAME: ${{ env.REPO_NAME }}
          WORK_DIR: ${{ github.workspace }}/workspace
          AGENT_TYPE: developer
          CLAUDE_CODE_USE_BEDROCK: "1"
          ANTHROPIC_MODEL: "global.anthropic.claude-opus-4-6-v1"
          # GitHub issue workflows use repository-scoped GitHub tracking.
          BEADS_ENABLED: 'false'
        run: npx ts-node src/agent-worker.ts

      # The worker's timer has stopped; never reuse its bootstrap token here.
      - name: Generate fresh finalization token
        id: final-token
        if: always() && steps.app-token.outcome == 'success'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ steps.aws-secrets.outputs.app_id }}
          private-key: ${{ steps.aws-secrets.outputs.app_key }}
          owner: ${{ env.REPO_OWNER }}
          repositories: ${{ env.REPO_NAME }}

      - name: Commit and push changes
        id: commit
        if: success() && steps.final-token.outcome == 'success'
        working-directory: ./workspace
        env:
          GH_TOKEN: ${{ steps.final-token.outputs.token }}
          GH_REPO: ${{ env.TARGET_REPO }}
          ADP_GITHUB_FINALIZATION: 'true'
          AUTH_HELPER: ${{ github.workspace }}/adp-agent/modules/agent-factory/agent/scripts/github-auth/git-credential
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "feat: Implementation for issue #$ISSUE_NUMBER

            Generated by @agent-developer

            Co-Authored-By: adp-agent[bot] <${{ steps.aws-secrets.outputs.app_id }}+adp-agent[bot]@users.noreply.github.com>"

            # Create PR branch and push
            BRANCH_NAME="agent/issue-$ISSUE_NUMBER"
            git checkout -b "$BRANCH_NAME" 2>/dev/null || git checkout "$BRANCH_NAME"
            git -c credential.helper= -c "credential.https://github.com.helper=!'$AUTH_HELPER'" \
              -c credential.useHttpPath=true -c http.extraheader= -c http.https://github.com/.extraheader= \
              push -u origin "$BRANCH_NAME" --force

            # Create PR if it doesn't exist on this branch
            echo "Changes committed and pushed (fallback)"
            echo "pr_created=true" >> $GITHUB_OUTPUT
          else
            echo "No changes to commit"
            echo "pr_created=false" >> $GITHUB_OUTPUT
          fi

      - name: Notify completion
        if: always() && steps.agent.outcome == 'success' && steps.commit.outcome == 'success' && steps.final-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.final-token.outputs.token }}
          GH_REPO: ${{ env.TARGET_REPO }}
        run: |
          gh issue comment $ISSUE_NUMBER -R "$GH_REPO" --body "## @agent-developer Complete

          **Completed**: $(date -u +"%Y-%m-%dT%H:%M:%SZ")

          Work complete. PR will trigger reviewer, and merging will close the issue."

      # NOTE: Status stays "In Progress" - will become "Done" when PR is merged
      # and GitHub auto-closes the issue (via "Closes #NNN" in PR body)

      - name: Handle failure
        if: failure() && steps.final-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.final-token.outputs.token }}
          GH_REPO: ${{ env.TARGET_REPO }}
        run: |
          gh issue comment $ISSUE_NUMBER -R "$GH_REPO" --body "## @agent-developer Failed

          Check [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          gh issue edit $ISSUE_NUMBER -R "$GH_REPO" --add-label "agent-failed"

      - name: Remove runtime GitHub credentials
        if: always()
        run: |
          if [ -n "${ADP_GITHUB_AUTH_DIR:-}" ]; then
            rm -rf -- "$ADP_GITHUB_AUTH_DIR"
          fi
