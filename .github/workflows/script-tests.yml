      - 'platform/infra/main.tf'
      - 'platform/infra/modules/bedrock-invocation-logging/main.tf'
      - '.github/scripts/tests/test_platform_provider_constraint.py'
      # The mixed-age state reproduction (#5831). The floor above was necessary
