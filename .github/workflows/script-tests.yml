concurrency:
  group: script-tests-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  script-tests:
    name: Script Tests
    runs-on: arc-runner-org
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        # PyYAML: the securityagent preflight suite (#4443) parses the nightly
        # workflow to assert it carries no `schedule:` key. Without the
        # dependency those gates importorskip and the check goes green
        # having asserted nothing.
        #
        # detect-secrets: same reasoning (S19, #5618). Two gates in
        # test_security_scan_tool_invocations.py shell out to the real
        # `detect-secrets` binary -- one runs `audit --report` against the
        # committed baseline (it crashed on every run before this fix), the other
        # plants a live AWS key and asserts the workflow's command shape actually
        # surfaces it. Both skipif when the binary is absent, so without this
        # dependency the detect-secrets gate passes having asserted nothing.
        # Pinned to the version security-scan.yml installs.
        run: pip install pytest pytest-timeout pyyaml detect-secrets==1.5.0

      # Test files are pinned explicitly rather than globbed: a glob silently
      # stops covering a file that is moved or renamed, which is the same
      # silent-coverage-loss this workflow exists to prevent.
      - name: Run script tests
        working-directory: .github/scripts
        run: |
          pytest \
            tests/test_diff_security_findings.py \
            tests/test_complete_secret_identities.py \
            tests/test_discover_dockerfiles.py \
            tests/test_post_security_pr_comment.py \
            tests/test_security_agent_profile.py \
            tests/test_security_agent_ledger.py \
            tests/test_render_security_report.py \
            tests/test_umbrella_epic_idempotency.py \
            tests/test_securityagent_preflight.py \
            tests/test_code_review_request.py \
            tests/test_assert_findings_bucket_private.py \
            tests/test_security_agent_dedup.py \
            tests/test_triage_grouping.py \
            tests/test_author_grouping_plan.py \
            tests/test_security_traceability.py \
            tests/test_processed_runs.py \
            tests/test_join_barrier.py \
            tests/test_ops_dispatch_bounds.py \
            tests/test_nightly_triage_wiring.py \
            tests/test_report_finalization.py \
            tests/test_verify_scoped_plan.py \
            tests/test_gateway_infra_reviewed_source.py \
            tests/test_platform_provider_constraint.py \
            tests/test_refresh_only_migration_guard.py \
            tests/test_security_scan_tool_invocations.py \
            -v --tb=short --timeout=60

      # The mixed-age state reproduction (#5831) runs separately from the pinned
      # suite above for two reasons, both of which would otherwise make it
      # decorative:
      #
      # 1. It needs a real `terraform` binary. Its Terraform-dependent legs skip
      #    when one is absent, so without the setup step below this gate would
      #    report green having asserted only the fixture's shape -- the exact
      #    silent-coverage-loss this workflow exists to prevent. Terraform is set
      #    up immediately before it rather than at job top so the dependency is
      #    visible at the point of use.
      # 2. Its legs run `init` (which downloads a provider) and six plan+export
      #    cycles, so they exceed the 60s per-test timeout the pinned run uses.
      #    Raising that run's timeout to suit one suite would weaken the bound on
      #    twenty others; a separate step keeps 60s meaningful there.
      # 3. Two of those legs drive platform/scripts/refresh_only_migration_guard.py
      #    against plans Terraform really wrote. The guard's own suite in the pinned
      #    run stubs `terraform show`, so only here is it shown to work on real
      #    Terraform output -- which is why the guard's path is a trigger for this
      #    step too, not just for the pinned one.
      #
      # No AWS access: the suite strips every AWS_*/BOTO_* variable and disables
      # IMDS, so the self-hosted pool's ambient identity cannot satisfy its plans.
      # Pinned to the Terraform version the platform workflows use.
      - name: Setup Terraform for the mixed-state reproduction
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.14.6'
          terraform_wrapper: false

      - name: Run platform mixed-age state reproduction
        working-directory: .github/scripts
        run: |
          pytest \
            tests/test_platform_mixed_state_export.py \
            -v --tb=short --timeout=300

      # The container-scan inventory/coverage suite lives beside its subject in
      # codebuild/, not under .github/scripts/tests/, so the pinned run above
      # cannot reach it. No other workflow executes it either: without this step
      # the S19 (#5618) coverage gate -- "every expected image must produce a
      # real result" -- is asserted by tests that never run.
      - name: Run container scan inventory tests
        working-directory: ${{ github.workspace }}
        run: |
          pytest \
            codebuild/tests/test_security_image_scan.py \
            -v --tb=short --timeout=60
