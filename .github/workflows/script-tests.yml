      - 'modules/agent-factory/rules/personas/architect.md'
      # Artifact the ops dispatch suite asserts against (#4450). The rule's
      # InputTransformer pins persona, service_identity and the target repo as
      # literals, and the suite asserts both that they are literals and that
      # they follow the caller-supplied values. Listed so an edit re-runs the
