      - '.github/workflows/platform-infra-apply.yml'
      # Exact reviewed-source admission and its sole automatic caller.
      - '.github/workflows/gateway-infra-apply.yml'
      - '.github/workflows/gateway-deploy.yml'
      - 'platform/infra/modules/eks/main.tf'
      # The AWS provider floor the constraint guard asserts against (#5831).
