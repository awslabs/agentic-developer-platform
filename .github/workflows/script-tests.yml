      - 'modules/agent-factory/webhook-ingress/infra/eventbridge.tf'
      # Artifacts the profile suite asserts against
      - '.github/security/security-agent-profile.json'
      - '.github/security/security-agent-profile.schema.json'
      # The workflow the scoped-plan guard suite asserts against (#5006). The
      # suite asserts by content that the scope input is a `type: choice`, that
