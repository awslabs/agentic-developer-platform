name: Agent Gateway Deploy

on:
  push:
    paths:
      - 'modules/agent-factory/gateway/**'
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: dev
  NAMESPACE: adp-gateway-agents
  EKS_CLUSTER: adp-dev-eks-cluster
  ACCOUNT_ID: "879318057152"
  STATE_BUCKET: adp-terraform-state-879318057152

jobs:
  build-and-deploy:
    name: Build Worker Image and Update ScaledJob
    runs-on: arc-runner-org
    # Runner already has AWS creds via IRSA (adp-dev-agent-runner-role)

    steps:
      - uses: actions/checkout@v4

      - name: Package source and upload to S3
        run: |
          bash platform/scripts/zip-source.sh . /tmp/adp-source.zip
          aws s3 cp /tmp/adp-source.zip "s3://${{ env.STATE_BUCKET }}/codebuild/adp-source.zip"
          rm -f /tmp/adp-source.zip

      - name: Build worker image via CodeBuild
        run: |
          REGISTRY="${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          BUILD_ID=$(aws codebuild start-build \
            --project-name adp-${{ env.ENVIRONMENT }}-agent-gateway \
            --environment-variables-override \
              "name=AWS_REGION,value=${{ env.AWS_REGION }}" \
              "name=ENVIRONMENT,value=${{ env.ENVIRONMENT }}" \
              "name=ACCOUNT_ID,value=${{ env.ACCOUNT_ID }}" \
              "name=REGISTRY,value=${REGISTRY}" \
              "name=STATE_BUCKET,value=${{ env.STATE_BUCKET }}" \
              "name=EKS_CLUSTER,value=${{ env.EKS_CLUSTER }}" \
              "name=IMAGE_TAG,value=${{ github.sha }}" \
            --query 'build.id' --output text)
          echo "Started build: $BUILD_ID"

          while true; do
            STATUS=$(aws codebuild batch-get-builds --ids "$BUILD_ID" \
              --query 'builds[0].buildStatus' --output text)
            case $STATUS in
              SUCCEEDED) echo "Build succeeded"; break ;;
              FAILED|FAULT|STOPPED|TIMED_OUT)
                LOG_LINK=$(aws codebuild batch-get-builds --ids "$BUILD_ID" \
                  --query 'builds[0].logs.deepLink' --output text)
                echo "Build failed ($STATUS). Logs: $LOG_LINK"
                exit 1
                ;;
              *) sleep 10 ;;
            esac
          done

          echo "IMAGE_TAG=${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Update ScaledJob manifest with new image tag
        run: |
          REGISTRY="${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          AGENT_IMAGE="${REGISTRY}/adp-agent-gateway:${{ github.sha }}"

          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

          # Read current Terraform outputs for queue URLs and session table
          cd modules/agent-factory/infra
          terraform init \
            -backend-config="../../../environments/${{ env.ENVIRONMENT }}/modules/agent-factory-backend.tfvars" \
            -input=false -reconfigure 2>/dev/null || true
          INPUT_QUEUE_URL=$(terraform output -raw gateway_input_queue_url 2>/dev/null || echo "PENDING")
          RESPONSE_QUEUE_URL=$(terraform output -raw gateway_response_queue_url 2>/dev/null || echo "PENDING")
          SESSIONS_TABLE=$(terraform output -raw gateway_sessions_table 2>/dev/null || echo "PENDING")
          cd ..

          # Apply the ScaledJob manifest with substituted values
          sed -e "s|REPLACE_WITH_INPUT_QUEUE_URL|${INPUT_QUEUE_URL}|g" \
              -e "s|REPLACE_WITH_RESPONSE_QUEUE_URL|${RESPONSE_QUEUE_URL}|g" \
              -e "s|REPLACE_WITH_SESSIONS_TABLE_NAME|${SESSIONS_TABLE}|g" \
              -e "s|REPLACE_WITH_AGENT_IMAGE|${AGENT_IMAGE}|g" \
              gateway/k8s/keda-scaledjob.yaml | kubectl apply -f -

          echo "ScaledJob updated to use image: ${AGENT_IMAGE}"
