name: GitLab Infra Apply
run-name: ADP deployment ${{ inputs.adp_correlation }}

on:
  # Manual-only trigger. Merging a PR does NOT auto-apply infra; operator
  # reviews the plan comment on the merged PR, then triggers this workflow
  # explicitly via Actions -> GitLab Infra Apply -> Run workflow.
  workflow_dispatch:
    inputs:
      region:
        description: 'Reviewed AWS region; must match the protected deployment configuration'
        required: true
        type: string
      account_id:
        description: 'Target AWS account (12 digits). Empty = use platform IRSA / config file.'
        required: false
        default: ''
      customer_account_id:
        description: 'Customer-linked AWS account to deploy into (cross-account mode).'
        required: false
        default: ''
      customer_aws_label:
        description: 'Vaulted credential label.'
        required: false
        default: ''
      customer_user_id:
        description: 'ADP users.id UUID.'
        required: false
        default: ''
      environment:
        description: 'Deployment environment.'
        required: false
        default: 'dev'
      adp_correlation:
        description: 'Accepted operational release correlation'
        required: true
      adp_source_revision:
        description: 'Accepted immutable source revision'
        required: true
      adp_definition_revision:
        description: 'Accepted workflow definition revision'
        required: true
      adp_contract_digest:
        description: 'Accepted delivery contract digest'
        required: true

concurrency:
  group: tf-apply-gitlab-${{ inputs.customer_account_id || inputs.account_id || 'default' }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ inputs.region }}
  MODULE_NAME: gitlab
  ADP_DEPLOYMENT_EVIDENCE_STORE: s3-oidc-v1
  ADP_DELIVERY_EVIDENCE_STORE: s3-oidc-v1
  ADP_SOURCE_REVISION: ${{ inputs.adp_source_revision }}

jobs:
  apply:
    name: Terraform Apply
    if: github.ref == 'refs/heads/main'
    runs-on: arc-runner-org
    environment: adp-gitlab-deploy-${{ inputs.environment || 'dev' }}
    permissions:
      id-token: write
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.adp_source_revision }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source belongs to reviewed main history
        id: source
        shell: bash
        env:
          ACCEPTED_REVISION: ${{ inputs.adp_source_revision }}
          ACCEPTED_DEFINITION: ${{ inputs.adp_definition_revision }}
          WORKFLOW_REVISION: ${{ github.workflow_sha }}
          ACCEPTED_DIGEST: ${{ inputs.adp_contract_digest }}
          REQUESTED_REGION: ${{ inputs.region }}
          PROTECTED_REGION: ${{ vars.ADP_DEPLOY_REGION }}
          PROTECTED_DIGEST: ${{ vars.GITLAB_INFRA_DELIVERY_CONTRACT_DIGEST }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_REGION" =~ ^[a-z]{2}(-[a-z]+)+-[0-9]+$ ]]
          test "$REQUESTED_REGION" = "$PROTECTED_REGION"
          [[ "$ACCEPTED_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$ACCEPTED_REVISION"
          [[ "$ACCEPTED_DEFINITION" =~ ^[0-9a-f]{40}$ ]]
          test "$WORKFLOW_REVISION" = "$ACCEPTED_DEFINITION"
          [[ "$ACCEPTED_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          test "$ACCEPTED_DIGEST" = "$PROTECTED_DIGEST"
          git merge-base --is-ancestor "$ACCEPTED_REVISION" refs/remotes/origin/main

      - name: Establish trusted deployment identity
        id: identity
        uses: ./.github/actions/trusted-deployment
        with:
          role_arn: ${{ vars.ADP_DEPLOY_ROLE_ARN }}
          region: ${{ vars.ADP_DEPLOY_REGION || 'us-east-1' }}

      - name: Load deployment config
        id: config
        uses: ./.github/actions/load-deploy-config
        with:
          account_id: ${{ inputs.account_id }}
          region: ${{ inputs.region }}
          environment: ${{ inputs.environment }}
          customer_account_id: ${{ inputs.customer_account_id }}
          customer_aws_label: ${{ inputs.customer_aws_label }}
          customer_user_id: ${{ inputs.customer_user_id }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.14.6'
          terraform_wrapper: false

      - name: Install required CLI tools
        id: tools
        run: |
          set -euo pipefail
          for tool in aws terraform git python3 openssl; do
            command -v "$tool" >/dev/null || { echo "::error::Reviewed runner image is missing $tool"; exit 1; }
          done
          python3 -m venv "$RUNNER_TEMP/gitlab-registration-venv"
          "$RUNNER_TEMP/gitlab-registration-venv/bin/pip" install --quiet ./modules/gateway boto3 httpx cryptography
          echo "$RUNNER_TEMP/gitlab-registration-venv/bin" >> "$GITHUB_PATH"

      - name: Publish authenticated deployment context
        env:
          ADP_DELIVERY_CONTRACT_JSON: ${{ vars.GITLAB_INFRA_DELIVERY_CONTRACT_JSON }}
          ADP_CONTRACT_DIGEST: ${{ inputs.adp_contract_digest }}
          ADP_CORRELATION: ${{ inputs.adp_correlation }}
          ADP_DEFINITION_REVISION: ${{ inputs.adp_definition_revision }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          ADP_WORKFLOW_REVISION: ${{ github.workflow_sha }}
          ADP_DELIVERY_WORKFLOW: gitlab-infra-apply.yml
          ADP_DELIVERY_ACCOUNT_ID: ${{ steps.config.outputs.account_id }}
          ADP_DELIVERY_RESOURCE_KIND: ${{ vars.GITLAB_INFRA_DELIVERY_RESOURCE_KIND }}
          ADP_DELIVERY_RESOURCE_ID: ${{ vars.GITLAB_INFRA_DELIVERY_RESOURCE_ID }}
          ADP_DELIVERY_INPUTS_JSON: ${{ toJSON(inputs) }}
        run: |
          set -euo pipefail
          python3 modules/source-control/gitlab/scripts/delivery_evidence.py --context
          python3 modules/gateway/scripts/publish-deployment-evidence.py context gitlab-infra-apply.yml "$RUNNER_TEMP/gitlab-delivery/deployment-context.json"

      - name: Load the private reviewed registration plan
        id: plan
        env:
          ADP_REGISTRATION_CONFIG_JSON: ${{ vars.GITLAB_REGISTRATION_CONFIG_JSON }}
          ADP_DEPLOY_ROLE_ARN: ${{ vars.ADP_DEPLOY_ROLE_ARN }}
          ADP_CORRELATION: ${{ inputs.adp_correlation }}
        run: python3 modules/source-control/gitlab/scripts/registration_workflow.py prepare

      - name: Verify exact saved plan and instance authority
        id: safety
        env:
          ADP_REGISTRATION_CONFIG_JSON: ${{ vars.GITLAB_REGISTRATION_CONFIG_JSON }}
          ADP_DEPLOY_ROLE_ARN: ${{ vars.ADP_DEPLOY_ROLE_ARN }}
          ADP_CORRELATION: ${{ inputs.adp_correlation }}
        run: python3 modules/source-control/gitlab/scripts/registration_workflow.py guard

      - name: Apply reviewed plan and verify ordinary zero-change replan
        id: apply
        env:
          ADP_REGISTRATION_CONFIG_JSON: ${{ vars.GITLAB_REGISTRATION_CONFIG_JSON }}
          ADP_DEPLOY_ROLE_ARN: ${{ vars.ADP_DEPLOY_ROLE_ARN }}
          ADP_CORRELATION: ${{ inputs.adp_correlation }}
        run: python3 modules/source-control/gitlab/scripts/registration_workflow.py apply

      - name: Collect six live registration checks
        id: registration
        env:
          ADP_REGISTRATION_CONFIG_JSON: ${{ vars.GITLAB_REGISTRATION_CONFIG_JSON }}
          ADP_DEPLOY_ROLE_ARN: ${{ vars.ADP_DEPLOY_ROLE_ARN }}
          ADP_CORRELATION: ${{ inputs.adp_correlation }}
        run: python3 modules/source-control/gitlab/scripts/registration_workflow.py collect

      - name: Summary
        if: always()
        run: |
          echo "## Terraform Apply -- ${{ env.MODULE_NAME }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Module**: ${{ env.MODULE_NAME }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status**: ${{ steps.apply.outcome == 'success' && 'applied' || 'failed' }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish verified operational delivery
        env:
          ADP_DELIVERY_EVIDENCE_STORE: s3-oidc-v1
          ADP_DELIVERY_CONTRACT_JSON: ${{ vars.GITLAB_INFRA_DELIVERY_CONTRACT_JSON }}
          ADP_CONTRACT_DIGEST: ${{ inputs.adp_contract_digest }}
          ADP_CORRELATION: ${{ inputs.adp_correlation }}
          ADP_SOURCE_REVISION: ${{ inputs.adp_source_revision }}
          ADP_DEFINITION_REVISION: ${{ inputs.adp_definition_revision }}
          ADP_WORKFLOW_REVISION: ${{ github.workflow_sha }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          ADP_DELIVERY_WORKFLOW: gitlab-infra-apply.yml
          ADP_DELIVERY_COMPONENT: ${{ vars.GITLAB_INFRA_DELIVERY_COMPONENT }}
          ADP_DELIVERY_ACCOUNT_ID: ${{ steps.config.outputs.account_id }}
          ADP_DELIVERY_RESOURCE_KIND: ${{ vars.GITLAB_INFRA_DELIVERY_RESOURCE_KIND }}
          ADP_DELIVERY_RESOURCE_ID: ${{ vars.GITLAB_INFRA_DELIVERY_RESOURCE_ID }}
          ADP_DELIVERY_STEP_OUTCOMES: '{"source":"${{ steps.source.outcome }}","identity":"${{ steps.identity.outcome }}","config":"${{ steps.config.outcome }}","tools":"${{ steps.tools.outcome }}","plan":"${{ steps.plan.outcome }}","safety":"${{ steps.safety.outcome }}","apply":"${{ steps.apply.outcome }}"}'
        run: |
          set -euo pipefail
          python3 modules/source-control/gitlab/scripts/delivery_evidence.py
          python3 modules/gateway/scripts/publish-deployment-evidence.py delivery delivery-evidence "$RUNNER_TEMP/gitlab-delivery/delivery.json"

      - name: Remove private local registration material
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/gitlab-registration" "$RUNNER_TEMP/gitlab-registration-venv"
