name: Gateway Infra Apply

on:
  # Manual-only trigger. Merging a PR does NOT auto-apply infra; operator
  # reviews the plan comment on the merged PR, then triggers this workflow
  # explicitly via Actions → Gateway Infra Apply → Run workflow with the exact
  # reviewed main commit in reviewed_source_sha. See
  # platform-infra-apply.yml for the full rationale.
  workflow_dispatch:
    inputs:
      reviewed_source_sha:
        description: 'Required reviewed main commit (40 lowercase hex characters). Must equal this run and checkout; stale pins fail.'
        required: true
        type: string
      account_id:
        description: 'Target AWS account (12 digits). Empty = use platform IRSA / config file.'
        required: false
        default: ''
      customer_account_id:
        description: 'Customer-linked AWS account to deploy into (cross-account mode). Triggers gateway-call assume.'
        required: false
        default: ''
      customer_aws_label:
        description: 'Vaulted credential label (when customer_account_id is set).'
        required: false
        default: ''
      customer_user_id:
        description: 'ADP users.id UUID (when customer_account_id is set).'
        required: false
        default: ''
      environment:
        description: 'Deployment environment (dev/staging/prod).'
        required: false
        default: 'dev'
      confirm_destructive_apply:
        description: 'Set to "yes" to authorize an apply that destroys resources. Required when terraform plan includes any destroys.'
        required: false
        default: 'no'
      apply_targets:
        description: 'Optional. Space-separated Terraform resource addresses to scope this run to (passed as -target to plan). Empty = full plan/apply (default). Use to publish a specific resource without dragging in unrelated pending drift, e.g. "aws_ssm_parameter.redis_iam_username[0] aws_ssm_parameter.redis_cache_name[0]". WARNING (#4932): a scoped run converges ONLY these addresses. Its "Plan: N to change" counts just the targeted subset, so a green scoped run does NOT prove main''s Terraform is live for any other module — the post-apply convergence guard cannot assert convergence and will say so in the summary.'
        required: false
        default: ''

concurrency:
  group: gateway-release-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_VAR_environment: dev
  MODULE_NAME: gateway
  TF_WORKING_DIR: modules/gateway/infra
  BACKEND_CONFIG: environments/dev/modules/gateway-backend.tfvars
  VAR_FILE: environments/dev/modules/gateway.tfvars

jobs:
  apply:
    name: Terraform Apply
    if: github.ref == 'refs/heads/main'
    runs-on:
      group: adp-deployment
      labels: arc-runner-deployment
    environment: adp-deploy-${{ inputs.environment || 'dev' }}
    permissions:
      id-token: write
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify exact reviewed source before deployment
        shell: bash
        env:
          REVIEWED_SOURCE_SHA: ${{ inputs.reviewed_source_sha }}
        run: |
          set -euo pipefail
          if [[ ! "${REVIEWED_SOURCE_SHA:-}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::reviewed_source_sha is required and must be exactly 40 lowercase hexadecimal characters."
            exit 1
          fi
          if [[ "$REVIEWED_SOURCE_SHA" != "${GITHUB_SHA:-}" ]]; then
            echo "::error::Run source differs from reviewed_source_sha. Review the new main commit before dispatching again; stale pins cannot be overridden."
            exit 1
          fi
          CHECKOUT_SHA="$(git rev-parse HEAD)"
          if [[ "$REVIEWED_SOURCE_SHA" != "$CHECKOUT_SHA" ]]; then
            echo "::error::Checkout source differs from reviewed_source_sha. Refusing infra apply."
            exit 1
          fi

      - name: Establish trusted deployment identity
        uses: ./.github/actions/trusted-deployment
        with:
          role_arn: ${{ vars.ADP_DEPLOY_ROLE_ARN }}
          region: ${{ vars.ADP_DEPLOY_REGION || 'us-east-1' }}

      - name: Load deployment config
        uses: ./.github/actions/load-deploy-config
        with:
          account_id: ${{ inputs.account_id }}
          environment: ${{ inputs.environment }}
          customer_account_id: ${{ inputs.customer_account_id }}
          customer_aws_label: ${{ inputs.customer_aws_label }}
          customer_user_id: ${{ inputs.customer_user_id }}

      - name: Install required CLI tools
        run: |
          set -euo pipefail
          for tool in aws terraform kubectl helm jq zip unzip curl git python3 node npm; do
            command -v "$tool" >/dev/null || { echo "::error::Reviewed runner image is missing $tool"; exit 1; }
          done
      - name: Pre-create OAuth stub secret (idempotent)
        run: |
          SECRET_ID="adp/${{ env.TF_VAR_environment || 'dev' }}/cognito/github-oauth-credentials"
          if aws secretsmanager describe-secret --secret-id "$SECRET_ID" --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "OAuth stub secret already exists — skipping create."
          else
            echo "Creating OAuth stub secret with placeholder values."
            aws secretsmanager create-secret \
              --name "$SECRET_ID" \
              --region "$AWS_REGION" \
              --secret-string '{"client_id":"PLACEHOLDER","client_secret":"PLACEHOLDER"}' \
              --description "GitHub OAuth credentials stub (replace with real values when wiring github_auth_broker)"
          fi

      - name: Verify Terraform-managed Lambda layer CodeBuild projects
        run: |
          set -euo pipefail
          for NAME in "adp-${TF_VAR_environment:-dev}-pyjwt-layer" \
                      "adp-${TF_VAR_environment:-dev}-psycopg2-layer"; do
            EXISTS=$(aws codebuild batch-get-projects --names "$NAME" --region "$AWS_REGION" \
              --query 'projects | length(@)' --output text 2>/dev/null || echo "0")
            if [ "$EXISTS" -ne 1 ]; then
              echo "::error::$NAME is missing — apply platform/infra before running gateway infrastructure."
              exit 1
            fi
          done
      - name: Check if PyJWT layer already in S3
        id: pyjwt_check
        run: |
          if aws s3api head-object --bucket "$STATE_BUCKET" --key "lambda-layers/pyjwt-py313.zip" --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "PyJWT layer already in s3://$STATE_BUCKET/lambda-layers/pyjwt-py313.zip — skipping build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "PyJWT layer missing — will build via CodeBuild."
          fi

      - name: Build PyJWT layer via CodeBuild
        if: steps.pyjwt_check.outputs.exists == 'false'
        uses: ./.github/actions/codebuild-run
        with:
          project_name: adp-${{ env.TF_VAR_environment || 'dev' }}-pyjwt-layer
          region: ${{ env.AWS_REGION }}
          state_bucket: ${{ env.STATE_BUCKET }}
          environment_variables: >-
            "name=AWS_REGION,value=${{ env.AWS_REGION }}"
            "name=ACCOUNT_ID,value=${{ env.ACCOUNT_ID }}"
            "name=STATE_BUCKET,value=${{ env.STATE_BUCKET }}"

      - name: Check if psycopg2 layer already in S3
        id: psycopg2_check
        run: |
          if aws s3api head-object --bucket "$STATE_BUCKET" --key "lambda-layers/psycopg2-py312.zip" --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "psycopg2 layer already in s3://$STATE_BUCKET/lambda-layers/psycopg2-py312.zip — skipping build."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "psycopg2 layer missing — will build via CodeBuild."
          fi

      - name: Build psycopg2 layer via CodeBuild
        if: steps.psycopg2_check.outputs.exists == 'false'
        uses: ./.github/actions/codebuild-run
        with:
          project_name: adp-${{ env.TF_VAR_environment || 'dev' }}-psycopg2-layer
          region: ${{ env.AWS_REGION }}
          state_bucket: ${{ env.STATE_BUCKET }}
          environment_variables: >-
            "name=AWS_REGION,value=${{ env.AWS_REGION }}"
            "name=ACCOUNT_ID,value=${{ env.ACCOUNT_ID }}"
            "name=STATE_BUCKET,value=${{ env.STATE_BUCKET }}"

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="../../../${{ env.BACKEND_CONFIG }}" \
            -backend-config="bucket=${STATE_BUCKET}" \
            -input=false -reconfigure

      - name: State fixups (import drift, clean stale jobs)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -e
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          # --- Fix 1: Import Cognito domain if it exists in AWS but not in state ---
          POOL_ID=$(terraform state show 'module.cognito.aws_cognito_user_pool.main' 2>/dev/null | grep '^\s*id\s' | awk '{print $NF}' | tr -d '"' || echo "")
          if [ -n "$POOL_ID" ]; then
            DOMAIN="bedrockgw-dev-auth-${ACCOUNT_ID:4:8}"
            # Check if the domain resource is already in state
            if ! terraform state show 'module.cognito.aws_cognito_user_pool_domain.main' >/dev/null 2>&1; then
              echo "Importing Cognito domain '$DOMAIN' into state..."
              terraform import -var-file="../../../${{ env.VAR_FILE }}" \
                'module.cognito.aws_cognito_user_pool_domain.main' "$DOMAIN" || echo "Import failed (may not exist yet) — continuing"
            else
              echo "Cognito domain already in state."
            fi
          else
            echo "Cognito user pool not in state yet — skipping domain import."
          fi

          # --- Fix 2: Import hand-seeded scaledjob-worker DynamoDB item (Issue #3119) ---
          # On accounts where the scaledjob-worker entry was hand-seeded before
          # PR #3116 added it to IaC, terraform create fails with
          # ConditionalCheckFailedException. Import it into state instead.
          TABLE_NAME="bedrockgw-${TF_VAR_environment:-dev}-agent-registry"
          RESOURCE_ADDR='module.lambda_authorizer[0].aws_dynamodb_table_item.scaledjob_worker'
          if ! terraform state show "$RESOURCE_ADDR" >/dev/null 2>&1; then
            # Item exists in DynamoDB but not in state — check and import
            if aws dynamodb get-item --table-name "$TABLE_NAME" \
                --key '{"agent_id":{"S":"scaledjob-worker"}}' \
                --region "$AWS_REGION" --query 'Item.agent_id.S' --output text 2>/dev/null | grep -q 'scaledjob-worker'; then
              echo "Importing existing scaledjob-worker DynamoDB item into state..."
              terraform import -var-file="../../../${{ env.VAR_FILE }}" \
                "$RESOURCE_ADDR" \
                "${TABLE_NAME},scaledjob-worker" || echo "Import failed — continuing (will retry on next apply)"
            else
              echo "scaledjob-worker item not in DynamoDB — will be created by apply."
            fi
          else
            echo "scaledjob-worker item already in state."
          fi

          # --- Fix 3: Delete stale RDS bootstrap K8s job if stuck ---
          # Install kubectl if needed
          command -v kubectl >/dev/null
          aws eks update-kubeconfig --name adp-dev-eks --region us-east-1 2>/dev/null || true
          # Find and delete any stuck rds-bootstrap jobs (namespace: bedrockgw,
          # previously adp-gateway — check both for migration period)
          for NS in bedrockgw adp-gateway; do
            STALE_JOBS=$(kubectl get jobs -n "$NS" -l app=bedrockgw-dev-rds-bootstrap -o name 2>/dev/null || echo "")
            if [ -n "$STALE_JOBS" ]; then
              echo "Deleting stale RDS bootstrap job(s) in $NS: $STALE_JOBS"
              kubectl delete $STALE_JOBS -n "$NS" --force --grace-period=0 2>/dev/null || true
              # Also remove from Terraform state so it gets cleanly recreated
              terraform state rm 'module.rds_bootstrap.kubernetes_job.grant_rds_iam' 2>/dev/null || true
            fi
          done
          echo "Stale RDS bootstrap job check complete."
      # Pre-resolve the EKS Ingress ALB BEFORE terraform plan. On a fresh deploy the
      # ALB doesn't exist yet (returns empty); on subsequent runs the SSM cache hit
      # returns the real ARN. Passing the resolved values to plan + apply ensures
      # the CloudFront VPC origin's count expression evaluates consistently and we
      # never schedule a destroy of an existing VPC origin.
      - name: Pre-resolve ALB (no-wait)
        id: alb_pre
        run: bash platform/scripts/wire-gateway-alb.sh --no-wait

      # Issue #3859: fail-safe guard against transient ALB-probe failures.
      # `wire-gateway-alb.sh --no-wait` does a single live discovery attempt and
      # returns empty on any transient failure (API throttle, describe error,
      # eventual-consistency race). An empty result flips enable_vpc_origin=false,
      # which SCHEDULES A DESTROY of BOTH:
      #   1. the CloudFront /api/* VPC origin + cache behavior (all /api/* then
      #      falls through to the S3 SPA — returns index.html instead of JSON), AND
      #   2. the API Gateway OpenAPI route body — the entire route set
      #      (/auth/github/{proxy+}, /{proxy+}, /agent/{proxy+}, /internal/{proxy+})
      #      is gated on `internal_alb_dns != ""`; empty ALB collapses the body to a
      #      minimal spec, so /auth/github/start returns API GW's
      #      "Missing Authentication Token" and GitHub sign-in dies.
      # Either destroy takes login down platform-wide (incident #3843 hit BOTH).
      # Distinguish "genuinely no ALB (fresh deploy)" from "ALB exists but the probe
      # blipped": if EITHER the /api VPC origin OR the API Gateway deployment is
      # already in TF state, an empty probe is transient — ABORT rather than destroy.
      # A fresh deploy has neither state resource, so it proceeds normally.
      - name: Guard — ALB probe empty but gateway API resources already exist
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -euo pipefail
          if [ -n "${{ steps.alb_pre.outputs.ALB_ARN }}" ]; then
            echo "ALB resolved — no transient-failure risk."
            exit 0
          fi
          # ALB probe returned empty. Are the ALB-dependent gateway API resources
          # already managed in state? (Either one being present means this is an
          # established environment, so an empty probe is a transient failure.)
          STATE="$(terraform state list 2>/dev/null || true)"
          EXISTING=""
          echo "$STATE" | grep -q 'module.cloudfront.aws_cloudfront_vpc_origin.api\[0\]' \
            && EXISTING="${EXISTING} cloudfront-/api-vpc-origin"
          echo "$STATE" | grep -q 'module.api_gateway\[0\].aws_api_gateway_deployment.main' \
            && EXISTING="${EXISTING} api-gateway-routes"
          if [ -n "$EXISTING" ]; then
            echo "::error::ALB probe returned EMPTY, but these live gateway API resources exist in state:${EXISTING}"
            echo "::error::This is a transient ALB-discovery failure, NOT a fresh deploy. Proceeding would"
            echo "::error::DESTROY the CloudFront /api/* origin AND/OR collapse the API Gateway route body,"
            echo "::error::breaking ADP login platform-wide (incident #3843 / #3859)."
            echo "::error::Aborting. Re-run this workflow; the ALB is discovered live each run and the SSM"
            echo "::error::cache (/adp/<env>/gateway/internal-alb-arn) should resolve it on retry."
            exit 1
          fi
          echo "ALB probe empty AND no ALB-dependent gateway API resources in state — genuine fresh deploy. Proceeding."

      # Issue #3789: kms_pre step removed. The webhook-secrets CMK now lives in
      # platform infra (applied before gateway in all tracks). The gateway KMS
      # grant is unconditional — no enable_webhook_secrets_kms_grant flag needed.

      # Issue #3745: Pre-resolve GitLab ALB from SSM (platform account only).
      # GitLab is an optional module — its ALB values are NOT in the shared
      # tfvars. On accounts that have GitLab deployed, the SSM params exist and
      # we export TF_VAR_gitlab_origin_*; on all other accounts the params are
      # absent and we silently leave the vars empty (Terraform defaults = no
      # GitLab origin). This is the normal customer-account path.
      - name: Pre-resolve GitLab ALB (SSM)
        id: gitlab_pre
        run: |
          GITLAB_DNS=$(aws ssm get-parameter \
            --name "/adp/${ENVIRONMENT:-dev}/gitlab/alb-dns" \
            --query "Parameter.Value" --output text \
            --region "$AWS_REGION" 2>/dev/null || echo "")
          GITLAB_ARN=$(aws ssm get-parameter \
            --name "/adp/${ENVIRONMENT:-dev}/gitlab/alb-arn" \
            --query "Parameter.Value" --output text \
            --region "$AWS_REGION" 2>/dev/null || echo "")
          if [ -n "$GITLAB_DNS" ] && [ -n "$GITLAB_ARN" ]; then
            echo "GitLab ALB resolved from SSM — enabling /gitlab/* CloudFront origin."
            echo "  DNS: $GITLAB_DNS"
            echo "  ARN: $GITLAB_ARN"
            echo "GITLAB_DNS=$GITLAB_DNS" >> "$GITHUB_OUTPUT"
            echo "GITLAB_ARN=$GITLAB_ARN" >> "$GITHUB_OUTPUT"
          else
            echo "GitLab ALB SSM params not found — GitLab origin disabled (normal for non-platform accounts)."
            echo "GITLAB_DNS=" >> "$GITHUB_OUTPUT"
            echo "GITLAB_ARN=" >> "$GITHUB_OUTPUT"
          fi

      # Issue #4313 / #4248: pre-resolve the agent-submit FIFO queue for engine
      # dispatch. The queue is owned by the webhook-ingress Terraform state, so
      # its URL/ARN are NOT in the shared gateway tfvars — same core-vs-optional
      # coupling rule as GitLab above (#3745 / #3440). The webhook-ingress module
      # writes the URL to SSM; we derive the ARN from it rather than requiring a
      # second parameter. When the param is absent (webhook-ingress not deployed)
      # both stay empty and the tick's fail-closed default applies: it dispatches
      # nothing and reports `undispatchable` instead of erroring.
      - name: Pre-resolve agent-submit queue (SSM)
        id: dispatch_pre
        run: |
          QUEUE_URL=$(aws ssm get-parameter \
            --name "/adp/${ENVIRONMENT:-dev}/webhook-ingress/sqs-queue-url" \
            --query "Parameter.Value" --output text \
            --region "$AWS_REGION" 2>/dev/null || echo "")
          if [ -z "$QUEUE_URL" ] || [ "$QUEUE_URL" = "None" ]; then
            echo "No agent-submit queue in SSM — engine dispatch stays disabled (tick reports undispatchable)."
            echo "QUEUE_URL=" >> "$GITHUB_OUTPUT"
            echo "QUEUE_ARN=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # https://sqs.<region>.amazonaws.com/<account>/<name>  ->  arn:aws:sqs:<region>:<account>:<name>
          QUEUE_NAME="${QUEUE_URL##*/}"
          QUEUE_ACCT=$(printf '%s' "$QUEUE_URL" | awk -F/ '{print $(NF-1)}')
          QUEUE_ARN="arn:aws:sqs:${AWS_REGION}:${QUEUE_ACCT}:${QUEUE_NAME}"
          echo "Engine dispatch queue resolved from SSM."
          echo "  URL: $QUEUE_URL"
          echo "  ARN: $QUEUE_ARN"
          echo "QUEUE_URL=$QUEUE_URL" >> "$GITHUB_OUTPUT"
          echo "QUEUE_ARN=$QUEUE_ARN" >> "$GITHUB_OUTPUT"

      # Issue #4527: pre-resolve the webhook-events table for the engine's GitHub
      # command bridge. Same core-vs-optional rule as the queue above: the table,
      # its KMS key, and the per-tenant GitHub App secrets are all owned by the
      # webhook-ingress state, so none of them may be pinned in gateway.tfvars.
      # The tick's grants (dynamodb:Query on engine-command-index, UpdateItem for
      # the consume flip, kms:Decrypt, ack-secret reads) are all conditioned on
      # these vars — without them the bridge deploys inert and every tick fails
      # its command pass with AccessDenied once the env var alone is set (which is
      # exactly what happened on dev). When the SSM param is absent all three stay
      # empty and the tick reports `commands_enabled=false`.
      - name: Pre-resolve engine command bridge (SSM)
        id: bridge_pre
        run: |
          EVENTS_TABLE=$(aws ssm get-parameter \
            --name "/adp/${ENVIRONMENT:-dev}/webhook-ingress/webhook-events-table" \
            --query "Parameter.Value" --output text \
            --region "$AWS_REGION" 2>/dev/null || echo "")
          if [ -z "$EVENTS_TABLE" ] || [ "$EVENTS_TABLE" = "None" ]; then
            echo "No webhook-events table in SSM — engine command bridge stays disabled (tick reports commands_enabled=false)."
            echo "EVENTS_TABLE=" >> "$GITHUB_OUTPUT"
            echo "EVENTS_KMS_ARN=" >> "$GITHUB_OUTPUT"
            echo "APP_SECRET_PATTERN=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The table is CMK-encrypted; Query/UpdateItem fail at runtime without
          # kms:Decrypt. Resolve the key from the table itself rather than adding
          # a second SSM parameter.
          EVENTS_KMS_ARN=$(aws dynamodb describe-table --table-name "$EVENTS_TABLE" \
            --query "Table.SSEDescription.KMSMasterKeyArn" --output text \
            --region "$AWS_REGION" 2>/dev/null || echo "")
          [ "$EVENTS_KMS_ARN" = "None" ] && EVENTS_KMS_ARN=""
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          APP_SECRET_PATTERN="arn:aws:secretsmanager:${AWS_REGION}:${ACCOUNT_ID}:secret:adp/${ENVIRONMENT:-dev}/tenants/*"
          echo "Engine command bridge resolved from SSM."
          echo "  table: $EVENTS_TABLE"
          echo "  kms:   $EVENTS_KMS_ARN"
          echo "EVENTS_TABLE=$EVENTS_TABLE" >> "$GITHUB_OUTPUT"
          echo "EVENTS_KMS_ARN=$EVENTS_KMS_ARN" >> "$GITHUB_OUTPUT"
          echo "APP_SECRET_PATTERN=$APP_SECRET_PATTERN" >> "$GITHUB_OUTPUT"

      - name: Terraform Plan (destroy-safety check)
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        # Pass ALB values via TF_VAR_* env (terraform parses these as HCL natively,
        # avoiding the bash quoting trap where ${{ ... }} interpolation collapses the
        # inner double quotes in alb_security_group_ids = ["sg-x","sg-y"]).
        env:
          # Issue #4010: the internal-plane ALB serves `/internal/*` and is not
          # fronted by CloudFront. These MUST be passed here — this is the only
          # workflow that repoints the API-GW `/internal/{proxy+}` integration off
          # the edge ALB. Omitting them (the original #4010 implementation did)
          # leaves the integration on the edge ALB forever, so the edge deny could
          # never be safely applied. Empty values are correct on any environment
          # where k8s/ingress-internal.yaml has not produced its ALB yet: the
          # Terraform then falls back to the edge ALB, i.e. pre-#4010 behavior.
          TF_VAR_internal_plane_alb_arn: ${{ steps.alb_pre.outputs.INTERNAL_PLANE_ALB_ARN }}
          TF_VAR_internal_plane_alb_dns: ${{ steps.alb_pre.outputs.INTERNAL_PLANE_ALB_DNS }}
          TF_VAR_internal_plane_alb_security_group_ids: ${{ steps.alb_pre.outputs.INTERNAL_PLANE_ALB_SG_IDS }}
          TF_VAR_internal_alb_arn: ${{ steps.alb_pre.outputs.ALB_ARN }}
          TF_VAR_internal_alb_dns: ${{ steps.alb_pre.outputs.ALB_DNS }}
          TF_VAR_alb_security_group_ids: ${{ steps.alb_pre.outputs.ALB_SG_IDS }}
          TF_VAR_enable_vpc_origin: ${{ steps.alb_pre.outputs.ALB_ARN != '' && 'true' || 'false' }}
          TF_VAR_gitlab_origin_dns: ${{ steps.gitlab_pre.outputs.GITLAB_DNS }}
          TF_VAR_gitlab_origin_arn: ${{ steps.gitlab_pre.outputs.GITLAB_ARN }}
          # Issue #4313: engine-dispatch queue, resolved from SSM above. Injected
          # as TF_VAR_* rather than pinned in gateway.tfvars because a -var-file
          # entry takes precedence over TF_VAR_*, so an empty pin there would
          # silently disable dispatch on every apply.
          TF_VAR_orchestration_dispatch_queue_url: ${{ steps.dispatch_pre.outputs.QUEUE_URL }}
          TF_VAR_orchestration_dispatch_queue_arn: ${{ steps.dispatch_pre.outputs.QUEUE_ARN }}
          # Issue #4527: engine command bridge (webhook-events table + its CMK +
          # tenant App secrets for acks), resolved from SSM above. TF_VAR_* for the
          # same reason as the queue: an empty tfvars pin would win over the
          # injection and silently disable the bridge's IAM grants.
          TF_VAR_orchestration_webhook_events_table: ${{ steps.bridge_pre.outputs.EVENTS_TABLE }}
          TF_VAR_orchestration_webhook_events_kms_key_arn: ${{ steps.bridge_pre.outputs.EVENTS_KMS_ARN }}
          TF_VAR_orchestration_github_app_secret_arn_pattern: ${{ steps.bridge_pre.outputs.APP_SECRET_PATTERN }}
          # Passed via env (not inlined into the script) to avoid shell injection
          # from the free-text workflow input. Empty = full plan (default).
          APPLY_TARGETS: ${{ inputs.apply_targets }}
        run: |
          set -e
          set -o pipefail
          EXIT_CODE=0

          # Issue #4010: a list-typed TF_VAR must never be the empty string —
          # terraform parses TF_VAR_* as HCL, and "" is not a valid list. Unset it
          # instead so the module default ([]) applies.
          if [ -z "${TF_VAR_internal_plane_alb_security_group_ids:-}" ]; then
            unset TF_VAR_internal_plane_alb_security_group_ids
          fi

          if [ -n "${TF_VAR_internal_alb_arn:-}" ]; then
            echo "ALB resolved — plan/apply will keep CloudFront VPC origin."
            echo "  ALB ARN: $TF_VAR_internal_alb_arn"
            echo "  ALB DNS: $TF_VAR_internal_alb_dns"
            echo "  ALB SG IDs: $TF_VAR_alb_security_group_ids"
            # Issue #4010: report the internal plane's routing target explicitly —
            # this line is how an operator confirms from the log whether this apply
            # repoints `/internal/{proxy+}` or leaves it on the edge ALB.
            if [ -n "${TF_VAR_internal_plane_alb_arn:-}" ]; then
              echo "  internal plane (#4010) -> $TF_VAR_internal_plane_alb_dns"
            else
              echo "  internal plane (#4010) -> (not discovered; /internal stays on the edge ALB)"
            fi
          else
            # Unset the related vars so terraform falls back to module defaults
            # (enable_vpc_origin=false, internal_alb_arn="", count=0 — VPC origin not created).
            unset TF_VAR_internal_alb_arn TF_VAR_internal_alb_dns TF_VAR_alb_security_group_ids TF_VAR_enable_vpc_origin
            # With no edge ALB this is a fresh deploy; the internal-plane ALB cannot
            # meaningfully exist yet either, and passing its vars while the rest of
            # the gateway body is collapsed would be inconsistent.
            unset TF_VAR_internal_plane_alb_arn TF_VAR_internal_plane_alb_dns TF_VAR_internal_plane_alb_security_group_ids
            echo "ALB not found (fresh deploy) — plan/apply will defer VPC origin creation."
          fi

          # Optional scoping: when apply_targets is set, plan (and therefore the
          # saved tfplan the apply consumes) is restricted to those addresses and
          # their dependencies. This lets an operator publish a specific resource
          # without dragging in unrelated pending drift. Resource addresses contain
          # glob chars ([0]) so disable pathname expansion while splitting.
          TARGET_ARGS=()
          if [ -n "${APPLY_TARGETS:-}" ]; then
            set -f
            for t in $APPLY_TARGETS; do TARGET_ARGS+=( -target="$t" ); done
            set +f
            echo "::warning::Scoped apply — plan restricted to targets: ${APPLY_TARGETS}"
          fi
          # Issue #4932: record scope for the post-apply convergence guard and the
          # summary. A scoped run's "Plan: N to change" counts only the targeted
          # subset, so convergence of the module as a whole cannot be asserted from
          # it — run 34573620121 reported "0 to add, 2 to change" while a bare plan
          # on the same head saw 38, because the operator scoped it to three
          # pre-signup addresses. The broker module was simply never in the plan.
          echo "scoped=$([ -n "${APPLY_TARGETS:-}" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

          # Issue #4932: publish the EFFECTIVE TF_VAR_* context to the job env so the
          # post-apply guard plans with byte-identical inputs. Step-scoped `env:` does
          # not reach later steps, and the unsets above are load-bearing: a guard that
          # re-planned without them would see an empty ALB context and report a false
          # residual diff that destroys the CloudFront /api origin + API GW route body
          # (#3859 / #3843). Only vars still set after the unsets are exported; every
          # value here is single-line (ARNs, DNS names, JSON lists) so plain
          # NAME=value is safe.
          for v in TF_VAR_internal_plane_alb_arn TF_VAR_internal_plane_alb_dns \
                   TF_VAR_internal_plane_alb_security_group_ids TF_VAR_internal_alb_arn \
                   TF_VAR_internal_alb_dns TF_VAR_alb_security_group_ids \
                   TF_VAR_enable_vpc_origin TF_VAR_gitlab_origin_dns \
                   TF_VAR_gitlab_origin_arn TF_VAR_orchestration_dispatch_queue_url \
                   TF_VAR_orchestration_dispatch_queue_arn \
                   TF_VAR_orchestration_webhook_events_table \
                   TF_VAR_orchestration_webhook_events_kms_key_arn \
                   TF_VAR_orchestration_github_app_secret_arn_pattern; do
            if [ -n "${!v+x}" ]; then
              printf '%s=%s\n' "$v" "${!v}" >> "$GITHUB_ENV"
            fi
          done

          terraform plan -var-file="../../../${{ env.VAR_FILE }}" \
            "${TARGET_ARGS[@]}" \
            -out=tfplan -detailed-exitcode -no-color 2>&1 | tee /tmp/plan-output.txt || EXIT_CODE=$?
          echo "detailed_exitcode=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          if [ "$EXIT_CODE" -eq 1 ]; then
            echo "::error::Terraform plan failed."
            exit 1
          fi

      - name: Destroy-safety gate
        if: steps.plan.outputs.detailed_exitcode == '2'
        env:
          ADP_INPUT_6B856C20FF: ${{ inputs.confirm_destructive_apply }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # Count destroys without exiting non-zero on no-match (grep -c returns 1 when no match).
          DESTROYS=$(grep -c 'will be destroyed' /tmp/plan-output.txt 2>/dev/null) || DESTROYS=0
          if [ "$DESTROYS" -le 0 ]; then
            echo "No destroys in plan. Proceeding."
            exit 0
          fi

          echo "Plan includes $DESTROYS resource(s) to destroy."
          echo ""
          echo "Resources to be destroyed:"
          grep 'will be destroyed' /tmp/plan-output.txt || true
          echo ""

          # workflow_dispatch: require explicit operator confirmation.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${ADP_INPUT_6B856C20FF}" = "yes" ]; then
              echo "Operator-confirmed destructive apply (confirm_destructive_apply=yes). Proceeding."
              exit 0
            fi
            echo "::error::This workflow_dispatch run schedules $DESTROYS destroy(s)."
            echo "::error::Re-run with confirm_destructive_apply=yes to authorize. Or fix the underlying drift first."
            exit 1
          fi

          # push / other events: require destructive-apply-approved label on the merged PR.
          COMMIT_SHA="${{ github.sha }}"
          PR_NUMBER=$(gh pr list --state merged --search "$COMMIT_SHA" --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
          if [ -z "$PR_NUMBER" ]; then
            echo "::error::This apply would destroy $DESTROYS resource(s) but no associated merged PR was found for SHA $COMMIT_SHA. Cannot verify destructive-apply-approved label."
            exit 1
          fi
          echo "Associated PR: #$PR_NUMBER"

          # Use grep -qx (exact, quiet) instead of grep -c piped through arithmetic.
          # Empty stdin to grep returns exit 1, which is what we want for "no match".
          LABELS=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name' 2>/dev/null || echo "")
          if echo "$LABELS" | grep -qx 'destructive-apply-approved'; then
            echo "PR #$PR_NUMBER has 'destructive-apply-approved' label. Proceeding."
          else
            echo "::error::This apply would destroy $DESTROYS resource(s). PR #$PR_NUMBER does NOT have the 'destructive-apply-approved' label."
            echo "::error::Add the label to PR #$PR_NUMBER and re-run, or trigger manually with confirm_destructive_apply=yes."
            exit 1
          fi
      - name: Terraform Apply
        id: apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        # The ALB vars (if resolved) are already baked into tfplan from the plan step,
        # so this is a single apply. On a fresh deploy where the ALB doesn't exist yet,
        # gateway-deploy.yml's wire-gateway-alb.sh step will populate the ALB SSM
        # entries after Phase 5 deploys the gateway pod; subsequent gateway-infra-apply
        # runs will pick them up from the SSM cache and create the VPC origin.
        #
        # Tee the output so the next step can detect whether the CloudFront distribution
        # changed and trigger an edge cache invalidation. Without invalidation, /api/*
        # changes (e.g. enabling the VPC origin behavior) sit behind hours-old cached
        # SPA HTML responses at the edge POPs — see deploy-instance #1062.
        run: |
          set -euo pipefail
          terraform apply tfplan 2>&1 | tee /tmp/tf-apply-output.txt

      - name: Invalidate CloudFront /api/* on distribution change
        if: steps.apply.outcome == 'success'
        # When terraform modifies the CloudFront distribution (e.g. flips
        # enable_vpc_origin from false to true on a fresh-account deploy),
        # CloudFront's edge POPs keep serving cached responses from before the
        # change for hours. /api/* requests fall through to S3's SPA fallback
        # (200 text/html) until the cache TTL expires, masking the fix.
        # First 1,000 invalidation paths/month are free.
        run: |
          if ! grep -qE 'module\.cloudfront\.aws_cloudfront_distribution\.frontend: (Modifications|Creation) complete' /tmp/tf-apply-output.txt; then
            echo "CloudFront distribution unchanged — skipping invalidation."
            exit 0
          fi
          DIST_ID=$(aws ssm get-parameter \
            --name "/adp/${ENVIRONMENT:-dev}/gateway/cloudfront-id" \
            --query Parameter.Value --output text 2>/dev/null || echo "")
          if [ -z "$DIST_ID" ] || [ "$DIST_ID" = "None" ]; then
            echo "::warning::No SSM cloudfront-id — skipping invalidation."
            exit 0
          fi
          echo "Invalidating /api/* on distribution $DIST_ID"
          aws cloudfront create-invalidation \
            --distribution-id "$DIST_ID" \
            --paths "/api/*" \
            --query 'Invalidation.{Id:Id,Status:Status}' \
            --output table

      # Issue #4932: prove the apply actually converged the module. Run 34573620121
      # reported a green "Plan: 0 to add, 2 to change" and an operator reasonably read
      # that as "main's Terraform is now live" — but the run was dispatched with
      # apply_targets scoped to three pre-signup addresses, so the github-auth-broker
      # module was never in the plan and its IDENTITY_INDEX_TABLE /
      # USER_IDENTITY_INDEX_TABLE env vars never landed. The first real sign-in logged
      # "IDENTITY_INDEX_TABLE is not configured" (harmless in shadow mode; a total
      # login outage once sign-in enforcement flips). Terraform did emit "Applied
      # changes may be incomplete", but buried in ~2,900 log lines.
      #
      # This re-plans with NO -target and the same var-file + TF_VAR_* context the
      # apply used (exported to $GITHUB_ENV by the plan step), then:
      #   - full apply + empty plan   -> converged, pass
      #   - full apply + residual     -> FAIL loudly, list every residual address
      #   - scoped apply              -> residual is expected by construction, so warn
      #                                  and record "not asserted" rather than fail
      #
      # Runs AFTER the CloudFront invalidation deliberately: this guard can fail the
      # run, and the invalidation must still happen for whatever the apply did change
      # (an uninvalidated /api/* edge cache is its own outage class — deploy-instance
      # #1062). Skipped when the apply failed; that already fails the run.
      - name: Convergence guard (post-apply plan must be empty)
        id: converge
        if: steps.apply.outcome == 'success'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -uo pipefail
          EXIT_CODE=0
          terraform plan -var-file="../../../${{ env.VAR_FILE }}" \
            -detailed-exitcode -no-color 2>&1 | tee /tmp/converge-plan.txt || EXIT_CODE=$?

          # Residual resource addresses, for the summary. Terraform prints one
          # `  # <address> <verb>` header per planned resource at exactly two spaces
          # of indent; "(N unchanged ... hidden)" notes are always indented deeper, so
          # the 2-space anchor plus the non-"(" first char excludes them. Matching on
          # the address rather than an enumerated verb list keeps replace / tainted /
          # "read during apply" headers in the report too. Display only — the
          # authoritative pass/fail signal is -detailed-exitcode above.
          grep -E '^  # [^ (]+ ' /tmp/converge-plan.txt > /tmp/converge-residual.txt 2>/dev/null || true
          RESIDUAL_COUNT=$(wc -l < /tmp/converge-residual.txt | tr -d ' ')

          if [ "$EXIT_CODE" -eq 1 ]; then
            echo "verdict=plan-error" >> "$GITHUB_OUTPUT"
            echo "::error::Convergence guard could not plan (terraform error). The apply succeeded but convergence is UNVERIFIED — inspect this step's log."
            exit 1
          fi

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "verdict=converged" >> "$GITHUB_OUTPUT"
            echo "residual_count=0" >> "$GITHUB_OUTPUT"
            echo "Converged: post-apply plan is empty — live state matches this ref's Terraform."
            exit 0
          fi

          # EXIT_CODE == 2: residual diff.
          echo "residual_count=$RESIDUAL_COUNT" >> "$GITHUB_OUTPUT"
          echo "Residual plan after apply — $RESIDUAL_COUNT resource(s) still differ:"
          cat /tmp/converge-residual.txt || true

          if [ "${{ steps.plan.outputs.scoped }}" = "true" ]; then
            echo "verdict=not-asserted-scoped" >> "$GITHUB_OUTPUT"
            echo "::warning::Scoped apply (apply_targets was set) — $RESIDUAL_COUNT resource(s) remain unconverged by construction."
            echo "::warning::This run does NOT prove main's Terraform is live for anything outside the targeted addresses (#4932)."
            exit 0
          fi

          echo "::error::Apply completed but the module did NOT converge: $RESIDUAL_COUNT resource(s) still differ from this ref's Terraform."
          echo "::error::Live state does not match main. Review the residual plan above and re-run a full apply, or fix the underlying drift."
          echo "verdict=residual-drift" >> "$GITHUB_OUTPUT"
          exit 1

      # Issue #4932: Scope and Convergence are reported here, not just buried in the
      # log. "Status: applied" alone is what let a targeted run be read as "main's
      # Terraform is live" when 36 resources (including the broker's identity-index
      # env vars) were never planned.
      - name: Summary
        if: always()
        env:
          APPLY_TARGETS: ${{ inputs.apply_targets }}
        run: |
          echo "## Terraform Apply -- ${{ env.MODULE_NAME }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Module**: ${{ env.MODULE_NAME }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status**: ${{ steps.apply.outcome == 'success' && 'applied' || 'failed' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Working dir**: ${{ env.TF_WORKING_DIR }}" >> "$GITHUB_STEP_SUMMARY"

          if [ -n "${APPLY_TARGETS:-}" ]; then
            echo "- **Scope**: ⚠️ SCOPED to \`${APPLY_TARGETS}\` — only these addresses (and their dependencies) were planned/applied" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Scope**: full (no \`apply_targets\`)" >> "$GITHUB_STEP_SUMMARY"
          fi

          RESIDUAL="${{ steps.converge.outputs.residual_count }}"
          case "${{ steps.converge.outputs.verdict }}" in
            converged)
              echo "- **Convergence**: ✅ converged — post-apply plan is empty, live state matches this ref" >> "$GITHUB_STEP_SUMMARY"
              ;;
            not-asserted-scoped)
              echo "- **Convergence**: ⚠️ NOT ASSERTED — scoped apply left ${RESIDUAL} resource(s) unconverged. This run does **not** prove this ref's Terraform is live outside the targeted addresses." >> "$GITHUB_STEP_SUMMARY"
              ;;
            residual-drift)
              echo "- **Convergence**: ❌ RESIDUAL DRIFT — ${RESIDUAL} resource(s) still differ from this ref after a full apply" >> "$GITHUB_STEP_SUMMARY"
              ;;
            plan-error)
              echo "- **Convergence**: ❓ UNVERIFIED — the post-apply plan itself errored" >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "- **Convergence**: not checked (apply did not succeed)" >> "$GITHUB_STEP_SUMMARY"
              ;;
          esac

          if [ -s /tmp/converge-residual.txt ]; then
            {
              echo ""
              echo "<details><summary>Residual plan after apply (${RESIDUAL} resource(s))</summary>"
              echo ""
              echo '```'
              sed 's/^  # //' /tmp/converge-residual.txt
              echo '```'
              echo ""
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
