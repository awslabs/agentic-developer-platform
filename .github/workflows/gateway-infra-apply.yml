name: Gateway Infra Apply

on:
  # Manual-only trigger. Merging a PR does NOT auto-apply infra; operator
  # reviews the plan comment on the merged PR, then triggers this workflow
  # explicitly via Actions → Gateway Infra Apply → Run workflow. See
  # platform-infra-apply.yml for the full rationale.
  workflow_dispatch:
    inputs:
      account_id:
        description: 'Target AWS account (12 digits). Empty = use platform IRSA / config file.'
        required: false
        default: ''
      customer_account_id:
        description: 'Customer-linked AWS account to deploy into (cross-account mode). Triggers gateway-call assume.'
        required: false
        default: ''
      customer_aws_label:
        description: 'Vaulted credential label (when customer_account_id is set).'
        required: false
        default: ''
      customer_user_id:
        description: 'ADP users.id UUID (when customer_account_id is set).'
        required: false
        default: ''
      environment:
        description: 'Deployment environment (dev/staging/prod).'
        required: false
        default: 'dev'
      confirm_destructive_apply:
        description: 'Set to "yes" to authorize an apply that destroys resources. Required when terraform plan includes any destroys.'
        required: false
        default: 'no'

concurrency:
  group: tf-apply-gateway-${{ inputs.customer_account_id || inputs.account_id || 'default' }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_VAR_environment: dev
  MODULE_NAME: gateway
  TF_WORKING_DIR: modules/gateway/infra
  BACKEND_CONFIG: environments/dev/modules/gateway-backend.tfvars
  VAR_FILE: environments/dev/modules/gateway.tfvars

jobs:
  apply:
    name: Terraform Apply
    runs-on: arc-runner-org
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load deployment config
        uses: ./.github/actions/load-deploy-config
        with:
          account_id: ${{ inputs.account_id }}
          environment: ${{ inputs.environment }}
          customer_account_id: ${{ inputs.customer_account_id }}
          customer_aws_label: ${{ inputs.customer_aws_label }}
          customer_user_id: ${{ inputs.customer_user_id }}

      - name: Install required CLI tools
        run: |
          set -e
          if ! command -v zip >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends zip unzip curl gnupg
          fi
          if ! command -v aws >/dev/null 2>&1; then
            curl -sL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscli.zip
            unzip -q /tmp/awscli.zip -d /tmp
            sudo /tmp/aws/install
            rm -rf /tmp/awscli.zip /tmp/aws
          fi
          if ! command -v terraform >/dev/null 2>&1; then
            curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
            echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" \
              | sudo tee /etc/apt/sources.list.d/hashicorp.list > /dev/null
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends terraform
          fi
          aws --version
          terraform version | head -1

      - name: Pre-create OAuth stub secret (idempotent)
        run: |
          SECRET_ID="adp/${{ env.TF_VAR_environment || 'dev' }}/cognito/github-oauth-credentials"
          if aws secretsmanager describe-secret --secret-id "$SECRET_ID" --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "OAuth stub secret already exists — skipping create."
          else
            echo "Creating OAuth stub secret with placeholder values."
            aws secretsmanager create-secret \
              --name "$SECRET_ID" \
              --region "$AWS_REGION" \
              --secret-string '{"client_id":"PLACEHOLDER","client_secret":"PLACEHOLDER"}' \
              --description "GitHub OAuth credentials stub (replace with real values when wiring github_auth_broker)"
          fi

      - name: Ensure PyJWT Lambda layer artifact exists in state bucket
        working-directory: modules/gateway/lambda/layers/pyjwt
        run: |
          set -e
          ARTIFACT_KEY="lambda-layers/pyjwt-py313.zip"
          if aws s3api head-object --bucket "$STATE_BUCKET" --key "$ARTIFACT_KEY" --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "PyJWT layer already in s3://$STATE_BUCKET/$ARTIFACT_KEY — skipping build."
          else
            echo "PyJWT layer missing — building inline."
            chmod +x build.sh
            ./build.sh
            aws s3 cp pyjwt-py313.zip "s3://$STATE_BUCKET/$ARTIFACT_KEY" --region "$AWS_REGION"
          fi

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="../../../${{ env.BACKEND_CONFIG }}" \
            -backend-config="bucket=${STATE_BUCKET}" \
            -input=false -reconfigure

      - name: State fixups (import drift, clean stale jobs)
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -e
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          # --- Fix 1: Import Cognito domain if it exists in AWS but not in state ---
          POOL_ID=$(terraform state show 'module.cognito.aws_cognito_user_pool.main' 2>/dev/null | grep '^\s*id\s' | awk '{print $NF}' | tr -d '"' || echo "")
          if [ -n "$POOL_ID" ]; then
            DOMAIN="bedrockgw-dev-auth-${ACCOUNT_ID:4:8}"
            # Check if the domain resource is already in state
            if ! terraform state show 'module.cognito.aws_cognito_user_pool_domain.main' >/dev/null 2>&1; then
              echo "Importing Cognito domain '$DOMAIN' into state..."
              terraform import -var-file="../../../${{ env.VAR_FILE }}" \
                'module.cognito.aws_cognito_user_pool_domain.main' "$DOMAIN" || echo "Import failed (may not exist yet) — continuing"
            else
              echo "Cognito domain already in state."
            fi
          else
            echo "Cognito user pool not in state yet — skipping domain import."
          fi

          # --- Fix 2: Delete stale RDS bootstrap K8s job if stuck ---
          # Install kubectl if needed
          if ! command -v kubectl >/dev/null 2>&1; then
            curl -sLO "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            chmod +x kubectl && sudo mv kubectl /usr/local/bin/
          fi
          aws eks update-kubeconfig --name adp-dev-eks --region us-east-1 2>/dev/null || true
          # Find and delete any stuck rds-bootstrap jobs (namespace: bedrockgw,
          # previously adp-gateway — check both for migration period)
          for NS in bedrockgw adp-gateway; do
            STALE_JOBS=$(kubectl get jobs -n "$NS" -l app=bedrockgw-dev-rds-bootstrap -o name 2>/dev/null || echo "")
            if [ -n "$STALE_JOBS" ]; then
              echo "Deleting stale RDS bootstrap job(s) in $NS: $STALE_JOBS"
              kubectl delete $STALE_JOBS -n "$NS" --force --grace-period=0 2>/dev/null || true
              # Also remove from Terraform state so it gets cleanly recreated
              terraform state rm 'module.rds_bootstrap.kubernetes_job.grant_rds_iam' 2>/dev/null || true
            fi
          done
          echo "Stale RDS bootstrap job check complete."

      # Pre-resolve the EKS Ingress ALB BEFORE terraform plan. On a fresh deploy the
      # ALB doesn't exist yet (returns empty); on subsequent runs the SSM cache hit
      # returns the real ARN. Passing the resolved values to plan + apply ensures
      # the CloudFront VPC origin's count expression evaluates consistently and we
      # never schedule a destroy of an existing VPC origin.
      - name: Pre-resolve ALB (no-wait)
        id: alb_pre
        run: bash platform/scripts/wire-gateway-alb.sh --no-wait

      - name: Terraform Plan (destroy-safety check)
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        # Pass ALB values via TF_VAR_* env (terraform parses these as HCL natively,
        # avoiding the bash quoting trap where ${{ ... }} interpolation collapses the
        # inner double quotes in alb_security_group_ids = ["sg-x","sg-y"]).
        env:
          TF_VAR_internal_alb_arn: ${{ steps.alb_pre.outputs.ALB_ARN }}
          TF_VAR_internal_alb_dns: ${{ steps.alb_pre.outputs.ALB_DNS }}
          TF_VAR_alb_security_group_ids: ${{ steps.alb_pre.outputs.ALB_SG_IDS }}
          TF_VAR_enable_vpc_origin: ${{ steps.alb_pre.outputs.ALB_ARN != '' && 'true' || 'false' }}
        run: |
          set -e
          set -o pipefail
          EXIT_CODE=0

          if [ -n "${TF_VAR_internal_alb_arn:-}" ]; then
            echo "ALB resolved — plan/apply will keep CloudFront VPC origin."
            echo "  ALB ARN: $TF_VAR_internal_alb_arn"
            echo "  ALB DNS: $TF_VAR_internal_alb_dns"
            echo "  ALB SG IDs: $TF_VAR_alb_security_group_ids"
          else
            # Unset the related vars so terraform falls back to module defaults
            # (enable_vpc_origin=false, internal_alb_arn="", count=0 — VPC origin not created).
            unset TF_VAR_internal_alb_arn TF_VAR_internal_alb_dns TF_VAR_alb_security_group_ids TF_VAR_enable_vpc_origin
            echo "ALB not found (fresh deploy) — plan/apply will defer VPC origin creation."
          fi

          terraform plan -var-file="../../../${{ env.VAR_FILE }}" \
            -out=tfplan -detailed-exitcode -no-color 2>&1 | tee /tmp/plan-output.txt || EXIT_CODE=$?
          echo "detailed_exitcode=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          if [ "$EXIT_CODE" -eq 1 ]; then
            echo "::error::Terraform plan failed."
            exit 1
          fi

      - name: Destroy-safety gate
        if: steps.plan.outputs.detailed_exitcode == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # Count destroys without exiting non-zero on no-match (grep -c returns 1 when no match).
          DESTROYS=$(grep -c 'will be destroyed' /tmp/plan-output.txt 2>/dev/null) || DESTROYS=0
          if [ "$DESTROYS" -le 0 ]; then
            echo "No destroys in plan. Proceeding."
            exit 0
          fi

          echo "Plan includes $DESTROYS resource(s) to destroy."
          echo ""
          echo "Resources to be destroyed:"
          grep 'will be destroyed' /tmp/plan-output.txt || true
          echo ""

          # workflow_dispatch: require explicit operator confirmation.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.confirm_destructive_apply }}" = "yes" ]; then
              echo "Operator-confirmed destructive apply (confirm_destructive_apply=yes). Proceeding."
              exit 0
            fi
            echo "::error::This workflow_dispatch run schedules $DESTROYS destroy(s)."
            echo "::error::Re-run with confirm_destructive_apply=yes to authorize. Or fix the underlying drift first."
            exit 1
          fi

          # push / other events: require destructive-apply-approved label on the merged PR.
          COMMIT_SHA="${{ github.sha }}"
          PR_NUMBER=$(gh pr list --state merged --search "$COMMIT_SHA" --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
          if [ -z "$PR_NUMBER" ]; then
            echo "::error::This apply would destroy $DESTROYS resource(s) but no associated merged PR was found for SHA $COMMIT_SHA. Cannot verify destructive-apply-approved label."
            exit 1
          fi
          echo "Associated PR: #$PR_NUMBER"

          # Use grep -qx (exact, quiet) instead of grep -c piped through arithmetic.
          # Empty stdin to grep returns exit 1, which is what we want for "no match".
          LABELS=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name' 2>/dev/null || echo "")
          if echo "$LABELS" | grep -qx 'destructive-apply-approved'; then
            echo "PR #$PR_NUMBER has 'destructive-apply-approved' label. Proceeding."
          else
            echo "::error::This apply would destroy $DESTROYS resource(s). PR #$PR_NUMBER does NOT have the 'destructive-apply-approved' label."
            echo "::error::Add the label to PR #$PR_NUMBER and re-run, or trigger manually with confirm_destructive_apply=yes."
            exit 1
          fi

      - name: Terraform Apply
        id: apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        # The ALB vars (if resolved) are already baked into tfplan from the plan step,
        # so this is a single apply. On a fresh deploy where the ALB doesn't exist yet,
        # gateway-deploy.yml's wire-gateway-alb.sh step will populate the ALB SSM
        # entries after Phase 5 deploys the gateway pod; subsequent gateway-infra-apply
        # runs will pick them up from the SSM cache and create the VPC origin.
        run: terraform apply tfplan

      - name: Summary
        if: always()
        run: |
          echo "## Terraform Apply -- ${{ env.MODULE_NAME }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Module**: ${{ env.MODULE_NAME }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status**: ${{ steps.apply.outcome == 'success' && 'applied' || 'failed' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Working dir**: ${{ env.TF_WORKING_DIR }}" >> "$GITHUB_STEP_SUMMARY"
