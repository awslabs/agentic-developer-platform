name: Automation trust contracts
on:
  workflow_call: {}
  pull_request:
    paths:
      - .github/workflows/**
      - .github/actions/**
      - modules/agent-factory/infra/**
      - modules/agent-factory/runner-infra/**
      - platform/automation-infra/**
      - platform/scripts/tests/test_release.py
      - platform/scripts/verify-chat-release-controls.py
      - platform/scripts/tests/test_chat_release_controls.py
      - .github/scripts/tests/test_gitlab_config_fail_closed.py
      - .github/scripts/tests/test_assert_findings_bucket_private.py
      - modules/domain-apps/superplane/infra/automation/**
      - platform/infra/modules/codebuild/**
      - modules/domain-apps/cyber/image-builder/**
      - modules/domain-apps/cyber/ci/**
      - modules/domain-apps/cyber/codebuild/**
      # Documentation-only changes do not start this workflow.
      - '!docs/**'
      - '!**/docs/**'
      - '!**/README*'
      - '!**/CHANGELOG*'
      - '!**/CONTRIBUTING*'
      - '!**/*.rst'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-automation-trust-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  public-workflow-contracts:
    # Upstream jobs stay on ARC; public mirrors have no upstream runner pool.
    # This gate uses read-only GitHub access and no deployment role.
    runs-on: ${{ github.repository == 'aws-e/adp' && 'arc-runner-org' || 'ubuntu-latest' }}
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.3.5 PyYAML==6.0.2
      - name: Reject private action dependencies and mutable credential helpers
        run: |
          python -m pytest -q platform/automation-infra/tests/test_workflow_portability.py \
            platform/scripts/tests/test_release.py::ReleaseContracts::test_all_github_actions_jobs_use_self_hosted_runners
  policies-and-workflows:
    runs-on: arc-runner-org
    timeout-minutes: 20
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.2
      - name: Verify workflow trust without cloud access
        run: |
          python -m venv /tmp/automation-contracts
          /tmp/automation-contracts/bin/pip install pytest==8.3.5 PyYAML==6.0.2
          /tmp/automation-contracts/bin/python -m pytest -q platform/automation-infra/tests platform/infra/modules/codebuild/tests
          /tmp/automation-contracts/bin/python -m pytest -q platform/scripts/tests/test_chat_release_controls.py
          /tmp/automation-contracts/bin/python -m pytest -q .github/scripts/tests/test_gitlab_config_fail_closed.py
      - name: Verify rendered IAM policies using mocked AWS providers
        run: |
          set -euo pipefail
          # runner-infra/infrastructure is the legacy runner installation. This job
          # already triggers on changes under runner-infra/** (see paths above), but
          # until #5613 it was absent from this loop — so editing that tree's trust or
          # boundary wiring ran a green job that asserted nothing about the file
          # changed. Its tests mock every provider and substitute the cluster/OIDC
          # attributes, so like the others they need no credentials or backend.
          for module in modules/agent-factory/infra/modules/agent-workflow-iam modules/agent-factory/infra/modules/agent-workflow-pool modules/agent-factory/infra/modules/runner-runtime-policy modules/agent-factory/infra/modules/runner-iam modules/agent-factory/runner-infra/infrastructure platform/infra/modules/codebuild platform/automation-infra modules/domain-apps/cyber/image-builder; do
            terraform -chdir="$module" init -backend=false -input=false
            terraform -chdir="$module" test -no-color
          done
