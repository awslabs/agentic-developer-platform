name: Automation trust contracts
on:
  pull_request:
    paths:
      - .github/workflows/**
      - .github/actions/trusted-*/**
      - .github/actions/codebuild-run/**
      - modules/agent-factory/infra/**
      - modules/agent-factory/runner-infra/**
      - platform/automation-infra/**
      - platform/infra/modules/codebuild/**
      - modules/domain-apps/cyber/ci/**
      - modules/domain-apps/cyber/codebuild/**
  workflow_dispatch:
concurrency:
  group: automation-trust-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  policies-and-workflows:
    runs-on: arc-runner-org
    timeout-minutes: 20
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.2
      - name: Verify workflow trust without cloud access
        run: |
          python -m venv /tmp/automation-contracts
          /tmp/automation-contracts/bin/pip install pytest==8.3.5 PyYAML==6.0.2
          /tmp/automation-contracts/bin/python -m pytest -q platform/automation-infra/tests platform/infra/modules/codebuild/tests
      - name: Verify rendered IAM policies using mocked AWS providers
        run: |
          set -euo pipefail
          # runner-infra/infrastructure is the legacy runner installation. This job
          # already triggers on changes under runner-infra/** (see paths above), but
          # until #5613 it was absent from this loop — so editing that tree's trust or
          # boundary wiring ran a green job that asserted nothing about the file
          # changed. Its tests mock every provider and substitute the cluster/OIDC
          # attributes, so like the others they need no credentials or backend.
          for module in modules/agent-factory/infra/modules/agent-workflow-iam modules/agent-factory/infra/modules/agent-workflow-pool modules/agent-factory/infra/modules/runner-runtime-policy modules/agent-factory/infra/modules/runner-iam modules/agent-factory/runner-infra/infrastructure platform/infra/modules/codebuild platform/automation-infra; do
            terraform -chdir="$module" init -backend=false -input=false
            terraform -chdir="$module" test -no-color
          done
