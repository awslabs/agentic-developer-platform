name: Agent Factory Infra Apply

on:
  # Manual-only trigger. Merging a PR does NOT auto-apply infra; operator
  # reviews the plan comment on the merged PR, then triggers this workflow
  # explicitly via Actions → Agent Factory Infra Apply → Run workflow. See
  # platform-infra-apply.yml for the full rationale.
  workflow_dispatch:
    inputs:
      account_id:
        description: 'Target AWS account (12 digits). Empty = use the protected deployment identity / config file.'
        required: false
        default: ''
      customer_account_id:
        description: 'Customer-linked AWS account to deploy into (cross-account mode).'
        required: false
        default: ''
      customer_aws_label:
        description: 'Vaulted credential label.'
        required: false
        default: ''
      customer_user_id:
        description: 'ADP users.id UUID.'
        required: false
        default: ''
      environment:
        description: 'Deployment environment.'
        required: false
        default: 'dev'
      plan_only:
        description: 'Preview and validate the plan without applying it. A later apply creates a fresh plan.'
        required: false
        default: false
        type: boolean
      target:
        description: 'Optional Terraform address to scope the apply, e.g. module.arc_runner. Empty = whole module (~61 resources).'
        required: false
        default: ''
      adp_approved_revision:
        description: 'Assistant rollout approval for this run only: full 40-hex commit with approved chat IAM files.'
        required: false
        type: string
        default: ''

concurrency:
  group: tf-apply-agent-factory-${{ inputs.customer_account_id || inputs.account_id || 'default' }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_VAR_environment: dev
  MODULE_NAME: agent-factory
  TF_WORKING_DIR: modules/agent-factory/infra
  BACKEND_CONFIG: environments/dev/modules/agent-factory-backend.tfvars
  VAR_FILE: modules/agent-factory/infra/terraform.tfvars

jobs:
  apply:
    name: Terraform Apply
    if: github.ref == 'refs/heads/main'
    runs-on: arc-runner-org
    environment: adp-deploy-${{ inputs.environment || 'dev' }}
    permissions:
      id-token: write
      actions: read
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify source belongs to reviewed main history
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$GITHUB_SHA"
          git merge-base --is-ancestor HEAD FETCH_HEAD

      - name: Guard assistant IAM deployment
        env:
          ADP_ASSISTANT_DEPLOY_COMPONENT: chat-infra
          ADP_ASSISTANT_DEPLOY_TARGET: adp-deploy-${{ inputs.environment || 'dev' }}
          ADP_ASSISTANT_APPROVED_TARGET: ${{ vars.ADP_ASSISTANT_APPROVED_TARGET }}
          ADP_ASSISTANT_APPROVED_REVISION: ${{ vars.ADP_ASSISTANT_APPROVED_REVISION }}
          ADP_ASSISTANT_DISPATCH_APPROVED_REVISION: ${{ inputs.adp_approved_revision }}
        run: bash scripts/check-assistant-deploy-boundary.sh

      - name: Establish trusted deployment identity
        uses: ./.github/actions/trusted-deployment
        with:
          role_arn: ${{ vars.ADP_DEPLOY_ROLE_ARN }}
          region: ${{ vars.ADP_DEPLOY_REGION || 'us-east-1' }}

      - name: Load deployment config
        uses: ./.github/actions/load-deploy-config
        with:
          account_id: ${{ inputs.account_id }}
          environment: ${{ inputs.environment }}
          customer_account_id: ${{ inputs.customer_account_id }}
          customer_aws_label: ${{ inputs.customer_aws_label }}
          customer_user_id: ${{ inputs.customer_user_id }}

      - name: Install required CLI tools
        run: |
          set -euo pipefail
          for tool in aws terraform kubectl helm jq zip unzip curl git python3 node npm; do
            command -v "$tool" >/dev/null || { echo "::error::Reviewed runner image is missing $tool"; exit 1; }
          done
      # GitHub App wiring is a separate, final onboarding step. Existing ARC
      # installations must already have real credentials; never create stubs.

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build factory Lambda packages
        run: bash platform/scripts/build-agent-factory-lambdas.sh

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="../../../${{ env.BACKEND_CONFIG }}" \
            -backend-config="bucket=${STATE_BUCKET}" \
            -input=false -reconfigure

      - name: Terraform Plan (destroy-safety check)
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -e
          set -o pipefail
          EXIT_CODE=0
          # Optional -target. This module holds ~61 resources across chat-agent,
          # gateway-intake, KMS, runner-RBAC and the ARC scale set, so an
          # unscoped apply reconciles all of them — including anything that was
          # live-patched by hand since the last apply (there is a precedent
          # recorded in arc-runner/main.tf: maxRunners was live-patched on
          # 2026-07-03 and had to be written back into code so "the next apply
          # doesn't revert it"). Targeting keeps a one-module change from
          # carrying unrelated reconciliation with it.
          #
          # -target is applied to the PLAN, and `terraform apply tfplan` below
          # replays exactly that saved plan, so the scope shown in the plan is
          # the scope that gets applied. The destroy-safety gate below still
          # runs either way.
          TARGET_ARGS=()
          if [ -n "$TARGET" ]; then
            echo "::warning::Targeted apply: scope limited to '$TARGET'. State will be only partially converged; run an unscoped apply when convenient."
            TARGET_ARGS=(-target="$TARGET")
          fi
          terraform plan -var-file="terraform.tfvars" "${TARGET_ARGS[@]}" -out=tfplan -detailed-exitcode -no-color 2>&1 | tee /tmp/plan-output.txt || EXIT_CODE=$?
          echo "detailed_exitcode=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          if [ "$EXIT_CODE" -eq 1 ]; then
            echo "::error::Terraform plan failed."
            exit 1
          fi

      - name: Destroy-safety label gate
        if: steps.plan.outputs.detailed_exitcode == '2' && !inputs.plan_only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          DESTROYS=$(grep -c 'will be destroyed' /tmp/plan-output.txt || echo "0")
          if [ "$DESTROYS" -gt 0 ]; then
            echo "Plan includes $DESTROYS resource(s) to destroy."
            COMMIT_SHA="${{ github.sha }}"
            PR_NUMBER=$(gh pr list --state merged --search "$COMMIT_SHA" --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
            if [ -z "$PR_NUMBER" ]; then
              echo "::error::This apply would destroy $DESTROYS resource(s) but no associated PR was found. Cannot verify destructive-apply-approved label. Re-run via workflow_dispatch after adding the label to the source PR."
              exit 1
            fi
            echo "Associated PR: #$PR_NUMBER"
            HAS_LABEL=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name' 2>/dev/null | grep -c 'destructive-apply-approved' || echo "0")
            if [ "$HAS_LABEL" -eq 0 ]; then
              echo "::error::This apply would destroy $DESTROYS resource(s). The PR #$PR_NUMBER does NOT have the 'destructive-apply-approved' label. Add the label to PR #$PR_NUMBER and re-run this workflow."
              echo ""
              echo "Resources to be destroyed:"
              grep 'will be destroyed' /tmp/plan-output.txt || true
              exit 1
            fi
            echo "PR #$PR_NUMBER has 'destructive-apply-approved' label. Proceeding."
          else
            echo "No destroys in plan. Proceeding."
          fi

      - name: Verify ARC controller and live scale-set compatibility
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -euo pipefail
          umask 077
          terraform show -json tfplan > "$RUNNER_TEMP/arc-upgrade-plan.json"
          python3 ../../../platform/scripts/check-arc-upgrade.py --plan "$RUNNER_TEMP/arc-upgrade-plan.json"

      - name: Terraform Apply
        id: apply
        if: ${{ !inputs.plan_only }}
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply tfplan

      - name: Summary
        if: always()
        env:
          PLAN_ONLY: ${{ inputs.plan_only }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
          REQUESTED_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          {
            if [[ "$PLAN_ONLY" == true ]]; then
              echo '## Agent factory plan only'
              printf -- '- Plan step: %s\n' "$PLAN_OUTCOME"
              echo '- Terraform Apply was skipped. No infrastructure convergence is claimed.'
              echo '- A later apply run creates and validates a fresh plan.'
            else
              echo '## Agent factory apply'
              printf -- '- Apply step: %s\n' "$APPLY_OUTCOME"
            fi
            if [[ -n "$REQUESTED_TARGET" ]]; then
              printf -- '- Requested scope: `%s` only; other module resources are outside this operation.\n' "$REQUESTED_TARGET"
            else
              echo '- Requested scope: full module.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
