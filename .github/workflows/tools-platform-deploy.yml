  drift:
    needs: guard
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'drift' && inputs.stage != 'tool-adapters'))
    runs-on: arc-runner-org
    timeout-minutes: 30
    environment: adp-tools-deploy-dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.manual_source_revision || inputs.adp_source_revision || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source belongs to reviewed main history
        shell: bash
        env:
          ADP_SELECTED_SOURCE: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ADP_SELECTED_SOURCE"
          # persist-credentials: false leaves no credential helper for a network
          # fetch; prove the dispatched commit belongs to origin/main from the
          # authenticated fetch-depth: 0 objects and populate FETCH_HEAD with a
          # local self-fetch.
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          git fetch --no-tags . "$GITHUB_SHA"
          git merge-base --is-ancestor HEAD FETCH_HEAD
      - name: Pin target mutation guard to the protected workflow revision
        env:
          ADP_WORKFLOW_REVISION: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$ADP_WORKFLOW_REVISION" =~ ^[0-9a-f]{40}$ ]]
          for file in modules/tools/deploy.sh modules/tools/platform/scripts/release_plan.py modules/tools/platform/scripts/knowledge_overlay.py modules/tools/platform/scripts/operational_release.py modules/tools/platform/scripts/native_release.py; do
            git show "$ADP_WORKFLOW_REVISION:$file" | cmp - "$file"
          done
      - name: Assume environment-scoped role for live-state reads
        uses: ./.github/actions/trusted-deployment
        with:
          role_arn: ${{ vars.ADP_DEPLOY_ROLE_ARN }}
          region: ${{ vars.ADP_TOOLS_REGION || 'us-east-1' }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.14.6'
          terraform_wrapper: false
      - name: Fail when deployed dev resources differ from main
        env:
          ADP_TOOLS_MODE: drift
          ADP_TOOLS_ENVIRONMENT: dev
          ADP_TOOLS_AWS_REGION: ${{ vars.ADP_TOOLS_REGION || 'us-east-1' }}
          ADP_TOOLS_ACCOUNT_ID: ${{ vars.ADP_TOOLS_ACCOUNT_ID }}
          ADP_TOOLS_STATE_BUCKET: ${{ vars.ADP_TOOLS_STATE_BUCKET }}
          ADP_TOOLS_DEPLOY_ROLE_ARN: ${{ vars.ADP_DEPLOY_ROLE_ARN }}
          ADP_TOOLS_TFVARS_JSON: ${{ secrets.ADP_TOOLS_DEPLOY_TFVARS_JSON }}
          ADP_TOOLS_RELEASE_SELECTORS_JSON: ${{ secrets.ADP_TOOLS_RELEASE_SELECTORS_JSON }}
          ADP_TOOLS_KNOWLEDGE_CONFIG_JSON: ${{ vars.ADP_TOOLS_KNOWLEDGE_CONFIG_JSON || '' }}
          ADP_TOOLS_CONNECTIONS_CONFIG_JSON: ${{ vars.ADP_TOOLS_CONNECTIONS_CONFIG_JSON || '' }}
          ADP_SOURCE_REVISION: ${{ inputs.manual_source_revision || inputs.adp_source_revision || github.sha }}
          ADP_DEFINITION_REVISION: ${{ github.workflow_sha }}
        run: bash modules/tools/deploy.sh --infra --targets
