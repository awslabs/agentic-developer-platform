          done
      - name: Publish signed native adapter context
        env:
          ADP_WORKFLOW_REVISION: ${{ github.workflow_sha }}
          ACCOUNT_ID: ${{ vars.ADP_TOOLS_ACCOUNT_ID }}
          ENVIRONMENT: dev
          AWS_REGION: ${{ vars.ADP_TOOLS_REGION || 'us-east-1' }}
        run: python3 "$RUNNER_TEMP/adp-deployment-evidence/scripts/publish-deployment-evidence.py" context tools-platform-deploy.yml "$ADP_TOOLS_ADAPTER_RELEASE_DIR/deployment-context.json"
      - name: Publish signed native adapter release
        env:
          ADP_WORKFLOW_REVISION: ${{ github.workflow_sha }}
          ACCOUNT_ID: ${{ vars.ADP_TOOLS_ACCOUNT_ID }}
          ENVIRONMENT: dev
          AWS_REGION: ${{ vars.ADP_TOOLS_REGION || 'us-east-1' }}
        run: python3 "$RUNNER_TEMP/adp-deployment-evidence/scripts/publish-deployment-evidence.py" release tool-adapters "$ADP_TOOLS_ADAPTER_RELEASE_DIR/release.json"
      - name: Publish independently verified foundation summary
        env:
          ADP_WORKFLOW_REVISION: ${{ github.workflow_sha }}
          ACCOUNT_ID: ${{ vars.ADP_TOOLS_ACCOUNT_ID }}
          ENVIRONMENT: dev
          EXPECTED_SOURCE_REVISION: ${{ inputs.adp_source_revision }}
          AWS_REGION: ${{ vars.ADP_TOOLS_REGION || 'us-east-1' }}
        run: python3 "$RUNNER_TEMP/adp-deployment-evidence/scripts/publish-deployment-evidence.py" repository-artifact atlassian-foundation "$ADP_TOOLS_ADAPTER_RELEASE_DIR/atlassian-stage-summary.json"
      - name: Remove private stage inputs
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/adp-adapter-stage"
