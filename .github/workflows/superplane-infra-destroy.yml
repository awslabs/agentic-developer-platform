name: Superplane Infra Destroy

# Terraform destroy for the Superplane control plane.
# Issue #5042 (U3), EPIC #4910.
#
# THERE IS NO `cyber-infra-destroy.yml` TO MIRROR.
#
# The issue names the `cyber-infra-*` pattern for this unit's three Terraform lanes, and for
# plan and apply that is exactly what these files copy. But the cyber module ships only two
# workflows — `cyber-infra-plan.yml` and `cyber-infra-apply.yml`, 306 lines over three files
# counting `cyber-k8s-deploy.yml`. So the destroy pattern is taken from the per-module destroy
# workflows CLAUDE.md names as the convention (`agent-context-infra-destroy.yml`,
# `gateway-infra-destroy.yml`, `platform-infra-destroy.yml`) plus the typed-account-ID gate
# from `undeploy.yml`. Recording that here because "matches the cyber pattern" would be a
# false claim about a file that does not exist, and the next author deserves to know which
# precedent was actually followed.
#
# TWO GATES, CHECKING DIFFERENT THINGS
#
# 1. A typed module name — `agent-context-infra-destroy.yml`'s convention. Stops the wrong
#    module being destroyed from a dispatch list where every entry looks alike.
# 2. A typed 12-digit account ID matched against the caller's real identity — `undeploy.sh`
#    and `undeploy.yml`'s convention. Stops the right module being destroyed in the wrong
#    account.
#
# Neither substitutes for the other. Gate 1 is about intent, gate 2 about target, and the
# expensive mistakes in this repo's history are of the second kind.
#
# WHAT THIS LANE MUST NOT BE ABLE TO DO
#
# Destroy the platform. The platform-isolation requirement (2026-09-16) says a domain app
# consumes approved platform interfaces without destroying core platform resources, and adds
# that "a separate state key alone does not prove resource isolation". This lane therefore
# inspects `terraform state list` before destroying and refuses if a platform-owned resource
# has somehow been taken into this module's state. `tests/test_platform_isolation.py` asserts
# the same property against the source at PR time; this is the check against reality, at the
# only moment where being wrong is unrecoverable.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "superplane" to confirm destruction of this domain module'
        required: true
        type: string
      account_id:
        description: 'Type the 12-digit AWS account ID to destroy in (must match the runner identity)'
        required: true
        type: string
      environment:
        description: 'Deployment environment'
        required: false
        default: 'dev'
        type: string

concurrency:
  # Shared with the apply lane on purpose: an apply and a destroy racing on one state object
  # is the corruption the lock table exists to catch, and catching it earlier is better.
  group: tf-apply-superplane
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  MODULE_NAME: superplane
  TF_WORKING_DIR: modules/domain-apps/superplane/infra/control-plane

jobs:
  destroy:
    name: Destroy Superplane Control Plane
    runs-on: arc-runner-org
    permissions:
      contents: read

    env:
      TF_VAR_environment: ${{ inputs.environment }}
      BACKEND_CONFIG: environments/${{ inputs.environment }}/modules/superplane-backend.tfvars
      VAR_FILE: environments/${{ inputs.environment }}/modules/superplane.tfvars

    steps:
      - name: Confirm module name
        env:
          SP_CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "$SP_CONFIRM" != "superplane" ]; then
            echo "::error::Input did not match 'superplane'. Aborting to prevent accidental destroy. Nothing was destroyed."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install required CLI tools
        run: |
          set -e
          if ! command -v zip >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends zip unzip curl gnupg
          fi
          if ! command -v aws >/dev/null 2>&1; then
            curl -sL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscli.zip
            unzip -q /tmp/awscli.zip -d /tmp
            sudo /tmp/aws/install
            rm -rf /tmp/awscli.zip /tmp/aws
          fi
          if ! command -v terraform >/dev/null 2>&1; then
            curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
            echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" \
              | sudo tee /etc/apt/sources.list.d/hashicorp.list > /dev/null
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends terraform
          fi
          aws --version
          terraform version | head -1

      - name: Validate the typed account ID against the caller identity
        env:
          SP_INPUT_ACCOUNT: ${{ inputs.account_id }}
        # undeploy.yml's guard, applied per-module. The typed value must be well formed AND
        # must be the account this runner is actually authenticated to — a typo that happens
        # to be another real account is rejected rather than acted on.
        id: account
        run: |
          set -euo pipefail
          INPUT_ACCOUNT="$SP_INPUT_ACCOUNT"
          if ! printf '%s' "$INPUT_ACCOUNT" | grep -qE '^[0-9]{12}$'; then
            echo "::error::account_id must be exactly 12 digits. Nothing was destroyed."
            exit 1
          fi
          ACTUAL_ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          if [ "$INPUT_ACCOUNT" != "$ACTUAL_ACCOUNT" ]; then
            echo "::error::account_id input ($INPUT_ACCOUNT) does not match the account this runner is authenticated to ($ACTUAL_ACCOUNT). Aborting to prevent cross-account misfire. Nothing was destroyed."
            exit 1
          fi
          echo "account_id=$ACTUAL_ACCOUNT" >> "$GITHUB_OUTPUT"
          echo "Guard passed: destroying in account $ACTUAL_ACCOUNT."

      - name: Check the environment's files exist before touching state
        env:
          SP_ENVIRONMENT: ${{ inputs.environment }}
        # `environments/prod/` does not exist yet. Without this, a dispatch with
        # environment=prod would init against a missing backend file and fail somewhere less
        # legible — or, worse, init with a default backend and create a second state object.
        run: |
          set -euo pipefail
          for f in "${{ env.BACKEND_CONFIG }}" "${{ env.VAR_FILE }}"; do
            if [ ! -f "$f" ]; then
              echo "::error::${f} does not exist, so environment '${SP_ENVIRONMENT}' is not configured for this module. Nothing was destroyed."
              exit 1
            fi
          done

      - name: Resolve the target account into tfvars
        env:
          SP_ACCOUNT_ID: ${{ steps.account.outputs.account_id }}
        run: |
          set -euo pipefail
          sed -i "s/ACCOUNT_ID/${SP_ACCOUNT_ID}/g" \
            "${{ env.VAR_FILE }}" \
            "${{ env.BACKEND_CONFIG }}"

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend-config="../../../../../${{ env.BACKEND_CONFIG }}" -input=false

      - name: Platform-isolation guard on the state about to be destroyed
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          SP_ACCOUNT_ID: ${{ steps.account.outputs.account_id }}
          SP_ENVIRONMENT: ${{ inputs.environment }}
        # This is the load-bearing check in this file.
        #
        # `terraform destroy` deletes what is in STATE, not what is in the configuration. So
        # the question that matters is not "does this module declare a VPC" — the Python
        # guard answers that at PR time — but "has a VPC ever ended up in this state file",
        # via an import, a `moved` block, a hand-edited state, or a resource that was
        # declared here once and has since been deleted from the source without being removed
        # from state. In that last case the configuration is clean, the Python guard passes,
        # and destroy still deletes the platform's VPC.
        #
        # An ALLOWLIST, not a denylist: a denylist passes any resource type nobody thought to
        # forbid, and this is a one-way operation. Same reasoning, and the same type set, as
        # tests/test_platform_isolation.py.
        #
        # WHY THIS IS NOW TWO CHECKS AND A SAVED PLAN (PR #5283 review, finding 3).
        #
        # The previous inline version accepted state entries `aws_iam_role.gateway` and
        # `aws_ecr_repository.gateway`, printed that they were domain-owned, and would have
        # continued to destroy them. Its allowlist matched the resource TYPE, and both of
        # those types are ones this module legitimately owns — the INSTANCE is the gateway's.
        # `terraform state list` prints no values, so names cannot be attributed from it.
        #
        # So the type-level check below is a first gate only, and the destroy now runs from a
        # SAVED PLAN that is validated per-instance (the plan carries names and ARNs) before
        # being applied. `terraform destroy -auto-approve` was replaced because it re-plans
        # at apply time, meaning what got validated was not necessarily what got destroyed.
        run: |
          set -euo pipefail

          terraform state list > /tmp/state-list.txt || {
            echo "::error::Could not read Terraform state. Refusing to destroy blind."
            exit 1
          }

          set +e
          python3 "${GITHUB_WORKSPACE}/modules/domain-apps/superplane/infra/scripts/check_state_safety.py" \
            --state-list /tmp/state-list.txt \
            --account-id "$SP_ACCOUNT_ID" \
            --environment "$SP_ENVIRONMENT"
          STATE_CHECK=$?
          set -e

          # 0 = domain-owned, 1 = denied, 2 = empty state (nothing to destroy).
          case "$STATE_CHECK" in
            0) ;;
            2) echo "EMPTY_STATE=true" >> "$GITHUB_ENV" ;;
            *) exit 1 ;;
          esac

      - name: Save the destroy plan
        if: env.EMPTY_STATE != 'true'
        working-directory: ${{ env.TF_WORKING_DIR }}
        # `-out` then `show -json` then apply THAT FILE. The saved plan is the artifact the
        # ownership check below validates and the artifact `terraform apply` consumes, so
        # they cannot diverge.
        run: |
          set -euo pipefail
          terraform plan -destroy \
            -var-file="../../../../../${{ env.VAR_FILE }}" \
            -out=tfdestroyplan -input=false -no-color
          terraform show -json tfdestroyplan > /tmp/destroy-plan.json
          test -s /tmp/destroy-plan.json

      - name: Validate every deletion is domain-owned
        if: env.EMPTY_STATE != 'true'
        env:
          SP_ACCOUNT_ID: ${{ steps.account.outputs.account_id }}
          SP_ENVIRONMENT: ${{ inputs.environment }}
        # Per-instance attribution, which the state listing could not provide. Rejects
        # `aws_iam_role.gateway` on its NAME even though the type is one we own, rejects a
        # nested-module platform resource, rejects ARNs from another account, and rejects a
        # saved plan that deletes nothing (a stale or non-destroy plan file).
        run: |
          set -euo pipefail
          python3 modules/domain-apps/superplane/infra/scripts/check_plan_safety.py \
            --plan-json /tmp/destroy-plan.json \
            --expect-destroy \
            --account-id "$SP_ACCOUNT_ID" \
            --environment "$SP_ENVIRONMENT"

      - name: Terraform Destroy
        if: env.EMPTY_STATE != 'true'
        working-directory: ${{ env.TF_WORKING_DIR }}
        # Applies the SAVED, VALIDATED plan — not a fresh `destroy -auto-approve`, which
        # would re-plan and could delete something the validation never saw.
        run: terraform apply tfdestroyplan

      - name: Summary
        if: always()
        env:
          SP_ENVIRONMENT: ${{ inputs.environment }}
          SP_ACCOUNT_ID: ${{ steps.account.outputs.account_id }}
        run: |
          {
            echo "## Terraform Destroy -- ${{ env.MODULE_NAME }}"
            echo "- **Module**: ${{ env.MODULE_NAME }} (domain app)"
            echo "- **Environment**: ${SP_ENVIRONMENT}"
            echo "- **Account**: ${SP_ACCOUNT_ID}"
            echo "- **Status**: ${{ job.status }}"
            echo ""
            echo "### Survives by design"
            echo "- Secrets Manager secrets named by \`database_secret_name\` / \`jwt_secret_name\`"
            echo "  — this module never created them (it takes references, not values), so it"
            echo "  cannot and must not delete them."
            echo "- Everything platform-owned: VPC, EKS, any database, the Terraform state"
            echo "  backend. None of it is in this module's state."
            echo "- Kubernetes objects. Delete those via the rollout lane's own teardown, not here."
          } >> "$GITHUB_STEP_SUMMARY"
