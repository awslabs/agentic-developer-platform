name: Webhook Ingress Deploy

on:
  push:
    paths:
      - 'modules/agent-factory/webhook-ingress/**'
      - '.github/workflows/webhook-ingress-deploy.yml'
    branches:
      - main
  workflow_dispatch:
    inputs:
      account_id:
        description: 'Target AWS account (12 digits). Empty = use platform IRSA / config file.'
        required: false
        default: ''
      customer_account_id:
        description: 'Customer-linked AWS account to deploy into (cross-account mode). Triggers gateway-call assume.'
        required: false
        default: ''
      customer_aws_label:
        description: 'Vaulted credential label (when customer_account_id is set).'
        required: false
        default: ''
      customer_user_id:
        description: 'ADP users.id UUID (when customer_account_id is set).'
        required: false
        default: ''
      environment:
        description: 'Deployment environment (dev/staging/prod).'
        required: false
        default: 'dev'

concurrency:
  group: webhook-ingress-deploy-${{ inputs.customer_account_id || inputs.account_id || 'default' }}
  cancel-in-progress: false

env:
  # ACCOUNT_ID, AWS_REGION, ENVIRONMENT, STATE_BUCKET are populated at the
  # start of each job by the load-deploy-config composite action — values
  # come from config/deployment.yml (or runtime fallback). See:
  # .github/actions/load-deploy-config/action.yml
  MODULE_NAME: webhook-ingress
  TF_WORKING_DIR: modules/agent-factory/webhook-ingress/infra
  BACKEND_CONFIG: environments/dev/modules/webhook-ingress-backend.tfvars

jobs:
  changes:
    name: Detect changes
    runs-on: arc-runner-org
    outputs:
      code: ${{ steps.filter.outputs.code }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: filter
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "infra=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only HEAD^ HEAD)
          echo "Changed files:"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^modules/agent-factory/webhook-ingress/(lambda|common)/'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$CHANGED" | grep -qE '^modules/agent-factory/webhook-ingress/infra/'; then
            echo "infra=true" >> "$GITHUB_OUTPUT"
          else
            echo "infra=false" >> "$GITHUB_OUTPUT"
          fi

  package:
    name: Package Lambda Code
    runs-on: arc-runner-org
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.infra == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Load deployment config
        uses: ./.github/actions/load-deploy-config
        with:
          account_id: ${{ inputs.account_id }}
          environment: ${{ inputs.environment }}
          customer_account_id: ${{ inputs.customer_account_id }}
          customer_aws_label: ${{ inputs.customer_aws_label }}
          customer_user_id: ${{ inputs.customer_user_id }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Package Lambdas
        working-directory: modules/agent-factory/webhook-ingress
        run: |
          chmod +x scripts/package-lambdas.sh
          ./scripts/package-lambdas.sh

      - name: Upload artifacts to S3
        working-directory: modules/agent-factory/webhook-ingress
        run: |
          for zip in dist/*.zip; do
            BASENAME=$(basename "$zip")
            aws s3 cp "$zip" "s3://${STATE_BUCKET}/lambda-artifacts/webhook-ingress/${BASENAME}" \
              --metadata "commit=${{ github.sha }}"
          done
          echo "Uploaded Lambda artifacts to s3://${STATE_BUCKET}/lambda-artifacts/webhook-ingress/"

  deploy-infra:
    name: Terraform Apply
    runs-on: arc-runner-org
    needs: [changes, package]
    if: always() && needs.changes.outputs.infra == 'true' && needs.package.result == 'success'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load deployment config
        uses: ./.github/actions/load-deploy-config
        with:
          account_id: ${{ inputs.account_id }}
          environment: ${{ inputs.environment }}
          customer_account_id: ${{ inputs.customer_account_id }}
          customer_aws_label: ${{ inputs.customer_aws_label }}
          customer_user_id: ${{ inputs.customer_user_id }}

      - name: Install required CLI tools
        run: |
          set -e
          if ! command -v zip >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends zip unzip curl gnupg
          fi
          if ! command -v aws >/dev/null 2>&1; then
            curl -sL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscli.zip
            unzip -q /tmp/awscli.zip -d /tmp
            sudo /tmp/aws/install
            rm -rf /tmp/awscli.zip /tmp/aws
          fi
          if ! command -v terraform >/dev/null 2>&1; then
            curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
            echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" \
              | sudo tee /etc/apt/sources.list.d/hashicorp.list > /dev/null
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends terraform
          fi
          aws --version
          terraform version | head -1

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="../../../../${{ env.BACKEND_CONFIG }}" \
            -backend-config="bucket=${STATE_BUCKET}" \
            -input=false -reconfigure

      - name: Migrate stale kubernetes_manifest entries out of state
        # KEDA resources moved from `kubernetes_manifest` to `null_resource +
        # kubectl apply` in PR #364 — the hashicorp/kubernetes provider's
        # read-back reconciliation kept failing on this CRD's server-side
        # mutations. This step removes the old state entries so the next
        # apply doesn't try to destroy them. Safe to re-run: a missing
        # entry is a no-op.
        working-directory: ${{ env.TF_WORKING_DIR }}
        continue-on-error: true
        run: |
          for addr in kubernetes_manifest.agent_scaledjob kubernetes_manifest.trigger_auth; do
            if terraform state list | grep -qx "$addr"; then
              echo "Removing $addr from state (migrated to null_resource)"
              terraform state rm "$addr"
            fi
          done

      - name: Install kubectl
        run: |
          if ! command -v kubectl >/dev/null 2>&1; then
            curl -fsSL "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" -o /tmp/kubectl
            sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          fi
          kubectl version --client

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -var-file="terraform.tfvars" -auto-approve

      - name: Summary
        if: always()
        run: |
          echo "## Terraform Apply -- ${{ env.MODULE_NAME }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Module**: ${{ env.MODULE_NAME }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status**: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  update-code:
    name: Update Lambda Function Code
    runs-on: arc-runner-org
    needs: [changes, package, deploy-infra]
    if: |
      always() &&
      needs.changes.outputs.code == 'true' &&
      needs.package.result == 'success' &&
      (needs.deploy-infra.result == 'success' || needs.deploy-infra.result == 'skipped')
    steps:
      - uses: actions/checkout@v4

      - name: Load deployment config
        uses: ./.github/actions/load-deploy-config
        with:
          account_id: ${{ inputs.account_id }}
          environment: ${{ inputs.environment }}
          customer_account_id: ${{ inputs.customer_account_id }}
          customer_aws_label: ${{ inputs.customer_aws_label }}
          customer_user_id: ${{ inputs.customer_user_id }}

      - name: Update Lambda functions
        run: |
          set -e
          # List Lambda artifacts uploaded by the package job in S3
          ARTIFACTS=$(aws s3 ls "s3://${STATE_BUCKET}/lambda-artifacts/webhook-ingress/" \
            --region "${AWS_REGION}" | awk '{print $4}' | grep '\.zip$' || true)
          if [ -z "$ARTIFACTS" ]; then
            echo "No Lambda artifacts found in S3. Skipping update."
            exit 0
          fi
          # Function name template matches what Terraform creates in
          # infra/lambdas.tf: "${local.name_prefix}-github-webhook".
          # BASENAME comes from the zip (e.g. "github" → adp-dev-github-webhook).
          # Do NOT silently swallow ResourceNotFoundException — a missing
          # function means infra/code are out of sync and the deploy should
          # fail loudly, not pretend success.
          for zip_name in $ARTIFACTS; do
            BASENAME=$(basename "$zip_name" .zip)
            FUNCTION_NAME="adp-${ENVIRONMENT}-${BASENAME}-webhook"
            echo "Updating function: ${FUNCTION_NAME}"
            aws lambda update-function-code \
              --function-name "${FUNCTION_NAME}" \
              --s3-bucket "${STATE_BUCKET}" \
              --s3-key "lambda-artifacts/webhook-ingress/${BASENAME}.zip" \
              --region "${AWS_REGION}" \
              --publish
          done

  integration-test:
    name: Integration Tests
    runs-on: arc-runner-org
    needs: [update-code, deploy-infra]
    if: |
      always() &&
      (needs.update-code.result == 'success' || needs.deploy-infra.result == 'success')
    steps:
      - uses: actions/checkout@v4

      - name: Load deployment config
        uses: ./.github/actions/load-deploy-config
        with:
          account_id: ${{ inputs.account_id }}
          environment: ${{ inputs.environment }}
          customer_account_id: ${{ inputs.customer_account_id }}
          customer_aws_label: ${{ inputs.customer_aws_label }}
          customer_user_id: ${{ inputs.customer_user_id }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: modules/agent-factory/webhook-ingress
        run: |
          pip install pytest pytest-timeout 'boto3>=1.34' 'moto[dynamodb,cloudwatch,sqs]>=5.0'
          # Per-Lambda pip installs — each Lambda keeps its own requirements.txt
          for req in lambda/*/requirements.txt; do
            if [ -f "$req" ]; then pip install -r "$req"; fi
          done

      - name: Fetch integration test config from SSM
        id: ssm
        run: |
          ENDPOINT=$(aws ssm get-parameter \
            --name "/adp/${ENVIRONMENT}/webhook-ingress/endpoint" \
            --query "Parameter.Value" --output text --region "${AWS_REGION}")
          QUEUE_URL=$(aws ssm get-parameter \
            --name "/adp/${ENVIRONMENT}/webhook-ingress/sqs-queue-url" \
            --query "Parameter.Value" --output text --region "${AWS_REGION}")
          SECRET_ARN=$(aws ssm get-parameter \
            --name "/adp/${ENVIRONMENT}/webhook-ingress/webhook-secret-arn" \
            --query "Parameter.Value" --output text --region "${AWS_REGION}")
          SECRET_VALUE=$(aws secretsmanager get-secret-value \
            --secret-id "$SECRET_ARN" --query "SecretString" --output text --region "${AWS_REGION}")
          EVENTS_TABLE=$(aws ssm get-parameter \
            --name "/adp/${ENVIRONMENT}/webhook-ingress/webhook-events-table" \
            --query "Parameter.Value" --output text --region "${AWS_REGION}")
          echo "endpoint=$ENDPOINT" >> "$GITHUB_OUTPUT"
          echo "queue_url=$QUEUE_URL" >> "$GITHUB_OUTPUT"
          echo "events_table=$EVENTS_TABLE" >> "$GITHUB_OUTPUT"
          # Mask the secret so it doesn't appear in logs
          echo "::add-mask::$SECRET_VALUE"
          echo "secret=$SECRET_VALUE" >> "$GITHUB_OUTPUT"

      - name: Run integration tests
        working-directory: modules/agent-factory/webhook-ingress
        env:
          TEST_ENV: dev
          WEBHOOK_ENDPOINT: ${{ steps.ssm.outputs.endpoint }}
          WEBHOOK_SECRET: ${{ steps.ssm.outputs.secret }}
          WEBHOOK_SQS_QUEUE_URL: ${{ steps.ssm.outputs.queue_url }}
          WEBHOOK_EVENTS_TABLE: ${{ steps.ssm.outputs.events_table }}
        run: |
          pytest tests/ -m integration -v --tb=short --timeout=120

      - name: Summary
        if: always()
        run: |
          echo "## Webhook Ingress Deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit**: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Integration tests**: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
