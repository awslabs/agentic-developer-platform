name: Agent Worker Image Build

# Builds and pushes the `adp-agent-runtime` image — the hosted agent
# worker spawned by the KEDA ScaledJob on SQS messages from the
# webhook-ingress pipeline (EPIC #308).
#
# Mirrors the arc-runner-build.yml pattern:
#   ARC runner → zip source → start CodeBuild → wait → done.
#
# Image pushed to ECR repo `adp-agent-runtime`, tagged with the commit SHA
# and `latest`. The ScaledJob references it via var.agent_image in
# modules/agent-factory/webhook-ingress/infra/ (default: adp-agent:latest).

on:
  push:
    paths:
      - 'modules/agent-factory/agent/**'
      - 'modules/agent-factory/agent-worker-image/**'
      - 'modules/agent-factory/rules/personas/**'
      - 'modules/domain-apps/*/agent/**'
      - 'codebuild/bs-agent-runtime.yml'
      - '.github/workflows/agent-worker-image.yml'
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: dev
  ACCOUNT_ID: "879318057152"
  STATE_BUCKET: adp-terraform-state-879318057152
  CODEBUILD_PROJECT: adp-dev-agent-runtime

jobs:
  build:
    name: Build Agent Runtime Image
    runs-on: arc-runner-org
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install zip + AWS CLI (bootstrap)
        run: |
          set -e
          if ! command -v zip >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends zip unzip curl
          fi
          if ! command -v aws >/dev/null 2>&1; then
            curl -sL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscli.zip
            unzip -q /tmp/awscli.zip -d /tmp
            sudo /tmp/aws/install
            rm -rf /tmp/awscli.zip /tmp/aws
          fi
          aws --version

      - name: Package source and upload to S3
        run: |
          bash platform/scripts/zip-source.sh . /tmp/adp-source.zip
          aws s3 cp /tmp/adp-source.zip \
            "s3://${{ env.STATE_BUCKET }}/codebuild/adp-source.zip" \
            --region "${{ env.AWS_REGION }}"
          rm -f /tmp/adp-source.zip

      - name: Verify CodeBuild project exists
        run: |
          EXISTS=$(aws codebuild batch-get-projects \
            --names "${{ env.CODEBUILD_PROJECT }}" \
            --region "${{ env.AWS_REGION }}" \
            --query 'projects | length(@)' --output text 2>/dev/null || echo "0")
          if [ "$EXISTS" -eq 0 ]; then
            echo "CodeBuild project ${{ env.CODEBUILD_PROJECT }} does not exist." >&2
            echo "Run Platform Infra Apply to create it (defined in platform/infra/modules/codebuild/main.tf)." >&2
            exit 1
          fi

      - name: Build image via CodeBuild
        id: build
        run: |
          REGISTRY="${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          IMAGE_TAG="${{ github.sha }}"
          BUILD_ID=$(aws codebuild start-build \
            --region "${{ env.AWS_REGION }}" \
            --project-name "${{ env.CODEBUILD_PROJECT }}" \
            --environment-variables-override \
              "name=AWS_REGION,value=${{ env.AWS_REGION }}" \
              "name=ACCOUNT_ID,value=${{ env.ACCOUNT_ID }}" \
              "name=REGISTRY,value=${REGISTRY}" \
              "name=IMAGE_TAG,value=${IMAGE_TAG}" \
            --query 'build.id' --output text)
          echo "Started CodeBuild: $BUILD_ID"
          echo "build_id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/adp-agent-runtime:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

          PHASE=""
          while true; do
            RESULT=$(aws codebuild batch-get-builds --ids "$BUILD_ID" --region "${{ env.AWS_REGION }}" --query 'builds[0].{s:buildStatus,p:currentPhase}' --output json 2>/dev/null)
            STATUS=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['s'])" 2>/dev/null || echo "IN_PROGRESS")
            CUR_PHASE=$(echo "$RESULT" | python3 -c "import sys,json; print(json.load(sys.stdin)['p'])" 2>/dev/null || echo "")
            [ "$CUR_PHASE" != "$PHASE" ] && [ -n "$CUR_PHASE" ] && echo "Phase: $CUR_PHASE" && PHASE="$CUR_PHASE"
            case "$STATUS" in
              SUCCEEDED) echo "Build succeeded"; break ;;
              FAILED|FAULT|STOPPED|TIMED_OUT)
                LOG=$(aws codebuild batch-get-builds --ids "$BUILD_ID" --region "${{ env.AWS_REGION }}" --query 'builds[0].logs.deepLink' --output text 2>/dev/null || echo "")
                echo "Build failed ($STATUS). Logs: $LOG" >&2
                exit 1
                ;;
              *) sleep 15 ;;
            esac
          done

      - name: Summary
        run: |
          echo "## Agent Runtime Image Built" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image**: ${{ steps.build.outputs.image }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **CodeBuild**: ${{ steps.build.outputs.build_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The KEDA ScaledJob pulls \`adp-agent:latest\` by default. Update \`var.agent_image\` in webhook-ingress TF to pin a specific SHA." >> "$GITHUB_STEP_SUMMARY"
