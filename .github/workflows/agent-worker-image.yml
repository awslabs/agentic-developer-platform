name: Agent Worker Image Build

# Builds and pushes the `adp-agent-runtime` image — the hosted agent
# worker spawned by the KEDA ScaledJob on SQS messages from the
# webhook-ingress pipeline (EPIC #308).
#
# Mirrors the arc-runner-build.yml pattern:
#   ARC runner → zip source → start CodeBuild → wait → done.
#
# Image pushed to ECR repo `adp-agent-runtime`, tagged with the commit SHA
# and `latest`. The ScaledJob references it via var.agent_image in
# modules/agent-factory/webhook-ingress/infra/ (default: adp-agent:latest).

on:
  pull_request:
    paths:
      - 'modules/agent-factory/agent/**'
      - 'modules/agent-factory/agent-worker-image/**'
      - 'modules/agent-factory/codex-reviewer/**'
      - 'modules/agent-factory/codex-harness/**'
      - 'modules/agent-factory/task-agents/investigator/**'
      - 'modules/tools/task-sdk/**'
      - 'tests/task-api/test_model_message_seam.py'
      - 'modules/agent-factory/rules/personas/**'
      - 'modules/agent-factory/skills/**'
      - 'modules/domain-apps/*/agent/**'
      - 'codebuild/bs-agent-runtime.yml'
      - '.github/workflows/agent-worker-image.yml'
      - 'modules/gateway/src/agentauth/task_runtime_routes.py'
      - 'modules/gateway/src/agentauth/task_model.py'
      # Documentation-only changes do not start this workflow.
      - '!docs/**'
      - '!**/docs/**'
      - '!**/README*'
      - '!**/CHANGELOG*'
      - '!**/CONTRIBUTING*'
      - '!**/*.rst'
  push:
    paths:
      - 'modules/agent-factory/agent/**'
      - 'modules/agent-factory/agent-worker-image/**'
      - 'modules/agent-factory/codex-reviewer/**'
      - 'modules/agent-factory/codex-harness/**'
      - 'modules/agent-factory/task-agents/investigator/**'
      - 'modules/tools/task-sdk/**'
      - 'tests/task-api/test_model_message_seam.py'
      - 'modules/agent-factory/rules/personas/**'
      - 'modules/agent-factory/skills/**'
      - 'modules/domain-apps/*/agent/**'
      - 'codebuild/bs-agent-runtime.yml'
      - '.github/workflows/agent-worker-image.yml'
      # Documentation-only changes do not start this workflow.
      - '!docs/**'
      - '!**/docs/**'
      - '!**/README*'
      - '!**/CHANGELOG*'
      - '!**/CONTRIBUTING*'
      - '!**/*.rst'
    branches:
      - main
  workflow_dispatch:
    inputs:
      account_id:
        description: 'Target AWS account (12 digits). Empty = use platform IRSA / config file.'
        required: false
        default: ''
      customer_account_id:
        description: 'Customer-linked AWS account to build into (cross-account mode).'
        required: false
        default: ''
      customer_aws_label:
        description: 'Vaulted credential label.'
        required: false
        default: ''
      customer_user_id:
        description: 'ADP users.id UUID.'
        required: false
        default: ''
      environment:
        description: 'Deployment environment.'
        required: false
        default: 'dev'

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: dev
  CODEBUILD_PROJECT: adp-dev-agent-runtime

jobs:
  installation-boundary-tests:
    name: GitHub Installation Boundary Tests
    runs-on: arc-runner-org
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: modules/agent-factory/agent/package-lock.json
      - name: Test installation resolution and token refresh boundaries
        working-directory: modules/agent-factory/agent
        run: |
          npm ci --include=dev --ignore-scripts
          npx jest --runInBand --runTestsByPath \
            src/utils/installation.test.ts \
            src/utils/installation-redirect.test.ts \
            src/utils/ghPost.test.ts \
            src/agent-worker-installation-resolution.test.ts \
            src/invocability-probe/native-runner.test.ts \
            src/invocability-probe/gateway-client.test.ts

  codex-tests:
    name: Codex Adapter Unit Tests
    runs-on: arc-runner-org
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: modules/agent-factory/codex-reviewer/package-lock.json
      - name: Build and test Codex adapter
        working-directory: modules/agent-factory/codex-reviewer
        run: |
          npm ci && npm test
          node --test scripts/native-probe-shape.test.mjs
          node scripts/generate-native-probe-manifest.mjs --check
      - name: Preserve synthetic probe mismatch diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-probe-diagnostics
          path: ${{ runner.temp }}/adp-native-probe-diagnostics/*.json
          if-no-files-found: ignore
          retention-days: 3

  task-investigator-tests:
    name: Task API Investigator Unit Tests
    runs-on: arc-runner-org
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: modules/agent-factory/task-agents/investigator/package-lock.json
      # --include=dev because the package's only dependencies are the TypeScript
      # toolchain; a runner with NODE_ENV=production would otherwise install
      # nothing and fail at the compile step.
      - name: Build and test the investigator task agent
        working-directory: modules/agent-factory/task-agents/investigator
        run: npm ci --include=dev && npm test
      - name: Verify pinned Codex binary against the Task start protocol
        run: |
          set -euo pipefail
          task_test_dir=$(mktemp -d)
          trap 'rm -rf "$task_test_dir"' EXIT
          export HOME="$task_test_dir/home" BG_CONFIG_DIR="$task_test_dir/bg" CODEX_HOME="$task_test_dir/codex"
          export XDG_CONFIG_HOME="$task_test_dir/config" XDG_CACHE_HOME="$task_test_dir/cache" XDG_DATA_HOME="$task_test_dir/data"
          export XDG_STATE_HOME="$task_test_dir/state" XDG_RUNTIME_DIR="$task_test_dir/runtime"
          export AWS_CONFIG_FILE="$task_test_dir/aws-config" AWS_SHARED_CREDENTIALS_FILE="$task_test_dir/aws-credentials" AWS_EC2_METADATA_DISABLED=true
          mkdir -p "$HOME"
          codex_version=$(sed -n 's/^ARG CODEX_VERSION=//p' modules/agent-factory/agent-worker-image/Dockerfile)
          npm install --prefix "$task_test_dir/package" --ignore-scripts --no-audit --no-fund "@openai/codex@$codex_version"
          CODEX_BRIDGE_TEST_BIN="$task_test_dir/package/node_modules/.bin/codex" node --test modules/tools/task-sdk/test/*.test.mjs
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: modules/gateway/pyproject.toml
      - name: Install actual gateway and host seam dependencies
        run: pip install -e './modules/gateway[dev]' requests
      - name: Verify actual child to gateway model HTTP contract
        run: pytest -q tests/task-api/test_model_message_seam.py

  model-readiness:
    name: Verify Runtime Model Readiness
    if: github.ref == 'refs/heads/main' && (github.event_name != 'pull_request')
    runs-on: arc-runner-org
    environment: adp-model-checks-${{ inputs.environment || 'dev' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Establish trusted model checks identity
        uses: ./.github/actions/trusted-checks
        with:
          role_arn: ${{ vars.ADP_CHECKS_ROLE_ARN }}
          region: ${{ vars.ADP_DEPLOY_REGION || 'us-east-1' }}
      - name: Verify default model access before publishing the runtime
        run: bash platform/scripts/enable-bedrock-models.sh --verify

  build:
    needs: model-readiness
    name: Build Agent Runtime Image
    if: github.ref == 'refs/heads/main' && (github.event_name != 'pull_request')
    runs-on: arc-runner-org
    environment: adp-build-${{ inputs.environment || 'dev' }}
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Verify source belongs to reviewed main history
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$GITHUB_SHA"
          git merge-base --is-ancestor HEAD FETCH_HEAD

      - name: Establish trusted build identity
        uses: ./.github/actions/trusted-build
        with:
          role_arn: ${{ vars.ADP_BUILD_ROLE_ARN }}
          region: ${{ vars.ADP_DEPLOY_REGION || 'us-east-1' }}

      - name: Load deployment config
        uses: ./.github/actions/load-deploy-config
        with:
          account_id: ${{ inputs.account_id }}
          environment: ${{ inputs.environment }}
          customer_account_id: ${{ inputs.customer_account_id }}
          customer_aws_label: ${{ inputs.customer_aws_label }}
          customer_user_id: ${{ inputs.customer_user_id }}

      - name: Install zip + AWS CLI (bootstrap)
        run: |
          set -euo pipefail
          for tool in aws terraform kubectl helm jq zip unzip curl git python3 node npm; do
            command -v "$tool" >/dev/null || { echo "::error::Reviewed runner image is missing $tool"; exit 1; }
          done
      - name: Verify CodeBuild project exists
        run: |
          EXISTS=$(aws codebuild batch-get-projects \
            --names "${{ env.CODEBUILD_PROJECT }}" \
            --region "${AWS_REGION}" \
            --query 'projects | length(@)' --output text)
          if [ "$EXISTS" -eq 0 ]; then
            echo "CodeBuild project ${{ env.CODEBUILD_PROJECT }} does not exist." >&2
            echo "Run Platform Infra Apply to create it (defined in platform/infra/modules/codebuild/main.tf)." >&2
            exit 1
          fi

      - name: Build image via CodeBuild
        id: build
        uses: ./.github/actions/codebuild-run
        with:
          project_name: ${{ env.CODEBUILD_PROJECT }}
          region: ${{ env.AWS_REGION }}
          state_bucket: ${{ env.STATE_BUCKET }}
          environment_variables: >-
            "name=AWS_REGION,value=${{ env.AWS_REGION }}"
            "name=ACCOUNT_ID,value=${{ env.ACCOUNT_ID }}"
            "name=REGISTRY,value=${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
            "name=IMAGE_TAG,value=${{ github.sha }}"

      - name: Export outputs
        id: build_outputs
        run: |
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "build_id=${{ steps.build.outputs.build_id }}" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/adp-agent-runtime:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          echo "## Agent Runtime Image Built" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image**: ${{ steps.build_outputs.outputs.image }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **CodeBuild**: ${{ steps.build.outputs.build_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The KEDA ScaledJob pulls \`adp-agent:latest\` by default. Update \`var.agent_image\` in webhook-ingress TF to pin a specific SHA." >> "$GITHUB_STEP_SUMMARY"
