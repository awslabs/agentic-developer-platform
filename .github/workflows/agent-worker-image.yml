name: "Build: adp-agent worker image"

on:
  push:
    branches: [main]
    paths:
      - "modules/agent-factory/agent/**"
      - "modules/agent-factory/agent-worker-image/**"
      - "modules/domain-apps/*/agent/**"
  pull_request:
    branches: [main]
    paths:
      - "modules/agent-factory/agent/**"
      - "modules/agent-factory/agent-worker-image/**"
      - "modules/domain-apps/*/agent/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: adp-agent-runtime
  IMAGE_NAME: adp-agent

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image metadata
        id: meta
        run: |
          REGISTRY="${{ steps.ecr-login.outputs.registry }}"
          GIT_SHA="${{ github.sha }}"
          SHORT_SHA="${GIT_SHA:0:7}"
          echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"
          echo "git_sha=${GIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_base=${REGISTRY}/${ECR_REPOSITORY}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: modules/agent-factory/agent-worker-image/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.image_base }}:${{ steps.meta.outputs.git_sha }}
            ${{ steps.meta.outputs.image_base }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Verify image size (build-only on PRs)
        if: github.event_name == 'pull_request'
        run: |
          # On PRs we build but don't push — check local image size
          docker images "${{ steps.meta.outputs.image_base }}" --format "{{.Size}}" | head -1
          echo "Image built successfully for PR validation"

      - name: Post image digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "## Image Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Repository:** \`${{ steps.meta.outputs.image_base }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tags:** \`${{ steps.meta.outputs.git_sha }}\`, \`latest\`" >> "$GITHUB_STEP_SUMMARY"
