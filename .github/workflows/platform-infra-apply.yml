name: Platform Infra Apply

on:
  # Manual-only trigger. Merging a PR does NOT auto-apply infra; operator
  # reviews the plan comment on the merged PR, then triggers this workflow
  # explicitly via Actions → Platform Infra Apply → Run workflow. Rationale:
  #   - Separates "reviewed" from "deployed" (no Friday-night surprise applies).
  #   - Prevents approval fatigue (plan/apply are distinct deliberate acts).
  #   - Lets operators batch applies across multiple merged PRs.
  #   - Matches the project's "carefully consider reversibility" rule.
  workflow_dispatch:
    inputs:
      account_id:
        description: 'Target AWS account (12 digits). Empty = use platform IRSA / config file.'
        required: false
        default: ''
      customer_account_id:
        description: 'Customer-linked AWS account to deploy into (cross-account mode). Triggers gateway-call assume.'
        required: false
        default: ''
      customer_aws_label:
        description: 'Vaulted credential label (when customer_account_id is set).'
        required: false
        default: ''
      customer_user_id:
        description: 'ADP users.id UUID (when customer_account_id is set).'
        required: false
        default: ''
      environment:
        description: 'Deployment environment (dev/staging/prod).'
        required: false
        default: 'dev'
      confirm_destructive_apply:
        description: 'Set to "yes" to authorize an apply that destroys resources. Required when terraform plan includes any destroys.'
        required: false
        default: 'no'

concurrency:
  group: tf-apply-platform-${{ inputs.customer_account_id || inputs.account_id || 'default' }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_VAR_environment: dev
  MODULE_NAME: platform
  TF_WORKING_DIR: platform/infra
  BACKEND_CONFIG: environments/dev/backend.tfvars
  VAR_FILE: environments/dev/platform.tfvars

jobs:
  apply:
    name: Terraform Apply
    runs-on: arc-runner-org
    # ARC runner has IRSA via adp-dev-agent-runner-role — no AWS_ROLE_ARN needed
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load deployment config
        uses: ./.github/actions/load-deploy-config
        with:
          account_id: ${{ inputs.account_id }}
          environment: ${{ inputs.environment }}
          customer_account_id: ${{ inputs.customer_account_id }}
          customer_aws_label: ${{ inputs.customer_aws_label }}
          customer_user_id: ${{ inputs.customer_user_id }}

      # Bootstrap CLI tools (no-op once custom runner image rolls out everywhere)
      - name: Install required CLI tools
        run: |
          set -e
          if ! command -v zip >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends zip unzip curl gnupg
          fi
          if ! command -v aws >/dev/null 2>&1; then
            curl -sL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscli.zip
            unzip -q /tmp/awscli.zip -d /tmp
            sudo /tmp/aws/install
            rm -rf /tmp/awscli.zip /tmp/aws
          fi
          if ! command -v terraform >/dev/null 2>&1; then
            curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
            echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" \
              | sudo tee /etc/apt/sources.list.d/hashicorp.list > /dev/null
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends terraform
          fi
          aws --version
          terraform version | head -1

      # Auto-detect operator's public IP for EKS API endpoint restriction.
      # Matches the pattern used by deploy-all.sh (3-URL fallback + empty guard).
      - name: Set EKS public access CIDRs
        run: |
          if [ -z "${TF_VAR_eks_public_access_cidrs:-}" ]; then
            MY_IP=""
            for url in https://checkip.amazonaws.com https://api.ipify.org https://ifconfig.me; do
              MY_IP=$(curl -fsS --max-time 5 "$url" 2>/dev/null | tr -d '[:space:]' || true)
              [ -n "$MY_IP" ] && break
            done
            if [ -z "$MY_IP" ]; then
              echo "::error::Could not detect runner public IP. Set TF_VAR_eks_public_access_cidrs manually."
              exit 1
            fi
            echo "TF_VAR_eks_public_access_cidrs=[\"${MY_IP}/32\"]" >> "$GITHUB_ENV"
            echo "Auto-detected runner IP: ${MY_IP}/32"
          fi

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="../../${{ env.BACKEND_CONFIG }}" \
            -backend-config="bucket=${STATE_BUCKET}" \
            -input=false -reconfigure

      # Plan first to check for destroys (destroy-safety gate)
      - name: Terraform Plan (destroy-safety check)
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -e
          set -o pipefail
          EXIT_CODE=0
          terraform plan -var-file="../../${{ env.VAR_FILE }}" -out=tfplan -detailed-exitcode -no-color 2>&1 | tee /tmp/plan-output.txt || EXIT_CODE=$?
          echo "detailed_exitcode=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          # Exit code 0 = no changes, 1 = error, 2 = changes present
          if [ "$EXIT_CODE" -eq 1 ]; then
            echo "::error::Terraform plan failed."
            exit 1
          fi

      - name: Destroy-safety gate
        if: steps.plan.outputs.detailed_exitcode == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          DESTROYS=$(grep -c 'will be destroyed' /tmp/plan-output.txt 2>/dev/null) || DESTROYS=0
          if [ "$DESTROYS" -le 0 ]; then
            echo "No destroys in plan. Proceeding."
            exit 0
          fi

          echo "Plan includes $DESTROYS resource(s) to destroy."
          echo ""
          echo "Resources to be destroyed:"
          grep 'will be destroyed' /tmp/plan-output.txt || true
          echo ""

          # workflow_dispatch: require explicit operator confirmation.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.confirm_destructive_apply }}" = "yes" ]; then
              echo "Operator-confirmed destructive apply (confirm_destructive_apply=yes). Proceeding."
              exit 0
            fi
            echo "::error::This workflow_dispatch run schedules $DESTROYS destroy(s)."
            echo "::error::Re-run with confirm_destructive_apply=yes to authorize. Or fix the underlying drift first."
            exit 1
          fi

          # push / other events: require destructive-apply-approved label on the merged PR.
          COMMIT_SHA="${{ github.sha }}"
          PR_NUMBER=$(gh pr list --state merged --search "$COMMIT_SHA" --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
          if [ -z "$PR_NUMBER" ]; then
            echo "::error::This apply would destroy $DESTROYS resource(s) but no associated merged PR was found for SHA $COMMIT_SHA. Cannot verify destructive-apply-approved label."
            exit 1
          fi
          echo "Associated PR: #$PR_NUMBER"

          LABELS=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name' 2>/dev/null || echo "")
          if echo "$LABELS" | grep -qx 'destructive-apply-approved'; then
            echo "PR #$PR_NUMBER has 'destructive-apply-approved' label. Proceeding."
          else
            echo "::error::This apply would destroy $DESTROYS resource(s). PR #$PR_NUMBER does NOT have the 'destructive-apply-approved' label."
            echo "::error::Add the label to PR #$PR_NUMBER and re-run, or trigger manually with confirm_destructive_apply=yes."
            exit 1
          fi

      - name: Terraform Apply
        id: apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply tfplan

      - name: Summary
        if: always()
        run: |
          echo "## Terraform Apply -- ${{ env.MODULE_NAME }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Module**: ${{ env.MODULE_NAME }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status**: ${{ steps.apply.outcome == 'success' && 'applied' || 'failed' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Working dir**: ${{ env.TF_WORKING_DIR }}" >> "$GITHUB_STEP_SUMMARY"
