name: Platform Infra Apply

on:
  # Manual-only trigger. Merging a PR does NOT auto-apply infra; operator
  # reviews the plan comment on the merged PR, then triggers this workflow
  # explicitly via Actions → Platform Infra Apply → Run workflow. Rationale:
  #   - Separates "reviewed" from "deployed" (no Friday-night surprise applies).
  #   - Prevents approval fatigue (plan/apply are distinct deliberate acts).
  #   - Lets operators batch applies across multiple merged PRs.
  #   - Matches the project's "carefully consider reversibility" rule.
  workflow_dispatch:
    inputs:
      account_id:
        description: 'Target AWS account (12 digits). Empty = use platform IRSA / config file.'
        required: false
        default: ''
      customer_account_id:
        description: 'Customer-linked AWS account to deploy into (cross-account mode). Triggers gateway-call assume.'
        required: false
        default: ''
      customer_aws_label:
        description: 'Vaulted credential label (when customer_account_id is set).'
        required: false
        default: ''
      customer_user_id:
        description: 'ADP users.id UUID (when customer_account_id is set).'
        required: false
        default: ''
      environment:
        description: 'Deployment environment (dev/staging/prod).'
        required: false
        default: 'dev'
      confirm_destructive_apply:
        description: 'Set to "yes" to authorize an apply that destroys resources. Required when terraform plan includes any destroys.'
        required: false
        default: 'no'
      # Named, tightly-audited apply scopes (#5006). Runtime validation and
      # fixed branches prevent arbitrary targets; the choice UI alone cannot.
      # The scope selects a fixed branch below and is NEVER
      # interpolated into a terraform command. Do not add a free-text target
      # input — that would turn this workflow into a general-purpose "apply
      # anything unaudited" primitive, which is worse than the problem the
      # scoped path solves.
      #
      # Every non-full scope is gated by .github/scripts/verify_scoped_plan.py,
      # which refuses unless the saved plan's only non-no-op change is that
      # scope's single hardcoded address. Adding an option here without adding
      # it to that script's SCOPES table fails closed.
      scope:
        description: 'Apply scope. "full" = normal complete apply (default). "network-policy-controller" = ONLY the Auto Mode network-policy ConfigMap.'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - network-policy-controller
          - network-policy-controller-rollback
      plan_only:
        description: 'Scoped paths only: validate the saved plan without applying it.'
        required: false
        default: false
        type: boolean

concurrency:
  group: tf-apply-platform-${{ inputs.customer_account_id || inputs.account_id || 'default' }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_VAR_environment: dev
  MODULE_NAME: platform
  TF_WORKING_DIR: platform/infra
  BACKEND_CONFIG: environments/dev/backend.tfvars
  VAR_FILE: environments/dev/platform.tfvars

jobs:
  apply:
    name: Terraform Apply
    runs-on: arc-runner-org
    # ARC runner has IRSA via adp-dev-agent-runner-role — no AWS_ROLE_ARN needed
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Fail fast on an unrecognised scope (#5006). A choice option added to
      # the dispatch input without a matching SCOPES entry in the guard must
      # refuse here rather than fall through to the full-apply path.
      - name: Validate apply scope
        if: inputs.scope != '' && inputs.scope != 'full' || inputs.plan_only
        env:
          APPLY_SCOPE: ${{ inputs.scope || 'full' }}
        run: |
          python3 .github/scripts/verify_scoped_plan.py \
            --mode validate-scope --scope "$APPLY_SCOPE"
          if [ "$APPLY_SCOPE" = full ]; then
            echo '::error::plan_only is supported only for scoped plans.'
            exit 1
          fi

      - name: Load deployment config
        uses: ./.github/actions/load-deploy-config
        with:
          account_id: ${{ inputs.account_id }}
          environment: ${{ inputs.environment }}
          customer_account_id: ${{ inputs.customer_account_id }}
          customer_aws_label: ${{ inputs.customer_aws_label }}
          customer_user_id: ${{ inputs.customer_user_id }}

      # Bootstrap CLI tools (no-op once custom runner image rolls out everywhere)
      - name: Install required CLI tools
        run: |
          set -e
          if ! command -v zip >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends zip unzip curl gnupg
          fi
          if ! command -v aws >/dev/null 2>&1; then
            curl -sL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscli.zip
            unzip -q /tmp/awscli.zip -d /tmp
            sudo /tmp/aws/install
            rm -rf /tmp/awscli.zip /tmp/aws
          fi
          if ! command -v terraform >/dev/null 2>&1; then
            curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
            echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" \
              | sudo tee /etc/apt/sources.list.d/hashicorp.list > /dev/null
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends terraform
          fi
          aws --version
          terraform version | head -1

      # Accept Bedrock marketplace agreements for the Claude models the
      # platform invokes. Fresh customer accounts have none; without them
      # every model call fails with AccessDeniedException and the
      # agent-worker misreports it as "no changes needed" (812447483903
      # smoke-test incident, 2026-07-04). Idempotent — skips enabled models.
      - name: Enable Bedrock model access
        if: inputs.scope == '' || inputs.scope == 'full'
        run: bash platform/scripts/enable-bedrock-models.sh

      # Auto-detect operator's public IP for EKS API endpoint restriction.
      # Matches the pattern used by deploy-all.sh (3-URL fallback + empty guard).
      - name: Set EKS public access CIDRs
        if: inputs.scope == '' || inputs.scope == 'full'
        run: |
          if [ -z "${TF_VAR_eks_public_access_cidrs:-}" ]; then
            MY_IP=""
            for url in https://checkip.amazonaws.com https://api.ipify.org https://ifconfig.me; do
              MY_IP=$(curl -fsS --max-time 5 "$url" 2>/dev/null | tr -d '[:space:]' || true)
              [ -n "$MY_IP" ] && break
            done
            if [ -z "$MY_IP" ]; then
              echo "::error::Could not detect runner public IP. Set TF_VAR_eks_public_access_cidrs manually."
              exit 1
            fi
            echo "TF_VAR_eks_public_access_cidrs=[\"${MY_IP}/32\"]" >> "$GITHUB_ENV"
            echo "Auto-detected runner IP: ${MY_IP}/32"
          fi

      # Preserve the live endpoint allowlist: detecting a new runner IP can
      # introduce a cluster update through the target's dependency graph.
      - name: Verify scoped target and preserve EKS public access CIDRs
        if: inputs.scope != '' && inputs.scope != 'full'
        env:
          REQUESTED_ACCOUNT: ${{ inputs.account_id }}
        run: |
          set -euo pipefail
          IDENTITY_ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          if [ "$ACCOUNT_ID" != 879318057152 ] || [ "$IDENTITY_ACCOUNT" != "$ACCOUNT_ID" ]; then
            echo '::error::Scoped target account mismatch.'
            exit 1
          fi
          if [ -n "$REQUESTED_ACCOUNT" ] && [ "$REQUESTED_ACCOUNT" != "$ACCOUNT_ID" ]; then
            echo '::error::Requested account does not match scoped target.'
            exit 1
          fi
          if [ "$ENVIRONMENT" != dev ] || [ "$AWS_REGION" != us-east-1 ] || [ -n "${CUSTOMER_ACCOUNT_ID:-}" ]; then
            echo '::error::Controller scopes currently support the dev platform cluster only.'
            exit 1
          fi
          CLUSTER_ARN=$(aws eks describe-cluster --name adp-dev-eks-cluster --query cluster.arn --output text)
          if [ "$CLUSTER_ARN" != arn:aws:eks:us-east-1:879318057152:cluster/adp-dev-eks-cluster ]; then
            echo '::error::Unexpected scoped cluster.'
            exit 1
          fi
          CIDRS=$(aws eks describe-cluster --name adp-dev-eks-cluster \
            --query cluster.resourcesVpcConfig.publicAccessCidrs --output json)
          CIDRS=$(printf '%s' "$CIDRS" | python3 -c 'import ipaddress,json,sys; v=json.load(sys.stdin); assert isinstance(v,list) and v; [ipaddress.ip_network(c) for c in v]; print(json.dumps(v))')
          echo "TF_VAR_eks_public_access_cidrs=$CIDRS" >> "$GITHUB_ENV"

      # Durable operator ARN(s) that must keep EKS cluster-admin. The shipped
      # environments/dev/platform.tfvars deliberately leaves
      # extra_cluster_admin_principal_arns unassigned so the repo stays portable
      # (#4027: a hardcoded ARN either grants a foreign account cluster-admin on a
      # customer cluster, or names a role that doesn't exist in an IAM Identity
      # Center account) — and so this TF_VAR_ override is not overridden by the
      # -var-file. This step supplies the account's own value from the
      # EXTRA_CLUSTER_ADMIN_ARNS repository variable, so a CI apply doesn't destroy
      # a human operator's access entry and lock them out of kubectl (principal_arn
      # is ForceNew, so a dropped entry is a real destroy, not a cosmetic diff).
      # Unset/blank variable = no-op: the variable's declared default ([]) applies.
      - name: Set extra cluster admin principal ARNs
        env:
          EXTRA_CLUSTER_ADMIN_ARNS: ${{ vars.EXTRA_CLUSTER_ADMIN_ARNS }}
        run: |
          set -euo pipefail
          RAW=$(printf '%s' "${EXTRA_CLUSTER_ADMIN_ARNS:-}" | tr -d '[:space:]')
          if [ -z "$RAW" ]; then
            echo "EXTRA_CLUSTER_ADMIN_ARNS not set — using the declared default ([])."
            exit 0
          fi
          # Accept either a JSON list (passed through verbatim) or a bare /
          # comma-separated ARN list, which is wrapped here. A bare ARN handed
          # straight to a list(string) TF_VAR is a plan-time type error, so
          # normalising is what makes the plain-ARN form safe to configure.
          case "$RAW" in
            \[*\])
              TFVAR="$RAW"
              ;;
            *)
              IFS=',' read -ra ARNS <<< "$RAW"
              ITEMS=""
              for arn in "${ARNS[@]}"; do
                [ -n "$arn" ] || continue
                ITEMS="${ITEMS}${ITEMS:+,}\"${arn}\""
              done
              TFVAR="[${ITEMS}]"
              ;;
          esac
          echo "TF_VAR_extra_cluster_admin_principal_arns=${TFVAR}" >> "$GITHUB_ENV"
          echo "Extra cluster-admin principals: ${TFVAR}"

      # Additional EXISTING private capacity subnets for the cluster's own subnet
      # set (#5830). Same portability reason as the ARNs above: subnet ids are
      # account-specific, so environments/dev/platform.tfvars deliberately leaves
      # additional_private_subnet_ids_by_az unassigned — a -var-file assignment,
      # even `= {}`, would override this TF_VAR_. Without the passthrough, a CI
      # apply would plan the empty default and shrink the subnet set back, which
      # re-breaks pod IP assignment for every node launched afterwards.
      #
      # Unset/blank variable = no-op: the declared default ({}) applies, and the
      # cluster's subnet set stays exactly as it is. Expects a JSON object keyed by
      # availability zone; the module refuses at plan time any subnet outside the
      # VPC, not in the zone it is keyed by, public, or not NAT-routed.
      - name: Set additional private capacity subnets
        env:
          ADDITIONAL_PRIVATE_SUBNETS_BY_AZ: ${{ vars.ADDITIONAL_PRIVATE_SUBNETS_BY_AZ }}
        run: |
          set -euo pipefail
          RAW=$(printf '%s' "${ADDITIONAL_PRIVATE_SUBNETS_BY_AZ:-}" | tr -d '[:space:]')
          if [ -z "$RAW" ]; then
            echo "ADDITIONAL_PRIVATE_SUBNETS_BY_AZ not set — using the declared default ({})."
            exit 0
          fi
          # Validated here rather than relying on Terraform alone, so a typo fails
          # this step instead of surfacing as a confusing map(string) type error.
          TFVAR=$(printf '%s' "$RAW" | python3 -c 'import json,re,sys; v=json.load(sys.stdin); assert isinstance(v,dict) and v, "expected a non-empty JSON object keyed by availability zone"; assert all(re.fullmatch(r"[a-z0-9-]+",z) and re.fullmatch(r"subnet-[0-9a-f]{8,17}",str(s)) for z,s in v.items()), "expected entries of the form \"us-east-1a\": \"subnet-0123456789abcdef0\""; assert len(set(v.values()))==len(v), "the same subnet is named under two availability zones"; print(json.dumps(v))')
          echo "TF_VAR_additional_private_subnet_ids_by_az=${TFVAR}" >> "$GITHUB_ENV"
          echo "Additional private capacity subnets: ${TFVAR}"

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="../../${{ env.BACKEND_CONFIG }}" \
            -backend-config="bucket=${STATE_BUCKET}" \
            -input=false -reconfigure

      # Plan first to check for destroys (destroy-safety gate)
      - name: Terraform Plan (destroy-safety check)
        id: plan
        if: inputs.scope == '' || inputs.scope == 'full'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -e
          set -o pipefail
          EXIT_CODE=0
          terraform plan -var-file="../../${{ env.VAR_FILE }}" -out=tfplan -detailed-exitcode -no-color 2>&1 | tee /tmp/plan-output.txt || EXIT_CODE=$?
          echo "detailed_exitcode=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          # Exit code 0 = no changes, 1 = error, 2 = changes present
          if [ "$EXIT_CODE" -eq 1 ]; then
            echo "::error::Terraform plan failed."
            exit 1
          fi

      # Scoped plan (#5006). Same saved-plan mechanics as the full path above —
      # same -out=tfplan, same /tmp/plan-output.txt for the destroy gate, and
      # it runs AFTER the same credential / admin-ARN / public-CIDR / init
      # steps. Reusing those is not cosmetic: omitting the admin-ARN step for
      # this path would plan with a different variable set than the apply,
      # which is exactly the #5004 plan/apply asymmetry.
      #
      # The -target address is a hardcoded literal, not an interpolated input.
      - name: Terraform Plan (scoped)
        id: plan_scoped
        if: inputs.scope != '' && inputs.scope != 'full'
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          APPLY_SCOPE: ${{ inputs.scope }}
          SCOPED_VAR_FILE: ${{ env.VAR_FILE }}
        run: |
          set -e
          set -o pipefail
          SCOPE_ARGS=()
          case "$APPLY_SCOPE" in
            network-policy-controller)
              TARGET='module.eks.kubernetes_config_map.amazon_vpc_cni[0]'
              ;;
            network-policy-controller-rollback)
              TARGET='module.eks.kubernetes_config_map.amazon_vpc_cni[0]'
              SCOPE_ARGS=(-var=enable_network_policy_controller=false)
              ;;
            *)
              echo '::error::Unrecognised scope — refusing rather than planning.'
              exit 1
              ;;
          esac
          echo "Scoped plan target: ${TARGET}"
          EXIT_CODE=0
          terraform plan -var-file="../../${SCOPED_VAR_FILE}" "${SCOPE_ARGS[@]}" \
            -target="${TARGET}" \
            -out=tfplan -detailed-exitcode -no-color 2>&1 | tee /tmp/plan-output.txt || EXIT_CODE=$?
          echo "detailed_exitcode=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          if [ "$EXIT_CODE" -ne 0 ] && [ "$EXIT_CODE" -ne 2 ]; then
            echo "::error::Terraform plan failed."
            exit 1
          fi

      # Fail-closed audit of the SAVED plan (#5006). Runs between plan and
      # apply, and is ADDITIONAL to the destroy-safety gate below — not a
      # replacement for it. It reads the plan file that will actually be
      # applied, so the reviewed plan is provably the applied plan.
      #
      # The raw JSON goes to /tmp (outside the workspace) and is never uploaded
      # as an artifact or echoed: plan JSON can carry resource attribute values
      # including secrets. The guard prints only addresses and action verbs.
      - name: Verify scoped plan
        id: verify_scoped
        if: inputs.scope != '' && inputs.scope != 'full'
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          APPLY_SCOPE: ${{ inputs.scope }}
          REQUESTED_ACCOUNT: ${{ inputs.account_id }}
          CONFIRM_DESTRUCTIVE_APPLY: ${{ inputs.confirm_destructive_apply }}
        run: |
          set -e
          set -o pipefail
          umask 077
          trap 'rm -f /tmp/scoped-plan.json /tmp/scoped-plan.err' EXIT
          SHOW_EXIT=0
          terraform show -json tfplan > /tmp/scoped-plan.json 2>/tmp/scoped-plan.err || SHOW_EXIT=$?
          if [ "$SHOW_EXIT" -ne 0 ]; then
            echo "::error::terraform show -json failed (exit ${SHOW_EXIT})."
          fi
          IDENTITY_ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          GUARD_EXIT=0
          python3 "${GITHUB_WORKSPACE}/.github/scripts/verify_scoped_plan.py" \
            --scope "$APPLY_SCOPE" \
            --plan-json /tmp/scoped-plan.json \
            --show-exit-code "$SHOW_EXIT" \
            --resolved-account "${ACCOUNT_ID}" \
            --identity-account "${IDENTITY_ACCOUNT}" \
            --requested-account "$REQUESTED_ACCOUNT" \
            --confirm-destructive-apply "$CONFIRM_DESTRUCTIVE_APPLY" \
            | tee /tmp/scoped-guard.txt || GUARD_EXIT=$?
          {
            printf '### Scoped apply guard — `%s`\n' "$APPLY_SCOPE"
            echo '```'
            cat /tmp/scoped-guard.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$GUARD_EXIT"

      - name: Destroy-safety gate
        if: steps.plan.outputs.detailed_exitcode == '2' || steps.plan_scoped.outputs.detailed_exitcode == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          DESTROYS=$(grep -c 'will be destroyed' /tmp/plan-output.txt 2>/dev/null) || DESTROYS=0
          if [ "$DESTROYS" -le 0 ]; then
            echo "No destroys in plan. Proceeding."
            exit 0
          fi

          echo "Plan includes $DESTROYS resource(s) to destroy."
          echo ""
          echo "Resources to be destroyed:"
          grep 'will be destroyed' /tmp/plan-output.txt || true
          echo ""

          # workflow_dispatch: require explicit operator confirmation.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.confirm_destructive_apply }}" = "yes" ]; then
              echo "Operator-confirmed destructive apply (confirm_destructive_apply=yes). Proceeding."
              exit 0
            fi
            echo "::error::This workflow_dispatch run schedules $DESTROYS destroy(s)."
            echo "::error::Re-run with confirm_destructive_apply=yes to authorize. Or fix the underlying drift first."
            exit 1
          fi

          # push / other events: require destructive-apply-approved label on the merged PR.
          COMMIT_SHA="${{ github.sha }}"
          PR_NUMBER=$(gh pr list --state merged --search "$COMMIT_SHA" --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
          if [ -z "$PR_NUMBER" ]; then
            echo "::error::This apply would destroy $DESTROYS resource(s) but no associated merged PR was found for SHA $COMMIT_SHA. Cannot verify destructive-apply-approved label."
            exit 1
          fi
          echo "Associated PR: #$PR_NUMBER"

          LABELS=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name' 2>/dev/null || echo "")
          if echo "$LABELS" | grep -qx 'destructive-apply-approved'; then
            echo "PR #$PR_NUMBER has 'destructive-apply-approved' label. Proceeding."
          else
            echo "::error::This apply would destroy $DESTROYS resource(s). PR #$PR_NUMBER does NOT have the 'destructive-apply-approved' label."
            echo "::error::Add the label to PR #$PR_NUMBER and re-run, or trigger manually with confirm_destructive_apply=yes."
            exit 1
          fi

      - name: Terraform Apply
        id: apply
        if: ${{ !inputs.plan_only }}
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply tfplan

      - name: Scoped plan-only summary
        if: always() && inputs.plan_only
        env:
          GUARD_OUTCOME: ${{ steps.verify_scoped.outcome }}
        run: |
          {
            echo '## Scoped plan-only run'
            printf -- '- Guard: %s\n' "$GUARD_OUTCOME"
            echo '- Terraform Apply was skipped.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: always() && !inputs.plan_only
        run: |
          echo "## Terraform Apply -- ${{ env.MODULE_NAME }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Module**: ${{ env.MODULE_NAME }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status**: ${{ steps.apply.outcome == 'success' && 'applied' || 'failed' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Working dir**: ${{ env.TF_WORKING_DIR }}" >> "$GITHUB_STEP_SUMMARY"
