name: Platform Deploy Mgmt — Verify

on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'Phase to verify: 1-9 or "all"'
        required: true
      customer_account_id:
        description: 'Customer AWS account ID to verify'
        required: true
      customer_aws_label:
        description: 'Vaulted credential label for the customer account'
        required: true
      customer_user_id:
        description: 'ADP users.id UUID for the linked-account owner'
        required: true
      environment:
        description: 'Deployment environment (dev/staging/prod)'
        required: false
        default: 'dev'
      deploy_id:
        description: 'Deployment ID for DDB row linkage (optional)'
        required: false
        default: ''
      mode:
        description: 'Verification mode: deploy|monitor|upgrade-pre|upgrade-post'
        required: false
        default: 'deploy'

concurrency:
  group: verify-${{ inputs.customer_account_id }}-${{ inputs.phase }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    name: Phase Verification
    runs-on:
      group: adp-deployment
      labels: arc-runner-deployment
    environment: adp-deploy-${{ inputs.environment || 'dev' }}
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Verify source belongs to reviewed main history
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$GITHUB_SHA"
          git merge-base --is-ancestor HEAD FETCH_HEAD

      - name: Establish trusted deployment identity
        uses: ./.github/actions/trusted-deployment
        with:
          role_arn: ${{ vars.ADP_DEPLOY_ROLE_ARN }}
          region: ${{ vars.ADP_DEPLOY_REGION || 'us-east-1' }}

      - name: Load deployment config
        uses: ./.github/actions/load-deploy-config
        with:
          customer_account_id: ${{ inputs.customer_account_id }}
          customer_aws_label: ${{ inputs.customer_aws_label }}
          customer_user_id: ${{ inputs.customer_user_id }}
          environment: ${{ inputs.environment }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r modules/platform-deploy-mgmt/requirements.txt

      - name: Phase 1 verification
        if: inputs.phase == '1' || inputs.phase == 'all'
        working-directory: modules/platform-deploy-mgmt
        run: python -m platform_deploy_mgmt.checks.runner --phase=1
        env:
          MODE: ${{ inputs.mode }}
          DEPLOY_ID: ${{ inputs.deploy_id }}
          PYTHONPATH: ${{ github.workspace }}/modules/platform-deploy-mgmt

      # Phases 2-9 remain unimplemented; this workflow verifies Phase 1 only.
