name: Agent Context Images Build

# Builds and pushes agent-context Docker images to ECR when their Dockerfile
# or build context changes. Mirrors the arc-runner-build.yml pattern.

on:
  push:
    branches: [main]
    paths:
      - 'modules/agent-context/images/ingestion/**'
      - 'modules/agent-context/images/codegraph-context/**'
      - 'modules/agent-context/images/litellm-proxy/**'
      - 'modules/agent-context/images/deepwiki/**'
      - 'modules/agent-context/images/context-mcp/**'
      - 'modules/agent-context/door/**'
      - 'modules/agent-context/personal_context/**'
      - 'modules/agent-context/alembic/**'
      - 'codebuild/bs-agent-context-image.yml'
      - '.github/workflows/agent-context-images-build.yml'
  workflow_dispatch:
    inputs:
      image:
        description: 'Image to rebuild (or "all")'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - ingestion
          - codegraph-context
          - litellm-proxy
          - deepwiki
          - context-mcp

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: dev
concurrency:
  group: agent-context-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-changes:
    name: Detect Changed Images
    runs-on: arc-runner-org
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: detect
        name: Build matrix from changed paths or dispatch input
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT="${{ inputs.image }}"
            if [ "$INPUT" = "all" ]; then
              echo 'matrix={"image":["ingestion","codegraph-context","litellm-proxy","deepwiki","context-mcp"]}' >> "$GITHUB_OUTPUT"
            else
              echo "matrix={\"image\":[\"$INPUT\"]}" >> "$GITHUB_OUTPUT"
            fi
          else
            # Detect which image directories changed
            CHANGED=$(git diff --name-only HEAD^ HEAD \
              | grep '^modules/agent-context/images/' \
              | awk -F/ '{print $4}' \
              | sort -u \
              | jq -R . \
              | jq -sc .)
            # If buildspec or workflow changed, rebuild all
            if git diff --name-only HEAD^ HEAD | grep -qE '(codebuild/bs-agent-context-image\.yml|\.github/workflows/agent-context-images-build\.yml)'; then
              echo 'matrix={"image":["ingestion","codegraph-context","litellm-proxy","deepwiki","context-mcp"]}' >> "$GITHUB_OUTPUT"
            else
              # If door/ or personal_context/ changed, include context-mcp (its source deps)
              if git diff --name-only HEAD^ HEAD | grep -qE '^modules/agent-context/(door|personal_context)/'; then
                CHANGED=$(echo "$CHANGED" | jq -c '. + ["context-mcp"] | unique')
              fi
              if [ "$CHANGED" = "[]" ] || [ -z "$CHANGED" ]; then
                echo 'matrix={"image":[]}' >> "$GITHUB_OUTPUT"
              else
                echo "matrix={\"image\":$CHANGED}" >> "$GITHUB_OUTPUT"
              fi
            fi
          fi

  build:
    name: Build ${{ matrix.image }}
    needs: detect-changes
    if: ${{ fromJson(needs.detect-changes.outputs.matrix).image[0] != null }}
    runs-on: arc-runner-org
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Load deployment config
        uses: ./.github/actions/load-deploy-config

      - name: Build image via CodeBuild
        id: build
        uses: ./.github/actions/codebuild-run
        with:
          project_name: adp-${{ env.ENVIRONMENT }}-agent-context-${{ matrix.image }}-build
          region: ${{ env.AWS_REGION }}
          state_bucket: ${{ env.STATE_BUCKET }}
          environment_variables: '"name=IMAGE_TAG,value=${{ github.sha }},type=PLAINTEXT"'
          poll_interval: '30'

      - name: Summary
        run: |
          echo "## Agent Context Image Built: ${{ matrix.image }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Project**: adp-${ENVIRONMENT}-agent-context-${{ matrix.image }}-build" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Tag**: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **CodeBuild**: ${{ steps.build.outputs.build_id }}" >> "$GITHUB_STEP_SUMMARY"
