name: Codex Reviewer Image Build

on:
  pull_request:
    paths:
      - 'modules/agent-factory/codex-reviewer/**'
      - 'codebuild/bs-codex-reviewer.yml'
      - '.github/workflows/codex-reviewer-image.yml'
  push:
    branches: [main]
    paths:
      - 'modules/agent-factory/codex-reviewer/**'
      - 'codebuild/bs-codex-reviewer.yml'
      - '.github/workflows/codex-reviewer-image.yml'
  workflow_dispatch:
    inputs:
      account_id:
        description: 'Target AWS account (12 digits).'
        required: false
        default: ''
      environment:
        description: 'Deployment environment.'
        required: false
        default: 'dev'

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: dev
  CODEBUILD_PROJECT: adp-dev-codex-reviewer

jobs:
  test:
    name: Codex Reviewer Unit Tests
    runs-on: arc-runner-org
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: modules/agent-factory/codex-reviewer/package-lock.json
      - name: Install dependencies
        working-directory: modules/agent-factory/codex-reviewer
        run: npm ci
      - name: Build and test standalone runtime
        working-directory: modules/agent-factory/codex-reviewer
        run: npm test

  build:
    name: Build Independent Codex Reviewer
    if: github.event_name != 'pull_request'
    runs-on: arc-runner-org
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Load deployment config
        uses: ./.github/actions/load-deploy-config
        with:
          account_id: ${{ inputs.account_id }}
          environment: ${{ inputs.environment }}
      - name: Build image via CodeBuild
        id: build
        uses: ./.github/actions/codebuild-run
        with:
          project_name: ${{ env.CODEBUILD_PROJECT }}
          region: ${{ env.AWS_REGION }}
          state_bucket: ${{ env.STATE_BUCKET }}
          environment_variables: >-
            "name=AWS_REGION,value=${{ env.AWS_REGION }}"
            "name=ACCOUNT_ID,value=${{ env.ACCOUNT_ID }}"
            "name=REGISTRY,value=${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
            "name=IMAGE_TAG,value=${{ github.sha }}"
      - name: Summary
        run: |
          echo "## Independent Codex Reviewer Built" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image**: ${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/adp-codex-reviewer:${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **CodeBuild**: ${{ steps.build.outputs.build_id }}" >> "$GITHUB_STEP_SUMMARY"
