name: Platform Infra Plan

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'platform/infra/**'
      - 'modules/domain-apps/*/codebuild/projects.json'
      - '.github/workflows/platform-infra-plan.yml'
      - 'modules/agent-factory/infra/modules/runner-iam/**'
      - 'environments/dev/platform.tfvars'
      - 'environments/dev/backend.tfvars'
    branches:
      - main

env:
  AWS_REGION: us-east-1
  TF_VAR_environment: dev
  MODULE_NAME: platform
  TF_WORKING_DIR: platform/infra
  BACKEND_CONFIG: environments/dev/backend.tfvars
  VAR_FILE: environments/dev/platform.tfvars

jobs:
  plan:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch')
    name: Terraform Plan
    environment: adp-deploy-dev
    runs-on:
      group: adp-deployment
      labels: arc-runner-deployment
    # ARC runner has IRSA via adp-dev-agent-runner-role — no AWS_ROLE_ARN needed
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      # Bootstrap CLI tools (no-op once custom runner image rolls out everywhere)
      - name: Verify source belongs to reviewed main history
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$GITHUB_SHA"
          git merge-base --is-ancestor HEAD FETCH_HEAD

      - name: Establish trusted deployment identity
        uses: ./.github/actions/trusted-deployment
        with:
          role_arn: ${{ vars.ADP_DEPLOY_ROLE_ARN }}
          region: ${{ vars.ADP_DEPLOY_REGION || 'us-east-1' }}

      - name: Install required CLI tools
        run: |
          set -euo pipefail
          for tool in aws terraform kubectl helm jq zip unzip curl git python3 node npm; do
            command -v "$tool" >/dev/null || { echo "::error::Reviewed runner image is missing $tool"; exit 1; }
          done
      - name: Test Bedrock invocation logging infrastructure
        run: |
          for module in platform/infra/modules/bedrock-invocation-logging modules/agent-factory/infra/modules/runner-iam; do
            terraform -chdir="$module" init -backend=false -input=false
            terraform -chdir="$module" test -no-color
          done

      # Auto-detect runner's public IP for EKS API endpoint restriction.
      # Matches the pattern used by deploy-all.sh (3-URL fallback + empty guard).
      - name: Set EKS public access CIDRs
        run: |
          if [ -z "${TF_VAR_eks_public_access_cidrs:-}" ]; then
            MY_IP=""
            for url in https://checkip.amazonaws.com https://api.ipify.org https://ifconfig.me; do
              MY_IP=$(curl -fsS --max-time 5 "$url" 2>/dev/null | tr -d '[:space:]' || true)
              [ -n "$MY_IP" ] && break
            done
            if [ -z "$MY_IP" ]; then
              echo "::error::Could not detect runner public IP. Set TF_VAR_eks_public_access_cidrs manually."
              exit 1
            fi
            echo "TF_VAR_eks_public_access_cidrs=[\"${MY_IP}/32\"]" >> "$GITHUB_ENV"
            echo "Auto-detected runner IP: ${MY_IP}/32"
          fi

      # The committed backend.tfvars intentionally keeps the literal
      # "adp-terraform-state-ACCOUNT_ID" placeholder (the real account id is
      # never committed). Resolve it at runtime from the runner's own identity
      # and override the bucket on init, matching deploy-all.sh's pattern.
      - name: Resolve Terraform state bucket
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "ADP_STATE_BUCKET=adp-terraform-state-${ACCOUNT_ID}" >> "$GITHUB_ENV"
          echo "Resolved state bucket: adp-terraform-state-${ACCOUNT_ID}"

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="../../${{ env.BACKEND_CONFIG }}" \
            -backend-config="bucket=${ADP_STATE_BUCKET}" \
            -input=false -reconfigure

      # No -filter: the whole tests/ directory runs. With a single-file filter, every
      # other .tftest.hcl in the module was dead weight — present, passing locally, and
      # never executed in CI, so a regression it covered would still merge (#5051).
      - name: Test EKS module
        run: |
          terraform -chdir=platform/infra/modules/eks init -backend=false -input=false -plugin-dir=../../.terraform/providers
          terraform -chdir=platform/infra/modules/eks test -no-color

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -e
          terraform plan -var-file="../../${{ env.VAR_FILE }}" -out=tfplan -no-color 2>&1 | tee /tmp/plan-output.txt

      - name: Post or update PR comment
        uses: actions/github-script@v9
        if: always() && github.event_name == 'pull_request'
        env:
          PLAN_OUTPUT: ${{ steps.plan.outcome }}
        with:
          script: |
            const fs = require('fs');
            const marker = `<!-- tf-plan:${{ env.MODULE_NAME }} -->`;
            let planText = '';
            try {
              planText = fs.readFileSync('/tmp/plan-output.txt', 'utf8');
            } catch (e) {
              planText = 'Plan output not available.';
            }
            // Truncate if too long (GitHub comment limit is 65536 chars)
            if (planText.length > 60000) {
              planText = planText.substring(0, 60000) + '\n\n... (truncated)';
            }
            const status = process.env.PLAN_OUTPUT === 'success' ? ':white_check_mark:' : ':x:';
            const body = `${marker}\n${status} **Terraform Plan — \`${{ env.MODULE_NAME }}\`**\n\n<details>\n<summary>Plan output</summary>\n\n\`\`\`\n${planText}\n\`\`\`\n\n</details>\n\n*Updated: ${new Date().toISOString()} | Run: [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Summary
        if: always()
        run: |
          echo "## Terraform Plan -- ${{ env.MODULE_NAME }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Module**: ${{ env.MODULE_NAME }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status**: ${{ steps.plan.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Working dir**: ${{ env.TF_WORKING_DIR }}" >> "$GITHUB_STEP_SUMMARY"

  validate-pr-config:
    name: Terraform PR Configuration
    if: github.event_name == 'pull_request'
    runs-on: arc-runner-org
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.2
      - name: Validate without state or deployment credentials
        working-directory: platform/infra
        run: |
          terraform init -backend=false -input=false
          terraform validate -no-color
