name: GitHub Auth Broker Deploy

# Packages modules/gateway/lambda/github-auth-broker/ and updates the live
# bedrockgw-dev-github-auth-broker Lambda function code.
#
# Terraform (in modules/gateway/infra/modules/github-auth-broker/) creates
# the Lambda function resource with a placeholder zip. This workflow ships
# the real handler code. Without this running, the broker returns 503
# "Not deployed yet" to every /auth/github/* request and Sign-in-with-GitHub
# doesn't work end-to-end.

on:
  push:
    paths:
      - 'modules/gateway/lambda/github-auth-broker/**'
      - '.github/workflows/github-auth-broker-deploy.yml'
    branches:
      - main
  workflow_dispatch:
    inputs:
      account_id:
        description: 'Target AWS account (12 digits). Empty = use platform IRSA / config file.'
        required: false
        default: ''
      customer_account_id:
        description: 'Customer-linked AWS account to deploy into (cross-account mode). Triggers gateway-call assume.'
        required: false
        default: ''
      customer_aws_label:
        description: 'Vaulted credential label (when customer_account_id is set).'
        required: false
        default: ''
      customer_user_id:
        description: 'ADP users.id UUID (when customer_account_id is set).'
        required: false
        default: ''
      environment:
        description: 'Deployment environment (dev/staging/prod).'
        required: false
        default: 'dev'

concurrency:
  group: github-auth-broker-deploy-${{ inputs.customer_account_id || inputs.account_id || 'default' }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: ${{ inputs.environment || 'dev' }}
  FUNCTION_NAME: bedrockgw-${{ inputs.environment || 'dev' }}-github-auth-broker
  LAMBDA_SRC_DIR: modules/gateway/lambda/github-auth-broker

jobs:
  deploy:
    name: Package and Deploy Broker Lambda
    if: github.ref == 'refs/heads/main'
    runs-on: arc-runner-org
    environment: adp-deploy-${{ inputs.environment || 'dev' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Verify source belongs to reviewed main history
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$GITHUB_SHA"
          git merge-base --is-ancestor HEAD FETCH_HEAD

      - name: Establish trusted deployment identity
        uses: ./.github/actions/trusted-deployment
        with:
          role_arn: ${{ vars.ADP_DEPLOY_ROLE_ARN }}
          region: ${{ vars.ADP_DEPLOY_REGION || 'us-east-1' }}

      - name: Load deployment config
        uses: ./.github/actions/load-deploy-config
        with:
          account_id: ${{ inputs.account_id }}
          environment: ${{ inputs.environment }}
          customer_account_id: ${{ inputs.customer_account_id }}
          customer_aws_label: ${{ inputs.customer_aws_label }}
          customer_user_id: ${{ inputs.customer_user_id }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install required CLI tools
        run: |
          set -euo pipefail
          for tool in aws terraform kubectl helm jq zip unzip curl git python3 node npm; do
            command -v "$tool" >/dev/null || { echo "::error::Reviewed runner image is missing $tool"; exit 1; }
          done
      - name: Package Lambda
        run: |
          set -e
          BUILD_DIR="${LAMBDA_SRC_DIR}/build"
          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"
          # Install Python deps into the build dir
          pip install \
            --target "$BUILD_DIR" \
            --platform manylinux2014_x86_64 \
            --only-binary=:all: \
            --implementation cp \
            --python-version 3.12 \
            -r "${LAMBDA_SRC_DIR}/requirements.txt"
          # Issue #4849: the shared membership-eligibility reader lives outside the
          # broker dir (modules/gateway/lambda/shared/) so the pre-signup Lambda
          # packages the same file rather than a divergent copy. Must stay in
          # lockstep with modules/gateway/scripts/deploy-broker.sh, which is
          # documented as replicating this job exactly.
          cp modules/gateway/lambda/shared/membership_eligibility.py "${BUILD_DIR}/"
          # Copy all Python source modules (exclude tests, build/, __pycache__)
          cd "${LAMBDA_SRC_DIR}"
          for f in *.py; do
            [ -f "$f" ] && cp "$f" build/
          done
          # Zip from inside the build dir so the layout is flat at the root
          cd build
          find . -type d -name __pycache__ -prune -exec rm -rf {} + || true
          zip -r -q ../broker.zip .
          cd ..
          ls -la broker.zip
          echo "Size: $(stat -c %s broker.zip 2>/dev/null || stat -f %z broker.zip) bytes"

      - name: Upload artifact to S3
        run: |
          aws s3 cp "${LAMBDA_SRC_DIR}/broker.zip" \
            "s3://${STATE_BUCKET}/lambda-artifacts/github-auth-broker/broker.zip" \
            --metadata "commit=${{ github.sha }}"
          echo "Uploaded to s3://${STATE_BUCKET}/lambda-artifacts/github-auth-broker/broker.zip"

      - name: Update Lambda function code
        run: |
          set -e
          aws lambda update-function-code \
            --function-name "${FUNCTION_NAME}" \
            --s3-bucket "${STATE_BUCKET}" \
            --s3-key "lambda-artifacts/github-auth-broker/broker.zip" \
            --region "${AWS_REGION}" \
            --publish \
            --query '{func:FunctionName,version:Version,codeSize:CodeSize,state:State,lastUpdateStatus:LastUpdateStatus}' \
            --output table

      - name: Wait for update to settle
        run: |
          aws lambda wait function-updated \
            --function-name "${FUNCTION_NAME}" \
            --region "${AWS_REGION}"
          aws lambda get-function-configuration \
            --function-name "${FUNCTION_NAME}" \
            --region "${AWS_REGION}" \
            --query '{state:State,lastUpdateStatus:LastUpdateStatus,codeSize:CodeSize}' \
            --output json

      - name: Smoke test — /start endpoint should return 302 to github.com
        run: |
          set -e
          # Resolve the broker's public base from SSM rather than hardcoding an
          # API Gateway URL. The hardcoded value stopped being correct twice over:
          # the broker is served through the distribution, and once delivery moved
          # to the broker's own function URL the API Gateway no longer carries an
          # /auth/github route at all — so the old URL now returns 403 and this
          # step failed for a reason unrelated to the code it is testing. Same
          # treatment as the Playwright target.
          BROKER_URL=$(aws ssm get-parameter \
            --name "/adp/${ENVIRONMENT}/gateway/github-auth-broker-url" \
            --query Parameter.Value --output text --region "${AWS_REGION}" 2>/dev/null || echo "")
          if [ -z "$BROKER_URL" ] || [ "$BROKER_URL" = "None" ]; then
            echo "❌ SSM /adp/${ENVIRONMENT}/gateway/github-auth-broker-url is empty."
            echo "   gateway-infra publishes it; apply that stack before deploying the broker."
            exit 1
          fi
          API_URL="${BROKER_URL%/}/start"
          echo "Hitting: $API_URL"
          HTTP_CODE=$(curl -sS -o /tmp/resp.out -w "%{http_code}" --max-redirs 0 "$API_URL" || true)
          echo "HTTP code: $HTTP_CODE"
          echo "Response body:"
          cat /tmp/resp.out || true
          # Expect 302 redirect to github.com (the broker's /start handler
          # returns a Location header to GitHub's OAuth authorize URL)
          if [ "$HTTP_CODE" = "302" ] || [ "$HTTP_CODE" = "301" ]; then
            echo "✅ /start responded with redirect as expected"
          else
            echo "❌ /start did not return a redirect. Expected 301/302, got $HTTP_CODE."
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          echo "## GitHub Auth Broker Deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Function**: ${FUNCTION_NAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Commit**: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status**: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
