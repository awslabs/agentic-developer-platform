name: Gateway CI

on:
  pull_request:
    paths:
      - 'modules/gateway/src/**'
      - 'modules/gateway/tests/**'
      - 'modules/gateway/pyproject.toml'
      - 'modules/gateway/Dockerfile'
      - 'modules/gateway/frontend/src/**'
      - 'modules/gateway/frontend/package*.json'
      - 'modules/gateway/frontend/tests/**'
      - 'libs/python/adp-common/**'
    branches:
      - main
  push:
    paths:
      - 'modules/gateway/src/**'
      - 'modules/gateway/pyproject.toml'
      - 'modules/gateway/Dockerfile'
    branches:
      - main

concurrency:
  group: gateway-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: modules/gateway/pyproject.toml

      - name: Install dependencies
        working-directory: modules/gateway
        run: |
          pip install -e ".[dev]"

      - name: Run Ruff
        working-directory: modules/gateway
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: modules/gateway/pyproject.toml

      - name: Install dependencies
        working-directory: modules/gateway
        run: pip install -e ".[dev]"

      - name: Run Tests
        working-directory: modules/gateway
        run: |
          pytest tests/ -v --tb=short \
            -m "not live_only" \
            --timeout=60 \
            --cov=src --cov-report=xml

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: modules/gateway/coverage.xml

  frontend-test:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: modules/gateway/frontend/package-lock.json

      - name: Install dependencies
        working-directory: modules/gateway/frontend
        run: npm ci

      - name: Run Vitest
        working-directory: modules/gateway/frontend
        run: npx vitest run --reporter=verbose

  build:
    name: Build Container
    runs-on: ubuntu-latest
    needs: [test, frontend-test]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        working-directory: modules/gateway
        run: docker build -t adp-gateway:${{ github.sha }} .
