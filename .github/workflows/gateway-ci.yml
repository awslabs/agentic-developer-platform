name: Gateway CI

on:
  pull_request:
    paths:
      - 'modules/gateway/src/**'
      - 'modules/gateway/tests/**'
      - 'modules/gateway/pyproject.toml'
      - 'modules/gateway/Dockerfile'
      - 'modules/gateway/frontend/src/**'
      - 'modules/gateway/frontend/package*.json'
      - 'modules/gateway/frontend/tests/**'
      - 'libs/python/adp-common/**'
      - '.github/workflows/gateway-ci.yml'
    branches:
      - main
  push:
    paths:
      - 'modules/gateway/src/**'
      - 'modules/gateway/pyproject.toml'
      - 'modules/gateway/Dockerfile'
    branches:
      - main

concurrency:
  group: gateway-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: arc-runner-org
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: modules/gateway/pyproject.toml

      - name: Install dependencies
        working-directory: modules/gateway
        run: |
          pip install -e ".[dev]"

      - name: Run Ruff
        working-directory: modules/gateway
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/

  test:
    name: Test
    runs-on: arc-runner-org
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: modules/gateway/pyproject.toml

      - name: Install dependencies
        working-directory: modules/gateway
        run: pip install -e ".[dev]"

      - name: Run Tests
        working-directory: modules/gateway
        run: |
          pytest tests/ -v --tb=short \
            -m "not live_only" \
            --timeout=60 \
            --cov=src --cov-report=xml

      - name: Upload Coverage
        # Coverage upload is informational — it must never fail the Test gate.
        # GitHub artifact-storage quota exhaustion (recalculated every 6-12h)
        # was failing this step and dragging the whole Test job to red even
        # when all tests passed, blocking merges across every PR.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: modules/gateway/coverage.xml

  frontend-test:
    name: Frontend Unit Tests
    runs-on: arc-runner-org
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: modules/gateway/frontend/package-lock.json

      - name: Install dependencies
        working-directory: modules/gateway/frontend
        run: npm ci

      - name: Run Vitest
        working-directory: modules/gateway/frontend
        run: npx vitest run --reporter=verbose

  build:
    name: Build Container
    runs-on: arc-runner-org
    needs: [test, frontend-test]
    steps:
      - uses: actions/checkout@v4

      # ARC runner pods have no Docker daemon (docker-ce-cli only, no DinD
      # sidecar) — `docker build` has failed on every run since the
      # ubuntu-latest → arc-runner-org migration (#367). Kaniko also can't
      # run here (needs root FS ownership; runner is non-root). Platform
      # convention: docker builds run in CodeBuild (privileged). This job
      # triggers the gateway-build project with a build-only buildspec
      # override — same trigger/poll pattern as security-scan.yml Grype.
      - name: Refresh CodeBuild source zip
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          STATE_BUCKET="adp-terraform-state-${ACCOUNT_ID}"
          ./platform/scripts/zip-source.sh . /tmp/adp-source.zip
          aws s3 cp /tmp/adp-source.zip "s3://${STATE_BUCKET}/codebuild/adp-source.zip"

      - name: Smoke-build image (CodeBuild, no push)
        run: |
          BUILD_ID=$(aws codebuild start-build \
            --project-name adp-dev-gateway-build \
            --buildspec-override codebuild/bs-gateway-smoke.yml \
            --query 'build.id' --output text)
          echo "Started CodeBuild: ${BUILD_ID}"
          while true; do
            STATUS=$(aws codebuild batch-get-builds --ids "${BUILD_ID}" \
              --query 'builds[0].buildStatus' --output text)
            echo "$(date +%H:%M:%S) status=${STATUS}"
            case "$STATUS" in
              SUCCEEDED) exit 0 ;;
              FAILED|FAULT|TIMED_OUT|STOPPED)
                aws codebuild batch-get-builds --ids "${BUILD_ID}" \
                  --query 'builds[0].logs.deepLink' --output text
                exit 1 ;;
            esac
            sleep 20
          done
