name: Gateway CI

on:
  pull_request:
    paths:
      - 'modules/gateway/src/**'
      - 'modules/gateway/scripts/pricing-rollout.py'
      # Persona-catalogue lockstep (#5420, PMM-03). The gateway serves personas
      # from a generated staged copy of the webhook-ingress source. Registering a
      # persona at the source must re-run the Lint job's sync_personas.py --check,
      # or the gateway goes stale unobserved and the new persona is
      # unconfigurable. Same lockstep pattern as #4029/#4539.
      - 'modules/gateway/scripts/sync_personas.py'
      - 'modules/agent-factory/webhook-ingress/lambda/common/personas.py'
      - 'modules/agent-factory/agent/package.json'
      - 'modules/agent-factory/codex-reviewer/package.json'
      - 'modules/gateway/scripts/build-budget-lambda-archives.py'
      - '.github/workflows/pricing-finalize.yml'
      - '.github/workflows/run-gateway-migrations.yml'
      - 'modules/gateway/tests/**'
      # Issue #4145: tests/cli/ exercises the shell helpers in cli/, but a CLI-only
      # edit used to trigger no workflow at all — so bg-cognito-auth.sh changes
      # shipped untested. Keep cli/ in lockstep with the suite that covers it.
      - 'modules/gateway/cli/**'
      # Issue #4848: same gap as #4145, on the auth Lambdas. Editing anything under
      # lambda/ used to trigger no workflow at all — which is how the pre-signup
      # trigger came to exist as two near-identical copies, one packaged and
      # untested, the other tested and unpackaged, drifting apart unobserved (#4849
      # landed shadow-mode code in only one of them). tests/lambda/ covers this tree
      # now, so keep the two in lockstep: a handler edit must re-run the suite that
      # asserts its behavior. These files are the GitHub sign-in path — an
      # unobserved change here is a login outage, not a failed test.
      - 'modules/gateway/lambda/**'
      # Issue #4969: the shared pricing policy and its immutable rate snapshots.
      # tests/pricing_policy/ pins the hand-calculated cost oracles and the rate
      # inventory itself, so an edit here must re-run them. Same gap as #4145/#4848:
      # without this path a pricing-only PR triggers no workflow and reports green,
      # and a wrong rate is a billing defect that reaches customers' invoices.
      - 'modules/gateway/pricing_policy/**'
      - 'modules/gateway/alembic/versions/**'
      - 'modules/gateway/infra/modules/budget-lambda/**'
      - 'modules/gateway/pyproject.toml'
      - 'modules/gateway/Dockerfile'
      - 'modules/gateway/frontend/src/**'
      - 'modules/gateway/frontend/package*.json'
      - 'modules/gateway/frontend/tests/**'
      - 'libs/python/adp-common/**'
      # Shared cross-module contract fixtures (#4029). tests/internal/
      # test_provenance_contract.py validates these against the gateway's
      # request schema, so a fixture edit must re-run gateway tests.
      - 'contracts/**'
      # Trigger-policy lockstep (#4029). tests/internal/
      # test_provenance_policy_lockstep.py imports the webhook-ingress resolver and
      # asserts its trigger_policy vocabulary + DEFAULT match the gateway's authority
      # gate. A mismatched default is what silently dropped every cross-tenant
      # provenance row, so a resolver-side edit must re-run the gateway suite.
      - 'modules/agent-factory/webhook-ingress/lambda/common/identity_resolver.py'
      # Keyring lockstep (#4539). tests/internal/
      # test_engine_command_keyring_lockstep.py imports the webhook-ingress SIGNER and
      # asserts its parse_keyring agrees with the gateway verifier's on every keyring
      # state the rotation runbook produces, and that the runbook still names the
      # reasons the code emits. A signer-side or runbook-side edit that breaks that
      # agreement is a silent command outage — rotation looks complete, then every
      # command quarantines on the tick — so both must re-run the gateway suite.
      - 'modules/agent-factory/webhook-ingress/lambda/common/command_signing.py'
      - 'modules/agent-factory/webhook-ingress/infra/engine-command-signing.tf'
      - 'docs/runbooks/engine-command-signing-key-rotation.md'
      - 'platform/scripts/smoke_assertions.py'
      - 'platform/scripts/tests/test_smoke_assertions.py'
      # Loop-proposal validator + its fixtures (#4199). The advisory CLI imports
      # the shared model from src/orchestration/proposal.py, so the Lint job's
      # validation step is the only CI signal either one gets — without these
      # paths, editing the script or a fixture triggers no workflow at all and a
      # broken validator ships unnoticed (the same gap #4145 fixed for cli/).
      - '.github/scripts/validate_loop_proposal.py'
      - 'aidlc/spaces/issue-4120/construction/loop-proposal/**'
      - '.github/workflows/gateway-ci.yml'
      - '.github/workflows/gateway-deploy.yml'
      - '.github/workflows/gateway-smoke.yml'
      - 'codebuild/bs-gateway-build.yml'
      - 'codebuild/bs-gateway-smoke.yml'
      - 'platform/scripts/zip-source.sh'
    branches:
      - main
  push:
    paths:
      - 'modules/gateway/src/**'
      - 'modules/gateway/scripts/pricing-rollout.py'
      # Persona-catalogue lockstep (#5420, PMM-03). The gateway serves personas
      # from a generated staged copy of the webhook-ingress source. Registering a
      # persona at the source must re-run the Lint job's sync_personas.py --check,
      # or the gateway goes stale unobserved and the new persona is
      # unconfigurable. Same lockstep pattern as #4029/#4539.
      - 'modules/gateway/scripts/sync_personas.py'
      - 'modules/agent-factory/webhook-ingress/lambda/common/personas.py'
      - 'modules/agent-factory/agent/package.json'
      - 'modules/agent-factory/codex-reviewer/package.json'
      - 'modules/gateway/scripts/build-budget-lambda-archives.py'
      - '.github/workflows/pricing-finalize.yml'
      - '.github/workflows/run-gateway-migrations.yml'
      - 'modules/gateway/pricing_policy/**'
      - 'modules/gateway/alembic/versions/**'
      - 'modules/gateway/infra/modules/budget-lambda/**'
      - 'modules/gateway/pyproject.toml'
      - 'modules/gateway/Dockerfile'
      - '.github/workflows/gateway-ci.yml'
      - '.github/workflows/gateway-deploy.yml'
      - 'codebuild/bs-gateway-build.yml'
      - 'codebuild/bs-gateway-smoke.yml'
      - 'platform/scripts/zip-source.sh'
    branches:
      - main

concurrency:
  group: gateway-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: arc-runner-org
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: modules/gateway/pyproject.toml

      - name: Install dependencies
        working-directory: modules/gateway
        run: |
          pip install -e ".[dev]"

      - name: Run Ruff
        working-directory: modules/gateway
        run: |
          ruff check src/ tests/ pricing_policy/
          ruff format --check src/ tests/ pricing_policy/

      # Issue #5420 (PMM-03): the gateway serves the persona catalogue from a
      # generated staged copy (src/admin/persona_models/_personas.py) of the
      # authoritative webhook-ingress source (lambda/common/personas.py). The
      # gateway cannot import across module boundaries at runtime, so the copy
      # is the serving path. Without this gate, registering a persona at the
      # source leaves the gateway silently stale and the new persona
      # unconfigurable — AC-01's exact failure. --check regenerates in memory
      # and exits 1 on any drift; the fix is to run the script without --check.
      - name: Check staged persona catalogue is current
        working-directory: modules/gateway
        run: |
          python3 scripts/sync_personas.py --check

      # Issue #4199: the advisory half of the loop-proposal contract. Runs from
      # the repo root (the script adds modules/gateway to sys.path itself) over
      # both shipped fixtures. The valid one must exit 0 and the deliberately
      # cyclic one must exit non-zero — asserting the failure case is the point,
      # since a validator that never rejects anything passes CI while catching
      # nothing. The authoritative check is in compile_proposal, inside the
      # approval transaction; this step only proves the shared rules still load
      # and still fire.
      - name: Validate loop-proposal fixtures
        run: |
          set -euo pipefail
          python3 .github/scripts/validate_loop_proposal.py \
            aidlc/spaces/issue-4120/construction/loop-proposal/example-proposal.json

          if python3 .github/scripts/validate_loop_proposal.py \
               aidlc/spaces/issue-4120/construction/loop-proposal/cyclic-proposal.json; then
            echo "::error::validator accepted a deliberately-cyclic proposal; cycle detection is broken"
            exit 1
          fi
          echo "Loop-proposal validator rejected the cyclic fixture as expected."

          # Issue #4528: the authored shape, i.e. exactly what the AIDLC skill's
          # Step 7e emits — `org_id` blank because the worker resolves the tenant at
          # registration. Both directions are asserted, because the pair is the
          # contract: `--authored` must accept it, and the bare invocation must
          # still reject it. If the flag ever silently became the default, an
          # unresolved tenant would sail through the fixture check and the mismatch
          # would surface as a 422 at registration instead.
          python3 .github/scripts/validate_loop_proposal.py --authored \
            aidlc/spaces/issue-4120/construction/loop-proposal/authored-proposal.json

          if python3 .github/scripts/validate_loop_proposal.py \
               aidlc/spaces/issue-4120/construction/loop-proposal/authored-proposal.json 2>/dev/null; then
            echo "::error::validator accepted a blank org_id without --authored; the tenant check is not firing"
            exit 1
          fi
          echo "Loop-proposal validator required --authored for the unresolved-tenant fixture as expected."

  # Sharded across runners AND parallelised within each runner. This suite is
  # ~13.9k tests; run serially in one job it took ~45min, which is most of the
  # wall clock of every gateway PR. Measured on one machine over a 4.2k-test
  # slice: serial 477s -> -n 4 205s -> -n 8 138s. Scaling is sublinear, so
  # -n alone plateaus around 8min for the full suite — sharding across runners
  # is what gets it to minutes. One shard measured 89s at -n 4, 77s at -n 8.
  #
  # That 12s gap is why -n stays at 4 and the runner's cpu limit is NOT raised.
  # Once the suite is sharded each shard is small enough that per-worker startup
  # dominates, so extra workers buy almost nothing while multiplying the
  # oversubscription risk: arc-runner/main.tf documents a 2026-08-30 incident
  # where packed runners hit 104% node CPU and a job died with "runner lost
  # communication ... starves it for CPU/Memory". 4 shards x -n 4 stays inside
  # the existing 4-CPU limit and needs no infrastructure change at all.
  #
  # Runner capacity is not the constraint and never was: the scale set allows 20
  # runners, queue time was measured at 0min on every run, and we were using
  # one. 4 shards is spending capacity that already sits idle.
  #
  # Coverage is main-only: --cov measured +58% wall clock (138s -> 218s on the
  # same slice). Nothing gates on the number, so PRs don't pay for it.
  #
  # Known imbalance: pytest-split partitions by test COUNT, not duration, so the
  # shard holding the slow tests/cli files runs ~5min while others finish in
  # 40-150s. Wall clock is therefore the slowest shard, not the average. Storing
  # a durations file (`pytest --store-durations`, committed, which switches
  # pytest-split to duration-based balancing) would even these out to ~2.5min;
  # deliberately left as a follow-up so this change stays reviewable.
  test-shard:
    name: Test shard ${{ matrix.shard }}
    runs-on: arc-runner-org
    needs: lint
    strategy:
      # Every shard reports independently — one shard failing must not cancel
      # the others, or a single failure hides the state of 10k other tests.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: modules/gateway/pyproject.toml

      - name: Install dependencies
        working-directory: modules/gateway
        run: pip install -e ".[dev]"

      - name: Run Tests
        working-directory: modules/gateway
        env:
          # pytest-split partitions the collected list deterministically, so the
          # 4 shards are disjoint and together cover every test exactly once
          # (verified: 3475+3475+3475+3474 = 13899).
          SHARD_ARGS: --splits 4 --group ${{ matrix.shard }}
          # -n 4 is pinned to the runner's 4-CPU limit (arc-runner/main.tf). Do
          # NOT use `-n auto`: nproc inside the pod reports the NODE's 32 cores,
          # not the cgroup limit, so auto would spawn 32 workers on 4 CPUs and
          # run SLOWER than this. If that limit changes, change this with it.
          #
          # `--dist loadfile` is REQUIRED, not a tuning choice. It keeps every
          # test in a file on one worker. Parts of tests/cli depend on state that
          # earlier tests in the directory establish -- notably
          # tests/cli/test_provider_transport.py, which drives a real http.server
          # through the real transport on purpose (#5039) and fails with
          # `gateway_unavailable` when its ordering is disturbed. Measured on
          # tests/cli at -n 4: default dist = 9 failures, loadfile = 6 (the same
          # 6 that fail serially, i.e. no parallelism-induced failures).
          # Removing loadfile silently reintroduces ~9 phantom failures.
          XDIST_ARGS: -n 4 --dist loadfile
          COV_ARGS: ${{ github.ref == 'refs/heads/main' && '--cov=src --cov-report=xml' || '' }}
        run: |
          # -q, not -v: at 13.9k tests, per-test output was ~14k log lines per
          # run and made failures harder to find, not easier. --tb=short still
          # prints a traceback for anything that fails.
          pytest tests/ -q --tb=short \
            -m "not live_only" \
            --timeout=60 \
            $SHARD_ARGS $XDIST_ARGS $COV_ARGS

      - name: Upload Coverage
        # Coverage upload is informational — it must never fail the Test gate.
        # GitHub artifact-storage quota exhaustion (recalculated every 6-12h)
        # was failing this step and dragging the whole Test job to red even
        # when all tests passed, blocking merges across every PR.
        # Per-shard artifact: each shard measures only the code its own slice
        # touched, so these are partial by construction and must be combined
        # (coverage combine) before the total means anything.
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-shard-${{ matrix.shard }}
          path: modules/gateway/coverage.xml

  # Aggregate gate. Exists so there is a single stable check named "Test"
  # covering all shards — matrix jobs report under per-shard names, and any
  # branch protection or required-check config referencing "Test" would
  # otherwise silently stop gating the moment the job was sharded.
  test:
    name: Test
    runs-on: arc-runner-org
    needs: test-shard
    if: always()
    steps:
      - name: Verify every shard passed
        run: |
          result='${{ needs.test-shard.result }}'
          echo "aggregate result of all test shards: $result"
          if [ "$result" != "success" ]; then
            echo "::error::One or more gateway test shards did not pass ($result)."
            exit 1
          fi

  frontend-test:
    name: Frontend Unit Tests
    runs-on: arc-runner-org
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: modules/gateway/frontend/package-lock.json

      - name: Install dependencies
        working-directory: modules/gateway/frontend
        run: npm ci

      - name: Run Vitest
        working-directory: modules/gateway/frontend
        run: npx vitest run --reporter=verbose

  build:
    name: Build Container
    runs-on: arc-runner-org
    needs: [test, frontend-test]
    steps:
      - uses: actions/checkout@v7

      # ARC runner pods have no Docker daemon (docker-ce-cli only, no DinD
      # sidecar) — `docker build` has failed on every run since the
      # ubuntu-latest → arc-runner-org migration (#367). Kaniko also can't
      # run here (needs root FS ownership; runner is non-root). Platform
      # convention: docker builds run in CodeBuild (privileged). This job
      # triggers the gateway-build project with a build-only buildspec
      # override — same trigger/poll pattern as security-scan.yml Grype.
      - name: Refresh CodeBuild source zip
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          STATE_BUCKET="adp-terraform-state-${ACCOUNT_ID}"
          ./platform/scripts/zip-source.sh . /tmp/adp-source.zip
          aws s3 cp /tmp/adp-source.zip "s3://${STATE_BUCKET}/codebuild/adp-source.zip"

      - name: Smoke-build image (CodeBuild, no push)
        run: |
          BUILD_ID=$(aws codebuild start-build \
            --project-name adp-dev-gateway-build \
            --buildspec-override codebuild/bs-gateway-smoke.yml \
            --query 'build.id' --output text)
          echo "Started CodeBuild: ${BUILD_ID}"
          while true; do
            STATUS=$(aws codebuild batch-get-builds --ids "${BUILD_ID}" \
              --query 'builds[0].buildStatus' --output text)
            echo "$(date +%H:%M:%S) status=${STATUS}"
            case "$STATUS" in
              SUCCEEDED) exit 0 ;;
              FAILED|FAULT|TIMED_OUT|STOPPED)
                aws codebuild batch-get-builds --ids "${BUILD_ID}" \
                  --query 'builds[0].logs.deepLink' --output text
                exit 1 ;;
            esac
            sleep 20
          done

  smoke-assertions:
    name: Smoke Assertion Tests
    runs-on: arc-runner-org
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install pytest
        run: pip install pytest

      - name: Run smoke assertion tests
        run: pytest platform/scripts/tests/test_smoke_assertions.py -v --tb=short
