name: Superplane Infra Plan

# Terraform plan + full test suite for the Superplane infra root modules.
# Issue #5042 (U3), EPIC #4910. Mirrors cyber-infra-plan.yml, with two deliberate
# differences documented below. Extended by #5532 (w6-09) to cover the workspaces
# root module as a second matrix leg of the test job.
#
# ACCEPTANCE CRITERION: 100% of the .tftest.hcl files in EVERY root module's tests/
# directory execute in this lane.
#
# That is enforced by construction rather than by a list. `terraform test` discovers every
# `tests/*.tftest.hcl` itself, so a new test file is picked up with no edit here — but
# discovery alone would let the count silently fall to zero, and "0 tests ran" and "all
# tests passed" are the same exit code (0). Both this repo's `superplane-domain-ci.yml` and
# `script-tests.yml` call that hazard out by name, and I hit it during development: running
# `terraform test` from the wrong directory reported "Success! 0 passed, 0 failed."
#
# So this lane counts the test files itself, compares that count against the number
# `terraform test` reports as executed, and fails if they disagree. A deleted test file, a
# renamed directory or a file that silently fails to load all surface as a failure instead
# of a green tick over nothing.
#
# DIFFERENCE 1 — OFFLINE TESTS AND A SEPARATE CREDENTIALED PLAN.
#
# Both jobs use the existing self-hosted arc-runner-org pool, per owner instruction.
# The tests use mock_provider "aws" and override_data. Their job-local environment
# disables normal AWS credential discovery, including IRSA, shared files and metadata.
# The runner still has its platform identity; this is not a host isolation boundary.
# The separate plan job retains its existing credentials to read real remote state.
#
# DIFFERENCE 2 — THE TEST JOB GATES THE PLAN JOB.
#
# `plan` needs `tests`. The validations in variables.tf are the enforcement mechanism for
# acceptance criteria 3 and 4, and the suite is what proves they still fire. Running an
# credentialed plan before knowing the guards work would report a tidy plan for a module
# whose CORS rule had become unreachable dead code — which is a real failure this suite
# caught during development, not a hypothetical.

on:
  pull_request:
    branches: [main]
    paths:
      - 'modules/domain-apps/superplane/infra/control-plane/**'
      # The workspaces root module (#5532, w6-09). Its tests run in the matrixed `tests`
      # job below; it has no entry in the credentialed `plan` job, which is deliberate —
      # see the matrix comment there.
      - 'modules/domain-apps/superplane/infra/workspaces/**'
      - 'modules/domain-apps/superplane/infra/domain-runtime/**'
      - 'environments/dev/modules/superplane.tfvars'
      - 'environments/dev/modules/superplane-backend.tfvars'
      # U2's lock is a Terraform INPUT here: ecr.tf derives repository names from it and
      # config.tf derives the digest-pinned SkyPilot image. A lock change alters the plan,
      # so it must be able to trigger the lane that shows the plan.
      - 'modules/domain-apps/superplane/releases/superplane.lock.yaml'
      - '.github/workflows/superplane-infra-plan.yml'
      # Documentation-only changes do not start this workflow.
      - '!docs/**'
      - '!**/docs/**'
      - '!**/README*'
      - '!**/CHANGELOG*'
      - '!**/CONTRIBUTING*'
      - '!**/*.rst'
  workflow_dispatch:

concurrency:
  group: superplane-infra-plan-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  TF_VAR_environment: dev
  MODULE_NAME: superplane
  TF_WORKING_DIR: modules/domain-apps/superplane/infra/control-plane
  BACKEND_CONFIG: environments/dev/modules/superplane-backend.tfvars
  VAR_FILE: environments/dev/modules/superplane.tfvars

jobs:
  # ---------------------------------------------------------------------------
  # Offline validations, formatting, and every .tftest.hcl file.
  # ---------------------------------------------------------------------------
  tests:
    name: Terraform tests (no AWS) — ${{ matrix.name }}
    runs-on: arc-runner-org
    strategy:
      # Every Superplane Terraform ROOT MODULE runs its suite here, one matrix leg each.
      #
      # A matrix rather than a second lane: the count guard below, the credential-free
      # shell and the "no credentials configured" check are the valuable parts, and they
      # are identical for every root module. Copying them into a per-module lane would
      # mean the copies drift, and the copy nobody reads is the one that drifts.
      #
      # A matrix rather than `-recursive` from the module root: `terraform test` is
      # per-root-module (it needs that module's providers initialised), and a single
      # invocation cannot span two roots with separate state.
      #
      # WHEN YOU ADD A ROOT MODULE, ADD IT HERE. `test_every_root_module_runs_in_ci` in
      # infra/workspaces/tests/test_ci_coverage.py fails if a directory containing
      # .tftest.hcl files has no leg, so this list cannot silently fall behind the repo.
      fail-fast: false
      matrix:
        include:
          - name: control-plane
            dir: modules/domain-apps/superplane/infra/control-plane
          - name: workspaces
            dir: modules/domain-apps/superplane/infra/workspaces
          - name: domain-runtime
            dir: modules/domain-apps/superplane/infra/domain-runtime
    # Tests use mocks. Disable normal AWS credential discovery in this job only;
    # the ARC runner retains its platform identity and is not a security sandbox.
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_CONFIG_FILE: /dev/null
      AWS_SHARED_CREDENTIALS_FILE: /dev/null
      AWS_CREDENTIAL_FILE: /dev/null
      BOTO_CONFIG: /dev/null
      AWS_DEFAULT_REGION: us-east-1
    defaults:
      run:
        # Unset rather than empty: the container provider treats presence as enabled.
        shell: >-
          env -u AWS_ACCESS_KEY_ID -u AWS_SECRET_ACCESS_KEY -u AWS_SESSION_TOKEN
          -u AWS_SECURITY_TOKEN -u AWS_ROLE_ARN -u AWS_WEB_IDENTITY_TOKEN_FILE
          -u AWS_CONTAINER_CREDENTIALS_FULL_URI -u AWS_CONTAINER_CREDENTIALS_RELATIVE_URI
          -u AWS_CONTAINER_AUTHORIZATION_TOKEN -u AWS_CONTAINER_AUTHORIZATION_TOKEN_FILE
          -u AWS_PROFILE -u AWS_DEFAULT_PROFILE
          bash --noprofile --norc -e -o pipefail {0}
    # No `id-token` permission: this job must not be able to assume an AWS role.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
          # The wrapper intercepts stdout, which the test-count guard below parses.
          terraform_wrapper: false

      - name: Terraform fmt
        working-directory: ${{ matrix.dir }}
        run: terraform fmt -check -recursive -diff

      - name: Terraform init (no backend)
        working-directory: ${{ matrix.dir }}
        # `-backend=false` is what keeps this job credential-free: it installs providers
        # without contacting S3 for state. The backend is exercised by the plan job.
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        working-directory: ${{ matrix.dir }}
        run: terraform validate

      - name: Run every .tftest.hcl and prove none was skipped
        working-directory: ${{ matrix.dir }}
        # The coverage criterion. `terraform test` discovers the files; this step verifies
        # the discovery actually found them, because a zero-file run exits 0.
        run: |
          set -euo pipefail

          EXPECTED=$(find tests -name '*.tftest.hcl' | wc -l | tr -d ' ')
          echo "Test files present in tests/: ${EXPECTED}"

          if [ "$EXPECTED" -eq 0 ]; then
            echo "::error::No .tftest.hcl files found in ${{ matrix.dir }}/tests. The acceptance criterion for this unit requires 100% of them to execute; zero files means they were moved or deleted, and 'terraform test' would exit 0 regardless."
            exit 1
          fi

          find tests -name '*.tftest.hcl' | sort | sed 's/^/  - /'

          terraform test -no-color 2>&1 | tee /tmp/test-output.txt

          # `terraform test` prints one "<file>... pass" or "... fail" line per FILE (in
          # addition to per-run lines). Counting those against the files on disk is what
          # turns "the command exited 0" into "every file ran".
          EXECUTED=$(grep -cE '^tests/.*\.tftest\.hcl\.\.\. (pass|fail)$' /tmp/test-output.txt || echo "0")
          echo "Test files executed: ${EXECUTED} of ${EXPECTED}"

          if [ "$EXECUTED" -ne "$EXPECTED" ]; then
            echo "::error::${EXECUTED} of ${EXPECTED} .tftest.hcl files executed. Every test file must run (acceptance criterion for issue #5042). A file that fails to load is reported as not executed rather than as a failure, so this gap is the symptom."
            exit 1
          fi

          # Belt and braces: the summary line must not report zero.
          if grep -qE '^Success! 0 passed, 0 failed' /tmp/test-output.txt; then
            echo "::error::terraform test reported 0 runs. 'No tests ran' and 'all tests passed' share exit code 0 — this is the failure that guard exists for."
            exit 1
          fi

          echo "All ${EXPECTED} test files executed."

      - name: Verify no AWS credentials were configured
        # Verify the test process environment; the plan job keeps its own identity.
        run: |
          set -euo pipefail
          FOUND=""
          for var in AWS_ROLE_ARN AWS_WEB_IDENTITY_TOKEN_FILE AWS_ACCESS_KEY_ID \
                     AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN \
                     AWS_CONTAINER_CREDENTIALS_FULL_URI \
                     AWS_CONTAINER_CREDENTIALS_RELATIVE_URI; do
            if [ -n "${!var:-}" ]; then
              FOUND="${FOUND} ${var}"
            fi
          done
          if [ -n "$FOUND" ]; then
            echo "::error::AWS credentials are present in this job (set:${FOUND}). The Terraform test suite is mock-driven and must never need an account; the plan job is where credentials belong."
            exit 1
          fi
          echo "Confirmed: no AWS credentials in this job's environment."

      - name: Summary
        if: always()
        run: |
          {
            echo "## Superplane Terraform tests — ${{ matrix.name }}"
            echo "- **Root module**: \`${{ matrix.dir }}\`"
            echo "- **Runner**: arc-runner-org (offline test environment)"
            echo "- **Test files**: $(find ${{ matrix.dir }}/tests -name '*.tftest.hcl' | wc -l | tr -d ' ')"
            echo "- **Status**: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # The credentialed half: a real plan against real state.
  #
  # CONTROL PLANE ONLY, and not an oversight. A workspace root module plans against a
  # TENANT account with its own state key per workspace, so there is no single
  # (backend, var-file) pair this job could use — and #5532 authorises offline
  # verification only: no account vending, apply or spend. Workspace plans are produced
  # by an operator with the target account's credentials and checked by
  # infra/workspaces/scripts/check_workspace_plan.py, which is the reviewable artifact
  # that stands in for this job. `needs: tests` still gates on BOTH matrix legs.
  # ---------------------------------------------------------------------------
  plan:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch')
    name: Terraform Plan
    needs: tests
    environment: adp-deploy-dev
    runs-on: arc-runner-org
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - name: Verify source belongs to reviewed main history
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$GITHUB_SHA"
          git merge-base --is-ancestor HEAD FETCH_HEAD

      - name: Establish trusted deployment identity
        uses: ./.github/actions/trusted-deployment
        with:
          role_arn: ${{ vars.ADP_DEPLOY_ROLE_ARN }}
          region: ${{ vars.ADP_DEPLOY_REGION || 'us-east-1' }}

      - name: Install required CLI tools
        run: |
          set -euo pipefail
          for tool in aws terraform kubectl helm jq zip unzip curl git python3 node npm; do
            command -v "$tool" >/dev/null || { echo "::error::Reviewed runner image is missing $tool"; exit 1; }
          done
      - name: Resolve the target account into tfvars
        # The committed tfvars ship `account_id = "ACCOUNT_ID"`, a placeholder that
        # bootstrap.sh normally rewrites. CI has not run bootstrap.sh, so it is substituted
        # here with the account this runner is actually authenticated to.
        #
        # This is the provenance rule working as intended rather than a workaround: the
        # account comes from the caller's own identity, so a plan cannot target an account
        # nobody chose, and no account id is committed. `var.account_id`'s 12-digit
        # validation rejects the unsubstituted placeholder, so a failure of this step
        # surfaces as a clear validation error rather than a misnamed resource.
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "Planning against account ${ACCOUNT_ID}"
          sed -i "s/ACCOUNT_ID/${ACCOUNT_ID}/g" \
            "${{ env.VAR_FILE }}" \
            "${{ env.BACKEND_CONFIG }}"

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend-config="../../../../../${{ env.BACKEND_CONFIG }}" -input=false

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -e
          set -o pipefail
          terraform plan -var-file="../../../../../${{ env.VAR_FILE }}" -out=tfplan -no-color 2>&1 | tee /tmp/plan-output.txt

      - name: Post or update PR comment
        uses: actions/github-script@v9
        if: always() && github.event_name == 'pull_request'
        env:
          PLAN_OUTPUT: ${{ steps.plan.outcome }}
        with:
          script: |
            const fs = require('fs');
            const marker = `<!-- tf-plan:${{ env.MODULE_NAME }} -->`;
            let planText = '';
            try {
              planText = fs.readFileSync('/tmp/plan-output.txt', 'utf8');
            } catch (e) {
              planText = 'Plan output not available.';
            }
            if (planText.length > 60000) {
              planText = planText.substring(0, 60000) + '\n\n... (truncated)';
            }
            const status = process.env.PLAN_OUTPUT === 'success' ? ':white_check_mark:' : ':x:';
            const body = `${marker}\n${status} **Terraform Plan — \`${{ env.MODULE_NAME }}\`**\n\nApply is \`workflow_dispatch\`-only by design: merging this PR deploys nothing.\n\n<details>\n<summary>Plan output</summary>\n\n\`\`\`\n${planText}\n\`\`\`\n\n</details>\n\n*Updated: ${new Date().toISOString()} | Run: [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Summary
        if: always()
        env:
          SP_PLAN_OUTCOME: ${{ steps.plan.outcome }}
        run: |
          {
            echo "## Terraform Plan -- ${{ env.MODULE_NAME }}"
            echo "- **Module**: ${{ env.MODULE_NAME }}"
            echo "- **Status**: ${SP_PLAN_OUTCOME}"
            echo "- **Working dir**: ${{ env.TF_WORKING_DIR }}"
            echo "- **Apply**: manual (\`workflow_dispatch\` only) — merging deploys nothing"
          } >> "$GITHUB_STEP_SUMMARY"

  validate-pr-config:
    name: Terraform PR Configuration
    if: github.event_name == 'pull_request'
    runs-on: arc-runner-org
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.2
      - name: Validate without state or deployment credentials
        working-directory: modules/domain-apps/superplane/infra/control-plane
        run: |
          terraform init -backend=false -input=false
          terraform validate -no-color
