name: DevLake POC / independent native readback
on:
  workflow_dispatch:
    inputs:
      launch_manifest:
        description: Path to approved private campaign manifest on protected runner
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  observe:
    if: github.repository == 'aws-e/adp' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: arc-runner-org
    environment: adp-devlake-campaign
    timeout-minutes: 20
    env:
      ADP_DEVLAKE_CAMPAIGN_ROOT: ${{ secrets.ADP_DEVLAKE_CAMPAIGN_ROOT }}
      ADP_DEVLAKE_NATIVE_SOURCE_CONFIG: ${{ secrets.ADP_DEVLAKE_NATIVE_SOURCE_CONFIG }}
      LAUNCH_MANIFEST: ${{ inputs.launch_manifest }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r modules/insights/schemas/requirements.txt
      - run: |
          python3 modules/insights/poc/devlake/native_source.py \
            --config "$ADP_DEVLAKE_NATIVE_SOURCE_CONFIG" \
            --manifest "$LAUNCH_MANIFEST" --root "$ADP_DEVLAKE_CAMPAIGN_ROOT" \
            --revision "$GITHUB_SHA" --output "$RUNNER_TEMP/observation.json"
      - uses: ./.github/actions/upload-ci-evidence-s3
        with:
          name: devlake-native-readback-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/observation.json
          if-no-files-found: error
          retention-days: 7
