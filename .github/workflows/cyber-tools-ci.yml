name: Cyber tools service CI
on:
  pull_request:
    paths:
      - 'modules/tools/**'
      - 'modules/domain-apps/cyber/tools/**'
      - 'modules/domain-apps/cyber/agent/skills/url-analysis/**'
      - 'modules/agent-factory/task-agents/cyber/**'
      - '.github/workflows/cyber-tools-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cyber-tools-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: arc-runner-org
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install standalone runtime and test dependencies
        run: python -m pip install boto3==1.36.0 requests==2.34.2 fastapi==0.136.3 pydantic==2.12.5 rfc8785==0.1.4 'moto[dynamodb,s3,sqs]==5.0.27' pytest==9.0.3 ruff==0.9.6 httpx==0.28.1 Pillow
      - name: Check shared library and domain service
        env:
          PYTHONPATH: modules/tools:modules/domain-apps/cyber/tools:modules/domain-apps/cyber/agent/skills/url-analysis
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          ruff check modules/tools/adp_tools modules/domain-apps/cyber/tools/cyber_tools modules/domain-apps/cyber/tools/tests
          python -m pytest -q modules/domain-apps/cyber/tools/tests modules/domain-apps/cyber/tools/infra/tests/test_package_contract.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and test shared Claude SDK runtime through cyber persona
        run: |
          npm --prefix modules/agent-factory/task-agents/cyber ci --ignore-scripts
          npm --prefix modules/agent-factory/task-agents/cyber run build
          npm --prefix modules/agent-factory/task-agents/cyber test
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
      - name: Validate infrastructure with mock providers
        working-directory: modules/domain-apps/cyber/tools/infra
        run: |
          terraform init -backend=false -input=false
          terraform validate
          terraform test
