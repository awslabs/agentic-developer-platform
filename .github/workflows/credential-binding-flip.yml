name: Credential Binding Enforcement Flip

# Gated enforcement flip for ENFORCE_CREDENTIAL_BINDING.
# Dispatched by Orchestrator B after the 7-day zero-drift soak completes.
# This workflow is the ONLY sanctioned path for enabling enforcement — no manual
# env edits, no ad-hoc SSM puts. The audit trail lives here.
#
# Issue: #3182 (S9 of EPIC #3172)
# Design: docs/design/credential-authorization-binding.md §Phase 2
#
# Hard-asserts before flipping:
#   1. credential_authorization_drift metric == 0 (7d trailing window)
#   2. Registry-row coverage == 100% (zero fallback events in 7d)
#   3. Latest nightly adversarial E2E (S8) green
#   4. ENABLE_USER_CREDENTIALS=true in sandbox tenant (anti-gaming)
#
# NO CloudWatch-alarm auto-flip — flips are explicit dispatches only.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment to flip enforcement (dev/staging/prod)'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      window_days:
        description: 'Trailing window in days for drift/coverage assertions (default: 7)'
        required: false
        default: '7'
      dry_run:
        description: 'Dry-run mode — assert gates only, do NOT flip the flag'
        required: false
        type: boolean
        default: false

concurrency:
  group: credential-binding-flip-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  actions: read

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: ${{ inputs.environment }}
  WINDOW_DAYS: ${{ inputs.window_days || '7' }}
  SANDBOX_TENANT: adp-security-test
  NIGHTLY_WORKFLOW: credential-binding-adversarial-e2e.yml

jobs:
  # =========================================================================
  # Job 1: Gate — hard-assert all preconditions
  # =========================================================================
  gate:
    name: Assert flip preconditions (${{ inputs.environment }})
    runs-on: ${{ vars.ARC_RUNNER_LABEL || 'arc-runner-org' }}
    timeout-minutes: 10
    outputs:
      gate_passed: ${{ steps.gate.outputs.passed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Run flip-gate assertions
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -o pipefail

          echo "## Credential Binding Flip Gate — ${{ inputs.environment }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | ${{ inputs.environment }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Window | ${{ inputs.window_days || '7' }} days |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dry run | ${{ inputs.dry_run }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dispatched by | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          chmod +x platform/scripts/flip-gate-check.sh

          if platform/scripts/flip-gate-check.sh \
            --environment "${{ inputs.environment }}" \
            --window-days "${{ inputs.window_days || '7' }}" \
            --sandbox-tenant "$SANDBOX_TENANT" \
            --aws-region "$AWS_REGION" \
            --repo "${{ github.repository }}" 2>&1 | tee gate-output.txt; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
            echo "### ✅ All gates passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
            echo "### ❌ Gate(s) failed — flip blocked" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat gate-output.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Hard-fail if gate did not pass
        if: steps.gate.outputs.passed != 'true'
        run: |
          echo "::error::Flip gate assertions FAILED. The enforcement flip is blocked."
          echo "::error::Review the gate output above and resolve all failures before re-dispatching."
          exit 1

  # =========================================================================
  # Job 2: Flip — set ENFORCE_CREDENTIAL_BINDING=true via SSM + redeploy
  # =========================================================================
  flip:
    name: Flip enforcement (${{ inputs.environment }})
    runs-on: ${{ vars.ARC_RUNNER_LABEL || 'arc-runner-org' }}
    needs: gate
    if: needs.gate.outputs.gate_passed == 'true' && inputs.dry_run != true
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write   # Required by "Trigger gateway redeploy" step (gh workflow run)
      id-token: write  # Required by configure-aws-credentials OIDC (job-level overrides workflow-level)

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Set ENFORCE_CREDENTIAL_BINDING=true in SSM
        id: flip
        run: |
          SSM_PARAM="/adp/${{ inputs.environment }}/gateway/enforce-credential-binding"

          echo "Setting ${SSM_PARAM} = true"
          aws ssm put-parameter \
            --name "$SSM_PARAM" \
            --value "true" \
            --type String \
            --overwrite \
            --region "$AWS_REGION" \
            --description "Credential binding enforcement flag (S9 #3182). Set by credential-binding-flip.yml run ${{ github.run_id }}"

          echo "param_name=${SSM_PARAM}" >> "$GITHUB_OUTPUT"
          echo "✅ SSM parameter set: ${SSM_PARAM} = true"

      - name: Trigger gateway redeploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering gateway-deploy.yml to pick up new config..."
          gh workflow run gateway-deploy.yml \
            --repo "${{ github.repository }}" \
            -f environment="${{ inputs.environment }}"

          echo "✅ Gateway redeploy triggered. The pod will pick up ENFORCE_CREDENTIAL_BINDING=true on next ConfigMap render."

      - name: Post flip summary
        run: |
          echo "## ✅ Enforcement Flip Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Action | Detail |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| SSM parameter | \`${{ steps.flip.outputs.param_name }}\` = \`true\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | ${{ inputs.environment }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Gateway redeploy | triggered |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Run ID | ${{ github.run_id }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Actor | ${{ github.actor }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Rollback:** Re-dispatch this workflow is NOT the rollback path." >> "$GITHUB_STEP_SUMMARY"
          echo "To rollback: \`aws ssm put-parameter --name ${{ steps.flip.outputs.param_name }} --value false --type String --overwrite\` then trigger gateway-deploy." >> "$GITHUB_STEP_SUMMARY"

  # =========================================================================
  # Job 3: Dry-run summary (when dry_run=true and gate passed)
  # =========================================================================
  dry-run-summary:
    name: Dry-run summary
    runs-on: ${{ vars.ARC_RUNNER_LABEL || 'arc-runner-org' }}
    needs: gate
    if: needs.gate.outputs.gate_passed == 'true' && inputs.dry_run == true

    steps:
      - name: Report dry-run result
        run: |
          echo "## 🔍 Dry Run — All Gates Passed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "All four preconditions are satisfied. The enforcement flip **would succeed** if dispatched without dry-run." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "To execute the real flip, re-dispatch with \`dry_run: false\`." >> "$GITHUB_STEP_SUMMARY"
