name: Agent Context CI

on:
  pull_request:
    paths:
      - 'modules/agent-context/door/**'
      - 'modules/agent-context/agent_context/**'
      - 'modules/agent-context/pipeline/**'
      - 'modules/agent-context/tests/**'
      - 'modules/agent-context/pyproject.toml'
    branches:
      - main
  push:
    paths:
      - 'modules/agent-context/door/**'
      - 'modules/agent-context/agent_context/**'
      - 'modules/agent-context/pipeline/**'
      - 'modules/agent-context/pyproject.toml'
    branches:
      - main

concurrency:
  group: agent-context-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: arc-runner-org
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: modules/agent-context/pyproject.toml

      - name: Install dependencies
        working-directory: modules/agent-context
        run: |
          # Pinned: pyproject.toml sets no [tool.ruff.lint] select, so an
          # unpinned install inherits whatever rule set the newest ruff enables
          # by default. ruff 0.16.0 (2026-07-23) broadened that set and turned
          # 638 pre-existing findings across ~141 untouched files into CI
          # failures. Matches the pin already used in webhook-ingress-ci.yml.
          pip install 'ruff==0.15.20'

      - name: Run Ruff
        working-directory: modules/agent-context
        run: |
          ruff check .

  test:
    name: Test
    runs-on: arc-runner-org
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: modules/agent-context/pyproject.toml

      - name: Install dependencies
        working-directory: modules/agent-context
        run: |
          # mcp pinned <2: mcp 2.0.0 (2026-07-28) is a breaking major that removed
          # mcp.server.FastMCP, which door/mcp_app.py imports — an unpinned install
          # now resolves to it and breaks collection of every test that imports
          # door.server. This job was previously gated (skipped) by a red lint job,
          # so the drift was invisible. 1.29.0 is the last release exporting it.
          pip install pytest pytest-asyncio httpx respx pydantic pydantic-settings asgi-lifespan \
            boto3 sqlalchemy fastapi 'mcp<2' requests pyyaml uvicorn \
            psycopg2-binary python-hcl2 neo4j python-ulid \
            opentelemetry-sdk opentelemetry-exporter-otlp

      - name: Run Tests
        working-directory: modules/agent-context
        env:
          PYTHONPATH: ${{ github.workspace }}/modules/agent-context
        run: |
          pytest tests/ -v --tb=short \
            -m "not live_only and not graphrag and not workflow"
