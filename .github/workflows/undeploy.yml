name: Undeploy (Full Teardown)

on:
  workflow_dispatch:
    inputs:
      account_id:
        description: 'Type the target AWS account ID (12 digits) to confirm destruction.'
        required: true
        type: string
      dry_run:
        description: 'When true, runs terraform plan -destroy (report only, no destruction).'
        required: false
        type: boolean
        default: false
      skip_phases:
        description: 'Comma-separated phases to skip (superplane,agent-context,webhook-ingress,agent-factory,gateway,platform).'
        required: false
        default: ''
      include_bootstrap:
        description: 'Also destroy the Terraform state backend (S3 + DynamoDB). IRREVERSIBLE.'
        required: false
        type: boolean
        default: false
      customer_account_id:
        description: 'Customer-linked AWS account to destroy in (cross-account mode).'
        required: false
        default: ''
      customer_aws_label:
        description: 'Vaulted credential label (when customer_account_id is set).'
        required: false
        default: ''
      customer_user_id:
        description: 'ADP users.id UUID (when customer_account_id is set).'
        required: false
        default: ''
      environment:
        description: 'Deployment environment (dev/staging/prod).'
        required: false
        default: 'dev'

concurrency:
  group: undeploy-${{ inputs.customer_account_id || 'default' }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: ${{ inputs.environment || 'dev' }}

jobs:
  # ---------------------------------------------------------------------------
  # Phase 0: Guard — validate account_id matches resolved caller/customer
  # ---------------------------------------------------------------------------
  guard:
    name: Guard (validate account_id)
    if: github.ref == 'refs/heads/main'
    environment: adp-deploy-${{ inputs.environment || 'dev' }}
    runs-on: arc-runner-org
    permissions:
      id-token: write
      contents: read
    outputs:
      account_id: ${{ steps.validate.outputs.account_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify source belongs to reviewed main history
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$GITHUB_SHA"
          git merge-base --is-ancestor HEAD FETCH_HEAD

      - name: Establish trusted deployment identity
        uses: ./.github/actions/trusted-deployment
        with:
          role_arn: ${{ vars.ADP_DEPLOY_ROLE_ARN }}
          region: ${{ vars.ADP_DEPLOY_REGION || 'us-east-1' }}

      - name: Load deployment config
        uses: ./.github/actions/load-deploy-config
        with:
          environment: ${{ inputs.environment }}
          customer_account_id: ${{ inputs.customer_account_id }}
          customer_aws_label: ${{ inputs.customer_aws_label }}
          customer_user_id: ${{ inputs.customer_user_id }}

      - name: Validate account_id matches caller
        id: validate
        env:
          ADP_INPUT_824138160E: ${{ inputs.customer_account_id }}
          ADP_INPUT_065C76B83D: ${{ inputs.account_id }}
        run: |
          set -e
          # Determine which account ID to validate against
          if [ -n "${ADP_INPUT_824138160E}" ]; then
            EXPECTED_ACCOUNT="${ADP_INPUT_824138160E}"
            echo "Cross-account mode: validating against customer account"
          else
            EXPECTED_ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
            echo "Single-account mode: validating against caller identity"
          fi

          INPUT_ACCOUNT="${ADP_INPUT_065C76B83D}"

          echo "Expected: $EXPECTED_ACCOUNT"
          echo "Provided: $INPUT_ACCOUNT"

          if [ "$INPUT_ACCOUNT" != "$EXPECTED_ACCOUNT" ]; then
            echo "::error::account_id input ($INPUT_ACCOUNT) does not match target account ($EXPECTED_ACCOUNT). Aborting to prevent cross-account misfire."
            exit 1
          fi

          echo "account_id=$EXPECTED_ACCOUNT" >> "$GITHUB_OUTPUT"
          echo "Guard passed: account_id confirmed."
  # ---------------------------------------------------------------------------
  # Destroy — run undeploy phases sequentially via shared library
  # ---------------------------------------------------------------------------
  destroy:
    name: Destroy Modules
    needs: guard
    if: github.ref == 'refs/heads/main'
    environment: adp-deploy-${{ inputs.environment || 'dev' }}
    runs-on: arc-runner-org
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify source belongs to reviewed main history
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$GITHUB_SHA"
          git merge-base --is-ancestor HEAD FETCH_HEAD

      - name: Establish trusted deployment identity
        uses: ./.github/actions/trusted-deployment
        with:
          role_arn: ${{ vars.ADP_DEPLOY_ROLE_ARN }}
          region: ${{ vars.ADP_DEPLOY_REGION || 'us-east-1' }}

      - name: Load deployment config
        uses: ./.github/actions/load-deploy-config
        with:
          environment: ${{ inputs.environment }}
          customer_account_id: ${{ inputs.customer_account_id }}
          customer_aws_label: ${{ inputs.customer_aws_label }}
          customer_user_id: ${{ inputs.customer_user_id }}

      - name: Install required CLI tools
        run: |
          set -euo pipefail
          for tool in aws terraform kubectl helm jq zip unzip curl git python3 node npm; do
            command -v "$tool" >/dev/null || { echo "::error::Reviewed runner image is missing $tool"; exit 1; }
          done
      - name: Configure kubectl
        run: |
          set -e
          CLUSTER_NAME="adp-${ENVIRONMENT}-eks-cluster"
          aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "${{ env.AWS_REGION }}" 2>/dev/null || {
            echo "WARNING: Could not configure kubectl. EKS cluster may not exist."
          }

      - name: Run undeploy phases
        env:
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          SKIP_PHASES: ${{ inputs.skip_phases }}
        run: |
          set -e
          export ROOT_DIR="${GITHUB_WORKSPACE}"
          export ENVIRONMENT="${{ env.ENVIRONMENT }}"
          export AWS_REGION="${{ env.AWS_REGION }}"

          # One orchestrator validates every selected plan before any mutation.
          # This workflow's account guard is already explicit operator authorization.
          args=(--environment "$ENVIRONMENT" --region "$AWS_REGION" --yes)
          if [ "$DRY_RUN" = true ]; then
            args+=(--dry-run)
          fi
          IFS=',' read -ra skipped <<< "$SKIP_PHASES"
          for phase in "${skipped[@]}"; do
            phase=$(echo "$phase" | xargs)
            [ -z "$phase" ] || args+=(--skip "${phase//-/_}")
          done
          account=$(aws sts get-caller-identity --query Account --output text)
          printf '%s\n' "$account" | bash platform/scripts/undeploy.sh "${args[@]}"

      - name: Summary
        if: always()
        env:
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          SKIP_PHASES: ${{ inputs.skip_phases }}
        run: |
          echo "## Undeploy Orchestrator" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Account**: ${{ needs.guard.outputs.account_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Environment**: ${{ env.ENVIRONMENT }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Dry run**: ${DRY_RUN}" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$SKIP_PHASES" ]; then
            echo "- **Skipped phases**: ${SKIP_PHASES}" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Destroy Order" >> "$GITHUB_STEP_SUMMARY"
          echo "1. superplane" >> "$GITHUB_STEP_SUMMARY"
          echo "2. agent-context" >> "$GITHUB_STEP_SUMMARY"
          echo "3. agent-factory" >> "$GITHUB_STEP_SUMMARY"
          echo "4. webhook-ingress" >> "$GITHUB_STEP_SUMMARY"
          echo "5. gateway" >> "$GITHUB_STEP_SUMMARY"
          echo "6. platform" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Note**: Terraform state backend is NOT destroyed unless \`include_bootstrap\` is enabled." >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Bootstrap destroy — opt-in, IRREVERSIBLE, runs only after all modules
  # ---------------------------------------------------------------------------
  bootstrap:
    name: Destroy State Backend (opt-in)
    needs: destroy
    if: github.ref == 'refs/heads/main' && (inputs.include_bootstrap == true) && (inputs.dry_run == false)
    environment: adp-deploy-${{ inputs.environment || 'dev' }}
    runs-on: arc-runner-org
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify source belongs to reviewed main history
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$GITHUB_SHA"
          git merge-base --is-ancestor HEAD FETCH_HEAD

      - name: Establish trusted deployment identity
        uses: ./.github/actions/trusted-deployment
        with:
          role_arn: ${{ vars.ADP_DEPLOY_ROLE_ARN }}
          region: ${{ vars.ADP_DEPLOY_REGION || 'us-east-1' }}

      - name: Load deployment config
        uses: ./.github/actions/load-deploy-config
        with:
          environment: ${{ inputs.environment }}
          customer_account_id: ${{ inputs.customer_account_id }}
          customer_aws_label: ${{ inputs.customer_aws_label }}
          customer_user_id: ${{ inputs.customer_user_id }}

      - name: Install AWS CLI
        run: |
          set -euo pipefail
          for tool in aws terraform kubectl helm jq zip unzip curl git python3 node npm; do
            command -v "$tool" >/dev/null || { echo "::error::Reviewed runner image is missing $tool"; exit 1; }
          done
      - name: Destroy Terraform state backend
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          ENVIRONMENT: ${{ env.ENVIRONMENT }}
        run: |
          set -e
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          STATE_BUCKET="adp-terraform-state-${ACCOUNT_ID}"
          LOCK_TABLE="adp-terraform-locks"

          python3 platform/scripts/teardown.py --check-backend-empty --environment "$ENVIRONMENT" --region "$AWS_REGION"

          echo "Destroying state backend..."
          echo "  Bucket: $STATE_BUCKET"
          echo "  Table:  $LOCK_TABLE"

          # Empty and delete the S3 bucket
          if aws s3api head-bucket --bucket "$STATE_BUCKET" 2>/dev/null; then
            echo "Emptying state bucket..."
            bash platform/scripts/empty-s3-buckets.sh "$STATE_BUCKET"
            echo "Deleting state bucket..."
            aws s3api delete-bucket --bucket "$STATE_BUCKET" --region "$AWS_REGION" || {
              echo "::warning::Could not delete bucket $STATE_BUCKET. May need manual cleanup."
            }
          else
            echo "State bucket $STATE_BUCKET does not exist. Skipping."
          fi

          # Delete DynamoDB lock table
          if aws dynamodb describe-table --table-name "$LOCK_TABLE" --region "$AWS_REGION" > /dev/null 2>&1; then
            echo "Deleting DynamoDB lock table..."
            aws dynamodb delete-table --table-name "$LOCK_TABLE" --region "$AWS_REGION" > /dev/null || {
              echo "::warning::Could not delete DynamoDB table $LOCK_TABLE."
            }
          else
            echo "DynamoDB table $LOCK_TABLE does not exist. Skipping."
          fi

          echo "State backend destruction complete."

      - name: Summary
        if: always()
        run: |
          echo "## Bootstrap Destroy" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Terraform state backend (S3 bucket + DynamoDB lock table) has been destroyed." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**To redeploy**, run \`platform/scripts/bootstrap.sh\` first." >> "$GITHUB_STEP_SUMMARY"
