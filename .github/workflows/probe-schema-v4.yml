name: Probe Schema v4
on:
  workflow_dispatch:
env:
  AWS_REGION: us-east-1
jobs:
  probe:
    if: github.ref == 'refs/heads/main'
    environment: adp-deploy-dev
    permissions:
      contents: read
      id-token: write
    runs-on:
      group: adp-deployment
      labels: arc-runner-deployment
    steps:
      - uses: actions/checkout@v7
      - name: Verify source belongs to reviewed main history
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$GITHUB_SHA"
          git merge-base --is-ancestor HEAD FETCH_HEAD

      - name: Establish trusted deployment identity
        uses: ./.github/actions/trusted-deployment
        with:
          role_arn: ${{ vars.ADP_DEPLOY_ROLE_ARN }}
          region: ${{ vars.ADP_DEPLOY_REGION || 'us-east-1' }}

      - run: |
          command -v kubectl >/dev/null
          aws eks update-kubeconfig --name adp-dev-eks-cluster --region "$AWS_REGION" >/dev/null
      - run: |
          set -euo pipefail
          NS="adp-gateway"
          POD=$(kubectl get pods -n "$NS" --field-selector=status.phase=Running -o jsonpath='{.items[0].metadata.name}')
          # Show full env from the running container
          echo "=== App env vars (DB-related) ==="
          kubectl exec -n "$NS" "$POD" -- env | grep -iE "^(POSTGRES|DATABASE|DB_)" | sort || true
          echo
          echo "=== Current alembic head ==="
          kubectl exec -n "$NS" "$POD" -- env PYTHONPATH=/app alembic current
