name: GitLab Integration Tests
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('gitlab-contract-pr-{0}', github.event.number) || 'cli-live-eval-dev' }}
  cancel-in-progress: false
jobs:
  gitlab-webhook-contract:
    name: GitLab Webhook Contract
    runs-on: arc-runner-org
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: modules/agent-factory
        run: |
          pip install pytest requests boto3 pytest-timeout
      - name: Verify GitLab publish and ignore contracts
        working-directory: modules/agent-factory
        env:
          GITLAB_WEBHOOK_SECRET: test-gitlab-secret
          GITLAB_WEBHOOK_SECRET_ARN: ''
        run: python3 -m pytest webhook-ingress/lambda/gitlab/tests -q --tb=short
      - name: Verify fleet-diagnostics helpers
        working-directory: modules/agent-factory
        run: python3 -m pytest tests/unit/test_fleet_diagnostics.py -q --tb=short
    permissions:
      contents: read
  gitlab-live-fleet:
    name: GitLab Live Fleet
    runs-on: arc-runner-org
    timeout-minutes: 20
    environment: adp-checks-dev
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Assume protected integration-check identity
        uses: awslabs/agentic-developer-platform/.github/actions/trusted-checks@1c750b906b46b7806a2363a5e47dcfed92fac918
        with:
          role_arn: ${{ vars.ADP_CHECKS_ROLE_ARN }}
          region: ${{ vars.ADP_DEPLOY_REGION || 'us-east-1' }}
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: modules/agent-factory
        run: |
          pip install pytest requests boto3 pytest-timeout
      - name: Resolve test configuration from SSM
        uses: ./.github/actions/gitlab-e2e-config
      - name: Run GitLab live-fleet tests
        id: live_tests
        working-directory: modules/agent-factory
        env:
          E2E_LATENCY_DIR: ${{ github.workspace }}/live-fleet-latency
        run: |
          mkdir -p "$E2E_LATENCY_DIR"
          python3 -m pytest -p regression_pytest tests/e2e/test_gitlab_live_fleet.py \
            -v --tb=short --timeout=600 \
            -m "live_fleet" \
            --junitxml=live-fleet-results.xml
      - name: Upload live-fleet results and latency
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gitlab-live-fleet-results
          path: |
            modules/agent-factory/live-fleet-results.xml
            live-fleet-latency/
      - name: Summary
        if: always()
        run: |
          {
            echo "## GitLab Live Fleet"
            echo ""
            echo "Live proof of webhook -> Lambda -> SQS -> agent-worker -> comment."
            echo "Needs a real worker pod, so it depends on shared dev-fleet capacity."
            echo "Reported separately and not configured as a required merge context."
            echo "A failed live assertion remains a failed check; it is never greenwashed."
            echo ""
            echo "- **Result**: \`${{ steps.live_tests.outcome }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f modules/agent-factory/live-fleet-results.xml ]; then
            TESTS=$(grep -oP 'tests="\K[^"]+' modules/agent-factory/live-fleet-results.xml | head -1)
            FAILURES=$(grep -oP 'failures="\K[^"]+' modules/agent-factory/live-fleet-results.xml | head -1)
            ERRORS=$(grep -oP 'errors="\K[^"]+' modules/agent-factory/live-fleet-results.xml | head -1)
            {
              echo "- **Tests**: ${TESTS:-0}"
              echo "- **Failures**: ${FAILURES:-0}"
              echo "- **Errors**: ${ERRORS:-0}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Enqueue to acknowledgement latency" >> "$GITHUB_STEP_SUMMARY"
          if [ -f live-fleet-latency/e2e-latency-aggregate.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat live-fleet-latency/e2e-latency-aggregate.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- No latency recording produced." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Verify complete scenario evidence
        if: always()
        run: python .github/scripts/regression_report.py junit --suite gitlab-live-fleet --junit modules/agent-factory/live-fleet-results.xml
          --inventory test-results/gitlab-live-fleet-inventory.json --output test-results/gitlab-live-fleet-result.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gitlab-live-fleet-coverage
          path: test-results/
          if-no-files-found: error
          retention-days: 14
      - name: Publish mutation boundary
        id: boundary
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.live_tests.outcome }}
        run: |-
          if [ "$TEST_OUTCOME" = success ] || [ "$TEST_OUTCOME" = skipped ]; then
            echo 'cleanup_ok=true' >> "$GITHUB_OUTPUT"
          else
            echo 'cleanup_ok=false' >> "$GITHUB_OUTPUT"
          fi
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    env:
      PYTHONPATH: ${{ github.workspace }}/.github/scripts
      REGRESSION_INVENTORY: ${{ github.workspace }}/test-results/gitlab-live-fleet-inventory.json
    outputs:
      cleanup_ok: ${{ steps.boundary.outputs.cleanup_ok }}
  gitlab-deployed-contract:
    name: GitLab Deployed Webhook Contract
    runs-on: arc-runner-org
    timeout-minutes: 10
    environment: adp-checks-dev
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Assume protected integration-check identity
        uses: awslabs/agentic-developer-platform/.github/actions/trusted-checks@1c750b906b46b7806a2363a5e47dcfed92fac918
        with:
          role_arn: ${{ vars.ADP_CHECKS_ROLE_ARN }}
          region: ${{ vars.ADP_DEPLOY_REGION || 'us-east-1' }}
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        working-directory: modules/agent-factory
        run: |
          pip install pytest requests boto3 pytest-timeout
      - name: Resolve test configuration from SSM
        uses: ./.github/actions/gitlab-e2e-config
      - name: Verify GitLab publish and ignore contracts
        working-directory: modules/agent-factory
        env:
          GITLAB_WEBHOOK_SECRET: test-gitlab-secret
          GITLAB_WEBHOOK_SECRET_ARN: ''
        run: python3 -m pytest webhook-ingress/lambda/gitlab/tests -q --tb=short
      - name: Verify fleet-diagnostics helpers
        working-directory: modules/agent-factory
        run: python3 -m pytest tests/unit/test_fleet_diagnostics.py -q --tb=short
      - name: Run GitLab webhook contract tests
        working-directory: modules/agent-factory
        run: |
          python3 -m pytest -p regression_pytest tests/e2e/test_gitlab_roundtrip.py tests/e2e/test_github_regression.py \
            -v --tb=short --timeout=120 \
            -m "integration and not live_fleet" \
            --junitxml=contract-results.xml
        id: live_tests
      - name: Upload contract test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gitlab-contract-test-results
          path: modules/agent-factory/contract-results.xml
      - name: Summary
        if: always()
        run: |
          {
            echo "## GitLab Webhook Contract"
            echo ""
            echo "Deterministic checks on the webhook Lambda's synchronous reply."
            echo "Independent of agent-fleet load (#5354)."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f modules/agent-factory/contract-results.xml ]; then
            TESTS=$(grep -oP 'tests="\K[^"]+' modules/agent-factory/contract-results.xml | head -1)
            FAILURES=$(grep -oP 'failures="\K[^"]+' modules/agent-factory/contract-results.xml | head -1)
            ERRORS=$(grep -oP 'errors="\K[^"]+' modules/agent-factory/contract-results.xml | head -1)
            {
              echo "- **Tests**: ${TESTS:-0}"
              echo "- **Failures**: ${FAILURES:-0}"
              echo "- **Errors**: ${ERRORS:-0}"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- No test results file found" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Verify complete scenario evidence
        if: always()
        run: python .github/scripts/regression_report.py junit --suite gitlab-deployed-contract --junit modules/agent-factory/contract-results.xml
          --inventory test-results/gitlab-deployed-contract-inventory.json --output test-results/gitlab-deployed-contract-result.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gitlab-deployed-contract-coverage
          path: test-results/
          if-no-files-found: error
          retention-days: 14
      - name: Publish mutation boundary
        id: boundary
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.live_tests.outcome }}
        run: |-
          if [ "$TEST_OUTCOME" = success ] || [ "$TEST_OUTCOME" = skipped ]; then
            echo 'cleanup_ok=true' >> "$GITHUB_OUTPUT"
          else
            echo 'cleanup_ok=false' >> "$GITHUB_OUTPUT"
          fi
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    env:
      PYTHONPATH: ${{ github.workspace }}/.github/scripts
      REGRESSION_INVENTORY: ${{ github.workspace }}/test-results/gitlab-deployed-contract-inventory.json
    outputs:
      cleanup_ok: ${{ steps.boundary.outputs.cleanup_ok }}
'on':
  pull_request:
    paths:
      - modules/agent-factory/**
      - modules/source-control/gitlab/**
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - modules/agent-factory/**
      - modules/source-control/gitlab/**
  workflow_call:
    outputs:
      cleanup_ok:
        description: Integration fixtures completed or no live tests started
        value: ${{ jobs.gitlab-live-fleet.outputs.cleanup_ok == 'true' && jobs.gitlab-deployed-contract.outputs.cleanup_ok == 'true'
          }}
