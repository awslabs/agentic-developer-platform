name: GitLab Integration Tests

on:
  pull_request:
    paths:
      - 'modules/agent-factory/**'
      - 'modules/source-control/gitlab/**'
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - 'modules/agent-factory/**'
      - 'modules/source-control/gitlab/**'

concurrency:
  group: gitlab-e2e-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

# Two jobs, deliberately (#5354).
#
# `GitLab Webhook Contract` asserts only on the webhook Lambda's synchronous
# reply. It is deterministic, cannot be affected by fleet load, and is the check
# that should gate a merge.
#
# `GitLab Live Fleet` requires a real agent-worker pod to start and answer. It
# depends on shared dev-fleet capacity, so it reports separately and is not a
# required merge context. Its check conclusion still reflects the assertion:
# a live-path failure stays visible instead of being converted to green.
jobs:
  gitlab-webhook-contract:
    name: GitLab Webhook Contract
    runs-on: arc-runner-org
    timeout-minutes: 10
    environment: dev

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: modules/agent-factory
        run: |
          pip install pytest requests boto3 pytest-timeout


      - name: Resolve test configuration from SSM
        uses: ./.github/actions/gitlab-e2e-config

      - name: Verify GitLab publish and ignore contracts
        working-directory: modules/agent-factory
        env:
          GITLAB_WEBHOOK_SECRET: test-gitlab-secret
          GITLAB_WEBHOOK_SECRET_ARN: ''
        run: python3 -m pytest webhook-ingress/lambda/gitlab/tests -q --tb=short

      - name: Verify fleet-diagnostics helpers
        working-directory: modules/agent-factory
        run: python3 -m pytest tests/unit/test_fleet_diagnostics.py -q --tb=short

      # Deterministic: asserts only on the webhook Lambda's synchronous reply.
      # Excludes live_fleet explicitly so a future live test added to these files
      # cannot silently make this gating check load-dependent again.
      - name: Run GitLab webhook contract tests
        working-directory: modules/agent-factory
        run: |
          python3 -m pytest tests/e2e/test_gitlab_roundtrip.py tests/e2e/test_github_regression.py \
            -v --tb=short --timeout=120 \
            -m "integration and not live_fleet" \
            --junitxml=contract-results.xml

      - name: Upload contract test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gitlab-contract-test-results
          path: modules/agent-factory/contract-results.xml

      - name: Summary
        if: always()
        run: |
          {
            echo "## GitLab Webhook Contract"
            echo ""
            echo "Deterministic checks on the webhook Lambda's synchronous reply."
            echo "Independent of agent-fleet load (#5354)."
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f modules/agent-factory/contract-results.xml ]; then
            TESTS=$(grep -oP 'tests="\K[^"]+' modules/agent-factory/contract-results.xml | head -1)
            FAILURES=$(grep -oP 'failures="\K[^"]+' modules/agent-factory/contract-results.xml | head -1)
            ERRORS=$(grep -oP 'errors="\K[^"]+' modules/agent-factory/contract-results.xml | head -1)
            {
              echo "- **Tests**: ${TESTS:-0}"
              echo "- **Failures**: ${FAILURES:-0}"
              echo "- **Errors**: ${ERRORS:-0}"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- No test results file found" >> "$GITHUB_STEP_SUMMARY"
          fi

  gitlab-live-fleet:
    name: GitLab Live Fleet
    runs-on: arc-runner-org
    timeout-minutes: 20
    environment: dev

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        working-directory: modules/agent-factory
        run: |
          pip install pytest requests boto3 pytest-timeout

      - name: Resolve test configuration from SSM
        uses: ./.github/actions/gitlab-e2e-config

      # This job proves a real worker consumes a real queued job. It is reported
      # separately from the required deterministic contract check because it
      # depends on shared fleet capacity. The assertion remains strict: failure
      # makes this check red, while merge eligibility is controlled by requiring
      # GitLab Webhook Contract rather than this live-fleet context.
      - name: Run GitLab live-fleet tests
        id: live_fleet
        working-directory: modules/agent-factory
        env:
          E2E_LATENCY_DIR: ${{ github.workspace }}/live-fleet-latency
        run: |
          mkdir -p "$E2E_LATENCY_DIR"
          python3 -m pytest tests/e2e/test_gitlab_live_fleet.py \
            -v --tb=short --timeout=600 \
            -m "live_fleet" \
            --junitxml=live-fleet-results.xml

      # AC4 evidence: the per-run enqueue->ack latency series, retrievable per
      # run without needing CloudWatch access.
      - name: Upload live-fleet results and latency
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gitlab-live-fleet-results
          path: |
            modules/agent-factory/live-fleet-results.xml
            live-fleet-latency/

      - name: Summary
        if: always()
        run: |
          {
            echo "## GitLab Live Fleet"
            echo ""
            echo "Live proof of webhook -> Lambda -> SQS -> agent-worker -> comment."
            echo "Needs a real worker pod, so it depends on shared dev-fleet capacity."
            echo "Reported separately and not configured as a required merge context."
            echo "A failed live assertion remains a failed check; it is never greenwashed."
            echo ""
            echo "- **Result**: \`${{ steps.live_fleet.outcome }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f modules/agent-factory/live-fleet-results.xml ]; then
            TESTS=$(grep -oP 'tests="\K[^"]+' modules/agent-factory/live-fleet-results.xml | head -1)
            FAILURES=$(grep -oP 'failures="\K[^"]+' modules/agent-factory/live-fleet-results.xml | head -1)
            ERRORS=$(grep -oP 'errors="\K[^"]+' modules/agent-factory/live-fleet-results.xml | head -1)
            {
              echo "- **Tests**: ${TESTS:-0}"
              echo "- **Failures**: ${FAILURES:-0}"
              echo "- **Errors**: ${ERRORS:-0}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Enqueue to acknowledgement latency" >> "$GITHUB_STEP_SUMMARY"
          if [ -f live-fleet-latency/e2e-latency-aggregate.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat live-fleet-latency/e2e-latency-aggregate.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- No latency recording produced." >> "$GITHUB_STEP_SUMMARY"
          fi
