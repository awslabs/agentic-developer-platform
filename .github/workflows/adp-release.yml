name: ADP Release and Promote

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: 'Existing release ID to retry/recover. Empty builds a new release from main.'
        type: string
        default: ''
      manifest_sha256:
        description: 'Required with an existing release ID: its recorded manifest SHA256.'
        type: string
        default: ''
      allow_partial_pricing_refresh:
        description: 'Retain reviewed older prices when source gaps prevent a complete pricing refresh.'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: arc-runner-org
    timeout-minutes: 180
    environment: adp-release-build
    concurrency:
      group: adp-release-build-608380991969
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      release_id: ${{ steps.manifest.outputs.release_id }}
      manifest_sha256: ${{ steps.manifest.outputs.manifest_sha256 }}
      source_sha: ${{ steps.manifest.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/release-tools
      - name: Verify environment protections
        env:
          GH_TOKEN: ${{ github.token }}
        run: python platform/scripts/release/bootstrap.py --verify-github
      - name: Release contract and upgrade tests
        run: |
          python -m unittest discover -s platform/scripts/tests -p 'test_release*.py'
          python -m unittest discover -s platform/scripts/tests -p 'test_upgrade*.py'
          python -m unittest discover -s platform/scripts/tests -p test_update_safety.py
          python -m pytest --confcutdir=modules/gateway/tests/pricing_policy modules/gateway/tests/pricing_policy/test_rollout.py -q
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::608380991969:role/adp-release-build
          aws-region: us-east-1
          role-duration-seconds: 14400
          allowed-account-ids: '608380991969'
      - name: Build once or retrieve the selected immutable release
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          MANIFEST_SHA: ${{ inputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          if [ -n "$RELEASE_ID" ]; then
            python platform/scripts/release/storage.py download --directory "$RUNNER_TEMP/release" --release-id "$RELEASE_ID" --manifest-sha256 "$MANIFEST_SHA"
          else
            test -z "$MANIFEST_SHA"
            python platform/scripts/release/build.py --directory "$RUNNER_TEMP/release" --release-id "r${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA:0:12}"
            python platform/scripts/release/storage.py publish --directory "$RUNNER_TEMP/release"
          fi
      - name: Record immutable release coordinates
        id: manifest
        run: |
          python platform/scripts/release/workflow.py --directory "$RUNNER_TEMP/release"
          cp "$RUNNER_TEMP/release/manifest.json" "$RUNNER_TEMP/manifest.json"
      - uses: actions/upload-artifact@v7
        with:
          name: release-manifest
          path: ${{ runner.temp }}/manifest.json
          retention-days: 90

  integration:
    needs: release
    uses: ./.github/workflows/adp-release-upgrade.yml
    permissions:
      contents: read
      actions: read
      id-token: write
    with:
      environment: integration-test
      account: '608380991969'
      release_id: ${{ needs.release.outputs.release_id }}
      manifest_sha256: ${{ needs.release.outputs.manifest_sha256 }}
      source_sha: ${{ needs.release.outputs.source_sha }}
      allow_partial_pricing_refresh: ${{ inputs.allow_partial_pricing_refresh }}
