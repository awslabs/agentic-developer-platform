name: Agent Worker Diag
on:
  workflow_dispatch: {}
jobs:
  diag:
    runs-on: arc-runner-org
    timeout-minutes: 15
    steps:
      - name: Account guard
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          [ "$ACCOUNT_ID" = "879318057152" ] || { echo "FATAL: wrong account $ACCOUNT_ID"; exit 1; }
      - name: Configure kubectl
        run: aws eks update-kubeconfig --name adp-dev-eks-cluster --region us-east-1
      - name: All ScaledJobs + TriggerAuth cluster-wide
        run: |
          echo "===== ScaledJobs (all ns) ====="
          kubectl get scaledjob -A -o wide 2>&1 || true
          echo; echo "===== TriggerAuthentications (all ns) ====="
          kubectl get triggerauthentication -A 2>&1 || true
          echo; echo "===== namespaces ====="
          kubectl get ns 2>&1 | grep -iE "agent|adp" || true
          echo; echo "===== agent-scaledjob describe (any ns) ====="
          kubectl describe scaledjob agent-scaledjob -A 2>&1 | tail -60 || echo "(not found by name)"
      - name: Recent agent Jobs + pods (adp-agents + fallbacks)
        run: |
          for ns in adp-agents adp-gateway-agents; do
            echo "===== jobs in $ns ====="; kubectl get jobs -n "$ns" --sort-by=.metadata.creationTimestamp 2>&1 | tail -15 || true
            echo "===== recent pods in $ns ====="; kubectl get pods -n "$ns" --sort-by=.metadata.creationTimestamp 2>&1 | tail -15 || true
          done
      - name: KEDA operator log (agent-submit / scaledjob errors)
        run: |
          kubectl logs -n keda -l app=keda-operator --tail=300 2>&1 \
            | grep -iE "agent-submit|agent-scaledjob|adp-agents|error|fail" | tail -40 || echo "(no matches)"
