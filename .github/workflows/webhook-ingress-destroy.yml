name: Webhook Ingress Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "webhook-ingress" to confirm destruction'
        required: true
        type: string
      customer_account_id:
        description: 'Customer-linked AWS account to destroy in (cross-account mode).'
        required: false
        default: ''
      customer_aws_label:
        description: 'Vaulted credential label (when customer_account_id is set).'
        required: false
        default: ''
      customer_user_id:
        description: 'ADP users.id UUID (when customer_account_id is set).'
        required: false
        default: ''
      environment:
        description: 'Deployment environment (dev/staging/prod).'
        required: false
        default: 'dev'

concurrency:
  group: webhook-ingress-deploy-${{ inputs.customer_account_id || 'default' }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: dev
  MODULE_NAME: webhook-ingress
  TF_WORKING_DIR: modules/agent-factory/webhook-ingress/infra
  BACKEND_CONFIG: environments/dev/modules/webhook-ingress-backend.tfvars
jobs:
  destroy:
    name: Destroy Webhook Ingress Infrastructure
    if: github.ref == 'refs/heads/main'
    runs-on: arc-runner-org
    environment: adp-deploy-${{ inputs.environment || 'dev' }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Confirm module name
        env:
          ADP_INPUT_226C03454D: ${{ inputs.confirm }}
        run: |
          if [ "${ADP_INPUT_226C03454D}" != "webhook-ingress" ]; then
            echo "::error::Input did not match 'webhook-ingress'. Aborting to prevent accidental destroy."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify source belongs to reviewed main history
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$GITHUB_SHA"
          git merge-base --is-ancestor HEAD FETCH_HEAD

      - name: Establish trusted deployment identity
        uses: ./.github/actions/trusted-deployment
        with:
          role_arn: ${{ vars.ADP_DEPLOY_ROLE_ARN }}
          region: ${{ vars.ADP_DEPLOY_REGION || 'us-east-1' }}

      - name: Load deployment config
        uses: ./.github/actions/load-deploy-config
        with:
          environment: ${{ inputs.environment }}
          customer_account_id: ${{ inputs.customer_account_id }}
          customer_aws_label: ${{ inputs.customer_aws_label }}
          customer_user_id: ${{ inputs.customer_user_id }}

      - name: Install required CLI tools
        run: |
          set -euo pipefail
          for tool in aws terraform kubectl helm jq zip unzip curl git python3 node npm; do
            command -v "$tool" >/dev/null || { echo "::error::Reviewed runner image is missing $tool"; exit 1; }
          done
      - name: Assert AWS account
        env:
          ADP_INPUT_824138160E: ${{ inputs.customer_account_id }}
        run: |
          set -e
          ACTUAL_ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          # In cross-account mode (#2669) load-deploy-config assumes into the
          # customer account, so the caller identity is the customer's — the
          # intended destroy target. Prefer that; else the platform account
          # from the vars.AWS_ACCOUNT_ID repository variable.
          EXPECTED_ACCOUNT="${ADP_INPUT_824138160E}"
          if [ -z "$EXPECTED_ACCOUNT" ]; then
            EXPECTED_ACCOUNT="${{ vars.AWS_ACCOUNT_ID }}"
          fi
          if [ -z "$EXPECTED_ACCOUNT" ]; then
            echo "WARNING: No target account to verify against (neither customer_account_id input nor vars.AWS_ACCOUNT_ID set). Skipping account guard."
            echo "Consider setting vars.AWS_ACCOUNT_ID to enable cross-account protection."
            exit 0
          fi
          if [ "$ACTUAL_ACCOUNT" != "$EXPECTED_ACCOUNT" ]; then
            echo "::error::Account mismatch! Expected $EXPECTED_ACCOUNT but got $ACTUAL_ACCOUNT."
            echo "::error::Refusing to destroy. Check runner IAM / credential configuration."
            exit 1
          fi
          echo "Account verified: $ACTUAL_ACCOUNT"
      - name: Configure kubectl
        run: |
          set -e
          CLUSTER_NAME="adp-${{ env.ENVIRONMENT }}-eks-cluster"
          aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "${{ env.AWS_REGION }}" 2>/dev/null || {
            echo "WARNING: Could not configure kubectl. EKS cluster may not exist."
          }

      - name: Delete K8s webhook-ingress resources
        run: |
          # Delete KEDA ScaledJob first — stops new agent pods from spawning
          kubectl delete scaledjob agent-scaledjob -n adp-agents 2>/dev/null || true
          # Wait for any running agent pods to terminate before removing underlying infra
          kubectl wait --for=delete pods -l app.kubernetes.io/name=agent-scaledjob -n adp-agents --timeout=60s 2>/dev/null || true
          # Delete TriggerAuthentication (KEDA credential binding)
          kubectl delete triggerauthentication agent-scaledjob-aws-auth -n adp-agents 2>/dev/null || true
          # Delete warm-pool Deployment and PriorityClass
          kubectl delete deployment agent-warm-pool -n adp-agents 2>/dev/null || true
          kubectl delete priorityclass adp-agent-overprovision 2>/dev/null || true
          # Delete image-prepull DaemonSet
          kubectl delete daemonset agent-image-prepull -n adp-agents 2>/dev/null || true
          # Delete service account
          kubectl delete serviceaccount agent-scaledjob-sa -n adp-agents 2>/dev/null || true
          # Delete network policies
          kubectl delete networkpolicy default-deny-egress -n adp-agents 2>/dev/null || true
          kubectl delete networkpolicy agent-scaledjob-egress -n adp-agents 2>/dev/null || true

      - name: Clean up Lambda artifacts from S3
        run: |
          echo "Removing Lambda artifacts from S3..."
          aws s3 rm "s3://${STATE_BUCKET}/lambda-artifacts/webhook-ingress/" --recursive || true

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend-config="../../../../${{ env.BACKEND_CONFIG }}" -input=false

      - name: Terraform Destroy
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform destroy -var-file="terraform.tfvars" -auto-approve

      - name: Summary
        if: always()
        run: |
          echo "## Terraform Destroy -- ${{ env.MODULE_NAME }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Module**: ${{ env.MODULE_NAME }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Action**: destroy" >> "$GITHUB_STEP_SUMMARY"
