name: Cyber Worker Build

# Builds and pushes the adp-cyber-worker Docker image to ECR via CodeBuild.
#
# Mirrors the chat-agent-deploy.yml pattern: zip source -> S3 -> CodeBuild.
# Does NOT deploy to EKS — that's handled by #229 (cyber EKS/KEDA/SQS).

on:
  push:
    paths:
      - 'modules/domain-apps/cyber/workers/**'
      - 'codebuild/bs-cyber-worker.yml'
      - 'platform/scripts/zip-source.sh'
      - '.github/workflows/cyber-worker-build.yml'
    branches:
      - main
  workflow_dispatch: {}

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: dev
  ECR_REPO: adp-cyber-worker
  CODEBUILD_PROJECT: adp-dev-cyber-worker

jobs:
  build:
    name: Build Cyber Worker Image
    runs-on: arc-runner-org
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Load deployment config
        uses: ./.github/actions/load-deploy-config

      # ── 0. Install CLI tools on ARC runner ─────────────────────────────
      - name: Install zip + AWS CLI
        run: |
          set -e
          if ! command -v zip >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends zip unzip curl
          fi
          if ! command -v aws >/dev/null 2>&1; then
            curl -sL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscli.zip
            unzip -q /tmp/awscli.zip -d /tmp
            sudo /tmp/aws/install
            rm -rf /tmp/awscli.zip /tmp/aws
          fi
          aws --version

      # ── 1. Ensure CodeBuild project exists ─────────────────────────────
      - name: Ensure CodeBuild project
        run: |
          CB_ROLE_NAME="adp-${ENVIRONMENT}-codebuild-role"
          SERVICE_ROLE_ARN=$(aws iam get-role \
            --role-name "$CB_ROLE_NAME" \
            --query 'Role.Arn' --output text 2>/dev/null || echo "")
          if [ -z "$SERVICE_ROLE_ARN" ]; then
            echo "${CB_ROLE_NAME} missing — run platform/scripts/deploy-all.sh once to create it." >&2
            exit 1
          fi

          SOURCE_LOC="${STATE_BUCKET}/codebuild/adp-source.zip"
          EXISTS=$(aws codebuild batch-get-projects \
            --names "${{ env.CODEBUILD_PROJECT }}" \
            --region "${AWS_REGION}" \
            --query 'projects | length(@)' --output text 2>/dev/null || echo "0")

          CMD="create-project"
          [ "$EXISTS" -gt 0 ] && CMD="update-project"

          aws codebuild $CMD --region "${AWS_REGION}" \
            --name "${{ env.CODEBUILD_PROJECT }}" \
            --source "{\"type\":\"S3\",\"location\":\"$SOURCE_LOC\",\"buildspec\":\"codebuild/bs-cyber-worker.yml\"}" \
            --artifacts '{"type":"NO_ARTIFACTS"}' \
            --environment '{
              "type":"LINUX_CONTAINER",
              "image":"aws/codebuild/amazonlinux2-x86_64-standard:5.0",
              "computeType":"BUILD_GENERAL1_MEDIUM",
              "privilegedMode":true
            }' \
            --service-role "$SERVICE_ROLE_ARN" > /dev/null

      # ── 2. Build image via CodeBuild (per-build isolated source) ───────
      - name: Build image via CodeBuild
        id: build
        uses: ./.github/actions/codebuild-run
        with:
          project_name: ${{ env.CODEBUILD_PROJECT }}
          region: ${{ env.AWS_REGION }}
          state_bucket: ${{ env.STATE_BUCKET }}
          environment_variables: >-
            "name=AWS_REGION,value=${{ env.AWS_REGION }}"
            "name=ENVIRONMENT,value=${{ env.ENVIRONMENT }}"
            "name=ACCOUNT_ID,value=${{ env.ACCOUNT_ID }}"
            "name=REGISTRY,value=${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
            "name=IMAGE_TAG,value=${{ github.sha }}"

      - name: Export build outputs
        id: build_info
        run: |
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "image_tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"

      # ── 3. Extract and publish manifest to S3 ─────────────────────────
      - name: Extract and publish manifest
        run: |
          IMAGE_URI="${{ steps.build_info.outputs.registry }}/${{ env.ECR_REPO }}:${{ steps.build_info.outputs.image_tag }}"
          IMAGE_TAG="${{ steps.build_info.outputs.image_tag }}"
          ASSETS_BUCKET="adp-dev-cape-assets"

          # Log in to ECR to pull the image
          aws ecr get-login-password --region "${AWS_REGION}" | \
            docker login --username AWS --password-stdin "${{ steps.build_info.outputs.registry }}" 2>/dev/null || true

          # Extract manifest from built image
          docker run --rm --entrypoint cat "${IMAGE_URI}" /opt/worker-manifest.json > /tmp/worker-manifest.json

          # Validate it's valid JSON
          python3 -c "import json; json.load(open('/tmp/worker-manifest.json'))"

          # Publish to immutable location (keyed by image tag — never overwritten)
          aws s3 cp /tmp/worker-manifest.json \
            "s3://${ASSETS_BUCKET}/worker-manifests/by-tag/${IMAGE_TAG}.json" \
            --region "${AWS_REGION}"

          # Publish to "latest" pointer
          aws s3 cp /tmp/worker-manifest.json \
            "s3://${ASSETS_BUCKET}/worker-manifests/latest.json" \
            --region "${AWS_REGION}"

          echo "Manifest published for tag: ${IMAGE_TAG}"

      # ── 5. Update SSM parameter with deployed image tag ──────────────
      - name: Update SSM image tag parameter
        run: |
          IMAGE_TAG="${{ steps.build_info.outputs.image_tag }}"
          aws ssm put-parameter \
            --name "/adp/dev/cyber/worker-image-tag" \
            --value "${IMAGE_TAG}" \
            --type String \
            --overwrite \
            --region "${AWS_REGION}"
          echo "SSM parameter /adp/dev/cyber/worker-image-tag updated to: ${IMAGE_TAG}"

      - name: Summary
        run: |
          echo "## Cyber Worker Build" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image**: ${{ steps.build_info.outputs.registry }}/${{ env.ECR_REPO }}:${{ steps.build_info.outputs.image_tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **CodeBuild**: ${{ steps.build.outputs.build_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Manifest**: s3://adp-dev-cape-assets/worker-manifests/by-tag/${{ steps.build_info.outputs.image_tag }}.json" >> "$GITHUB_STEP_SUMMARY"
