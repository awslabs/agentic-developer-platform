name: Cyber Worker Build
'on':
  push:
    paths:
    - modules/domain-apps/cyber/workers/**
    - modules/domain-apps/cyber/codebuild/bs-cyber-worker.yml
    - platform/scripts/zip-source.sh
    - .github/workflows/cyber-worker-build.yml
    - modules/domain-apps/cyber/ci/cyber-worker-build/**
    branches:
    - main
  workflow_dispatch: {}
jobs:
  build:
    name: Build Cyber Worker Image
    if: github.ref == 'refs/heads/main'
    runs-on: arc-runner-org
    environment: adp-build-dev
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/checkout@v7
    - name: Verify source belongs to reviewed main history
      shell: bash
      run: |
        set -euo pipefail
        git fetch --no-tags origin "$GITHUB_SHA"
        git merge-base --is-ancestor HEAD FETCH_HEAD
    - name: Establish trusted build identity
      uses: ./.github/actions/trusted-build
      with:
        role_arn: ${{ vars.ADP_BUILD_ROLE_ARN }}
        region: ${{ vars.ADP_DEPLOY_REGION || 'us-east-1' }}
    - name: Run cyber app automation
      uses: ./modules/domain-apps/cyber/ci/cyber-worker-build
