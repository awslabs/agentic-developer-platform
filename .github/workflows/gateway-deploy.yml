              -e "s|__BG_INTAKE_SESSIONS_TABLE__|${BG_INTAKE_SESSIONS_TABLE}|g" \
              -e "s|__ADP_CHAT_RESPONSE_QUEUE_URL__|${ADP_CHAT_RESPONSE_QUEUE_URL}|g" \
              -e "s|__ADP_CHAT_INPUT_QUEUE_URL__|${ADP_CHAT_INPUT_QUEUE_URL}|g" \
              -e "s|__BG_INTAKE_CONTEXT_TABLE__|${BG_INTAKE_CONTEXT_TABLE}|g" \
              -e "s|__BG_INTAKE_INGEST_FUNCTION__|${BG_INTAKE_INGEST_FUNCTION}|g" \
              -e "s|__ADP_CHAT_DATA_URL__|${ADP_CHAT_DATA_URL}|g" \
              -e "s|__ADP_CHAT_SANDBOX_CA_CONFIGMAP__|${ADP_CHAT_SANDBOX_CA_CONFIGMAP}|g" \
              -e "s|__ADP_CHAT_DATA_ENABLED__|${ADP_CHAT_DATA_ENABLED}|g" \
              -e "s|__CREW_PROXY_KEEPALIVE_SECONDS__|${CREW_PROXY_KEEPALIVE_SECONDS}|g" \
              -e "s|__CREW_PROXY_MAX_CONN_PER_USER__|${CREW_PROXY_MAX_CONN_PER_USER}|g" \
              -e "s|__FEATURE_CREW_DASHBOARD__|${FEATURE_CREW_DASHBOARD}|g" \
              -e "s|__CREW_DASHBOARD_ORIGIN__|${CREW_DASHBOARD_ORIGIN}|g" \
              -e "s|__ADP_CREW_CHECKPOINTS_ENABLED__|${ADP_CREW_CHECKPOINTS_ENABLED}|g" \
              -e "s|__ADP_GITHUB_USER_ACCESS_ENABLED__|${ADP_GITHUB_USER_ACCESS_ENABLED}|g" \
              -e "s|__ADP_CREW_CHECKPOINT_BUCKET__|${ADP_CREW_CHECKPOINT_BUCKET}|g" \
              -e "s|__ADP_CREW_CHECKPOINT_RETENTION_SECONDS__|${ADP_CREW_CHECKPOINT_RETENTION_SECONDS}|g" \
              -e "s|__ADP_TOOLS_CONSENT_DEFAULT__|${ADP_TOOLS_CONSENT_DEFAULT}|g" \
              -e "s|__ADP_AGENTCORE_MEMORY_ID__|${ADP_AGENTCORE_MEMORY_ID}|g" \
              -e "s|__ADP_AGENTCORE_MEMORY_STRATEGY_ID__|${ADP_AGENTCORE_MEMORY_STRATEGY_ID}|g" \
              -e "s|__ADP_AGENTCORE_MEMORY_REGION__|${ADP_AGENTCORE_MEMORY_REGION}|g" \
              modules/gateway/k8s/configmap.yaml |
            python3 modules/gateway/scripts/tool-adapter-config.py "$ENVIRONMENT" "$AWS_REGION" "$ACCOUNT_ID" | kubectl apply -f -

          # --- Create K8s Secret from Secrets Manager (Section 2) ---
          # Stable signing material is provisioned by the operator. A release
          # may read it but must never create or rotate it.
          SM_SECRET_NAME="adp/${ENVIRONMENT}/gateway/token-secret-key"
          TOKEN_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id "$SM_SECRET_NAME" \
            --query SecretString --output text)
          test -n "$TOKEN_SECRET" && test "$TOKEN_SECRET" != None

          # Read the internal API key for /internal/v1/* shared-secret fallback.
          # TEMPORARY — auth_deps.py:43 prefers IRSA via API GW. This fallback path
          # is what unblocks Phase 1 apply of EPIC #1107 and is removed by Phase 3
          # (#1110) once both clients use SigV4.
          INTERNAL_API_SM_NAME="adp/${ENVIRONMENT}/gateway/internal-api-key"
          INTERNAL_API_KEY=$(aws secretsmanager get-secret-value \
            --secret-id "$INTERNAL_API_SM_NAME" \
            --query SecretString --output text)
          test -n "$INTERNAL_API_KEY" && test "$INTERNAL_API_KEY" != None

          # Issue #5656 (A05): dedicated signing key for single-use identity-linking
          # ("magic link") tokens. src/shared/config.py no longer falls back to the
          # session-signing key, so this must exist for those endpoints to work —
          # and because it is separate, it can be replaced without signing every
          # user out. The operator provisions it; this release only reads it.
          # Rotation: docs/runbooks/gateway-secret-rotation.md
          MAGIC_LINK_SM_NAME="adp/${ENVIRONMENT}/gateway/magic-link-secret"
          MAGIC_LINK_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id "$MAGIC_LINK_SM_NAME" \
            --query SecretString --output text)
          test -n "$MAGIC_LINK_SECRET" && test "$MAGIC_LINK_SECRET" != None

          APIGW_PROVENANCE_SECRET=$(aws ssm get-parameter \
            --name "/adp/${ENVIRONMENT}/gateway/apigw-provenance-secret" \
            --with-decryption --query Parameter.Value --output text 2>/dev/null || echo "")
          if [ "$TRUST_APIGW_HEADERS" = "true" ] && { [ -z "$APIGW_PROVENANCE_SECRET" ] || [ "$APIGW_PROVENANCE_SECRET" = "None" ]; }; then
            echo "ERROR: API Gateway header trust is enabled but its provenance secret is unavailable" >&2
            exit 1
          fi

          kubectl create secret generic bedrockgateway-secrets \
            --from-literal=token-secret-key="$TOKEN_SECRET" \
            --from-literal=internal-api-key="$INTERNAL_API_KEY" \
            --from-literal=apigw-provenance-secret="$APIGW_PROVENANCE_SECRET" \
            --from-literal=magic-link-secret="$MAGIC_LINK_SECRET" \
            --from-literal=agentcore-namespace-key="$ADP_AGENTCORE_NAMESPACE_KEY" \
            -n "${NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f -

          # --- Render and apply ServiceAccount (Section 3) ---
          sed -e "s|__GATEWAY_IRSA_ROLE_ARN__|${GATEWAY_ROLE_ARN}|g" \
              modules/gateway/k8s/serviceaccount.yaml | kubectl apply -f -

          # --- Apply remaining K8s manifests (service, ingress, pdb, etc.) ---
          for f in modules/gateway/k8s/*.yaml; do
            case "$(basename "$f")" in
              configmap.yaml|serviceaccount.yaml|deployment.yaml|atlassian-mcp-recovery.yaml|targetgroupbinding.yaml|hpa.yaml|pdb.yaml) continue ;;
            esac
            # Namespace and IngressClass are platform-owned cluster resources,
            # even when -n is supplied. Detect by rendered Kind so a rename
            # cannot make this namespaced deploy attempt a cluster-wide apply.
            if kubectl create --dry-run=client --validate=false -f "$f" \
                 -o jsonpath='{.kind}{"\n"}{range .items[*]}{.kind}{"\n"}{end}' \
                 | grep -Eq '^(Namespace|IngressClass)$'; then
              echo "Skipping platform-owned cluster-scoped manifest: $f"
              continue
            fi
            kubectl apply -f "$f" -n "${NAMESPACE}"
          done

      - name: Migrate schema then roll out new image
        id: release
        env:
          ADP_INPUT_3965067AD6: ${{ inputs.manual_source_revision || inputs.adp_source_revision || github.sha }}
          ADP_PROFILE_ROLLBACK: ${{ inputs.product_rollback || 'false' }}
          ADP_MANUAL_SOURCE: ${{ inputs.manual_source_revision }}
          ADP_APPROVED_ROLLBACK_SOURCE: ${{ vars.ADP_PRODUCT_COMPATIBLE_ROLLBACK_SOURCE }}
          ADP_DEPLOYED_BASELINE_SOURCE: ${{ steps.deployed.outputs.baseline }}
        run: |
          set -euo pipefail
          RENDERED_DEPLOYMENT=$(mktemp)
          CAPACITY_BUNDLE=$(mktemp -d)
          trap 'rm -f "$RENDERED_DEPLOYMENT"; rm -rf "$CAPACITY_BUNDLE"' EXIT
          EFFECTIVE_ACCOUNT="$ACCOUNT_ID"
          REGISTRY="${EFFECTIVE_ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          RELEASE_IMAGE=$(python3 platform/scripts/resolve-ecr-image.py \
            "${REGISTRY}/adp-gateway:${ADP_INPUT_3965067AD6}")
          echo "digest=${RELEASE_IMAGE##*@}" >> "$GITHUB_OUTPUT"

          # Snapshot exactly this step's configuration with <=10 names per API call.
          # Missing parameters keep their existing defaults; read failures stop rendering.
          SSM_SNAPSHOT=$(mktemp)
          python3 "$RUNNER_TEMP/adp-gateway-control/batch-ssm.py" "$0" "$ENVIRONMENT" "$SSM_SNAPSHOT"
          source "$SSM_SNAPSHOT"
          rm -f "$SSM_SNAPSHOT"
          get_ssm() { printf '%s\n' "${ADP_SSM_VALUES[plain:$1]-${2:-}}"; }

          # Deployment defaults enable orchestration. SSM provides explicit
          # per-environment overrides for orchestration and optional menu entries.
          FEATURE_KNOWLEDGE_ENABLED=$(get_ssm "/adp/${ENVIRONMENT}/gateway/feature-knowledge" "true")
          FEATURE_INDEXING_ENABLED=$(get_ssm "/adp/${ENVIRONMENT}/gateway/feature-indexing" "true")
          FEATURE_TENANT_ORG_LINKS_ENABLED=$(get_ssm "/adp/${ENVIRONMENT}/gateway/feature-tenant-org-links" "false")
          FEATURE_ORCHESTRATION_ENGINE_ENABLED=$(get_ssm "/adp/${ENVIRONMENT}/gateway/feature-orchestration-engine" "true")
          if [ -z "$FEATURE_ORCHESTRATION_ENGINE_ENABLED" ] || [ "$FEATURE_ORCHESTRATION_ENGINE_ENABLED" = "None" ]; then
            FEATURE_ORCHESTRATION_ENGINE_ENABLED="false"
          fi
          echo "orchestration graph UI for ${ENVIRONMENT}: ${FEATURE_ORCHESTRATION_ENGINE_ENABLED}"

          # Issue #3960: same per-environment mechanism, and for a stronger reason —
          # this flag opens an authenticated channel into a running agent pod. The
          # rollout invariant is that ordinary workloads stay off; the one legitimate
          # "true" is an operator-created isolated fixture (evaluation #3967), set
          # with `aws ssm put-parameter` on that one environment.
          #
          # Absent parameter => "false", and `_is_enabled_strict` accepts only the
          # literal "true", so a missing or malformed value leaves the control path
          # closed rather than guessing.
          FEATURE_AGENT_EXPLANATIONS_ENABLED=$(get_ssm "/adp/${ENVIRONMENT}/gateway/feature-agent-explanations" "false")
          FEATURE_AGENT_CONTROL_ENABLED=$(get_ssm "/adp/${ENVIRONMENT}/gateway/feature-agent-control" "false")
          if [ -z "$FEATURE_AGENT_CONTROL_ENABLED" ] || [ "$FEATURE_AGENT_CONTROL_ENABLED" = "None" ]; then
            FEATURE_AGENT_CONTROL_ENABLED="false"
          fi
          echo "live run control for ${ENVIRONMENT}: ${FEATURE_AGENT_CONTROL_ENABLED}"

          # Issue #5079: the opt-in /next UI shell, enabled one environment at a time
          # from /adp/${ENVIRONMENT}/gateway/feature-new-ui. Absent parameter =>
          # "false", and `_is_enabled_strict` accepts only the literal "true", so a
          # missing or malformed value leaves the current UI as the sole experience
          # rather than guessing.
          #
          # This job is the ONLY place the parameter reaches a running pod. Changing
          # the SSM value — in either direction — takes effect on the next run of
          # this job, so enabling or disabling the preview is "put-parameter, then
          # re-run this workflow". A frontend-only push skips deploy-backend and
          # will not pick up a changed value.
          FEATURE_NEW_UI_ENABLED=$(get_ssm "/adp/${ENVIRONMENT}/gateway/feature-new-ui" "false")
          if [ -z "$FEATURE_NEW_UI_ENABLED" ] || [ "$FEATURE_NEW_UI_ENABLED" = "None" ]; then
            FEATURE_NEW_UI_ENABLED="false"
          fi
          echo "new UI shell for ${ENVIRONMENT}: ${FEATURE_NEW_UI_ENABLED}"

          BG_INSIGHTS_RESULTS_BUCKET=$(get_ssm "/adp/${ENVIRONMENT}/gateway/insights-results-bucket" "")
          if [[ -n "$BG_INSIGHTS_RESULTS_BUCKET" && ! "$BG_INSIGHTS_RESULTS_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]]; then
            echo "::error::Invalid Insights results bucket setting"; exit 1
          fi
          L5_WORK_QUEUE_URL=$(get_ssm "/adp/${ENVIRONMENT}/gateway/l5-work-queue-url" "")
          [[ "$L5_WORK_QUEUE_URL" =~ ^https://sqs\.[a-z0-9-]+\.amazonaws\.com/[0-9]{12}/adp-${ENVIRONMENT}-l5-work$ ]] || L5_WORK_QUEUE_URL=""
          L5_CONSUMER_TARGETS=$(get_ssm "/adp/${ENVIRONMENT}/gateway/l5-consumer-targets" "{}")
          L5_CONSUMER_TARGETS=$(printf '%s' "$L5_CONSUMER_TARGETS" | python3 "modules/gateway/src/l5_consumer_config.py")
          L5_FINOPS_ADMISSION_ENABLED=$(get_ssm "/adp/${ENVIRONMENT}/gateway/l5-finops-admission-enabled" "false")
          [[ "$L5_FINOPS_ADMISSION_ENABLED" == "true" ]] || L5_FINOPS_ADMISSION_ENABLED="false"
          BG_PRODUCT_PROFILE_ENABLED=$(get_ssm "/adp/${ENVIRONMENT}/gateway/product-profile-enabled" "false")
          BG_PRODUCT_ONBOARDING_ENABLED=$(get_ssm "/adp/${ENVIRONMENT}/gateway/product-onboarding-enabled" "false")
          [[ "$BG_PRODUCT_PROFILE_ENABLED" == "true" ]] || BG_PRODUCT_PROFILE_ENABLED="false"
          [[ "$BG_PRODUCT_ONBOARDING_ENABLED" == "true" ]] || BG_PRODUCT_ONBOARDING_ENABLED="false"
          echo "profile_enabled=$BG_PRODUCT_PROFILE_ENABLED" >> "$GITHUB_OUTPUT"
          echo "onboarding_enabled=$BG_PRODUCT_ONBOARDING_ENABLED" >> "$GITHUB_OUTPUT"

          # Basic saved mappings ship enabled. An explicit environment UI
          # override remains authoritative; protected worker activation is separate.
          PERSONA_MODEL_MAPPING_ENABLED=$(get_ssm "/adp/${ENVIRONMENT}/gateway/persona-model-mapping-enabled" "true")
          FEATURE_AGENT_MODELS_ENABLED=$(get_ssm "/adp/${ENVIRONMENT}/gateway/feature-agent-models" "$PERSONA_MODEL_MAPPING_ENABLED")
          if [ -z "$FEATURE_AGENT_MODELS_ENABLED" ] || [ "$FEATURE_AGENT_MODELS_ENABLED" = "None" ]; then
            FEATURE_AGENT_MODELS_ENABLED="$PERSONA_MODEL_MAPPING_ENABLED"
          fi
          echo "Agent Models for ${ENVIRONMENT}: ${FEATURE_AGENT_MODELS_ENABLED}"

          # Chief-of-Staff surfaces (#7197), one environment at a time. Absent or
          # malformed => off; `_is_enabled_strict` accepts only the literal "true".
          # crew-dashboard-origin is written by gateway infra when the Crew edge is
          # enabled (docs/chief-of-staff/crew-dashboard-edge.md); empty keeps the
          # Crew proxy closed.
          FEATURE_CHAT_ENABLED=$(get_ssm "/adp/${ENVIRONMENT}/gateway/feature-chat" "false")
          FEATURE_ASSISTANT_UI_ENABLED=$(get_ssm "/adp/${ENVIRONMENT}/gateway/feature-assistant-ui" "false")
          FEATURE_CREW_DASHBOARD=$(get_ssm "/adp/${ENVIRONMENT}/gateway/feature-crew-dashboard" "false")
          CREW_PROXY_ENABLED=$(get_ssm "/adp/${ENVIRONMENT}/gateway/crew-proxy-enabled" "false")
          CREW_DASHBOARD_ORIGIN=$(get_ssm "/adp/${ENVIRONMENT}/gateway/crew-dashboard-origin" "")
          for name in FEATURE_CHAT_ENABLED FEATURE_ASSISTANT_UI_ENABLED FEATURE_CREW_DASHBOARD CREW_PROXY_ENABLED; do
            if [ -z "${!name}" ] || [ "${!name}" = "None" ]; then printf -v "$name" '%s' "false"; fi
          done
          if [ "$CREW_DASHBOARD_ORIGIN" = "None" ]; then CREW_DASHBOARD_ORIGIN=""; fi
          echo "Chief-of-Staff surfaces for ${ENVIRONMENT}: chat=${FEATURE_CHAT_ENABLED} assistant_ui=${FEATURE_ASSISTANT_UI_ENABLED} crew=${FEATURE_CREW_DASHBOARD}/${CREW_PROXY_ENABLED} origin_set=$([ -n "$CREW_DASHBOARD_ORIGIN" ] && echo yes || echo no)"
          # Browser-hop WebSocket ping (#7902): the same parameter as the ConfigMap's
          # CREW_PROXY_KEEPALIVE_SECONDS. 0 deletes the UVICORN_WS_PING_INTERVAL name/value
          # pair from the manifest (uvicorn treats 0 as a tight loop, not "off").
          UVICORN_WS_PING_INTERVAL=$(get_ssm "/adp/${ENVIRONMENT}/gateway/crew-proxy-keepalive-seconds" "25")
          [[ "$UVICORN_WS_PING_INTERVAL" =~ ^[0-9]+$ ]] || UVICORN_WS_PING_INTERVAL="25"
          if [[ "$UVICORN_WS_PING_INTERVAL" =~ ^0+$ ]]; then
            UVICORN_WS_PING_INTERVAL_SED='/^ *- name: UVICORN_WS_PING_INTERVAL$/{N;d;}'
          else
            UVICORN_WS_PING_INTERVAL_SED="s|__UVICORN_WS_PING_INTERVAL__|${UVICORN_WS_PING_INTERVAL}|g"
          fi

          # Render then apply, so changes to probes, env, resource limits, volume
          # mounts, etc. actually propagate.
          sed -e "$UVICORN_WS_PING_INTERVAL_SED" \
              -e "s|REPLACE_WITH_GATEWAY_IMAGE|${RELEASE_IMAGE}|g" \
              -e "s|__FEATURE_ORCHESTRATION_ENGINE_ENABLED__|${FEATURE_ORCHESTRATION_ENGINE_ENABLED}|g" \
              -e "s|__FEATURE_KNOWLEDGE_ENABLED__|${FEATURE_KNOWLEDGE_ENABLED}|g" \
              -e "s|__FEATURE_INDEXING_ENABLED__|${FEATURE_INDEXING_ENABLED}|g" \
              -e "s|__FEATURE_TENANT_ORG_LINKS_ENABLED__|${FEATURE_TENANT_ORG_LINKS_ENABLED}|g" \
              -e "s|__FEATURE_AGENT_EXPLANATIONS_ENABLED__|${FEATURE_AGENT_EXPLANATIONS_ENABLED}|g" \
              -e "s|__FEATURE_AGENT_CONTROL_ENABLED__|${FEATURE_AGENT_CONTROL_ENABLED}|g" \
              -e "s|__FEATURE_NEW_UI_ENABLED__|${FEATURE_NEW_UI_ENABLED}|g" \
              -e "s|__L5_DEPLOYMENT_ENV__|${ENVIRONMENT}|g" \
              -e "s|__L5_WORK_QUEUE_URL__|${L5_WORK_QUEUE_URL}|g" \
              -e "s|__L5_FINOPS_ADMISSION_ENABLED__|${L5_FINOPS_ADMISSION_ENABLED}|g" \
              -e "s|__L5_CONSUMER_TARGETS__|${L5_CONSUMER_TARGETS}|g" \
              -e "s|__BG_PRODUCT_PROFILE_ENABLED__|${BG_PRODUCT_PROFILE_ENABLED}|g" \
              -e "s|__BG_INSIGHTS_RESULTS_BUCKET__|${BG_INSIGHTS_RESULTS_BUCKET}|g" \
              -e "s|__BG_PRODUCT_ONBOARDING_ENABLED__|${BG_PRODUCT_ONBOARDING_ENABLED}|g" \
              -e "s|__FEATURE_AGENT_MODELS_ENABLED__|${FEATURE_AGENT_MODELS_ENABLED}|g" \
              -e "s|__FEATURE_CHAT_ENABLED__|${FEATURE_CHAT_ENABLED}|g" \
              -e "s|__FEATURE_ASSISTANT_UI_ENABLED__|${FEATURE_ASSISTANT_UI_ENABLED}|g" \
              -e "s|__FEATURE_CREW_DASHBOARD__|${FEATURE_CREW_DASHBOARD}|g" \
              -e "s|__CREW_PROXY_ENABLED__|${CREW_PROXY_ENABLED}|g" \
              -e "s|__CREW_DASHBOARD_ORIGIN__|${CREW_DASHBOARD_ORIGIN}|g" \
              modules/gateway/k8s/deployment.yaml > "$RENDERED_DEPLOYMENT"
          python3 "$RUNNER_TEMP/adp-gateway-control/render-capacity.py" \
            --manifest "$RENDERED_DEPLOYMENT" --root modules/gateway/k8s \
            --environment "$ENVIRONMENT" --output-dir "$CAPACITY_BUNDLE"
          cp "$CAPACITY_BUNDLE/deployment.json" "$RENDERED_DEPLOYMENT"
          python3 "$RUNNER_TEMP/adp-gateway-control/capacity-lock.py" verify \
            --account "$ACCOUNT_ID" --region "$AWS_REGION" --environment "$ENVIRONMENT" \
            --cluster "$EKS_CLUSTER" --namespace "$NAMESPACE" \
            --owner-file "$RUNNER_TEMP/adp-gateway-control/capacity-owner.json"

          # Nullable schema expansion must finish before the new ORM can serve.
          # A bounded lock/index failure leaves the previous release serving.
          if [ "$ADP_PROFILE_ROLLBACK" = "true" ]; then
            test -n "$ADP_MANUAL_SOURCE" && test "$ADP_MANUAL_SOURCE" = "$ADP_INPUT_3965067AD6"
            test "$ENVIRONMENT" = "dev"
            test -n "$ADP_DEPLOYED_BASELINE_SOURCE"
            test "$(aws ssm get-parameter --name "/adp/${ENVIRONMENT}/gateway/product-profile-enabled" --query Parameter.Value --output text)" = "false"
            test "$(aws ssm get-parameter --name "/adp/${ENVIRONMENT}/gateway/product-onboarding-enabled" --query Parameter.Value --output text)" = "false"
            BASELINE_IMAGE=$(python3 platform/scripts/resolve-ecr-image.py \
              "${REGISTRY}/adp-gateway:${ADP_DEPLOYED_BASELINE_SOURCE}")
            python3 "$RUNNER_TEMP/adp-gateway-control/product-recovery.py" \
              --namespace "$NAMESPACE" --baseline-image "$BASELINE_IMAGE" \
              --baseline-source "$ADP_DEPLOYED_BASELINE_SOURCE" \
              --rollback-source "$ADP_INPUT_3965067AD6" \
              --approved-source "$ADP_APPROVED_ROLLBACK_SOURCE" \
              --candidate-manifest "$RENDERED_DEPLOYMENT" \
              --receipt "$RUNNER_TEMP/product-recovery.json"
          else
            python3 modules/gateway/scripts/migrate-before-rollout.py \
              --manifest "$RENDERED_DEPLOYMENT" \
              --image "$RELEASE_IMAGE" \
              --namespace "$NAMESPACE"
          fi
          # Observe capacity after migration and refuse concurrent scale changes.
          # The maintained helper retains apply pruning and the same pinned image.
          python3 "$RUNNER_TEMP/adp-gateway-control/capacity-lock.py" verify \
            --account "$ACCOUNT_ID" --region "$AWS_REGION" --environment "$ENVIRONMENT" \
            --cluster "$EKS_CLUSTER" --namespace "$NAMESPACE" \
            --owner-file "$RUNNER_TEMP/adp-gateway-control/capacity-owner.json"
          python3 "$RUNNER_TEMP/adp-gateway-control/render-capacity.py" \
            --environment "$ENVIRONMENT" --verify-bundle "$CAPACITY_BUNDLE"
          python3 "$RUNNER_TEMP/adp-gateway-control/apply-deployment.py" \
            --manifest "$RENDERED_DEPLOYMENT" --image "$RELEASE_IMAGE" \
            --namespace "${{ env.NAMESPACE }}"
          sed -e "s|REPLACE_WITH_GATEWAY_IMAGE|${RELEASE_IMAGE}|g" \
              modules/gateway/k8s/atlassian-mcp-recovery.yaml | kubectl apply -n "$NAMESPACE" -f -
          python3 "$RUNNER_TEMP/adp-gateway-control/capacity-lock.py" verify \
            --account "$ACCOUNT_ID" --region "$AWS_REGION" --environment "$ENVIRONMENT" \
            --cluster "$EKS_CLUSTER" --namespace "$NAMESPACE" \
            --owner-file "$RUNNER_TEMP/adp-gateway-control/capacity-owner.json"
          python3 "$RUNNER_TEMP/adp-gateway-control/render-capacity.py" \
            --environment "$ENVIRONMENT" --verify-bundle "$CAPACITY_BUNDLE"
          kubectl apply -f "$CAPACITY_BUNDLE/pdb.json" -n "$NAMESPACE"
          python3 "$RUNNER_TEMP/adp-gateway-control/capacity-lock.py" verify \
            --account "$ACCOUNT_ID" --region "$AWS_REGION" --environment "$ENVIRONMENT" \
            --cluster "$EKS_CLUSTER" --namespace "$NAMESPACE" \
            --owner-file "$RUNNER_TEMP/adp-gateway-control/capacity-owner.json"
          python3 "$RUNNER_TEMP/adp-gateway-control/render-capacity.py" \
            --environment "$ENVIRONMENT" --verify-bundle "$CAPACITY_BUNDLE"
          kubectl apply -f "$CAPACITY_BUNDLE/hpa.json" -n "$NAMESPACE"

          # HPA may add replicas during rollout, and each replacement needs its
          # readiness probe before the previous pod can drain. The Deployment
          # rolls with maxSurge 50%, so this wait is two waves of pod startup,
          # not one pod at a time. Terminating pods are not counted in the
          # Deployment status, so the 960 s drain grace does not extend it.
          kubectl rollout status deployment/bedrockgateway -n ${{ env.NAMESPACE }} --timeout=1200s
          python3 "$RUNNER_TEMP/adp-gateway-control/capacity-lock.py" verify \
            --account "$ACCOUNT_ID" --region "$AWS_REGION" --environment "$ENVIRONMENT" \
            --cluster "$EKS_CLUSTER" --namespace "$NAMESPACE" \
            --owner-file "$RUNNER_TEMP/adp-gateway-control/capacity-owner.json"
          python3 "$RUNNER_TEMP/adp-gateway-control/render-capacity.py" \
            --environment "$ENVIRONMENT" --verify-applied "$CAPACITY_BUNDLE"
      - name: Release gateway capacity ownership
        if: ${{ always() && steps.capacity_lock.outcome == 'success' }}
        run: |
          python3 "$RUNNER_TEMP/adp-gateway-control/capacity-lock.py" release \
            --account "$ACCOUNT_ID" --region "$AWS_REGION" --environment "$ENVIRONMENT" \
            --cluster "$EKS_CLUSTER" --namespace "$NAMESPACE" \
            --owner-file "$RUNNER_TEMP/adp-gateway-control/capacity-owner.json"

      - name: Converge registered auxiliary gateway writers
        env:
          WRITER_IMAGE: ${{ steps.vars.outputs.registry }}/adp-gateway@${{ steps.release.outputs.digest }}
          WRITER_SOURCE: ${{ inputs.manual_source_revision || inputs.adp_source_revision || github.sha }}
        run: |
          python3 "$RUNNER_TEMP/adp-gateway-control/writers.py" \
            --image "$WRITER_IMAGE" --account "$ACCOUNT_ID" --region "$AWS_REGION" \
            --cluster "$EKS_CLUSTER" --namespace "$NAMESPACE" \
            --gateway-root modules/gateway --source-revision "$WRITER_SOURCE" \
            --report "$RUNNER_TEMP/gateway-writers-rollout.json"
      - name: Update the scheduled orchestration engine
        env:
          ENGINE_IMAGE: ${{ steps.vars.outputs.registry }}/adp-gateway:${{ inputs.manual_source_revision || inputs.adp_source_revision || github.sha }}
        run: |
          python3 modules/gateway/scripts/sync-gateway-engine.py \
            --image "$ENGINE_IMAGE" --account "$ACCOUNT_ID" --region "$AWS_REGION" \
            --environment "$ENVIRONMENT" --namespace "$NAMESPACE"

      - name: Wire ALB to CloudFront (Section 6 — first deploy)
        id: wire_alb
        # On first deploy, the Ingress manifest creates an internal ALB.
        # Discover it and cache to SSM so a subsequent gateway-infra-apply
        # (or the next deploy) can wire it as a CloudFront VPC origin.
        # Non-blocking: if the ALB isn't ready yet, skip gracefully.
        run: |
          # Check if ALB is already wired
          CACHED=$(aws ssm get-parameter \
            --name "/adp/${ENVIRONMENT}/gateway/internal-alb-arn" \
            --query Parameter.Value --output text 2>/dev/null || echo "")
          if [ -n "$CACHED" ] && [ "$CACHED" != "pending" ] && [ "$CACHED" != "None" ]; then
            echo "ALB already in SSM (${CACHED}). Skipping discovery."
            # The SSM cache alone is not proof CloudFront was wired: an inline
            # apply can write the ALB params without ever flipping
            # enable_vpc_origin, leaving the distribution with no /api/* origin
            # (Incident A, 608 deploy #3085). Check the distribution itself;
            # if it has no VPC origin, still trigger the infra re-apply.
            DIST_ID=$(aws ssm get-parameter \
              --name "/adp/${ENVIRONMENT}/gateway/cloudfront-id" \
              --query Parameter.Value --output text 2>/dev/null || echo "")
            VPC_ORIGINS="unknown"
            if [ -n "$DIST_ID" ] && [ "$DIST_ID" != "None" ]; then
              VPC_ORIGINS=$(aws cloudfront get-distribution-config --id "$DIST_ID" \
                --query 'length(DistributionConfig.Origins.Items[?VpcOriginConfig])' \
                --output text 2>/dev/null || echo "unknown")
            fi
            NEEDS_APPLY=false
            if [ "$VPC_ORIGINS" = "0" ]; then
              echo "CloudFront ${DIST_ID} has NO VPC origin despite cached ALB — triggering re-apply."
              NEEDS_APPLY=true
            else
              echo "CloudFront VPC origin check: count=${VPC_ORIGINS}. Nothing to wire for CloudFront."
            fi

            # Issue #4010: the cached-edge-ALB path must STILL run internal-plane
            # discovery. This early-exit used to `exit 0` here, which meant that on
            # every established environment the internal-plane ALB was never
            # discovered, its SSM params were never populated, and the API-GW
            # `/internal/{proxy+}` integration was never repointed off the edge ALB.
            # Discovery is cheap and idempotent, so just always run it.
            if timeout 120 bash platform/scripts/wire-gateway-alb.sh; then
              :
            else
              echo "::notice::ALB discovery did not complete; will retry on the next deploy."
            fi

            # If the internal-plane ALB now exists but the live API-GW integration
            # still targets the edge ALB, a gateway-infra re-apply is needed to
            # repoint it. Without this the deny could never be applied (its
            # precondition is the repoint), and the internal plane would stay on
            # the edge ALB indefinitely.
            IP_DNS=$(aws ssm get-parameter \
              --name "/adp/${ENVIRONMENT}/gateway/internal-plane-alb-dns" \
              --query Parameter.Value --output text 2>/dev/null || echo "")
            if [ -n "$IP_DNS" ] && [ "$IP_DNS" != "None" ]; then
              INVOKE_URL=$(aws ssm get-parameter \
                --name "/adp/${ENVIRONMENT}/gateway/apigw-invoke-url" \
                --query Parameter.Value --output text 2>/dev/null || echo "")
              API_ID=$(printf '%s' "$INVOKE_URL" | sed -n 's|^https://\([^.]*\)\..*|\1|p')
              CUR_URI=""
              if [ -n "$API_ID" ]; then
                RES_ID=$(aws apigateway get-resources --rest-api-id "$API_ID" \
                  --query "items[?path=='/internal/{proxy+}'].id" \
                  --output text 2>/dev/null | head -1 || echo "")
                if [ -n "$RES_ID" ] && [ "$RES_ID" != "None" ]; then
                  CUR_URI=$(aws apigateway get-integration --rest-api-id "$API_ID" \
                    --resource-id "$RES_ID" --http-method ANY \
                    --query 'uri' --output text 2>/dev/null || echo "")
                fi
              fi
              case "$CUR_URI" in
                *"$IP_DNS"*)
                  echo "Internal plane (#4010) already repointed at ${IP_DNS}." ;;
                *)
                  echo "Internal-plane ALB exists (${IP_DNS}) but /internal/{proxy+} targets"
                  echo "  '${CUR_URI:-<unresolved>}' — triggering re-apply to repoint it."
                  NEEDS_APPLY=true ;;
              esac
            fi

            echo "newly_wired=${NEEDS_APPLY}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Run discovery with a short timeout (2 min instead of 10)
          # If it fails, that's OK — gateway-infra-apply will handle it.
          if timeout 120 bash platform/scripts/wire-gateway-alb.sh; then
            echo "newly_wired=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::ALB not yet active. gateway-infra-apply will discover it on next run."
            echo "newly_wired=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger gateway-infra re-apply (flip enable_vpc_origin=true)
        if: success() && steps.wire_alb.outputs.newly_wired == 'true'
        run: |
          # ALB was just wired this run; gateway-infra needs a re-apply so
          # CloudFront picks up the ALB ARN from SSM and creates the /api/*
          # ordered_cache_behavior (enable_vpc_origin flips from false to true).
          # Preserve this release's reviewed source. If main has advanced, the
          # infra workflow must reject the stale pin before acquiring authority.
          gh workflow run gateway-infra-apply.yml \
            --field reviewed_source_sha="$REVIEWED_SOURCE_SHA" \
            --field customer_account_id="${CUSTOMER_ACCOUNT_ID}" \
            --field customer_aws_label="${CUSTOMER_AWS_LABEL}" \
            --field customer_user_id="${CUSTOMER_USER_ID}" \
            --field environment="${ENVIRONMENT}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEWED_SOURCE_SHA: ${{ inputs.manual_source_revision || inputs.adp_source_revision || github.sha }}
          CUSTOMER_ACCOUNT_ID: ${{ inputs.customer_account_id }}
          CUSTOMER_AWS_LABEL: ${{ inputs.customer_aws_label }}
          CUSTOMER_USER_ID: ${{ inputs.customer_user_id }}
          ENVIRONMENT: ${{ inputs.environment || 'dev' }}

      # =====================================================================
      # Internal-plane edge deny (Issue #4010) — MUST BE LAST
      # =====================================================================
      # Applies the `/internal` -> 403 rule to the edge ALB, but only once the
      # API-GW `/internal/{proxy+}` integration is confirmed repointed at the
      # internal-plane ALB. The script verifies that against the LIVE integration
      # and skips (exit 0) if it has not landed yet, so this is safe on the first
      # deploy after merge: the deny simply lands on a later run.
      #
      # This is deliberately NOT part of the `k8s/*.yaml` apply loop above.
      # Shipping the deny in `k8s/ingress.yaml` applied it unconditionally on
      # merge, before the repoint, which 403'd every SigV4 internal call (agent
      # provenance writes, credential paths) until a human re-wired by hand.
      # Ordering: repoint first, deny second — never the reverse.
      #
      # Note the re-apply triggered above is asynchronous (`gh workflow run`), so
      # on the run that first discovers the internal ALB the repoint will usually
      # still be in flight and this step will correctly skip.
      - name: Apply internal-plane edge deny (gated)
        if: success()
        run: bash modules/gateway/scripts/apply-internal-plane-deny.sh
        env:
          ENVIRONMENT: ${{ inputs.environment || 'dev' }}
          NAMESPACE: ${{ env.NAMESPACE }}

      # Deploy smoke assertion (Issue #4010): fail loudly if the edge ALB is
      # denying /internal while the API-GW integration still targets that same
      # ALB. That combination is a total internal-plane outage, and it is exactly
      # the state the original implementation of this change could reach.
      - name: Verify internal-plane invariant
        if: success()
        run: bash modules/gateway/scripts/apply-internal-plane-deny.sh --verify
        env:
          ENVIRONMENT: ${{ inputs.environment || 'dev' }}
          NAMESPACE: ${{ env.NAMESPACE }}

      - name: Verify gateway and engine release parity
        env:
          ENGINE_IMAGE: ${{ steps.vars.outputs.registry }}/adp-gateway:${{ inputs.manual_source_revision || inputs.adp_source_revision || github.sha }}
        run: |
          python3 modules/gateway/scripts/sync-gateway-engine.py \
            --verify-only --image "$ENGINE_IMAGE" --account "$ACCOUNT_ID" --region "$AWS_REGION" \
            --environment "$ENVIRONMENT" --namespace "$NAMESPACE"

      - name: Verify every active gateway writer before release evidence
        env:
          WRITER_IMAGE: ${{ steps.vars.outputs.registry }}/adp-gateway@${{ steps.release.outputs.digest }}
          WRITER_SOURCE: ${{ inputs.manual_source_revision || inputs.adp_source_revision || github.sha }}
        run: |
          python3 "$RUNNER_TEMP/adp-gateway-control/writers.py" --verify-only \
            --image "$WRITER_IMAGE" --account "$ACCOUNT_ID" --region "$AWS_REGION" \
            --cluster "$EKS_CLUSTER" --namespace "$NAMESPACE" \
            --gateway-root modules/gateway --source-revision "$WRITER_SOURCE" \
            --report "$RUNNER_TEMP/gateway-writers-verified.json"

      - name: Record gateway-backend build evidence
        env:
          ADP_PRODUCT_PROFILE_ENABLED: ${{ steps.release.outputs.profile_enabled }}
          ADP_PRODUCT_ONBOARDING_ENABLED: ${{ steps.release.outputs.onboarding_enabled }}
          ADP_PROFILE_ROLLBACK: ${{ inputs.product_rollback || 'false' }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          ADP_RELEASE_SOURCE: ${{ inputs.manual_source_revision || inputs.adp_source_revision || github.sha }}
          ADP_RELEASE_DEFINITION: ${{ github.workflow_sha }}
          ADP_RELEASE_WORKFLOW: .github/workflows/gateway-deploy.yml
        run: python3 "$RUNNER_TEMP/adp-deployment-evidence/scripts/deployment-release-evidence.py" gateway-backend
      - name: Publish gateway-backend build evidence to S3
        env:
          ADP_WORKFLOW_REVISION: ${{ github.workflow_sha }}
        run: python3 "$RUNNER_TEMP/adp-deployment-evidence/scripts/publish-deployment-evidence.py" release gateway-backend "$RUNNER_TEMP/adp-release-gateway-backend/release.json"

      - name: Publish successful Gateway source receipt
        env:
          GH_TOKEN: ${{ github.token }}
          ADP_RECEIPT_TARGET: adp-gateway-deploy-${{ inputs.environment || 'dev' }}
          ADP_RECEIPT_ROLE: ${{ vars.ADP_DEPLOY_ROLE_ARN }}
          ADP_RECEIPT_REGION: ${{ vars.ADP_DEPLOY_REGION || 'us-east-1' }}
          ADP_RECEIPT_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
          ADP_RECEIPT_REPOSITORY_ID: ${{ github.repository_id }}
          ADP_RECEIPT_SOURCE: ${{ inputs.manual_source_revision || inputs.adp_source_revision || github.sha }}
          ADP_RECEIPT_DEFINITION: ${{ github.workflow_sha }}
          ADP_RECEIPT_IMAGE: ${{ steps.release.outputs.digest }}
        run: python3 "$RUNNER_TEMP/adp-gateway-control/receipt.py" publish

  deploy-frontend:
    name: Build and Deploy Frontend
    runs-on: arc-runner-deploy
    environment: adp-frontend-deploy-${{ inputs.environment || 'dev' }}
    needs: [changes, deploy-backend]
    # Backend job is optional — run the frontend even when backend is skipped.
    # `always()` lets us bypass the default "cancelled if any dependency was
    # skipped" behavior; we still require the backend success if it did run.
    if: |
      github.ref == 'refs/heads/main' && (
      always() &&
      github.event_name == 'workflow_dispatch' &&
      !inputs.product_rollback &&
      (inputs.release_group == '' || inputs.release_group == 'none') &&
      needs.changes.outputs.frontend == 'true' &&
      (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped')
      )

    permissions:
      contents: read
      pull-requests: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.manual_source_revision || inputs.adp_source_revision || github.sha }}
          fetch-depth: 0

      - name: Verify source belongs to reviewed main history
        shell: bash
        env:
          ADP_SELECTED_SOURCE: ${{ inputs.manual_source_revision || inputs.adp_source_revision || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ADP_SELECTED_SOURCE"
          git fetch --no-tags origin "$GITHUB_SHA"
          git merge-base --is-ancestor HEAD FETCH_HEAD

      - name: Load maintained frontend deployment guard
        env:
          ADP_WORKFLOW_REVISION: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$ADP_WORKFLOW_REVISION" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "$ADP_WORKFLOW_REVISION"
          git merge-base --is-ancestor "$ADP_WORKFLOW_REVISION" "$GITHUB_SHA"
          git show "$ADP_WORKFLOW_REVISION:scripts/check-assistant-deploy-boundary.sh" > "$RUNNER_TEMP/adp-frontend-assistant-guard.sh"

      - name: Guard assistant frontend deployment
        env:
          ADP_ASSISTANT_DEPLOY_COMPONENT: frontend
          ADP_ASSISTANT_DEPLOY_TARGET: adp-frontend-deploy-${{ inputs.environment || 'dev' }}
          ADP_ASSISTANT_DEPLOY_CANDIDATE: ${{ inputs.manual_source_revision || inputs.adp_source_revision || github.sha }}
          ADP_ASSISTANT_APPROVED_TARGET: ${{ vars.ADP_ASSISTANT_APPROVED_TARGET }}
          ADP_ASSISTANT_APPROVED_REVISION: ${{ vars.ADP_ASSISTANT_APPROVED_REVISION }}
          ADP_ASSISTANT_DISPATCH_APPROVED_REVISION: ${{ inputs.adp_approved_revision }}
          ADP_DEPLOYED_BASELINE: ''
        run: bash "$RUNNER_TEMP/adp-frontend-assistant-guard.sh"

      - name: Establish trusted deployment identity
        uses: ./.github/actions/trusted-deployment
        with:
          role_arn: ${{ vars.ADP_FRONTEND_DEPLOY_ROLE_ARN }}
          region: ${{ vars.ADP_DEPLOY_REGION || 'us-east-1' }}

      - name: Load deployment config
        uses: ./.github/actions/load-deploy-config
        with:
          account_id: ${{ inputs.account_id }}
          environment: ${{ inputs.environment }}
          customer_account_id: ${{ inputs.customer_account_id }}
          customer_aws_label: ${{ inputs.customer_aws_label }}
          customer_user_id: ${{ inputs.customer_user_id }}

      - name: Load deployment evidence publisher from workflow revision
        env:
          ADP_WORKFLOW_REVISION: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$ADP_WORKFLOW_REVISION" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "$ADP_WORKFLOW_REVISION"
          git merge-base --is-ancestor "$ADP_WORKFLOW_REVISION" "$GITHUB_SHA"
          for file in scripts/publish-deployment-evidence.py scripts/deployment-workflow-context.py scripts/deployment-release-evidence.py deployment_evidence/__init__.py deployment_evidence/store.py; do
            mkdir -p "$RUNNER_TEMP/adp-deployment-evidence/$(dirname "$file")"
            git show "$ADP_WORKFLOW_REVISION:modules/gateway/$file" > "$RUNNER_TEMP/adp-deployment-evidence/$file"
          done

      - name: Record deployment workflow context
        if: needs.deploy-backend.result == 'skipped'
        env:
          CONTEXT_WORKFLOW: .github/workflows/gateway-deploy.yml
          CONTEXT_REVISION: ${{ github.workflow_sha }}
          CONTEXT_SOURCE: ${{ inputs.manual_source_revision || inputs.adp_source_revision || github.sha }}
          CONTEXT_CORRELATION: ${{ inputs.adp_correlation }}
          CONTEXT_REPOSITORY_ID: ${{ github.repository_id }}
          INPUT_ACCOUNT_ID: ${{ inputs.account_id || '' }}
          INPUT_CUSTOMER_ACCOUNT_ID: ${{ inputs.customer_account_id || '' }}
          INPUT_CUSTOMER_AWS_LABEL: ${{ inputs.customer_aws_label || '' }}
          INPUT_CUSTOMER_USER_ID: ${{ inputs.customer_user_id || '' }}
          INPUT_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
          INPUT_PRODUCT_CASES: ${{ inputs.product_cases || 'none' }}
          INPUT_PROOF_PHASE: ${{ inputs.proof_phase || 'none' }}
        run: python3 "$RUNNER_TEMP/adp-deployment-evidence/scripts/deployment-workflow-context.py"
      - name: Publish deployment workflow context to S3
        if: needs.deploy-backend.result == 'skipped'
        env:
          ADP_WORKFLOW_REVISION: ${{ github.workflow_sha }}
        run: python3 "$RUNNER_TEMP/adp-deployment-evidence/scripts/publish-deployment-evidence.py" context gateway-deploy.yml "$RUNNER_TEMP/adp-deployment-context/deployment-context.json"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'


      - name: Resolve VITE_* env from SSM
        id: vite_env
        run: |
          set -e
          get_ssm() { aws ssm get-parameter --name "$1" --query Parameter.Value --output text 2>/dev/null || echo ""; }

          POOL_ID=$(get_ssm "/adp/${ENVIRONMENT}/gateway/cognito-user-pool-id")
          CLIENT_ID=$(get_ssm "/adp/${ENVIRONMENT}/gateway/cognito-client-id")
          DOMAIN=$(get_ssm "/adp/${ENVIRONMENT}/gateway/cognito-domain")
          BROKER=$(get_ssm "/adp/${ENVIRONMENT}/gateway/github-auth-broker-url")
          WS_URL=$(get_ssm "/adp/${ENVIRONMENT}/gateway/agent-ws-url")

          # Fail-fast: if any required value missing, the build will silently produce a broken bundle.
          for var_name in POOL_ID CLIENT_ID DOMAIN; do
            if [ -z "${!var_name}" ]; then
              echo "::error::Required SSM param for $var_name is empty. Verify gateway-infra-apply ran cleanly." >&2
              exit 1
            fi
          done

          echo "VITE_COGNITO_USER_POOL_ID=$POOL_ID" >> "$GITHUB_OUTPUT"
          echo "VITE_COGNITO_CLIENT_ID=$CLIENT_ID" >> "$GITHUB_OUTPUT"
          echo "VITE_COGNITO_DOMAIN=$DOMAIN" >> "$GITHUB_OUTPUT"
          # Terraform already appends /auth/github to the SSM value (per #1011) so the
          # broker URL stored in SSM is .../dev/auth/github. The frontend (auth.ts)
          # then appends /start. Don't append /auth/github here — that produces
          # the doubled path .../auth/github/auth/github/start, breaking login.
          echo "VITE_GITHUB_AUTH_BROKER_URL=${BROKER}" >> "$GITHUB_OUTPUT"
          echo "VITE_AGENT_WS_URL=$WS_URL" >> "$GITHUB_OUTPUT"

      - name: Build frontend
        env:
          VITE_API_URL: /api
          VITE_COGNITO_REGION: us-east-1
          VITE_COGNITO_USER_POOL_ID: ${{ steps.vite_env.outputs.VITE_COGNITO_USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ steps.vite_env.outputs.VITE_COGNITO_CLIENT_ID }}
          VITE_COGNITO_DOMAIN: ${{ steps.vite_env.outputs.VITE_COGNITO_DOMAIN }}
          VITE_GITHUB_AUTH_BROKER_URL: ${{ steps.vite_env.outputs.VITE_GITHUB_AUTH_BROKER_URL }}
          VITE_AGENT_WS_URL: ${{ steps.vite_env.outputs.VITE_AGENT_WS_URL }}
        run: |
          cd modules/gateway/frontend
          npm ci
          npm run build

      - name: Deploy to S3 and invalidate CloudFront
        run: |
          BUCKET=$(aws ssm get-parameter \
            --name "/adp/${ENVIRONMENT}/gateway/frontend-bucket" \
            --query "Parameter.Value" --output text)
          cd modules/gateway/frontend
          # Exclude cfn-templates/ so it isn't wiped by --delete (populated by
          # the backend deploy job per issue #562).
          aws s3 sync dist/ "s3://${BUCKET}/" --delete --exclude "cfn-templates/*"

          DIST_ID=$(aws ssm get-parameter \
            --name "/adp/${ENVIRONMENT}/gateway/cloudfront-id" \
            --query "Parameter.Value" --output text 2>/dev/null) || true
          if [ -n "$DIST_ID" ] && [ "$DIST_ID" != "None" ]; then
            aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
          fi

      - name: Record gateway-frontend build evidence
        env:
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          ADP_RELEASE_SOURCE: ${{ inputs.manual_source_revision || inputs.adp_source_revision || github.sha }}
          ADP_RELEASE_DEFINITION: ${{ github.workflow_sha }}
          ADP_RELEASE_WORKFLOW: .github/workflows/gateway-deploy.yml
        run: python3 "$RUNNER_TEMP/adp-deployment-evidence/scripts/deployment-release-evidence.py" gateway-frontend
      - name: Publish gateway-frontend build evidence to S3
        env:
          ADP_WORKFLOW_REVISION: ${{ github.workflow_sha }}
        run: python3 "$RUNNER_TEMP/adp-deployment-evidence/scripts/publish-deployment-evidence.py" release gateway-frontend "$RUNNER_TEMP/adp-release-gateway-frontend/release.json"

  run-migrations:
    name: Run Pending Migrations
    # A reusable workflow cannot elevate the caller's token permissions.
    permissions:
      contents: read
      id-token: write
    needs: [changes, deploy-backend]
    # Issue #2918: Run migrations when new alembic files detected (push) OR on
    # workflow_dispatch (fresh-account deploys need migrations to run unconditionally).
    if: |
      always() &&
      (needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch') &&
      (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped')
    uses: ./.github/workflows/run-gateway-migrations.yml
    with:
      adp_correlation: ${{ inputs.adp_correlation || '' }}
      manual_source_revision: ${{ inputs.manual_source_revision || '' }}
      adp_source_revision: ${{ inputs.adp_source_revision || '' }}
      adp_definition_revision: ${{ inputs.adp_definition_revision || '' }}
      # GitHub suppresses job outputs containing the masked AWS account ID.
      # Pass only the deployed digest; the called job reconstructs the URI
      # using its trusted account config.
      expected_image_digest: ${{ needs.deploy-backend.outputs.release_digest }}
      account_id: ${{ inputs.account_id || '' }}
      environment: ${{ inputs.environment || 'dev' }}
      customer_account_id: ${{ inputs.customer_account_id || '' }}
      customer_aws_label: ${{ inputs.customer_aws_label || '' }}
      customer_user_id: ${{ inputs.customer_user_id || '' }}

  finalize-pricing:
    name: Verify and activate daily pricing
    needs: [deploy-backend, run-migrations]
    if: github.ref == 'refs/heads/main' && (needs.deploy-backend.result == 'success' && needs.run-migrations.result == 'success')
    runs-on: arc-runner-deploy
    environment: adp-gateway-deploy-${{ inputs.environment || 'dev' }}
    permissions:
      contents: read
      pull-requests: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.manual_source_revision || inputs.adp_source_revision || github.sha }}
          fetch-depth: 0
      - name: Verify source belongs to reviewed main history
        shell: bash
        env:
          ADP_SELECTED_SOURCE: ${{ inputs.manual_source_revision || inputs.adp_source_revision || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ADP_SELECTED_SOURCE"
          git fetch --no-tags origin "$GITHUB_SHA"
          git merge-base --is-ancestor HEAD FETCH_HEAD

      - name: Establish trusted deployment identity
        uses: ./.github/actions/trusted-deployment
        with:
          role_arn: ${{ vars.ADP_DEPLOY_ROLE_ARN }}
          region: ${{ vars.ADP_DEPLOY_REGION || 'us-east-1' }}

      - name: Load deployment config
        uses: ./.github/actions/load-deploy-config
        with:
          account_id: ${{ inputs.account_id }}
          environment: ${{ inputs.environment }}
          customer_account_id: ${{ inputs.customer_account_id }}
          customer_aws_label: ${{ inputs.customer_aws_label }}
          customer_user_id: ${{ inputs.customer_user_id }}
      - name: Verify release pricing and enable the schedule
        env:
          PRICING_RELEASE_DIGEST: ${{ needs.deploy-backend.outputs.release_digest }}
          ADP_KNOWN_PRICING_GAP: ${{ vars.ADP_KNOWN_PRICING_GAP || '' }}
        run: |
          set -euo pipefail
          command -v kubectl >/dev/null
          aws eks update-kubeconfig --name "adp-${ENVIRONMENT}-eks-cluster" --region "$AWS_REGION" >/dev/null
          [[ "$PRICING_RELEASE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::Missing valid deployed release digest"; exit 1; }
          PRICING_RELEASE_IMAGE="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/adp-gateway@${PRICING_RELEASE_DIGEST}"
          PRICING_RECOVERY_ARGS=()
          case "$ADP_KNOWN_PRICING_GAP" in
            "") ;;
            claude-widget-2026-09-24) PRICING_RECOVERY_ARGS=(--allow-known-claude-gap) ;;
            *) echo "::error::Unrecognized pricing source gap"; exit 1 ;;
          esac
          python3 modules/gateway/scripts/pricing-rollout.py finalize \
            --account-id "$ACCOUNT_ID" --environment "$ENVIRONMENT" \
            --expected-image "$PRICING_RELEASE_IMAGE" "${PRICING_RECOVERY_ARGS[@]}"
          # First rollout requires reviewed budget-lambda infra. If this gate
          # fails, apply that reviewed plan, then dispatch pricing-finalize.yml
          # at this release ref. The schedule stays disabled on failure.
  smoke-test:
    permissions:
      contents: read
      id-token: write
    name: Post-deploy Smoke Test
    needs: [deploy-backend, deploy-frontend]
    # Issue #3031: Real-token smoke against the deployed gateway.
    # Runs as soon as backend + frontend are done. Skipped dependencies are fine
    # (e.g. frontend-only push still triggers smoke if backend succeeded in a
    # prior run). It used to also wait on run-migrations and finalize-pricing,
    # which serialised ~2.5 min of pricing work in front of a smoke that only
    # exercises /status and /connections; the pricing chain now runs alongside
    # it (and alongside the Dev Box controller refresh) instead of in front.
    if: |
      always() &&
      (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped') &&
      (needs.deploy-frontend.result == 'success' || needs.deploy-frontend.result == 'skipped')
    uses: ./.github/workflows/gateway-smoke.yml
    # Ordinary releases may skip a missing smoke token; selected Product
    # acceptance requires the real-token smoke, so an absent token fails this
    # dependency and prevents Product cases from starting.
    with:
      require_token: ${{ inputs.product_cases != '' && inputs.product_cases != 'none' }}
      product_profile: ${{ inputs.product_cases != '' && inputs.product_cases != 'none' }}
      environment: ${{ inputs.environment || 'dev' }}
      account_id: ${{ inputs.account_id || '' }}
      customer_account_id: ${{ inputs.customer_account_id || '' }}
      customer_aws_label: ${{ inputs.customer_aws_label || '' }}
      customer_user_id: ${{ inputs.customer_user_id || '' }}

  identity-proof:
    if: >-
      github.ref == 'refs/heads/main' && inputs.proof_phase == 'stage.identity-proof' &&
      inputs.environment == 'dev' && inputs.product_cases == 'none' &&
      needs.deploy-backend.result == 'success'
    needs: [deploy-backend]
    runs-on: arc-runner-deploy
    environment: adp-gateway-deploy-dev
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      SOURCE_REVISION: ${{ inputs.adp_source_revision }}
      DEFINITION_REVISION: ${{ inputs.adp_definition_revision }}
      GATEWAY_REVISION: ${{ inputs.adp_source_revision }}
      PROOF_PHASE: ${{ inputs.proof_phase }}
      EXPECTED_ROLE: ${{ vars.ADP_DEPLOY_ROLE_ARN }}
      WORKFLOW_REVISION: ${{ github.workflow_sha }}
      ADP_CORRELATION: ${{ inputs.adp_correlation }}
      MANUAL_SOURCE: ${{ inputs.manual_source_revision }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.adp_definition_revision || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source belongs to reviewed main history
        shell: bash
        env:
          ADP_SELECTED_SOURCE: ${{ inputs.adp_definition_revision || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ADP_SELECTED_SOURCE"
          git fetch --no-tags origin "$GITHUB_SHA"
          git merge-base --is-ancestor HEAD FETCH_HEAD
      - name: Require bound proof source and workflow definition
        run: |
          set -euo pipefail
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ && "$DEFINITION_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ADP_CORRELATION" =~ ^([0-9a-f]{64}|orch:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$ && -z "$MANUAL_SOURCE" ]]
          [[ "$SOURCE_REVISION" == "$GATEWAY_REVISION" ]]
          [[ "$GITHUB_SHA" == "$DEFINITION_REVISION" && "$WORKFLOW_REVISION" == "$DEFINITION_REVISION" && "$(git rev-parse HEAD)" == "$DEFINITION_REVISION" ]]
          git merge-base --is-ancestor "$SOURCE_REVISION" HEAD
          git diff --quiet "$SOURCE_REVISION" HEAD -- tests/e2e/tools/atlassian_* tests/e2e/tools/test_atlassian_* docs/tools/atlassian-mcp/ .github/workflows/gateway-deploy.yml
          [[ "$EXPECTED_ROLE" =~ ^arn:aws:iam::([0-9]{12}):role/adp-[a-z0-9-]+-trusted-deployment$ ]]
          echo "EXPECTED_ACCOUNT=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
      - name: Preserve runner identity for private readback
        run: |
          set -euo pipefail
          test -n "$AWS_ROLE_ARN"
          test -f "$AWS_WEB_IDENTITY_TOKEN_FILE"
          printf 'CI_EVIDENCE_RUNNER_ROLE_ARN=%s\nCI_EVIDENCE_RUNNER_TOKEN_FILE=%s\n' "$AWS_ROLE_ARN" "$AWS_WEB_IDENTITY_TOKEN_FILE" >> "$GITHUB_ENV"
      - name: Establish trusted identity for signed proof publication
        uses: ./.github/actions/trusted-deployment
        with:
          role_arn: ${{ vars.ADP_DEPLOY_ROLE_ARN }}
          region: ${{ vars.ADP_DEPLOY_REGION || 'us-east-1' }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install generated-fixture test dependencies
        run: bash tests/e2e/tools/atlassian_identity_ci.sh install
      - name: Exercise the three controlled procedures and safety regressions
        run: bash tests/e2e/tools/atlassian_identity_ci.sh run
      - name: Retain controlled proof report privately
        id: publish-proof
        if: always()
        uses: ./.github/actions/upload-ci-evidence-s3
        with:
          name: atlassian-identity-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/atlassian-identity-proof/
          if-no-files-found: error
          retention-days: 14
      - name: Independently read back the bound controlled report
        if: always()
        env:
          CI_EVIDENCE_MANIFEST_URI: ${{ steps.publish-proof.outputs.manifest-uri }}
          CI_EVIDENCE_MANIFEST_VERSION: ${{ steps.publish-proof.outputs.manifest-version }}
        run: python -m tests.e2e.tools.atlassian_phase readback
      - name: Stage bounded proof summary after private readback
        env:
          CI_EVIDENCE_MANIFEST_URI: ${{ steps.publish-proof.outputs.manifest-uri }}
          CI_EVIDENCE_MANIFEST_VERSION: ${{ steps.publish-proof.outputs.manifest-version }}
        run: python -m tests.e2e.tools.atlassian_evaluator
      - name: Publish bounded proof summary for native evaluation
        env:
          ACCOUNT_ID: ${{ env.EXPECTED_ACCOUNT }}
          EXPECTED_SOURCE_REVISION: ${{ inputs.adp_source_revision }}
          ADP_WORKFLOW_REVISION: ${{ github.workflow_sha }}
        run: python modules/gateway/scripts/publish-deployment-evidence.py repository-artifact identity-proof "$RUNNER_TEMP/atlassian-stage-summary.json"

  product-acceptance-guard:
    if: always() && inputs.product_cases != '' && inputs.product_cases != 'none'
    needs: [deploy-backend, deploy-frontend, run-migrations, finalize-pricing, smoke-test]
    runs-on: arc-runner-deploy
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require matched protected Gateway release before Product cases
        env:
          PRODUCT_CASES: ${{ inputs.product_cases }}
          ADP_SOURCE: ${{ inputs.adp_source_revision }}
          ADP_CORRELATION: ${{ inputs.adp_correlation }}
          ADP_MANUAL_SOURCE: ${{ inputs.manual_source_revision }}
          DEPLOY_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
          REQUIRED_JOBS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          test "$PRODUCT_CASES" = 'api_product_lifecycle,api_denial_oracle,api_recovery_cleanup'
          test "$DEPLOY_ENVIRONMENT" = dev
          test -z "$ADP_MANUAL_SOURCE"
          test -n "$ADP_CORRELATION"
          [[ "$ADP_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          python3 - <<'PY'
          import json
          import os

          results = json.loads(os.environ['REQUIRED_JOBS'])
          required = {'deploy-backend', 'deploy-frontend', 'run-migrations', 'finalize-pricing', 'smoke-test'}
          if set(results) != required or any(results[name]['result'] != 'success' for name in required):
              raise SystemExit('Product acceptance requires a successful matched Gateway deployment and smoke')
          PY

  product-cli-evidence:
    needs: product-acceptance-guard
    if: inputs.product_cases != '' && inputs.product_cases != 'none'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/eval-cli-uplift.yml
    secrets: inherit
    with:
      target_environment: dev
      environment: dev
      expected_revision: ${{ inputs.adp_source_revision }}
      # This checkpoint supplies V03's installed CLI evidence. D01's release
      # and rollback scenarios remain separate acceptance requirements.
      suites: case:PR03-C01,case:PR03-C02,case:PR03-C03
      product_run_id: ${{ format('product-{0}-{1}', github.run_id, github.run_attempt) }}

  product-acceptance:
    needs: [product-acceptance-guard, product-cli-evidence]
    if: inputs.product_cases != '' && inputs.product_cases != 'none'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/gateway-live-tests.yml
    secrets: inherit
    with:
      target_environment: dev
      product_cases: ${{ inputs.product_cases }}
      expected_revision: ${{ inputs.adp_source_revision }}

  product-recovery:
    needs: [product-acceptance-guard, product-cli-evidence, product-acceptance]
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (inputs.environment || 'dev') == 'dev' &&
      inputs.product_cases == 'api_product_lifecycle,api_denial_oracle,api_recovery_cleanup' &&
      needs.product-acceptance-guard.result == 'success' &&
      needs.product-cli-evidence.result == 'success' &&
      needs.product-acceptance.result == 'success'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/gateway-product-recovery.yml
    secrets: inherit
    with:
      expected_revision: ${{ inputs.adp_source_revision }}

  refresh-dev-box-controller:
    permissions:
      contents: read
      id-token: write
    name: Refresh Dev Box controller to the released gateway image
    # The optional dev-box-controller runs the gateway image and imports gateway code
    # from it, so it must follow every gateway release (dev 2026-10-18: it ran a
    # six-hour-old image and code after the gateway had rolled twice). This job is
    # deliberately OFF the gateway's critical path: it runs after deploy-backend in
    # parallel with frontend/migrations/smoke, nothing depends on it, it is bounded
    # to a short rollout wait, and continue-on-error keeps it from ever failing or
    # delaying a gateway deploy. It is a no-op where Dev Box is not deployed. Code
    # drift is handled by dev-box-controller-deploy.yml; both call the same script,
    # and both take controller code from main so a deploy never rolls it back (#8223
    # cause 54).
    needs: [changes, deploy-backend]
    if: github.ref == 'refs/heads/main' && needs.deploy-backend.result == 'success'
    runs-on: arc-runner-deploy
    environment: adp-gateway-deploy-${{ inputs.environment || 'dev' }}
    continue-on-error: true
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.manual_source_revision || inputs.adp_source_revision || github.sha }}
          fetch-depth: 0

      - name: Verify source belongs to reviewed main history
        shell: bash
        env:
          ADP_SELECTED_SOURCE: ${{ inputs.manual_source_revision || inputs.adp_source_revision || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ADP_SELECTED_SOURCE"
          git fetch --no-tags origin "$GITHUB_SHA"
          git merge-base --is-ancestor HEAD FETCH_HEAD

      - name: Establish trusted deployment identity
        uses: ./.github/actions/trusted-deployment
        with:
          role_arn: ${{ vars.ADP_DEPLOY_ROLE_ARN }}
          region: ${{ vars.ADP_DEPLOY_REGION || 'us-east-1' }}

      - name: Load deployment config
        uses: ./.github/actions/load-deploy-config
        with:
          account_id: ${{ inputs.account_id }}
          environment: ${{ inputs.environment }}
          region: ${{ vars.ADP_DEPLOY_REGION || 'us-east-1' }}

      - name: Refresh the controller to the digest this run released
        # Controller CODE comes from origin/main, not from this run's checkout: a deploy
        # started from an older commit (a queued push, a workflow_dispatch ref) must not
        # replace a controller fix merged since (#8223 cause 54, dev 2026-10-22 07:03: a
        # 06:20 workflow_dispatch run undid controller code merged at 06:55). The IMAGE is
        # this run's release, which is the gateway deploy's legitimate job. The script
        # itself also refuses to roll code back (see refresh-controller.sh), so a stale
        # origin/main fetch cannot regress the controller either.
        env:
          RELEASE_DIGEST: ${{ needs.deploy-backend.outputs.release_digest }}
        run: |
          set -euo pipefail
          [ -n "$RELEASE_DIGEST" ] || { echo "no release digest from deploy-backend; nothing to refresh"; exit 0; }
          git fetch --no-tags origin main
          MAIN_REVISION=$(git rev-parse origin/main)
          CONTROLLER_CHECKOUT="${RUNNER_TEMP}/dev-box-controller-main"
          git worktree add --detach "$CONTROLLER_CHECKOUT" "$MAIN_REVISION"
          echo "controller code from origin/main @ $MAIN_REVISION (this run: $(git rev-parse HEAD))"
          export KUBECONFIG="${RUNNER_TEMP}/dev-box-controller-kubeconfig"
          aws eks update-kubeconfig --name "adp-${ENVIRONMENT}-eks-cluster" --region "$AWS_REGION" --kubeconfig "$KUBECONFIG"
          bash "$CONTROLLER_CHECKOUT/modules/user-services/dev-box/scripts/refresh-controller.sh" \
            --namespace adp-gateway \
            --image "${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/adp-gateway@${RELEASE_DIGEST}" \
            --source-revision "$MAIN_REVISION" --timeout 240s
