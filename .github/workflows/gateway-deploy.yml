name: Gateway Deploy

run-name: ${{ inputs.adp_correlation && format('ADP deployment {0}', inputs.adp_correlation) || '' }}

on:
  push:
    paths:
      - 'contracts/**'
      - 'modules/gateway/src/**'
      - 'modules/L5-services/src/**'
      - 'modules/L5-services/pyproject.toml'
      - 'modules/L5-services/requirements-security.lock'
      - 'modules/gateway/deployment_evidence/**'
      - 'modules/gateway/cli/**'
      - 'modules/agent-factory/skills/**'
      - 'modules/gateway/scripts/build-skills-archive.sh'
      - 'modules/gateway/Dockerfile'
      # The operation decoder is staged into the Gateway image from its source.
      - 'modules/harness/jobs/harness_jobs/identity.py'
      - 'modules/insights/projection.py'
      - 'modules/insights/results.py'
      - 'modules/gateway/scripts/stage-contracts.sh'
      - 'modules/gateway/scripts/stage-l5-wheel.sh'
      - 'modules/gateway/scripts/stage-common-wheel.sh'
      - 'libs/python/adp-common/**'
      - 'modules/gateway/k8s/**'
      - 'modules/gateway/alembic/versions/**'
      - 'modules/gateway/lambda/budget-usage-tracker/**'
      - 'modules/gateway/lambda/pricing-refresh/**'
      - 'modules/gateway/lambda/shared/pricing_fallback.py'
      - 'modules/gateway/lambda/shared/*.py'
      - 'modules/gateway/scripts/pricing-rollout.py'
      - 'modules/gateway/scripts/migrate-before-rollout.py'
      - 'modules/gateway/scripts/sync-gateway-engine.py'
      - 'modules/gateway/scripts/sync-gateway-writers.py'
      - 'modules/gateway/scripts/apply-gateway-deployment.py'
      - 'modules/gateway/scripts/build-budget-lambda-archives.py'
      - 'modules/gateway/scripts/deploy-budget-lambda-code.py'
      - 'modules/gateway/scripts/batch-ssm.py'
      - 'modules/gateway/lambda/shared/root_principal.py'
      # Issue #4969: shared pricing policy, vendored into both budget Lambda zips
      # AND baked into the gateway image. A change here must redeploy all three or
      # the estimator and the settlement path run different rates.
      - 'modules/gateway/pricing_policy/**'
      - '.github/workflows/gateway-deploy.yml'
      - '.github/workflows/run-gateway-migrations.yml'
      - '.github/workflows/pricing-finalize.yml'
      - 'codebuild/bs-gateway-build.yml'
      - 'modules/gateway/pyproject.toml'
      - 'modules/L5-services/scripts/build-package.sh'
      - 'modules/L5-services/scripts/stage-gateway.sh'
      - 'platform/scripts/publish-shared-image.sh'
      # Prose-only changes do not start this workflow; L5 schema JSON does.
      - '!docs/**'
      - '!**/docs/**'
      - '!**/README*'
      - '!**/CHANGELOG*'
      - '!**/CONTRIBUTING*'
      - '!**/*.rst'
      - 'docs/l5-services/contracts/v1/*.json'
      - 'docs/l5-services/contracts/v1/*.tsv'
    branches:
      - main
  workflow_dispatch:
    inputs:
      adp_correlation:
        description: 'Engine delivery correlation; empty preserves manual operation.'
        required: false
        type: string
        default: ''
      release_group:
        description: 'Accepted shared foundation release only; ordinary deployments use none.'
        required: false
        type: choice
        options:
          - none
          - atlassian-foundation
        default: 'none'
      product_rollback:
        description: 'Restore an exact protected compatible Product artifact; retain the expanded schema.'
        required: false
        type: boolean
        default: false
      manual_source_revision:
        description: 'Manual deployment of an exact reviewed main ancestor; cannot accompany engine delivery inputs.'
        required: false
        type: string
        default: ''
      adp_source_revision:
        description: 'Engine-approved immutable source commit.'
        required: false
        type: string
        default: ''
      adp_definition_revision:
        description: 'Expected workflow revision; checked before deployment.'
        required: false
        type: string
        default: ''
      proof_phase:
        description: 'Reviewed generated-only Identity proof after Gateway backend release; requires a matching accepted operations plan.'
        required: false
        type: choice
        options:
          - none
          - stage.identity-proof
        default: 'none'
      product_cases:
        description: 'Reviewed Product API/CLI and compatible recovery inventory; only accepted operations plan dispatch may select it.'
        required: false
        type: choice
        options:
          - none
          - api_product_lifecycle,api_denial_oracle,api_recovery_cleanup
        default: 'none'
      adp_approved_revision:
        # The operations broker may dispatch the reviewed dev defaults with this
        # optional input blank. Non-dev approval remains enforced below.
        description: 'Assistant rollout approval for non-dev targets only (dev needs none): full 40-hex commit whose protected assistant files this candidate must match (see docs/architecture/assistant-deploy-boundary.md).'
        required: false
        type: string
        default: ''
      account_id:
        description: 'Target AWS account (12 digits). Empty = use platform IRSA / config file.'
        required: false
        default: ''
      customer_account_id:
        description: 'Customer-linked AWS account to deploy into (cross-account mode). Triggers gateway-call assume.'
        required: false
        default: ''
      customer_aws_label:
        description: 'Vaulted credential label (when customer_account_id is set).'
        required: false
        default: ''
      customer_user_id:
        description: 'ADP users.id UUID (when customer_account_id is set).'
        required: false
        default: ''
      environment:
        description: 'Deployment environment (dev/staging/prod).'
        required: false
        default: 'dev'

concurrency:
  # Serialize with infra and standalone finalization. Account aliases (empty
  # platform input vs an explicit account ID) must not produce different locks.
  group: gateway-release-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false
  # Keep pending worker/infra releases when a newer gateway release arrives.
  queue: max

env:
  ADP_DEPLOYMENT_EVIDENCE_STORE: s3-oidc-v1
  ADP_IDENTITY_PROOF_EVIDENCE_STORE: s3-oidc-v1
  AWS_REGION: us-east-1
  ENVIRONMENT: dev
  NAMESPACE: adp-gateway
  EKS_CLUSTER: adp-dev-eks-cluster
jobs:
  # Detect which parts of the gateway changed so we can skip the unrelated
  # build/deploy job on backend-only pushes. Frontend pushes use the dedicated
  # gateway-frontend-deploy.yml publisher; workflow_dispatch still runs both.
  changes:
    name: Detect changes
    runs-on: arc-runner-deploy
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      migrations: ${{ steps.filter.outputs.migrations }}
      budget_lambdas: ${{ steps.filter.outputs.budget_lambdas }}
    steps:
      - name: Guard engine delivery revisions
        env:
          ADP_MANUAL_SOURCE: ${{ inputs.manual_source_revision }}
          ADP_CORRELATION: ${{ inputs.adp_correlation }}
          ADP_SOURCE: ${{ inputs.adp_source_revision }}
          ADP_DEFINITION: ${{ inputs.adp_definition_revision }}
          ACTUAL_DEFINITION: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          if [ -n "${ADP_MANUAL_SOURCE:-}" ]; then
            [[ "$ADP_MANUAL_SOURCE" =~ ^[0-9a-f]{40}$ ]] || exit 1
            test -z "$ADP_CORRELATION$ADP_SOURCE$ADP_DEFINITION"
          fi
          if [ -n "$ADP_CORRELATION$ADP_SOURCE$ADP_DEFINITION" ]; then
            [[ "$ADP_CORRELATION" =~ ^([0-9a-f]{64}|orch:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$ ]] || exit 1
            [[ "$ADP_SOURCE" =~ ^[0-9a-f]{40}$ ]] || exit 1
            [[ "$ADP_DEFINITION" =~ ^[0-9a-f]{40}$ ]] || exit 1
            test "$ACTUAL_DEFINITION" = "$ADP_DEFINITION"
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.manual_source_revision || inputs.adp_source_revision || github.sha }}
          fetch-depth: 2
      - id: filter
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "migrations=false" >> "$GITHUB_OUTPUT"
            echo "budget_lambdas=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # On push: diff the merge against its parent.
          CHANGED=$(git diff --name-only HEAD^ HEAD)
          echo "Changed files:"
          echo "$CHANGED"

          BACKEND=false
          FRONTEND=false
          MIGRATIONS=false
          BUDGET_LAMBDAS=false
          if echo "$CHANGED" | grep -qE '^(libs/python/adp-common/|contracts/|modules/L5-services/(src/|pyproject\.toml$|requirements-security\.lock$|scripts/(build-package|stage-gateway)\.sh$)|docs/l5-services/contracts/v1/[^/]+\.(json|tsv)$|modules/gateway/src/|modules/gateway/deployment_evidence/|modules/gateway/cli/|modules/agent-factory/skills/|modules/gateway/scripts/build-skills-archive\.sh$|modules/gateway/Dockerfile|modules/gateway/k8s/|modules/gateway/scripts/(migrate-before-rollout|sync-gateway-engine|sync-gateway-writers|apply-gateway-deployment|batch-ssm)\.py|modules/gateway/scripts/stage-(contracts|l5-wheel|common-wheel)\.sh$|platform/scripts/publish-shared-image\.sh$|modules/insights/(projection|results)\.py$|modules/harness/jobs/harness_jobs/identity\.py$)'; then
            BACKEND=true
          fi
          if echo "$CHANGED" | grep -qE '^modules/gateway/frontend/'; then
            FRONTEND=true
          fi
          if echo "$CHANGED" | grep -qE '^(modules/gateway/alembic/versions/|modules/L5-services/src/l5_services/migrations/versions/)'; then
            MIGRATIONS=true
            echo "::warning::New Alembic migration detected in this push"
            # Migration files are baked into the release image. Build it before
            # the pre-serving Job runs `alembic upgrade head` from that release.
            BACKEND=true
          fi
          if echo "$CHANGED" | grep -qE '^modules/gateway/lambda/(budget-usage-tracker/|pricing-refresh/|shared/.*\.py$)'; then
            BUDGET_LAMBDAS=true
            BACKEND=true
          fi
          # #4969: pricing_policy ships in three artifacts — both Lambda zips and
          # the gateway image. Updating only some of them leaves the pre-request
          # estimator and the settlement authority on different rates, which is the
          # exact class of drift this package was introduced to eliminate.
          if echo "$CHANGED" | grep -qE '^(modules/gateway/pricing_policy/|modules/gateway/scripts/(pricing-rollout|build-budget-lambda-archives|deploy-budget-lambda-code)\.py|\.github/workflows/(gateway-deploy|run-gateway-migrations|pricing-finalize)\.yml|codebuild/bs-gateway-build\.yml|modules/gateway/pyproject\.toml)'; then
            BUDGET_LAMBDAS=true
            BACKEND=true
          fi
          echo "backend=$BACKEND" >> "$GITHUB_OUTPUT"
          echo "frontend=$FRONTEND" >> "$GITHUB_OUTPUT"
          echo "migrations=$MIGRATIONS" >> "$GITHUB_OUTPUT"
          echo "budget_lambdas=$BUDGET_LAMBDAS" >> "$GITHUB_OUTPUT"

  deploy-backend:
    outputs:
      release_digest: ${{ steps.release.outputs.digest }}
    name: Build and Deploy Backend
    runs-on: arc-runner-deploy
    environment: adp-gateway-deploy-${{ inputs.environment || 'dev' }}
    env:
      # Durable explicit bindings for operator-owned auxiliary application writers.
      # See sync-gateway-writers.py for the exact deployment/UID/container schema.
      ADP_GATEWAY_WRITER_INVENTORY: ${{ vars.ADP_GATEWAY_WRITER_INVENTORY || '[]' }}
    needs: changes
    if: github.ref == 'refs/heads/main' && (needs.changes.outputs.backend == 'true')
    # AWS authority comes from the protected deployment environment.
    permissions:
      id-token: write
      contents: read
      deployments: write  # Durable successful-source receipt, independent of artifact retention.
      actions: write  # Required by "Trigger gateway-infra re-apply" step (gh workflow run)

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.manual_source_revision || inputs.adp_source_revision || github.sha }}
          fetch-depth: 0

      - name: Verify source belongs to reviewed main history
        shell: bash
        env:
          ADP_SELECTED_SOURCE: ${{ inputs.manual_source_revision || inputs.adp_source_revision || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ADP_SELECTED_SOURCE"
          git fetch --no-tags origin "$GITHUB_SHA"
          git merge-base --is-ancestor HEAD FETCH_HEAD

      - name: Load maintained deployment guards
        env:
          ADP_WORKFLOW_REVISION: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$ADP_WORKFLOW_REVISION" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "$ADP_WORKFLOW_REVISION"
          git merge-base --is-ancestor "$ADP_WORKFLOW_REVISION" "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/adp-gateway-control"
          git show "$ADP_WORKFLOW_REVISION:scripts/check-assistant-deploy-boundary.sh" > "$RUNNER_TEMP/adp-gateway-control/assistant-guard.sh"
          git show "$ADP_WORKFLOW_REVISION:modules/gateway/scripts/gateway-deployment-receipt.py" > "$RUNNER_TEMP/adp-gateway-control/receipt.py"
          git show "$ADP_WORKFLOW_REVISION:modules/gateway/scripts/deployment-release-evidence.py" > "$RUNNER_TEMP/adp-gateway-control/release-evidence.py"
          git show "$ADP_WORKFLOW_REVISION:modules/gateway/scripts/sync-gateway-writers.py" > "$RUNNER_TEMP/adp-gateway-control/writers.py"
          git show "$ADP_WORKFLOW_REVISION:modules/gateway/scripts/batch-ssm.py" > "$RUNNER_TEMP/adp-gateway-control/batch-ssm.py"
          git show "$ADP_WORKFLOW_REVISION:modules/gateway/scripts/deploy-budget-lambda-code.py" > "$RUNNER_TEMP/adp-gateway-control/deploy-budget-lambda-code.py"
          git show "$ADP_WORKFLOW_REVISION:modules/gateway/scripts/apply-gateway-deployment.py" > "$RUNNER_TEMP/adp-gateway-control/apply-deployment.py"
          git show "$ADP_WORKFLOW_REVISION:platform/scripts/render-gateway-capacity.py" > "$RUNNER_TEMP/adp-gateway-control/render-capacity.py"
          git show "$ADP_WORKFLOW_REVISION:platform/scripts/gateway-capacity-lock.py" > "$RUNNER_TEMP/adp-gateway-control/capacity-lock.py"
          git show "$ADP_WORKFLOW_REVISION:modules/gateway/scripts/product-profile-recovery.py" > "$RUNNER_TEMP/adp-gateway-control/product-recovery.py"
          git show "$ADP_WORKFLOW_REVISION:modules/gateway/scripts/guard-foundation-release.py" > "$RUNNER_TEMP/adp-gateway-control/guard-foundation-release.py"
          git show "$ADP_WORKFLOW_REVISION:modules/tools/adapters/guard_release.py" > "$RUNNER_TEMP/adp-gateway-control/guard_release.py"

      - name: Validate accepted foundation job and shared lease
        if: inputs.release_group == 'atlassian-foundation'
        env:
          ADP_RELEASE_GROUP: ${{ inputs.release_group }}
          ADP_ENVIRONMENT: ${{ inputs.environment }}
          ADP_MANUAL_SOURCE: ${{ inputs.manual_source_revision }}
          ADP_PRODUCT_CASES: ${{ inputs.product_cases }}
          ADP_PROOF_PHASE: ${{ inputs.proof_phase }}
          ADP_PRODUCT_ROLLBACK: ${{ inputs.product_rollback }}
          ADP_CORRELATION: ${{ inputs.adp_correlation }}
          ADP_SOURCE_REVISION: ${{ inputs.adp_source_revision }}
          ADP_DEFINITION_REVISION: ${{ github.workflow_sha }}
          ADP_DEPLOY_ROLE_ARN: ${{ vars.ADP_DEPLOY_ROLE_ARN }}
          ADP_FOUNDATION_CONNECTION_ROLE_ARN: ${{ vars.ADP_FOUNDATION_CONNECTION_ROLE_ARN }}
          ADP_FOUNDATION_GATEWAY_URL: ${{ vars.ADP_FOUNDATION_GATEWAY_URL }}
        run: python3 "$RUNNER_TEMP/adp-gateway-control/guard-foundation-release.py"

      - name: Resolve last successfully deployed revision
        id: deployed
        # Dev does not require assistant approval or a deployment baseline.
        # Non-dev approvals are validated by the guard; otherwise resolve evidence.
        if: >-
          ${{ inputs.product_rollback || ((inputs.environment || 'dev') != 'dev' &&
          !(github.event_name == 'workflow_dispatch' && inputs.adp_approved_revision != '') &&
          !(vars.ADP_ASSISTANT_APPROVED_TARGET == format('adp-gateway-deploy-{0}', inputs.environment || 'dev') && vars.ADP_ASSISTANT_APPROVED_REVISION != '')) }}
        env:
          GH_TOKEN: ${{ github.token }}
          ADP_RECEIPT_TARGET: adp-gateway-deploy-${{ inputs.environment || 'dev' }}
          ADP_RECEIPT_ROLE: ${{ vars.ADP_DEPLOY_ROLE_ARN }}
          ADP_RECEIPT_REGION: ${{ vars.ADP_DEPLOY_REGION || 'us-east-1' }}
          ADP_RECEIPT_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
          ADP_RECEIPT_REPOSITORY_ID: ${{ github.repository_id }}
        run: python3 "$RUNNER_TEMP/adp-gateway-control/receipt.py" resolve

      - name: Guard assistant auto-deployment
        env:
          ADP_ASSISTANT_DEPLOY_COMPONENT: gateway
          ADP_ASSISTANT_DEPLOY_TARGET: adp-gateway-deploy-${{ inputs.environment || 'dev' }}
          ADP_ASSISTANT_DEPLOY_CANDIDATE: ${{ inputs.manual_source_revision || inputs.adp_source_revision || github.sha }}
          ADP_ASSISTANT_APPROVED_TARGET: ${{ vars.ADP_ASSISTANT_APPROVED_TARGET }}
          ADP_ASSISTANT_APPROVED_REVISION: ${{ vars.ADP_ASSISTANT_APPROVED_REVISION }}
          ADP_ASSISTANT_DISPATCH_APPROVED_REVISION: ${{ inputs.adp_approved_revision }}
          ADP_DEPLOYED_BASELINE: ${{ steps.deployed.outputs.baseline }}
        run: bash "$RUNNER_TEMP/adp-gateway-control/assistant-guard.sh"

      - name: Establish trusted deployment identity
        uses: ./.github/actions/trusted-deployment
        with:
          role_arn: ${{ vars.ADP_DEPLOY_ROLE_ARN }}
          region: ${{ vars.ADP_DEPLOY_REGION || 'us-east-1' }}

      - name: Load deployment config
        uses: ./.github/actions/load-deploy-config
        with:
          account_id: ${{ inputs.account_id }}
          environment: ${{ inputs.environment }}
          customer_account_id: ${{ inputs.customer_account_id }}
          customer_aws_label: ${{ inputs.customer_aws_label }}
          customer_user_id: ${{ inputs.customer_user_id }}

      - name: Load deployment evidence publisher from workflow revision
        env:
          ADP_WORKFLOW_REVISION: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$ADP_WORKFLOW_REVISION" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "$ADP_WORKFLOW_REVISION"
          git merge-base --is-ancestor "$ADP_WORKFLOW_REVISION" "$GITHUB_SHA"
          for file in scripts/publish-deployment-evidence.py scripts/deployment-workflow-context.py scripts/deployment-release-evidence.py deployment_evidence/__init__.py deployment_evidence/store.py; do
            mkdir -p "$RUNNER_TEMP/adp-deployment-evidence/$(dirname "$file")"
            git show "$ADP_WORKFLOW_REVISION:modules/gateway/$file" > "$RUNNER_TEMP/adp-deployment-evidence/$file"
          done

      - name: Record deployment workflow context
        env:
          CONTEXT_WORKFLOW: .github/workflows/gateway-deploy.yml
          CONTEXT_REVISION: ${{ github.workflow_sha }}
          CONTEXT_SOURCE: ${{ inputs.manual_source_revision || inputs.adp_source_revision || github.sha }}
          CONTEXT_CORRELATION: ${{ inputs.adp_correlation }}
          CONTEXT_REPOSITORY_ID: ${{ github.repository_id }}
          INPUT_ACCOUNT_ID: ${{ inputs.account_id || '' }}
          INPUT_CUSTOMER_ACCOUNT_ID: ${{ inputs.customer_account_id || '' }}
          INPUT_CUSTOMER_AWS_LABEL: ${{ inputs.customer_aws_label || '' }}
          INPUT_CUSTOMER_USER_ID: ${{ inputs.customer_user_id || '' }}
          INPUT_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
          INPUT_PRODUCT_CASES: ${{ inputs.product_cases || 'none' }}
          INPUT_RELEASE_GROUP: ${{ inputs.release_group || 'none' }}
          INPUT_PROOF_PHASE: ${{ inputs.proof_phase || 'none' }}
        run: python3 "$RUNNER_TEMP/adp-deployment-evidence/scripts/deployment-workflow-context.py"
      - name: Publish deployment workflow context to S3
        env:
          ADP_WORKFLOW_REVISION: ${{ github.workflow_sha }}
        run: python3 "$RUNNER_TEMP/adp-deployment-evidence/scripts/publish-deployment-evidence.py" context gateway-deploy.yml "$RUNNER_TEMP/adp-deployment-context/deployment-context.json"

      - name: Deploy budget tracker and pricing code
        if: needs.changes.outputs.budget_lambdas == 'true' && !inputs.product_rollback
        # These functions are provisioned by Terraform, but their source changes
        # must ship with the gateway. Update code only, before enabling new event
        # producers in the backend. Keep both archives in sync with budget-lambda/main.tf.
        run: |
          set -euo pipefail
          python3 modules/gateway/scripts/pricing-rollout.py quiesce \
            --account-id "$ACCOUNT_ID" --environment "$ENVIRONMENT"
          python3 modules/gateway/scripts/build-budget-lambda-archives.py --output /tmp
          for name in pricing-refresh budget-usage-tracker; do
            function="arn:aws:lambda:${AWS_REGION}:${ACCOUNT_ID}:function:bedrockgw-${ENVIRONMENT}-${name}"
            python3 "$RUNNER_TEMP/adp-gateway-control/deploy-budget-lambda-code.py" \
              --function "$function" --archive "/tmp/${name}.zip"
          done

      - name: Compute build vars
        id: vars
        run: |
          echo "registry=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com" >> "$GITHUB_OUTPUT"
          echo "effective_account=${ACCOUNT_ID}" >> "$GITHUB_OUTPUT"

      - name: Build image via CodeBuild
        uses: ./.github/actions/codebuild-run
        with:
          source_revision: ${{ inputs.manual_source_revision || inputs.adp_source_revision || github.sha }}
          project_name: adp-${{ env.ENVIRONMENT }}-gateway-build
          region: ${{ env.AWS_REGION }}
          state_bucket: ${{ env.STATE_BUCKET }}
          environment_variables: >-
            "name=AWS_REGION,value=${{ env.AWS_REGION }}"
            "name=ENVIRONMENT,value=${{ env.ENVIRONMENT }}"
            "name=ACCOUNT_ID,value=${{ steps.vars.outputs.effective_account }}"
            "name=REGISTRY,value=${{ steps.vars.outputs.registry }}"
            "name=STATE_BUCKET,value=${{ env.STATE_BUCKET }}"
            "name=EKS_CLUSTER,value=${{ env.EKS_CLUSTER }}"
            "name=IMAGE_TAG,value=${{ inputs.manual_source_revision || inputs.adp_source_revision || github.sha }}"
          poll_interval: '10'

      - name: Export image tag
        env:
          ADP_INPUT_3965067AD6: ${{ inputs.manual_source_revision || inputs.adp_source_revision || github.sha }}
        run: |
          echo "IMAGE_TAG=${ADP_INPUT_3965067AD6}" >> $GITHUB_ENV


      - name: Upload CFN templates to S3
        # Issue #562: the AWS connect flow pre-signs a GET URL on these objects.
        # They need to exist in S3 before the gateway pod can build valid Quick-Create
        # URLs. Idempotent — copy-over on every deploy picks up template edits.
        # Issue #4742: v2 is the routing-capable role (Bedrock invoke, no
        # single-user trust pin); v1 stays for the read-only connect flow.
        run: |
          BUCKET=$(aws ssm get-parameter \
            --name "/adp/${ENVIRONMENT}/gateway/frontend-bucket" \
            --query "Parameter.Value" --output text)
          for template in aws_role_v1 aws_role_v2 aws_role_deploy_v1; do
            aws s3 cp \
              "modules/gateway/src/auth/cfn_templates/${template}.yaml" \
              "s3://${BUCKET}/cfn-templates/${template}.yaml" \
              --content-type application/x-yaml
          done

      - name: Acquire gateway capacity ownership
        id: capacity_lock
        run: |
          python3 "$RUNNER_TEMP/adp-gateway-control/capacity-lock.py" acquire \
            --account "$ACCOUNT_ID" --region "$AWS_REGION" --environment "$ENVIRONMENT" \
            --cluster "$EKS_CLUSTER" --namespace "$NAMESPACE" \
            --owner-file "$RUNNER_TEMP/adp-gateway-control/capacity-owner.json"

      # =====================================================================
      # Issue #1008: First-deploy support — ensure namespace, configmap,
      # secret, serviceaccount, and supporting manifests exist before the
      # deployment is applied. On subsequent deploys these are idempotent
      # no-ops (kubectl apply is safe to re-run).
      # =====================================================================

      - name: Ensure namespace and render K8s prerequisites
        run: |
          EFFECTIVE_ACCOUNT="$ACCOUNT_ID"
          aws eks update-kubeconfig --name "${EKS_CLUSTER}" --region ${AWS_REGION}

          # --- Namespace prerequisite ---
          # Namespace lifecycle and Pod Security Admission labels are deliberately
          # cluster-scoped platform operations. The gateway deploy principal has
          # namespaced edit access only and must never create or patch namespaces.
          # Fresh-account deployments create the namespace in deploy-all.sh before
          # this workflow can run.
          if ! kubectl get serviceaccount default -n "${NAMESPACE}" >/dev/null 2>&1; then
            echo "::error::Namespace ${NAMESPACE} is missing. Run the platform deployment prerequisite first."
            exit 1
          fi

          # --- Helper: read SSM param with fallback ---
          # Snapshot exactly this step's configuration with <=10 names per API call.
          # Missing parameters keep their existing defaults; read failures stop rendering.
          SSM_SNAPSHOT=$(mktemp)
          python3 "$RUNNER_TEMP/adp-gateway-control/batch-ssm.py" "$0" "$ENVIRONMENT" "$SSM_SNAPSHOT"
          source "$SSM_SNAPSHOT"
          rm -f "$SSM_SNAPSHOT"
          get_ssm() { printf '%s\n' "${ADP_SSM_VALUES[plain:$1]-${2:-}}"; }

          # --- Gather values from SSM (published by gateway-infra-apply) ---
          DB_HOST=$(get_ssm "/adp/${ENVIRONMENT}/gateway/rds-host")
          DB_NAME=$(get_ssm "/adp/${ENVIRONMENT}/gateway/rds-database-name")
          DB_USER="bgadmin"
          REDIS_HOST=$(get_ssm "/adp/${ENVIRONMENT}/gateway/redis-host")
          REDIS_PORT=$(get_ssm "/adp/${ENVIRONMENT}/gateway/redis-port")
          # #4342: ElastiCache IAM auth — the app mints a connect token per
          # connection, so it needs the provisioned IAM user name and the
          # replication group id (the token is signed against the group id, not
          # the endpoint host). Published by gateway-infra-apply.
          REDIS_IAM_USERNAME=$(get_ssm "/adp/${ENVIRONMENT}/gateway/redis-iam-username")
          REDIS_CACHE_NAME=$(get_ssm "/adp/${ENVIRONMENT}/gateway/redis-cache-name")
          COGNITO_USER_POOL_ID=$(get_ssm "/adp/${ENVIRONMENT}/gateway/cognito-user-pool-id")
          COGNITO_CLIENT_ID=$(get_ssm "/adp/${ENVIRONMENT}/gateway/cognito-client-id")
          # Web CLI login app client. Deliberately NOT in the required-vars
          # loop below: the param appears only after the Terraform that adds
          # the CLI client applies, and deploys before that must not fail —
          # the /auth/cli endpoints 503 cleanly while this is empty.
          COGNITO_CLI_CLIENT_ID=$(get_ssm "/adp/${ENVIRONMENT}/gateway/cognito-cli-client-id" "")
          COGNITO_AGENT_CLIENT_ID=$(get_ssm "/adp/${ENVIRONMENT}/gateway/cognito-agent-client-id" "")
          AGENT_CLIENTS_TABLE=$(get_ssm "/adp/${ENVIRONMENT}/gateway/agent-clients-table" "bedrockgw-${ENVIRONMENT}-agent-clients")
          COGNITO_GITLAB_CLIENT_ID=$(get_ssm "/adp/${ENVIRONMENT}/gitlab/oidc-client-id" "")
          COGNITO_PENTEST_CLIENT_ID=$(get_ssm "/adp/${ENVIRONMENT}/gateway/cognito-pentest-client-id" "")
          COGNITO_DOMAIN=$(get_ssm "/adp/${ENVIRONMENT}/gateway/cognito-domain")
          CF_DOMAIN=$(get_ssm "/adp/${ENVIRONMENT}/gateway/cloudfront-domain")
          # User-facing origin: the custom domain when gateway-infra published one,
          # else the distribution default. Feeds BG_GATEWAY_BASE_URL, which builds
          # the GitHub App Setup URL sent to GitHub and the magic links sent to
          # users — so a stale value leaves the deployment and reverts an
          # org-admin change to the App.
          FRONTEND_URL=$(get_ssm "/adp/${ENVIRONMENT}/gateway/frontend-url")
          [ -n "$FRONTEND_URL" ] || FRONTEND_URL="https://${CF_DOMAIN}"
          # Keep the distribution default in CORS while both hostnames serve the app.
          if [ "$FRONTEND_URL" = "https://${CF_DOMAIN}" ]; then
            CORS_ORIGINS="${FRONTEND_URL},http://localhost:5173"
          else
            CORS_ORIGINS="${FRONTEND_URL},https://${CF_DOMAIN},http://localhost:5173"
          fi
          AGENT_REGISTRY_TABLE=$(get_ssm "/adp/${ENVIRONMENT}/gateway/agent-registry-table")
          CHAT_LOGS_BUCKET=$(get_ssm "/adp/${ENVIRONMENT}/gateway/chat-logs-bucket")
          FRONTEND_BUCKET=$(get_ssm "/adp/${ENVIRONMENT}/gateway/frontend-bucket")

          # #5672: chat-transcript redaction level. This was the literal "basic"
          # substituted below, which silently overrode the application's own default
          # of "standard" in EVERY environment — so customer content pasted into a
          # prompt (names, emails, phone numbers, identity numbers, addresses,
          # payment details) was stored in S3 exactly as typed.
          #
          # Now per-environment and fail-closed: unset means "standard", the
          # strongest level. An environment that genuinely needs something weaker
          # sets the parameter, which leaves a review trail, instead of the choice
          # being a constant buried in a deploy pipeline. The app also resolves an
          # unrecognised value up to "standard" (see src/chat_logging/config.py), so
          # a typo here cannot downgrade redaction either.
          CHAT_LOGGING_SCRUB_LEVEL=$(get_ssm "/adp/${ENVIRONMENT}/gateway/chat-logging-scrub-level" "standard")
          if [ -z "$CHAT_LOGGING_SCRUB_LEVEL" ] || [ "$CHAT_LOGGING_SCRUB_LEVEL" = "None" ]; then
            CHAT_LOGGING_SCRUB_LEVEL="standard"
          fi

          # Fail-fast on missing required SSM params — don't silently render a broken ConfigMap.
          # If any of these are empty, gateway-infra-apply hasn't been run yet.
          # #4342: REDIS_IAM_USERNAME / REDIS_CACHE_NAME are fail-fast on purpose.
          # Rendering them empty is what produced the outage this fixes: ElastiCache
          # has the `default` user disabled, so a ConfigMap without them means every
          # Redis call is rejected and the spend cap silently degrades to "allow".
          # An empty value here means gateway-infra-apply.yml has not published the
          # new params yet — run it first rather than shipping a dead cache.
          for var_name in DB_HOST DB_NAME REDIS_HOST REDIS_IAM_USERNAME REDIS_CACHE_NAME COGNITO_USER_POOL_ID COGNITO_CLIENT_ID COGNITO_DOMAIN CF_DOMAIN; do
            if [ -z "${!var_name}" ]; then
              echo "::error::Required SSM param resolves to empty for ${var_name}." >&2
              echo "::error::Run gateway-infra-apply.yml first so it publishes the missing params." >&2
              exit 1
            fi
          done
          # REDIS_PORT and ENVIRONMENT have safe defaults; fail-fast not required for those.
          [ -z "$REDIS_PORT" ] && REDIS_PORT="6379"

          # Gateway IRSA role ARN — deterministic name from platform EKS module
          GATEWAY_ROLE_ARN=$(aws iam get-role \
            --role-name "adp-${ENVIRONMENT}-role-gateway-service" \
            --query 'Role.Arn' --output text 2>/dev/null || echo "")

          # --- Render and apply ConfigMap (Section 1) ---
          # Issue #1158: Read proxy host allowlist from SSM (or default for dev)
          # #4076: "*.atlassian.net" REMOVED from the default — Atlassian Cloud
          # tenants are self-service, so the wildcard let anyone who registers a
          # tenant receive a user's injected secret. Operators who use Jira must
          # opt in by adding their own tenant host to the SSM param below.
          VAULT_PROXY_HOST_ALLOWLIST=$(get_ssm "/adp/${ENVIRONMENT}/gateway/vault-proxy-host-allowlist" "api.github.com,api.openai.com,api.anthropic.com,api.stripe.com,slack.com")

          # #2082: Knowledge-registry ingestion queue (agent-context SQS). Empty
          # is safe — registry routes still mount; dispatch returns 503 until set.
          INGESTION_QUEUE_URL=$(get_ssm "/adp/${ENVIRONMENT}/agent-context/ingestion-queue-url" "")

          # #4075: Budget enforcement fail mode. Default "closed" (safe-by-default:
          # a failed budget check must not admit uncapped spend). A bounded, alarmed
          # 30s grace window keeps transient DB blips from downing inference.
          # Set to "open" via this SSM param + rollout restart to roll back.
          BUDGET_FAIL_MODE=$(get_ssm "/adp/${ENVIRONMENT}/gateway/budget-fail-mode" "closed")
          if [ -z "$BUDGET_FAIL_MODE" ] || [ "$BUDGET_FAIL_MODE" = "None" ]; then BUDGET_FAIL_MODE="closed"; fi

          # #8848/#4076: Enforce credential destinations by default. Only an
          # explicit "false" opts into temporary shadow mode; reject typos.
          VAULT_ENFORCE_CREDENTIAL_HOST_BINDING=$(get_ssm "/adp/${ENVIRONMENT}/gateway/vault-enforce-credential-host-binding" "true")
          case "$VAULT_ENFORCE_CREDENTIAL_HOST_BINDING" in
            ""|None) VAULT_ENFORCE_CREDENTIAL_HOST_BINDING="true" ;;
            true) ;;
            false) echo "WARNING: Credential destination binding explicitly disabled (shadow mode)" >&2 ;;
            *) echo "ERROR: vault-enforce-credential-host-binding must be true or false" >&2; exit 1 ;;
          esac

          # #5653 (A01): whether the pod may believe X-Caller-Identity, which it
          # treats as proof of identity (resolved against the agent registry to a
          # privileged internal/platform context). This was hard-coded "true"
          # here, which overrode the application's safe default on every deploy
          # and asserted a property nothing had established.
          #
          # The param is published by the api-gateway Terraform module — the same
          # module that blanks the header on every non-AWS_IAM route. So "true"
          # now means "the edge control that makes this claim sound is deployed
          # in this environment", instead of being an unconditional literal.
          # Default "false": an environment without that apply treats a forged
          # assertion as inert rather than authoritative.
          TRUST_APIGW_HEADERS=$(get_ssm "/adp/${ENVIRONMENT}/gateway/trust-apigw-headers" "false")
          if [ -z "$TRUST_APIGW_HEADERS" ] || [ "$TRUST_APIGW_HEADERS" = "None" ]; then TRUST_APIGW_HEADERS="false"; fi

          # Issue #4743: Bedrock routing shadow mode. Observation only — the
          # resolved destination is recorded in usage_logs.bedrock_account_id and
          # changes nothing about where a request goes (enforcement is #4744).
          # Defaults "true" because the captured column is what #4744 is gated on,
          # and with zero mappings the existence gate makes it free. Set the SSM
          # param to "false" + `kubectl rollout restart` to stop observing.
          BEDROCK_ROUTING_SHADOW_MODE=$(get_ssm "/adp/${ENVIRONMENT}/gateway/bedrock-routing-shadow-mode" "true")

          # PMM-03 / D3: production org/team model allowlists. Canonicalize and
          # validate before rendering so malformed policy fails deployment
          # instead of silently widening admission to the platform default.
          PERSONA_MODEL_MAPPING_ENABLED=$(get_ssm "/adp/${ENVIRONMENT}/gateway/persona-model-mapping-enabled" "true")
          MODEL_ALLOWED_MODELS_CONFIG_RAW=$(get_ssm "/adp/${ENVIRONMENT}/gateway/model-allowed-models-config" "__ADP_SSM_UNAVAILABLE__")
          MODEL_ALLOWED_MODELS_CONFIG=$(printf '%s' "$MODEL_ALLOWED_MODELS_CONFIG_RAW" | python3 platform/scripts/validate-model-allowlist-config.py)
          MODEL_ALLOWED_MODELS_CONFIG_SED=${MODEL_ALLOWED_MODELS_CONFIG//\\/\\\\}
          MODEL_ALLOWED_MODELS_CONFIG_SED=${MODEL_ALLOWED_MODELS_CONFIG_SED//&/\\&}
          MODEL_ALLOWED_MODELS_CONFIG_SED=${MODEL_ALLOWED_MODELS_CONFIG_SED//|/\\|}

          SCOPED_KNOWLEDGE_IMPORTS_ENABLED=$(get_ssm "/adp/${ENVIRONMENT}/gateway/scoped-knowledge-imports-enabled" "false")
          [[ "$SCOPED_KNOWLEDGE_IMPORTS_ENABLED" == "true" ]] || SCOPED_KNOWLEDGE_IMPORTS_ENABLED="false"
          # Model invocability probing (#7967): gateway-infra SSM parameters
          # (model-probe.tf, values from the environment's gateway tfvars); same parameters,
          # defaults and validation in gateway-deploy.yml and deploy-all.sh. Absent or
          # malformed values render the fail-closed defaults (off, 0 slots, 0 budget, whole
          # catalogue, 24 h). Delegated chat enforces model policy and refuses every turn
          # without this evidence, so an environment running --chat delegated must arm it.
          MODEL_PROBE_ENABLED=$(get_ssm "/adp/${ENVIRONMENT}/gateway/model-probe-enabled" "false")
          [ "$MODEL_PROBE_ENABLED" = "true" ] || MODEL_PROBE_ENABLED="false"
          MODEL_PROBE_MAX_SLOTS_PER_CYCLE=$(get_ssm "/adp/${ENVIRONMENT}/gateway/model-probe-max-slots-per-cycle" "0")
          [[ "$MODEL_PROBE_MAX_SLOTS_PER_CYCLE" =~ ^[0-9]+$ ]] || MODEL_PROBE_MAX_SLOTS_PER_CYCLE="0"
          MODEL_PROBE_BUDGET_USD_PER_CYCLE=$(get_ssm "/adp/${ENVIRONMENT}/gateway/model-probe-budget-usd-per-cycle" "0")
          [[ "$MODEL_PROBE_BUDGET_USD_PER_CYCLE" =~ ^[0-9]+(\.[0-9]{1,6})?$ ]] || MODEL_PROBE_BUDGET_USD_PER_CYCLE="0"
          MODEL_PROBE_MAX_BUDGET_USD_PER_ATTEMPT=$(get_ssm "/adp/${ENVIRONMENT}/gateway/model-probe-max-budget-usd-per-attempt" "0")
          [[ "$MODEL_PROBE_MAX_BUDGET_USD_PER_ATTEMPT" =~ ^[0-9]+(\.[0-9]{1,6})?$ ]] || MODEL_PROBE_MAX_BUDGET_USD_PER_ATTEMPT="0"
          MODEL_PROBE_MODEL_ALLOWLIST=$(get_ssm "/adp/${ENVIRONMENT}/gateway/model-probe-model-allowlist" "[]")
          # Must be a JSON array of strings; anything else means the whole catalogue ([]).
          MODEL_PROBE_MODEL_ALLOWLIST=$(printf '%s' "$MODEL_PROBE_MODEL_ALLOWLIST" | python3 -c 'import json, sys
          try:
              v = json.loads(sys.stdin.read())
              assert isinstance(v, list) and all(isinstance(x, str) for x in v)
          except Exception:
              v = []
          print(json.dumps(v, separators=(",", ":")))')
          MODEL_PROBE_MODEL_ALLOWLIST_SED=${MODEL_PROBE_MODEL_ALLOWLIST//\\/\\\\}
          MODEL_PROBE_MODEL_ALLOWLIST_SED=${MODEL_PROBE_MODEL_ALLOWLIST_SED//&/\\&}
          MODEL_PROBE_MODEL_ALLOWLIST_SED=${MODEL_PROBE_MODEL_ALLOWLIST_SED//|/\\|}
          MODEL_PROBE_EVIDENCE_TTL_HOURS=$(get_ssm "/adp/${ENVIRONMENT}/gateway/model-probe-evidence-ttl-hours" "24")
          [[ "$MODEL_PROBE_EVIDENCE_TTL_HOURS" =~ ^[0-9]+$ ]] || MODEL_PROBE_EVIDENCE_TTL_HOURS="24"
          # Dev Box (#7998, optional module): /adp/${ENVIRONMENT}/dev-box/* exists only
          # where modules/user-services/dev-box/scripts/deploy-dev-box.sh ran. Absent =>
          # "" / "0": admission disabled, bounds fail closed, no desktop option in the UI.
          BG_DEV_BOX_DEPLOYMENT_ID=$(get_ssm "/adp/${ENVIRONMENT}/dev-box/deployment-id" "")
          [ "$BG_DEV_BOX_DEPLOYMENT_ID" != "None" ] && [ "$BG_DEV_BOX_DEPLOYMENT_ID" != " " ] || BG_DEV_BOX_DEPLOYMENT_ID=""
          BG_DEV_BOX_MAX_DEPLOYMENT_LIVE_BOXES=$(get_ssm "/adp/${ENVIRONMENT}/dev-box/max-deployment-live-boxes" "0")
          [[ "$BG_DEV_BOX_MAX_DEPLOYMENT_LIVE_BOXES" =~ ^[0-9]+$ ]] || BG_DEV_BOX_MAX_DEPLOYMENT_LIVE_BOXES="0"
          BG_DEV_BOX_MAX_DEPLOYMENT_RUNNING_BOXES=$(get_ssm "/adp/${ENVIRONMENT}/dev-box/max-deployment-running-boxes" "0")
          [[ "$BG_DEV_BOX_MAX_DEPLOYMENT_RUNNING_BOXES" =~ ^[0-9]+$ ]] || BG_DEV_BOX_MAX_DEPLOYMENT_RUNNING_BOXES="0"
          BG_DEV_BOX_MAX_DEPLOYMENT_STORAGE_GB=$(get_ssm "/adp/${ENVIRONMENT}/dev-box/max-deployment-storage-gb" "0")
          [[ "$BG_DEV_BOX_MAX_DEPLOYMENT_STORAGE_GB" =~ ^[0-9]+$ ]] || BG_DEV_BOX_MAX_DEPLOYMENT_STORAGE_GB="0"
          BG_DEV_BOX_MAX_DEPLOYMENT_RUNNING_HOURS=$(get_ssm "/adp/${ENVIRONMENT}/dev-box/max-deployment-running-hours" "0")
          [[ "$BG_DEV_BOX_MAX_DEPLOYMENT_RUNNING_HOURS" =~ ^[0-9]+$ ]] || BG_DEV_BOX_MAX_DEPLOYMENT_RUNNING_HOURS="0"
          BG_DEV_BOX_MAX_DEPLOYMENT_BUDGET_USD=$(get_ssm "/adp/${ENVIRONMENT}/dev-box/max-deployment-budget-usd" "0")
          [[ "$BG_DEV_BOX_MAX_DEPLOYMENT_BUDGET_USD" =~ ^[0-9]+(\.[0-9]{1,6})?$ ]] || BG_DEV_BOX_MAX_DEPLOYMENT_BUDGET_USD="0"
          # SSH grant role (#8049): published by the Dev Box foundation when gateway_principal_arn
          # is set. Absent, " " sentinel or malformed => "" and POST /cloud-desktops/{id}/ssh-access
          # keeps failing closed with 503 "Dev Box SSH access is not configured".
          BG_DEV_BOX_SSH_GRANT_ROLE_ARN=$(get_ssm "/adp/${ENVIRONMENT}/dev-box/ssh-grant-role-arn" "")
          [ "$BG_DEV_BOX_SSH_GRANT_ROLE_ARN" != "None" ] && [ "$BG_DEV_BOX_SSH_GRANT_ROLE_ARN" != " " ] || BG_DEV_BOX_SSH_GRANT_ROLE_ARN=""
          [[ "$BG_DEV_BOX_SSH_GRANT_ROLE_ARN" =~ ^arn:aws:iam::[0-9]{12}:role/[A-Za-z0-9_+=,.@/-]+$ ]] || BG_DEV_BOX_SSH_GRANT_ROLE_ARN=""
          BG_DEV_BOX_CREW_BOOTSTRAP=$(get_ssm "/adp/${ENVIRONMENT}/dev-box/crew-bootstrap" "image")
          [[ "$BG_DEV_BOX_CREW_BOOTSTRAP" =~ ^(image|user-data)$ ]] || BG_DEV_BOX_CREW_BOOTSTRAP="image"
          # Model policy posture for chat (#7997): off | advisory | enforced, from gateway infra
          # chief-of-staff-flags.tf (chat_model_policy_posture in the environment's gateway
          # tfvars). Absent or unrecognised renders the default, advisory; same in deploy-all.sh.
          CHAT_MODEL_POLICY_POSTURE=$(get_ssm "/adp/${ENVIRONMENT}/gateway/chat-model-policy-posture" "advisory")
          case "$CHAT_MODEL_POLICY_POSTURE" in off|advisory|enforced) ;; *) CHAT_MODEL_POLICY_POSTURE="advisory" ;; esac

          # Issue #3960: CIDRs the gateway may dial an in-pod control listener in.
          # This is the SSRF allowlist for the one outbound path that deliberately
          # targets PRIVATE addresses, so it cannot be defaulted to something
          # convenient — the default is EMPTY, which fails closed (every control
          # request answers 409 "not configured"). An operator who forgets the SSM
          # param gets a clear misconfiguration instead of a gateway willing to
          # dial arbitrary private addresses.
          #
          # Not discovered from the cluster at deploy time on purpose: reading the
          # live pod CIDR would silently re-widen the allowlist whenever the VPC
          # changed, which is exactly the kind of change nobody reviews.
          AGENT_CONTROL_CLUSTER_POD_CIDRS=$(get_ssm "/adp/${ENVIRONMENT}/gateway/agent-control-cluster-pod-cidrs" "")
          # The authority configuration parameters are encrypted at rest.
          get_authority_ssm() { printf '%s\n' "${ADP_SSM_VALUES[decrypted:$1]-${2:-}}"; }
          AGENT_AUTHORITY_ENABLED=$(get_authority_ssm "/adp/${ENVIRONMENT}/gateway/agent-authority-enabled" "false")
          ADP_WORK_CLAIMS_ENABLED=$(get_authority_ssm "/adp/${ENVIRONMENT}/gateway/work-claims-enabled" "false")
          ADP_PRODUCT_STORY_DISPATCH_ENABLED=$(get_ssm "/adp/${ENVIRONMENT}/gateway/product-story-dispatch-enabled" "false")
          ADP_WORK_CLAIM_PRODUCER_ROLES=$(get_authority_ssm "/adp/${ENVIRONMENT}/gateway/work-claim-producer-roles" "")
          AGENT_AUTHORITY_TABLE=$(get_authority_ssm "/adp/${ENVIRONMENT}/webhook-ingress/agent-authority-table" "adp-${ENVIRONMENT}-agent-authority")
          WEBHOOK_EVENTS_TABLE=$(get_ssm "/adp/${ENVIRONMENT}/webhook-ingress/webhook-events-table" "adp-${ENVIRONMENT}-webhook-events")
          ADP_TOOLS_GATEWAY_ROLE_ARN=$(get_ssm "/adp/${ENVIRONMENT}/tools/target-role-arn" "")
          ADP_TOOLS_FACADE_ROLE_ARN=$(get_ssm "/adp/${ENVIRONMENT}/tools/caller-role-arn" "")
          ADP_TOOLS_ASSERTION_KEY_ARN=$(get_ssm "/adp/${ENVIRONMENT}/tools/assertion-signing-key-arn" "")
          ATLASSIAN_CONFIG_REF=$(get_ssm "/adp/${ENVIRONMENT}/gateway/atlassian-mcp-config-ref" "")
          ATLASSIAN_CONTRACT_REVISION=$(get_ssm "/adp/${ENVIRONMENT}/gateway/atlassian-mcp-contract-revision" "")
          ATLASSIAN_METADATA_SHA256=$(get_ssm "/adp/${ENVIRONMENT}/gateway/atlassian-mcp-metadata-sha256" "")
          if [[ "$ATLASSIAN_CONFIG_REF" != "None" && -n "$ATLASSIAN_CONFIG_REF" ]] &&
             [[ ! "$ATLASSIAN_CONFIG_REF" =~ ^arn:aws:secretsmanager:${AWS_REGION}:${ACCOUNT_ID}:secret:adp/${ENVIRONMENT}/connections/atlassian-mcp/config-[A-Za-z0-9]{6}$ ]]; then
            echo "::error::Invalid Atlassian MCP config reference"; exit 1
          fi
          if [[ "$ATLASSIAN_CONTRACT_REVISION" != "None" && -n "$ATLASSIAN_CONTRACT_REVISION" ]] &&
             [[ ! "$ATLASSIAN_CONTRACT_REVISION" =~ ^[A-Za-z0-9_.-]{1,128}$ ]]; then
            echo "::error::Invalid Atlassian MCP contract revision"; exit 1
          fi
          if [[ "$ATLASSIAN_METADATA_SHA256" != "None" && -n "$ATLASSIAN_METADATA_SHA256" ]] &&
             [[ ! "$ATLASSIAN_METADATA_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Invalid Atlassian MCP metadata digest"; exit 1
          fi
          for name in ATLASSIAN_CONFIG_REF ATLASSIAN_CONTRACT_REVISION ATLASSIAN_METADATA_SHA256; do
            [ "${!name}" != "None" ] || printf -v "$name" '%s' ""
          done
          if [[ -n "$ATLASSIAN_CONTRACT_REVISION" || -n "$ATLASSIAN_METADATA_SHA256" ]] &&
             [[ -z "$ATLASSIAN_CONFIG_REF" || -z "$ATLASSIAN_CONTRACT_REVISION" || -z "$ATLASSIAN_METADATA_SHA256" ]]; then
            echo "::error::Incomplete Atlassian MCP provider plan binding"; exit 1
          fi
          NATIVE_CREDENTIALS_VALUES=$(python3 "modules/gateway/scripts/native-credential-config.py" "$ENVIRONMENT" "$AWS_REGION" "$ACCOUNT_ID")
          read -r ADP_NATIVE_CREDENTIALS_ENABLED ADP_NATIVE_CREDENTIALS_ISSUER ADP_NATIVE_CREDENTIALS_APPROVAL_ORIGIN ADP_NATIVE_CREDENTIALS_KEY_ID ADP_NATIVE_CREDENTIALS_KEY_ARN <<< "$NATIVE_CREDENTIALS_VALUES"
          ADP_TASK_API_ADMISSION_ENABLED=$(get_authority_ssm "/adp/${ENVIRONMENT}/gateway/task-api-admission-enabled" "false")
          ADP_TASK_API_READ_ENABLED=$(get_authority_ssm "/adp/${ENVIRONMENT}/gateway/task-api-read-enabled" "false")
          ADP_TASK_API_WORKER_ENABLED=$(get_authority_ssm "/adp/${ENVIRONMENT}/gateway/task-api-worker-enabled" "false")
          ADP_TASK_API_RECOVERY_ENABLED=$(get_authority_ssm "/adp/${ENVIRONMENT}/gateway/task-api-recovery-enabled" "false")
          TASK_ARTIFACT_BUCKET_NAME=$(get_authority_ssm "/adp/${ENVIRONMENT}/gateway/task-artifact-bucket-name" "")
          # Delegated chat memory/artifact stores (#8028): agent-factory publishes the table
          # names (chat-agent-infra.tf); the bucket is the task-api artifact bucket read above.
          # Validated as names, with the deterministic defaults so a fresh environment is
          # configured before the parameters exist; an invalid bucket renders empty (503
          # chat_artifacts_unconfigured, which the sandbox degrades on rather than fails).
          MEMORY_TABLE=$(get_ssm "/adp/${ENVIRONMENT}/gateway/chat-memory-table" "adp-${ENVIRONMENT}-agent-memory")
          ARTIFACTS_TABLE=$(get_ssm "/adp/${ENVIRONMENT}/gateway/chat-artifacts-table" "adp-${ENVIRONMENT}-chat-artifacts")
          ARTIFACTS_BUCKET="${TASK_ARTIFACT_BUCKET_NAME}"
          [[ "$MEMORY_TABLE" =~ ^[A-Za-z0-9_.-]{3,255}$ ]] && [ "$MEMORY_TABLE" != "None" ] || MEMORY_TABLE="adp-${ENVIRONMENT}-agent-memory"
          [[ "$ARTIFACTS_TABLE" =~ ^[A-Za-z0-9_.-]{3,255}$ ]] && [ "$ARTIFACTS_TABLE" != "None" ] || ARTIFACTS_TABLE="adp-${ENVIRONMENT}-chat-artifacts"
          [[ "$ARTIFACTS_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]] || ARTIFACTS_BUCKET=""
