name: Gateway Deploy

on:
  push:
    paths:
      - 'modules/gateway/src/**'
      - 'modules/gateway/Dockerfile'
      - 'modules/gateway/k8s/**'
      - 'modules/gateway/frontend/**'
      - 'modules/gateway/alembic/versions/**'
      - '.github/workflows/gateway-deploy.yml'
    branches:
      - main
  workflow_dispatch:
    inputs:
      account_id:
        description: 'Target AWS account (12 digits). Empty = use platform IRSA / config file.'
        required: false
        default: ''
      customer_account_id:
        description: 'Customer-linked AWS account to deploy into (cross-account mode). Triggers gateway-call assume.'
        required: false
        default: ''
      customer_aws_label:
        description: 'Vaulted credential label (when customer_account_id is set).'
        required: false
        default: ''
      customer_user_id:
        description: 'ADP users.id UUID (when customer_account_id is set).'
        required: false
        default: ''
      environment:
        description: 'Deployment environment (dev/staging/prod).'
        required: false
        default: 'dev'

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: dev
  NAMESPACE: adp-gateway
  EKS_CLUSTER: adp-dev-eks-cluster
jobs:
  # Detect which parts of the gateway changed so we can skip the unrelated
  # build/deploy job on frontend-only or backend-only pushes. workflow_dispatch
  # always runs both (so humans can force a full redeploy).
  changes:
    name: Detect changes
    runs-on: arc-runner-org
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: filter
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "migrations=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # On push: diff the merge against its parent.
          CHANGED=$(git diff --name-only HEAD^ HEAD)
          echo "Changed files:"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(modules/gateway/src/|modules/gateway/Dockerfile|modules/gateway/k8s/)'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$CHANGED" | grep -qE '^modules/gateway/frontend/'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$CHANGED" | grep -qE '^modules/gateway/alembic/versions/'; then
            echo "migrations=true" >> "$GITHUB_OUTPUT"
            echo "::warning::New Alembic migration detected in this push"
          else
            echo "migrations=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-backend:
    name: Build and Deploy Backend
    runs-on: arc-runner-org
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    # Runner already has AWS creds via IRSA (adp-dev-agent-runner-role)

    steps:
      - uses: actions/checkout@v4

      - name: Load deployment config
        uses: ./.github/actions/load-deploy-config
        with:
          account_id: ${{ inputs.account_id }}
          environment: ${{ inputs.environment }}
          customer_account_id: ${{ inputs.customer_account_id }}
          customer_aws_label: ${{ inputs.customer_aws_label }}
          customer_user_id: ${{ inputs.customer_user_id }}

      - name: Package source and upload to S3
        run: |
          bash platform/scripts/zip-source.sh . /tmp/adp-source.zip
          aws s3 cp /tmp/adp-source.zip "s3://${STATE_BUCKET}/codebuild/adp-source.zip"
          rm -f /tmp/adp-source.zip

      - name: Trigger image build in CodeBuild
        run: |
          EFFECTIVE_ACCOUNT="${CUSTOMER_ACCOUNT_ID:-$ACCOUNT_ID}"
          REGISTRY="${EFFECTIVE_ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          BUILD_ID=$(aws codebuild start-build \
            --project-name adp-${ENVIRONMENT}-gateway-build \
            --environment-variables-override \
              "name=AWS_REGION,value=${AWS_REGION}" \
              "name=ENVIRONMENT,value=${ENVIRONMENT}" \
              "name=ACCOUNT_ID,value=${EFFECTIVE_ACCOUNT}" \
              "name=REGISTRY,value=${REGISTRY}" \
              "name=STATE_BUCKET,value=${STATE_BUCKET}" \
              "name=EKS_CLUSTER,value=${{ env.EKS_CLUSTER }}" \
              "name=IMAGE_TAG,value=${{ github.sha }}" \
            --query 'build.id' --output text)
          echo "Started build: $BUILD_ID"
          while true; do
            STATUS=$(aws codebuild batch-get-builds --ids "$BUILD_ID" \
              --query 'builds[0].buildStatus' --output text)
            case $STATUS in
              SUCCEEDED) echo "Build succeeded"; break ;;
              FAILED|FAULT|STOPPED|TIMED_OUT)
                LOG_LINK=$(aws codebuild batch-get-builds --ids "$BUILD_ID" \
                  --query 'builds[0].logs.deepLink' --output text)
                echo "Build failed ($STATUS). Logs: $LOG_LINK"
                exit 1
                ;;
              *) sleep 10 ;;
            esac
          done
          echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV

      - name: Upload CFN template to S3
        # Issue #562: the AWS connect flow pre-signs a GET URL on this object.
        # It needs to exist in S3 before the gateway pod can build valid Quick-Create
        # URLs. Idempotent — copy-over on every deploy picks up template edits.
        run: |
          BUCKET=$(aws ssm get-parameter \
            --name "/adp/${ENVIRONMENT}/gateway/frontend-bucket" \
            --query "Parameter.Value" --output text)
          aws s3 cp \
            modules/gateway/src/auth/cfn_templates/aws_role_v1.yaml \
            "s3://${BUCKET}/cfn-templates/aws_role_v1.yaml" \
            --content-type application/x-yaml

      # =====================================================================
      # Issue #1008: First-deploy support — ensure namespace, configmap,
      # secret, serviceaccount, and supporting manifests exist before the
      # deployment is applied. On subsequent deploys these are idempotent
      # no-ops (kubectl apply is safe to re-run).
      # =====================================================================

      - name: Ensure namespace and render K8s prerequisites
        run: |
          EFFECTIVE_ACCOUNT="${CUSTOMER_ACCOUNT_ID:-$ACCOUNT_ID}"
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${AWS_REGION}

          # --- Namespace ---
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

          # --- Helper: read SSM param with fallback ---
          get_ssm() { aws ssm get-parameter --name "$1" --query Parameter.Value --output text 2>/dev/null || echo "${2:-}"; }

          # --- Gather values from SSM (published by gateway-infra-apply) ---
          DB_HOST=$(get_ssm "/adp/${ENVIRONMENT}/gateway/rds-host")
          DB_NAME=$(get_ssm "/adp/${ENVIRONMENT}/gateway/rds-database-name")
          DB_USER="bgadmin"
          REDIS_HOST=$(get_ssm "/adp/${ENVIRONMENT}/gateway/redis-host")
          REDIS_PORT=$(get_ssm "/adp/${ENVIRONMENT}/gateway/redis-port")
          COGNITO_USER_POOL_ID=$(get_ssm "/adp/${ENVIRONMENT}/gateway/cognito-user-pool-id")
          COGNITO_CLIENT_ID=$(get_ssm "/adp/${ENVIRONMENT}/gateway/cognito-client-id")
          COGNITO_DOMAIN=$(get_ssm "/adp/${ENVIRONMENT}/gateway/cognito-domain")
          CF_DOMAIN=$(get_ssm "/adp/${ENVIRONMENT}/gateway/cloudfront-domain")
          AGENT_REGISTRY_TABLE=$(get_ssm "/adp/${ENVIRONMENT}/gateway/agent-registry-table")
          CHAT_LOGS_BUCKET=$(get_ssm "/adp/${ENVIRONMENT}/gateway/chat-logs-bucket")
          FRONTEND_BUCKET=$(get_ssm "/adp/${ENVIRONMENT}/gateway/frontend-bucket")

          # Fail-fast on missing required SSM params — don't silently render a broken ConfigMap.
          # If any of these are empty, gateway-infra-apply hasn't been run yet.
          for var_name in DB_HOST DB_NAME REDIS_HOST COGNITO_USER_POOL_ID COGNITO_CLIENT_ID COGNITO_DOMAIN CF_DOMAIN; do
            if [ -z "${!var_name}" ]; then
              echo "::error::Required SSM param resolves to empty for ${var_name}." >&2
              echo "::error::Run gateway-infra-apply.yml first so it publishes the missing params." >&2
              exit 1
            fi
          done
          # REDIS_PORT and ENVIRONMENT have safe defaults; fail-fast not required for those.
          [ -z "$REDIS_PORT" ] && REDIS_PORT="6379"

          # Gateway IRSA role ARN — deterministic name from platform EKS module
          GATEWAY_ROLE_ARN=$(aws iam get-role \
            --role-name "adp-${ENVIRONMENT}-role-gateway-service" \
            --query 'Role.Arn' --output text 2>/dev/null || echo "")

          # --- Render and apply ConfigMap (Section 1) ---
          sed -e "s|__AWS_REGION__|${AWS_REGION}|g" \
              -e "s|__ENVIRONMENT__|${ENVIRONMENT}|g" \
              -e "s|__DB_HOST__|${DB_HOST}|g" \
              -e "s|__DB_USER__|${DB_USER}|g" \
              -e "s|__DB_NAME__|${DB_NAME}|g" \
              -e "s|__REDIS_HOST__|${REDIS_HOST}|g" \
              -e "s|__REDIS_PORT__|${REDIS_PORT}|g" \
              -e "s|__COGNITO_USER_POOL_ID__|${COGNITO_USER_POOL_ID}|g" \
              -e "s|__COGNITO_CLIENT_ID__|${COGNITO_CLIENT_ID}|g" \
              -e "s|__COGNITO_DOMAIN__|${COGNITO_DOMAIN}|g" \
              -e "s|__CORS_ALLOWED_ORIGINS__|https://${CF_DOMAIN},http://localhost:5173|g" \
              -e "s|__GATEWAY_BASE_URL__|https://${CF_DOMAIN}|g" \
              -e "s|__CFN_TEMPLATE_BUCKET__|${FRONTEND_BUCKET}|g" \
              -e "s|__GATEWAY_ROLE_ARN__|${GATEWAY_ROLE_ARN}|g" \
              -e "s|__CHAT_LOGGING_ENABLED__|$([ -n "$CHAT_LOGS_BUCKET" ] && echo true || echo false)|g" \
              -e "s|__CHAT_LOGGING_BUCKET__|${CHAT_LOGS_BUCKET}|g" \
              -e "s|__CHAT_LOGGING_SCRUB_LEVEL__|basic|g" \
              -e "s|__TRUST_APIGW_HEADERS__|true|g" \
              -e "s|__AGENT_REGISTRY_TABLE__|${AGENT_REGISTRY_TABLE}|g" \
              modules/gateway/k8s/configmap.yaml | kubectl apply -f -

          # --- Create K8s Secret from Secrets Manager (Section 2) ---
          # Generate the token secret in Secrets Manager if it doesn't exist yet.
          SM_SECRET_NAME="adp/${ENVIRONMENT}/gateway/token-secret-key"
          TOKEN_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id "$SM_SECRET_NAME" \
            --query SecretString --output text 2>/dev/null || echo "")
          if [ -z "$TOKEN_SECRET" ] || [ "$TOKEN_SECRET" = "None" ]; then
            TOKEN_SECRET=$(openssl rand -hex 32)
            aws secretsmanager create-secret \
              --name "$SM_SECRET_NAME" \
              --secret-string "$TOKEN_SECRET" \
              --description "JWT token signing key for Bedrock Gateway" \
              --region "${AWS_REGION}" 2>/dev/null || \
            aws secretsmanager put-secret-value \
              --secret-id "$SM_SECRET_NAME" \
              --secret-string "$TOKEN_SECRET" \
              --region "${AWS_REGION}"
          fi
          kubectl create secret generic bedrockgateway-secrets \
            --from-literal=token-secret-key="$TOKEN_SECRET" \
            -n ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

          # --- Render and apply ServiceAccount (Section 3) ---
          sed -e "s|__GATEWAY_IRSA_ROLE_ARN__|${GATEWAY_ROLE_ARN}|g" \
              modules/gateway/k8s/serviceaccount.yaml | kubectl apply -f -

          # --- Apply remaining K8s manifests (service, ingress, pdb, etc.) ---
          for f in modules/gateway/k8s/*.yaml; do
            case "$(basename "$f")" in
              configmap.yaml|serviceaccount.yaml|deployment.yaml|targetgroupbinding.yaml) continue ;;
              *) kubectl apply -f "$f" -n ${{ env.NAMESPACE }} ;;
            esac
          done

      - name: Roll out new image
        run: |
          EFFECTIVE_ACCOUNT="${CUSTOMER_ACCOUNT_ID:-$ACCOUNT_ID}"
          REGISTRY="${EFFECTIVE_ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          # Apply the deployment manifest so changes to probes, env,
          # resource limits, volume mounts, etc. actually propagate.
          kubectl apply -f modules/gateway/k8s/deployment.yaml -n ${{ env.NAMESPACE }}

          # Stamp the image tag for this build. The manifest has a generic
          # placeholder; this line pins to the commit SHA for audit.
          kubectl set image deployment/bedrockgateway \
            bedrockgateway=${REGISTRY}/adp-gateway:${{ github.sha }} \
            -n ${{ env.NAMESPACE }}

          kubectl rollout status deployment/bedrockgateway -n ${{ env.NAMESPACE }} --timeout=300s

      - name: Wire ALB to CloudFront (Section 6 — first deploy)
        id: wire_alb
        # On first deploy, the Ingress manifest creates an internal ALB.
        # Discover it and cache to SSM so a subsequent gateway-infra-apply
        # (or the next deploy) can wire it as a CloudFront VPC origin.
        # Non-blocking: if the ALB isn't ready yet, skip gracefully.
        run: |
          # Check if ALB is already wired
          CACHED=$(aws ssm get-parameter \
            --name "/adp/${ENVIRONMENT}/gateway/internal-alb-arn" \
            --query Parameter.Value --output text 2>/dev/null || echo "")
          if [ -n "$CACHED" ] && [ "$CACHED" != "pending" ] && [ "$CACHED" != "None" ]; then
            echo "ALB already wired (${CACHED}). Skipping discovery."
            echo "newly_wired=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Run discovery with a short timeout (2 min instead of 10)
          # If it fails, that's OK — gateway-infra-apply will handle it.
          if timeout 120 bash platform/scripts/wire-gateway-alb.sh; then
            echo "newly_wired=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::ALB not yet active. gateway-infra-apply will discover it on next run."
            echo "newly_wired=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger gateway-infra re-apply (flip enable_vpc_origin=true)
        if: success() && steps.wire_alb.outputs.newly_wired == 'true'
        run: |
          # ALB was just wired this run; gateway-infra needs a re-apply so
          # CloudFront picks up the ALB ARN from SSM and creates the /api/*
          # ordered_cache_behavior (enable_vpc_origin flips from false to true).
          gh workflow run gateway-infra-apply.yml \
            --field customer_account_id="${CUSTOMER_ACCOUNT_ID}" \
            --field customer_aws_label="${CUSTOMER_AWS_LABEL}" \
            --field customer_user_id="${CUSTOMER_USER_ID}" \
            --field environment="${ENVIRONMENT}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUSTOMER_ACCOUNT_ID: ${{ inputs.customer_account_id }}
          CUSTOMER_AWS_LABEL: ${{ inputs.customer_aws_label }}
          CUSTOMER_USER_ID: ${{ inputs.customer_user_id }}
          ENVIRONMENT: ${{ inputs.environment || 'dev' }}

  deploy-frontend:
    name: Build and Deploy Frontend
    runs-on: arc-runner-org
    needs: [changes, deploy-backend]
    # Backend job is optional — run the frontend even when backend is skipped.
    # `always()` lets us bypass the default "cancelled if any dependency was
    # skipped" behavior; we still require the backend success if it did run.
    if: |
      always() &&
      needs.changes.outputs.frontend == 'true' &&
      (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped')

    steps:
      - uses: actions/checkout@v4

      - name: Load deployment config
        uses: ./.github/actions/load-deploy-config
        with:
          account_id: ${{ inputs.account_id }}
          environment: ${{ inputs.environment }}
          customer_account_id: ${{ inputs.customer_account_id }}
          customer_aws_label: ${{ inputs.customer_aws_label }}
          customer_user_id: ${{ inputs.customer_user_id }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'


      - name: Resolve VITE_* env from SSM
        id: vite_env
        run: |
          set -e
          get_ssm() { aws ssm get-parameter --name "$1" --query Parameter.Value --output text 2>/dev/null || echo ""; }

          POOL_ID=$(get_ssm "/adp/${ENVIRONMENT}/gateway/cognito-user-pool-id")
          CLIENT_ID=$(get_ssm "/adp/${ENVIRONMENT}/gateway/cognito-client-id")
          DOMAIN=$(get_ssm "/adp/${ENVIRONMENT}/gateway/cognito-domain")
          BROKER=$(get_ssm "/adp/${ENVIRONMENT}/gateway/github-auth-broker-url")
          WS_URL=$(get_ssm "/adp/${ENVIRONMENT}/gateway/agent-ws-url")

          # Fail-fast: if any required value missing, the build will silently produce a broken bundle.
          for var_name in POOL_ID CLIENT_ID DOMAIN; do
            if [ -z "${!var_name}" ]; then
              echo "::error::Required SSM param for $var_name is empty. Verify gateway-infra-apply ran cleanly." >&2
              exit 1
            fi
          done

          echo "VITE_COGNITO_USER_POOL_ID=$POOL_ID" >> "$GITHUB_OUTPUT"
          echo "VITE_COGNITO_CLIENT_ID=$CLIENT_ID" >> "$GITHUB_OUTPUT"
          echo "VITE_COGNITO_DOMAIN=$DOMAIN" >> "$GITHUB_OUTPUT"
          echo "VITE_GITHUB_AUTH_BROKER_URL=${BROKER}/auth/github" >> "$GITHUB_OUTPUT"
          echo "VITE_AGENT_WS_URL=$WS_URL" >> "$GITHUB_OUTPUT"

      - name: Build frontend
        env:
          VITE_API_URL: /api
          VITE_COGNITO_REGION: us-east-1
          VITE_COGNITO_USER_POOL_ID: ${{ steps.vite_env.outputs.VITE_COGNITO_USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ steps.vite_env.outputs.VITE_COGNITO_CLIENT_ID }}
          VITE_COGNITO_DOMAIN: ${{ steps.vite_env.outputs.VITE_COGNITO_DOMAIN }}
          VITE_GITHUB_AUTH_BROKER_URL: ${{ steps.vite_env.outputs.VITE_GITHUB_AUTH_BROKER_URL }}
          VITE_AGENT_WS_URL: ${{ steps.vite_env.outputs.VITE_AGENT_WS_URL }}
        run: |
          cd modules/gateway/frontend
          npm ci
          npm run build

      - name: Deploy to S3 and invalidate CloudFront
        run: |
          BUCKET=$(aws ssm get-parameter \
            --name "/adp/${ENVIRONMENT}/gateway/frontend-bucket" \
            --query "Parameter.Value" --output text)
          cd modules/gateway/frontend
          # Exclude cfn-templates/ so it isn't wiped by --delete (populated by
          # the backend deploy job per issue #562).
          aws s3 sync dist/ "s3://${BUCKET}/" --delete --exclude "cfn-templates/*"

          DIST_ID=$(aws ssm get-parameter \
            --name "/adp/${ENVIRONMENT}/gateway/cloudfront-id" \
            --query "Parameter.Value" --output text 2>/dev/null) || true
          if [ -n "$DIST_ID" ] && [ "$DIST_ID" != "None" ]; then
            aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
          fi

  run-migrations:
    name: Run Pending Migrations
    needs: [changes, deploy-backend]
    if: |
      always() &&
      needs.changes.outputs.migrations == 'true' &&
      (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped')
    uses: ./.github/workflows/run-gateway-migrations.yml
    with:
      environment: dev
