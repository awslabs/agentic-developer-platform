name: Gateway Deploy

on:
  push:
    paths:
      - 'modules/gateway/src/**'
      - 'modules/gateway/Dockerfile'
      - 'modules/gateway/k8s/**'
      - 'modules/gateway/frontend/**'
      - 'modules/gateway/alembic/versions/**'
      - '.github/workflows/gateway-deploy.yml'
    branches:
      - main
  workflow_dispatch:
    inputs:
      account_id:
        description: 'Target AWS account (12 digits). Empty = use platform IRSA / config file.'
        required: false
        default: ''
      customer_account_id:
        description: 'Customer-linked AWS account to deploy into (cross-account mode). Triggers gateway-call assume.'
        required: false
        default: ''
      customer_aws_label:
        description: 'Vaulted credential label (when customer_account_id is set).'
        required: false
        default: ''
      customer_user_id:
        description: 'ADP users.id UUID (when customer_account_id is set).'
        required: false
        default: ''
      environment:
        description: 'Deployment environment (dev/staging/prod).'
        required: false
        default: 'dev'

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: dev
  NAMESPACE: adp-gateway
  EKS_CLUSTER: adp-dev-eks-cluster
jobs:
  # Detect which parts of the gateway changed so we can skip the unrelated
  # build/deploy job on frontend-only or backend-only pushes. workflow_dispatch
  # always runs both (so humans can force a full redeploy).
  changes:
    name: Detect changes
    runs-on: arc-runner-org
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      migrations: ${{ steps.filter.outputs.migrations }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: filter
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "migrations=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # On push: diff the merge against its parent.
          CHANGED=$(git diff --name-only HEAD^ HEAD)
          echo "Changed files:"
          echo "$CHANGED"

          BACKEND=false
          FRONTEND=false
          MIGRATIONS=false
          if echo "$CHANGED" | grep -qE '^(modules/gateway/src/|modules/gateway/Dockerfile|modules/gateway/k8s/)'; then
            BACKEND=true
          fi
          if echo "$CHANGED" | grep -qE '^modules/gateway/frontend/'; then
            FRONTEND=true
          fi
          if echo "$CHANGED" | grep -qE '^modules/gateway/alembic/versions/'; then
            MIGRATIONS=true
            echo "::warning::New Alembic migration detected in this push"
            # #4123: migration files are baked into the image, and the migrate
            # job execs `alembic upgrade head` inside the running pod (/app). A
            # migration-only push must therefore ALSO rebuild+redeploy the image,
            # or the migrate job runs the OLD in-pod migration files against the
            # DB — which is exactly how #4123's over-long revision id kept failing
            # even after the fix had merged. Force a backend rebuild.
            BACKEND=true
          fi
          echo "backend=$BACKEND" >> "$GITHUB_OUTPUT"
          echo "frontend=$FRONTEND" >> "$GITHUB_OUTPUT"
          echo "migrations=$MIGRATIONS" >> "$GITHUB_OUTPUT"

  deploy-backend:
    name: Build and Deploy Backend
    runs-on: arc-runner-org
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    # Runner already has AWS creds via IRSA (adp-dev-agent-runner-role)
    permissions:
      contents: read
      actions: write  # Required by "Trigger gateway-infra re-apply" step (gh workflow run)

    steps:
      - uses: actions/checkout@v7

      - name: Load deployment config
        uses: ./.github/actions/load-deploy-config
        with:
          account_id: ${{ inputs.account_id }}
          environment: ${{ inputs.environment }}
          customer_account_id: ${{ inputs.customer_account_id }}
          customer_aws_label: ${{ inputs.customer_aws_label }}
          customer_user_id: ${{ inputs.customer_user_id }}

      - name: Compute build vars
        id: vars
        run: |
          EFFECTIVE_ACCOUNT="${CUSTOMER_ACCOUNT_ID:-$ACCOUNT_ID}"
          echo "registry=${EFFECTIVE_ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com" >> "$GITHUB_OUTPUT"
          echo "effective_account=${EFFECTIVE_ACCOUNT}" >> "$GITHUB_OUTPUT"

      - name: Build image via CodeBuild
        uses: ./.github/actions/codebuild-run
        with:
          project_name: adp-${{ env.ENVIRONMENT }}-gateway-build
          region: ${{ env.AWS_REGION }}
          state_bucket: ${{ env.STATE_BUCKET }}
          environment_variables: >-
            "name=AWS_REGION,value=${{ env.AWS_REGION }}"
            "name=ENVIRONMENT,value=${{ env.ENVIRONMENT }}"
            "name=ACCOUNT_ID,value=${{ steps.vars.outputs.effective_account }}"
            "name=REGISTRY,value=${{ steps.vars.outputs.registry }}"
            "name=STATE_BUCKET,value=${{ env.STATE_BUCKET }}"
            "name=EKS_CLUSTER,value=${{ env.EKS_CLUSTER }}"
            "name=IMAGE_TAG,value=${{ github.sha }}"
          poll_interval: '10'

      - name: Export image tag
        run: echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV

      - name: Upload CFN templates to S3
        # Issue #562: the AWS connect flow pre-signs a GET URL on these objects.
        # They need to exist in S3 before the gateway pod can build valid Quick-Create
        # URLs. Idempotent — copy-over on every deploy picks up template edits.
        # Issue #4742: v2 is the routing-capable role (Bedrock invoke, no
        # single-user trust pin); v1 stays for the read-only connect flow.
        run: |
          BUCKET=$(aws ssm get-parameter \
            --name "/adp/${ENVIRONMENT}/gateway/frontend-bucket" \
            --query "Parameter.Value" --output text)
          for v in v1 v2; do
            aws s3 cp \
              "modules/gateway/src/auth/cfn_templates/aws_role_${v}.yaml" \
              "s3://${BUCKET}/cfn-templates/aws_role_${v}.yaml" \
              --content-type application/x-yaml
          done

      # =====================================================================
      # Issue #1008: First-deploy support — ensure namespace, configmap,
      # secret, serviceaccount, and supporting manifests exist before the
      # deployment is applied. On subsequent deploys these are idempotent
      # no-ops (kubectl apply is safe to re-run).
      # =====================================================================

      - name: Ensure namespace and render K8s prerequisites
        run: |
          EFFECTIVE_ACCOUNT="${CUSTOMER_ACCOUNT_ID:-$ACCOUNT_ID}"
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${AWS_REGION}

          # --- Namespace ---
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

          # --- Helper: read SSM param with fallback ---
          get_ssm() { aws ssm get-parameter --name "$1" --query Parameter.Value --output text 2>/dev/null || echo "${2:-}"; }

          # --- Gather values from SSM (published by gateway-infra-apply) ---
          DB_HOST=$(get_ssm "/adp/${ENVIRONMENT}/gateway/rds-host")
          DB_NAME=$(get_ssm "/adp/${ENVIRONMENT}/gateway/rds-database-name")
          DB_USER="bgadmin"
          REDIS_HOST=$(get_ssm "/adp/${ENVIRONMENT}/gateway/redis-host")
          REDIS_PORT=$(get_ssm "/adp/${ENVIRONMENT}/gateway/redis-port")
          # #4342: ElastiCache IAM auth — the app mints a connect token per
          # connection, so it needs the provisioned IAM user name and the
          # replication group id (the token is signed against the group id, not
          # the endpoint host). Published by gateway-infra-apply.
          REDIS_IAM_USERNAME=$(get_ssm "/adp/${ENVIRONMENT}/gateway/redis-iam-username")
          REDIS_CACHE_NAME=$(get_ssm "/adp/${ENVIRONMENT}/gateway/redis-cache-name")
          COGNITO_USER_POOL_ID=$(get_ssm "/adp/${ENVIRONMENT}/gateway/cognito-user-pool-id")
          COGNITO_CLIENT_ID=$(get_ssm "/adp/${ENVIRONMENT}/gateway/cognito-client-id")
          # Web CLI login app client. Deliberately NOT in the required-vars
          # loop below: the param appears only after the Terraform that adds
          # the CLI client applies, and deploys before that must not fail —
          # the /auth/cli endpoints 503 cleanly while this is empty.
          COGNITO_CLI_CLIENT_ID=$(get_ssm "/adp/${ENVIRONMENT}/gateway/cognito-cli-client-id" "")
          COGNITO_DOMAIN=$(get_ssm "/adp/${ENVIRONMENT}/gateway/cognito-domain")
          CF_DOMAIN=$(get_ssm "/adp/${ENVIRONMENT}/gateway/cloudfront-domain")
          # User-facing origin: the custom domain when gateway-infra published one,
          # else the distribution default. Feeds BG_GATEWAY_BASE_URL, which builds
          # the GitHub App Setup URL sent to GitHub and the magic links sent to
          # users — so a stale value leaves the deployment and reverts an
          # org-admin change to the App.
          FRONTEND_URL=$(get_ssm "/adp/${ENVIRONMENT}/gateway/frontend-url")
          [ -n "$FRONTEND_URL" ] || FRONTEND_URL="https://${CF_DOMAIN}"
          # Keep the distribution default in CORS while both hostnames serve the app.
          if [ "$FRONTEND_URL" = "https://${CF_DOMAIN}" ]; then
            CORS_ORIGINS="${FRONTEND_URL},http://localhost:5173"
          else
            CORS_ORIGINS="${FRONTEND_URL},https://${CF_DOMAIN},http://localhost:5173"
          fi
          AGENT_REGISTRY_TABLE=$(get_ssm "/adp/${ENVIRONMENT}/gateway/agent-registry-table")
          CHAT_LOGS_BUCKET=$(get_ssm "/adp/${ENVIRONMENT}/gateway/chat-logs-bucket")
          FRONTEND_BUCKET=$(get_ssm "/adp/${ENVIRONMENT}/gateway/frontend-bucket")

          # Fail-fast on missing required SSM params — don't silently render a broken ConfigMap.
          # If any of these are empty, gateway-infra-apply hasn't been run yet.
          # #4342: REDIS_IAM_USERNAME / REDIS_CACHE_NAME are fail-fast on purpose.
          # Rendering them empty is what produced the outage this fixes: ElastiCache
          # has the `default` user disabled, so a ConfigMap without them means every
          # Redis call is rejected and the spend cap silently degrades to "allow".
          # An empty value here means gateway-infra-apply.yml has not published the
          # new params yet — run it first rather than shipping a dead cache.
          for var_name in DB_HOST DB_NAME REDIS_HOST REDIS_IAM_USERNAME REDIS_CACHE_NAME COGNITO_USER_POOL_ID COGNITO_CLIENT_ID COGNITO_DOMAIN CF_DOMAIN; do
            if [ -z "${!var_name}" ]; then
              echo "::error::Required SSM param resolves to empty for ${var_name}." >&2
              echo "::error::Run gateway-infra-apply.yml first so it publishes the missing params." >&2
              exit 1
            fi
          done
          # REDIS_PORT and ENVIRONMENT have safe defaults; fail-fast not required for those.
          [ -z "$REDIS_PORT" ] && REDIS_PORT="6379"

          # Gateway IRSA role ARN — deterministic name from platform EKS module
          GATEWAY_ROLE_ARN=$(aws iam get-role \
            --role-name "adp-${ENVIRONMENT}-role-gateway-service" \
            --query 'Role.Arn' --output text 2>/dev/null || echo "")

          # --- Render and apply ConfigMap (Section 1) ---
          # Issue #1158: Read proxy host allowlist from SSM (or default for dev)
          # #4076: "*.atlassian.net" REMOVED from the default — Atlassian Cloud
          # tenants are self-service, so the wildcard let anyone who registers a
          # tenant receive a user's injected secret. Operators who use Jira must
          # opt in by adding their own tenant host to the SSM param below.
          VAULT_PROXY_HOST_ALLOWLIST=$(get_ssm "/adp/${ENVIRONMENT}/gateway/vault-proxy-host-allowlist" "api.github.com,api.openai.com,api.anthropic.com,api.stripe.com,slack.com")

          # #2082: Knowledge-registry ingestion queue (agent-context SQS). Empty
          # is safe — registry routes still mount; dispatch returns 503 until set.
          INGESTION_QUEUE_URL=$(get_ssm "/adp/${ENVIRONMENT}/agent-context/ingestion-queue-url" "")

          # #3182/#3477: Credential binding enforcement flag. Default "true" (safe-by-default
          # for fresh clones). Existing deployments pin via SSM param; dev stays in shadow
          # mode via /adp/dev/gateway/enforce-credential-binding=false.
          ENFORCE_CREDENTIAL_BINDING=$(get_ssm "/adp/${ENVIRONMENT}/gateway/enforce-credential-binding" "true")

          # #4075: Budget enforcement fail mode. Default "closed" (safe-by-default:
          # a failed budget check must not admit uncapped spend). A bounded, alarmed
          # 30s grace window keeps transient DB blips from downing inference.
          # Set to "open" via this SSM param + rollout restart to roll back.
          BUDGET_FAIL_MODE=$(get_ssm "/adp/${ENVIRONMENT}/gateway/budget-fail-mode" "closed")
          if [ -z "$BUDGET_FAIL_MODE" ] || [ "$BUDGET_FAIL_MODE" = "None" ]; then BUDGET_FAIL_MODE="closed"; fi

          # #4076: Credential->host egress binding. Default "false" (shadow mode) —
          # violations are WARN-logged but allowed, so operators can confirm the
          # service->host map covers live traffic before anyone gets a 403. Flip to
          # "true" per env via SSM once the WARN logs are clean.
          VAULT_ENFORCE_CREDENTIAL_HOST_BINDING=$(get_ssm "/adp/${ENVIRONMENT}/gateway/vault-enforce-credential-host-binding" "false")

          # Issue #4743: Bedrock routing shadow mode. Observation only — the
          # resolved destination is recorded in usage_logs.bedrock_account_id and
          # changes nothing about where a request goes (enforcement is #4744).
          # Defaults "true" because the captured column is what #4744 is gated on,
          # and with zero mappings the existence gate makes it free. Set the SSM
          # param to "false" + `kubectl rollout restart` to stop observing.
          BEDROCK_ROUTING_SHADOW_MODE=$(get_ssm "/adp/${ENVIRONMENT}/gateway/bedrock-routing-shadow-mode" "true")

          # Issue #4744, wired for #4761 (R7): the environment master switch for
          # routing ENFORCEMENT. Enforcement is an AND of this and the per-org
          # opt-in, so while this is "false" no request anywhere is signed with a
          # destination account's credentials, whatever any org row says. Default
          # "false" — flipping it is a deliberate ops action per environment, taken
          # after that env's shadow-mode evidence looks right. Also the fast
          # rollback lever: set the SSM param + `kubectl rollout restart`, no rebuild.
          BEDROCK_ROUTING_ENFORCE=$(get_ssm "/adp/${ENVIRONMENT}/gateway/bedrock-routing-enforce" "false")

          sed -e "s|__AWS_REGION__|${AWS_REGION}|g" \
              -e "s|__ENVIRONMENT__|${ENVIRONMENT}|g" \
              -e "s|__DB_HOST__|${DB_HOST}|g" \
              -e "s|__DB_USER__|${DB_USER}|g" \
              -e "s|__DB_NAME__|${DB_NAME}|g" \
              -e "s|__REDIS_HOST__|${REDIS_HOST}|g" \
              -e "s|__REDIS_PORT__|${REDIS_PORT}|g" \
              -e "s|__REDIS_IAM_USERNAME__|${REDIS_IAM_USERNAME}|g" \
              -e "s|__REDIS_CACHE_NAME__|${REDIS_CACHE_NAME}|g" \
              -e "s|__REDIS_IAM_AUTH__|true|g" \
              -e "s|__COGNITO_USER_POOL_ID__|${COGNITO_USER_POOL_ID}|g" \
              -e "s|__COGNITO_CLIENT_ID__|${COGNITO_CLIENT_ID}|g" \
              -e "s|__COGNITO_CLI_CLIENT_ID__|${COGNITO_CLI_CLIENT_ID}|g" \
              -e "s|__COGNITO_DOMAIN__|${COGNITO_DOMAIN}|g" \
              -e "s|__CORS_ALLOWED_ORIGINS__|${CORS_ORIGINS}|g" \
              -e "s|__GATEWAY_BASE_URL__|${FRONTEND_URL}|g" \
              -e "s|__CFN_TEMPLATE_BUCKET__|${FRONTEND_BUCKET}|g" \
              -e "s|__GATEWAY_ROLE_ARN__|${GATEWAY_ROLE_ARN}|g" \
              -e "s|__CHAT_LOGGING_ENABLED__|$([ -n "$CHAT_LOGS_BUCKET" ] && echo true || echo false)|g" \
              -e "s|__CHAT_LOGGING_BUCKET__|${CHAT_LOGS_BUCKET}|g" \
              -e "s|__CHAT_LOGGING_SCRUB_LEVEL__|basic|g" \
              -e "s|__TRUST_APIGW_HEADERS__|true|g" \
              -e "s|__AGENT_REGISTRY_TABLE__|${AGENT_REGISTRY_TABLE}|g" \
              -e "s|__VAULT_PROXY_HOST_ALLOWLIST__|${VAULT_PROXY_HOST_ALLOWLIST}|g" \
              -e "s|__INGESTION_QUEUE_URL__|${INGESTION_QUEUE_URL}|g" \
              -e "s|__AGENT_RUN_LOGS_BUCKET__|adp-${ENVIRONMENT}-agent-run-logs-${EFFECTIVE_ACCOUNT}|g" \
              -e "s|__ENFORCE_CREDENTIAL_BINDING__|${ENFORCE_CREDENTIAL_BINDING}|g" \
              -e "s|__BUDGET_FAIL_MODE__|${BUDGET_FAIL_MODE}|g" \
              -e "s|__VAULT_ENFORCE_CREDENTIAL_HOST_BINDING__|${VAULT_ENFORCE_CREDENTIAL_HOST_BINDING}|g" \
              -e "s|__BEDROCK_ROUTING_SHADOW_MODE__|${BEDROCK_ROUTING_SHADOW_MODE}|g" \
              -e "s|__BEDROCK_ROUTING_ENFORCE__|${BEDROCK_ROUTING_ENFORCE}|g" \
              -e "s|__PLATFORM_BEDROCK_ACCOUNT_ID__|${EFFECTIVE_ACCOUNT}|g" \
              modules/gateway/k8s/configmap.yaml | kubectl apply -f -

          # --- Create K8s Secret from Secrets Manager (Section 2) ---
          # Generate the token secret in Secrets Manager if it doesn't exist yet.
          SM_SECRET_NAME="adp/${ENVIRONMENT}/gateway/token-secret-key"
          TOKEN_SECRET=$(aws secretsmanager get-secret-value \
            --secret-id "$SM_SECRET_NAME" \
            --query SecretString --output text 2>/dev/null || echo "")
          if [ -z "$TOKEN_SECRET" ] || [ "$TOKEN_SECRET" = "None" ]; then
            TOKEN_SECRET=$(openssl rand -hex 32)
            aws secretsmanager create-secret \
              --name "$SM_SECRET_NAME" \
              --secret-string "$TOKEN_SECRET" \
              --description "JWT token signing key for Bedrock Gateway" \
              --region "${AWS_REGION}" 2>/dev/null || \
            aws secretsmanager put-secret-value \
              --secret-id "$SM_SECRET_NAME" \
              --secret-string "$TOKEN_SECRET" \
              --region "${AWS_REGION}"
          fi

          # Generate the internal API key for /internal/v1/* shared-secret fallback.
          # TEMPORARY — auth_deps.py:43 prefers IRSA via API GW. This fallback path
          # is what unblocks Phase 1 apply of EPIC #1107 and is removed by Phase 3
          # (#1110) once both clients use SigV4.
          INTERNAL_API_SM_NAME="adp/${ENVIRONMENT}/gateway/internal-api-key"
          INTERNAL_API_KEY=$(aws secretsmanager get-secret-value \
            --secret-id "$INTERNAL_API_SM_NAME" \
            --query SecretString --output text 2>/dev/null || echo "")
          if [ -z "$INTERNAL_API_KEY" ] || [ "$INTERNAL_API_KEY" = "None" ]; then
            INTERNAL_API_KEY=$(openssl rand -hex 32)
            aws secretsmanager create-secret \
              --name "$INTERNAL_API_SM_NAME" \
              --secret-string "$INTERNAL_API_KEY" \
              --description "Shared secret for /internal/v1/* fallback auth (temporary; removed in EPIC #1107 Phase 3)" \
              --region "${AWS_REGION}" 2>/dev/null || \
            aws secretsmanager put-secret-value \
              --secret-id "$INTERNAL_API_SM_NAME" \
              --secret-string "$INTERNAL_API_KEY" \
              --region "${AWS_REGION}"
          fi

          kubectl create secret generic bedrockgateway-secrets \
            --from-literal=token-secret-key="$TOKEN_SECRET" \
            --from-literal=internal-api-key="$INTERNAL_API_KEY" \
            -n ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

          # --- Render and apply ServiceAccount (Section 3) ---
          sed -e "s|__GATEWAY_IRSA_ROLE_ARN__|${GATEWAY_ROLE_ARN}|g" \
              modules/gateway/k8s/serviceaccount.yaml | kubectl apply -f -

          # --- Apply remaining K8s manifests (service, ingress, pdb, etc.) ---
          for f in modules/gateway/k8s/*.yaml; do
            case "$(basename "$f")" in
              configmap.yaml|serviceaccount.yaml|deployment.yaml|targetgroupbinding.yaml) continue ;;
              *) kubectl apply -f "$f" -n ${{ env.NAMESPACE }} ;;
            esac
          done

      - name: Roll out new image
        run: |
          EFFECTIVE_ACCOUNT="${CUSTOMER_ACCOUNT_ID:-$ACCOUNT_ID}"
          REGISTRY="${EFFECTIVE_ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          get_ssm() { aws ssm get-parameter --name "$1" --query Parameter.Value --output text 2>/dev/null || echo "${2:-}"; }

          # Issue #4209 / D-R20: the orchestration graph UI is opt-in PER
          # ENVIRONMENT. deployment.yaml is one file applied to whichever
          # environment this workflow targets, so the value cannot live in it —
          # a literal "true" would arm prod on the next deploy too.
          #
          # Absent parameter => "false". `_is_enabled_strict` only accepts the
          # literal "true", so a missing or malformed value leaves the engine UI
          # invisible rather than guessing.
          FEATURE_ORCHESTRATION_ENGINE_ENABLED=$(get_ssm "/adp/${ENVIRONMENT}/gateway/feature-orchestration-engine" "false")
          if [ -z "$FEATURE_ORCHESTRATION_ENGINE_ENABLED" ] || [ "$FEATURE_ORCHESTRATION_ENGINE_ENABLED" = "None" ]; then
            FEATURE_ORCHESTRATION_ENGINE_ENABLED="false"
          fi
          echo "orchestration graph UI for ${ENVIRONMENT}: ${FEATURE_ORCHESTRATION_ENGINE_ENABLED}"

          # Render then apply, so changes to probes, env, resource limits, volume
          # mounts, etc. actually propagate.
          sed -e "s|__FEATURE_ORCHESTRATION_ENGINE_ENABLED__|${FEATURE_ORCHESTRATION_ENGINE_ENABLED}|g" \
              modules/gateway/k8s/deployment.yaml | kubectl apply -f - -n ${{ env.NAMESPACE }}

          # Stamp the image tag for this build. The manifest has a generic
          # placeholder; this line pins to the commit SHA for audit.
          kubectl set image deployment/bedrockgateway \
            bedrockgateway=${REGISTRY}/adp-gateway:${{ github.sha }} \
            -n ${{ env.NAMESPACE }}

          kubectl rollout status deployment/bedrockgateway -n ${{ env.NAMESPACE }} --timeout=300s

      - name: Wire ALB to CloudFront (Section 6 — first deploy)
        id: wire_alb
        # On first deploy, the Ingress manifest creates an internal ALB.
        # Discover it and cache to SSM so a subsequent gateway-infra-apply
        # (or the next deploy) can wire it as a CloudFront VPC origin.
        # Non-blocking: if the ALB isn't ready yet, skip gracefully.
        run: |
          # Check if ALB is already wired
          CACHED=$(aws ssm get-parameter \
            --name "/adp/${ENVIRONMENT}/gateway/internal-alb-arn" \
            --query Parameter.Value --output text 2>/dev/null || echo "")
          if [ -n "$CACHED" ] && [ "$CACHED" != "pending" ] && [ "$CACHED" != "None" ]; then
            echo "ALB already in SSM (${CACHED}). Skipping discovery."
            # The SSM cache alone is not proof CloudFront was wired: an inline
            # apply can write the ALB params without ever flipping
            # enable_vpc_origin, leaving the distribution with no /api/* origin
            # (Incident A, 608 deploy #3085). Check the distribution itself;
            # if it has no VPC origin, still trigger the infra re-apply.
            DIST_ID=$(aws ssm get-parameter \
              --name "/adp/${ENVIRONMENT}/gateway/cloudfront-id" \
              --query Parameter.Value --output text 2>/dev/null || echo "")
            VPC_ORIGINS="unknown"
            if [ -n "$DIST_ID" ] && [ "$DIST_ID" != "None" ]; then
              VPC_ORIGINS=$(aws cloudfront get-distribution-config --id "$DIST_ID" \
                --query 'length(DistributionConfig.Origins.Items[?VpcOriginConfig])' \
                --output text 2>/dev/null || echo "unknown")
            fi
            NEEDS_APPLY=false
            if [ "$VPC_ORIGINS" = "0" ]; then
              echo "CloudFront ${DIST_ID} has NO VPC origin despite cached ALB — triggering re-apply."
              NEEDS_APPLY=true
            else
              echo "CloudFront VPC origin check: count=${VPC_ORIGINS}. Nothing to wire for CloudFront."
            fi

            # Issue #4010: the cached-edge-ALB path must STILL run internal-plane
            # discovery. This early-exit used to `exit 0` here, which meant that on
            # every established environment the internal-plane ALB was never
            # discovered, its SSM params were never populated, and the API-GW
            # `/internal/{proxy+}` integration was never repointed off the edge ALB.
            # Discovery is cheap and idempotent, so just always run it.
            if timeout 120 bash platform/scripts/wire-gateway-alb.sh; then
              :
            else
              echo "::notice::ALB discovery did not complete; will retry on the next deploy."
            fi

            # If the internal-plane ALB now exists but the live API-GW integration
            # still targets the edge ALB, a gateway-infra re-apply is needed to
            # repoint it. Without this the deny could never be applied (its
            # precondition is the repoint), and the internal plane would stay on
            # the edge ALB indefinitely.
            IP_DNS=$(aws ssm get-parameter \
              --name "/adp/${ENVIRONMENT}/gateway/internal-plane-alb-dns" \
              --query Parameter.Value --output text 2>/dev/null || echo "")
            if [ -n "$IP_DNS" ] && [ "$IP_DNS" != "None" ]; then
              INVOKE_URL=$(aws ssm get-parameter \
                --name "/adp/${ENVIRONMENT}/gateway/apigw-invoke-url" \
                --query Parameter.Value --output text 2>/dev/null || echo "")
              API_ID=$(printf '%s' "$INVOKE_URL" | sed -n 's|^https://\([^.]*\)\..*|\1|p')
              CUR_URI=""
              if [ -n "$API_ID" ]; then
                RES_ID=$(aws apigateway get-resources --rest-api-id "$API_ID" \
                  --query "items[?path=='/internal/{proxy+}'].id" \
                  --output text 2>/dev/null | head -1 || echo "")
                if [ -n "$RES_ID" ] && [ "$RES_ID" != "None" ]; then
                  CUR_URI=$(aws apigateway get-integration --rest-api-id "$API_ID" \
                    --resource-id "$RES_ID" --http-method ANY \
                    --query 'uri' --output text 2>/dev/null || echo "")
                fi
              fi
              case "$CUR_URI" in
                *"$IP_DNS"*)
                  echo "Internal plane (#4010) already repointed at ${IP_DNS}." ;;
                *)
                  echo "Internal-plane ALB exists (${IP_DNS}) but /internal/{proxy+} targets"
                  echo "  '${CUR_URI:-<unresolved>}' — triggering re-apply to repoint it."
                  NEEDS_APPLY=true ;;
              esac
            fi

            echo "newly_wired=${NEEDS_APPLY}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Run discovery with a short timeout (2 min instead of 10)
          # If it fails, that's OK — gateway-infra-apply will handle it.
          if timeout 120 bash platform/scripts/wire-gateway-alb.sh; then
            echo "newly_wired=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::ALB not yet active. gateway-infra-apply will discover it on next run."
            echo "newly_wired=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger gateway-infra re-apply (flip enable_vpc_origin=true)
        if: success() && steps.wire_alb.outputs.newly_wired == 'true'
        run: |
          # ALB was just wired this run; gateway-infra needs a re-apply so
          # CloudFront picks up the ALB ARN from SSM and creates the /api/*
          # ordered_cache_behavior (enable_vpc_origin flips from false to true).
          gh workflow run gateway-infra-apply.yml \
            --field customer_account_id="${CUSTOMER_ACCOUNT_ID}" \
            --field customer_aws_label="${CUSTOMER_AWS_LABEL}" \
            --field customer_user_id="${CUSTOMER_USER_ID}" \
            --field environment="${ENVIRONMENT}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUSTOMER_ACCOUNT_ID: ${{ inputs.customer_account_id }}
          CUSTOMER_AWS_LABEL: ${{ inputs.customer_aws_label }}
          CUSTOMER_USER_ID: ${{ inputs.customer_user_id }}
          ENVIRONMENT: ${{ inputs.environment || 'dev' }}

      # =====================================================================
      # Internal-plane edge deny (Issue #4010) — MUST BE LAST
      # =====================================================================
      # Applies the `/internal` -> 403 rule to the edge ALB, but only once the
      # API-GW `/internal/{proxy+}` integration is confirmed repointed at the
      # internal-plane ALB. The script verifies that against the LIVE integration
      # and skips (exit 0) if it has not landed yet, so this is safe on the first
      # deploy after merge: the deny simply lands on a later run.
      #
      # This is deliberately NOT part of the `k8s/*.yaml` apply loop above.
      # Shipping the deny in `k8s/ingress.yaml` applied it unconditionally on
      # merge, before the repoint, which 403'd every SigV4 internal call (agent
      # provenance writes, credential paths) until a human re-wired by hand.
      # Ordering: repoint first, deny second — never the reverse.
      #
      # Note the re-apply triggered above is asynchronous (`gh workflow run`), so
      # on the run that first discovers the internal ALB the repoint will usually
      # still be in flight and this step will correctly skip.
      - name: Apply internal-plane edge deny (gated)
        if: success()
        run: bash modules/gateway/scripts/apply-internal-plane-deny.sh
        env:
          ENVIRONMENT: ${{ inputs.environment || 'dev' }}
          NAMESPACE: ${{ env.NAMESPACE }}

      # Deploy smoke assertion (Issue #4010): fail loudly if the edge ALB is
      # denying /internal while the API-GW integration still targets that same
      # ALB. That combination is a total internal-plane outage, and it is exactly
      # the state the original implementation of this change could reach.
      - name: Verify internal-plane invariant
        if: success()
        run: bash modules/gateway/scripts/apply-internal-plane-deny.sh --verify
        env:
          ENVIRONMENT: ${{ inputs.environment || 'dev' }}
          NAMESPACE: ${{ env.NAMESPACE }}

  deploy-frontend:
    name: Build and Deploy Frontend
    runs-on: arc-runner-org
    needs: [changes, deploy-backend]
    # Backend job is optional — run the frontend even when backend is skipped.
    # `always()` lets us bypass the default "cancelled if any dependency was
    # skipped" behavior; we still require the backend success if it did run.
    if: |
      always() &&
      needs.changes.outputs.frontend == 'true' &&
      (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped')

    steps:
      - uses: actions/checkout@v7

      - name: Load deployment config
        uses: ./.github/actions/load-deploy-config
        with:
          account_id: ${{ inputs.account_id }}
          environment: ${{ inputs.environment }}
          customer_account_id: ${{ inputs.customer_account_id }}
          customer_aws_label: ${{ inputs.customer_aws_label }}
          customer_user_id: ${{ inputs.customer_user_id }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'


      - name: Resolve VITE_* env from SSM
        id: vite_env
        run: |
          set -e
          get_ssm() { aws ssm get-parameter --name "$1" --query Parameter.Value --output text 2>/dev/null || echo ""; }

          POOL_ID=$(get_ssm "/adp/${ENVIRONMENT}/gateway/cognito-user-pool-id")
          CLIENT_ID=$(get_ssm "/adp/${ENVIRONMENT}/gateway/cognito-client-id")
          DOMAIN=$(get_ssm "/adp/${ENVIRONMENT}/gateway/cognito-domain")
          BROKER=$(get_ssm "/adp/${ENVIRONMENT}/gateway/github-auth-broker-url")
          WS_URL=$(get_ssm "/adp/${ENVIRONMENT}/gateway/agent-ws-url")

          # Fail-fast: if any required value missing, the build will silently produce a broken bundle.
          for var_name in POOL_ID CLIENT_ID DOMAIN; do
            if [ -z "${!var_name}" ]; then
              echo "::error::Required SSM param for $var_name is empty. Verify gateway-infra-apply ran cleanly." >&2
              exit 1
            fi
          done

          echo "VITE_COGNITO_USER_POOL_ID=$POOL_ID" >> "$GITHUB_OUTPUT"
          echo "VITE_COGNITO_CLIENT_ID=$CLIENT_ID" >> "$GITHUB_OUTPUT"
          echo "VITE_COGNITO_DOMAIN=$DOMAIN" >> "$GITHUB_OUTPUT"
          # Terraform already appends /auth/github to the SSM value (per #1011) so the
          # broker URL stored in SSM is .../dev/auth/github. The frontend (auth.ts)
          # then appends /start. Don't append /auth/github here — that produces
          # the doubled path .../auth/github/auth/github/start, breaking login.
          echo "VITE_GITHUB_AUTH_BROKER_URL=${BROKER}" >> "$GITHUB_OUTPUT"
          echo "VITE_AGENT_WS_URL=$WS_URL" >> "$GITHUB_OUTPUT"

      - name: Build frontend
        env:
          VITE_API_URL: /api
          VITE_COGNITO_REGION: us-east-1
          VITE_COGNITO_USER_POOL_ID: ${{ steps.vite_env.outputs.VITE_COGNITO_USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ steps.vite_env.outputs.VITE_COGNITO_CLIENT_ID }}
          VITE_COGNITO_DOMAIN: ${{ steps.vite_env.outputs.VITE_COGNITO_DOMAIN }}
          VITE_GITHUB_AUTH_BROKER_URL: ${{ steps.vite_env.outputs.VITE_GITHUB_AUTH_BROKER_URL }}
          VITE_AGENT_WS_URL: ${{ steps.vite_env.outputs.VITE_AGENT_WS_URL }}
        run: |
          cd modules/gateway/frontend
          npm ci
          npm run build

      - name: Deploy to S3 and invalidate CloudFront
        run: |
          BUCKET=$(aws ssm get-parameter \
            --name "/adp/${ENVIRONMENT}/gateway/frontend-bucket" \
            --query "Parameter.Value" --output text)
          cd modules/gateway/frontend
          # Exclude cfn-templates/ so it isn't wiped by --delete (populated by
          # the backend deploy job per issue #562).
          aws s3 sync dist/ "s3://${BUCKET}/" --delete --exclude "cfn-templates/*"

          DIST_ID=$(aws ssm get-parameter \
            --name "/adp/${ENVIRONMENT}/gateway/cloudfront-id" \
            --query "Parameter.Value" --output text 2>/dev/null) || true
          if [ -n "$DIST_ID" ] && [ "$DIST_ID" != "None" ]; then
            aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
          fi

  run-migrations:
    name: Run Pending Migrations
    needs: [changes, deploy-backend]
    # Issue #2918: Run migrations when new alembic files detected (push) OR on
    # workflow_dispatch (fresh-account deploys need migrations to run unconditionally).
    if: |
      always() &&
      (needs.changes.outputs.migrations == 'true' || github.event_name == 'workflow_dispatch') &&
      (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped')
    uses: ./.github/workflows/run-gateway-migrations.yml
    with:
      environment: ${{ inputs.environment || 'dev' }}
      customer_account_id: ${{ inputs.customer_account_id || '' }}
      customer_aws_label: ${{ inputs.customer_aws_label || '' }}
      customer_user_id: ${{ inputs.customer_user_id || '' }}

  smoke-test:
    name: Post-deploy Smoke Test
    needs: [deploy-backend, deploy-frontend, run-migrations]
    # Issue #3031: Real-token smoke against the deployed gateway.
    # Runs after backend + frontend + migrations are done. Skipped dependencies
    # are fine (e.g. frontend-only push still triggers smoke if backend succeeded
    # in a prior run).
    if: |
      always() &&
      (needs.deploy-backend.result == 'success' || needs.deploy-backend.result == 'skipped') &&
      (needs.deploy-frontend.result == 'success' || needs.deploy-frontend.result == 'skipped') &&
      (needs.run-migrations.result == 'success' || needs.run-migrations.result == 'skipped')
    uses: ./.github/workflows/gateway-smoke.yml
    # Graceful skip: when the smoke token hasn't been captured yet, the workflow
    # exits cleanly (token step exits 0 → subsequent steps skip → job succeeds).
    # Once the token is live and validated, smoke failures WILL fail this run
    # (which is intentional — regressions should block deploys).
    with:
      environment: ${{ inputs.environment || 'dev' }}
      account_id: ${{ inputs.account_id || '' }}
      customer_account_id: ${{ inputs.customer_account_id || '' }}
      customer_aws_label: ${{ inputs.customer_aws_label || '' }}
      customer_user_id: ${{ inputs.customer_user_id || '' }}
