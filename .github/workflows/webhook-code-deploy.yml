name: Webhook Code Deploy
# Unbound: committed manifest and protected-environment role variable are empty.
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: webhook-code-deploy-dev
  cancel-in-progress: false
jobs:
  deploy-code:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on:
      group: adp-deployment
      labels: arc-runner-deployment
    environment: adp-webhook-code-dev
    timeout-minutes: 30
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_MAX_ATTEMPTS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare clean committed source
        shell: bash
        run: python3 platform/automation-infra/prepare-webhook-source.py
      - name: Validate committed admission manifest
        shell: bash
        run: |
          python3 - "$CLEAN_SOURCE" <<'PY'
          import importlib.util, json, pathlib, sys
          root = pathlib.Path(sys.argv[1]) / 'platform/automation-infra'
          spec = importlib.util.spec_from_file_location('driver', root / 'deploy-webhook-code.py')
          driver = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(driver)
          driver.validate_manifest(json.loads((root / 'webhook-code-manifest.json').read_text()))
          PY
      - name: Package only clean committed source
        shell: bash
        run: |
          set -euo pipefail
          cd "$CLEAN_SOURCE/modules/agent-factory/webhook-ingress"
          scripts/package-lambdas.sh
      - name: Establish trusted webhook-code identity
        uses: ./.github/actions/trusted-webhook-code
        with:
          role_arn: ${{ vars.ADP_WEBHOOK_CODE_ROLE_ARN }}
          region: us-east-1
      - name: Deploy exact admitted archives once
        shell: bash
        run: |
          python3 "$CLEAN_SOURCE/platform/automation-infra/deploy-webhook-code.py" \
            --manifest "$CLEAN_SOURCE/platform/automation-infra/webhook-code-manifest.json" \
            --artifacts "$CLEAN_SOURCE/modules/agent-factory/webhook-ingress/dist" \
            --receipt "$RECEIPT"
      - name: Preserve local intent and evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: webhook-code-${{ github.run_id }}
          path: ${{ runner.temp }}/webhook-${{ github.run_id }}/receipt.json
          if-no-files-found: warn
          retention-days: 14
