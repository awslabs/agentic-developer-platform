name: E2E Chat Playwright Regression Suite

on:
  workflow_call:
    inputs:
      modules:
        type: string
        required: false
        default: ''
      cloudfront_url:
        type: string
        required: false
        default: ''
      smoke:
        type: boolean
        required: false
        default: false
      require_interactions:
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      cloudfront_url:
        description: 'CloudFront URL to test against (default: dev)'
        required: false
        default: ''

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: dev
  E2E_CHAT_ENABLED: '1'
  # Resolved from SSM at runtime by the "Resolve dashboard URL" step below, so it
  # cannot drift from the deployed distribution. The workflow_dispatch input still
  # overrides it for one-off runs against another environment.
  E2E_CLOUDFRONT_URL: ''

concurrency:
  group: cli-live-eval-dev
  cancel-in-progress: false

jobs:
  e2e-chat:
    name: Playwright Chat E2E
    environment: adp-browser-checks-dev
    runs-on: arc-runner-org
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}/.github/scripts:${{ github.workspace }}
      REGRESSION_MODULES: ${{ inputs.modules }}
      REGRESSION_KIND: ${{ inputs.modules != '' && 'E2E' || 'all' }}
      REGRESSION_INVENTORY: ${{ github.workspace }}/test-results/chat-inventory.json

    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # This workflow previously hardcoded a distribution domain, and it had drifted
      # from the deployed one — so it was either failing or exercising a different
      # account. It must go through CloudFront rather than the internal ALB, because
      # Playwright drives a browser against the SPA and S3 is only reachable via the
      # distribution (OAC). That is also why runbook 6.1 cannot drop the NAT EIPs
      # from the CloudFront allowlist: this workflow needs them.
      - name: Establish trusted browser checks identity
        uses: ./.github/actions/trusted-checks
        with:
          role_arn: ${{ vars.ADP_CHECKS_ROLE_ARN }}
          region: us-east-1

      - name: Resolve dashboard URL
        env:
          INPUT_CLOUDFRONT_URL: ${{ inputs.cloudfront_url }}
        run: bash .github/scripts/resolve-dashboard-url.sh

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install pytest pytest-html pytest-timeout playwright boto3 requests
          playwright install chromium --with-deps

      - name: Resolve live Chat acceptance mode
        run: |
          set -euo pipefail
          MODE=$(python -m tests.e2e.chat.features)
          [[ "$MODE" == on || "$MODE" == off ]]
          echo "E2E_CHAT_EXPECTED_FLAG=$MODE" >> "$GITHUB_ENV"
          echo "Chat acceptance mode: $MODE. Interaction coverage requires a flag-on deployment." >> "$GITHUB_STEP_SUMMARY"

      - name: Run E2E chat suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results
          ARGS=()
          if [ "$SMOKE_ONLY" = true ]; then
            ARGS+=(-k 'TestLoginRoundTrip or TestSessionRestoration')
          fi
          python -m pytest tests/e2e/chat/ "${ARGS[@]}" -p regression_pytest \
            -v \
            --junitxml=test-results/chat.xml \
            --tb=short \
            --html=test-results/e2e-chat-report.html \
            --self-contained-html \
            --timeout=300 \
            2>&1 | tee test-results/e2e-chat-output.txt
        env:
          SMOKE_ONLY: ${{ inputs.smoke || false }}
          E2E_CHAT_ENABLED: '1'
          E2E_CLOUDFRONT_URL: ${{ env.E2E_CLOUDFRONT_URL }}
          AWS_REGION: us-east-1
          ENVIRONMENT: dev

      - name: Require enabled conversation coverage for regression
        if: ${{ always() && inputs.require_interactions }}
        env:
          CHAT_MODE: ${{ env.E2E_CHAT_EXPECTED_FLAG }}
        run: |
          if [ "$CHAT_MODE" != on ]; then
            echo "::error::Chat interaction coverage is BLOCKED: use an approved target with chat enabled."
            exit 1
          fi

      - name: Verify complete scenario evidence
        if: always()
        run: >-
          python .github/scripts/regression_report.py junit
          --suite chat --junit test-results/chat.xml
          --inventory test-results/chat-inventory.json
          --output test-results/chat-result.json

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-chat-results
          path: |
            test-results/
            /tmp/e2e-chat-*.png
          retention-days: 14

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-chat-screenshots
          path: /tmp/e2e-chat-*.png
          retention-days: 14
