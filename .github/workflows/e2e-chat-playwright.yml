name: E2E Chat Playwright Regression Suite

on:
  push:
    branches: [main]
    paths:
      - 'modules/gateway/frontend/**'
      - 'modules/agent-factory/agent/**'
      - 'modules/agent-factory/lambdas/**'
      - 'tests/e2e/chat/**'
      - '.github/workflows/e2e-chat-playwright.yml'
  schedule:
    # Nightly at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      cloudfront_url:
        description: 'CloudFront URL to test against (default: dev)'
        required: false
        default: 'https://d1g6cal2ts4iis.cloudfront.net'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: dev
  E2E_CHAT_ENABLED: '1'
  # Resolved from SSM at runtime by the "Resolve dashboard URL" step below, so it
  # cannot drift from the deployed distribution. The workflow_dispatch input still
  # overrides it for one-off runs against another environment.
  E2E_CLOUDFRONT_URL: ''

jobs:
  e2e-chat:
    name: Playwright Chat E2E
    runs-on: arc-runner-org
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # This workflow previously hardcoded a distribution domain, and it had drifted
      # from the deployed one — so it was either failing or exercising a different
      # account. It must go through CloudFront rather than the internal ALB, because
      # Playwright drives a browser against the SPA and S3 is only reachable via the
      # distribution (OAC). That is also why runbook 6.1 cannot drop the NAT EIPs
      # from the CloudFront allowlist: this workflow needs them.
      - name: Resolve dashboard URL
        run: |
          set -e
          if [ -n "${{ github.event.inputs.cloudfront_url }}" ]; then
            URL="${{ github.event.inputs.cloudfront_url }}"
            echo "Using dispatch override: $URL"
          else
            DOMAIN=$(aws ssm get-parameter \
              --name "/adp/${ENVIRONMENT}/gateway/frontend-url" \
              --query Parameter.Value --output text 2>/dev/null || echo "")
            if [ -z "$DOMAIN" ]; then
              DOMAIN=$(aws ssm get-parameter \
                --name "/adp/${ENVIRONMENT}/gateway/cloudfront-domain" \
                --query Parameter.Value --output text 2>/dev/null || echo "")
              [ -n "$DOMAIN" ] && DOMAIN="https://${DOMAIN}"
            fi
            if [ -z "$DOMAIN" ]; then
              echo "::error::Could not resolve a dashboard URL from SSM (/adp/${ENVIRONMENT}/gateway/frontend-url or .../cloudfront-domain)."
              exit 1
            fi
            URL="$DOMAIN"
            echo "Resolved from SSM: $URL"
          fi
          echo "E2E_CLOUDFRONT_URL=${URL}" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_E2E_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install pytest pytest-html pytest-timeout playwright boto3 requests
          playwright install chromium --with-deps

      - name: Run E2E chat suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results
          python -m pytest tests/e2e/chat/ \
            -v \
            --tb=short \
            --html=test-results/e2e-chat-report.html \
            --self-contained-html \
            --timeout=300 \
            -x \
            2>&1 | tee test-results/e2e-chat-output.txt
        env:
          E2E_CHAT_ENABLED: '1'
          E2E_CLOUDFRONT_URL: ${{ env.E2E_CLOUDFRONT_URL }}
          AWS_REGION: us-east-1
          ENVIRONMENT: dev

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-chat-results
          path: |
            test-results/
            /tmp/e2e-chat-*.png
          retention-days: 14

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-chat-screenshots
          path: /tmp/e2e-chat-*.png
          retention-days: 14
