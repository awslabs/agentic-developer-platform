name: Tools Interceptor Deploy
run-name: ${{ inputs.adp_correlation && format('ADP deployment {0}', inputs.adp_correlation) || '' }}

on:
  push:
    branches: [main]
    paths:
      - 'modules/tools/interceptor/**'
      - 'modules/tools/deploy.sh'
      - 'modules/tools/orchestrate.sh'
      - '.github/workflows/tools-interceptor-deploy.yml'
  workflow_dispatch:
    inputs:
      adp_correlation:
        description: 'Engine delivery correlation; empty for manual operation.'
        required: false
        type: string
        default: ''
      adp_source_revision:
        description: 'Engine-approved immutable source commit.'
        required: false
        type: string
        default: ''
      adp_definition_revision:
        description: 'Expected workflow definition revision.'
        required: false
        type: string
        default: ''
      rollback_to_version:
        description: 'Manual dispatch only: flip live to this existing numbered Lambda version.'
        required: false
        type: string
        default: ''
      environment:
        description: 'Protected deployment environment.'
        required: false
        type: choice
        options: [dev, staging, prod]
        default: dev

permissions:
  contents: read

concurrency:
  group: tools-release-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

env:
  ADP_DEPLOYMENT_EVIDENCE_STORE: s3-oidc-v1

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: arc-runner-org
    environment: adp-tools-deploy-${{ inputs.environment || 'dev' }}
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Validate rollback request
        env:
          ADP_CORRELATION: ${{ inputs.adp_correlation || '' }}
          ADP_SOURCE: ${{ inputs.adp_source_revision || '' }}
          ADP_DEFINITION: ${{ inputs.adp_definition_revision || '' }}
          ROLLBACK_TO_VERSION: ${{ inputs.rollback_to_version || '' }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          if [[ -n "$ROLLBACK_TO_VERSION" ]]; then
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            [[ "$ROLLBACK_TO_VERSION" =~ ^[1-9][0-9]*$ ]]
            test -z "$ADP_CORRELATION$ADP_SOURCE$ADP_DEFINITION"
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      # The engine dispatches at the pinned, reviewed definition revision while main
      # keeps moving: accept any pin that is an ancestor of main whose copy of this
      # workflow is byte-identical to the running one (the tools-platform rule,
      # #7710), never only the exact workflow_sha.
      - name: Reject mismatched workflow definition before source checkout
        if: inputs.rollback_to_version == ''
        env:
          ADP_CORRELATION: ${{ inputs.adp_correlation || '' }}
          ADP_SOURCE: ${{ inputs.adp_source_revision || '' }}
          ADP_DEFINITION: ${{ inputs.adp_definition_revision || '' }}
          ACTUAL_DEFINITION: ${{ github.workflow_sha }}
          ADP_WORKFLOW_FILE: .github/workflows/tools-interceptor-deploy.yml
        run: bash modules/tools/platform/scripts/guard_dispatch.sh definition
      - name: Check source is an ancestor of reviewed main
        if: inputs.rollback_to_version == ''
        env:
          ADP_SOURCE: ${{ inputs.adp_source_revision || '' }}
        run: bash modules/tools/platform/scripts/guard_dispatch.sh source
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.adp_source_revision || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify reviewed immutable source
        env:
          ADP_SOURCE: ${{ inputs.adp_source_revision || github.sha }}
          ADP_DEFINITION: ${{ github.workflow_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "$ADP_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ADP_DEFINITION" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$ADP_SOURCE"
          # The checkout is credential-less (persist-credentials: false) and
          # fetch-depth 0 already brought every branch, so verify against the
          # local remote-tracking ref instead of fetching again, which fails
          # with "could not read Username" on every run.
          git cat-file -e "${ADP_DEFINITION}^{commit}"
          git merge-base --is-ancestor "$ADP_SOURCE" "refs/remotes/origin/$DEFAULT_BRANCH"
          git merge-base --is-ancestor "$ADP_DEFINITION" "$GITHUB_SHA"
          git show "$ADP_DEFINITION:.github/workflows/tools-interceptor-deploy.yml" | cmp - .github/workflows/tools-interceptor-deploy.yml
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install local validation dependencies
        run: python -m pip install -e modules/tools/interceptor pytest==9.0.3 ruff==0.9.6 PyYAML==6.0.3
      - name: Verify interceptor before release
        run: |
          ruff check modules/tools/interceptor
          python -m pytest -q modules/tools/interceptor/tests
      - name: Establish trusted deployment identity
        uses: ./.github/actions/trusted-deployment
        with:
          role_arn: ${{ vars.ADP_DEPLOY_ROLE_ARN }}
          region: ${{ vars.ADP_DEPLOY_REGION || 'us-east-1' }}
      - name: Load deployment config
        uses: ./.github/actions/load-deploy-config
        with:
          environment: ${{ inputs.environment || 'dev' }}
      - name: Load deployment evidence publisher from workflow revision
        env:
          ADP_WORKFLOW_REVISION: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$ADP_WORKFLOW_REVISION" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${ADP_WORKFLOW_REVISION}^{commit}"
          git merge-base --is-ancestor "$ADP_WORKFLOW_REVISION" "$GITHUB_SHA"
          for file in scripts/publish-deployment-evidence.py deployment_evidence/__init__.py deployment_evidence/store.py; do
            mkdir -p "$RUNNER_TEMP/adp-deployment-evidence/$(dirname "$file")"
            git show "$ADP_WORKFLOW_REVISION:modules/gateway/$file" > "$RUNNER_TEMP/adp-deployment-evidence/$file"
          done
      - name: Record deployment workflow context
        env:
          CONTEXT_REVISION: ${{ github.workflow_sha }}
          CONTEXT_SOURCE: ${{ inputs.adp_source_revision || github.sha }}
          CONTEXT_CORRELATION: ${{ inputs.adp_correlation || '' }}
          CONTEXT_REPOSITORY_ID: ${{ github.repository_id }}
          INPUT_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
          INPUT_ROLLBACK_TO_VERSION: ${{ inputs.rollback_to_version || '' }}
          TOOLS_INTERCEPTOR_FUNCTION_NAME: ${{ vars.ADP_TOOLS_INTERCEPTOR_FUNCTION_NAME }}
        run: python3 modules/tools/interceptor/deployment_context.py
      - name: Publish deployment workflow context
        env:
          ADP_WORKFLOW_REVISION: ${{ github.workflow_sha }}
        run: python3 "$RUNNER_TEMP/adp-deployment-evidence/scripts/publish-deployment-evidence.py" context tools-interceptor-deploy.yml "$RUNNER_TEMP/adp-deployment-context/deployment-context.json"
      - name: Publish verified Lambda version and promote live alias
        env:
          TOOLS_INTERCEPTOR_FUNCTION_NAME: ${{ vars.ADP_TOOLS_INTERCEPTOR_FUNCTION_NAME }}
          ADP_TOOLS_RELEASE_DIR: ${{ runner.temp }}/adp-release-tools-interceptor
          ROLLBACK_TO_VERSION: ${{ inputs.rollback_to_version || '' }}
        run: |
          if [[ -n "$ROLLBACK_TO_VERSION" ]]; then
            timeout 60s bash modules/tools/deploy.sh --interceptor
          else
            bash modules/tools/deploy.sh --interceptor
          fi
      - name: Bind Lambda release to reviewed workflow
        run: python3 modules/tools/interceptor/release_evidence.py
      - name: Publish release receipt
        env:
          ADP_WORKFLOW_REVISION: ${{ github.workflow_sha }}
        run: python3 "$RUNNER_TEMP/adp-deployment-evidence/scripts/publish-deployment-evidence.py" release tools-interceptor "$RUNNER_TEMP/adp-release-tools-interceptor/release.json"
