name: Fix Gateway Infra Drift (one-shot)

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: modules/gateway/infra
  BACKEND_CONFIG: environments/dev/modules/gateway-backend.tfvars
  VAR_FILE: environments/dev/modules/gateway.tfvars
  ENVIRONMENT: dev

jobs:
  fix:
    if: github.ref == 'refs/heads/main'
    environment: adp-deploy-dev
    permissions:
      contents: read
      id-token: write
    runs-on:
      group: adp-deployment
      labels: arc-runner-deployment
    steps:
      - uses: actions/checkout@v7
      - name: Verify source belongs to reviewed main history
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$GITHUB_SHA"
          git merge-base --is-ancestor HEAD FETCH_HEAD

      - name: Establish trusted deployment identity
        uses: ./.github/actions/trusted-deployment
        with:
          role_arn: ${{ vars.ADP_DEPLOY_ROLE_ARN }}
          region: ${{ vars.ADP_DEPLOY_REGION || 'us-east-1' }}

      - name: Install tools
        run: |
          set -euo pipefail
          for tool in aws terraform kubectl helm jq zip unzip curl git python3 node npm; do
            command -v "$tool" >/dev/null || { echo "::error::Reviewed runner image is missing $tool"; exit 1; }
          done
      - name: Delete stuck RDS bootstrap K8s Job
        run: |
          kubectl delete job bedrockgw-dev-rds-bootstrap-c87c06e1 -n adp-gateway --ignore-not-found
          # Also any other stale bootstrap jobs
          kubectl get jobs -n adp-gateway --no-headers 2>/dev/null | awk '$2 != "1/1" {print $1}' | while read job; do
            echo "Deleting incomplete job: $job"
            kubectl delete job "$job" -n adp-gateway --ignore-not-found
          done || true

      - name: Build pyjwt layer (required before any terraform command)
        working-directory: modules/gateway/lambda/layers/pyjwt
        run: |
          chmod +x build.sh
          ./build.sh || echo "build.sh failed — layer may already be built or not needed"
          ls -la

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend-config="../../../${{ env.BACKEND_CONFIG }}" -input=false

      - name: Resolve Cognito pool ID from SSM
        run: |
          POOL_ID=$(aws ssm get-parameter --name "/adp/${ENVIRONMENT}/gateway/cognito-user-pool-id" --query Parameter.Value --output text --region "$AWS_REGION")
          echo "POOL_ID=$POOL_ID" >> "$GITHUB_ENV"
          echo "Cognito Pool ID: $POOL_ID"

      - name: Resolve secret ARNs
        id: arns
        run: |
          USER_ARN=$(aws secretsmanager describe-secret --secret-id adp/dev/gateway/test-user-credentials --region "$AWS_REGION" --query ARN --output text)
          ADMIN_ARN=$(aws secretsmanager describe-secret --secret-id adp/dev/gateway/test-admin-credentials --region "$AWS_REGION" --query ARN --output text)
          echo "user_arn=$USER_ARN" >> "$GITHUB_OUTPUT"
          echo "admin_arn=$ADMIN_ARN" >> "$GITHUB_OUTPUT"
          echo "User ARN:  $USER_ARN"
          echo "Admin ARN: $ADMIN_ARN"

      - name: Import drifted resources
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -e
          try_import() {
            local addr="$1"; local id="$2"
            if terraform state show "$addr" >/dev/null 2>&1; then
              echo "SKIP $addr — already in state"
            else
              echo "IMPORT $addr <- $id"
              terraform import -var-file="../../../${{ env.VAR_FILE }}" "$addr" "$id" || echo "  (import failed: $addr)"
            fi
          }
          try_import 'module.cognito.aws_cognito_user_group.admins' "${POOL_ID}/admins"
          try_import 'module.cognito.aws_cognito_user.test_user[0]'  "${POOL_ID}/adp-test@example.com"
          try_import 'module.cognito.aws_cognito_user.test_admin[0]' "${POOL_ID}/adp-test-admin@example.com"
          try_import 'module.cognito.aws_secretsmanager_secret.test_user_credentials[0]'  '${{ steps.arns.outputs.user_arn }}'
          try_import 'module.cognito.aws_secretsmanager_secret.test_admin_credentials[0]' '${{ steps.arns.outputs.admin_arn }}'

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -var-file="../../../${{ env.VAR_FILE }}" -auto-approve
