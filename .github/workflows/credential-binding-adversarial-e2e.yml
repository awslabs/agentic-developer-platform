name: Credential Binding Adversarial E2E

# Nightly + on-demand adversarial end-to-end tests for the credential-authorization
# binding boundary. Runs live agent(s) in the adp-security-test sandbox tenant with
# injection payloads and asserts the credential boundary held.
#
# Issue: #3181 (S8 / T8 of EPIC #3172)
# Design: docs/design/credential-authorization-binding.md §Testability Layer 2

on:
  schedule:
    # 04:00 UTC daily (off-peak, before gateway-live-tests at 06:00)
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      test_cases:
        description: 'Comma-separated test case IDs to run (default: all)'
        required: false
        default: 'A1,A3'
      expect_red:
        description: 'Expect tests to FAIL (for validation that harness detects boundary removal)'
        required: false
        type: boolean
        default: false
      skip_agent_trigger:
        description: 'Skip agent trigger, only assert against most recent runs (for re-checking evidence)'
        required: false
        type: boolean
        default: false

concurrency:
  group: credential-adversarial-e2e
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  issues: write

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: dev
  SANDBOX_TENANT: adp-security-test
  EVIDENCE_BUCKET_SSM_KEY: /adp/dev/adversarial-tests/evidence-bucket
  GATEWAY_URL_SSM_KEY: /adp/dev/gateway/cloudfront-domain
  WEBHOOK_EVENTS_TABLE: adp-dev-webhook-events
  TEST_REPO: aws-e/adp-security-test-repo
  ATTACKER_USER_ID: attacker-bot
  VICTIM_USER_ID: victim-user

jobs:
  adversarial-e2e:
    name: Adversarial E2E (${{ github.event.inputs.test_cases || 'A1,A3' }})
    runs-on: ${{ vars.ARC_RUNNER_LABEL || 'arc-runner-org' }}
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_E2E_ROLE_ARN || secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install boto3 requests

      - name: Resolve infrastructure endpoints
        id: infra
        run: |
          # Resolve gateway URL
          CF_DOMAIN=$(aws ssm get-parameter --name "$GATEWAY_URL_SSM_KEY" \
            --query Parameter.Value --output text --region us-east-1 2>/dev/null || echo "")
          if [ -z "$CF_DOMAIN" ]; then
            echo "::error::Could not resolve gateway URL from SSM"
            exit 1
          fi
          echo "gateway_url=https://${CF_DOMAIN}" >> "$GITHUB_OUTPUT"

          # Resolve evidence bucket
          EVIDENCE_BUCKET=$(aws ssm get-parameter --name "$EVIDENCE_BUCKET_SSM_KEY" \
            --query Parameter.Value --output text --region us-east-1 2>/dev/null || echo "")
          if [ -z "$EVIDENCE_BUCKET" ]; then
            echo "::warning::Evidence bucket not found in SSM — will use fallback"
            EVIDENCE_BUCKET="adp-dev-adversarial-evidence"
          fi
          echo "evidence_bucket=${EVIDENCE_BUCKET}" >> "$GITHUB_OUTPUT"

          # Resolve internal API key for admin queries — written to GITHUB_ENV
          # (scoped to this job), NOT GITHUB_OUTPUT (which is accessible to actions).
          INTERNAL_KEY=$(aws ssm get-parameter --name /adp/dev/gateway/internal-api-key \
            --with-decryption --query Parameter.Value --output text --region us-east-1 2>/dev/null || echo "")
          if [ -z "$INTERNAL_KEY" ]; then
            echo "::error::Could not resolve internal API key from SSM"
            exit 1
          fi
          echo "::add-mask::${INTERNAL_KEY}"
          echo "INTERNAL_API_KEY=${INTERNAL_KEY}" >> "$GITHUB_ENV"

      - name: Run adversarial E2E assertion script
        id: run_tests
        env:
          GATEWAY_URL: ${{ steps.infra.outputs.gateway_url }}
          EVIDENCE_BUCKET: ${{ steps.infra.outputs.evidence_bucket }}
          # INTERNAL_API_KEY is injected via GITHUB_ENV from the infra step above.
          # It is NOT passed as a CLI argument (visible in /proc/cmdline) nor via
          # GITHUB_OUTPUT (accessible to third-party actions). The Python script
          # reads it from os.environ when --internal-api-key is omitted.
          TEST_CASES: ${{ github.event.inputs.test_cases || 'A1,A3' }}
          EXPECT_RED: ${{ github.event.inputs.expect_red || 'false' }}
          SKIP_AGENT_TRIGGER: ${{ github.event.inputs.skip_agent_trigger || 'false' }}
        run: |
          python3 platform/scripts/adversarial-test-assert.py \
            --test-cases "$TEST_CASES" \
            --gateway-url "$GATEWAY_URL" \
            --evidence-bucket "$EVIDENCE_BUCKET" \
            --sandbox-tenant "$SANDBOX_TENANT" \
            --attacker-user "$ATTACKER_USER_ID" \
            --victim-user "$VICTIM_USER_ID" \
            --webhook-events-table "$WEBHOOK_EVENTS_TABLE" \
            --test-repo "$TEST_REPO" \
            --aws-region "$AWS_REGION" \
            ${{ github.event.inputs.expect_red == 'true' && '--expect-red' || '' }} \
            ${{ github.event.inputs.skip_agent_trigger == 'true' && '--skip-agent-trigger' || '' }} \
            --output-dir test-results/adversarial

      - name: Upload evidence to S3
        if: always()
        run: |
          if [ -d test-results/adversarial ]; then
            DATE=$(date -u +%Y-%m-%d)
            RUN_ID="${{ github.run_id }}"
            aws s3 cp test-results/adversarial/ \
              "s3://${{ steps.infra.outputs.evidence_bucket }}/adversarial-tests/${DATE}/${RUN_ID}/" \
              --recursive --region us-east-1 || echo "::warning::S3 upload failed (bucket may not exist yet)"
          fi

      - name: Upload test results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adversarial-e2e-results
          path: test-results/adversarial/
          retention-days: 90

      - name: Post job summary
        if: always()
        run: |
          echo "## Credential Binding Adversarial E2E — $(date -u +%Y-%m-%d)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Parameter | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Test cases | ${{ github.event.inputs.test_cases || 'A1,A3' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Expect red | ${{ github.event.inputs.expect_red || 'false' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Gateway | ${{ steps.infra.outputs.gateway_url }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Sandbox tenant | $SANDBOX_TENANT |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -f test-results/adversarial/summary.json ]; then
            echo "### Results" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat test-results/adversarial/summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: File issue on failure (nightly only)
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Only file if no open issue with this label already exists
          EXISTING=$(gh issue list --label "adversarial-e2e-failure" --state open --json number --jq length)
          if [ "$EXISTING" = "0" ]; then
            gh issue create \
              --title "🔴 Credential binding adversarial E2E failed ($(date -u +%Y-%m-%d))" \
              --label "adversarial-e2e-failure,security,P1" \
              --body "## Description

          The nightly credential-binding adversarial E2E test failed. This blocks the enforcement flip (S9).

          **Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          **Date:** $(date -u +%Y-%m-%dT%H:%M:%SZ)

          ## Impact analysis
          - Credential boundary may not be holding against adversarial injection attacks
          - Enforcement flip (S9) is BLOCKED until this is green

          ## Next steps
          1. Check the workflow run logs and evidence artifacts
          2. Determine if this is an infra flake or a real boundary failure
          3. If boundary failure: investigate immediately (P1)
          4. If infra flake: fix the harness and re-run manually

          ## Validation
          - Re-run the workflow manually: Actions → Credential Binding Adversarial E2E → Run workflow
          - Or: \`gh workflow run credential-binding-adversarial-e2e.yml\`"
          fi
