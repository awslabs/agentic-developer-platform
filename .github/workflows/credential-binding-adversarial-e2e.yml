name: Credential Binding Adversarial E2E

# Nightly + on-demand adversarial end-to-end tests for the credential-authorization
# binding boundary. Runs live agent(s) in the adp-security-test sandbox tenant with
# injection payloads and asserts the credential boundary held.
#
# Issue: #3181 (S8 / T8 of EPIC #3172)
# Design: docs/design/credential-authorization-binding.md §Testability Layer 2

on:
  workflow_call:
    inputs:
      test_cases:
        type: string
        required: false
        default: A1,A3
      expect_red:
        type: boolean
        required: false
        default: false
      skip_agent_trigger:
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      test_cases:
        description: 'Comma-separated test case IDs to run (default: all)'
        required: false
        default: 'A1,A3'
      expect_red:
        description: 'Expect tests to FAIL (for validation that harness detects boundary removal)'
        required: false
        type: boolean
        default: false
      skip_agent_trigger:
        description: 'Skip agent trigger, only assert against most recent runs (for re-checking evidence)'
        required: false
        type: boolean
        default: false

concurrency:
  group: cli-live-eval-dev
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: dev
  SANDBOX_TENANT: adp-security-test
  EVIDENCE_BUCKET_SSM_KEY: /adp/dev/adversarial-tests/evidence-bucket
  GATEWAY_URL_SSM_KEY: /adp/dev/gateway/apigw-invoke-url
  WEBHOOK_EVENTS_TABLE: adp-dev-webhook-events
  TEST_REPO: aws-e/adp-security-test-repo
  ATTACKER_USER_ID: attacker-bot
  VICTIM_USER_ID: victim-user

jobs:
  adversarial-e2e:
    permissions:
      id-token: write
      contents: read
    if: github.ref == 'refs/heads/main'
    name: Adversarial E2E (${{ inputs.test_cases || 'A1,A3' }})
    runs-on: arc-runner-org
    environment: adp-deploy-dev
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify source belongs to reviewed main history
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$GITHUB_SHA"
          git merge-base --is-ancestor HEAD FETCH_HEAD

      - name: Establish trusted deployment identity
        uses: ./.github/actions/trusted-deployment
        with:
          role_arn: ${{ vars.ADP_DEPLOY_ROLE_ARN }}
          region: ${{ vars.ADP_DEPLOY_REGION || 'us-east-1' }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install boto3 requests

      - name: Resolve infrastructure endpoints
        id: infra
        run: |
          # Resolve gateway URL
          GATEWAY_URL=$(aws ssm get-parameter --name "$GATEWAY_URL_SSM_KEY" \
            --query Parameter.Value --output text --region us-east-1 2>/dev/null || echo "")
          if [ -z "$GATEWAY_URL" ]; then
            echo "::error::Could not resolve gateway URL from SSM"
            exit 1
          fi
          echo "gateway_url=${GATEWAY_URL}" >> "$GITHUB_OUTPUT"

          # Resolve evidence bucket
          EVIDENCE_BUCKET=$(aws ssm get-parameter --name "$EVIDENCE_BUCKET_SSM_KEY" \
            --query Parameter.Value --output text --region us-east-1 2>/dev/null || echo "")
          if [ -z "$EVIDENCE_BUCKET" ]; then
            echo "::warning::Evidence bucket not found in SSM — will use fallback"
            EVIDENCE_BUCKET="adp-dev-adversarial-evidence"
          fi
          echo "evidence_bucket=${EVIDENCE_BUCKET}" >> "$GITHUB_OUTPUT"

      - name: Run adversarial E2E assertion script
        id: run_tests
        env:
          GATEWAY_URL: ${{ steps.infra.outputs.gateway_url }}
          EVIDENCE_BUCKET: ${{ steps.infra.outputs.evidence_bucket }}
          # This job's IAM role needs tenant-scoped internal audit/config capabilities.
          TEST_CASES: ${{ inputs.test_cases || 'A1,A3' }}
          EXPECT_RED: ${{ inputs.expect_red || 'false' }}
          SKIP_AGENT_TRIGGER: ${{ inputs.skip_agent_trigger || 'false' }}
        run: |
          ARGS=()
          [ "$EXPECT_RED" != true ] || ARGS+=(--expect-red)
          [ "$SKIP_AGENT_TRIGGER" != true ] || ARGS+=(--skip-agent-trigger)
          python3 platform/scripts/adversarial-test-assert.py \
            --test-cases "$TEST_CASES" \
            --gateway-url "$GATEWAY_URL" \
            --evidence-bucket "$EVIDENCE_BUCKET" \
            --sandbox-tenant "$SANDBOX_TENANT" \
            --attacker-user "$ATTACKER_USER_ID" \
            --victim-user "$VICTIM_USER_ID" \
            --webhook-events-table "$WEBHOOK_EVENTS_TABLE" \
            --test-repo "$TEST_REPO" \
            --aws-region "$AWS_REGION" \
            "${ARGS[@]}" \
            --output-dir test-results/adversarial

      - name: Upload evidence to S3
        if: always()
        run: |
          if [ -d test-results/adversarial ]; then
            DATE=$(date -u +%Y-%m-%d)
            RUN_ID="${{ github.run_id }}"
            aws s3 cp test-results/adversarial/ \
              "s3://${{ steps.infra.outputs.evidence_bucket }}/adversarial-tests/${DATE}/${RUN_ID}/" \
              --recursive --region us-east-1 || echo "::warning::S3 upload failed (bucket may not exist yet)"
          fi

      - name: Upload test results artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: adversarial-e2e-results
          path: test-results/adversarial/
          retention-days: 90

      - name: Post job summary
        if: always()
        env:
          TEST_CASES: ${{ inputs.test_cases || 'A1,A3' }}
          EXPECT_RED: ${{ inputs.expect_red || 'false' }}
        run: |
          {
            echo "## Credential Binding Adversarial E2E — $(date -u +%Y-%m-%d)"
            echo ""
            echo "| Parameter | Value |"
            echo "|-----------|-------|"
            echo "| Test cases | $TEST_CASES |"
            echo "| Expect red | $EXPECT_RED |"
            echo "| Gateway | ${{ steps.infra.outputs.gateway_url }} |"
            echo "| Sandbox tenant | $SANDBOX_TENANT |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -f test-results/adversarial/summary.json ]; then
            {
              echo "### Results"
              echo '```json'
              cat test-results/adversarial/summary.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
