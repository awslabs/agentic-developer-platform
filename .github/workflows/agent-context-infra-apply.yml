name: Agent Context Infra Apply

on:
  # Manual-only trigger. Merging a PR does NOT auto-apply infra; operator
  # reviews the plan comment on the merged PR, then triggers this workflow
  # explicitly via Actions → Agent Context Infra Apply → Run workflow. See
  # platform-infra-apply.yml for the full rationale. Extra caution here:
  # `graphrag_enabled=true` adds OpenSearch Serverless idle cost, and
  # `neptune_enabled=true` adds Neptune Serverless idle cost (see the cost
  # guard step below for the gate).
  workflow_dispatch:
    inputs:
      terraform_target:
        description: 'Optional Terraform -target (e.g. module.images_build). Leave blank for full apply.'
        required: false
        default: ''
        type: string

concurrency:
  group: tf-apply-agent-context
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_VAR_environment: dev
  MODULE_NAME: agent-context
  TF_WORKING_DIR: modules/agent-context/terraform
  BACKEND_CONFIG: environments/dev/modules/agent-context-backend.tfvars
  VAR_FILE: environments/dev/modules/agent-context.tfvars

jobs:
  apply:
    name: Terraform Apply
    runs-on: arc-runner-org
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install required CLI tools
        run: |
          set -e
          if ! command -v zip >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends zip unzip curl gnupg
          fi
          if ! command -v aws >/dev/null 2>&1; then
            curl -sL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscli.zip
            unzip -q /tmp/awscli.zip -d /tmp
            sudo /tmp/aws/install
            rm -rf /tmp/awscli.zip /tmp/aws
          fi
          if ! command -v terraform >/dev/null 2>&1; then
            curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
            echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" \
              | sudo tee /etc/apt/sources.list.d/hashicorp.list > /dev/null
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends terraform
          fi
          aws --version
          terraform version | head -1

      - name: GraphRAG cost guard
        run: |
          set -e
          TARGET="${{ inputs.terraform_target }}"
          # Skip cost guard when targeting a non-GraphRAG module
          if [ -n "$TARGET" ]; then
            if echo "$TARGET" | grep -qvE '(neptune|opensearch)'; then
              echo "Targeted apply ($TARGET) — does not include GraphRAG resources. Skipping cost guard."
              exit 0
            fi
          fi
          # Check effective graphrag_enabled value (TF_VAR overrides tfvars)
          GRAPHRAG_ENABLED="${TF_VAR_graphrag_enabled:-}"
          if [ -z "$GRAPHRAG_ENABLED" ]; then
            GRAPHRAG_ENABLED=$(grep 'graphrag_enabled' "${{ env.VAR_FILE }}" | sed 's/.*=\s*//' | tr -d ' "' || echo "false")
          fi
          # Check effective neptune_enabled value (TF_VAR overrides tfvars).
          # Neptune is gated separately from OpenSearch/GraphRAG but still costs money,
          # so it shares the same CONFIRM_GRAPHRAG_COST guard.
          NEPTUNE_ENABLED="${TF_VAR_neptune_enabled:-}"
          if [ -z "$NEPTUNE_ENABLED" ]; then
            NEPTUNE_ENABLED=$(grep 'neptune_enabled' "${{ env.VAR_FILE }}" | sed 's/.*=\s*//' | tr -d ' "' || echo "false")
          fi
          echo "graphrag_enabled=$GRAPHRAG_ENABLED neptune_enabled=$NEPTUNE_ENABLED"
          if [ "$GRAPHRAG_ENABLED" = "true" ] || [ "$NEPTUNE_ENABLED" = "true" ]; then
            echo "## :warning: Graph Infrastructure Cost Warning" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            [ "$NEPTUNE_ENABLED" = "true" ] && echo "- **neptune_enabled=true** — Neptune Serverless: ~\$105/month idle" >> "$GITHUB_STEP_SUMMARY"
            [ "$GRAPHRAG_ENABLED" = "true" ] && echo "- **graphrag_enabled=true** — OpenSearch Serverless: ~\$700/month idle" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            # Check for CONFIRM_GRAPHRAG_COST repo variable (covers both Neptune and OpenSearch)
            CONFIRM="${{ vars.CONFIRM_GRAPHRAG_COST }}"
            if [ "$CONFIRM" != "yes" ]; then
              echo "::error::neptune_enabled and/or graphrag_enabled is true but repo variable CONFIRM_GRAPHRAG_COST is not 'yes'."
              echo "Set the repo variable (Settings -> Secrets and variables -> Actions -> Variables -> CONFIRM_GRAPHRAG_COST=yes), OR set the flags false in ${{ env.VAR_FILE }}."
              exit 1
            fi
            echo "CONFIRM_GRAPHRAG_COST=yes confirmed. Proceeding with graph infrastructure." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend-config="../../../${{ env.BACKEND_CONFIG }}" -input=false

      - name: Terraform Plan (destroy-safety check)
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -e
          set -o pipefail
          TARGET="${{ inputs.terraform_target }}"
          TARGET_FLAG=""
          if [ -n "$TARGET" ]; then
            TARGET_FLAG="-target=$TARGET"
            echo "Targeted plan: $TARGET_FLAG"
          fi
          EXIT_CODE=0
          terraform plan -var-file="../../../${{ env.VAR_FILE }}" $TARGET_FLAG -out=tfplan -detailed-exitcode -no-color 2>&1 | tee /tmp/plan-output.txt || EXIT_CODE=$?
          echo "detailed_exitcode=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          if [ "$EXIT_CODE" -eq 1 ]; then
            echo "::error::Terraform plan failed."
            exit 1
          fi

      - name: Destroy-safety label gate
        if: steps.plan.outputs.detailed_exitcode == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          DESTROYS=$(grep -c 'will be destroyed' /tmp/plan-output.txt || echo "0")
          if [ "$DESTROYS" -gt 0 ]; then
            echo "Plan includes $DESTROYS resource(s) to destroy."
            COMMIT_SHA="${{ github.sha }}"
            PR_NUMBER=$(gh pr list --state merged --search "$COMMIT_SHA" --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
            if [ -z "$PR_NUMBER" ]; then
              echo "::error::This apply would destroy $DESTROYS resource(s) but no associated PR was found. Cannot verify destructive-apply-approved label. Re-run via workflow_dispatch after adding the label to the source PR."
              exit 1
            fi
            echo "Associated PR: #$PR_NUMBER"
            HAS_LABEL=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name' 2>/dev/null | grep -c 'destructive-apply-approved' || echo "0")
            if [ "$HAS_LABEL" -eq 0 ]; then
              echo "::error::This apply would destroy $DESTROYS resource(s). The PR #$PR_NUMBER does NOT have the 'destructive-apply-approved' label. Add the label to PR #$PR_NUMBER and re-run this workflow."
              echo ""
              echo "Resources to be destroyed:"
              grep 'will be destroyed' /tmp/plan-output.txt || true
              exit 1
            fi
            echo "PR #$PR_NUMBER has 'destructive-apply-approved' label. Proceeding."
          else
            echo "No destroys in plan. Proceeding."
          fi

      - name: Terraform Apply
        id: apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply tfplan

      - name: Summary
        if: always()
        run: |
          echo "## Terraform Apply -- ${{ env.MODULE_NAME }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Module**: ${{ env.MODULE_NAME }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status**: ${{ steps.apply.outcome == 'success' && 'applied' || 'failed' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Working dir**: ${{ env.TF_WORKING_DIR }}" >> "$GITHUB_STEP_SUMMARY"
