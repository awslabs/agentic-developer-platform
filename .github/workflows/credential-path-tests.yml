name: Credential Path Tests

on:
  pull_request:
    paths:
      # Gateway credential source
      - 'modules/gateway/src/internal/credential_routes.py'
      - 'modules/gateway/src/internal/assume_role_routes.py'
      - 'modules/gateway/src/orchestration/execution_policy.py'
      - 'modules/gateway/src/orchestration/runtime_policy.py'
      - 'modules/gateway/src/orchestration/user_credentials.py'
      - 'modules/gateway/src/agentauth/broker_identity.py'
      - 'modules/gateway/src/internal/task_credentials.py'
      # #5223: mediated GitHub operations. A credential path even though no
      # credential reaches the worker — that IS the change, and the checks that
      # replace the token live in these files.
      - 'modules/gateway/src/agentauth/github_operations.py'
      - 'modules/gateway/src/agentauth/github_operation_service.py'
      - 'modules/gateway/src/agentauth/github_operation_routes.py'
      - 'modules/gateway/src/agentauth/github_provider.py'
      # Gateway credential tests
      - 'modules/gateway/tests/orchestration/test_user_credential_authority.py'
      - 'modules/gateway/tests/internal/test_vault_worker_compatibility.py'
      - 'modules/gateway/tests/internal/test_credential_routes.py'
      - 'modules/gateway/tests/internal/test_credential_authorization_binding.py'
      - 'modules/gateway/tests/internal/test_assume_role_routes.py'
      - 'modules/gateway/tests/auth/test_internal_credential_routes.py'
      - 'modules/agent-factory/docker/github-token-refresher/**'
      # Agent worker credential source
      - 'modules/agent-factory/agent-worker-image/adp_cred/**'
      - 'modules/agent-factory/agent-worker-image/adp_trigger/transport_identity.py'
      - 'modules/agent-factory/agent-worker-image/entrypoint.py'
      - 'modules/agent-factory/agent-worker-image/lib/correlation_marker.py'
      - 'modules/agent-factory/agent-worker-image/lib/gateway_credential_client.py'
      - 'modules/agent-factory/agent-worker-image/lib/mediated_github.py'
      # The agent's mediated instructions. Listed here because
      # test_mediated_github_wiring.py READS this TypeScript file and compares it
      # against the helper's real exports — a rename on either side is only caught
      # if editing either side runs this job.
      - 'modules/agent-factory/agent/src/mediated-github-config.ts'
      # Issue #5120: the `gh` shim decides what reaches GitHub from a pod. It once
      # rewrote ordinary comment bodies to carry an `adp-dispatch:<persona>` marker,
      # which the webhook's bot-sender gate accepts as deliberate dispatch
      # authority — so prose that merely NAMED a persona started an agent run. That
      # is the same defect class as #2149, reintroduced through a different path,
      # which is why the guard is gated here next to the marker surface it protects
      # rather than left to run only on a developer's laptop.
      - 'modules/agent-factory/agent-worker-image/gh-wrapper'
      # Agent worker credential tests
      - 'modules/agent-factory/agent-worker-image/tests/test_adp_cred.py'
      - 'modules/agent-factory/agent-worker-image/tests/test_transport_identity.py'
      - 'modules/agent-factory/agent-worker-image/tests/test_adp_cred_assume.py'
      - 'modules/agent-factory/agent-worker-image/tests/test_gateway_credential_client.py'
      - 'modules/agent-factory/agent-worker-image/tests/test_correlation_marker.py'
      - 'modules/agent-factory/agent-worker-image/tests/test_mediated_github.py'
      - 'modules/agent-factory/agent-worker-image/tests/test_mediated_github_wiring.py'
      - 'modules/agent-factory/agent-worker-image/tests/test_gh_wrapper.py'
      # Webhook ingress credential source
      - 'modules/agent-factory/webhook-ingress/lambda/common/spawn_persona.py'
      - 'modules/agent-factory/webhook-ingress/lambda/common/webhook_events.py'
      - 'modules/agent-factory/webhook-ingress/lambda/common/marker_parse.py'
      # This workflow
      - '.github/workflows/credential-path-tests.yml'
      # Documentation-only changes do not start this workflow.
      - '!docs/**'
      - '!**/docs/**'
      - '!**/README*'
      - '!**/CHANGELOG*'
      - '!**/CONTRIBUTING*'
      - '!**/*.rst'
    branches:
      - main

concurrency:
  group: credential-path-tests-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  token-refresher-tests:
    name: Token Refresher Tests
    runs-on: arc-runner-org
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Exercise isolated token-refresher entrypoint
        run: python -m unittest discover -s modules/agent-factory/docker/github-token-refresher/tests -v

  gateway-credential-tests:
    name: Gateway Credential Tests
    runs-on: arc-runner-org
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: modules/gateway/pyproject.toml

      - name: Install dependencies
        working-directory: modules/gateway
        run: pip install -e ".[dev]"

      - name: Run credential-path tests
        working-directory: modules/gateway
        run: |
          pytest \
            tests/orchestration/test_user_credential_authority.py \
            tests/internal/test_vault_worker_compatibility.py \
            tests/internal/test_task_credentials.py \
            tests/internal/test_credential_routes.py \
            tests/internal/test_credential_authorization_binding.py \
            tests/internal/test_assume_role_routes.py \
            tests/auth/test_internal_credential_routes.py \
            tests/agentauth/test_github_operations.py \
            tests/agentauth/test_github_operation_service.py \
            tests/agentauth/test_github_operation_routes.py \
            tests/agentauth/test_github_provider.py \
            -v --tb=short --timeout=60

  worker-credential-tests:
    name: Worker Credential Tests
    runs-on: arc-runner-org
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      # PyJWT and requests are needed to COLLECT test_mediated_github_wiring.py:
      # it imports the real entrypoint.py, which imports lib/github_token.py
      # (jwt) and lib/check_run.py (requests). Pins match the worker Dockerfile
      # so the tested import graph is the shipped one.
      - name: Install dependencies
        run: pip install pytest pytest-timeout 'boto3>=1.34' 'PyJWT[crypto]>=2.9' 'requests>=2.31'

      - name: Run credential-path tests
        working-directory: modules/agent-factory/agent-worker-image
        run: |
          pytest \
            tests/test_adp_cred.py \
            tests/test_transport_identity.py \
            tests/test_adp_cred_assume.py \
            tests/test_gateway_credential_client.py \
            tests/test_correlation_marker.py \
            tests/test_mediated_github.py \
            tests/test_mediated_github_wiring.py \
            tests/test_gh_wrapper.py \
            -v --tb=short --timeout=60
