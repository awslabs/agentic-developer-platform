name: Credential Path Tests

on:
  pull_request:
    paths:
      # Gateway credential source
      - 'modules/gateway/src/internal/credential_routes.py'
      - 'modules/gateway/src/internal/assume_role_routes.py'
      # Gateway credential tests
      - 'modules/gateway/tests/internal/test_credential_routes.py'
      - 'modules/gateway/tests/internal/test_credential_authorization_binding.py'
      - 'modules/gateway/tests/internal/test_assume_role_routes.py'
      - 'modules/gateway/tests/auth/test_internal_credential_routes.py'
      # Agent worker credential source
      - 'modules/agent-factory/agent-worker-image/adp_cred/**'
      - 'modules/agent-factory/agent-worker-image/entrypoint.py'
      - 'modules/agent-factory/agent-worker-image/lib/correlation_marker.py'
      - 'modules/agent-factory/agent-worker-image/lib/gateway_credential_client.py'
      # Agent worker credential tests
      - 'modules/agent-factory/agent-worker-image/tests/test_adp_cred.py'
      - 'modules/agent-factory/agent-worker-image/tests/test_adp_cred_assume.py'
      - 'modules/agent-factory/agent-worker-image/tests/test_gateway_credential_client.py'
      - 'modules/agent-factory/agent-worker-image/tests/test_correlation_marker.py'
      # Webhook ingress credential source
      - 'modules/agent-factory/webhook-ingress/lambda/common/spawn_persona.py'
      - 'modules/agent-factory/webhook-ingress/lambda/common/webhook_events.py'
      - 'modules/agent-factory/webhook-ingress/lambda/common/marker_parse.py'
      # This workflow
      - '.github/workflows/credential-path-tests.yml'
    branches:
      - main

concurrency:
  group: credential-path-tests-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  gateway-credential-tests:
    name: Gateway Credential Tests
    runs-on: arc-runner-org
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: modules/gateway/pyproject.toml

      - name: Install dependencies
        working-directory: modules/gateway
        run: pip install -e ".[dev]"

      - name: Run credential-path tests
        working-directory: modules/gateway
        run: |
          pytest \
            tests/internal/test_credential_routes.py \
            tests/internal/test_credential_authorization_binding.py \
            tests/internal/test_assume_role_routes.py \
            tests/auth/test_internal_credential_routes.py \
            -v --tb=short --timeout=60

  worker-credential-tests:
    name: Worker Credential Tests
    runs-on: arc-runner-org
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install pytest pytest-timeout 'boto3>=1.34'

      - name: Run credential-path tests
        working-directory: modules/agent-factory/agent-worker-image
        run: |
          pytest \
            tests/test_adp_cred.py \
            tests/test_adp_cred_assume.py \
            tests/test_gateway_credential_client.py \
            tests/test_correlation_marker.py \
            -v --tb=short --timeout=60
