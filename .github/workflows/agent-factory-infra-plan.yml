name: Agent Factory Infra Plan

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'modules/agent-factory/infra/**'
      - 'environments/dev/modules/agent-factory-backend.tfvars'
      # This workflow itself, and the build script the plan now depends on.
      # Without these, a PR that changes how the plan runs cannot exercise the
      # plan — which is how two bugs survived here (a missing build step and a
      # missing `set -o pipefail` that masked it). Every other workflow in this
      # repo already lists itself; this one was the outlier. The build script is
      # listed for the same reason: it produces the bundle chat-agent-infra.tf
      # reads at plan time, so breaking it breaks the plan, and the plan must be
      # able to say so.
      - '.github/workflows/agent-factory-infra-plan.yml'
      - 'platform/scripts/build-agent-factory-lambdas.sh'
      # Documentation-only changes do not start this workflow.
      - '!docs/**'
      - '!**/docs/**'
      - '!**/README*'
      - '!**/CHANGELOG*'
      - '!**/CONTRIBUTING*'
      - '!**/*.rst'
    branches:
      - main

env:
  AWS_REGION: us-east-1
  TF_VAR_environment: dev
  MODULE_NAME: agent-factory
  TF_WORKING_DIR: modules/agent-factory/infra
  BACKEND_CONFIG: environments/dev/modules/agent-factory-backend.tfvars
  VAR_FILE: modules/agent-factory/infra/terraform.tfvars

jobs:
  plan:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch')
    name: Terraform Plan
    environment: adp-deploy-dev
    runs-on: arc-runner-org
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - name: Verify source belongs to reviewed main history
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$GITHUB_SHA"
          git merge-base --is-ancestor HEAD FETCH_HEAD

      - name: Establish trusted deployment identity
        uses: ./.github/actions/trusted-deployment
        with:
          role_arn: ${{ vars.ADP_DEPLOY_ROLE_ARN }}
          region: ${{ vars.ADP_DEPLOY_REGION || 'us-east-1' }}

      - name: Install required CLI tools
        run: |
          set -euo pipefail
          for tool in aws terraform kubectl helm jq zip unzip curl git python3 node npm; do
            command -v "$tool" >/dev/null || { echo "::error::Reviewed runner image is missing $tool"; exit 1; }
          done
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Build actual Lambda inputs before planning
        run: bash platform/scripts/build-agent-factory-lambdas.sh

      # Build the Lambda bundles BEFORE planning. chat-agent-infra.tf reads
      # .build/session-sweeper/index.js through `file()`, which Terraform
      # evaluates at plan time — so without this step the plan cannot even build
      # its graph and dies with "Invalid function argument ... no file exists at
      # ./.build/session-sweeper/index.js". agent-factory-infra-apply.yml has
      # always run this; the plan workflow never did, which is the entire reason
      # the plan has been failing. Keep the two in step: anything the apply needs
      # in order to evaluate the configuration, the plan needs too, or the plan
      # stops predicting what the apply will do.
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build factory Lambda packages
        run: bash platform/scripts/build-agent-factory-lambdas.sh

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          # The committed backend tfvars keeps a literal ACCOUNT_ID placeholder
          # so the repo stays portable; without a bucket override, init targets
          # "adp-terraform-state-ACCOUNT_ID" and fails with NoSuchBucket (this
          # plan has failed on every agent-factory PR). Resolve the real bucket
          # at runtime and override, mirroring agent-factory-infra-apply.yml.
          STATE_BUCKET="adp-terraform-state-$(aws sts get-caller-identity --query Account --output text)"
          echo "Using Terraform state bucket: ${STATE_BUCKET}"
          terraform init \
            -backend-config="../../../${{ env.BACKEND_CONFIG }}" \
            -backend-config="bucket=${STATE_BUCKET}" \
            -input=false

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -e
          # pipefail is load-bearing, not boilerplate. `terraform plan | tee`
          # makes tee the last command in the pipeline, and `set -e` only inspects
          # the last command's status — so without pipefail a FAILING plan exits 0
          # and this step reports success. That is how the "Invalid function
          # argument" failure above went unnoticed: five consecutive runs across
          # different branches all errored and all reported green, so every
          # agent-factory Terraform change was merging with no plan validation at
          # all. agent-factory-infra-apply.yml already sets this; the plan
          # workflow did not.
          set -o pipefail
          terraform plan -var-file="terraform.tfvars" -out=tfplan -no-color 2>&1 | tee /tmp/plan-output.txt

      - name: Post or update PR comment
        uses: actions/github-script@v9
        if: always() && github.event_name == 'pull_request'
        env:
          PLAN_OUTPUT: ${{ steps.plan.outcome }}
        with:
          script: |
            const fs = require('fs');
            const marker = `<!-- tf-plan:${{ env.MODULE_NAME }} -->`;
            let planText = '';
            try {
              planText = fs.readFileSync('/tmp/plan-output.txt', 'utf8');
            } catch (e) {
              planText = 'Plan output not available.';
            }
            if (planText.length > 60000) {
              planText = planText.substring(0, 60000) + '\n\n... (truncated)';
            }
            const status = process.env.PLAN_OUTPUT === 'success' ? ':white_check_mark:' : ':x:';
            const body = `${marker}\n${status} **Terraform Plan — \`${{ env.MODULE_NAME }}\`**\n\n<details>\n<summary>Plan output</summary>\n\n\`\`\`\n${planText}\n\`\`\`\n\n</details>\n\n*Updated: ${new Date().toISOString()} | Run: [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Summary
        if: always()
        run: |
          echo "## Terraform Plan -- ${{ env.MODULE_NAME }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Module**: ${{ env.MODULE_NAME }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status**: ${{ steps.plan.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Working dir**: ${{ env.TF_WORKING_DIR }}" >> "$GITHUB_STEP_SUMMARY"

  validate-pr-config:
    name: Terraform PR Configuration
    if: github.event_name == 'pull_request'
    runs-on: arc-runner-org
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.2
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Build actual Lambda inputs before validation
        run: bash platform/scripts/build-agent-factory-lambdas.sh
      - name: Validate without state or deployment credentials
        working-directory: modules/agent-factory/infra
        run: |
          terraform init -backend=false -input=false
          terraform validate -no-color
