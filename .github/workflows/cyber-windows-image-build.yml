name: Cyber Windows Image Build

# Builds a CAPE-ready Windows 11 qcow2 image via Packer on an ephemeral
# build host (c8i.4xlarge with nested virtualization).
#
# Architecture (SSM-independent):
#   1. Upload build inputs to S3
#   2. Terraform creates build host
#   3. User-data installs packages, downloads inputs from S3, runs build
#   4. Workflow polls S3 for output artifact (no SSM send-command needed)
#   5. Register on CAPE host via SSM (CAPE host SSM is stable)
#   6. Terraform destroys build host
#
# Based on the proven Linux pipeline from #250.

on:
  push:
    branches: [main]
    paths:
      - 'modules/domain-apps/cyber/image-builder/windows/**'
      - '.github/workflows/cyber-windows-image-build.yml'
  schedule:
    - cron: '0 2 * * 0'   # Sundays 02:00 UTC
  workflow_dispatch: {}

# Only one build at a time — prevents concurrent runs from terminating each other's instances
concurrency:
  group: cyber-windows-image-build
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: dev
  ASSETS_BUCKET: adp-dev-cape-assets
  CAPE_HOST_ID: i-04f5473548c751cd3
  TF_DIR: modules/domain-apps/cyber/image-builder

jobs:
  build:
    name: Build Windows 11 CAPE Image
    runs-on: ${{ vars.ARC_RUNNER_LABEL || 'arc-runner-org' }}
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Load deployment config
        uses: ./.github/actions/load-deploy-config

      # ── 0. Install CLI tools on ARC runner ─────────────────────────────
      - name: Install AWS CLI + Terraform
        run: |
          set -e
          if ! command -v aws >/dev/null 2>&1; then
            curl -sL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscli.zip
            unzip -q /tmp/awscli.zip -d /tmp
            sudo /tmp/aws/install
            rm -rf /tmp/awscli.zip /tmp/aws
          fi
          if ! command -v terraform >/dev/null 2>&1; then
            curl -sL "https://releases.hashicorp.com/terraform/1.7.5/terraform_1.7.5_linux_amd64.zip" -o /tmp/tf.zip
            unzip -q /tmp/tf.zip -d /usr/local/bin/
            rm -f /tmp/tf.zip
          fi
          aws --version
          terraform --version

      # ── 1. Upload build inputs to S3 FIRST ────────────────────────────
      # Must happen before Terraform so user-data can download them.
      - name: Stage build inputs
        run: |
          BUILD_DATE=$(date -u +%Y-%m-%d)
          echo "BUILD_DATE=$BUILD_DATE" >> "$GITHUB_ENV"

          # Clean up any stale failure markers from previous runs
          echo "Cleaning stale failure markers..."
          aws s3 rm "s3://${{ env.ASSETS_BUCKET }}/windows-build-inputs/" \
            --recursive --exclude "*" --include "BUILD_FAILED_*" \
            --region "${AWS_REGION}" || true

          aws s3 sync modules/domain-apps/cyber/image-builder/windows/packer/ \
            "s3://${{ env.ASSETS_BUCKET }}/windows-build-inputs/packer/" --region "${AWS_REGION}"
          aws s3 sync modules/domain-apps/cyber/image-builder/windows/answer_files/ \
            "s3://${{ env.ASSETS_BUCKET }}/windows-build-inputs/answer_files/" --region "${AWS_REGION}"
          aws s3 sync modules/domain-apps/cyber/image-builder/windows/scripts/ \
            "s3://${{ env.ASSETS_BUCKET }}/windows-build-inputs/scripts/" --region "${AWS_REGION}"
          aws s3 cp modules/domain-apps/cyber/image-builder/windows/build-pipeline.sh \
            "s3://${{ env.ASSETS_BUCKET }}/windows-build-inputs/build-pipeline.sh" --region "${AWS_REGION}"
          echo "Build inputs staged to S3."

      # ── 2. Spin up build host ──────────────────────────────────────────
      # User-data will automatically download inputs from S3 and start the build.
      - name: Terraform apply (build host ON)
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=${ENVIRONMENT}/cyber/image-builder/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="dynamodb_table=adp-terraform-locks" \
            -input=false

          terraform apply -auto-approve -lock-timeout=120s \
            -var="build_host_enabled=true" \
            -var="account_id=${ACCOUNT_ID}" \
            -var="idle_period_seconds=21600"

      # ── 3. Poll S3 for build output ────────────────────────────────────
      # The build host runs autonomously (user-data -> build-pipeline.sh).
      # We just wait for the qcow2 to appear in S3.
      - name: Wait for build output in S3
        run: |
          BUILD_DATE=$(date -u +%Y-%m-%d)
          TARGET="s3://${{ env.ASSETS_BUCKET }}/win11-cape-${BUILD_DATE}.qcow2"
          echo "Waiting for: $TARGET"
          echo "Expected build time: 60-90 minutes"

          # Also check for a failure marker
          FAIL_MARKER="s3://${{ env.ASSETS_BUCKET }}/windows-build-inputs/BUILD_FAILED_${BUILD_DATE}"

          # Wait up to 96 minutes (384 iterations * 15s)
          for i in $(seq 1 384); do
            # Check for success (qcow2 exists)
            if aws s3 ls "$TARGET" --region "${AWS_REGION}" 2>/dev/null | grep -q "qcow2"; then
              SIZE=$(aws s3api head-object --bucket "${{ env.ASSETS_BUCKET }}" \
                --key "win11-cape-${BUILD_DATE}.qcow2" --region "${AWS_REGION}" \
                --query 'ContentLength' --output text 2>/dev/null || echo "0")
              echo "Build complete! qcow2 size: $SIZE bytes"
              if (( SIZE > 1000000000 )); then
                echo "Size looks valid (> 1GB). Build succeeded."
                break
              fi
              echo "Size too small, build may still be uploading..."
            fi

            # Check for failure marker
            if aws s3 ls "$FAIL_MARKER" --region "${AWS_REGION}" 2>/dev/null | grep -q "BUILD_FAILED"; then
              echo "ERROR: Build failed on the build host."
              aws s3 cp "$FAIL_MARKER" - --region "${AWS_REGION}" 2>/dev/null || true
              exit 1
            fi

            if (( i % 12 == 0 )); then
              echo "  Still building... ($((i * 15 / 60)) min elapsed)"
            fi
            sleep 15
          done

          # Final check
          if ! aws s3 ls "$TARGET" --region "${AWS_REGION}" 2>/dev/null | grep -q "qcow2"; then
            echo "ERROR: Build timed out after 96 minutes. No qcow2 in S3."
            exit 1
          fi

      # ── 4. Verify qcow2 in S3 ─────────────────────────────────────────
      - name: Verify output
        run: |
          BUILD_DATE=$(date -u +%Y-%m-%d)

          # Check dated image exists and size
          SIZE=$(aws s3api head-object --bucket "${{ env.ASSETS_BUCKET }}" \
            --key "win11-cape-${BUILD_DATE}.qcow2" --region "${AWS_REGION}" \
            --query 'ContentLength' --output text)
          echo "Dated qcow2 size: $SIZE bytes"

          if (( SIZE < 6000000000 )); then
            echo "ERROR: qcow2 too small (< 6GB). Build may have failed."
            exit 1
          fi

          # Check latest pointer
          aws s3 ls "s3://${{ env.ASSETS_BUCKET }}/win11-cape-latest.qcow2" \
            --region "${AWS_REGION}" || echo "WARNING: Latest pointer not updated"

          echo "Build artifact verified in S3."

      # ── 5. Register on CAPE host ───────────────────────────────────────
      - name: Register VM on CAPE host
        run: |
          BUILD_DATE=$(date -u +%Y-%m-%d)
          aws s3 cp modules/domain-apps/cyber/image-builder/windows/register-cape-vm.sh \
            "s3://${{ env.ASSETS_BUCKET }}/windows-build-inputs/register-cape-vm.sh" \
            --region "${AWS_REGION}"

          REG_CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ env.CAPE_HOST_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"aws s3 cp s3://${{ env.ASSETS_BUCKET }}/windows-build-inputs/register-cape-vm.sh /tmp/register-cape-vm.sh --region ${AWS_REGION} && chmod +x /tmp/register-cape-vm.sh && sudo bash /tmp/register-cape-vm.sh ${BUILD_DATE}\"]" \
            --timeout-seconds 600 \
            --region "${AWS_REGION}" \
            --query 'Command.CommandId' --output text)
          echo "Registration command: $REG_CMD_ID"

          for i in $(seq 1 40); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$REG_CMD_ID" \
              --instance-id "${{ env.CAPE_HOST_ID }}" \
              --region "${AWS_REGION}" \
              --query 'Status' --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Success) echo "Registration complete"; break ;;
              Failed|TimedOut|Cancelled)
                echo "Registration failed: $STATUS"
                aws ssm get-command-invocation \
                  --command-id "$REG_CMD_ID" \
                  --instance-id "${{ env.CAPE_HOST_ID }}" \
                  --region "${AWS_REGION}" \
                  --query 'StandardErrorContent' --output text || true
                exit 1
                ;;
              *) sleep 15 ;;
            esac
          done

      # ── 6. Tear down build host ────────────────────────────────────────
      - name: Terraform apply (build host OFF)
        if: always()
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=${ENVIRONMENT}/cyber/image-builder/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="dynamodb_table=adp-terraform-locks" \
            -input=false
          terraform apply -auto-approve -lock-timeout=120s \
            -var="build_host_enabled=false" \
            -var="account_id=${ACCOUNT_ID}" \
            -var="idle_period_seconds=21600"

      # ── 7. Summary ─────────────────────────────────────────────────────
      - name: Summary
        if: success()
        run: |
          BUILD_DATE=$(date -u +%Y-%m-%d)
          echo "## Windows 11 CAPE Image Build" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Date**: ${BUILD_DATE}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image**: s3://${{ env.ASSETS_BUCKET }}/win11-cape-${BUILD_DATE}.qcow2" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Latest**: s3://${{ env.ASSETS_BUCKET }}/win11-cape-latest.qcow2" >> "$GITHUB_STEP_SUMMARY"
          echo "- **CAPE Host**: ${{ env.CAPE_HOST_ID }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **VM Name**: win11-cape-${BUILD_DATE}" >> "$GITHUB_STEP_SUMMARY"
