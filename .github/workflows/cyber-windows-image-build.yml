name: Cyber Windows Image Build
'on':
  push:
    branches:
    - main
    paths:
    - modules/domain-apps/cyber/image-builder/windows/**
    - .github/workflows/cyber-windows-image-build.yml
    - modules/domain-apps/cyber/ci/cyber-windows-image-build/**
  schedule:
  - cron: 0 2 * * 0
  workflow_dispatch: {}
concurrency:
  group: cyber-windows-image-build
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    name: Build Windows 11 CAPE Image
    runs-on:
      group: adp-deployment
      labels: arc-runner-deployment
    environment: adp-deploy-dev
    timeout-minutes: 120
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/checkout@v7
    - name: Verify source belongs to reviewed main history
      shell: bash
      run: |
        set -euo pipefail
        git fetch --no-tags origin "$GITHUB_SHA"
        git merge-base --is-ancestor HEAD FETCH_HEAD
    - name: Establish trusted deployment identity
      uses: ./.github/actions/trusted-deployment
      with:
        role_arn: ${{ vars.ADP_DEPLOY_ROLE_ARN }}
        region: ${{ vars.ADP_DEPLOY_REGION || 'us-east-1' }}
        duration_seconds: 10800
    - name: Run cyber app automation
      uses: ./modules/domain-apps/cyber/ci/cyber-windows-image-build
