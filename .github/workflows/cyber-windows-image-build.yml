name: Cyber Windows Image Build
'on':
  push:
    branches:
    - main
    paths:
    - modules/domain-apps/cyber/image-builder/windows/**
    - .github/workflows/cyber-windows-image-build.yml
    - modules/domain-apps/cyber/ci/cyber-windows-image-build/**
  schedule:
  - cron: 0 2 * * 0
  workflow_dispatch: {}
concurrency:
  group: cyber-windows-image-build
  cancel-in-progress: false
jobs:
  build:
    name: Build Windows 11 CAPE Image
    runs-on: ${{ vars.ARC_RUNNER_LABEL || 'arc-runner-org' }}
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
    - name: Run cyber app automation
      uses: ./modules/domain-apps/cyber/ci/cyber-windows-image-build
