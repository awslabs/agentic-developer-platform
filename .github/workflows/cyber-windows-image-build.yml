name: Cyber Windows Image Build

# Builds a CAPE-ready Windows 11 qcow2 image via Packer on an ephemeral
# build host (c8i.4xlarge with nested virtualization).
#
# Pipeline: vendor StefanScherer/packer-windows template -> build host via SSM
# -> Packer (QEMU/KVM) -> qcow2 upload to S3 -> register on CAPE host.
#
# Based on the proven Linux pipeline from #250.

on:
  push:
    branches: [main]
    paths:
      - 'modules/domain-apps/cyber/image-builder/windows/**'
      - '.github/workflows/cyber-windows-image-build.yml'
  schedule:
    - cron: '0 2 * * 0'   # Sundays 02:00 UTC
  workflow_dispatch: {}

# Only one build at a time — prevents concurrent runs from terminating each other's instances
concurrency:
  group: cyber-windows-image-build
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: dev
  ACCOUNT_ID: "879318057152"
  STATE_BUCKET: adp-terraform-state-879318057152
  ASSETS_BUCKET: adp-dev-cape-assets
  CAPE_HOST_ID: i-04f5473548c751cd3
  TF_DIR: modules/domain-apps/cyber/image-builder

jobs:
  build:
    name: Build Windows 11 CAPE Image
    runs-on: ${{ vars.ARC_RUNNER_LABEL || 'arc-runner-org' }}
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # ── 0. Install CLI tools on ARC runner ─────────────────────────────
      - name: Install AWS CLI + Terraform
        run: |
          set -e
          if ! command -v aws >/dev/null 2>&1; then
            curl -sL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscli.zip
            unzip -q /tmp/awscli.zip -d /tmp
            sudo /tmp/aws/install
            rm -rf /tmp/awscli.zip /tmp/aws
          fi
          if ! command -v terraform >/dev/null 2>&1; then
            curl -sL "https://releases.hashicorp.com/terraform/1.7.5/terraform_1.7.5_linux_amd64.zip" -o /tmp/tf.zip
            unzip -q /tmp/tf.zip -d /usr/local/bin/
            rm -f /tmp/tf.zip
          fi
          aws --version
          terraform --version

      # ── 1. Spin up build host ──────────────────────────────────────────
      - name: Terraform apply (build host ON)
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ env.STATE_BUCKET }}" \
            -backend-config="key=${{ env.ENVIRONMENT }}/cyber/image-builder/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="dynamodb_table=adp-terraform-locks" \
            -input=false

          terraform apply -auto-approve -lock-timeout=120s \
            -var="build_host_enabled=true" \
            -var="account_id=${{ env.ACCOUNT_ID }}" \
            -var="idle_period_seconds=21600"

      # ── 2. Wait for SSM agent ──────────────────────────────────────────
      - name: Wait for build host SSM
        run: |
          INSTANCE_ID=$(cd ${{ env.TF_DIR }} && terraform output -raw builder_instance_id 2>/dev/null || echo "")
          if [[ -z "$INSTANCE_ID" ]]; then
            echo "ERROR: Could not get instance ID from terraform output"
            exit 1
          fi
          echo "INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_ENV"

          echo "Waiting for SSM agent on $INSTANCE_ID..."
          for i in $(seq 1 60); do
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text --region "${{ env.AWS_REGION }}" 2>/dev/null || echo "None")
            if [[ "$STATUS" == "Online" ]]; then
              echo "SSM agent online after $((i*10))s"
              break
            fi
            sleep 10
          done

          if [[ "$STATUS" != "Online" ]]; then
            echo "ERROR: SSM agent not online after 10 minutes"
            exit 1
          fi

          # After PingStatus=Online, the SSM command plane may still reject
          # send-command with InvalidInstanceId for several minutes (observed up
          # to ~8 min on c8i.4xlarge with heavy user-data). User-data may also
          # restart the SSM agent during package installs, causing transient
          # acceptance followed by Undeliverable/InvalidInstanceId.
          #
          # Strategy: probe with a trivial command and wait for it to COMPLETE
          # (not just be accepted). This proves the agent is fully operational.
          echo "Probing SSM command-plane readiness (up to 12 min)..."
          SSM_READY=false
          for probe in $(seq 1 48); do
            # Try to send a trivial command
            if PROBE_OUT=$(aws ssm send-command \
                --instance-ids "$INSTANCE_ID" \
                --document-name "AWS-RunShellScript" \
                --parameters 'commands=["echo ssm-ready"]' \
                --timeout-seconds 30 \
                --region "${{ env.AWS_REGION }}" \
                --query 'Command.CommandId' --output text 2>&1); then
              # send-command accepted — now verify it actually executes
              sleep 5
              PROBE_STATUS=$(aws ssm get-command-invocation \
                --command-id "$PROBE_OUT" --instance-id "$INSTANCE_ID" \
                --region "${{ env.AWS_REGION }}" \
                --query 'Status' --output text 2>/dev/null || echo "Pending")
              if [[ "$PROBE_STATUS" == "Success" ]]; then
                echo "SSM fully ready after $((probe*15))s (probe command completed)"
                SSM_READY=true
                break
              elif [[ "$PROBE_STATUS" == "InProgress" ]]; then
                # Command is running — agent is alive, wait for it
                sleep 10
                PROBE_STATUS=$(aws ssm get-command-invocation \
                  --command-id "$PROBE_OUT" --instance-id "$INSTANCE_ID" \
                  --region "${{ env.AWS_REGION }}" \
                  --query 'Status' --output text 2>/dev/null || echo "Pending")
                if [[ "$PROBE_STATUS" == "Success" ]]; then
                  echo "SSM fully ready after $((probe*15+10))s (probe command completed)"
                  SSM_READY=true
                  break
                fi
              fi
              # Accepted but not completed (Undeliverable/Failed) — agent flapping
              echo "  Probe accepted but status=$PROBE_STATUS — agent not stable yet ($((probe*15))s)"
            else
              if (( probe % 4 == 0 )); then
                echo "  Still waiting... ($((probe*15))s elapsed)"
              fi
            fi
            sleep 15
          done

          if [[ "$SSM_READY" != "true" ]]; then
            echo "ERROR: SSM agent not fully operational after 12 minutes."
            exit 1
          fi
          echo "Proceeding to build."

      # ── 3. Upload build inputs to S3 ───────────────────────────────────
      - name: Stage build inputs
        run: |
          aws s3 sync modules/domain-apps/cyber/image-builder/windows/packer/ \
            "s3://${{ env.ASSETS_BUCKET }}/windows-build-inputs/packer/" --region "${{ env.AWS_REGION }}"
          aws s3 sync modules/domain-apps/cyber/image-builder/windows/answer_files/ \
            "s3://${{ env.ASSETS_BUCKET }}/windows-build-inputs/answer_files/" --region "${{ env.AWS_REGION }}"
          aws s3 sync modules/domain-apps/cyber/image-builder/windows/scripts/ \
            "s3://${{ env.ASSETS_BUCKET }}/windows-build-inputs/scripts/" --region "${{ env.AWS_REGION }}"
          aws s3 cp modules/domain-apps/cyber/image-builder/windows/build-pipeline.sh \
            "s3://${{ env.ASSETS_BUCKET }}/windows-build-inputs/build-pipeline.sh" --region "${{ env.AWS_REGION }}"

      # ── 4. Run build pipeline via SSM ──────────────────────────────────
      - name: Run Packer build via SSM
        run: |
          # Send command with retry (up to 10 min). Two failure modes:
          #   (a) send-command rejects with InvalidInstanceId — SSM command
          #       plane not ready (can happen if user-data restarts SSM agent).
          #   (b) send-command succeeds but get-command-invocation reports
          #       Undeliverable — agent flapping during package installs.
          # Both resolve with time. Retry 20 times with 30s between attempts.
          COMMAND_ID=""
          DETAIL=""
          SEND_ERR=""
          MAX_SEND_ATTEMPTS=20
          for attempt in $(seq 1 $MAX_SEND_ATTEMPTS); do
            SEND_ERR=""
            if SEND_OUT=$(aws ssm send-command \
                --instance-ids "$INSTANCE_ID" \
                --document-name "AWS-RunShellScript" \
                --parameters "commands=[\"aws s3 cp s3://${{ env.ASSETS_BUCKET }}/windows-build-inputs/build-pipeline.sh /tmp/build-pipeline.sh --region ${{ env.AWS_REGION }} && chmod +x /tmp/build-pipeline.sh && sudo bash /tmp/build-pipeline.sh\"]" \
                --timeout-seconds 7200 \
                --region "${{ env.AWS_REGION }}" \
                --query 'Command.CommandId' --output text 2>&1); then
              COMMAND_ID="$SEND_OUT"
              echo "SSM Command (attempt $attempt): $COMMAND_ID"
              sleep 10
              DETAIL=$(aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                --region "${{ env.AWS_REGION }}" \
                --query 'StatusDetails' --output text 2>/dev/null || echo "Unknown")
              if [[ "$DETAIL" == "Undeliverable" ]]; then
                echo "Command undeliverable (attempt $attempt/$MAX_SEND_ATTEMPTS), retrying in 30s..."
                COMMAND_ID=""
                sleep 30
                continue
              fi
              break
            else
              SEND_ERR="$SEND_OUT"
              echo "send-command failed (attempt $attempt/$MAX_SEND_ATTEMPTS): $SEND_ERR"
              if echo "$SEND_ERR" | grep -qi "InvalidInstanceId\|not in a valid state"; then
                echo "SSM command plane not ready yet — waiting 30s before retry..."
                sleep 30
                continue
              else
                echo "ERROR: non-retryable send-command failure"
                exit 1
              fi
            fi
          done
          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

          if [[ -z "$COMMAND_ID" ]]; then
            echo "ERROR: SSM send-command failed after $MAX_SEND_ATTEMPTS attempts. Last error: $SEND_ERR"
            exit 1
          fi
          if [[ "$DETAIL" == "Undeliverable" ]]; then
            echo "ERROR: SSM command reported Undeliverable after $MAX_SEND_ATTEMPTS attempts"
            exit 1
          fi

          # Poll for completion (up to 90 min)
          for i in $(seq 1 360); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "${{ env.AWS_REGION }}" \
              --query 'Status' --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Success)
                echo "Build completed successfully after $((i*15))s"
                break
                ;;
              Failed|TimedOut|Cancelled)
                echo "Build failed with status: $STATUS"
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --region "${{ env.AWS_REGION }}" \
                  --query 'StandardErrorContent' --output text || true
                exit 1
                ;;
              *)
                if (( i % 20 == 0 )); then
                  echo "  Still building... ($(( i * 15 / 60 )) min elapsed)"
                fi
                sleep 15
                ;;
            esac
          done

          if [[ "$STATUS" != "Success" ]]; then
            echo "ERROR: Build timed out after 90 minutes"
            exit 1
          fi

      # ── 5. Verify qcow2 in S3 ─────────────────────────────────────────
      - name: Verify output
        run: |
          BUILD_DATE=$(date -u +%Y-%m-%d)
          echo "BUILD_DATE=$BUILD_DATE" >> "$GITHUB_ENV"

          # Check dated image exists
          aws s3 ls "s3://${{ env.ASSETS_BUCKET }}/win11-cape-${BUILD_DATE}.qcow2" \
            --region "${{ env.AWS_REGION }}" || {
            echo "ERROR: Dated qcow2 not found in S3"
            exit 1
          }

          # Check latest pointer
          aws s3 ls "s3://${{ env.ASSETS_BUCKET }}/win11-cape-latest.qcow2" \
            --region "${{ env.AWS_REGION }}" || {
            echo "WARNING: Latest pointer not updated"
          }

          echo "Build artifact verified in S3."

      # ── 6. Register on CAPE host ───────────────────────────────────────
      - name: Register VM on CAPE host
        run: |
          aws s3 cp modules/domain-apps/cyber/image-builder/windows/register-cape-vm.sh \
            "s3://${{ env.ASSETS_BUCKET }}/windows-build-inputs/register-cape-vm.sh" \
            --region "${{ env.AWS_REGION }}"

          REG_CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ env.CAPE_HOST_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"aws s3 cp s3://${{ env.ASSETS_BUCKET }}/windows-build-inputs/register-cape-vm.sh /tmp/register-cape-vm.sh --region ${{ env.AWS_REGION }} && chmod +x /tmp/register-cape-vm.sh && sudo bash /tmp/register-cape-vm.sh ${{ env.BUILD_DATE }}\"]" \
            --timeout-seconds 600 \
            --region "${{ env.AWS_REGION }}" \
            --query 'Command.CommandId' --output text)
          echo "Registration command: $REG_CMD_ID"

          for i in $(seq 1 40); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$REG_CMD_ID" \
              --instance-id "${{ env.CAPE_HOST_ID }}" \
              --region "${{ env.AWS_REGION }}" \
              --query 'Status' --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Success) echo "Registration complete"; break ;;
              Failed|TimedOut|Cancelled)
                echo "Registration failed: $STATUS"
                aws ssm get-command-invocation \
                  --command-id "$REG_CMD_ID" \
                  --instance-id "${{ env.CAPE_HOST_ID }}" \
                  --region "${{ env.AWS_REGION }}" \
                  --query 'StandardErrorContent' --output text || true
                exit 1
                ;;
              *) sleep 15 ;;
            esac
          done

      # ── 7. Tear down build host ────────────────────────────────────────
      - name: Terraform apply (build host OFF)
        if: always()
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform init \
            -backend-config="bucket=${{ env.STATE_BUCKET }}" \
            -backend-config="key=${{ env.ENVIRONMENT }}/cyber/image-builder/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="dynamodb_table=adp-terraform-locks" \
            -input=false
          terraform apply -auto-approve -lock-timeout=120s \
            -var="build_host_enabled=false" \
            -var="account_id=${{ env.ACCOUNT_ID }}" \
            -var="idle_period_seconds=21600"

      # ── 8. Summary ─────────────────────────────────────────────────────
      - name: Summary
        if: success()
        run: |
          echo "## Windows 11 CAPE Image Build" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Date**: ${{ env.BUILD_DATE }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image**: s3://${{ env.ASSETS_BUCKET }}/win11-cape-${{ env.BUILD_DATE }}.qcow2" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Latest**: s3://${{ env.ASSETS_BUCKET }}/win11-cape-latest.qcow2" >> "$GITHUB_STEP_SUMMARY"
          echo "- **CAPE Host**: ${{ env.CAPE_HOST_ID }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **VM Name**: win11-cape-${{ env.BUILD_DATE }}" >> "$GITHUB_STEP_SUMMARY"
