name: Orchestration Harness CI

# Network-free unit tests for the qualification harness (tests/e2e/orchestration/,
# issue #5156). This is the ONLY orchestration job that runs on a pull request,
# and it deliberately runs nothing that costs money or touches an account:
# no AWS call, no browser, no deployed environment, no fixture provisioning.
#
# Paid qualification lives in orchestration-live-tests.yml, which is
# workflow_dispatch-only. That split is the point: the harness enforces spend and
# resource bounds, so its own tests must be runnable on every PR without
# spending anything.
#
# A separate workflow rather than a job in gateway-ci.yml because this suite is
# not gateway code — gateway-ci.yml's paths and working-directory are all
# modules/gateway, and repo-root tests/ is covered by no PR workflow at all.

on:
  pull_request:
    paths:
      - 'tests/e2e/orchestration/**'
      - '.github/workflows/orchestration-harness-ci.yml'
  push:
    branches: [main]
    paths:
      - 'tests/e2e/orchestration/**'
      - '.github/workflows/orchestration-harness-ci.yml'

# No `permissions: id-token` and no AWS credential step anywhere in this file.
# The suite must pass with no credentials available; if a test ever needs one,
# it belongs in orchestration-live-tests.yml instead.
permissions:
  contents: read

concurrency:
  group: orchestration-harness-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness-tests:
    name: Qualification harness unit tests (offline)
    # THIS JOB MUST STAY GITHUB-HOSTED — do not sweep it onto arc-runner-org (#5362).
    #
    # #5362 moved the repo's other hosted jobs to the self-hosted pool because the org's
    # Actions billing block stops GitHub allocating a hosted runner, making those checks
    # permanently red. This job is deliberately excluded, and the exclusion is a security
    # property rather than a preference.
    #
    # This lane's own suite asserts that this job has no AWS identity:
    # tests/e2e/orchestration/test_ci_selection.py reads THIS FILE and requires that it
    # contain no `configure-aws-credentials`, no `role-to-assume`, no `id-token`, and no
    # `boto3` in any pip install line. The reason is the harness's purpose: it enforces
    # spend and resource bounds on paid qualification runs, so its own tests must be
    # runnable on every PR without spending anything or touching an account. Paid runs
    # live in orchestration-live-tests.yml, which is workflow_dispatch-only.
    #
    # arc-runner-org cannot honour that claim. Runner pods carry an ambient IRSA identity —
    # their service account is annotated eks.amazonaws.com/role-arn
    # (modules/agent-factory/infra/modules/arc-runner/main.tf) — so the EKS pod-identity
    # webhook injects AWS_ROLE_ARN and AWS_WEB_IDENTITY_TOKEN_FILE into every container
    # and every step runs as adp-<env>-agent-runner-role whether the job asks or not.
    #
    # READ THIS BEFORE TESTING THE MOVE. The guard above is a STATIC check: it greps this
    # file's text, so flipping `runs-on` alone leaves it green (verified: all 37 tests in
    # test_ci_selection.py still pass with `runs-on: arc-runner-org`). Do not read that
    # green as permission. It means the assertion would go VACUOUS — still passing while
    # the property it encodes, "this job has no AWS identity", had become false. A guard
    # that passes without enforcing anything is the failure mode this lane exists to
    # prevent, and it is harder to notice than a red check.
    #
    # This differs from the #5198 finding by mechanism, not by conclusion. There the
    # equivalent check was a RUNTIME step reading the process environment
    # (superplane-domain-ci.yml, "Verify no AWS credentials were configured"), so the move
    # failed loudly on every run. Here the same move fails silently. Adding shell `env -u`
    # unsets, as the moved jobs in #5362 do, would keep the text assertion true for the
    # test processes but still leave the identity available to the runner — trading a true
    # statement for a green tick, which #5362 explicitly forbids.
    #
    # So: while the billing block stands this check stays red, and that is the correct
    # trade — the fix is for a billing owner to clear the block (#5362 AC1-AC3), not to
    # relocate this job. If this lane ever must leave hosted runners, the credential-absence
    # claim has to be redesigned first — as a runtime assertion, deliberately, on the record.
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # pytest only. The harness is standard-library-only by design: repo-root
      # tests/ has no requirements file, and the offline suite must not need
      # boto3 (config.py imports it lazily, inside the runtime secret-resolution
      # path that these tests never take).
      - name: Install pytest
        run: pip install pytest==9.0.3

      # Selecting the package explicitly matters. tests/e2e/chat/conftest.py and
      # tests/e2e/infra/conftest.py skip EVERY collected item when their opt-in
      # variable is unset, without filtering to their own package — so a whole
      # tests/ run would report these tests as skipped. This suite's conftest.py
      # also strips that inherited skip, but the narrow selection keeps the run
      # from depending on collection order.
      - name: Run offline harness tests
        run: |
          set -euo pipefail
          mkdir -p test-results
          python -m pytest tests/e2e/orchestration \
            -v \
            --tb=short \
            --junitxml=test-results/orchestration-harness-junit.xml

      # The failure mode this guards is a VACUOUS pass: if a sibling conftest's
      # unfiltered skip ever reaches these items again, pytest still exits 0
      # while asserting nothing. A green check that tested nothing is worse than
      # no check, so assert on the executed count rather than the exit code.
      - name: Assert the run was not vacuous
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, sys, xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("test-results/orchestration-harness-junit.xml")
          if not report.is_file():
              sys.exit("::error::No JUnit report — pytest did not get far enough to report "
                       "anything, so this run is not evidence.")

          root = ET.parse(report).getroot()
          suites = [root] if root.tag == "testsuite" else root.findall("testsuite")
          total = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          failures = sum(int(s.get("failures", 0)) for s in suites)
          errors = sum(int(s.get("errors", 0)) for s in suites)
          executed = total - skipped

          print(f"collected={total} skipped={skipped} executed={executed} "
                f"failures={failures} errors={errors}")

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a") as fh:
                  fh.write("### Qualification harness (offline)\n\n"
                           "| Collected | Skipped | Executed | Failures | Errors |\n"
                           "|---|---|---|---|---|\n"
                           f"| {total} | {skipped} | {executed} | {failures} | {errors} |\n")

          if executed == 0:
              sys.exit("::error::0 tests executed (collected=%d, skipped=%d). These tests are "
                       "network-free and must always run; a fully skipped run is not a pass."
                       % (total, skipped))
          PY

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: orchestration-harness-results
          path: test-results/
          retention-days: 14
