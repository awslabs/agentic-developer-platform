name: Seed Hosted Tenant (one-shot)

# Seeds the Postgres identity tables for a single hosted tenant:
#   - organizations (upsert)
#   - departments (default)
#   - teams (default)
#   - channel_tenant_map (github + installation_id → org_id)
#
# Runs on ARC so it can reach the VPC-private RDS. Intended for ad-hoc
# onboarding before the Gateway admin API lands (EPIC #374 Phase A/B).
#
# User auto-provisioning (users + user_identities) happens lazily in the
# webhook Lambda on first inbound webhook — not here. This script is
# idempotent; re-running is safe.

on:
  workflow_dispatch:
    inputs:
      tenant_id:
        description: 'Tenant slug (lowercase-hyphenated, e.g. acme-test)'
        required: true
      org_name:
        description: 'Human-readable org name (e.g. "Acme Test")'
        required: true
      installation_id:
        description: 'GitHub App installation ID (numeric)'
        required: true
      dry_run:
        description: 'Only print planned SQL, do not execute'
        required: false
        type: boolean
        default: false

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: dev
  PGSSLMODE: require

jobs:
  seed:
    name: Seed tenant in Postgres
    if: github.ref == 'refs/heads/main'
    env:
      ADP_DB_USER: ${{ vars.ADP_DB_USER }}
    environment: adp-deploy-dev
    permissions:
      contents: read
      id-token: write
    runs-on: arc-runner-org
    steps:
      - uses: actions/checkout@v7

      - name: Verify source belongs to reviewed main history
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$GITHUB_SHA"
          git merge-base --is-ancestor HEAD FETCH_HEAD

      - name: Establish trusted deployment identity
        uses: ./.github/actions/trusted-deployment
        with:
          role_arn: ${{ vars.ADP_DEPLOY_ROLE_ARN }}
          region: ${{ vars.ADP_DEPLOY_REGION || 'us-east-1' }}

      - name: Install psql + jq
        run: |
          set -euo pipefail
          for tool in aws terraform kubectl helm jq zip unzip curl git python3 node npm psql; do
            command -v "$tool" >/dev/null || { echo "::error::Reviewed runner image is missing $tool"; exit 1; }
          done
      - name: Validate inputs
        env:
          ADP_INPUT_A199BE1663: ${{ inputs.tenant_id }}
          ADP_INPUT_34D45E6745: ${{ inputs.installation_id }}
        run: |
          set -euo pipefail
          if [[ ! "${ADP_INPUT_A199BE1663}" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "::error::tenant_id must be lowercase-hyphenated"
            exit 1
          fi
          if [[ ! "${ADP_INPUT_34D45E6745}" =~ ^[0-9]+$ ]]; then
            echo "::error::installation_id must be a positive integer"
            exit 1
          fi
      - name: Build seed SQL
        env:
          ADP_INPUT_A199BE1663: ${{ inputs.tenant_id }}
          ADP_INPUT_7C89F1E8DC: ${{ inputs.org_name }}
          ADP_INPUT_34D45E6745: ${{ inputs.installation_id }}
        run: |
          set -euo pipefail
          cat > /tmp/seed.sql <<'SQL'
          INSERT INTO organizations (id, name, aws_accounts, role_mappings, settings, created_at)
          VALUES (:'tenant_id', :'org_name', '[]'::jsonb, '{}'::jsonb, '{}'::jsonb, now())
          ON CONFLICT (id) DO UPDATE SET name = EXCLUDED.name;

          INSERT INTO departments (id, name, org_id)
          VALUES (:'dept_id', 'Default', :'tenant_id')
          ON CONFLICT (id) DO NOTHING;

          INSERT INTO teams (id, name, department_id, org_id)
          VALUES (:'team_id', 'Default', :'dept_id', :'tenant_id')
          ON CONFLICT (id) DO NOTHING;

          INSERT INTO channel_tenant_map (id, provider, provider_scope_id, org_id, created_at)
          VALUES (gen_random_uuid()::text, 'github', :'installation_id', :'tenant_id', now())
          ON CONFLICT (provider, provider_scope_id) DO NOTHING;

          \echo '--- Verify ---'
          SELECT 'organizations' AS "table", COUNT(*) AS rows FROM organizations WHERE id = :'tenant_id'
          UNION ALL
          SELECT 'departments',   COUNT(*) FROM departments   WHERE org_id = :'tenant_id'
          UNION ALL
          SELECT 'teams',         COUNT(*) FROM teams         WHERE org_id = :'tenant_id'
          UNION ALL
          SELECT 'channel_tenant_map', COUNT(*) FROM channel_tenant_map
                WHERE provider = 'github' AND provider_scope_id = :'installation_id';
          SQL

          echo "=== Planned SQL ==="
          cat /tmp/seed.sql
      # The gateway RDS master user is IAM-auth-only (BG_RDS_IAM_AUTH=true) —
      # password authentication is disabled in-database, so the secret's
      # .password is dead and reading it yields "PAM authentication failed".
      # Mint a short-lived IAM auth token instead. Same sequence as
      # platform/evals/cli-onboarding/run-eval.sh resolve_db_creds().
      # The token is valid 15 minutes, so this step runs immediately before psql.
      # Runs on dry runs too: the whole point of a dry run is to prove the
      # workflow can reach the DB before it writes anything.
      - name: Resolve RDS connection (IAM auth token)
        run: |
          set -euo pipefail
          PGHOST=$(aws ssm get-parameter \
            --name "/adp/${ENVIRONMENT}/gateway/rds-host" \
            --region "$AWS_REGION" \
            --query Parameter.Value --output text)
          PGDATABASE=$(aws ssm get-parameter \
            --name "/adp/${ENVIRONMENT}/gateway/rds-database-name" \
            --region "$AWS_REGION" \
            --query Parameter.Value --output text)
          if [ -z "$PGHOST" ] || [ -z "$PGDATABASE" ]; then
            echo "::error::Could not resolve RDS host/database from SSM for ${ENVIRONMENT}"
            exit 1
          fi

          # The rds!db-* secret is read for the username only — never the password.
          PGUSER="${ADP_DB_USER:?Configure the reviewed database username in the protected deployment environment}"

          PGPASSWORD=$(aws rds generate-db-auth-token \
            --hostname "$PGHOST" --port 5432 \
            --username "$PGUSER" --region "$AWS_REGION")
          if [ -z "$PGPASSWORD" ]; then
            echo "::error::Failed to mint an RDS IAM auth token for ${PGUSER}@${PGHOST}"
            exit 1
          fi
          echo "::add-mask::$PGPASSWORD"

          echo "PGHOST=$PGHOST" >> "$GITHUB_ENV"
          echo "PGDATABASE=$PGDATABASE" >> "$GITHUB_ENV"
          echo "PGUSER=$PGUSER" >> "$GITHUB_ENV"
          echo "PGPASSWORD=$PGPASSWORD" >> "$GITHUB_ENV"

      - name: Execute seed
        if: inputs.dry_run == false
        env:
          SEED_TENANT_ID: ${{ inputs.tenant_id }}
          SEED_ORG_NAME: ${{ inputs.org_name }}
          SEED_INSTALLATION_ID: ${{ inputs.installation_id }}
        run: |
          set -euo pipefail
          # psql's quoted variable syntax escapes SQL literals. Values are
          # separate arguments and are never inserted into shell or SQL code.
          psql -v ON_ERROR_STOP=1 \
            -v "tenant_id=$SEED_TENANT_ID" \
            -v "org_name=$SEED_ORG_NAME" \
            -v "installation_id=$SEED_INSTALLATION_ID" \
            -v "dept_id=$SEED_TENANT_ID-dept-default" \
            -v "team_id=$SEED_TENANT_ID-team-default" \
            -f /tmp/seed.sql

      # A dry run that only printed SQL could not distinguish "would work" from
      # "cannot authenticate at all". Prove the IAM-token connection is live
      # with a read-only probe, without executing any of the seed SQL.
      - name: Dry-run notice
        if: inputs.dry_run == true
        run: |
          set -euo pipefail
          psql -t -A -c "SELECT 'connected as ' || current_user || ' to ' || current_database();"
          echo "::notice::Dry run — SQL printed above, nothing executed."
