name: Run Gateway Alembic Migrations (one-shot)

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

jobs:
  migrate:
    runs-on: arc-runner-org
    steps:
      - name: Install kubectl
        run: |
          if ! command -v kubectl >/dev/null; then
            curl -fsSL "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" -o /tmp/kubectl
            sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          fi
          aws eks update-kubeconfig --name adp-dev-eks-cluster --region "$AWS_REGION" >/dev/null

      - name: Discover + run alembic
        run: |
          set -euo pipefail
          echo "=== Namespaces ==="
          kubectl get ns
          echo
          echo "=== Gateway pods ==="
          kubectl get pods -A --field-selector=status.phase=Running | grep -i gateway || true
          echo
          NS="adp-gateway"
          POD=$(kubectl get pods -n "$NS" --field-selector=status.phase=Running -o jsonpath='{.items[0].metadata.name}')
          echo "Running alembic in $NS/$POD"
          kubectl exec -n "$NS" "$POD" -- alembic upgrade head
          echo
          echo "=== Current revision ==="
          kubectl exec -n "$NS" "$POD" -- alembic current
