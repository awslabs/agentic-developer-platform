name: Run Gateway Alembic Migrations (one-shot)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (default: dev)"
        required: false
        type: string
        default: dev
      customer_account_id:
        description: "Customer-linked AWS account (cross-account mode)."
        required: false
        type: string
        default: ''
      customer_aws_label:
        description: "Vaulted credential label (when customer_account_id is set)."
        required: false
        type: string
        default: ''
      customer_user_id:
        description: "ADP users.id UUID (when customer_account_id is set)."
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      environment:
        description: "Target environment (default: dev)"
        required: false
        type: string
        default: dev
      customer_account_id:
        description: "Customer-linked AWS account (cross-account mode)."
        required: false
        type: string
        default: ''
      customer_aws_label:
        description: "Vaulted credential label (when customer_account_id is set)."
        required: false
        type: string
        default: ''
      customer_user_id:
        description: "ADP users.id UUID (when customer_account_id is set)."
        required: false
        type: string
        default: ''

env:
  AWS_REGION: us-east-1

jobs:
  migrate:
    runs-on: arc-runner-org
    steps:
      - uses: actions/checkout@v7

      - name: Load deployment config
        uses: ./.github/actions/load-deploy-config
        with:
          environment: ${{ inputs.environment }}
          customer_account_id: ${{ inputs.customer_account_id }}
          customer_aws_label: ${{ inputs.customer_aws_label }}
          customer_user_id: ${{ inputs.customer_user_id }}

      - name: Install kubectl
        run: |
          if ! command -v kubectl >/dev/null; then
            curl -fsSL "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" -o /tmp/kubectl
            sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          fi
          EKS_CLUSTER="adp-${ENVIRONMENT:-dev}-eks-cluster"
          aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION" >/dev/null

      - name: Run alembic
        run: |
          set -euo pipefail
          NS="adp-gateway"
          POD=$(kubectl get pods -n "$NS" --field-selector=status.phase=Running -o jsonpath='{.items[0].metadata.name}')
          echo "Using $NS/$POD"
          # Show current revision
          echo "=== Before ==="
          kubectl exec -n "$NS" "$POD" -- env PYTHONPATH=/app alembic current || true
          echo
          echo "=== Upgrade ==="
          kubectl exec -n "$NS" "$POD" -- env PYTHONPATH=/app alembic upgrade head
          echo
          echo "=== After ==="
          kubectl exec -n "$NS" "$POD" -- env PYTHONPATH=/app alembic current
