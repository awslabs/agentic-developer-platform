name: Run Gateway Alembic Migrations (one-shot)

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

jobs:
  migrate:
    name: Run alembic upgrade head
    runs-on: arc-runner-org
    steps:
      - name: Install kubectl
        run: |
          if ! command -v kubectl >/dev/null; then
            curl -fsSL "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" -o /tmp/kubectl
            sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          fi
          aws eks update-kubeconfig --name adp-dev-eks-cluster --region "$AWS_REGION" >/dev/null

      - name: Find gateway pod
        id: pod
        run: |
          set -euo pipefail
          # Discover namespace + pod by image/name match rather than label
          echo "=== Pods in bedrockgw ==="
          kubectl get pods -n bedrockgw -o wide
          echo
          # First running pod in the bedrockgw namespace
          POD=$(kubectl get pods -n bedrockgw --field-selector=status.phase=Running -o jsonpath='{.items[0].metadata.name}')
          echo "Selected pod: $POD"
          echo "pod=$POD" >> "$GITHUB_OUTPUT"

      - name: Run alembic upgrade
        run: |
          set -euo pipefail
          POD='${{ steps.pod.outputs.pod }}'
          kubectl exec -n bedrockgw "$POD" -- alembic upgrade head
          echo
          echo "=== Current revision ==="
          kubectl exec -n bedrockgw "$POD" -- alembic current
