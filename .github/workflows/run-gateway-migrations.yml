name: Run Gateway Alembic Migrations (one-shot)

on:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

jobs:
  migrate:
    name: Run alembic upgrade head
    runs-on: arc-runner-org
    steps:
      - name: Install kubectl
        run: |
          if ! command -v kubectl >/dev/null; then
            curl -fsSL "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" -o /tmp/kubectl
            sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          fi
          aws eks update-kubeconfig --name adp-dev-eks-cluster --region "$AWS_REGION" >/dev/null

      - name: Run migrations via running pod
        run: |
          set -euo pipefail
          POD=$(kubectl get pod -n bedrockgw -l app.kubernetes.io/name=bedrockgateway -o jsonpath='{.items[0].metadata.name}' 2>/dev/null \
                || kubectl get pod -n bedrockgw -l app=bedrockgateway -o jsonpath='{.items[0].metadata.name}')
          echo "Using pod: $POD"
          kubectl exec -n bedrockgw "$POD" -- alembic -c /app/alembic.ini upgrade head
          echo
          echo "=== Current revision after upgrade ==="
          kubectl exec -n bedrockgw "$POD" -- alembic -c /app/alembic.ini current
