name: Run Gateway Alembic Migrations (one-shot)

on:
  workflow_dispatch:
    inputs:
      account_id:
        description: "Target AWS account; empty uses deployment config."
        required: false
        type: string
        default: ''
      expected_image:
        description: "Expected gateway release image; empty uses current deployment image"
        required: false
        type: string
        default: ''
      environment:
        description: "Target environment (default: dev)"
        required: false
        type: string
        default: dev
      customer_account_id:
        description: "Customer-linked AWS account (cross-account mode)."
        required: false
        type: string
        default: ''
      customer_aws_label:
        description: "Vaulted credential label (when customer_account_id is set)."
        required: false
        type: string
        default: ''
      customer_user_id:
        description: "ADP users.id UUID (when customer_account_id is set)."
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      account_id:
        description: "Target AWS account; empty uses deployment config."
        required: false
        type: string
        default: ''
      expected_image:
        description: "Expected gateway release image; empty uses current deployment image"
        required: false
        type: string
        default: ''
      environment:
        description: "Target environment (default: dev)"
        required: false
        type: string
        default: dev
      customer_account_id:
        description: "Customer-linked AWS account (cross-account mode)."
        required: false
        type: string
        default: ''
      customer_aws_label:
        description: "Vaulted credential label (when customer_account_id is set)."
        required: false
        type: string
        default: ''
      customer_user_id:
        description: "ADP users.id UUID (when customer_account_id is set)."
        required: false
        type: string
        default: ''

env:
  AWS_REGION: us-east-1

jobs:
  migrate:
    runs-on: arc-runner-org
    steps:
      - uses: actions/checkout@v7

      - name: Load deployment config
        uses: ./.github/actions/load-deploy-config
        with:
          account_id: ${{ inputs.account_id }}
          environment: ${{ inputs.environment }}
          customer_account_id: ${{ inputs.customer_account_id }}
          customer_aws_label: ${{ inputs.customer_aws_label }}
          customer_user_id: ${{ inputs.customer_user_id }}

      - name: Install kubectl
        run: |
          if ! command -v kubectl >/dev/null; then
            curl -fsSL "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl" -o /tmp/kubectl
            sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          fi
          EKS_CLUSTER="adp-${ENVIRONMENT:-dev}-eks-cluster"
          aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION" >/dev/null

      - name: Migrate and verify activated pricing on the release image
        env:
          PRICING_EXPECTED_IMAGE: ${{ inputs.expected_image }}
        run: |
          set -euo pipefail
          PRICING_IMAGE_ARGS=()
          if [ -n "$PRICING_EXPECTED_IMAGE" ]; then
            PRICING_IMAGE_ARGS=(--expected-image "$PRICING_EXPECTED_IMAGE")
          fi
          python3 modules/gateway/scripts/pricing-rollout.py migrate \
            --account-id "${CUSTOMER_ACCOUNT_ID:-$ACCOUNT_ID}" \
            --environment "$ENVIRONMENT" "${PRICING_IMAGE_ARGS[@]}"
