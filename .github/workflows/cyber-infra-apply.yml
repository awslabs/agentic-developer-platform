name: Cyber Infra Apply
'on':
  workflow_dispatch: null
concurrency:
  group: tf-apply-cyber
  cancel-in-progress: false
jobs:
  apply:
    name: Terraform Apply
    if: github.ref == 'refs/heads/main'
    runs-on:
      group: adp-deployment
      labels: arc-runner-deployment
    environment: adp-deploy-dev
    permissions:
      id-token: write
      contents: read
      pull-requests: read
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - name: Verify source belongs to reviewed main history
      shell: bash
      run: |
        set -euo pipefail
        git fetch --no-tags origin "$GITHUB_SHA"
        git merge-base --is-ancestor HEAD FETCH_HEAD
    - name: Establish trusted deployment identity
      uses: ./.github/actions/trusted-deployment
      with:
        role_arn: ${{ vars.ADP_DEPLOY_ROLE_ARN }}
        region: ${{ vars.ADP_DEPLOY_REGION || 'us-east-1' }}
    - name: Run cyber app automation
      uses: ./modules/domain-apps/cyber/ci/cyber-infra-apply
