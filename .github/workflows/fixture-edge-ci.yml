# Wave 2 fixture trusted edge — mocked CI (Issue #5836)
#
# WHY THIS WORKFLOW EXISTS, AND WHY IT IS NOT A JOB IN gateway-infra-plan.yml
# --------------------------------------------------------------------------
# `modules/gateway/infra/fixture-edge/` is an ISOLATED Terraform root. It is not
# referenced as a module by `modules/gateway/infra/main.tf` (verified: the gateway
# root's module tree contains no fixture-edge entry), and it declares its own
# `backend "s3" {}` with a per-run state key. So the gateway's plan job never
# evaluates a single line of it.
#
# But `gateway-infra-plan.yml` triggers on `modules/gateway/infra/**`, which DOES
# match `modules/gateway/infra/fixture-edge/**`. That produced the exact failure
# mode #5836's review called out — "CI does not run these tests" — in its most
# misleading form:
#
#   a fixture-edge-only PR triggered a job that authenticates to the account and
#   plans the ORDINARY gateway, reported a green check against the PR, and ran
#   none of this component's mocked Terraform tests or its pytest suites.
#
# A green "Gateway Infra Plan" on such a PR is evidence about production's plan,
# not about the fixture edge. This workflow supplies the missing evidence under a
# name that says what it checked.
#
# NO PRODUCTION CREDENTIALS
# -------------------------
# #5836 forbids live mutation, apply, and state writes from this component's CI.
# Three independent things enforce that, because `arc-runner-org` carries ambient
# IRSA credentials — not requesting credentials is NOT the same as not having
# them:
#
#   1. `permissions: contents: read` only. No `id-token: write`, so no OIDC role
#      assumption, and no `configure-aws-credentials` step.
#   2. Every terraform invocation uses `-backend=false`. That configures NO state
#      backend, which makes `plan`/`apply` structurally impossible, not merely
#      un-attempted: with the `backend "s3"` block declared, `terraform plan` after
#      a `-backend=false` init exits non-zero with "Backend initialization
#      required" (reproduced on 1.14.6). The only commands that work are
#      fmt/validate/test — exactly the ones intended.
#   3. The AWS_* environment below points any SDK call that slips through at
#      unusable values and disables IMDS, so an accidental real API call fails
#      loudly instead of silently reaching the account the runner lives in. The
#      mocked suites were verified to pass under precisely this environment, so
#      it is a live guard and not decoration.
#
# `terraform test` here uses `mock_provider`, and the pytest suites put fake
# kubectl/aws/terraform/ownership executables on PATH. Nothing contacts AWS.
#
# WHAT A GREEN CHECK HERE DOES AND DOES NOT MEAN
# ----------------------------------------------
# It means the configuration's properties hold: default-off, the run-binding gate
# refuses mismatched/unsafe discovered inputs, the resource-policy Deny stays
# scoped to /internal, no output carries the provenance secret, and the lifecycle
# scripts refuse the unsafe orderings. It does NOT mean the fixture edge works:
# live acceptance (#3968's protected worker completing a real bootstrap, plus the
# spoofed / unsigned / wrong-role refusals) requires an operator running RUNBOOK.md
# against the authorized account. Mocked tests are not live acceptance.

name: Fixture Edge CI

on:
  pull_request:
    paths:
      # This component. Intentionally the whole directory: main.tf, variables.tf,
      # outputs.tf, backend.tf, the tests, the scripts and the Ingress template
      # are one unit — the pytest suites read the .tmpl and the scripts directly
      # (e.g. the placeholder-drift test diffs the template against the script),
      # so a template-only edit must reach this job.
      - 'modules/gateway/infra/fixture-edge/**'
      # Lockstep reachability, same pattern webhook-ingress-ci.yml uses for paths
      # outside its module: both scripts record their Kubernetes objects through
      # #3968's `lib/ownership.py record-k8s --uid`, and the pytest suites assert
      # against a FAKE of that interface. If #3968 changes the record-k8s flags,
      # the fakes keep passing while the real invocation breaks at operator time.
      # This path makes such a change run these tests in the same PR.
      - 'platform/scripts/operator/wave2/lib/ownership.py'
      # Same lockstep reasoning, for the other coordination seam. This component
      # emits the creation-ledger and teardown-removals fragments that #5825's
      # merged evaluator consumes, in that evaluator's OWN key shapes
      # (LEDGER_ENTRY_KEYS / LEDGER_REMOVAL_KEYS / the listener+policy kind sets).
      # Key names living in two files drift silently: the evaluator renames a key,
      # this component keeps emitting the old one, both suites stay green, and the
      # mismatch surfaces at live acceptance as a missing artifact field. The
      # pytest pin reads those constants back out of the evaluator, and this path
      # makes a rename there run that pin in the same PR.
      - 'platform/scripts/agent-control-eval.py'
      - '.github/workflows/fixture-edge-ci.yml'
      # Documentation-only changes do not start this workflow.
      - '!docs/**'
      - '!**/docs/**'
      - '!**/README*'
      - '!**/CHANGELOG*'
      - '!**/CONTRIBUTING*'
      - '!**/*.rst'
    branches:
      - main

concurrency:
  group: fixture-edge-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # See "NO PRODUCTION CREDENTIALS" above. These are deliberately unusable.
  AWS_ACCESS_KEY_ID: fixture-edge-ci-must-not-reach-aws
  AWS_SECRET_ACCESS_KEY: fixture-edge-ci-must-not-reach-aws
  AWS_SESSION_TOKEN: fixture-edge-ci-must-not-reach-aws
  AWS_REGION: us-east-1
  AWS_EC2_METADATA_DISABLED: 'true'

jobs:
  fixture-edge:
    name: Fixture edge mocked tests
    runs-on: arc-runner-org
    permissions:
      contents: read
    defaults:
      run:
        working-directory: modules/gateway/infra/fixture-edge

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: hashicorp/setup-terraform@v4
        with:
          # Matches the pin the other Terraform-testing workflows use
          # (webhook-ingress-ci.yml). The suites were verified green on 1.14.6
          # specifically, not only on a newer local build, so this pin is known
          # to work rather than assumed to.
          terraform_version: '1.14.6'
          terraform_wrapper: false

      # boto3 is NOT optional here, and it is not a convenience. The wrong-role
      # control in `verify` signs its probe through botocore's OWN provider chain
      # (the previous revision read keys out of the aws config file with
      # `aws configure get`, which returns nothing for assumed-role/SSO, so the
      # probe could never sign). The test for it therefore imports boto3 in the
      # subprocess under test. Without this install those five cases report HTTP
      # 000 — an unsigned request, i.e. the exact defect being tested, reported as
      # a test failure rather than as a missing dependency.
      - name: Install test dependencies
        run: pip install pytest PyYAML boto3

      # Two tests hand the ACTUAL kubectl command line to the REAL binary in
      # --local mode. That is the only check in this suite made against a real CLI
      # instead of a double, and it exists because the fake DID accept a
      # nonexistent flag (`--resource-version`) while the script could not run at
      # all. `--local` parses flags and patches the object client-side: no cluster,
      # no kubeconfig, no credentials.
      #
      # FIXTURE_EDGE_REQUIRE_REAL_KUBECTL below turns "kubectl missing" from a SKIP
      # into a FAILURE for this job, so the required regression cannot quietly stop
      # executing if this install step breaks or is removed. test_ci_wiring.py
      # asserts both the install and the variable.
      - name: Install kubectl (for the real-CLI interface regression)
        run: |
          KV="$(curl -fsSL https://dl.k8s.io/release/stable.txt)"
          curl -fsSL "https://dl.k8s.io/release/${KV}/bin/linux/amd64/kubectl" -o /tmp/kubectl
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          kubectl version --client

      # Separate from validate so the failure message distinguishes "badly
      # formatted" from "invalid" — they need different fixes.
      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init (no backend, no state, no credentials)
        run: terraform init -backend=false -input=false -no-color

      - name: Terraform validate
        run: terraform validate -no-color

      # The mocked Terraform tests. These are the ones the review found unreachable
      # from CI. No -filter: the whole file should run, and a new run block added
      # later must not need a workflow edit to be executed. Deliberately NOT a
      # count -- a hard-coded number in a comment goes stale on every added case,
      # and a stale count reads as a coverage claim.
      #
      # Note these DO execute here: `terraform validate` and `terraform test` were
      # once believed unrunnable without credentials and disclosed as not-run. They
      # run: mock_provider needs no account, and `init -backend=false` needs no
      # state.
      - name: Terraform test (mocked providers)
        run: terraform test -no-color

      # Shell-composition suites. The Terraform tests cannot cover these: the
      # Ingress that fronts the fixture and the create/handoff/destroy contract
      # are shell + template, deliberately outside the Terraform root so a
      # disposable fixture ALB is never in the same state as the edge.
      #
      # test_ci_wiring.py gates THIS workflow: that the trigger paths reach this
      # component, that nothing here can reach AWS, and that every test file in
      # tests/ is actually invoked. It derives that last check from the
      # filesystem, so adding a suite without wiring it fails here rather than
      # passing for free. It caught its own omission from this step when first
      # written, which is the regression it exists to prevent.
      - name: Script composition and CI-wiring tests
        env:
          # Absence of the real kubectl must FAIL this job, not skip two tests.
          # See the install step above.
          FIXTURE_EDGE_REQUIRE_REAL_KUBECTL: '1'
        run: |
          python3 -m pytest -q --import-mode=importlib \
            tests/test_fixture_alb_composition.py \
            tests/test_fixture_lifecycle.py \
            tests/test_ci_wiring.py

      # A syntax error in these is an operator-time failure halfway through a
      # live run, which is the worst moment to find one. bash -n is cheap
      # insurance that the pytest suites do not provide for code paths they do
      # not execute.
      - name: Shell syntax
        run: |
          for s in scripts/*.sh; do
            bash -n "$s" || exit 1
            echo "ok: $s"
          done

      - name: Summary
        if: always()
        run: |
          {
            echo "## Fixture edge (#5836) — mocked checks"
            echo
            echo "Ran against \`modules/gateway/infra/fixture-edge/\`, an isolated"
            echo "Terraform root with no backend configured and no AWS credentials."
            echo
            echo "- \`terraform fmt -check -recursive\`"
            echo "- \`terraform validate\`"
            echo "- \`terraform test\` (mock_provider)"
            echo "- \`pytest\` — fixture ALB composition + lifecycle contract"
            echo "- \`bash -n\` on every script"
            echo
            echo "**Not live acceptance.** These prove properties of the"
            echo "configuration. A protected worker completing a real bootstrap,"
            echo "and the spoofed/unsigned/wrong-role refusals, are established"
            echo "only by an operator running \`RUNBOOK.md\` against the"
            echo "authorized account."
          } >> "$GITHUB_STEP_SUMMARY"
