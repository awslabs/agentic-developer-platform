name: Platform Upgrade Tests

on:
  pull_request:
    paths:
      - 'platform/scripts/deploy-all.sh'
      - 'platform/scripts/deploy-prerequisites.sh'
      - 'platform/infra/modules/eks/**'
      - 'platform/infra/modules/ecr/**'
      - 'platform/infra/main.tf'
      - 'platform/infra/variables.tf'
      - 'modules/gateway/infra/main.tf'
      - 'modules/gateway/infra/modules/rds-bootstrap/**'
      - 'platform/scripts/tests/test_rds_bootstrap.py'
      - 'modules/gateway/infra/variables.tf'
      - 'platform/scripts/prepare-release-config.py'
      - 'config/release-defaults/**'
      - 'platform/infra/release-configuration.tf'
      - 'modules/gateway/infra/release-configuration.tf'
      - 'modules/agent-factory/webhook-ingress/infra/release-configuration.tf'
      - 'modules/gateway/scripts/sync-gateway-engine.py'
      - 'platform/scripts/tests/test_gateway_engine_release.py'
      - '.github/workflows/gateway-deploy.yml'
      - 'deploy.sh'
      - 'platform/scripts/enable-bedrock-models.sh'
      - 'platform/scripts/bedrock-model-access.py'
      - 'platform/scripts/tests/test_bedrock_model_access.py'
      - 'platform/scripts/preflight-check.sh'
      - 'modules/agent-factory/agent/k8s/deploy-chat-scaledjob.sh'
      - 'modules/agent-factory/webhook-ingress/scripts/deploy-webhook-ingress.sh'
      - 'modules/agent-factory/agent-worker-image/entrypoint.py'
      - 'modules/agent-factory/agent/k8s/chat-scaledjob.yaml'
      - 'modules/gateway/scripts/pricing-rollout.py'
      - 'modules/gateway/tests/pricing_policy/test_rollout.py'
      - 'platform/scripts/build-agent-factory-lambdas.sh'
      - 'modules/agent-factory/agent/package*.json'
      - 'modules/agent-factory/agent/src/complex-task-chat/sweepers/**'
      - 'modules/agent-factory/infra/chat-agent-infra.tf'
      - 'platform/scripts/upgrade-*.py'
      - 'platform/scripts/upgrade-*.sh'
      - 'platform/scripts/terraform-update.sh'
      - 'platform/scripts/deploy-checkpoints.*'
      - 'platform/scripts/tfvars-account-check.py'
      - 'platform/scripts/tests/test_deployment_recovery.py'
      - 'platform/scripts/prepare-backends.py'
      - 'platform/scripts/tests/test_upgrade*.py'
      - 'platform/scripts/tests/test_update_safety.py'
      # Capacity-subnet retention (#5830). The rules that stop an absent or stale
      # configuration from removing the cluster's added subnets are asserted by
      # test_capacity_subnets.py, which no other workflow executes -- upgrade-contracts
      # runs a pinned list, and Script Tests only discovers .github/scripts/tests. The
      # runbook is a subject too, not documentation-only: the shell regression executes
      # the resolve block extracted from its text, so an edit that reintroduces the
      # `export VAR="$(resolver)"` failure-masking must re-run the gate that catches it.
      - 'platform/scripts/capacity_subnets.py'
      - 'platform/scripts/resolve-capacity-subnets.py'
      - 'platform/scripts/tests/test_capacity_subnets.py'
      - 'platform/scripts/tests/test_capacity_subnet_runbook.py'
      - 'docs/runbooks/eks-pod-ip-exhaustion.md'
      - 'modules/agent-factory/infra/outputs.tf'
      - 'modules/agent-factory/infra/variables.tf'
      - 'modules/agent-factory/infra/main.tf'
      - 'modules/agent-factory/infra/modules/runner-iam/**'
      - 'modules/agent-factory/infra/modules/lambda-gateway/**'
      - '.github/workflows/platform-upgrade-tests.yml'
      # Documentation-only changes do not start this workflow.
      - '!docs/**'
      - '!**/docs/**'
      - '!**/README*'
      - '!**/CHANGELOG*'
      - '!**/CONTRIBUTING*'
      - '!**/*.rst'
  push:
    branches: [main]
    paths:
      - 'platform/scripts/deploy-all.sh'
      - 'platform/scripts/deploy-prerequisites.sh'
      - 'platform/infra/modules/eks/**'
      - 'platform/infra/modules/ecr/**'
      - 'platform/infra/main.tf'
      - 'platform/infra/variables.tf'
      - 'modules/gateway/infra/main.tf'
      - 'modules/gateway/infra/modules/rds-bootstrap/**'
      - 'platform/scripts/tests/test_rds_bootstrap.py'
      - 'modules/gateway/infra/variables.tf'
      - 'platform/scripts/prepare-release-config.py'
      - 'config/release-defaults/**'
      - 'platform/infra/release-configuration.tf'
      - 'modules/gateway/infra/release-configuration.tf'
      - 'modules/agent-factory/webhook-ingress/infra/release-configuration.tf'
      - 'modules/gateway/scripts/sync-gateway-engine.py'
      - 'platform/scripts/tests/test_gateway_engine_release.py'
      - '.github/workflows/gateway-deploy.yml'
      - 'deploy.sh'
      - 'platform/scripts/enable-bedrock-models.sh'
      - 'platform/scripts/bedrock-model-access.py'
      - 'platform/scripts/tests/test_bedrock_model_access.py'
      - 'platform/scripts/preflight-check.sh'
      - 'modules/agent-factory/agent/k8s/deploy-chat-scaledjob.sh'
      - 'modules/agent-factory/webhook-ingress/scripts/deploy-webhook-ingress.sh'
      - 'modules/agent-factory/agent-worker-image/entrypoint.py'
      - 'modules/agent-factory/agent/k8s/chat-scaledjob.yaml'
      - 'modules/gateway/scripts/pricing-rollout.py'
      - 'modules/gateway/tests/pricing_policy/test_rollout.py'
      - 'platform/scripts/build-agent-factory-lambdas.sh'
      - 'modules/agent-factory/agent/package*.json'
      - 'modules/agent-factory/agent/src/complex-task-chat/sweepers/**'
      - 'modules/agent-factory/infra/chat-agent-infra.tf'
      - 'platform/scripts/upgrade-*.py'
      - 'platform/scripts/upgrade-*.sh'
      - 'platform/scripts/terraform-update.sh'
      - 'platform/scripts/deploy-checkpoints.*'
      - 'platform/scripts/tfvars-account-check.py'
      - 'platform/scripts/tests/test_deployment_recovery.py'
      - 'platform/scripts/prepare-backends.py'
      - 'platform/scripts/tests/test_upgrade*.py'
      - 'platform/scripts/tests/test_update_safety.py'
      # Capacity-subnet retention (#5830). The rules that stop an absent or stale
      # configuration from removing the cluster's added subnets are asserted by
      # test_capacity_subnets.py, which no other workflow executes -- upgrade-contracts
      # runs a pinned list, and Script Tests only discovers .github/scripts/tests. The
      # runbook is a subject too, not documentation-only: the shell regression executes
      # the resolve block extracted from its text, so an edit that reintroduces the
      # `export VAR="$(resolver)"` failure-masking must re-run the gate that catches it.
      - 'platform/scripts/capacity_subnets.py'
      - 'platform/scripts/resolve-capacity-subnets.py'
      - 'platform/scripts/tests/test_capacity_subnets.py'
      - 'platform/scripts/tests/test_capacity_subnet_runbook.py'
      - 'docs/runbooks/eks-pod-ip-exhaustion.md'
      - 'modules/agent-factory/infra/outputs.tf'
      - 'modules/agent-factory/infra/variables.tf'
      - 'modules/agent-factory/infra/main.tf'
      - 'modules/agent-factory/infra/modules/runner-iam/**'
      - 'modules/agent-factory/infra/modules/lambda-gateway/**'
      - '.github/workflows/platform-upgrade-tests.yml'
      # Documentation-only changes do not start this workflow.
      - '!docs/**'
      - '!**/docs/**'
      - '!**/README*'
      - '!**/CHANGELOG*'
      - '!**/CONTRIBUTING*'
      - '!**/*.rst'
permissions:
  contents: read

# RUNNER CHOICE (#5362). These three jobs ran on GitHub-hosted runners until the
# org's Actions billing block stopped GitHub allocating one: every run failed in ~3s
# with no steps and no log, so the contracts below were not enforced at all while the
# checks showed red. They now use the in-cluster self-hosted pool, which the billing
# block does not affect and which the rest of this repo already uses.
#
# None of these jobs needs AWS: the packaging script makes no `aws` call, the Python
# suites read files and monkeypatch env vars, and both Terraform suites declare
# `mock_provider "aws"` with `override_data` for aws_caller_identity. Verified locally
# with every AWS_* variable stripped: 54 upgrade + 8 safety + 38 pricing tests and
# 5 + 2 Terraform runs all passed with no credentials discoverable.
#
# Note what the self-hosted pool is NOT: credential-free. Runner pods carry an ambient
# IRSA identity (their service account is annotated eks.amazonaws.com/role-arn), so the
# pod-identity webhook injects AWS_ROLE_ARN and AWS_WEB_IDENTITY_TOKEN_FILE into every
# container whether the job asks or not. Omitting configure-aws-credentials here does
# not make these jobs credential-free. The test jobs therefore disable credential
# discovery for their own processes; that is an offline test environment, not a sandbox
# claim and not an assertion that the runner has no identity. A job that needs to
# assert the ABSENCE of an ambient identity cannot use this pool — see the runner note
# in orchestration-harness-ci.yml, and do not weaken such an assertion to move it.
jobs:
  factory-lambda-build:
    runs-on: arc-runner-org
    # Packaging only: npm ci, esbuild, and pip-installed manylinux wheels. No `aws`
    # call in build-agent-factory-lambdas.sh or build-ingest-lambda.sh, and no Docker
    # (ARC container jobs are still blocked by #4167). Region pinned and credential
    # files neutralised so a future step cannot quietly start depending on the pool's
    # ambient identity. The `defaults.run.shell` override used by the test jobs below
    # is deliberately NOT applied here: this job's Node/Python toolchain comes from the
    # setup actions, and a bare --noprofile --norc shell is a needless risk for a build
    # that makes no AWS calls anyway.
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_CONFIG_FILE: /dev/null
      AWS_SHARED_CREDENTIALS_FILE: /dev/null
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: bash platform/scripts/build-agent-factory-lambdas.sh

  upgrade-contracts:
    runs-on: arc-runner-org
    # Script/YAML checks and provider-free Terraform input precedence. Credential discovery disabled for the
    # test processes so a pass here cannot depend on the pool's ambient identity.
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_CONFIG_FILE: /dev/null
      AWS_SHARED_CREDENTIALS_FILE: /dev/null
      AWS_CREDENTIAL_FILE: /dev/null
      BOTO_CONFIG: /dev/null
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
    defaults:
      run:
        # Unset rather than empty: the container credential provider treats presence
        # of the variable as enabled.
        shell: >-
          env -u AWS_ACCESS_KEY_ID -u AWS_SECRET_ACCESS_KEY -u AWS_SESSION_TOKEN
          -u AWS_SECURITY_TOKEN -u AWS_ROLE_ARN -u AWS_WEB_IDENTITY_TOKEN_FILE
          -u AWS_CONTAINER_CREDENTIALS_FULL_URI -u AWS_CONTAINER_CREDENTIALS_RELATIVE_URI
          -u AWS_CONTAINER_AUTHORIZATION_TOKEN -u AWS_CONTAINER_AUTHORIZATION_TOKEN_FILE
          -u AWS_PROFILE -u AWS_DEFAULT_PROFILE
          bash --noprofile --norc -e -o pipefail {0}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install PyYAML pytest
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.14.6'
          terraform_wrapper: false
      - run: python -m unittest discover -s platform/scripts/tests -p 'test_upgrade*.py' -v
      - run: python -m unittest discover -s platform/scripts/tests -p test_rds_bootstrap.py -v
      - run: python -m unittest discover -s platform/scripts/tests -p test_update_safety.py -v
      - run: python -m unittest discover -s platform/scripts/tests -p test_deployment_recovery.py -v
      - run: python -m unittest discover -s platform/scripts/tests -p test_gateway_engine_release.py -v
      - run: terraform init -backend=false -input=false
        working-directory: platform/infra/modules/eks
      - run: terraform test -no-color -filter=tests/legacy_bootstrap_admin.tftest.hcl -filter=tests/endpoint_access.tftest.hcl
        working-directory: platform/infra/modules/eks
      - run: terraform init -backend=false -input=false
        working-directory: platform/infra/modules/ecr
      - run: terraform test -no-color -filter=tests/registry_ownership.tftest.hcl
        working-directory: platform/infra/modules/ecr
      - run: python -m pytest platform/scripts/tests/test_bedrock_model_access.py -q
      # Capacity-subnet retention and the runbook's resolve block (#5830). Pinned
      # explicitly, like the rest of this job: a glob silently stops covering a file
      # that is renamed, which is the same silent coverage loss this step closes.
      - run: python -m pytest platform/scripts/tests/test_capacity_subnets.py platform/scripts/tests/test_capacity_subnet_runbook.py -q
      - run: python -m pytest --confcutdir=modules/gateway/tests/pricing_policy modules/gateway/tests/pricing_policy/test_rollout.py -q

  factory-before-github:
    runs-on: arc-runner-org
    # The only automated `terraform test` for the lambda-gateway and runner-iam modules.
    # These are IAM-shaped, so a silent regression is a security regression — which is
    # exactly why leaving this check red-for-billing was the expensive part of #5362.
    # Both suites mock the aws provider and override aws_caller_identity, so they make
    # no AWS call; credential discovery is disabled as well so the assertions cannot be
    # satisfied by the pool's ambient identity instead of the mocks.
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_CONFIG_FILE: /dev/null
      AWS_SHARED_CREDENTIALS_FILE: /dev/null
      AWS_CREDENTIAL_FILE: /dev/null
      BOTO_CONFIG: /dev/null
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
    defaults:
      run:
        shell: >-
          env -u AWS_ACCESS_KEY_ID -u AWS_SECRET_ACCESS_KEY -u AWS_SESSION_TOKEN
          -u AWS_SECURITY_TOKEN -u AWS_ROLE_ARN -u AWS_WEB_IDENTITY_TOKEN_FILE
          -u AWS_CONTAINER_CREDENTIALS_FULL_URI -u AWS_CONTAINER_CREDENTIALS_RELATIVE_URI
          -u AWS_CONTAINER_AUTHORIZATION_TOKEN -u AWS_CONTAINER_AUTHORIZATION_TOKEN_FILE
          -u AWS_PROFILE -u AWS_DEFAULT_PROFILE
          bash --noprofile --norc -e -o pipefail {0}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.9.0'
          terraform_wrapper: false
      - run: terraform init -backend=false -input=false
        working-directory: modules/agent-factory/infra/modules/lambda-gateway
      - run: terraform test -no-color
        working-directory: modules/agent-factory/infra/modules/lambda-gateway
      - run: terraform init -backend=false -input=false
        working-directory: modules/agent-factory/infra/modules/runner-iam
      - run: terraform test -no-color
        working-directory: modules/agent-factory/infra/modules/runner-iam
