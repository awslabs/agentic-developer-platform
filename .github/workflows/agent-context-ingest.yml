# =============================================================================
# Agent Context — Content Ingestion Workflow
# =============================================================================
# Triggers when index_content/ files change. Creates an ingestion Job in-cluster.
# Runner has IRSA via adp-dev-agent-runner-role — but the ingestion Job itself
# runs under the agent-context-sa service account with its own IRSA role.
# =============================================================================

name: agent-context-ingest

on:
  push:
    branches: [main]
    paths:
      - 'modules/agent-context/index_content/**'
  workflow_dispatch:
    inputs:
      full_reindex:
        description: 'Force full re-index of all repos and URLs'
        type: boolean
        default: false
      verify_only:
        description: 'Skip ingestion, just run verification probes (S3 + Postgres)'
        type: boolean
        default: false

jobs:
  trigger-ingestion:
    runs-on: arc-runner-org
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: modules/agent-context/index_content

      - name: Configure kubectl
        run: aws eks update-kubeconfig --name adp-dev-eks-cluster --region us-east-1

      - name: Update ingestion content ConfigMap
        if: ${{ inputs.verify_only != true }}
        run: |
          kubectl create configmap ingestion-content-config \
            --from-file=repos.txt=modules/agent-context/index_content/repos.txt \
            --from-file=urls.txt=modules/agent-context/index_content/urls.txt \
            --from-file=docs.txt=modules/agent-context/index_content/docs.txt \
            --from-file=accounts.txt=modules/agent-context/index_content/accounts.txt \
            -n agent-context --dry-run=client -o yaml | kubectl apply -f -

      - name: Ensure latest ingestion image on CronJob + ScaledJob
        if: ${{ inputs.verify_only != true }}
        env:
          AWS_REGION: us-east-1
          ECR_REGISTRY: 879318057152.dkr.ecr.us-east-1.amazonaws.com
        run: |
          # Resolve the latest ingestion image tag from ECR
          REPO="adp-dev-agent-context-ingestion"
          LATEST_TAG=$(aws ecr describe-images --repository-name "$REPO" \
            --region $AWS_REGION \
            --query 'sort_by(imageDetails,&imagePushedAt)[-1].imageTags[0]' \
            --output text 2>/dev/null || echo "")

          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "None" ]; then
            echo "WARNING: Could not resolve latest ECR tag. Using existing image."
          else
            NEW_IMAGE="${ECR_REGISTRY}/${REPO}:${LATEST_TAG}"
            echo "Latest ingestion image: ${NEW_IMAGE}"

            # Patch CronJob to use latest image
            CURRENT_IMAGE=$(kubectl get cronjob ingestion-refresh -n agent-context \
              -o jsonpath='{.spec.jobTemplate.spec.template.spec.containers[0].image}' 2>/dev/null || echo "")
            echo "Current CronJob image: ${CURRENT_IMAGE}"

            if [ "$CURRENT_IMAGE" != "$NEW_IMAGE" ]; then
              echo "Updating CronJob image..."
              kubectl patch cronjob ingestion-refresh -n agent-context \
                --type='json' \
                -p="[{\"op\":\"replace\",\"path\":\"/spec/jobTemplate/spec/template/spec/containers/0/image\",\"value\":\"${NEW_IMAGE}\"}]"
              echo "✅ CronJob image updated to ${NEW_IMAGE}"
            else
              echo "CronJob already using latest image"
            fi

            # Patch ScaledJob to use latest image (if exists)
            if kubectl get scaledjob ingestion-worker -n agent-context >/dev/null 2>&1; then
              kubectl patch scaledjob ingestion-worker -n agent-context \
                --type='json' \
                -p="[{\"op\":\"replace\",\"path\":\"/spec/jobTargetRef/template/spec/containers/0/image\",\"value\":\"${NEW_IMAGE}\"}]" \
                && echo "✅ ScaledJob image updated to ${NEW_IMAGE}" \
                || echo "WARNING: ScaledJob patch failed (may lack RBAC). Workers will use old image."
            fi
          fi

      - name: Clean up previous job (idempotent)
        if: ${{ inputs.verify_only != true }}
        run: |
          JOB_NAME="manual-refresh-${GITHUB_SHA::8}"
          kubectl delete job "$JOB_NAME" -n agent-context --ignore-not-found

      - name: Trigger ingestion Job
        if: ${{ inputs.verify_only != true }}
        env:
          FULL_REINDEX: ${{ inputs.full_reindex }}
        run: |
          JOB_NAME="manual-refresh-${GITHUB_SHA::8}"
          echo "Creating ingestion job: $JOB_NAME"

          # Issue #2433: Read Neptune endpoint from SSM (published by infra-apply).
          NEPTUNE_EP=$(aws ssm get-parameter \
            --name "/adp/dev/agent-context/neptune-endpoint" \
            --query "Parameter.Value" --output text 2>/dev/null || echo "")
          if [ -z "$NEPTUNE_EP" ]; then
            echo "WARNING: Neptune endpoint not found in SSM. SCIP graph loading will be skipped."
          fi

          if [ "$FULL_REINDEX" = "true" ]; then
            echo "full_reindex=true — injecting FORCE_REINDEX + NEPTUNE env vars"
            # Export the CronJob's job template, inject env vars, and apply
            kubectl get cronjob ingestion-refresh -n agent-context -o json \
              | jq --arg name "$JOB_NAME" --arg neptune_ep "$NEPTUNE_EP" '
                .spec.jobTemplate
                | .metadata.name = $name
                | .metadata.namespace = "agent-context"
                | .apiVersion = "batch/v1"
                | .kind = "Job"
                | .spec.template.spec.containers[0].env += [
                    {"name": "FORCE_REINDEX", "value": "true"},
                    {"name": "NEPTUNE_ENDPOINT", "value": $neptune_ep},
                    {"name": "NEPTUNE_PORT", "value": "8182"},
                    {"name": "SCIP_ENABLED", "value": "true"}
                  ]
              ' \
              | kubectl apply -f -
          else
            # Even without full_reindex, inject Neptune endpoint for SCIP loading
            kubectl get cronjob ingestion-refresh -n agent-context -o json \
              | jq --arg name "$JOB_NAME" --arg neptune_ep "$NEPTUNE_EP" '
                .spec.jobTemplate
                | .metadata.name = $name
                | .metadata.namespace = "agent-context"
                | .apiVersion = "batch/v1"
                | .kind = "Job"
                | .spec.template.spec.containers[0].env += [
                    {"name": "NEPTUNE_ENDPOINT", "value": $neptune_ep},
                    {"name": "NEPTUNE_PORT", "value": "8182"},
                    {"name": "SCIP_ENABLED", "value": "true"}
                  ]
              ' \
              | kubectl apply -f -
          fi

      - name: Wait for Job completion
        if: ${{ inputs.verify_only != true }}
        run: |
          JOB_NAME="manual-refresh-${GITHUB_SHA::8}"
          echo "Waiting for job $JOB_NAME to complete (timeout: 75m)..."
          kubectl wait --for=condition=complete \
            "job/$JOB_NAME" \
            -n agent-context \
            --timeout=4500s || {
              echo "Job did not complete in time. Checking status..."
              kubectl describe "job/$JOB_NAME" -n agent-context
              kubectl logs "job/$JOB_NAME" -n agent-context --tail=50 || true
              exit 1
            }
          echo "Ingestion job completed successfully."

      - name: Verify — S3 artifacts
        run: |
          echo "=== S3: wikis ==="
          aws s3 ls s3://agent-context-platform-data-879318057152/content/wikis/ --region us-east-1 | head -20
          WIKI_COUNT=$(aws s3 ls s3://agent-context-platform-data-879318057152/content/wikis/ --region us-east-1 | wc -l)
          echo "Wiki count: $WIKI_COUNT"

          echo ""
          echo "=== S3: code-indexes ==="
          aws s3 ls s3://agent-context-platform-data-879318057152/content/code-indexes/ --region us-east-1 | head -20
          INDEX_COUNT=$(aws s3 ls s3://agent-context-platform-data-879318057152/content/code-indexes/ --region us-east-1 | wc -l)
          echo "Code-index count: $INDEX_COUNT"

          echo ""
          echo "=== S3: sbom ==="
          aws s3 ls s3://agent-context-platform-data-879318057152/sbom/ --recursive --region us-east-1 | head -20
          SBOM_COUNT=$(aws s3 ls s3://agent-context-platform-data-879318057152/sbom/ --recursive --region us-east-1 | wc -l)
          echo "SBOM count: $SBOM_COUNT"

          echo ""
          echo "=== Summary ==="
          echo "Wikis: $WIKI_COUNT | Code-indexes: $INDEX_COUNT | SBOMs: $SBOM_COUNT"

      - name: Verify — Pod status + latest Job logs
        run: |
          echo "=== Pods ==="
          kubectl get pods -n agent-context -o wide
          echo ""
          echo "=== Recent Jobs ==="
          kubectl get jobs -n agent-context --sort-by='.metadata.creationTimestamp' | tail -5
          echo ""
          echo "=== Latest ingestion Job logs (last 100 lines) ==="
          LATEST_JOB=$(kubectl get jobs -n agent-context --sort-by='.metadata.creationTimestamp' -o jsonpath='{.items[-1].metadata.name}')
          echo "Job: $LATEST_JOB"
          kubectl logs "job/$LATEST_JOB" -n agent-context --tail=100 || echo "(logs unavailable)"

      - name: Verify — Postgres (via in-cluster pod)
        run: |
          echo "=== Postgres verification ==="
          cat > /tmp/verify_db.py << 'PYEOF'
          import os, sys
          sys.path.insert(0, '/app')
          os.environ.setdefault('DB_HOST', 'bedrockgw-dev-postgres.civhekhiupfe.us-east-1.rds.amazonaws.com')
          os.environ.setdefault('DB_NAME', 'agent_context')
          os.environ.setdefault('DB_PORT', '5432')
          os.environ.setdefault('DB_USER', 'agent_context_svc')
          os.environ.setdefault('DB_USE_IAM_AUTH', 'true')
          try:
              import db
              conn = db.get_connection()
              cur = conn.cursor()
              cur.execute("SELECT to_regclass('index_run_stages')")
              print(f'index_run_stages exists: {cur.fetchone()[0]}')
              cur.execute("SELECT to_regclass('index_runs')")
              print(f'index_runs exists: {cur.fetchone()[0]}')
              cur.execute('SELECT stage, status, count(*) FROM index_run_stages GROUP BY 1, 2 ORDER BY 1, 2')
              rows = cur.fetchall()
              print(f'\n=== Stage status summary ({len(rows)} rows) ===')
              for row in rows:
                  print(f'  {row[0]:20s} | {row[1]:12s} | {row[2]}')
              cur.execute('SELECT count(*) FROM dependencies')
              dep_count = cur.fetchone()[0]
              print(f'\nDependency rows: {dep_count}')
              cur.execute('SELECT count(*) FROM index_runs')
              run_count = cur.fetchone()[0]
              print(f'Index runs: {run_count}')
              cur.execute('SELECT id, repo, status FROM index_runs ORDER BY started_at DESC LIMIT 5')
              print('\n=== Recent index runs ===')
              for row in cur.fetchall():
                  print(f'  {row[0][:8]}... | {row[1]:40s} | {row[2]}')
              conn.close()
          except Exception as e:
              print(f'DB verification failed: {e}')
              sys.exit(1)
          PYEOF
          kubectl run verify-db-$(date +%s) \
            --image=879318057152.dkr.ecr.us-east-1.amazonaws.com/adp-dev-agent-context-ingestion:e62ae2c4f721159f2e47bb62ef3813c56bdbebda \
            --restart=Never \
            --rm -i \
            --overrides='{"spec":{"serviceAccountName":"agent-context-sa"}}' \
            -n agent-context \
            --command -- python3 -c "$(cat /tmp/verify_db.py)" 2>&1 || echo "DB check pod failed (may need retry)"
