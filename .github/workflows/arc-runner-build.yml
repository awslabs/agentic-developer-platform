name: ARC Runner Build

# Builds and pushes the custom ADP ARC runner image to ECR.
#
# Chicken-and-egg: runs on the *existing* runner (bare image), which only
# has the `aws` and `zip` we still install inline below. After this workflow
# lands its image, future workflows that opt into the new tag will skip the
# install step entirely.

on:
  push:
    paths:
      - 'platform/arc-runner/**'
      - 'codebuild/bs-arc-runner.yml'
      - '.github/workflows/arc-runner-build.yml'
    branches:
      - main
  workflow_dispatch:
    inputs:
      account_id:
        description: 'Target AWS account (12 digits). Empty = use platform IRSA / config file.'
        required: false
        default: ''
      customer_account_id:
        description: 'Customer-linked AWS account to deploy into (cross-account mode).'
        required: false
        default: ''
      customer_aws_label:
        description: 'Vaulted credential label.'
        required: false
        default: ''
      customer_user_id:
        description: 'ADP users.id UUID.'
        required: false
        default: ''
      environment:
        description: 'Deployment environment.'
        required: false
        default: 'dev'

concurrency:
  group: arc-runner-build-${{ inputs.customer_account_id || inputs.account_id || 'default' }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: dev
  CODEBUILD_PROJECT: adp-dev-arc-runner

jobs:
  build:
    name: Build Custom Runner Image
    runs-on: arc-runner-org
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Load deployment config
        uses: ./.github/actions/load-deploy-config
        with:
          account_id: ${{ inputs.account_id }}
          environment: ${{ inputs.environment }}
          customer_account_id: ${{ inputs.customer_account_id }}
          customer_aws_label: ${{ inputs.customer_aws_label }}
          customer_user_id: ${{ inputs.customer_user_id }}

      # Bootstrap tools until the new runner image ships everywhere.
      - name: Install zip + AWS CLI (bootstrap)
        run: |
          set -e
          if ! command -v zip >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends zip unzip curl
          fi
          if ! command -v aws >/dev/null 2>&1; then
            curl -sL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscli.zip
            unzip -q /tmp/awscli.zip -d /tmp
            sudo /tmp/aws/install
            rm -rf /tmp/awscli.zip /tmp/aws
          fi
          aws --version

      - name: Ensure CodeBuild project
        run: |
          CB_ROLE_NAME="adp-${ENVIRONMENT}-codebuild-role"
          SERVICE_ROLE_ARN=$(aws iam get-role --role-name "$CB_ROLE_NAME" --query 'Role.Arn' --output text 2>/dev/null || echo "")
          if [ -z "$SERVICE_ROLE_ARN" ]; then
            echo "${CB_ROLE_NAME} missing — run platform/scripts/deploy-all.sh once to create it." >&2
            exit 1
          fi
          SOURCE_LOC="${STATE_BUCKET}/codebuild/adp-source.zip"
          EXISTS=$(aws codebuild batch-get-projects --names "${{ env.CODEBUILD_PROJECT }}" --region "${AWS_REGION}" --query 'projects | length(@)' --output text 2>/dev/null || echo "0")
          CMD="create-project"
          [ "$EXISTS" -gt 0 ] && CMD="update-project"
          aws codebuild $CMD --region "${AWS_REGION}" \
            --name "${{ env.CODEBUILD_PROJECT }}" \
            --source "{\"type\":\"S3\",\"location\":\"$SOURCE_LOC\",\"buildspec\":\"codebuild/bs-arc-runner.yml\"}" \
            --artifacts '{"type":"NO_ARTIFACTS"}' \
            --environment '{
              "type":"LINUX_CONTAINER",
              "image":"aws/codebuild/amazonlinux2-x86_64-standard:5.0",
              "computeType":"BUILD_GENERAL1_MEDIUM",
              "privilegedMode":true
            }' \
            --service-role "$SERVICE_ROLE_ARN" > /dev/null

      - name: Build image via CodeBuild
        id: build
        uses: ./.github/actions/codebuild-run
        with:
          project_name: ${{ env.CODEBUILD_PROJECT }}
          region: ${{ env.AWS_REGION }}
          state_bucket: ${{ env.STATE_BUCKET }}
          environment_variables: >-
            "name=AWS_REGION,value=${{ env.AWS_REGION }}"
            "name=ACCOUNT_ID,value=${{ env.CUSTOMER_ACCOUNT_ID || env.ACCOUNT_ID }}"
            "name=REGISTRY,value=${{ env.CUSTOMER_ACCOUNT_ID || env.ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
            "name=IMAGE_TAG,value=${{ github.sha }}"

      - name: Export outputs
        id: build_outputs
        run: |
          EFFECTIVE_ACCOUNT="${CUSTOMER_ACCOUNT_ID:-$ACCOUNT_ID}"
          REGISTRY="${EFFECTIVE_ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "build_id=${{ steps.build.outputs.build_id }}" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/adp-arc-runner:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          echo "## ARC Runner Image Built" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image**: ${{ steps.build_outputs.outputs.image }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **CodeBuild**: ${{ steps.build.outputs.build_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "To roll out, update the ARC scale set's Helm values to point at this image." >> "$GITHUB_STEP_SUMMARY"
