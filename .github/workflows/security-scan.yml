name: Security Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: security-scan-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  ENVIRONMENT: dev
  CHECKOV_VERSION: "3.2.346"
  SEMGREP_VERSION: "1.80.0"
  DETECT_SECRETS_VERSION: "1.5.0"
  GRYPE_VERSION: "0.80.2"
  SYFT_VERSION: "1.11.1"
  BANDIT_VERSION: "1.7.9"
  CFN_NAG_VERSION: "0.8.10"

jobs:
  # ---------- Dynamic discovery for container scanning ----------
  discover-dockerfiles:
    name: Discover Dockerfiles
    runs-on: arc-runner-org
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Find Dockerfiles
        id: find
        run: |
          python3 .github/scripts/discover_dockerfiles.py >> "$GITHUB_OUTPUT"

  # ---------- Job 1: Checkov (IaC) ----------
  checkov:
    name: Checkov (IaC)
    runs-on: arc-runner-org
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Checkov
        run: pip install checkov==${{ env.CHECKOV_VERSION }}

      - name: Run Checkov
        run: |
          checkov \
            --directory . \
            --config-file .github/security/checkov.yml \
            --baseline .github/security/checkov-baseline.json \
            --output sarif \
            --output-file checkov-results.sarif \
            --soft-fail \
            || true

      - name: Upload SARIF to S3
        if: always()
        uses: ./.github/actions/upload-sarif-s3
        with:
          sarif-file: checkov-results.sarif
          tool-name: checkov
          bucket: adp-${{ env.ENVIRONMENT }}-security-scans

      - name: Upload findings artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-findings
          path: checkov-results.sarif
          retention-days: 14

  # ---------- Job 2: Semgrep (SAST) ----------
  semgrep:
    name: Semgrep (SAST)
    runs-on: arc-runner-org
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: pip install semgrep==${{ env.SEMGREP_VERSION }}

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config auto \
            --config .github/security/semgrep.yml \
            --sarif \
            --output semgrep-results.sarif \
            --error \
            || true

      - name: Upload SARIF to S3
        if: always()
        uses: ./.github/actions/upload-sarif-s3
        with:
          sarif-file: semgrep-results.sarif
          tool-name: semgrep
          bucket: adp-${{ env.ENVIRONMENT }}-security-scans

      - name: Upload findings artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-findings
          path: semgrep-results.sarif
          retention-days: 14

  # ---------- Job 3: detect-secrets ----------
  detect-secrets:
    name: detect-secrets
    runs-on: arc-runner-org
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install detect-secrets
        run: pip install detect-secrets==${{ env.DETECT_SECRETS_VERSION }}

      - name: Run detect-secrets
        run: |
          detect-secrets scan \
            --baseline .github/security/.secrets.baseline \
            --list-all-plugins \
            > detect-secrets-results.json \
            || true

      - name: Audit for new secrets
        run: |
          detect-secrets audit --report --json .github/security/.secrets.baseline \
            > detect-secrets-audit.json 2>/dev/null \
            || true

      - name: Upload findings artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detect-secrets-findings
          path: |
            detect-secrets-results.json
            detect-secrets-audit.json
          retention-days: 14

  # ---------- Job 4: Grype (CVE scan via CodeBuild) ----------
  grype:
    name: Grype (CodeBuild)
    runs-on: arc-runner-org
    needs: [discover-dockerfiles]
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Refresh CodeBuild source zip
        run: |
          # CodeBuild reads a snapshot zip; refresh it before triggering.
          # Same pattern as gateway-deploy.yml + arc-runner-build.yml use.
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          STATE_BUCKET="adp-terraform-state-${ACCOUNT_ID}"
          ./platform/scripts/zip-source.sh . /tmp/adp-source.zip
          aws s3 cp /tmp/adp-source.zip "s3://${STATE_BUCKET}/codebuild/adp-source.zip"

      - name: Trigger CodeBuild
        run: |
          BUILD_ID=$(aws codebuild start-build \
            --project-name adp-${{ env.ENVIRONMENT }}-grype-scan \
            --environment-variables-override "name=GRYPE_VERSION,value=${{ env.GRYPE_VERSION }},type=PLAINTEXT" \
            --query 'build.id' --output text)
          echo "BUILD_ID=${BUILD_ID}" >> $GITHUB_ENV
          echo "Started: ${BUILD_ID}"

      - name: Wait for CodeBuild
        run: |
          while true; do
            STATUS=$(aws codebuild batch-get-builds --ids "${BUILD_ID}" \
              --query 'builds[0].buildStatus' --output text)
            echo "$(date +%H:%M:%S) status=${STATUS}"
            case "$STATUS" in
              SUCCEEDED) exit 0 ;;
              FAILED|FAULT|TIMED_OUT|STOPPED)
                aws codebuild batch-get-builds --ids "${BUILD_ID}" \
                  --query 'builds[0].logs.deepLink' --output text
                exit 1 ;;
            esac
            sleep 30
          done

      - name: Pull SARIFs from S3 for Summary job
        if: always()
        run: |
          DATE=$(date -u +%Y/%m/%d)
          BUILD_RUN_ID="${BUILD_ID##*:}"
          mkdir -p grype-findings
          aws s3 sync \
            "s3://adp-${{ env.ENVIRONMENT }}-security-scans/sarif/${DATE}/${BUILD_RUN_ID}/grype/" \
            grype-findings/ || true

          # Surface partial-count but don't fail the job
          COUNT=$(find grype-findings -name '*.sarif' | wc -l)
          EXPECTED=$(find . -name Dockerfile -not -path '*/node_modules/*' -not -path '*/.git/*' -not -path '*/.terraform/*' | wc -l)
          echo "Pulled ${COUNT}/${EXPECTED} SARIFs from S3"
          if [ "${COUNT}" -lt "${EXPECTED}" ]; then
            echo "::warning::Grype SARIF count (${COUNT}) is below Dockerfile count (${EXPECTED}). Some scans may have failed — see CodeBuild logs."
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grype-findings
          path: grype-findings/
          retention-days: 14

  # ---------- Job 5: Bandit (Python SAST) ----------
  bandit:
    name: Bandit (Python)
    runs-on: arc-runner-org
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Bandit
        run: pip install bandit[sarif]==${{ env.BANDIT_VERSION }}

      - name: Run Bandit
        run: |
          bandit -r . \
            --ini .github/security/.banditrc \
            --format sarif \
            --output bandit-results.sarif \
            --exit-zero \
            || true

      - name: Upload SARIF to S3
        if: always()
        uses: ./.github/actions/upload-sarif-s3
        with:
          sarif-file: bandit-results.sarif
          tool-name: bandit
          bucket: adp-${{ env.ENVIRONMENT }}-security-scans

      - name: Upload findings artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-findings
          path: bandit-results.sarif
          retention-days: 14

  # ---------- Job 6: cfn-nag (CloudFormation) ----------
  cfn-nag:
    name: cfn-nag (CloudFormation)
    runs-on: arc-runner-org
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Install cfn-nag
        run: gem install cfn-nag -v ${{ env.CFN_NAG_VERSION }}

      - name: Run cfn-nag
        run: |
          cfn_nag_scan \
            --input-path modules/agent-factory/agent-worker-image/aws/ \
            --deny-list-path .github/security/cfn-nag-suppressions.yml \
            --output-format json \
            > cfn-nag-results.json \
            || true

      - name: Upload findings artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfn-nag-findings
          path: cfn-nag-results.json
          retention-days: 14

  # ---------- Job 7: npm audit ----------
  npm-audit:
    name: npm audit (${{ matrix.package_dir }})
    runs-on: arc-runner-org
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        package_dir:
          - modules/gateway/frontend
          - modules/agent-factory/agent
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run npm audit
        working-directory: ${{ matrix.package_dir }}
        run: |
          npm audit --json --audit-level=high > npm-audit-results.json 2>/dev/null || true

      - name: Set artifact name
        id: name
        run: |
          NAME=$(echo "${{ matrix.package_dir }}" | sed 's|/|-|g')
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload findings artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-findings-${{ steps.name.outputs.name }}
          path: ${{ matrix.package_dir }}/npm-audit-results.json
          retention-days: 14

  # ---------- Job 8: Syft (SBOM) ----------
  syft:
    name: Syft SBOM (${{ matrix.dockerfile }})
    runs-on: ubuntu-latest
    needs: discover-dockerfiles
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        dockerfile: ${{ fromJson(needs.discover-dockerfiles.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image slug
        id: slug
        run: |
          SLUG=$(echo "${{ matrix.dockerfile }}" | sed 's|^\./||;s|/Dockerfile$||;s|/|-|g')
          echo "slug=${SLUG}" >> "$GITHUB_OUTPUT"

      - name: Build image for scanning
        run: |
          docker build -t "scan-target:${{ steps.slug.outputs.slug }}" \
            -f "${{ matrix.dockerfile }}" \
            "$(dirname ${{ matrix.dockerfile }})"

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0
        with:
          syft-version: ${{ env.SYFT_VERSION }}

      - name: Generate SBOM
        run: |
          syft "scan-target:${{ steps.slug.outputs.slug }}" \
            --output cyclonedx-json \
            --file "sbom-${{ steps.slug.outputs.slug }}.cdx.json"

      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ steps.slug.outputs.slug }}
          path: sbom-${{ steps.slug.outputs.slug }}.cdx.json
          retention-days: 14

  # ---------- Summary job ----------
  summary:
    name: Security Summary
    runs-on: arc-runner-org
    if: always() && github.event_name == 'pull_request'
    needs:
      - checkov
      - semgrep
      - detect-secrets
      - grype
      - bandit
      - cfn-nag
      - npm-audit
      - syft
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download all findings artifacts
        uses: actions/download-artifact@v4
        with:
          path: findings/
          pattern: '*-findings*'

      - name: Diff findings against baseline
        run: |
          python3 .github/scripts/diff_security_findings.py \
            --findings-dir findings/ \
            --baseline-dir .github/security/ \
            --output summary.json

      - name: Post PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 .github/scripts/post_security_pr_comment.py \
            --summary summary.json \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}"

  # ---------- Baseline update (nightly only) ----------
  update-baseline:
    name: Update Baselines
    runs-on: arc-runner-org
    if: github.event_name == 'schedule'
    needs:
      - checkov
      - semgrep
      - detect-secrets
      - grype
      - bandit
      - cfn-nag
      - npm-audit
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download all findings artifacts
        uses: actions/download-artifact@v4
        with:
          path: findings/
          pattern: '*-findings*'

      - name: Update baseline files
        id: update
        run: |
          python3 .github/scripts/diff_security_findings.py \
            --findings-dir findings/ \
            --baseline-dir .github/security/ \
            --update-baselines \
            --output baseline-diff.json

          if git diff --quiet .github/security/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create baseline PR
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="chore/security-baseline-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"
          git add .github/security/
          git commit -m "chore(security): refresh baselines $(date +%Y-%m-%d)"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore(security): refresh baselines $(date +%Y-%m-%d)" \
            --body "Automated baseline refresh from nightly security scan. Review and merge to update the known-findings baseline." \
            --base main \
            --head "$BRANCH"
