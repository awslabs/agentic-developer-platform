name: Security Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: security-scan-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  ENVIRONMENT: dev
  CHECKOV_VERSION: "3.2.346"
  SEMGREP_VERSION: "1.80.0"
  DETECT_SECRETS_VERSION: "1.5.0"
  GRYPE_VERSION: "0.80.2"
  SYFT_VERSION: "1.11.1"
  BANDIT_VERSION: "1.7.9"
  CFN_NAG_VERSION: "0.8.10"

jobs:
  # ---------- Dynamic discovery for container scanning ----------
  discover-dockerfiles:
    name: Discover Dockerfiles
    runs-on: arc-runner-org
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Find Dockerfiles
        id: find
        run: |
          python3 .github/scripts/discover_dockerfiles.py >> "$GITHUB_OUTPUT"

  # ---------- Job 1: Checkov (IaC) ----------
  checkov:
    name: Checkov (IaC)
    runs-on: arc-runner-org
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Checkov
        run: pip install checkov==${{ env.CHECKOV_VERSION }}

      - name: Run Checkov
        run: |
          checkov \
            --directory . \
            --config-file .github/security/checkov.yml \
            --baseline .github/security/checkov-baseline.json \
            --output sarif \
            --output-file checkov-results.sarif \
            --soft-fail \
            || true

      - name: Upload SARIF to S3
        if: always()
        uses: ./.github/actions/upload-sarif-s3
        with:
          sarif-file: checkov-results.sarif
          tool-name: checkov
          bucket: adp-${{ env.ENVIRONMENT }}-security-scans

      - name: Upload findings artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-findings
          path: checkov-results.sarif
          retention-days: 14

  # ---------- Job 2: Semgrep (SAST) ----------
  semgrep:
    name: Semgrep (SAST)
    runs-on: arc-runner-org
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Semgrep
        # `pkg_resources` was removed from setuptools in 80+. Semgrep's
        # transitive dep `opentelemetry.instrumentation.dependencies`
        # imports it, so a fresh `pip install semgrep` (which pulls in
        # latest setuptools as a transitive dep) crashes at run time.
        # Pin setuptools to <80 to keep pkg_resources available, AFTER
        # the semgrep install so pip can't downgrade it.
        run: |
          pip install semgrep==${{ env.SEMGREP_VERSION }}
          pip install 'setuptools<80'

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config auto \
            --config .github/security/semgrep.yml \
            --sarif \
            --output semgrep-results.sarif \
            --error \
            || true

      - name: Upload SARIF to S3
        if: always()
        uses: ./.github/actions/upload-sarif-s3
        with:
          sarif-file: semgrep-results.sarif
          tool-name: semgrep
          bucket: adp-${{ env.ENVIRONMENT }}-security-scans

      - name: Upload findings artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-findings
          path: semgrep-results.sarif
          retention-days: 14

  # ---------- Job 3: detect-secrets ----------
  detect-secrets:
    name: detect-secrets
    runs-on: arc-runner-org
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install detect-secrets
        run: pip install detect-secrets==${{ env.DETECT_SECRETS_VERSION }}

      - name: Run detect-secrets
        run: |
          detect-secrets scan \
            --baseline .github/security/.secrets.baseline \
            --list-all-plugins \
            > detect-secrets-results.json \
            || true

      - name: Audit for new secrets
        run: |
          detect-secrets audit --report --json .github/security/.secrets.baseline \
            > detect-secrets-audit.json 2>/dev/null \
            || true

      - name: Upload findings artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detect-secrets-findings
          path: |
            detect-secrets-results.json
            detect-secrets-audit.json
          retention-days: 14

  # ---------- Job 4: Grype (CVE scan via CodeBuild) ----------
  grype:
    name: Grype (CodeBuild)
    runs-on: arc-runner-org
    needs: [discover-dockerfiles]
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve deploy vars
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "STATE_BUCKET=adp-terraform-state-${ACCOUNT_ID}" >> $GITHUB_ENV
          echo "AWS_REGION=${AWS_REGION:-us-east-1}" >> $GITHUB_ENV

      - name: Run grype scan via CodeBuild
        id: grype_build
        uses: ./.github/actions/codebuild-run
        with:
          project_name: adp-${{ env.ENVIRONMENT }}-grype-scan
          region: ${{ env.AWS_REGION }}
          state_bucket: ${{ env.STATE_BUCKET }}
          environment_variables: '"name=GRYPE_VERSION,value=${{ env.GRYPE_VERSION }},type=PLAINTEXT"'
          poll_interval: '30'

      - name: Pull SARIFs from S3 for Summary job
        if: always()
        run: |
          BUILD_ID="${{ steps.grype_build.outputs.build_id }}"
          DATE=$(date -u +%Y/%m/%d)
          BUILD_RUN_ID="${BUILD_ID##*:}"
          mkdir -p grype-findings
          aws s3 sync \
            "s3://adp-${{ env.ENVIRONMENT }}-security-scans/sarif/${DATE}/${BUILD_RUN_ID}/grype/" \
            grype-findings/ || true

          # Surface partial-count but don't fail the job
          COUNT=$(find grype-findings -name '*.sarif' | wc -l)
          EXPECTED=$(find . -name Dockerfile -not -path '*/node_modules/*' -not -path '*/.git/*' -not -path '*/.terraform/*' | wc -l)
          echo "Pulled ${COUNT}/${EXPECTED} SARIFs from S3"
          if [ "${COUNT}" -lt "${EXPECTED}" ]; then
            echo "::warning::Grype SARIF count (${COUNT}) is below Dockerfile count (${EXPECTED}). Some scans may have failed — see CodeBuild logs."
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grype-findings
          path: grype-findings/
          retention-days: 14

  # ---------- Job 5: Bandit (Python SAST) ----------
  bandit:
    name: Bandit (Python)
    runs-on: arc-runner-org
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Bandit
        run: pip install bandit[sarif]==${{ env.BANDIT_VERSION }}

      - name: Run Bandit
        run: |
          bandit -r . \
            --ini .github/security/.banditrc \
            -x './modules/gateway/tests,./modules/agent-factory/tests,./modules/agent-factory/agent-worker-image/tests,./modules/agent-factory/webhook-ingress/lambda/common/tests,./modules/agent-factory/webhook-ingress/lambda/github/tests,./modules/gateway/lambda/github-auth-broker/tests,./modules/agent-context/tests' \
            --format sarif \
            --output bandit-results.sarif \
            --exit-zero \
            || true

      - name: Upload SARIF to S3
        if: always()
        uses: ./.github/actions/upload-sarif-s3
        with:
          sarif-file: bandit-results.sarif
          tool-name: bandit
          bucket: adp-${{ env.ENVIRONMENT }}-security-scans

      - name: Upload findings artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-findings
          path: bandit-results.sarif
          retention-days: 14

  # ---------- Job 6: cfn-nag (CloudFormation) ----------
  cfn-nag:
    name: cfn-nag (CloudFormation)
    runs-on: arc-runner-org
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Ruby + cfn-nag
        run: |
          sudo apt-get update -qq
          # ruby-full + ruby-dev + build-essential + libyaml-dev so gems
          # with native extensions (psych -> yaml.h) compile cleanly.
          sudo apt-get install -y --no-install-recommends \
            ruby-full ruby-dev build-essential libyaml-dev
          sudo gem install cfn-nag -v ${{ env.CFN_NAG_VERSION }}

      - name: Run cfn-nag
        run: |
          cfn_nag_scan \
            --input-path modules/agent-factory/agent-worker-image/aws/ \
            --deny-list-path .github/security/cfn-nag-suppressions.yml \
            --output-format json \
            > cfn-nag-results.json \
            || true

      - name: Upload findings artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cfn-nag-findings
          path: cfn-nag-results.json
          retention-days: 14

  # ---------- Job 7: npm audit ----------
  npm-audit:
    name: npm audit (${{ matrix.package_dir }})
    runs-on: arc-runner-org
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        package_dir:
          - modules/gateway/frontend
          - modules/agent-factory/agent
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run npm audit
        working-directory: ${{ matrix.package_dir }}
        run: |
          npm audit --json --audit-level=high > npm-audit-results.json 2>/dev/null || true

      - name: Set artifact name
        id: name
        run: |
          NAME=$(echo "${{ matrix.package_dir }}" | sed 's|/|-|g')
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload findings artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-findings-${{ steps.name.outputs.name }}
          path: ${{ matrix.package_dir }}/npm-audit-results.json
          retention-days: 14

  # ---------- Job 8: Syft (SBOM via CodeBuild) ----------
  syft:
    name: Syft (CodeBuild)
    runs-on: arc-runner-org
    needs: [discover-dockerfiles]
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve deploy vars
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "STATE_BUCKET=adp-terraform-state-${ACCOUNT_ID}" >> $GITHUB_ENV
          echo "AWS_REGION=${AWS_REGION:-us-east-1}" >> $GITHUB_ENV

      - name: Run syft scan via CodeBuild
        id: syft_build
        uses: ./.github/actions/codebuild-run
        with:
          project_name: adp-${{ env.ENVIRONMENT }}-syft-scan
          region: ${{ env.AWS_REGION }}
          state_bucket: ${{ env.STATE_BUCKET }}
          environment_variables: '"name=SYFT_VERSION,value=${{ env.SYFT_VERSION }},type=PLAINTEXT"'
          poll_interval: '30'

      - name: Pull SBOMs from S3
        if: always()
        run: |
          BUILD_ID="${{ steps.syft_build.outputs.build_id }}"
          DATE=$(date -u +%Y/%m/%d)
          BUILD_RUN_ID="${BUILD_ID##*:}"
          mkdir -p sbom-findings
          aws s3 sync \
            "s3://adp-${{ env.ENVIRONMENT }}-security-scans/sbom/${DATE}/${BUILD_RUN_ID}/" \
            sbom-findings/ || true

          # Surface partial-count but don't fail the job
          COUNT=$(find sbom-findings -name '*.cdx.json' | wc -l)
          EXPECTED=$(find . -name Dockerfile -not -path '*/node_modules/*' -not -path '*/.git/*' -not -path '*/.terraform/*' | wc -l)
          echo "Pulled ${COUNT}/${EXPECTED} SBOMs from S3"
          if [ "${COUNT}" -lt "${EXPECTED}" ]; then
            echo "::warning::Syft SBOM count (${COUNT}) is below Dockerfile count (${EXPECTED}). Some scans may have failed — see CodeBuild logs."
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom-findings
          path: sbom-findings/
          retention-days: 14

  # ---------- Summary job ----------
  summary:
    name: Security Summary
    runs-on: arc-runner-org
    if: always() && github.event_name == 'pull_request'
    needs:
      - checkov
      - semgrep
      - detect-secrets
      - grype
      - bandit
      - cfn-nag
      - npm-audit
      - syft
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download all findings artifacts
        uses: actions/download-artifact@v4
        with:
          path: findings/
          pattern: '*-findings*'

      - name: Diff findings against baseline
        run: |
          python3 .github/scripts/diff_security_findings.py \
            --findings-dir findings/ \
            --baseline-dir .github/security/ \
            --output summary.json

      - name: Post PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 .github/scripts/post_security_pr_comment.py \
            --summary summary.json \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}"

  # ---------- Baseline update (nightly only) ----------
  update-baseline:
    name: Update Baselines
    runs-on: arc-runner-org
    if: github.event_name == 'schedule'
    needs:
      - checkov
      - semgrep
      - detect-secrets
      - grype
      - bandit
      - cfn-nag
      - npm-audit
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download all findings artifacts
        uses: actions/download-artifact@v4
        with:
          path: findings/
          pattern: '*-findings*'

      - name: Update baseline files
        id: update
        run: |
          python3 .github/scripts/diff_security_findings.py \
            --findings-dir findings/ \
            --baseline-dir .github/security/ \
            --update-baselines \
            --output baseline-diff.json

          if git diff --quiet .github/security/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create baseline PR
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="chore/security-baseline-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"
          git add .github/security/
          git commit -m "chore(security): refresh baselines $(date +%Y-%m-%d)"
          git push origin "$BRANCH"
          gh pr create \
            --title "chore(security): refresh baselines $(date +%Y-%m-%d)" \
            --body "Automated baseline refresh from nightly security scan. Review and merge to update the known-findings baseline." \
            --base main \
            --head "$BRANCH"
