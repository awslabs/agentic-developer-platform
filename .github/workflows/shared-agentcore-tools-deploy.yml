name: Build and plan shared AgentCore tools
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Reviewed full commit SHA on the default branch
        required: true
        type: string
      target_environment:
        description: Protected deployment environment
        required: true
        type: choice
        default: dev
        options: [dev, prod]
      expected_account_id:
        description: Confirmed 12-digit AWS account
        required: true
        type: string
      aws_region:
        description: Approved AWS region
        required: true
        type: string
      lambda_repository:
        description: Exact shared Lambda ECR repository URI (no tag)
        required: true
        type: string
      browser_repository:
        description: Exact shared Browser ECR repository URI (no tag)
        required: true
        type: string
      mode:
        description: CodeBuild without publication + plan, or explicit publish + saved-plan apply
        required: true
        default: plan
        type: choice
        options: [plan, apply]
permissions:
  contents: read
  id-token: write
concurrency:
  group: shared-agentcore-tools-${{ inputs.target_environment }}
  cancel-in-progress: false
jobs:
  tools:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: arc-runner-org
    environment: adp-shared-tools-deploy-${{ inputs.target_environment }}
    timeout-minutes: 90
    env:
      STATE_BUCKET: ${{ vars.ADP_SHARED_TOOLS_STATE_BUCKET }}
      CODEBUILD_PROJECT: ${{ vars.ADP_SHARED_TOOLS_CODEBUILD_PROJECT }}
      ARTIFACT_KEY: codebuild/artifacts/shared-agentcore-tools/${{ github.run_id }}-${{ github.run_attempt }}.env
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify reviewed source before reading protected bindings
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ && "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          git merge-base --is-ancestor "$SOURCE_SHA" "origin/${{ github.event.repository.default_branch }}"
      - name: Materialize protected existing state and reviewed variables
        env:
          BACKEND_HCL: ${{ secrets.ADP_SHARED_TOOLS_BACKEND_HCL }}
          TFVARS_HCL: ${{ secrets.ADP_SHARED_TOOLS_TFVARS_HCL }}
          STATE_KEY: ${{ vars.ADP_SHARED_TOOLS_STATE_KEY }}
          STATE_LOCK_TABLE: ${{ vars.ADP_SHARED_TOOLS_LOCK_TABLE }}
          EXPECTED_AWS_ACCOUNT_ID: ${{ inputs.expected_account_id }}
          AWS_REGION: ${{ inputs.aws_region }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
        run: |
          set -euo pipefail
          umask 077
          export BACKEND="$RUNNER_TEMP/shared-tools-backend.hcl"
          export TFVARS="$RUNNER_TEMP/shared-tools.tfvars"
          [[ -n "$BACKEND_HCL" && -n "$TFVARS_HCL" && -n "$STATE_KEY" ]] || {
            echo 'Coordinator: configure the approved shared-tools backend, variables and existing state key in this protected environment' >&2
            exit 2
          }
          printf '%s' "$BACKEND_HCL" > "$BACKEND"
          printf '%s' "$TFVARS_HCL" > "$TFVARS"
          python3 modules/tools/agentcore/infra/validate_private_config.py "$BACKEND" "$TFVARS"
          printf 'BACKEND=%s\nTFVARS=%s\n' "$BACKEND" "$TFVARS" >> "$GITHUB_ENV"
      - name: Verify immutable reviewed source, build trust and isolated state
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          EXPECTED_AWS_ACCOUNT_ID: ${{ inputs.expected_account_id }}
          AWS_REGION: ${{ inputs.aws_region }}
          LAMBDA_REPO: ${{ inputs.lambda_repository }}
          BROWSER_REPO: ${{ inputs.browser_repository }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ && "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          git merge-base --is-ancestor "$SOURCE_SHA" "origin/${{ github.event.repository.default_branch }}"
          [[ "$EXPECTED_AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ && "$AWS_REGION" =~ ^[a-z0-9-]+$ ]]
          [[ "$STATE_BUCKET" =~ ^[a-z0-9.-]+$ && "$CODEBUILD_PROJECT" =~ ^[a-zA-Z0-9_-]+$ ]]
          [[ "$CODEBUILD_PROJECT" == "adp-${{ inputs.target_environment }}-shared-tools-build" ]]
          [[ "$MODE" == plan || "$MODE" == apply ]]
          for repo in "$LAMBDA_REPO" "$BROWSER_REPO"; do
            [[ "$repo" =~ ^${EXPECTED_AWS_ACCOUNT_ID}\.dkr\.ecr\.${AWS_REGION}\.amazonaws\.com/[a-zA-Z0-9_./-]+$ ]]
          done
          test -f "$BACKEND" && test -f "$TFVARS"
      - name: Establish protected deployment identity
        uses: ./.github/actions/trusted-deployment
        with:
          role_arn: ${{ vars.ADP_SHARED_TOOLS_DEPLOY_ROLE_ARN }}
          region: ${{ inputs.aws_region }}
      - name: Confirm active AWS account and existing scoped CodeBuild project
        env:
          EXPECTED_AWS_ACCOUNT_ID: ${{ inputs.expected_account_id }}
          AWS_REGION: ${{ inputs.aws_region }}
        run: |
          set -euo pipefail
          [[ "$(aws sts get-caller-identity --query Account --output text)" == "$EXPECTED_AWS_ACCOUNT_ID" ]]
          [[ "$(aws codebuild batch-get-projects --names "$CODEBUILD_PROJECT" --region "$AWS_REGION" --query 'length(projects)' --output text)" == 1 ]]
          command -v aws && command -v jq
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.14.6'
          terraform_wrapper: false
      - name: Build images from source-pinned archive (publish only on apply)
        uses: ./.github/actions/codebuild-run
        with:
          project_name: ${{ env.CODEBUILD_PROJECT }}
          state_bucket: ${{ env.STATE_BUCKET }}
          region: ${{ inputs.aws_region }}
          source_revision: ${{ inputs.source_sha }}
          buildspec: modules/tools/agentcore/infra/buildspec.yml
          environment_variables: '"name=BUILD_MODE,value=${{ inputs.mode }}" "name=EXPECTED_AWS_ACCOUNT_ID,value=${{ inputs.expected_account_id }}" "name=AWS_REGION,value=${{ inputs.aws_region }}" "name=LAMBDA_REPO,value=${{ inputs.lambda_repository }}" "name=BROWSER_REPO,value=${{ inputs.browser_repository }}" "name=STATE_BUCKET,value=${{ env.STATE_BUCKET }}" "name=ARTIFACT_KEY,value=${{ env.ARTIFACT_KEY }}"'
      - name: Resolve only approved immutable image digests for apply
        if: inputs.mode == 'apply'
        env:
          EXPECTED_AWS_ACCOUNT_ID: ${{ inputs.expected_account_id }}
          AWS_REGION: ${{ inputs.aws_region }}
          LAMBDA_REPO: ${{ inputs.lambda_repository }}
          BROWSER_REPO: ${{ inputs.browser_repository }}
        run: |
          set -euo pipefail
          umask 077
          record="$RUNNER_TEMP/shared-tools-images.env"
          aws s3 cp "s3://$STATE_BUCKET/$ARTIFACT_KEY" "$record" --region "$AWS_REGION" >/dev/null
          [[ "$(wc -l < "$record")" -eq 2 ]]
          lambda_ref=$(sed -n 's/^TF_VAR_image_uri=//p' "$record")
          browser_ref=$(sed -n 's/^TF_VAR_browser_service_image=//p' "$record")
          [[ "$lambda_ref" =~ ^${LAMBDA_REPO}@sha256:[a-f0-9]{64}$ ]]
          [[ "$browser_ref" =~ ^${BROWSER_REPO}@sha256:[a-f0-9]{64}$ ]]
          printf 'TF_VAR_image_uri=%s\nTF_VAR_browser_service_image=%s\n' "$lambda_ref" "$browser_ref" >> "$GITHUB_ENV"
          rm -f "$record"
      - name: Configure the existing Browser cluster when enabled
        if: vars.ADP_TOOLS_EKS_CLUSTER_NAME != ''
        env:
          CLUSTER_NAME: ${{ vars.ADP_TOOLS_EKS_CLUSTER_NAME }}
          AWS_REGION: ${{ inputs.aws_region }}
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/shared-tools-kubeconfig"
          aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION" --kubeconfig "$config"
          chmod 600 "$config"
          printf 'KUBE_CONFIG_PATH=%s\n' "$config" >> "$GITHUB_ENV"
      - name: Plan isolated state with no deletion or replacement
        id: shared_plan
        env:
          EXPECTED_AWS_ACCOUNT_ID: ${{ inputs.expected_account_id }}
        run: bash modules/tools/agentcore/infra/deploy.sh plan "$BACKEND" "$TFVARS" "$RUNNER_TEMP/shared-tools.tfplan"
      - name: Retain plan diagnostics in the protected state bucket
        if: always() && (steps.shared_plan.outcome == 'failure' || (inputs.mode == 'plan' && steps.shared_plan.outcome == 'success'))
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          WORKFLOW_REVISION: ${{ github.workflow_sha }}
          RELEASE_MODE: ${{ inputs.mode }}
          EXPECTED_AWS_ACCOUNT_ID: ${{ inputs.expected_account_id }}
          EXPECTED_DEPLOY_ROLE_ARN: ${{ vars.ADP_SHARED_TOOLS_DEPLOY_ROLE_ARN }}
          AWS_REGION: ${{ inputs.aws_region }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          STATE_KEY: ${{ vars.ADP_SHARED_TOOLS_STATE_KEY }}
          STATE_LOCK_TABLE: ${{ vars.ADP_SHARED_TOOLS_LOCK_TABLE }}
          PLAN_OUTCOME: ${{ steps.shared_plan.outcome }}
        run: |
          set -euo pipefail
          export SAVED_PLAN_FILE="$RUNNER_TEMP/shared-tools.tfplan"
          python3 modules/tools/agentcore/infra/shared_plan_evidence.py
      - name: Explicitly apply the reviewed saved plan
        if: inputs.mode == 'apply'
        env:
          EXPECTED_AWS_ACCOUNT_ID: ${{ inputs.expected_account_id }}
        run: bash modules/tools/agentcore/infra/deploy.sh apply "$BACKEND" "$RUNNER_TEMP/shared-tools.tfplan"
      - name: Verify applied Lambda and Browser runtime and retain private receipt
        if: inputs.mode == 'apply'
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          WORKFLOW_REVISION: ${{ github.workflow_sha }}
          RELEASE_MODE: ${{ inputs.mode }}
          EXPECTED_AWS_ACCOUNT_ID: ${{ inputs.expected_account_id }}
          AWS_REGION: ${{ inputs.aws_region }}
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          LAMBDA_REPO: ${{ inputs.lambda_repository }}
          BROWSER_REPO: ${{ inputs.browser_repository }}
          STATE_KEY: ${{ vars.ADP_SHARED_TOOLS_STATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          [[ -n "${KUBE_CONFIG_PATH:-}" && -f "$KUBE_CONFIG_PATH" ]]
          export KUBECONFIG="$KUBE_CONFIG_PATH"
          export SHARED_RECEIPT_FILE="$RUNNER_TEMP/shared-tools-runtime-receipt.json"
          python3 modules/tools/agentcore/infra/shared_receipt.py
          receipt_key="codebuild/artifacts/shared-agentcore-tools/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.receipt.json"
          aws s3api put-object --bucket "$STATE_BUCKET" --key "$receipt_key" \
            --body "$SHARED_RECEIPT_FILE" --if-none-match '*' --region "$AWS_REGION" >/dev/null
          echo 'Independent shared Lambda and Browser runtime receipt saved in protected state bucket'
      - name: Remove temporary deployment files
        if: always()
        run: rm -f "$RUNNER_TEMP/shared-tools-kubeconfig" "$RUNNER_TEMP/shared-tools.tfplan" "$RUNNER_TEMP/shared-tools-images.env" "$RUNNER_TEMP/shared-tools-backend.hcl" "$RUNNER_TEMP/shared-tools.tfvars" "$RUNNER_TEMP/shared-tools-runtime-receipt.json" "$RUNNER_TEMP/shared-tools-plan-diagnostic.json" "$RUNNER_TEMP/shared-tools-plan-evidence.json"
