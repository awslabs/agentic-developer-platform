name: Build and plan shared AgentCore tools
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Reviewed full commit SHA on the default branch
        required: true
        type: string
      target_environment:
        description: Protected deployment environment
        required: true
        type: environment
      expected_account_id:
        description: Confirmed 12-digit AWS account
        required: true
        type: string
      aws_region:
        description: Approved AWS region
        required: true
        type: string
      backend_config:
        description: Repository-relative isolated tools S3 backend configuration
        required: true
        type: string
      tfvars:
        description: Repository-relative reviewed tools Terraform variables
        required: true
        type: string
      lambda_repository:
        description: Exact shared Lambda ECR repository URI (no tag)
        required: true
        type: string
      browser_repository:
        description: Exact shared Browser ECR repository URI (no tag)
        required: true
        type: string
      mode:
        description: CodeBuild without publication + plan, or explicit publish + saved-plan apply
        required: true
        default: plan
        type: choice
        options: [plan, apply]
permissions:
  contents: read
  id-token: write
concurrency:
  group: shared-agentcore-tools-${{ inputs.target_environment }}
  cancel-in-progress: false
jobs:
  tools:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: arc-runner-org
    environment: ${{ inputs.target_environment }}
    timeout-minutes: 90
    env:
      STATE_BUCKET: ${{ vars.ADP_TOOLS_BUILD_BUCKET }}
      CODEBUILD_PROJECT: ${{ vars.ADP_TOOLS_CODEBUILD_PROJECT }}
      ARTIFACT_KEY: codebuild/artifacts/shared-agentcore-tools/${{ github.run_id }}-${{ github.run_attempt }}.env
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify immutable reviewed source, build trust and isolated state
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          EXPECTED_AWS_ACCOUNT_ID: ${{ inputs.expected_account_id }}
          AWS_REGION: ${{ inputs.aws_region }}
          LAMBDA_REPO: ${{ inputs.lambda_repository }}
          BROWSER_REPO: ${{ inputs.browser_repository }}
          BACKEND: ${{ inputs.backend_config }}
          TFVARS: ${{ inputs.tfvars }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ && "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]
          git merge-base --is-ancestor "$SOURCE_SHA" "origin/${{ github.event.repository.default_branch }}"
          [[ "$EXPECTED_AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ && "$AWS_REGION" =~ ^[a-z0-9-]+$ ]]
          [[ "$STATE_BUCKET" =~ ^[a-z0-9.-]+$ && "$CODEBUILD_PROJECT" =~ ^[a-zA-Z0-9_-]+$ ]]
          [[ "$MODE" == plan || "$MODE" == apply ]]
          for repo in "$LAMBDA_REPO" "$BROWSER_REPO"; do
            [[ "$repo" =~ ^${EXPECTED_AWS_ACCOUNT_ID}\.dkr\.ecr\.${AWS_REGION}\.amazonaws\.com/[a-zA-Z0-9_./-]+$ ]]
          done
          for path in "$BACKEND" "$TFVARS"; do
            [[ "$path" =~ ^[a-zA-Z0-9_./-]+$ && "$path" != /* && "$path" != *..* ]]
            test -f "$path"
            git ls-files --error-unmatch "$path" >/dev/null
          done
          grep -Eq '^[[:space:]]*key[[:space:]]*=[[:space:]]*"[^"[:space:]]*tools/agentcore/[^"[:space:]]+"' "$BACKEND"
          backend_bucket=$(sed -n 's/^[[:space:]]*bucket[[:space:]]*=[[:space:]]*"\([^"[:space:]]*\)".*/\1/p' "$BACKEND")
          [[ "$backend_bucket" == "$STATE_BUCKET" ]]
      - name: Establish protected deployment identity
        uses: ./.github/actions/trusted-deployment
        with:
          role_arn: ${{ vars.ADP_DEPLOY_ROLE_ARN }}
          region: ${{ inputs.aws_region }}
      - name: Confirm active AWS account and existing scoped CodeBuild project
        env:
          EXPECTED_AWS_ACCOUNT_ID: ${{ inputs.expected_account_id }}
          AWS_REGION: ${{ inputs.aws_region }}
        run: |
          set -euo pipefail
          [[ "$(aws sts get-caller-identity --query Account --output text)" == "$EXPECTED_AWS_ACCOUNT_ID" ]]
          [[ "$(aws codebuild batch-get-projects --names "$CODEBUILD_PROJECT" --region "$AWS_REGION" --query 'length(projects)' --output text)" == 1 ]]
          command -v aws && command -v jq
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.9.8'
          terraform_wrapper: false
      - name: Build images from source-pinned archive (publish only on apply)
        uses: ./.github/actions/codebuild-run
        with:
          project_name: ${{ env.CODEBUILD_PROJECT }}
          state_bucket: ${{ env.STATE_BUCKET }}
          region: ${{ inputs.aws_region }}
          source_revision: ${{ inputs.source_sha }}
          buildspec: modules/tools/agentcore/infra/buildspec.yml
          environment_variables: '"name=BUILD_MODE,value=${{ inputs.mode }}" "name=EXPECTED_AWS_ACCOUNT_ID,value=${{ inputs.expected_account_id }}" "name=AWS_REGION,value=${{ inputs.aws_region }}" "name=LAMBDA_REPO,value=${{ inputs.lambda_repository }}" "name=BROWSER_REPO,value=${{ inputs.browser_repository }}" "name=STATE_BUCKET,value=${{ env.STATE_BUCKET }}" "name=ARTIFACT_KEY,value=${{ env.ARTIFACT_KEY }}"'
      - name: Resolve only approved immutable image digests for apply
        if: inputs.mode == 'apply'
        env:
          EXPECTED_AWS_ACCOUNT_ID: ${{ inputs.expected_account_id }}
          AWS_REGION: ${{ inputs.aws_region }}
          LAMBDA_REPO: ${{ inputs.lambda_repository }}
          BROWSER_REPO: ${{ inputs.browser_repository }}
        run: |
          set -euo pipefail
          umask 077
          record="$RUNNER_TEMP/shared-tools-images.env"
          aws s3 cp "s3://$STATE_BUCKET/$ARTIFACT_KEY" "$record" --region "$AWS_REGION" >/dev/null
          [[ "$(wc -l < "$record")" -eq 2 ]]
          lambda_ref=$(sed -n 's/^TF_VAR_image_uri=//p' "$record")
          browser_ref=$(sed -n 's/^TF_VAR_browser_service_image=//p' "$record")
          [[ "$lambda_ref" =~ ^${LAMBDA_REPO}@sha256:[a-f0-9]{64}$ ]]
          [[ "$browser_ref" =~ ^${BROWSER_REPO}@sha256:[a-f0-9]{64}$ ]]
          printf 'TF_VAR_image_uri=%s\nTF_VAR_browser_service_image=%s\n' "$lambda_ref" "$browser_ref" >> "$GITHUB_ENV"
          rm -f "$record"
      - name: Configure the existing Browser cluster when enabled
        if: vars.ADP_TOOLS_EKS_CLUSTER_NAME != ''
        env:
          CLUSTER_NAME: ${{ vars.ADP_TOOLS_EKS_CLUSTER_NAME }}
          AWS_REGION: ${{ inputs.aws_region }}
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/shared-tools-kubeconfig"
          aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION" --kubeconfig "$config"
          chmod 600 "$config"
          printf 'KUBE_CONFIG_PATH=%s\n' "$config" >> "$GITHUB_ENV"
      - name: Plan isolated state with no deletion or replacement
        env:
          EXPECTED_AWS_ACCOUNT_ID: ${{ inputs.expected_account_id }}
          BACKEND: ${{ inputs.backend_config }}
          TFVARS: ${{ inputs.tfvars }}
        run: bash modules/tools/agentcore/infra/deploy.sh plan "$BACKEND" "$TFVARS" "$RUNNER_TEMP/shared-tools.tfplan"
      - name: Explicitly apply the reviewed saved plan
        if: inputs.mode == 'apply'
        env:
          EXPECTED_AWS_ACCOUNT_ID: ${{ inputs.expected_account_id }}
          BACKEND: ${{ inputs.backend_config }}
        run: bash modules/tools/agentcore/infra/deploy.sh apply "$BACKEND" "$RUNNER_TEMP/shared-tools.tfplan"
      - name: Remove temporary deployment files
        if: always()
        run: rm -f "$RUNNER_TEMP/shared-tools-kubeconfig" "$RUNNER_TEMP/shared-tools.tfplan" "$RUNNER_TEMP/shared-tools-images.env"
