name: Persona model rollout — non-enforcing readiness

on:
  pull_request:
    paths:
      - 'platform/evals/persona-model-rollout/**'
      - '.github/workflows/persona-model-rollout-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate PMM-09 evidence contract
    runs-on: ${{ vars.ARC_RUNNER_LABEL || 'arc-runner-org' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Validate approved 25-cell manifest
        run: python3 platform/evals/persona-model-rollout/rollout_gate.py validate-manifest

      - name: Prove the empty report stays non-enforcing and incomplete
        run: |
          python3 platform/evals/persona-model-rollout/rollout_gate.py template > "$RUNNER_TEMP/pmm09-evidence.json"
          if python3 platform/evals/persona-model-rollout/rollout_gate.py assess "$RUNNER_TEMP/pmm09-evidence.json" > "$RUNNER_TEMP/pmm09-report.json"; then
            echo '::error::An empty evidence template unexpectedly passed structural validation'
            exit 1
          fi
          jq -e '.complete == false and .enforcement_ready == false' "$RUNNER_TEMP/pmm09-report.json"

      - name: Run validator regression tests
        run: python3 -m unittest discover -s platform/evals/persona-model-rollout/tests -v

      - name: Safety summary
        run: |
          echo '## PMM-09 non-enforcing readiness' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '- Matrix contract: L1–L25' >> "$GITHUB_STEP_SUMMARY"
          echo '- Model invocations: none' >> "$GITHUB_STEP_SUMMARY"
          echo '- Deployment mutations: none' >> "$GITHUB_STEP_SUMMARY"
          echo '- Enforcement posture changes: none' >> "$GITHUB_STEP_SUMMARY"
          echo '- Live/account/spend gates: still required' >> "$GITHUB_STEP_SUMMARY"
