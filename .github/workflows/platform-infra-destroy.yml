name: Platform Infra Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "platform" to confirm destruction'
        required: true
        type: string
      customer_account_id:
        description: 'Customer-linked AWS account to destroy in (cross-account mode).'
        required: false
        default: ''
      customer_aws_label:
        description: 'Vaulted credential label (when customer_account_id is set).'
        required: false
        default: ''
      customer_user_id:
        description: 'ADP users.id UUID (when customer_account_id is set).'
        required: false
        default: ''
      environment:
        description: 'Deployment environment (dev/staging/prod).'
        required: false
        default: 'dev'

concurrency:
  group: tf-apply-platform-${{ inputs.customer_account_id || 'default' }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_VAR_environment: dev
  ENVIRONMENT: dev
  MODULE_NAME: platform
  TF_WORKING_DIR: platform/infra
  BACKEND_CONFIG: environments/dev/backend.tfvars
  VAR_FILE: environments/dev/platform.tfvars

jobs:
  destroy:
    name: Destroy Platform Infrastructure
    if: github.ref == 'refs/heads/main'
    runs-on: arc-runner-org
    environment: adp-deploy-${{ inputs.environment || 'dev' }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Confirm module name
        env:
          ADP_INPUT_226C03454D: ${{ inputs.confirm }}
        run: |
          if [ "${ADP_INPUT_226C03454D}" != "platform" ]; then
            echo "::error::Input did not match 'platform'. Aborting to prevent accidental destroy."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify source belongs to reviewed main history
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$GITHUB_SHA"
          git merge-base --is-ancestor HEAD FETCH_HEAD

      - name: Establish trusted deployment identity
        uses: ./.github/actions/trusted-deployment
        with:
          role_arn: ${{ vars.ADP_DEPLOY_ROLE_ARN }}
          region: ${{ vars.ADP_DEPLOY_REGION || 'us-east-1' }}

      - name: Load deployment config
        uses: ./.github/actions/load-deploy-config
        with:
          environment: ${{ inputs.environment }}
          customer_account_id: ${{ inputs.customer_account_id }}
          customer_aws_label: ${{ inputs.customer_aws_label }}
          customer_user_id: ${{ inputs.customer_user_id }}

      - name: Install required CLI tools
        run: |
          set -euo pipefail
          for tool in aws terraform kubectl helm jq zip unzip curl git python3 node npm; do
            command -v "$tool" >/dev/null || { echo "::error::Reviewed runner image is missing $tool"; exit 1; }
          done
      - name: Assert AWS account
        env:
          ADP_INPUT_824138160E: ${{ inputs.customer_account_id }}
        run: |
          set -e
          ACTUAL_ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          # In cross-account mode (#2669) load-deploy-config assumes into the
          # customer account, so the caller identity is the customer's — the
          # intended destroy target. Prefer that; else the platform account
          # from the vars.AWS_ACCOUNT_ID repository variable.
          EXPECTED_ACCOUNT="${ADP_INPUT_824138160E}"
          if [ -z "$EXPECTED_ACCOUNT" ]; then
            EXPECTED_ACCOUNT="${{ vars.AWS_ACCOUNT_ID }}"
          fi
          if [ -z "$EXPECTED_ACCOUNT" ]; then
            echo "WARNING: No target account to verify against (neither customer_account_id input nor vars.AWS_ACCOUNT_ID set). Skipping account guard."
            echo "Consider setting vars.AWS_ACCOUNT_ID to enable cross-account protection."
            exit 0
          fi
          if [ "$ACTUAL_ACCOUNT" != "$EXPECTED_ACCOUNT" ]; then
            echo "::error::Account mismatch! Expected $EXPECTED_ACCOUNT but got $ACTUAL_ACCOUNT."
            echo "::error::Refusing to destroy. Check runner IAM / credential configuration."
            exit 1
          fi
          echo "Account verified: $ACTUAL_ACCOUNT"
      - name: Configure kubectl
        run: |
          set -e
          CLUSTER_NAME="adp-${{ env.ENVIRONMENT }}-eks-cluster"
          aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "${{ env.AWS_REGION }}" 2>/dev/null || {
            echo "WARNING: Could not configure kubectl. EKS cluster may not exist."
          }

      - name: Clean up K8s system namespaces
        run: |
          set -e
          # Delete ARC controller namespace (installed by platform Terraform)
          kubectl delete namespace arc-systems --wait=true --timeout=120s 2>/dev/null || true
          # Delete KEDA namespace if present
          kubectl delete namespace keda --wait=true --timeout=120s 2>/dev/null || true

      - name: Clean up orphaned EKS resources
        run: |
          set -e
          # Find the VPC used by the EKS cluster
          CLUSTER_NAME="adp-${{ env.ENVIRONMENT }}-eks-cluster"
          VPC_ID=$(aws eks describe-cluster --name "$CLUSTER_NAME" --region "${{ env.AWS_REGION }}" \
            --query 'cluster.resourcesVpcConfig.vpcId' --output text 2>/dev/null || echo "")

          if [ -n "$VPC_ID" ] && [ "$VPC_ID" != "None" ]; then
            echo "Cleaning up orphaned ENIs in VPC: $VPC_ID"
            # Delete available ENIs from ELBs
            ORPHAN_ENIS=$(aws ec2 describe-network-interfaces --region "${{ env.AWS_REGION }}" \
              --filters "Name=vpc-id,Values=$VPC_ID" "Name=status,Values=available" \
              --query 'NetworkInterfaces[].NetworkInterfaceId' --output text 2>/dev/null || echo "")
            for ENI in $ORPHAN_ENIS; do
              echo "  Deleting orphaned ENI: $ENI"
              aws ec2 delete-network-interface --network-interface-id "$ENI" --region "${{ env.AWS_REGION }}" 2>/dev/null || true
            done
          fi

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init -backend-config="../../${{ env.BACKEND_CONFIG }}" -input=false

      - name: Terraform Destroy
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform destroy -var-file="../../${{ env.VAR_FILE }}" -auto-approve

      - name: Clean up retired CodeBuild projects
        if: always()
        run: |
          for p in \
            "adp-${{ env.ENVIRONMENT }}-frontend-build" \
            "adp-${{ env.ENVIRONMENT }}-platform-infra" \
            "adp-${{ env.ENVIRONMENT }}-gateway-deploy" \
            "adp-${{ env.ENVIRONMENT }}-gateway-infra" \
            "adp-${{ env.ENVIRONMENT }}-gateway-alb-wire" \
            "adp-${{ env.ENVIRONMENT }}-agent-factory-infra" \
            "adp-${{ env.ENVIRONMENT }}-agent-context-infra" \
            "adp-${{ env.ENVIRONMENT }}-agent-context-deploy" \
            "adp-${{ env.ENVIRONMENT }}-destroy"; do
            aws codebuild delete-project --name "$p" --region "${{ env.AWS_REGION }}" 2>/dev/null || true
          done

      - name: Summary
        if: always()
        run: |
          echo "## Terraform Destroy -- ${{ env.MODULE_NAME }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Module**: ${{ env.MODULE_NAME }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Action**: destroy" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Note**: The Terraform state backend (S3 bucket + DynamoDB table) is NOT deleted." >> "$GITHUB_STEP_SUMMARY"
          echo "To delete it, run \`platform/scripts/bootstrap-destroy.sh\` manually." >> "$GITHUB_STEP_SUMMARY"
