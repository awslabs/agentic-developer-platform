name: Shared Codex Harness Tests

on:
  pull_request:
    paths:
      - 'modules/agent-factory/codex-harness/**'
      - 'modules/tools/task-sdk/**'
      - '.github/workflows/codex-harness-tests.yml'
  push:
    branches: [main]
    paths:
      - 'modules/agent-factory/codex-harness/**'
      - 'modules/tools/task-sdk/**'
      - '.github/workflows/codex-harness-tests.yml'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: arc-runner-org
    timeout-minutes: 10
    defaults:
      run:
        working-directory: modules/agent-factory/codex-harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: modules/agent-factory/codex-harness/package-lock.json
      - run: npm ci --ignore-scripts
      - run: python3 test/run-isolated.py -- python3 -m unittest discover -s test
      - run: python3 test/run-isolated.py -- npm test
      - run: python3 test/run-isolated.py -- node test/sdk-request-shape.mjs
      - run: python3 test/run-isolated.py -- node test/sdk-turn.mjs
      - run: python3 test/run-isolated.py -- node test/sdk-proxy.mjs
      - run: python3 test/run-isolated.py -- node --test test/task-bridge.mjs
      - run: python3 test/run-isolated.py -- node test/sdk-session.mjs
