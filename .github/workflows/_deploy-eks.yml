name: Deploy to EKS (Reusable)

on:
  workflow_call:
    inputs:
      module:
        required: true
        type: string
      namespace:
        required: true
        type: string
      cluster_name:
        required: false
        type: string
        default: adp-dev-eks

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write
    if: github.ref == 'refs/heads/main'
    runs-on: arc-runner-org
    environment: adp-deploy-dev
    steps:
      - uses: actions/checkout@v7

      - name: Verify source belongs to reviewed main history
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$GITHUB_SHA"
          git merge-base --is-ancestor HEAD FETCH_HEAD

      - name: Establish trusted deployment identity
        uses: ./.github/actions/trusted-deployment
        with:
          role_arn: ${{ vars.ADP_DEPLOY_ROLE_ARN }}
          region: ${{ vars.ADP_DEPLOY_REGION || 'us-east-1' }}

      - name: Update kubeconfig
        env:
          CLUSTER_NAME: ${{ inputs.cluster_name }}
        run: aws eks update-kubeconfig --name "$CLUSTER_NAME" --region us-east-1

      - name: Deploy
        working-directory: modules/${{ inputs.module }}/k8s
        env:
          NAMESPACE: ${{ inputs.namespace }}
          MODULE: ${{ inputs.module }}
        run: |
          kubectl apply -f . -n "$NAMESPACE"
          kubectl rollout status "deployment/$MODULE" -n "$NAMESPACE" --timeout=300s
