name: Webhook Ingress CI

on:
  pull_request:
    paths:
      - 'modules/agent-factory/webhook-ingress/**'
      - '.github/workflows/webhook-ingress-ci.yml'
      - '.github/workflows/webhook-ingress-deploy.yml'
      - '.github/scripts/detect-webhook-deploy-changes.sh'
      - '.github/scripts/tests/test_webhook_deploy_hold.py'
      - '.github/scripts/tests/test_worker_terraform_inputs.py'
      - '.github/scripts/tests/test_worker_tf_contracts.py'
      - 'modules/gateway/infra/worker-runtime-wiring.tf'
      - 'platform/infra/worker-access-retirement.tf'
      - '.github/deployment-holds/webhook-infra.md'
      # Issue #4021: the persona catalogue is guarded by a parity test in
      # lambda/common/tests/test_persona_catalogue_parity.py. Without this path
      # a docs-only PR editing the catalogue runs no CI at all, and the drift
      # the gate exists to catch sails through green. Deliberately NOT added to
      # webhook-ingress-deploy.yml — a docs-only commit must not trigger a
      # Lambda deploy.
      - 'docs/agent-catalogue.md'
      # Issue #4130: lambda/common/tests/test_scaledjob_vault_deny_policy.py
      # asserts the cross-tenant vault Deny on BOTH the scaledjob role (in this
      # module, already covered by the path above) and the runner permissions
      # boundary, which lives outside it. Without this path a runner-only edit
      # that drops or env-segments that Deny would run no CI at all, and the
      # guard would go quietly stale. Same lockstep-reachability pattern
      # gateway-ci.yml uses for the webhook-ingress identity resolver.
      - 'modules/agent-factory/infra/modules/runner-iam/main.tf'
    branches:
      - main

concurrency:
  group: webhook-ingress-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  worker-safety:
    name: Worker IAM and deployment safety
    runs-on: arc-runner-org
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.14.6'
          terraform_wrapper: false
      - name: Install test dependencies
        run: pip install pytest PyYAML boto3 moto
      - name: Check worker policy and deployment hold
        run: |
          pytest -q --import-mode=importlib .github/scripts/tests/test_webhook_deploy_hold.py \
            .github/scripts/tests/test_worker_terraform_inputs.py \
            .github/scripts/tests/test_worker_tf_contracts.py \
            modules/agent-factory/webhook-ingress/tests/test_worker_iam_boundary.py \
            modules/agent-factory/webhook-ingress/tests/test_agent_control_manifest.py \
            modules/agent-factory/webhook-ingress/tests/test_scaledjob_manifest.py
      - name: Check Terraform rollout states with mocked providers
        working-directory: modules/agent-factory/webhook-ingress/infra
        run: |
          terraform init -backend=false -input=false
          terraform test -filter=tests/agent_worker_events_write.tftest.hcl \
            -filter=tests/worker_security_rollout.tftest.hcl

  lint:
    name: Lint
    runs-on: arc-runner-org
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: modules/agent-factory/webhook-ingress/requirements*.txt

      - name: Install dependencies
        working-directory: modules/agent-factory/webhook-ingress
        run: |
          # Pin ruff: unpinned install broke on 0.16.0's new rules (30
          # findings in pre-existing files, failing every PR touching this
          # module). Bump deliberately alongside a lint-cleanup pass.
          pip install 'ruff==0.15.20' mypy
          # Install the runtime deps directly (setuptools auto-discovery
          # conflicts with our infra/ + lambda/ flat layout; editable
          # install of the module isn't worth the setuptools config).
          pip install 'boto3>=1.34'
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Ruff check
        working-directory: modules/agent-factory/webhook-ingress
        run: ruff check lambda/

      - name: Mypy
        working-directory: modules/agent-factory/webhook-ingress
        # Not --strict: the Lambda code uses boto3 (no stubs) extensively.
        # Strict mypy on untyped boto3 generates 70+ errors that aren't real bugs.
        # A follow-up can tighten this once types-boto3 is wired in.
        # --explicit-package-bases: the module path includes a hyphen
        # (webhook-ingress) which is not a valid Python package name.
        # This flag tells mypy to treat lambda/ as the base for discovery.
        run: mypy lambda/ --ignore-missing-imports --explicit-package-bases

  test:
    name: Unit Tests
    runs-on: arc-runner-org
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: modules/agent-factory/webhook-ingress/requirements*.txt

      - name: Install dependencies
        working-directory: modules/agent-factory/webhook-ingress
        run: |
          pip install pytest pytest-cov pytest-timeout
          # Runtime deps for the Lambdas under test
          pip install 'boto3>=1.34' 'moto[dynamodb,cloudwatch,sqs]>=5.0'
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          # Per-Lambda requirements (e.g. lambda/github/requirements.txt)
          find lambda -name requirements.txt -maxdepth 3 | while read req; do
            pip install -r "$req"
          done

      - name: Run unit tests
        working-directory: modules/agent-factory/webhook-ingress
        run: |
          pytest lambda/ -m "not integration" -v \
            --tb=short --timeout=60 \
            --cov=lambda --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: webhook-ingress-coverage
          path: modules/agent-factory/webhook-ingress/coverage.xml

  package:
    name: Package Verification
    runs-on: arc-runner-org
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Verify Lambda packaging
        working-directory: modules/agent-factory/webhook-ingress
        run: |
          chmod +x scripts/package-lambdas.sh
          ./scripts/package-lambdas.sh
          echo "Package artifacts:"
          ls -lh dist/*.zip

  plan:
    name: Terraform Plan
    runs-on: arc-runner-org
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Install required CLI tools
        run: |
          set -e
          if ! command -v zip >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends zip unzip curl gnupg
          fi
          if ! command -v aws >/dev/null 2>&1; then
            curl -sL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscli.zip
            unzip -q /tmp/awscli.zip -d /tmp
            sudo /tmp/aws/install
            rm -rf /tmp/awscli.zip /tmp/aws
          fi
          if ! command -v terraform >/dev/null 2>&1; then
            curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
            echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" \
              | sudo tee /etc/apt/sources.list.d/hashicorp.list > /dev/null
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends terraform
          fi
          aws --version
          terraform version | head -1

      # The committed backend tfvars keeps the literal
      # "adp-terraform-state-ACCOUNT_ID" placeholder (the real account id is
      # never committed). Resolve it at runtime from the runner's own identity
      # and override the bucket on init, matching deploy-all.sh / the platform
      # and gateway infra-plan workflows.
      - name: Resolve Terraform state bucket
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "ADP_STATE_BUCKET=adp-terraform-state-${ACCOUNT_ID}" >> "$GITHUB_ENV"
          echo "Resolved state bucket: adp-terraform-state-${ACCOUNT_ID}"

      - name: Terraform Init
        working-directory: modules/agent-factory/webhook-ingress/infra
        run: |
          terraform init \
            -backend-config="../../../../environments/dev/modules/webhook-ingress-backend.tfvars" \
            -backend-config="bucket=${ADP_STATE_BUCKET}" \
            -input=false -reconfigure

      - name: Terraform Plan
        id: plan
        working-directory: modules/agent-factory/webhook-ingress/infra
        run: |
          set -e
          ADP_ENV=dev AWS_REGION=us-east-1 bash ../scripts/terraform-webhook.sh plan -out=tfplan -no-color 2>&1 | tee /tmp/plan-output.txt

      - name: Post or update PR comment
        uses: actions/github-script@v9
        if: always() && github.event_name == 'pull_request'
        env:
          PLAN_OUTPUT: ${{ steps.plan.outcome }}
        with:
          script: |
            const fs = require('fs');
            const marker = `<!-- tf-plan:webhook-ingress -->`;
            let planText = '';
            try {
              planText = fs.readFileSync('/tmp/plan-output.txt', 'utf8');
            } catch (e) {
              planText = 'Plan output not available.';
            }
            if (planText.length > 60000) {
              planText = planText.substring(0, 60000) + '\n\n... (truncated)';
            }
            const status = process.env.PLAN_OUTPUT === 'success' ? ':white_check_mark:' : ':x:';
            const body = `${marker}\n${status} **Terraform Plan — \`webhook-ingress\`**\n\n<details>\n<summary>Plan output</summary>\n\n\`\`\`\n${planText}\n\`\`\`\n\n</details>\n\n*Updated: ${new Date().toISOString()} | Run: [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Summary
        if: always()
        run: |
          echo "## Terraform Plan -- webhook-ingress" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Module**: webhook-ingress" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Status**: ${{ steps.plan.outcome }}" >> "$GITHUB_STEP_SUMMARY"
