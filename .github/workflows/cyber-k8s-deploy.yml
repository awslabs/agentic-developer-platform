name: cyber-k8s-deploy
'on':
  push:
    branches:
    - main
    paths:
    - modules/domain-apps/cyber/k8s/**
    - .github/workflows/cyber-k8s-deploy.yml
    - modules/domain-apps/cyber/ci/cyber-k8s-deploy/**
  workflow_dispatch: {}
concurrency:
  group: cyber-k8s-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: arc-runner-org
    environment: adp-deploy-dev
    permissions:
      id-token: write
      contents: read
    steps:
    - uses: actions/checkout@v7
    - name: Verify source belongs to reviewed main history
      shell: bash
      run: |
        set -euo pipefail
        git fetch --no-tags origin "$GITHUB_SHA"
        git merge-base --is-ancestor HEAD FETCH_HEAD
    - name: Establish trusted deployment identity
      uses: ./.github/actions/trusted-deployment
      with:
        role_arn: ${{ vars.ADP_DEPLOY_ROLE_ARN }}
        region: ${{ vars.ADP_DEPLOY_REGION || 'us-east-1' }}
    - name: Run cyber app automation
      uses: ./modules/domain-apps/cyber/ci/cyber-k8s-deploy
