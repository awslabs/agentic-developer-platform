name: Superplane UI Browser CI

# Isolated rendering and interaction checks against fixture HTTP responses.
# No deployed environment, product login, AWS credentials or provider operations.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: superplane-ui-browser-${{ github.ref }}
  cancel-in-progress: false

jobs:
  serving-browser:
    name: Superplane serving browser checks
    runs-on: arc-runner-org
    timeout-minutes: 20
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_CONFIG_FILE: /dev/null
      AWS_SHARED_CREDENTIALS_FILE: /dev/null
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: modules/gateway/frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install browser and maintained frontend dependencies
        run: |
          npm ci --prefix modules/gateway/frontend
          python -m pip install playwright==1.55.0
          python -m playwright install chromium --with-deps
      - name: Check serving interactions and layout with fixture transports
        run: python modules/domain-apps/superplane/ui/browser-tests/verify_browser.py
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: serving-browser-evidence
          path: test-results/superplane-browser/
          if-no-files-found: error
          retention-days: 14
