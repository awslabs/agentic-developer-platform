name: Chat Agent Deploy

# Builds and deploys the TypeScript complex-task-chat agent image + updates
# the chat-agent-worker KEDA ScaledJob in dev.
#
# Trigger paths cover:
#   - the TS source and Dockerfile (agent/**)
#   - the ScaledJob manifest + deploy helper (agent/k8s/**)
#   - the buildspec + build helper (codebuild/bs-chat-agent.yml, zip-source.sh)
#   - personas baked into the image (rules/personas/**)
#
# The image is shared between the GH agent and the chat agent; AGENT_ENTRYPOINT
# in the ScaledJob config dispatches at runtime.

on:
  push:
    paths:
      - 'modules/agent-factory/agent/**'
      - 'modules/agent-factory/rules/personas/**'
      - 'codebuild/bs-chat-agent.yml'
      - 'platform/scripts/zip-source.sh'
      - '.github/workflows/chat-agent-deploy.yml'
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: 'Only build the image; skip the ScaledJob update.'
        type: boolean
        default: false

env:
  ADP_CHAT_MODEL_POLICY_ENABLED: ${{ vars.ADP_CHAT_MODEL_POLICY_ENABLED || 'false' }}
  AWS_REGION: us-east-1
  ENVIRONMENT: dev
  NAMESPACE: adp-gateway-agents
  EKS_CLUSTER: adp-dev-eks-cluster
  ECR_REPO: adp-chat-agent
  CODEBUILD_PROJECT: adp-dev-chat-agent

jobs:
  build-and-deploy:
    name: Build TS Image and Update Chat ScaledJob
    if: github.ref == 'refs/heads/main'
    runs-on: arc-runner-org
    environment: adp-deploy-dev
    # AWS authority comes from the protected deployment environment.
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Verify source belongs to reviewed main history
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$GITHUB_SHA"
          git merge-base --is-ancestor HEAD FETCH_HEAD

      - name: Establish trusted deployment identity
        uses: ./.github/actions/trusted-deployment
        with:
          role_arn: ${{ vars.ADP_DEPLOY_ROLE_ARN }}
          region: ${{ vars.ADP_DEPLOY_REGION || 'us-east-1' }}

      - name: Load deployment config
        uses: ./.github/actions/load-deploy-config

      # ── 0. Ensure required CLI tools are on the ARC runner ──────────────
      # The ARC runner image pinned at 2.333.1 ships a bare Ubuntu — no zip,
      # no aws CLI, no kubectl, no terraform. Install what we need up front.
      # `sudo` is passwordless on this runner. IRSA provides AWS creds; the
      # CLIs just need to be present to use them.
      - name: Install zip + AWS CLI + kubectl + terraform
        run: |
          set -euo pipefail
          for tool in aws terraform kubectl helm jq zip unzip curl git python3 node npm; do
            command -v "$tool" >/dev/null || { echo "::error::Reviewed runner image is missing $tool"; exit 1; }
          done
      # ── 1. Ensure CodeBuild project exists and is pointed at the right buildspec
      - name: Verify Terraform-managed CodeBuild project
        run: |
          set -euo pipefail
          EXISTS=$(aws codebuild batch-get-projects \
            --names "${CODEBUILD_PROJECT}" \
            --region "${AWS_REGION}" \
            --query 'projects | length(@)' --output text)
          if [ "$EXISTS" -ne 1 ]; then
            echo "::error::${CODEBUILD_PROJECT} is missing — apply platform/infra before running this build lane."
            exit 1
          fi
      # ── 2. Build the image via CodeBuild (per-build isolated source) ────
      - name: Build image via CodeBuild
        id: build
        uses: ./.github/actions/codebuild-run
        with:
          project_name: ${{ env.CODEBUILD_PROJECT }}
          region: ${{ env.AWS_REGION }}
          state_bucket: ${{ env.STATE_BUCKET }}
          environment_variables: >-
            "name=AWS_REGION,value=${{ env.AWS_REGION }}"
            "name=ENVIRONMENT,value=${{ env.ENVIRONMENT }}"
            "name=ACCOUNT_ID,value=${{ env.ACCOUNT_ID }}"
            "name=REGISTRY,value=${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
            "name=IMAGE_TAG,value=${{ github.sha }}"

      - name: Export build outputs
        id: build_info
        run: |
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "image_tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"

      # ── 3. Update the chat ScaledJob to use the new image tag ───────────
      - name: Update chat ScaledJob manifest
        if: ${{ inputs.skip_deploy != true }}
        env:
          IMAGE_TAG: ${{ steps.build_info.outputs.image_tag }}
          REGISTRY: ${{ steps.build_info.outputs.registry }}
        run: |
          AGENT_IMAGE="${REGISTRY}/${{ env.ECR_REPO }}:${IMAGE_TAG}"
          export AGENT_IMAGE

          aws eks update-kubeconfig \
            --name "${{ env.EKS_CLUSTER }}" \
            --region "${AWS_REGION}"

          export ENVIRONMENT="${ENVIRONMENT}"
          export NAMESPACE="${{ env.NAMESPACE }}"

          # deploy-chat-scaledjob.sh reads Terraform outputs from
          # modules/agent-factory/infra/ and does the sed+kubectl apply.
          bash modules/agent-factory/agent/k8s/deploy-chat-scaledjob.sh

          echo "Chat ScaledJob now uses image: ${AGENT_IMAGE}"

      - name: Summary
        env:
          ADP_INPUT_611C454309: ${{ inputs.skip_deploy }}
        run: |
          echo "## Chat Agent Deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image**: ${{ steps.build_info.outputs.registry }}/${{ env.ECR_REPO }}:${{ steps.build_info.outputs.image_tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **CodeBuild**: ${{ steps.build.outputs.build_id }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${ADP_INPUT_611C454309}" = "true" ]; then
            echo "- **Deploy**: skipped (workflow_dispatch input)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **ScaledJob**: chat-agent-worker in ns ${{ env.NAMESPACE }} on ${{ env.EKS_CLUSTER }}" >> "$GITHUB_STEP_SUMMARY"
          fi
