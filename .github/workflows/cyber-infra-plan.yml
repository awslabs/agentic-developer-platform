name: Cyber Infra Plan
'on':
  pull_request:
    paths:
    - .github/workflows/cyber-infra-plan.yml
    - modules/domain-apps/cyber/infra/**
    - modules/domain-apps/cyber/environments/dev/sandbox-backend.tfvars
    - modules/domain-apps/cyber/ci/cyber-infra-plan/**
    branches:
    - main
jobs:
  plan:
    name: Terraform Plan
    runs-on: arc-runner-org
    permissions:
      contents: read
      pull-requests: write
    steps:
    - uses: actions/checkout@v7
    - name: Run cyber app automation
      uses: ./modules/domain-apps/cyber/ci/cyber-infra-plan
