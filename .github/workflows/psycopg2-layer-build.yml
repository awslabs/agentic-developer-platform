name: psycopg2 Layer Build

# Builds the psycopg2 Lambda layer via CodeBuild and uploads to S3.
# Gateway Infra Terraform references the artifact at:
#   s3://adp-terraform-state-<ACCOUNT_ID>/lambda-layers/psycopg2-py312.zip

on:
  push:
    paths:
      - 'modules/gateway/lambda/layers/psycopg2/**'
      - 'codebuild/bs-psycopg2-layer.yml'
      - '.github/workflows/psycopg2-layer-build.yml'
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ENVIRONMENT: dev
  CODEBUILD_PROJECT: adp-dev-psycopg2-layer

jobs:
  build:
    name: Build psycopg2 Lambda Layer
    runs-on: arc-runner-org
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Load deployment config
        uses: ./.github/actions/load-deploy-config

      - name: Install zip + AWS CLI (bootstrap)
        run: |
          set -e
          if ! command -v zip >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends zip unzip curl
          fi
          if ! command -v aws >/dev/null 2>&1; then
            curl -sL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscli.zip
            unzip -q /tmp/awscli.zip -d /tmp
            sudo /tmp/aws/install
            rm -rf /tmp/awscli.zip /tmp/aws
          fi
          aws --version

      - name: Ensure CodeBuild project
        run: |
          CB_ROLE_NAME="adp-${ENVIRONMENT}-codebuild-role"
          SERVICE_ROLE_ARN=$(aws iam get-role --role-name "$CB_ROLE_NAME" --query 'Role.Arn' --output text 2>/dev/null || echo "")
          if [ -z "$SERVICE_ROLE_ARN" ]; then
            echo "${CB_ROLE_NAME} missing — run platform/scripts/deploy-all.sh once to create it." >&2
            exit 1
          fi
          SOURCE_LOC="${STATE_BUCKET}/codebuild/adp-source.zip"
          EXISTS=$(aws codebuild batch-get-projects --names "${{ env.CODEBUILD_PROJECT }}" --region "${AWS_REGION}" --query 'projects | length(@)' --output text 2>/dev/null || echo "0")
          CMD="create-project"
          [ "$EXISTS" -gt 0 ] && CMD="update-project"
          aws codebuild $CMD --region "${AWS_REGION}" \
            --name "${{ env.CODEBUILD_PROJECT }}" \
            --source "{\"type\":\"S3\",\"location\":\"$SOURCE_LOC\",\"buildspec\":\"codebuild/bs-psycopg2-layer.yml\"}" \
            --artifacts '{"type":"NO_ARTIFACTS"}' \
            --environment '{
              "type":"LINUX_CONTAINER",
              "image":"aws/codebuild/amazonlinux2-x86_64-standard:5.0",
              "computeType":"BUILD_GENERAL1_MEDIUM",
              "privilegedMode":true
            }' \
            --service-role "$SERVICE_ROLE_ARN" > /dev/null

      - name: Build layer via CodeBuild
        id: build
        uses: ./.github/actions/codebuild-run
        with:
          project_name: ${{ env.CODEBUILD_PROJECT }}
          region: ${{ env.AWS_REGION }}
          state_bucket: ${{ env.STATE_BUCKET }}
          environment_variables: >-
            "name=AWS_REGION,value=${{ env.AWS_REGION }}"
            "name=ACCOUNT_ID,value=${{ env.ACCOUNT_ID }}"
            "name=STATE_BUCKET,value=${{ env.STATE_BUCKET }}"

      - name: Verify artifact exists
        run: |
          aws s3 ls "s3://${STATE_BUCKET}/lambda-layers/psycopg2-py312.zip" --region "${AWS_REGION}"

      - name: Summary
        run: |
          echo "## psycopg2 Lambda Layer Built" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Artifact**: s3://${STATE_BUCKET}/lambda-layers/psycopg2-py312.zip" >> "$GITHUB_STEP_SUMMARY"
          echo "- **CodeBuild**: ${{ steps.build.outputs.build_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Gateway Infra Apply can now reference this layer from S3." >> "$GITHUB_STEP_SUMMARY"
