name: Cyber job security contracts
on:
  pull_request:
    paths:
      - modules/domain-apps/cyber/**
      - modules/gateway/src/agentauth/cyber_jobs.py
      - modules/gateway/tests/agentauth/test_cyber_jobs.py
      - .github/workflows/cyber-security-ci.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel-isolation:
    runs-on: arc-runner-org
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install worker dependencies for real Linux probes
        run: |
          python -m venv /tmp/cyber-kernel-tests
          /tmp/cyber-kernel-tests/bin/pip install -r modules/domain-apps/cyber/workers/requirements.txt pytest==8.3.5
      - name: Exercise actual kernel confinement and native parsers
        run: /tmp/cyber-kernel-tests/bin/python -m pytest -q modules/domain-apps/cyber/workers/tests/test_isolation.py
