name: Credential binding readiness tests

on:
  pull_request:
    paths:
      - 'platform/scripts/credential-binding-readiness.py'
      - 'platform/scripts/flip-gate-check.sh'
      - 'platform/scripts/tests/test_credential_binding_readiness.py'
      - 'platform/scripts/tests/test-flip-gate-check.sh'
      - '.github/workflows/credential-binding-flip.yml'
      - '.github/workflows/credential-binding-readiness-tests.yml'
      # Documentation-only changes do not start this workflow.
      - '!docs/**'
      - '!**/docs/**'
      - '!**/README*'
      - '!**/CHANGELOG*'
      - '!**/CONTRIBUTING*'
      - '!**/*.rst'
  push:
    branches: [main]
    paths:
      - 'platform/scripts/credential-binding-readiness.py'
      - 'platform/scripts/flip-gate-check.sh'
      - 'platform/scripts/tests/test_credential_binding_readiness.py'
      - 'platform/scripts/tests/test-flip-gate-check.sh'
      - '.github/workflows/credential-binding-flip.yml'
      - '.github/workflows/credential-binding-readiness-tests.yml'
      # Documentation-only changes do not start this workflow.
      - '!docs/**'
      - '!**/docs/**'
      - '!**/README*'
      - '!**/CHANGELOG*'
      - '!**/CONTRIBUTING*'
      - '!**/*.rst'
permissions:
  contents: read

jobs:
  readiness:
    name: Readiness evidence and CLI regressions
    runs-on: arc-runner-org
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test with local command doubles
        run: bash platform/scripts/tests/test-flip-gate-check.sh
