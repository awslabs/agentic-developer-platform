# Semgrep configuration for ADP
# Uses 'auto' config (p/default) as the primary ruleset via --config auto.
# This file is loaded via `semgrep scan --config .github/security/semgrep.yml`
# and may contain custom rules in the future. Path-based suppressions live in
# the baseline (semgrep-baseline.sarif) — NOT here, because a top-level
# `paths:` key is silently ignored in a --config rules file.
#
# Adjudicated false positives (47 findings from #2217 triage) are suppressed
# via semgrep-baseline.sarif. The diff_security_findings.py script diffs
# current scan results against the baseline, so baselined findings appear as
# "stable" rather than "new" in PR comments.
#
# Baselined FP clusters (see semgrep-baseline.sarif):
#   - run-shell-injection ×25 in .github/workflows/, .github/actions/
#   - detect-child-process ×14 in modules/agent-factory/agent/src/
#   - detected-jwt-token ×6 in data/security/, modules/agent-factory/agent/src/
#   - unverified-jwt-decode ×2 in modules/gateway/src/auth/
