# =============================================================================
# dsh experiment — ServiceAccount
# =============================================================================
# Issue #4188. Design: docs/spikes/spike-4188-dsh-experiment.md §3.1.
#
# NOT PRODUCTION INFRASTRUCTURE.
#
# Why there is no IRSA annotation
# -------------------------------
# §6 invariant 1 of the assessment says "IRSA scoped by resource ARN, never
# Resource: '*'". For the harness container the correct scope is ZERO, not
# narrow: nothing dsh does in this experiment requires an AWS API call. Model
# access goes through the sigv4 sidecar, which carries the only AWS identity in
# the pod (spike §3.4) and is a separate ServiceAccount/role created out-of-band
# for the run.
#
# So: no eks.amazonaws.com/role-arn annotation. Adding one to this SA would hand
# third-party code an AWS identity it has no need for.
#
# Why the token is not mounted
# ----------------------------
# automountServiceAccountToken: false means a compromised harness cannot reach
# the Kubernetes API server at all. This is spike gate G1's second half — and it
# matters more than usual here because the headless profile forces
# approval: 'never' (assessment §Q2/§6), so every tool call is auto-approved.
# There is no approval prompt standing between the harness and anything it can
# reach; the only real control is that it can reach nothing.
#
# There is deliberately NO Role and NO RoleBinding in this file. The SA has no
# Kubernetes RBAC whatsoever.
# =============================================================================
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dsh-experiment-sa
  namespace: dsh-experiment
  labels:
    app.kubernetes.io/name: dsh-experiment
    app.kubernetes.io/component: third-party-evaluation
    app.kubernetes.io/managed-by: manual
  # NO eks.amazonaws.com/role-arn — see the header. This is intentional.
automountServiceAccountToken: false
