version: 0.2

# Builds the gateway frontend (Vite/React) and syncs to S3 + invalidates
# CloudFront. Referenced by .github/workflows/gateway-deploy.yml via
# `codebuild/bs-frontend.yml` in the uploaded source zip.
#
# Env vars set by the CodeBuild project:
#   AWS_REGION, ENVIRONMENT

env:
  variables:
    # Absolute path relative to CODEBUILD_SRC_DIR — set at runtime in each
    # phase's first command since CodeBuild doesn't evaluate $CODEBUILD_SRC_DIR
    # in the `env.variables` block. Each phase's commands run in fresh shells
    # with a non-deterministic cwd, so always cd via this absolute path.
    FRONTEND_SUBDIR: modules/gateway/frontend

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - cd "$CODEBUILD_SRC_DIR/$FRONTEND_SUBDIR" && pwd && ls -la | head -5 && npm ci
  build:
    commands:
      - cd "$CODEBUILD_SRC_DIR/$FRONTEND_SUBDIR" && pwd && VITE_API_URL=/api npm run build
  post_build:
    commands:
      - BUCKET=$(aws ssm get-parameter --name "/adp/$ENVIRONMENT/gateway/frontend-bucket" --query "Parameter.Value" --output text)
      - cd "$CODEBUILD_SRC_DIR/$FRONTEND_SUBDIR" && aws s3 sync dist/ "s3://$BUCKET/" --delete
      - DIST_ID=$(aws ssm get-parameter --name "/adp/$ENVIRONMENT/gateway/cloudfront-id" --query "Parameter.Value" --output text) || true
      - '[ -n "$DIST_ID" ] && [ "$DIST_ID" != "None" ] && aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*" || true'
