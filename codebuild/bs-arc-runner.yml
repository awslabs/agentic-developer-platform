version: 0.2

# CodeBuild buildspec for the custom ADP ARC runner image.
#
# The runner image ships every CLI we need (aws, kubectl, terraform, helm, gh,
# docker, zip, kaniko, node, python). Replaces the bare actions-runner base
# and eliminates 3-5 minutes of tool installation at the start of every
# workflow run.
#
# Pushes to ECR repo `adp-arc-runner`. Referenced by the ARC helm release
# via `template.spec.containers[0].image`.
#
# Env vars injected by the caller:
#   AWS_REGION, ACCOUNT_ID, REGISTRY, IMAGE_TAG
#   PUBLISH_LATEST (optional; defaults to true, false builds a candidate only)

phases:
  pre_build:
    commands:
      - |
        if [ -z "${ADP_SOURCE_SHA:-}" ]; then
          echo "ERROR: ADP_SOURCE_SHA not set. Build was started without --source-location-override." >&2
          echo "All builds must use codebuild-run.sh or the codebuild-run composite action." >&2
          exit 1
        fi
      - ECR_REPO="adp-arc-runner"
      - IMAGE_TAG="${IMAGE_TAG:-latest}"
      - |
        if ! aws ecr describe-repositories --repository-names "$ECR_REPO" --region "$AWS_REGION" >/dev/null 2>&1; then
          aws ecr create-repository \
            --repository-name "$ECR_REPO" \
            --region "$AWS_REGION" \
            --image-scanning-configuration scanOnPush=true \
            --image-tag-mutability MUTABLE >/dev/null
        fi
      - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"

  build:
    commands:
      - cd platform/arc-runner
      - |
        case "${PUBLISH_LATEST:-true}" in
          true|false) ;;
          *) echo "PUBLISH_LATEST must be true or false" >&2; exit 1 ;;
        esac
      - docker build --no-cache --pull -t "$REGISTRY/$ECR_REPO:$IMAGE_TAG" -f Dockerfile .
      - docker push "$REGISTRY/$ECR_REPO:$IMAGE_TAG"
      - |
        if [ "${PUBLISH_LATEST:-true}" = true ]; then
          docker tag "$REGISTRY/$ECR_REPO:$IMAGE_TAG" "$REGISTRY/$ECR_REPO:latest"
          docker push "$REGISTRY/$ECR_REPO:latest"
        fi

  post_build:
    commands:
      - test "$CODEBUILD_BUILD_SUCCEEDING" = 1
      - echo "Pushed ${REGISTRY}/${ECR_REPO}:${IMAGE_TAG} (PUBLISH_LATEST=${PUBLISH_LATEST:-true})"
