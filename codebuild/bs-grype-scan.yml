version: 0.2

env:
  variables:
    GRYPE_VERSION: "0.119.0"  # default; can be overridden at start-build time

phases:
  install:
    commands:
      - python3 -m pip install --quiet PyYAML==6.0.3
      - curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin "v${GRYPE_VERSION}"
      - grype version
  pre_build:
    commands:
      - |
        if [ -z "${ADP_SOURCE_SHA:-}" ]; then
          echo "ERROR: ADP_SOURCE_SHA not set. Build was started without --source-location-override." >&2
          echo "All builds must use codebuild-run.sh or the codebuild-run composite action." >&2
          exit 1
        fi
      - aws sts get-caller-identity
      - DATE=$(date -u +%Y/%m/%d)
      - RUN_ID="${CODEBUILD_BUILD_ID##*:}"
      - echo "Run ID=${RUN_ID} date=${DATE}"
      - if [ -z "${SECURITY_SCANS_BUCKET}" ]; then echo "ERROR SECURITY_SCANS_BUCKET not set" && exit 1; fi
  build:
    commands:
      - python3 codebuild/scan_security_images.py grype

artifacts:
  files: []
