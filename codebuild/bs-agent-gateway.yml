version: 0.2

# CodeBuild buildspec for the agent-gateway worker image.
#
# Builds the Python worker from modules/agent-factory, including its shared
# personas. Pushes to ECR repo `adp-agent-gateway`.
#
# Environment variables injected by the start-build caller:
#   AWS_REGION, ENVIRONMENT, ACCOUNT_ID, REGISTRY, IMAGE_TAG, EKS_CLUSTER

phases:
  pre_build:
    commands:
      - |
        if [ -z "${ADP_SOURCE_SHA:-}" ]; then
          echo "ERROR: ADP_SOURCE_SHA not set. Build was started without --source-location-override." >&2
          echo "All builds must use codebuild-run.sh or the codebuild-run composite action." >&2
          exit 1
        fi
      - ECR_REPO="adp-agent-gateway"
      - IMAGE_TAG="${IMAGE_TAG:-latest}"
      - |
        if ! aws ecr describe-repositories --repository-names "$ECR_REPO" --region "$AWS_REGION" >/dev/null 2>&1; then
          aws ecr create-repository --repository-name "$ECR_REPO" --region "$AWS_REGION" >/dev/null
        fi
      - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"

  build:
    commands:
      - cd modules/agent-factory
      - docker build --no-cache --pull -f gateway/Dockerfile -t "$REGISTRY/$ECR_REPO:$IMAGE_TAG" .
      - docker tag "$REGISTRY/$ECR_REPO:$IMAGE_TAG" "$REGISTRY/$ECR_REPO:latest"
      - docker push "$REGISTRY/$ECR_REPO:$IMAGE_TAG"
      - 'if [ "${PUBLISH_LATEST:-true}" = true ]; then docker push "$REGISTRY/$ECR_REPO:latest"; fi'

  post_build:
    commands:
      - |
        if [ "${CODEBUILD_BUILD_SUCCEEDING:-0}" != "1" ]; then
          echo "Agent gateway build failed; refusing to report publication success." >&2
          exit 1
        fi
      - echo "Pushed ${REGISTRY}/${ECR_REPO}:${IMAGE_TAG} (latest publication controlled by PUBLISH_LATEST)"
