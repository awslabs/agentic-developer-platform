version: 0.2

# CodeBuild buildspec for the agent-gateway worker image.
#
# Builds the Python worker (gateway/Dockerfile) with the agent/ directory
# included in the build context. Pushes to ECR repo `adp-agent-gateway`.
#
# Environment variables injected by the start-build caller:
#   AWS_REGION, ENVIRONMENT, ACCOUNT_ID, REGISTRY, IMAGE_TAG, EKS_CLUSTER

phases:
  pre_build:
    commands:
      - ECR_REPO="adp-agent-gateway"
      - IMAGE_TAG="${IMAGE_TAG:-latest}"
      - |
        if ! aws ecr describe-repositories --repository-names "$ECR_REPO" --region "$AWS_REGION" >/dev/null 2>&1; then
          aws ecr create-repository --repository-name "$ECR_REPO" --region "$AWS_REGION" >/dev/null
        fi
      - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"

  build:
    commands:
      - cd modules/agent-factory
      - BUILD_DIR="/tmp/agent-gateway-build"
      - rm -rf "$BUILD_DIR" && mkdir -p "$BUILD_DIR"
      - cp -r gateway/app "$BUILD_DIR/app"
      - cp -r agent "$BUILD_DIR/agent"
      - cp gateway/Dockerfile "$BUILD_DIR/Dockerfile"
      - cp gateway/entrypoint.sh "$BUILD_DIR/entrypoint.sh"
      - docker build -t "$REGISTRY/$ECR_REPO:$IMAGE_TAG" "$BUILD_DIR"
      - docker tag "$REGISTRY/$ECR_REPO:$IMAGE_TAG" "$REGISTRY/$ECR_REPO:latest"
      - docker push "$REGISTRY/$ECR_REPO:$IMAGE_TAG"
      - docker push "$REGISTRY/$ECR_REPO:latest"
      - rm -rf "$BUILD_DIR"

  post_build:
    commands:
      - echo "Pushed ${REGISTRY}/${ECR_REPO}:${IMAGE_TAG} (and :latest)"
