version: 0.2

# PR-time smoke build for the gateway image: proves modules/gateway/Dockerfile
# still builds. Build only — NO push, NO tags touched. The deployable image is
# produced exclusively by bs-gateway-build.yml (gateway-deploy.yml).
#
# Used by .github/workflows/gateway-ci.yml "Build Container" via
# `start-build --buildspec-override codebuild/bs-gateway-smoke.yml` on the
# gateway-smoke project (nonpublishing, privileged Docker). ARC runners have no Docker
# daemon, so docker builds run here — the platform convention.

phases:
  build:
    commands:
      # Issue #5146: stage the shared review-result contract into the build context
      # before building, exactly as bs-gateway-build.yml does. A smoke build that
      # skipped this would pass while the deploy build's selfcheck failed — the PR
      # gate would then be green on an image that cannot ship.
      - modules/gateway/scripts/stage-contracts.sh
      - cd modules/gateway
      - docker build --pull -t adp-gateway:pr-smoke .
  post_build:
    commands:
      - docker image inspect adp-gateway:pr-smoke --format 'Smoke build OK — {{.Id}}'
      # Issue #4969: prove the built image can actually import the shared pricing
      # policy and load its rate snapshots. pricing_policy/ is COPY'd in, not
      # pip-installed, so a dropped COPY line or a missing snapshots/*.json still
      # builds green and only fails later — as an ImportError on the first priced
      # request, or as a Lambda silently billing at default rates.
      - docker run --rm --entrypoint python adp-gateway:pr-smoke -m pricing_policy.selfcheck
      # Issue #5146: same for the shared review-result contract. Catching a dropped
      # COPY or an unstaged contract at PR time is the whole point of a smoke build;
      # without this the first sign would be refused review evidence in production.
      - docker run --rm --entrypoint python adp-gateway:pr-smoke -m src.orchestration.review_contract_selfcheck
      - docker run --rm --entrypoint python adp-gateway:pr-smoke -m src.orchestration.evaluation_contract_selfcheck
      # Issue #5675: exercise the exact image under the workload restrictions.
      # This runs on the privileged CodeBuild project because ARC has no daemon.
      - |
        set -euo pipefail
        RESTRICTIONS="--read-only --cap-drop=ALL --security-opt=no-new-privileges:true"
        RESTRICTIONS="$RESTRICTIONS --tmpfs /tmp:rw,noexec,nosuid,nodev,uid=65532,gid=65532,mode=1777"
        RESTRICTIONS="$RESTRICTIONS --tmpfs /home/appuser:rw,noexec,nosuid,nodev,uid=65532,gid=65532,mode=700"
        test "$(docker image inspect adp-gateway:pr-smoke --format '{{.Config.User}}')" = "65532:65532"
        # Prove the image layer protects immutable application content on its
        # own, without --read-only masking an ownership or mode regression.
        docker run --rm --entrypoint sh adp-gateway:pr-smoke -c '
          test "$(id -u)" = 65532
          test -z "$(find /app ! -uid 0 -print -quit)"
          test -z "$(find /app \( -type f -o -type d \) -perm /022 -print -quit)"
          touch /tmp/image-layer-write
          touch "$HOME/image-layer-write"
          if touch /app/image-layer-must-stay-read-only 2>/dev/null; then
            echo "/app was writable without the workload read-only control" >&2
            exit 1
          fi
        '
        docker run --rm $RESTRICTIONS --entrypoint sh adp-gateway:pr-smoke -c '
          test "$(id -u)" = 65532
          touch /tmp/runtime-write
          touch "$HOME/runtime-write"
          if touch /app/must-stay-read-only 2>/dev/null; then
            echo "/app was writable" >&2
            exit 1
          fi
        '
        # Exercise the database driver that is actually shipped in the runtime
        # image. aiosqlite is test-only, so a SQLite URL would make startup log a
        # missing-driver failure while the hard-coded health endpoints still
        # returned 200. Settings also require the BG_ prefix; DATABASE_URL alone
        # is ignored and silently falls back to the localhost default.
        docker run --rm $RESTRICTIONS --entrypoint python \
          adp-gateway:pr-smoke -c 'import asyncpg'

        # This fixture checks image permissions/startup without external stores.
        # Production requires shared Redis; only this isolated development smoke
        # opts into local counters (the rate-limit suites test shared enforcement).
        CONTAINER_ID=$(docker run -d $RESTRICTIONS \
          -e RATELIMIT_SECURITY_PROFILE=development \
          -e RATELIMIT_BACKEND_TYPE=memory \
          -e RATELIMIT_ALLOW_MEMORY_BACKEND=true \
          -e AWS_EC2_METADATA_DISABLED=true \
          -e BG_TOKEN_SECRET_KEY=gateway-smoke-not-a-production-secret \
          -e BG_DATABASE_URL=postgresql+asyncpg://smoke:smoke@127.0.0.1:1/gateway-smoke \
          -p 127.0.0.1:18080:8080 \
          adp-gateway:pr-smoke)
        cleanup() {
          docker logs "$CONTAINER_ID" || true
          docker rm -f "$CONTAINER_ID" >/dev/null 2>&1 || true
        }
        trap cleanup EXIT

        for attempt in $(seq 1 60); do
          if curl -fsS http://127.0.0.1:18080/health >/tmp/gateway-health.json; then
            break
          fi
          if ! docker inspect "$CONTAINER_ID" --format '{{.State.Running}}' | grep -qx true; then
            echo "Gateway exited before readiness" >&2
            exit 1
          fi
          sleep 2
        done
        grep -q '"status":"healthy"' /tmp/gateway-health.json
        curl -fsS http://127.0.0.1:18080/ready -o /tmp/gateway-ready.json
        grep -q '"status":"ready"' /tmp/gateway-ready.json
        curl -fsS http://127.0.0.1:18080/v1/health -o /tmp/gateway-proxy-health.json
        grep -q '"service":"proxy"' /tmp/gateway-proxy-health.json
        test "$(docker exec "$CONTAINER_ID" id -u)" = 65532
        docker exec "$CONTAINER_ID" sh -c \
          'test "$(awk '\''/^CapEff:/ {print $2}'\'' /proc/1/status)" = 0000000000000000'
        docker exec "$CONTAINER_ID" sh -c \
          'test "$(awk '\''/^NoNewPrivs:/ {print $2}'\'' /proc/1/status)" = 1'
