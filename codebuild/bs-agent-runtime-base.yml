version: 0.2

# CodeBuild buildspec for the agent-runtime BASE image.
#
# Builds Dockerfile.base (Ubuntu 24.04 + Python + Node + git + gh + aws-cli +
# kubectl + dev tools) and pushes to ECR as adp-agent-runtime-base. The
# per-PR agent-runtime image (bs-agent-runtime.yml) FROMs this result.
#
# This build runs:
#   - On pushes that change modules/agent-factory/agent-worker-image/Dockerfile.base
#   - On a weekly cron (to pick up security patches + npm registry updates)
#
# It is NOT triggered by per-PR changes to entrypoint.py, lib/, persona files,
# or the agent TypeScript source — those hit bs-agent-runtime.yml instead.
#
# Env vars injected by the caller:
#   AWS_REGION, ACCOUNT_ID, REGISTRY, IMAGE_TAG (default: latest + date stamp)

phases:
  pre_build:
    commands:
      - ECR_REPO="adp-agent-runtime-base"
      - DATE_TAG=$(date -u +%Y%m%d)
      - IMAGE_TAG="${IMAGE_TAG:-$DATE_TAG}"
      - |
        if ! aws ecr describe-repositories --repository-names "$ECR_REPO" --region "$AWS_REGION" >/dev/null 2>&1; then
          aws ecr create-repository \
            --repository-name "$ECR_REPO" \
            --region "$AWS_REGION" \
            --image-scanning-configuration scanOnPush=true \
            --image-tag-mutability MUTABLE >/dev/null
        fi
      - aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$REGISTRY"

  build:
    commands:
      # Build from Dockerfile.base. Repo root is the build context so the
      # Dockerfile.base can use absolute paths if it ever needs repo files
      # (today it doesn't — everything is installed from package managers).
      - docker build
          -f modules/agent-factory/agent-worker-image/Dockerfile.base
          -t "$REGISTRY/$ECR_REPO:$IMAGE_TAG"
          -t "$REGISTRY/$ECR_REPO:latest"
          .
      - docker push "$REGISTRY/$ECR_REPO:$IMAGE_TAG"
      - docker push "$REGISTRY/$ECR_REPO:latest"

  post_build:
    commands:
      - 'echo "Pushed ${REGISTRY}/${ECR_REPO}:${IMAGE_TAG} (and :latest)"'
