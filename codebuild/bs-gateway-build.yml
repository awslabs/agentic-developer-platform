version: 0.2

# Builds the gateway backend image and pushes to ECR.
# Referenced by .github/workflows/gateway-deploy.yml via
# `codebuild/bs-gateway-build.yml` in the uploaded source zip.
#
# Env vars set by the CodeBuild project:
#   AWS_REGION, ACCOUNT_ID, REGISTRY, ENVIRONMENT, IMAGE_TAG (optional)

phases:
  pre_build:
    commands:
      - |
        if [ -z "${ADP_SOURCE_SHA:-}" ]; then
          echo "ERROR: ADP_SOURCE_SHA not set. Build was started without --source-location-override." >&2
          echo "This means the build is reading from the shared mutable key (stale source race)." >&2
          echo "All builds must use codebuild-run.sh or the codebuild-run composite action." >&2
          exit 1
        fi
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $REGISTRY
  build:
    commands:
      # Issue #5146: stage the shared review-result contract into the build context.
      # It lives at the repository root so gateway, tick and worker share ONE
      # validator; this context is `modules/gateway`, so no COPY could otherwise
      # reach it. Must run BEFORE docker build, from the repo root.
      - modules/gateway/scripts/stage-contracts.sh
      - cd modules/gateway
      - docker build --no-cache --pull -t $REGISTRY/adp-gateway:latest .
      # Issue #4969: gate the push on the image carrying the shared pricing policy
      # and its rate snapshots. pricing_policy/ is COPY'd in rather than
      # pip-installed, so a dropped COPY line or a missing snapshots/*.json builds
      # green and only surfaces in production — as an ImportError on the first
      # priced request, or as settlement quietly falling back to default rates.
      # Deliberately BEFORE the tag/push below: a mispriced image must not ship.
      - docker run --rm --entrypoint python $REGISTRY/adp-gateway:latest -m pricing_policy.selfcheck
      # Issue #5146: prove the image carries the shared review-result contract and
      # that the shipped validator accepts the shipped golden fixture. Same failure
      # mode as pricing_policy and the same reason it is a build gate: contracts/ is
      # COPY'd from a staged copy, not pip-installed, so a dropped COPY or an unrun
      # staging script builds green and surfaces in production as every review
      # evidence submission being refused `contract_unavailable` — a total outage of
      # the review path, discovered on first use. Deliberately BEFORE the push.
      - docker run --rm --entrypoint python $REGISTRY/adp-gateway:latest -m src.orchestration.review_contract_selfcheck
      - 'if [ -n "${IMAGE_TAG:-}" ]; then docker tag $REGISTRY/adp-gateway:latest $REGISTRY/adp-gateway:$IMAGE_TAG; fi'
  post_build:
    commands:
      # CodeBuild also enters post_build after a failed build phase. Ordering
      # alone does not prevent an image that failed its selfcheck from shipping.
      - |
        if [ "${CODEBUILD_BUILD_SUCCEEDING:-0}" != "1" ]; then
          echo "Build or a selfcheck (pricing / review contract) failed; refusing to push the gateway image." >&2
          exit 1
        fi
      - 'if [ "${PUBLISH_LATEST:-true}" = true ]; then docker push $REGISTRY/adp-gateway:latest; fi'
      - 'if [ -n "${IMAGE_TAG:-}" ]; then docker push $REGISTRY/adp-gateway:$IMAGE_TAG; fi'
