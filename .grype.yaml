  # ============================================================================
  # Agent-worker-image: gh CLI false positive.
  # CVE-2024-52308 was fixed in gh 2.62.0; our image ships gh 2.92.0+.
  # Ubuntu CVE feed hasn't updated the 'no fix available' status.
  # Source: https://ubuntu.com/security/CVE-2024-52308
  # ============================================================================

  - vulnerability: CVE-2024-52308
    package:
      name: gh

  # CVE-2024-53858: gh CLI path traversal, fixed in gh 2.63.1+. Our image
  # ships 2.92.0+. Ubuntu feed still shows as unfixed.
  # Source: https://ubuntu.com/security/CVE-2024-53858
  - vulnerability: CVE-2024-53858
    package:
      name: gh

  # CVE-2024-54132: gh CLI credential exposure, fixed in gh 2.64.0+. Our
  # image ships 2.92.0+. Ubuntu feed still shows as unfixed.
  # Source: https://ubuntu.com/security/CVE-2024-54132
  - vulnerability: CVE-2024-54132
    package:
      name: gh

  # ============================================================================
  # Agent-worker-image: zlib1g false positive.
  # Debian/Ubuntu does NOT compile minizip from zlib source. The vulnerable
  # code path (MiniZip contrib) is not present in the binary package.
  # Source: https://security-tracker.debian.org/tracker/CVE-2023-45853
  # ============================================================================

  - vulnerability: CVE-2023-45853
    package:
      name: zlib1g

  # ============================================================================
  # Agent-worker-image: Node.js false positive.
  # CVE-2025-55130 affects Node <24.13.0; our image ships Node 24.15.0+.
  # Grype matches on the package presence but misses the installed version.
  # Source: https://nodejs.org/en/blog/vulnerability/may-2025-security-releases
  # ============================================================================

  - vulnerability: CVE-2025-55130
    package:
      name: nodejs

  # ============================================================================
  # Debian disputed / won't-fix CVEs (false positives across all images).
  # These are long-standing issues marked as "disputed" or "won't fix" by
  # Debian/Ubuntu security teams. No known exploits in container context.
  # Re-evaluate quarterly (next: 2026-08-22).
  # ============================================================================

  # CVE-2005-2541: tar preserving setuid bits is documented behavior.
  # Source: https://security-tracker.debian.org/tracker/CVE-2005-2541
  - vulnerability: CVE-2005-2541
    package:
      name: tar

  # CVE-2019-1010022: theoretical PLT attack on glibc, disputed by maintainers.
  # Source: https://security-tracker.debian.org/tracker/CVE-2019-1010022
  - vulnerability: CVE-2019-1010022
    package:
      name: libc-bin
  - vulnerability: CVE-2019-1010022
    package:
      name: libc6
  - vulnerability: CVE-2019-1010022
    package:
      name: libc-dev-bin
  - vulnerability: CVE-2019-1010022
    package:
      name: libc6-dev

  # CVE-2018-13410: zip test-code UAF, not reachable in binary package.
  # Source: https://security-tracker.debian.org/tracker/CVE-2018-13410
  - vulnerability: CVE-2018-13410
    package:
      name: zip

  # CVE-2023-45924: libglvnd uninitialized var, no security impact.
  # Source: https://security-tracker.debian.org/tracker/CVE-2023-45924
  - vulnerability: CVE-2023-45924
    package:
      name: libgl1
  - vulnerability: CVE-2023-45924
    package:
      name: libglvnd0
  - vulnerability: CVE-2023-45924
    package:
      name: libglx0

  # ============================================================================
  # Agent-worker-image: fzf pre-compiled binary (Go 1.20.13).
  # We install fzf from GitHub releases — the binary is compiled upstream with
  # Go 1.20.13 and cannot be patched by our builds. Requires upstream fzf release
  # with newer Go toolchain.
  # Source: https://github.com/junegunn/fzf/releases
  # ============================================================================

  # CVE-2023-24531: Go stdlib cmd/go vulnerability in fzf binary.
  - vulnerability: CVE-2023-24531
    package:
      type: go-module
      name: stdlib

  # CVE-2024-24790: Go stdlib net/netip vulnerability in fzf binary.
  - vulnerability: CVE-2024-24790
    package:
      type: go-module
      name: stdlib

  # ============================================================================
  # Platform-arc-runner: kaniko/executor and terraform pre-compiled binaries.
  # GHSA-q9hv-hpm4-hj6x affects github.com/cloudflare/circl v1.6.1 bundled in
  # upstream kaniko and terraform binaries. Cannot be patched by our builds.
  # Source: https://github.com/advisories/GHSA-q9hv-hpm4-hj6x
  # ============================================================================

  - vulnerability: GHSA-q9hv-hpm4-hj6x
    package:
      type: go-module
      name: github.com/cloudflare/circl

  # ============================================================================
  # Agent-worker-image / agent-mail: libsqlite3-0 (Debian bookworm).
  # CVE-2025-7458 has no available patch in Debian bookworm (3.40.1-2+deb12u2).
  # Tracked upstream; no fix available for this distribution version.
  # Source: https://security-tracker.debian.org/tracker/CVE-2025-7458
  # ============================================================================

  - vulnerability: CVE-2025-7458
    package:
      name: libsqlite3-0

  # ============================================================================
  # Agent-mail: diskcache unsafe pickle deserialization (no upstream fix).
  # GHSA-w8v5-vhqr-4h9v — diskcache <= 5.6.3 uses pickle for serialization.
  # Not exploitable in our deployment: cache directory is a private container
  # volume only written by the agent-mail application itself.
  # No patched version available. Re-evaluate when diskcache > 5.6.3 ships.
  # Source: https://github.com/advisories/GHSA-w8v5-vhqr-4h9v
  # ============================================================================

  - vulnerability: GHSA-w8v5-vhqr-4h9v
    package:
      type: python
      name: diskcache
