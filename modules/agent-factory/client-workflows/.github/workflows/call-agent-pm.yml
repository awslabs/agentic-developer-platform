name: "Call @agent-pm from ADP"

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  call-agent-pm:
    if: github.event.label.name == 'agent-pm'
    uses: aws-innovate/adp/.github/workflows/agent-pm.yml@main
    with:
      issue_number: ${{ github.event.issue.number }}
      repo_owner: ${{ github.repository_owner }}
      repo_name: ${{ github.event.repository.name }}
      target_repo: ${{ github.repository }}
    secrets: inherit
