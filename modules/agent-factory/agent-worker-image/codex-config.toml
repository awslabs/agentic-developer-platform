# Codex CLI config for headless `codex exec` in the agent-worker pod.
# Baked into the image at $HOME/.codex/config.toml (HOME=/home/agent).
# Design settled by spike #2703; story #2704.
#
# Model path: openai.gpt-5.5 is served from the Bedrock `bedrock-mantle`
# endpoint (us-east-1, Responses API only). Access is enabled-by-default —
# first invoke auto-subscribes (~15-min settling window). It never appears in
# `bedrock list-foundation-models`; that absence is not an access problem.
#
# Auth: AWS SDK credential chain via pod IRSA (zero secrets). The ScaledJob
# role already grants bedrock:InvokeModel*. Fallback is AWS_BEARER_TOKEN_BEDROCK
# from Secrets Manager, injected as an env var (no config change needed).

model = "openai.gpt-5.5"
model_provider = "amazon-bedrock"

# Non-interactive pod: never prompt for approval and never block on a TTY.
# `on-failure`/`on-request` would hang a KEDA-scaled pod with no terminal.
approval_policy = "never"

# AWS region for the built-in amazon-bedrock provider (mantle is us-east-1).
[model_providers.amazon-bedrock.aws]
region = "us-east-1"
