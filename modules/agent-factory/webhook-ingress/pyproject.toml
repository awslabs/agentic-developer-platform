[project]
name = "webhook-ingress-tests"
version = "0.1.0"
description = "End-to-end integration tests for the hosted webhook ingress pipeline"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.0",
    "boto3>=1.34",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: end-to-end tests requiring deployed webhook-ingress stack",
]
# Default: skip integration tests (they need live infra)
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
