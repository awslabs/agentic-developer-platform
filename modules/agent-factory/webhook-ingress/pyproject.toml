[project]
name = "webhook-ingress"
version = "0.1.0"
description = "Webhook ingress Lambda utilities: event logging, rate limiting, metrics"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "moto[dynamodb,cloudwatch]>=5.0",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["lambda"]

[tool.ruff]
line-length = 100
