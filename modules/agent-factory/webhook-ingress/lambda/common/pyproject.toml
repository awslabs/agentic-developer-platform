[project]
name = "adp-webhook-common"
version = "0.1.0"
description = "Shared library for ADP webhook ingress Lambda functions"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
