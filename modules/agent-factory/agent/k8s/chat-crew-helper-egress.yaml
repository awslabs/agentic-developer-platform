apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chat-crew-helper-deny
  namespace: adp-gateway-agents
spec:
  podSelector:
    matchLabels:
      adp.io/crew-checkpoint-helper: 'true'
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chat-crew-helper-gateway-egress
  namespace: adp-gateway-agents
spec:
  podSelector:
    matchLabels:
      adp.io/crew-checkpoint-helper: 'true'
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: adp-gateway
          podSelector:
            matchLabels:
              app.kubernetes.io/name: chat-sandbox-gateway
      ports:
        - protocol: TCP
          port: 8443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chat-crew-helper-dns-egress
  namespace: adp-gateway-agents
spec:
  podSelector:
    matchLabels:
      adp.io/crew-checkpoint-helper: 'true'
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
