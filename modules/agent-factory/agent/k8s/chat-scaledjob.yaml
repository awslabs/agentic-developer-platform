---
# ConfigMap for chat agent configuration. All values with REPLACE_WITH_* are
# substituted at apply time by the deploy pipeline (sed/kustomize). Keep
# env var names in sync with:
#   - modules/agent-factory/agent/src/complex-task-chat/complex-task-chat-agent.ts
#   - modules/agent-factory/infra/chat-agent-infra.tf (output names)
apiVersion: v1
kind: ConfigMap
metadata:
  name: chat-agent-config
  namespace: adp-gateway-agents
  labels:
    app.kubernetes.io/name: chat-agent
    app.kubernetes.io/part-of: agent-gateway
data:
  AGENT_ENTRYPOINT: "complex-task-chat"
  AWS_REGION: "REPLACE_WITH_AWS_REGION"

  # FIFO task queue + FIFO response queue. Response queue became FIFO so
  # AG-UI events (RUN_STARTED → TEXT_MESSAGE_* → RUN_FINISHED) arrive in order
  # at the response Lambda. Producers detect `.fifo` suffix and auto-wire
  # MessageGroupId = session_id + per-event MessageDeduplicationId.
  INPUT_QUEUE_URL: "REPLACE_WITH_CHAT_TASKS_FIFO_URL"
  RESPONSE_QUEUE_URL: "REPLACE_WITH_RESPONSE_QUEUE_URL"

  # DynamoDB tables (from chat-agent-infra.tf outputs)
  CONTEXT_TABLE: "REPLACE_WITH_CONTEXT_TABLE"
  ARTIFACTS_TABLE: "REPLACE_WITH_ARTIFACTS_TABLE"
  MEMORY_TABLE: "REPLACE_WITH_MEMORY_TABLE"

  # S3 artifact bucket
  ARTIFACTS_BUCKET: "REPLACE_WITH_ARTIFACTS_BUCKET"

  # Strategy selection (Phase 1 = dynamo-backed LCM)
  CONTEXT_STRATEGY: "lcm"
  MEMORY_STRATEGY: "dynamo"
  ARTIFACT_STRATEGY: "s3"

  # Token + model config
  CONTEXT_TOKEN_BUDGET: "150000"
  ANTHROPIC_MODEL: "global.anthropic.claude-sonnet-5"
  LCM_SUMMARY_MODEL: "global.anthropic.claude-sonnet-5"
  LCM_SUMMARY_ENDPOINT: "bedrock"
  MODEL_ENDPOINT: "bedrock"
  # The worker starts a local sigv4-proxy with the registered run identity.
  # Claude and summarization both use it. Startup failure stops inference.
  ADP_BEDROCK_VIA: "gateway"
  SIGV4_PROXY_TARGET: "REPLACE_WITH_GATEWAY_APIGW_INVOKE_URL"
  SIGV4_PROXY_PORT: "9090"
  ADP_AGENT_CONTROL_ENDPOINT: "REPLACE_WITH_MODEL_CONTROL_ENDPOINT"
  ADP_WORKLOAD_TOKEN_FILE: "/var/run/adp-model/token"

  # Personas baked into the image
  PERSONAS_DIR: "/app/personas"
---
# KEDA assumes the dedicated chat role through the adp-agent service account.
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: chat-agent-aws-auth
  namespace: adp-gateway-agents
  labels:
    app.kubernetes.io/name: chat-agent
    app.kubernetes.io/part-of: agent-gateway
spec:
  podIdentity:
    provider: aws-eks
    identityOwner: keda
---
# KEDA ScaledJob — chat agent worker driven by FIFO queue depth. One pod per
# received message; FIFO groups serialize per session_id.
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: chat-agent-worker
  namespace: adp-gateway-agents
  labels:
    app.kubernetes.io/name: chat-agent-worker
    app.kubernetes.io/part-of: agent-gateway
spec:
  rollout:
    strategy: gradual
  jobTargetRef:
    parallelism: 1
    completions: 1
    backoffLimit: 2
    # 15 min matches FIFO visibility_timeout_seconds in chat-agent-infra.tf
    activeDeadlineSeconds: 900
    template:
      metadata:
        # Protect in-flight runs from Karpenter/Auto Mode consolidation (see #1807):
        # long-running, restartPolicy: Never — eviction kills the run silently.
        # On the WORK pod (not per-node), so idle nodes still consolidate.
        annotations:
          karpenter.sh/do-not-disrupt: "true"
        labels:
          app.kubernetes.io/name: chat-agent-worker
      spec:
        serviceAccountName: adp-agent
        restartPolicy: Never
        volumes:
          - name: model-policy-identity
            projected:
              sources:
                - serviceAccountToken:
                    audience: adp-agent-bootstrap
                    expirationSeconds: 600
                    path: token
        containers:
          - name: chat-agent
            image: REPLACE_WITH_AGENT_IMAGE
            envFrom:
              - configMapRef:
                  name: chat-agent-config
            volumeMounts:
              - name: model-policy-identity
                mountPath: /var/run/adp-model
                readOnly: true
            env:
              # Must be explicit pod spec for gateway workload verification.
              - name: ADP_CHAT_MODEL_POLICY_ENABLED
                value: "REPLACE_WITH_CHAT_MODEL_POLICY_ENABLED"
              # Optional: injected at runtime by gateway ingest (cross-team item)
              - name: CHAT_AGENT_SESSION_OWNER_ENFORCED
                value: "true"
            resources:
              requests:
                cpu: "500m"
                memory: "1Gi"
                ephemeral-storage: "512Mi"
              limits:
                cpu: "2"
                memory: "4Gi"
                # Cap workspace + artifact-scratch growth per design §7.7.
                ephemeral-storage: "2Gi"
  # 1-second polling cuts the user-perceived "is anything happening" gap.
  # SQS API cost is trivial (~$1/mo for 24/7 polling one queue) and latency
  # for interactive chat is the bigger concern.
  pollingInterval: 1
  minReplicaCount: 0
  maxReplicaCount: 10
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5
  triggers:
    - type: aws-sqs-queue
      authenticationRef:
        name: chat-agent-aws-auth
      metadata:
        queueURL: "REPLACE_WITH_CHAT_TASKS_FIFO_URL"
        queueLength: "1"
        awsRegion: "REPLACE_WITH_AWS_REGION"
