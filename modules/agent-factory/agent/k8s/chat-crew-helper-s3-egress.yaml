apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chat-crew-helper-s3-egress
  namespace: adp-gateway-agents
spec:
  podSelector:
    matchLabels:
      adp.io/crew-checkpoint-helper: 'true'
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: REPLACE_WITH_APPROVED_S3_INTERFACE_IP/32
      ports:
        - protocol: TCP
          port: 443
