apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: adp-crew-role-free-accounts
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["serviceaccounts"]
        scope: Namespaced
  matchConditions:
    - name: crew-accounts-only
      expression: "object.metadata.name in ['adp-crew-pod', 'adp-crew-checkpoint-helper', 'adp-crew-restore-helper']"
  validations:
    - expression: >-
        object.automountServiceAccountToken == false &&
        (!has(object.metadata.annotations) ||
          object.metadata.annotations.all(key, key == 'kubectl.kubernetes.io/last-applied-configuration')) &&
        !has(object.imagePullSecrets) && !has(object.secrets)
      message: Crew and checkpoint helper accounts must not receive AWS roles or credentials
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: adp-crew-role-free-accounts
spec:
  policyName: adp-crew-role-free-accounts
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: adp-gateway-agents
