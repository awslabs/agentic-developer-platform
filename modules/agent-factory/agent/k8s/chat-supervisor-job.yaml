apiVersion: batch/v1
kind: Job
metadata:
  name: adp-chat-supervisor-once
  namespace: adp-gateway-agents
spec:
  suspend: true
  backoffLimit: 0
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: adp-chat-supervisor
    spec:
      serviceAccountName: adp-chat-supervisor
      automountServiceAccountToken: true
      restartPolicy: Never
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: supervisor-identity
          projected:
            sources:
              - serviceAccountToken:
                  audience: sts.amazonaws.com
                  expirationSeconds: 600
                  path: token
      containers:
        - name: supervisor
          image: REPLACE_WITH_SUPERVISOR_IMAGE
          imagePullPolicy: IfNotPresent
          env:
            - name: AGENT_ENTRYPOINT
              value: chat-supervisor
            - name: ADP_CHAT_SUPERVISOR_ROLE_ARN
              value: REPLACE_WITH_SUPERVISOR_ROLE_ARN
            - name: AWS_ROLE_ARN
              value: REPLACE_WITH_SUPERVISOR_ROLE_ARN
            - name: AWS_WEB_IDENTITY_TOKEN_FILE
              value: /var/run/secrets/adp-chat-supervisor/token
            - name: AWS_REGION
              value: REPLACE_WITH_AWS_REGION
            - name: ADP_CHAT_SUPERVISOR_QUEUE_URL
              value: REPLACE_WITH_CHAT_FIFO_URL
            - name: ADP_CHAT_SANDBOX_IMAGE
              value: REPLACE_WITH_SANDBOX_IMAGE_DIGEST
            - name: ADP_CHAT_DATA_URL
              value: REPLACE_WITH_GATEWAY_HTTPS_ORIGIN
            - name: ADP_CREW_DASHBOARD_ORIGIN
              value: REPLACE_WITH_CREW_DASHBOARD_ORIGIN
            - name: ADP_CHAT_SANDBOX_CA_CONFIGMAP
              value: REPLACE_WITH_SANDBOX_CA_CONFIGMAP
            # How long the supervisor waits for a sandbox pod to run before it gives the
            # turn up (sandbox-launcher.ts; 5 s..300 s). Set explicitly so the value is
            # visible on the live ScaledJob and parity-tested (#8059). A container still
            # being created (image pull) earns one extra ADP_CHAT_SANDBOX_PULL_ALLOWANCE_MS
            # (default 180 s) on top; the pre-pull DaemonSet makes that the exception.
            - name: ADP_CHAT_SANDBOX_START_DEADLINE_MS
              value: "REPLACE_WITH_SANDBOX_START_DEADLINE_MS"
            # Deployment default for the executor a persistent session's pod runs when the
            # session has not chosen one (sandbox-supervisor-admission.ts persistentExecutor):
            # sandbox-loop (minimal look-up loop) | claude-code (Claude Agent SDK in the
            # sandbox, #7208) | kirocrew. Rendered from SSM /adp/<env>/gateway/chat-persistent-
            # executor by deploy-chat-scaledjob.sh and parity-tested (#8115). Ephemeral sessions
            # always run sandbox-loop.
            - name: ADP_CHAT_PERSISTENT_EXECUTOR
              value: REPLACE_WITH_PERSISTENT_EXECUTOR
            - name: AWS_EC2_METADATA_DISABLED
              value: "true"
          volumeMounts:
            - name: supervisor-identity
              mountPath: /var/run/secrets/adp-chat-supervisor
              readOnly: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
