# Apply only after the gateway's existing TokenReview role is provisioned.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gateway-chat-model-verifier
  namespace: adp-gateway-agents
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gateway-chat-model-verifier
  namespace: adp-gateway-agents
subjects:
  - kind: ServiceAccount
    name: gateway-service
    namespace: adp-gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gateway-chat-model-verifier
