# NOTE: the agent-gateway-config ConfigMap is NOT defined here.
#
# It is managed by Terraform (modules/agent-factory/infra/gateway-main.tf,
# kubernetes_config_map.agent_gateway_config), because two of its values —
# SIGV4_PROXY_TARGET and the queue/table names — are only knowable from state.
#
# It used to be defined here as well, and the static copy won whenever a script
# applied this file after Terraform. Two values then regressed silently:
# SIGV4_PROXY_TARGET became the literal string REPLACE_WITH_GATEWAY_APIGW_INVOKE_URL
# (deploy-all.sh substitutes four placeholders and never that one), and
# ANTHROPIC_MODEL reverted to whatever this file said. The first is invisible in
# operation: the entrypoint health-checks the proxy and falls back to direct
# Bedrock, so agents keep working while gateway-routed Bedrock (issue #748) is
# quietly inactive.
#
# Do not re-add it. Add new keys to the Terraform resource instead.
# KEDA TriggerAuthentication — tells KEDA to use the operator's own IRSA role
# for SQS queue-depth polling. The operator SA is annotated with
# adp-dev-keda-operator-role (managed by Terraform helm_release.keda).
#
# identityOwner: keda = use the KEDA operator's own SA credentials for scaling.
# The operator role only has sqs:GetQueueAttributes (least-privilege).
# Worker pods use their own SA (adp-agent) with full Bedrock/DDB/Secrets perms.
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: agent-gateway-aws-auth
  namespace: adp-gateway-agents
  labels:
    app.kubernetes.io/name: agent-gateway
    app.kubernetes.io/part-of: agent-gateway
spec:
  podIdentity:
    provider: aws-eks
    identityOwner: keda
---
# KEDA ScaledJob — scales agent pods based on SQS queue depth
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: agent-gateway-worker
  namespace: adp-gateway-agents
  labels:
    app.kubernetes.io/name: agent-gateway-worker
    app.kubernetes.io/part-of: agent-gateway
spec:
  jobTargetRef:
    parallelism: 1
    completions: 1
    backoffLimit: 2
    activeDeadlineSeconds: 900
    template:
      metadata:
        labels:
          app.kubernetes.io/name: agent-gateway-worker
      spec:
        serviceAccountName: adp-agent
        restartPolicy: Never
        containers:
          - name: agent-worker
            image: REPLACE_WITH_AGENT_IMAGE
            envFrom:
              - configMapRef:
                  name: agent-gateway-config
            env:
              - name: GITHUB_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: agent-gateway-secrets
                    key: github-token
                    optional: true
              - name: GH_APP_ID
                valueFrom:
                  secretKeyRef:
                    name: agent-gateway-secrets
                    key: gh-app-id
                    optional: true
              - name: GH_APP_PRIVATE_KEY
                valueFrom:
                  secretKeyRef:
                    name: agent-gateway-secrets
                    key: gh-app-key
                    optional: true
            resources:
              requests:
                cpu: "500m"
                memory: "1Gi"
              limits:
                cpu: "2"
                memory: "4Gi"
  # 1-second polling to match the chat-agent worker (see ../agent/k8s/chat-scaledjob.yaml).
  # SQS polling cost is negligible; latency matters more for interactive UX.
  pollingInterval: 1
  minReplicaCount: 0
  maxReplicaCount: 10
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 5
  triggers:
    - type: aws-sqs-queue
      authenticationRef:
        name: agent-gateway-aws-auth
      metadata:
        queueURL: "REPLACE_WITH_INPUT_QUEUE_URL"
        queueLength: "1"
        awsRegion: "us-east-1"
