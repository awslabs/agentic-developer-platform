apiVersion: apps/v1
kind: Deployment
metadata:
  name: openviking-server
  namespace: agent-context
  labels:
    app.kubernetes.io/name: openviking
    app.kubernetes.io/part-of: agent-context-platform
    app.kubernetes.io/component: application
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openviking
      app.kubernetes.io/component: application
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openviking
        app.kubernetes.io/part-of: agent-context-platform
        app.kubernetes.io/component: application
    spec:
      automountServiceAccountToken: true
      serviceAccountName: agent-context-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: config-injector
        image: python:3.12.4-slim
        command: ["python3", "-c"]
        args:
        - |
          import json, os
          with open('/config-in/ov.conf') as f:
              conf = json.load(f)
          # Inject root_api_key from secret
          root_key = os.environ.get('ROOT_API_KEY', '')
          if root_key:
              conf['server']['root_api_key'] = root_key
          with open('/config-out/ov.conf', 'w') as f:
              json.dump(conf, f, indent=2)
          print("Config injected successfully")
        env:
        - name: ROOT_API_KEY
          valueFrom:
            secretKeyRef:
              name: agent-context-secrets
              key: openviking-root-key
        volumeMounts:
        - name: config-in
          mountPath: /config-in
        - name: config-out
          mountPath: /config-out
      containers:
      - name: openviking
        image: ghcr.io/volcengine/openviking:main
        imagePullPolicy: Always
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
        ports:
        - containerPort: 1933
          name: http
          protocol: TCP
        env:
        - name: OPENVIKING_CONFIG_FILE
          value: /config/ov.conf
        - name: AWS_DEFAULT_REGION
          value: us-east-1
        - name: AWS_REGION
          value: us-east-1
        - name: ROOT_API_KEY
          valueFrom:
            secretKeyRef:
              name: agent-context-secrets
              key: openviking-root-key
        volumeMounts:
        - name: config-out
          mountPath: /config
          readOnly: true
        - name: data
          mountPath: /app/data
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: "2"
            memory: "8Gi"
          limits:
            cpu: "4"
            memory: "16Gi"
        livenessProbe:
          httpGet:
            path: /health
            port: 1933
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 1933
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 1933
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 30
      volumes:
      - name: config-in
        configMap:
          name: openviking-config
          defaultMode: 0644
      - name: config-out
        emptyDir: {}
      - name: data
        persistentVolumeClaim:
          claimName: openviking-data
      - name: tmp
        emptyDir: {}
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: openviking
  namespace: agent-context
  labels:
    app.kubernetes.io/name: openviking
    app.kubernetes.io/part-of: agent-context-platform
    app.kubernetes.io/component: service
spec:
  selector:
    app.kubernetes.io/name: openviking
    app.kubernetes.io/component: application
  ports:
  - name: api
    port: 1933
    targetPort: 1933
  type: ClusterIP
