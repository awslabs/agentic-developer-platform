apiVersion: v1
kind: ConfigMap
metadata:
  name: openviking-config
  namespace: agent-context
  labels:
    app.kubernetes.io/name: openviking
    app.kubernetes.io/part-of: agent-context-platform
    app.kubernetes.io/component: configuration
data:
  ov.conf: |
    {
      "server": {
        "host": "0.0.0.0",
        "port": 1933,
        "cors_origins": ["*"]
      },
      "storage": {
        "workspace": "/app/data"
      },
      "log": {
        "level": "INFO",
        "output": "stdout"
      },
      "embedding": {
        "dense": {
          "provider": "litellm",
          "model": "bedrock/cohere.embed-v4",
          "api_base": "",
          "api_key": "bedrock-irsa",
          "dimension": 1024
        },
        "max_concurrent": 10
      },
      "vlm": {
        "provider": "litellm",
        "model": "bedrock/global.anthropic.claude-opus-4-6-v1",
        "api_base": "",
        "api_key": "bedrock-irsa",
        "max_concurrent": 100
      },
      "code": {
        "code_summary_mode": "ast"
      },
      "memory": {
        "agent_scope_mode": "user+agent"
      }
    }
