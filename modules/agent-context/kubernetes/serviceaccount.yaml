apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-context-sa
  namespace: agent-context
  labels:
    app.kubernetes.io/part-of: agent-context-platform
    app.kubernetes.io/component: serviceaccount
  annotations:
    # IRSA role ARN — set by deploy.sh from Terraform output or IRSA_ROLE_ARN env var.
    # If empty, the SA uses the node role (less secure).
    eks.amazonaws.com/role-arn: "${IRSA_ROLE_ARN}"
automountServiceAccountToken: true
