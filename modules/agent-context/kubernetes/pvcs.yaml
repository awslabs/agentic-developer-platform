apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: codegraph-data
  namespace: agent-context
  labels:
    app.kubernetes.io/part-of: agent-context-platform
    app.kubernetes.io/component: codegraph
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ebs-gp3
  resources:
    requests:
      storage: 50Gi
