# CodeGraphContext - CLI-based code intelligence tool
# Note: CGC does not have a published Docker image on ghcr.io.
# This deployment builds from PyPI using a python base image.
# CGC is CLI-only (no HTTP server mode). It runs as a persistent pod
# accessible via `kubectl exec` or as a sidecar in runner pods.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codegraph-context
  namespace: agent-context
  labels:
    app.kubernetes.io/name: codegraph
    app.kubernetes.io/part-of: agent-context-platform
    app.kubernetes.io/component: application
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: codegraph
      app.kubernetes.io/component: application
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codegraph
        app.kubernetes.io/part-of: agent-context-platform
        app.kubernetes.io/component: application
    spec:
      serviceAccountName: agent-context-sa
      initContainers:
      - name: install-cgc
        image: python:3.12-slim
        command: ["/bin/bash", "-c"]
        args:
        - |
          apt-get update && apt-get install -y git curl gcc g++ make && rm -rf /var/lib/apt/lists/*
          pip install --no-cache-dir codegraphcontext
          # Copy installed packages to shared volume
          cp -r /usr/local/lib/python3.12/site-packages/* /install/site-packages/
          cp /usr/local/bin/cgc /install/bin/cgc 2>/dev/null || true
          cp /usr/local/bin/codegraphcontext /install/bin/codegraphcontext 2>/dev/null || true
          echo "CGC installation complete"
        volumeMounts:
        - name: install
          mountPath: /install
      containers:
      - name: codegraph
        image: python:3.12-slim
        command: ["/bin/bash", "-c"]
        args:
        - |
          # Install git (required at runtime)
          apt-get update && apt-get install -y git && rm -rf /var/lib/apt/lists/*
          # Copy installed packages from init container
          cp -r /install/site-packages/* /usr/local/lib/python3.12/site-packages/ 2>/dev/null || true
          cp /install/bin/cgc /usr/local/bin/cgc 2>/dev/null || true
          cp /install/bin/codegraphcontext /usr/local/bin/codegraphcontext 2>/dev/null || true
          chmod +x /usr/local/bin/cgc /usr/local/bin/codegraphcontext 2>/dev/null || true
          echo "CodeGraphContext ready. Version: $(cgc --version 2>&1 || echo 'unknown')"
          # Keep running for exec access
          while true; do sleep 30; done
        env:
        - name: CGC_HOME
          value: /data/.codegraphcontext
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: agent-context-secrets
              key: github-token
        volumeMounts:
        - name: data
          mountPath: /data
        - name: workspace
          mountPath: /workspace
        - name: install
          mountPath: /install
        resources:
          requests:
            cpu: "1"
            memory: "2Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
        livenessProbe:
          exec:
            command: ["python3", "-c", "print('alive')"]
          initialDelaySeconds: 120
          periodSeconds: 60
        readinessProbe:
          exec:
            command: ["python3", "-c", "print('ready')"]
          initialDelaySeconds: 60
          periodSeconds: 30
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: codegraph-data
      - name: workspace
        emptyDir: {}
      - name: install
        emptyDir: {}
---
# Service for CodeGraphContext (placeholder for future HTTP server mode)
apiVersion: v1
kind: Service
metadata:
  name: codegraph
  namespace: agent-context
  labels:
    app.kubernetes.io/name: codegraph
    app.kubernetes.io/part-of: agent-context-platform
    app.kubernetes.io/component: service
  annotations:
    description: "Placeholder service for CodeGraphContext. Currently CLI-only; use kubectl exec for access."
spec:
  selector:
    app.kubernetes.io/name: codegraph
    app.kubernetes.io/component: application
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  type: ClusterIP
