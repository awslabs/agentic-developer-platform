# Render with scripts/render-codegraph.py --variant legacy and a reviewed image
# receipt. Do not apply this unrendered template. CGC remains CLI-only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: codegraph-context
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: codegraph
    app.kubernetes.io/part-of: agent-context-platform
    app.kubernetes.io/component: application
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: codegraph
      app.kubernetes.io/component: application
  template:
    metadata:
      labels:
        app.kubernetes.io/name: codegraph
        app.kubernetes.io/part-of: agent-context-platform
        app.kubernetes.io/component: application
    spec:
      automountServiceAccountToken: false
      serviceAccountName: ${SERVICE_ACCOUNT}
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: codegraph
        image: ${CODEGRAPH_IMAGE}
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        command: ["sleep", "infinity"]
        env:
        - name: HOME
          value: /data
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: agent-context-secrets
              key: github-token
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: data
          mountPath: /data
        - name: workspace
          mountPath: /workspace
        resources:
          requests:
            cpu: "1"
            memory: "2Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
        livenessProbe:
          exec:
            command: ["python3", "-c", "print('alive')"]
          initialDelaySeconds: 120
          periodSeconds: 60
        readinessProbe:
          exec:
            command: ["python3", "-c", "import codegraphcontext; print('ready')"]
          initialDelaySeconds: 60
          periodSeconds: 30
      volumes:
      - name: tmp
        emptyDir: {}
      - name: data
        persistentVolumeClaim:
          claimName: codegraph-data
      - name: workspace
        emptyDir: {}
---
# Service for CodeGraphContext (placeholder for future HTTP server mode)
apiVersion: v1
kind: Service
metadata:
  name: codegraph
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: codegraph
    app.kubernetes.io/part-of: agent-context-platform
    app.kubernetes.io/component: service
  annotations:
    description: "Placeholder service for CodeGraphContext. Currently CLI-only; use kubectl exec for access."
spec:
  selector:
    app.kubernetes.io/name: codegraph
    app.kubernetes.io/component: application
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  type: ClusterIP
