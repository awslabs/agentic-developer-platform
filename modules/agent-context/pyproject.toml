[project]
name = "agent-context-tests"
version = "0.1.0"
description = "E2E test suite for the Agent Context Intelligence Platform"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "respx>=0.21",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
live = [
    "kubernetes>=29.0",
]
lint = [
    "shellcheck-py>=0.9",
]
all = [
    "kubernetes>=29.0",
    "shellcheck-py>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: uses fixtures/mocks (default, no AWS, no cluster)",
    "live: hits the deployed cluster; needs env vars",
    "live_only: only meaningful in live mode; skipped in unit",
    "graphrag: requires Neptune+OpenSearch; skipped unless GRAPHRAG_ENABLED=true",
    "workflow: triggers a real GitHub Actions workflow via gh; live only",
    "kubectl: shells out to kubectl; fails fast if not available",
]
# Default: run only unit tests (skip live_only, graphrag, workflow)
addopts = "-m 'not live_only and not graphrag and not workflow'"

[tool.ruff]
line-length = 100
