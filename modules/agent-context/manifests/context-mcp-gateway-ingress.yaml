apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: context-mcp-gateway
  namespace: ${NAMESPACE}
  annotations:
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: ${DOOR_MCP_CERTIFICATE_ARN}
    alb.ingress.kubernetes.io/healthcheck-path: /health
spec:
  ingressClassName: alb
  rules:
  - host: ${DOOR_MCP_HOST}
    http:
      paths:
      - path: /mcp
        pathType: Prefix
        backend:
          service:
            name: context-mcp
            port:
              number: 5100
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: context-mcp-gateway-ingress
  namespace: ${NAMESPACE}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: context-mcp
  policyTypes: [Ingress]
  ingress:
  - from:
    - ipBlock:
        cidr: ${DOOR_MCP_ALB_SOURCE_CIDR}
    ports:
    - port: 5100
      protocol: TCP
