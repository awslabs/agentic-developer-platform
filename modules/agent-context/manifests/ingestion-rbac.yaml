# Cross-namespace RBAC for the ingestion pipeline
# Allows the separately admitted trusted-deployment group to access
# ingestion deployment resources. Ordinary repository runners are not subjects:
#   - Read agent-context-secrets (API keys)
#   - Restart deployments (deepwiki)
#   - Create/manage Jobs (wiki indexing)
#   - Exec into pods (DeepWiki wiki generation)
#
# Variables are substituted by template_file() from _common.sh.
# Required env vars: NAMESPACE
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ingestion-pipeline-role
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/part-of: agent-context-platform
    app.kubernetes.io/component: rbac
rules:
  # Read the API keys from the shared secret
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["agent-context-secrets"]
    verbs: ["get"]
  # Restart deployments (rollout restart) — limited to deepwiki
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["deepwiki"]
    verbs: ["get", "patch"]
  # Create and manage wiki-indexing Jobs
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  # Exec into pods (DeepWiki wiki generation) and read logs
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/exec"]
    verbs: ["get", "list", "watch", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: arc-runner-ingestion-access
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/part-of: agent-context-platform
    app.kubernetes.io/component: rbac
subjects:
  - kind: Group
    name: adp:trusted-deployment
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: ingestion-pipeline-role
  apiGroup: rbac.authorization.k8s.io
---
# Read-only runtime verification of the Knowledge Door (context-mcp) by the
# environment connection role (ADP-Agent-${ENVIRONMENT}-platform, EKS access
# entry group adp:runtime-verifier-${ENVIRONMENT}). The orchestration engine's
# deployment verifier reads the Deployment, its ReplicaSets and Pods, and probes
# the Door through the API server's scoped service proxy with an invalid identity
# header, expecting the Door's own 401. Mirrors adp-gateway/adp-runtime-verifier.
# Without this Role the verifier's first read is refused (403) and the door
# story ends "exited without verified runtime evidence" (TLS-X02 door5, #7289).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: adp-runtime-verifier
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/part-of: adp-orchestration
    app.kubernetes.io/component: rbac
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["services/proxy"]
    resourceNames: ["http:context-mcp:5100", "context-mcp"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: adp-runtime-verifier
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/part-of: adp-orchestration
    app.kubernetes.io/component: rbac
subjects:
  - kind: Group
    name: adp:runtime-verifier-${ENVIRONMENT}
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: adp-runtime-verifier
  apiGroup: rbac.authorization.k8s.io
