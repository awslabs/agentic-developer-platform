# Cross-namespace RBAC for the ingestion pipeline
# Allows the GitHub Actions runner (in RUNNER_NAMESPACE) to access
# resources in the agent-context namespace needed by ingest-content.yml:
#   - Read agent-context-secrets (OpenViking API key)
#   - Read/update sourcebot-config ConfigMap
#   - Restart deployments (sourcebot, deepwiki)
#   - Create/manage Jobs (wiki indexing)
#   - Exec into pods (DeepWiki wiki generation)
#
# Variables are substituted by template_file() from _common.sh.
# Required env vars: NAMESPACE, RUNNER_NAMESPACE, RUNNER_SERVICE_ACCOUNT
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ingestion-pipeline-role
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/part-of: agent-context-platform
    app.kubernetes.io/component: rbac
rules:
  # Read the OpenViking API key from the shared secret
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["agent-context-secrets"]
    verbs: ["get"]
  # Read and update the Sourcebot config
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["sourcebot-config"]
    verbs: ["get", "update", "patch"]
  # Restart deployments (rollout restart) — limited to sourcebot and deepwiki
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["sourcebot", "deepwiki"]
    verbs: ["get", "patch"]
  # Create and manage wiki-indexing Jobs
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  # Exec into pods (DeepWiki wiki generation) and read logs
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/exec"]
    verbs: ["get", "list", "watch", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: arc-runner-ingestion-access
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/part-of: agent-context-platform
    app.kubernetes.io/component: rbac
subjects:
  - kind: ServiceAccount
    name: ${RUNNER_SERVICE_ACCOUNT}
    namespace: ${RUNNER_NAMESPACE}
roleRef:
  kind: Role
  name: ingestion-pipeline-role
  apiGroup: rbac.authorization.k8s.io
