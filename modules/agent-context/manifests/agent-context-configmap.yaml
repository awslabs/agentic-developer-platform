# Centralized configuration for the Agent Context platform.
# Single source of truth for all non-secret environment variables.
# All pods consume this via envFrom: configMapRef.
#
# Variables substituted at deploy time by template_file() from _common.sh:
#   NAMESPACE, AWS_REGION, SQS_QUEUE_URL, DYNAMO_TABLE, DEEPWIKI_ENABLED,
#   GRAPHRAG_ENABLED, NEPTUNE_ENDPOINT, NEPTUNE_PORT, OPENSEARCH_ENDPOINT,
#   WIKI_LLM_MODEL, GITHUB_APP_ID_SECRET, GITHUB_APP_KEY_SECRET, GITHUB_APP_OWNER,
#   S3_VECTORS_BUCKET_NAME, S3_VECTORS_REGION, S3_FILES_BUCKET, S3_CONTENT_PREFIX,
#   ZOEKT_URL
#
# Secrets (OPENVIKING_ROOT_KEY) stay in agent-context-secrets — NOT in this ConfigMap.
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-context-config
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/part-of: agent-context-platform
    app.kubernetes.io/component: config
data:
  # --- Core services ---
  OV_URL: "http://openviking.${NAMESPACE}.svc.cluster.local:1933"
  DEEPWIKI_URL: "http://deepwiki.${NAMESPACE}.svc.cluster.local:8001"
  LLM_BASE_URL: "http://litellm-proxy.${NAMESPACE}.svc.cluster.local:4000/v1"
  ZOEKT_URL: "http://zoekt.${NAMESPACE}.svc.cluster.local:6070"

  # --- AWS ---
  AWS_REGION: "${AWS_REGION}"

  # --- S3 Vectors (semantic search) ---
  S3_VECTORS_BUCKET_NAME: "${S3_VECTORS_BUCKET_NAME}"
  S3_VECTORS_REGION: "${S3_VECTORS_REGION}"
  S3_VECTORS_BUCKET: "${S3_VECTORS_BUCKET_NAME}"

  # --- S3 (content store + platform data) ---
  S3_BUCKET_NAME: "${S3_FILES_BUCKET}"
  WIKI_S3_BUCKET: "${S3_FILES_BUCKET}"
  S3_CONTENT_PREFIX: "${S3_CONTENT_PREFIX}"

  # --- SBOM ---
  SBOM_ENABLED: "true"

  # --- SQS + DynamoDB ---
  SQS_QUEUE_URL: "${SQS_QUEUE_URL}"
  DYNAMO_TABLE: "${DYNAMO_TABLE}"

  # --- Feature flags ---
  DEEPWIKI_ENABLED: "${DEEPWIKI_ENABLED}"
  GRAPHRAG_ENABLED: "${GRAPHRAG_ENABLED}"

  # --- Per-task model tiering ---
  # Wiki generation/updates: needs strong reasoning
  MODEL_WIKI: "${WIKI_LLM_MODEL}"
  # Topic tagging: classification task (cheap + fast)
  MODEL_TAGGING: "bedrock/global.anthropic.claude-haiku-4-5-20251001-v1:0"
  # Index page generation: summarization (cheap + fast)
  MODEL_INDEX: "bedrock/global.anthropic.claude-haiku-4-5-20251001-v1:0"
  # Curricula + learning artifacts: needs reasoning
  MODEL_LEARNING: "${WIKI_LLM_MODEL}"
  # GraphRAG entity extraction: structured output (cheap)
  MODEL_GRAPHRAG: "bedrock/global.anthropic.claude-haiku-4-5-20251001-v1:0"
  # Legacy key (backward compat — maps to MODEL_WIKI)
  WIKI_LLM_MODEL: "${WIKI_LLM_MODEL}"

  # --- GraphRAG (Neptune + OpenSearch) ---
  NEPTUNE_ENDPOINT: "${NEPTUNE_ENDPOINT}"
  NEPTUNE_PORT: "${NEPTUNE_PORT}"
  OPENSEARCH_ENDPOINT: "${OPENSEARCH_ENDPOINT}"

  # --- File paths ---
  CLONE_BASE: "/platform-data/repos"
  CODE_INDEX_DIR: "/platform-data/code-indexes"
  LEARNING_DIR: "/platform-data/learning"
  STATE_DIR: "/platform-data"
  REPOS_FILE: "/config/repos.txt"
  URLS_FILE: "/config/urls.txt"
  DOCS_FILE: "/config/docs.txt"
  ACCOUNTS_FILE: "/config/accounts.txt"

  # --- Timeouts and limits ---
  REQUEST_TIMEOUT: "120"
  MAX_WIKIS_PER_RUN: "15"
  MAX_INDEXES_PER_RUN: "15"
  MIN_CLUSTER_SIZE: "3"

  # --- Door OTel tracing (Issue #1754) ---
  KNOWLEDGE_LAYER_TRACES_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://adot-collector.adp-agents.svc.cluster.local:4317"
  OTEL_SERVICE_NAME: "knowledge-layer-door"

  # --- GitHub App ---
  GITHUB_APP_ID_SECRET: "${GITHUB_APP_ID_SECRET}"
  GITHUB_APP_KEY_SECRET: "${GITHUB_APP_KEY_SECRET}"
  GITHUB_APP_OWNER: "${GITHUB_APP_OWNER}"
