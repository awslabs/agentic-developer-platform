# The scheduler has only a purpose-specific projected identity; no content or cloud credentials.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ingestion-refresh
  namespace: ${NAMESPACE}
  labels:
    app: ingestion-refresh
    app.kubernetes.io/part-of: agent-context-platform
    app.kubernetes.io/component: ingestion
spec:
  schedule: ${INGESTION_REFRESH_SCHEDULE}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 259200
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: ingestion-refresh
        spec:
          serviceAccountName: ingestion-refresh
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: refresh
            image: ${INGESTION_IMAGE}
            securityContext:
              runAsNonRoot: true
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              privileged: false
              capabilities:
                drop:
                - ALL
            command:
            - python3
            - /app/queue-refresh.py
            env:
            - name: INGESTION_REFRESH_URL
              value: ${INGESTION_REFRESH_URL}
            - name: INGESTION_REFRESH_TOKEN_FILE
              value: /refresh-identity/token
            - name: AWS_EC2_METADATA_DISABLED
              value: 'true'
            volumeMounts:
            - name: refresh-identity
              mountPath: /refresh-identity
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/appuser
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
          restartPolicy: OnFailure
          volumes:
          - name: refresh-identity
            projected:
              sources:
              - serviceAccountToken:
                  audience: adp-ingestion-refresh
                  expirationSeconds: 3600
                  path: token
          - name: tmp
            emptyDir:
              sizeLimit: 64Mi
          - name: home
            emptyDir:
              sizeLimit: 64Mi
          automountServiceAccountToken: false
