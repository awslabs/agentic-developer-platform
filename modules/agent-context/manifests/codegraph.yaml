apiVersion: apps/v1
kind: Deployment
metadata:
  name: codegraph-context
  namespace: ${NAMESPACE}
  labels:
    app: codegraph
    app.kubernetes.io/name: codegraph
    app.kubernetes.io/part-of: agent-context-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: codegraph
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: codegraph
        app.kubernetes.io/name: codegraph
        app.kubernetes.io/part-of: agent-context-platform
    spec:
      # API token is unnecessary; IRSA uses its separate projected web-identity token.
      automountServiceAccountToken: false
      serviceAccountName: ${SERVICE_ACCOUNT}
      # Requires the reviewed pre-baked image and writable data volume (#6105).
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: codegraph
        image: ${CODEGRAPH_IMAGE}
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        command: ["sleep", "infinity"]
        env:
        - name: HOME
          value: /data
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: data
          mountPath: /data
          subPath: codegraph
        resources:
          requests:
            cpu: "500m"
            memory: "2Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
        livenessProbe:
          exec:
            command: ["python3", "-c", "print('alive')"]
          initialDelaySeconds: 180
          periodSeconds: 60
        readinessProbe:
          exec:
            command: ["python3", "-c", "import codegraphcontext; print('ready')"]
          initialDelaySeconds: 120
          periodSeconds: 30
          failureThreshold: 10
      volumes:
      - name: tmp
        emptyDir: {}
      - name: data
        persistentVolumeClaim:
          claimName: platform-data
---
apiVersion: v1
kind: Service
metadata:
  name: codegraph
  namespace: ${NAMESPACE}
  labels:
    app: codegraph
    app.kubernetes.io/name: codegraph
    app.kubernetes.io/part-of: agent-context-platform
spec:
  selector:
    app: codegraph
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  type: ClusterIP
