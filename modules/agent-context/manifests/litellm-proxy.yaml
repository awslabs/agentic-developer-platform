apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-proxy
  namespace: ${NAMESPACE}
  labels:
    app: litellm-proxy
    app.kubernetes.io/part-of: agent-context-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm-proxy
  template:
    metadata:
      annotations:
        # ADOT injection shadows packaged typing_extensions and breaks AnyIO
        # startup. Keep LiteLLM on its built and tested Python dependencies.
        cloudwatch.aws.amazon.com/auto-annotate-python: "false"
        instrumentation.opentelemetry.io/inject-python: "false"
      labels:
        app: litellm-proxy
        app.kubernetes.io/part-of: agent-context-platform
    spec:
      # API token is unnecessary; IRSA uses its separate projected web-identity token.
      automountServiceAccountToken: false
      serviceAccountName: ${SERVICE_ACCOUNT}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: litellm
        image: ${LITELLM_IMAGE}
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        # Dependencies and the embedding health check fix are baked into the image.
        command: ["litellm"]
        args: ["--config", "/config/config.yaml", "--port", "${LITELLM_PORT}", "--host", "0.0.0.0"]
        ports:
        - containerPort: ${LITELLM_PORT}
          name: http
        env:
        - name: AWS_DEFAULT_REGION
          value: "${BEDROCK_REGION}"
        - name: AWS_REGION
          value: "${BEDROCK_REGION}"
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        volumeMounts:
        - name: home
          mountPath: /home/appuser
        - name: tmp
          mountPath: /tmp
        - name: config
          mountPath: /config
          readOnly: true
        readinessProbe:
          httpGet:
            path: /health/readiness
            port: ${LITELLM_PORT}
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /health/liveliness
            port: ${LITELLM_PORT}
          initialDelaySeconds: 90
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: home
        emptyDir:
          sizeLimit: 256Mi
      - name: tmp
        emptyDir:
          sizeLimit: 256Mi
      - name: config
        configMap:
          name: litellm-config
---
apiVersion: v1
kind: Service
metadata:
  name: litellm-proxy
  namespace: ${NAMESPACE}
  labels:
    app: litellm-proxy
    app.kubernetes.io/part-of: agent-context-platform
spec:
  selector:
    app: litellm-proxy
  ports:
  - port: ${LITELLM_PORT}
    targetPort: ${LITELLM_PORT}
    name: http
  type: ClusterIP

---
# Keep one ready replica through voluntary node consolidation. Deployment
# rollouts still follow the strategy configured above.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: litellm-proxy
  namespace: ${NAMESPACE}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: litellm-proxy
