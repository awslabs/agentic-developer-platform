# Zoekt webserver — exact/regex code search
# Replaces Sourcebot (FSL-1.1-ALv2) with direct Zoekt (Apache-2.0).
# Issue: #1346  Design: docs/design-notes/1346-zoekt-direct-replacement.md
#
# Serves .zoekt shard files from S3 via Mountpoint CSI (platform-data PVC,
# subPath: zoekt-shards). A sidecar container syncs shards from the nested
# S3 layout into the flat index dir every 60s. Zoekt's built-in watcher
# detects new/changed shards automatically (also on a 60s rescan interval).
#
# Fix: #3287 — shards are now continuously synced, not just at pod startup.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zoekt-webserver
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: zoekt-webserver
    app.kubernetes.io/part-of: agent-context-platform
    app.kubernetes.io/component: search
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: zoekt-webserver
  template:
    metadata:
      # These services do not run a JVM; omit the unused Java agent and JARs.
      annotations:
        cloudwatch.aws.amazon.com/auto-annotate-java: "false"
        instrumentation.opentelemetry.io/inject-java: "false"
      labels:
        app.kubernetes.io/name: zoekt-webserver
        app.kubernetes.io/part-of: agent-context-platform
        app.kubernetes.io/component: search
    spec:
      serviceAccountName: ${SERVICE_ACCOUNT}
      # Pod-level security context (#6105 — pod security reconciliation).
      securityContext:
        # Read/traverse the synthetic Mountpoint GID without filesystem chown.
        # Both S3 readers retain readOnly mounts; no group write permission.
        supplementalGroups: [10001]
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: prepare-index
        image: docker.io/library/busybox@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        command: ["sh", "-c"]
        args:
          - |
            echo "Initial shard sync from S3 mount to flat index dir..."
            mkdir -p /data/index
            find /mnt/s3-shards -name "*.zoekt" -exec cp {} /data/index/ \;
            count=$(ls /data/index/*.zoekt 2>/dev/null | wc -l)
            echo "Initial sync complete: ${count} shard files"
        volumeMounts:
        - name: scratch
          mountPath: /data
        - name: index-data
          mountPath: /mnt/s3-shards
          subPath: zoekt-shards
          readOnly: true
      containers:
      - name: zoekt-webserver
        image: ${ZOEKT_IMAGE}
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          capabilities:
            drop: ["ALL"]
        # Raw Zoekt listens only on pod loopback. Only the Door has this key.
        command: ["zoekt-auth-proxy"]
        env:
        - name: ZOEKT_API_KEY
          valueFrom:
            secretKeyRef:
              name: zoekt-backend-auth
              key: api-key
        ports:
        - containerPort: 6070
          name: http
          protocol: TCP
        volumeMounts:
        - name: scratch
          mountPath: /data
        resources:
          requests:
            cpu: "500m"
            memory: "2Gi"
          limits:
            cpu: "1"
            memory: "4Gi"
        readinessProbe:
          httpGet:
            path: /healthz
            port: 6070
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 6070
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
      # Sidecar: continuously syncs new .zoekt shards from the nested S3 mount
      # into the flat /data/index dir that zoekt-webserver watches.
      # Runs every 60s. Only copies files newer than what's already present (cp -u).
      # Removes shards from the index that no longer exist on S3 (stale cleanup).
      # Issue: #3287
      - name: shard-sync
        image: docker.io/library/busybox@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        command: ["sh", "-c"]
        args:
          - |
            echo "shard-sync: starting continuous sync (interval=60s)"
            while true; do
              sleep 60

              # Sync new/updated shards from S3 mount to flat index dir
              # cp -u only copies when source is newer than destination
              find /mnt/s3-shards -name "*.zoekt" -exec cp -u {} /data/index/ \;

              # Remove shards from index that no longer exist on S3
              # (handles repo deletion or re-indexing that removes old shards)
              for f in /data/index/*.zoekt; do
                [ -f "$f" ] || continue
                basename=$(basename "$f")
                if ! find /mnt/s3-shards -name "$basename" -print -quit | grep -q .; then
                  echo "shard-sync: removing stale shard $basename"
                  rm -f "$f"
                fi
              done

              count=$(ls /data/index/*.zoekt 2>/dev/null | wc -l)
              echo "shard-sync: cycle complete, ${count} shards in index"
            done
        volumeMounts:
        - name: scratch
          mountPath: /data
        - name: index-data
          mountPath: /mnt/s3-shards
          subPath: zoekt-shards
          readOnly: true
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
      volumes:
      - name: index-data
        persistentVolumeClaim:
          claimName: platform-data
      - name: scratch
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: zoekt
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: zoekt-webserver
    app.kubernetes.io/part-of: agent-context-platform
spec:
  selector:
    app.kubernetes.io/name: zoekt-webserver
  ports:
  - name: http
    port: 6070
    targetPort: 6070
    protocol: TCP
  type: ClusterIP

---
# Keep one ready replica through voluntary node consolidation. Deployment
# rollouts still follow the strategy configured above.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: zoekt-webserver
  namespace: ${NAMESPACE}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zoekt-webserver

---
# Defense in depth; authentication remains mandatory even without CNI enforcement.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zoekt-door-only
  namespace: ${NAMESPACE}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: zoekt-webserver
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: context-mcp
    ports:
    - protocol: TCP
      port: 6070
