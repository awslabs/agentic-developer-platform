# Zoekt webserver — exact/regex code search
# Replaces Sourcebot (FSL-1.1-ALv2) with direct Zoekt (Apache-2.0).
# Issue: #1346  Design: docs/design-notes/1346-zoekt-direct-replacement.md
#
# Serves .zoekt shard files from S3 via Mountpoint CSI (platform-data PVC,
# subPath: zoekt-shards). A sidecar container syncs shards from the nested
# S3 layout into the flat index dir every 60s. Zoekt's built-in watcher
# detects new/changed shards automatically (also on a 60s rescan interval).
#
# Fix: #3287 — shards are now continuously synced, not just at pod startup.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zoekt-webserver
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: zoekt-webserver
    app.kubernetes.io/part-of: agent-context-platform
    app.kubernetes.io/component: search
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: zoekt-webserver
  template:
    metadata:
      # These services do not run a JVM; omit the unused Java agent and JARs.
      annotations:
        cloudwatch.aws.amazon.com/auto-annotate-java: "false"
        instrumentation.opentelemetry.io/inject-java: "false"
      labels:
        app.kubernetes.io/name: zoekt-webserver
        app.kubernetes.io/part-of: agent-context-platform
        app.kubernetes.io/component: search
    spec:
      serviceAccountName: ${SERVICE_ACCOUNT}
      # Pod-level security context (#6105 — pod security reconciliation).
      securityContext:
        # Copy shards as the same unprivileged identity that reads them.
        # Mountpoint exposes 0640 files; cp retains that mode in emptyDir.
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        # Read/traverse the synthetic Mountpoint GID without filesystem chown.
        # Both S3 readers retain readOnly mounts; no group write permission.
        supplementalGroups: [10001]
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: prepare-index
        image: docker.io/library/busybox@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        command: ["sh", "-c"]
        env:
        - name: SYNC_ONCE
          value: "true"
        args:
          - &sync_shards |
            set -eu
            shard_source=${SHARD_SOURCE_DIR:-/mnt/s3-shards}
            shard_index=${SHARD_INDEX_DIR:-/data/index}
            mkdir -p "$shard_index"

            # Copy off to the side, then rename within the same filesystem.
            # Zoekt must never mmap a file that is still being copied from S3.
            sync_shards() (
              shard_list=""
              shard_names=""
              shard_tmp=""
              trap 'rm -f "$shard_list" "$shard_names" "$shard_tmp"' EXIT
              shard_list=$(mktemp "$shard_index/.source-list.XXXXXX") || exit 1
              shard_names=$(mktemp "$shard_index/.source-names.XXXXXX") || exit 1
              find "$shard_source" -type f -name '*.zoekt' -print > "$shard_list" || exit 1
              sed 's|.*/||' "$shard_list" > "$shard_names" || exit 1

              while IFS= read -r shard; do
                shard_name=${shard##*/}
                shard_target="$shard_index/$shard_name"
                if [ -f "$shard_target" ] && [ ! "$shard" -nt "$shard_target" ]; then
                  continue
                fi
                shard_tmp=$(mktemp "$shard_index/.copy.XXXXXX") || exit 1
                cp "$shard" "$shard_tmp" || exit 1
                chmod 0640 "$shard_tmp" || exit 1
                touch -r "$shard" "$shard_tmp" || exit 1
                mv -f "$shard_tmp" "$shard_target" || exit 1
                shard_tmp=""
              done < "$shard_list"

              # Only remove stale files after a complete listing and successful copies.
              for shard in "$shard_index"/*.zoekt; do
                [ -f "$shard" ] || continue
                shard_name=${shard##*/}
                if ! grep -Fxq -- "$shard_name" "$shard_names"; then
                  echo "shard-sync: removing stale shard $shard_name"
                  rm -f "$shard" || exit 1
                fi
              done
            )

            if [ "${SYNC_ONCE:-false}" = true ]; then
              sync_shards
              exit $?
            fi
            while true; do
              sleep 60
              if ! sync_shards; then
                echo "shard-sync: sync failed; retaining the last published shards" >&2
              fi
            done
        volumeMounts:
        - name: scratch
          mountPath: /data
        - name: index-data
          mountPath: /mnt/s3-shards
          subPath: zoekt-shards
          readOnly: true
      containers:
      - name: zoekt-webserver
        image: ${ZOEKT_IMAGE}
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          capabilities:
            drop: ["ALL"]
        # Raw Zoekt listens only on pod loopback. Only the Door has this key.
        command: ["zoekt-auth-proxy"]
        env:
        - name: ZOEKT_API_KEY
          valueFrom:
            secretKeyRef:
              name: zoekt-backend-auth
              key: api-key
        ports:
        - containerPort: 6070
          name: http
          protocol: TCP
        volumeMounts:
        - name: scratch
          mountPath: /data
        resources:
          requests:
            cpu: "500m"
            memory: "2Gi"
          limits:
            cpu: "1"
            memory: "4Gi"
        readinessProbe:
          httpGet:
            path: /healthz
            port: 6070
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /healthz
            port: 6070
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
      # Sidecar: continuously syncs new .zoekt shards from the nested S3 mount
      # into the flat /data/index dir that zoekt-webserver watches.
      # Runs every 60s. Publishes newer files atomically and preserves source mtimes.
      # Removes shards from the index that no longer exist on S3 (stale cleanup).
      # Issue: #3287
      - name: shard-sync
        image: docker.io/library/busybox@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        command: ["sh", "-c"]
        args:
          - *sync_shards
        volumeMounts:
        - name: scratch
          mountPath: /data
        - name: index-data
          mountPath: /mnt/s3-shards
          subPath: zoekt-shards
          readOnly: true
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
      volumes:
      - name: index-data
        persistentVolumeClaim:
          claimName: platform-data
      - name: scratch
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: zoekt
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: zoekt-webserver
    app.kubernetes.io/part-of: agent-context-platform
spec:
  selector:
    app.kubernetes.io/name: zoekt-webserver
  ports:
  - name: http
    port: 6070
    targetPort: 6070
    protocol: TCP
  type: ClusterIP

---
# Keep one ready replica through voluntary node consolidation. Deployment
# rollouts still follow the strategy configured above.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: zoekt-webserver
  namespace: ${NAMESPACE}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zoekt-webserver

---
# Defense in depth; authentication remains mandatory even without CNI enforcement.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zoekt-door-only
  namespace: ${NAMESPACE}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: zoekt-webserver
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: context-mcp
    ports:
    - protocol: TCP
      port: 6070
