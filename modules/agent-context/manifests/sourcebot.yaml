# PostgreSQL for Sourcebot
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sourcebot-postgres
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: sourcebot-postgres
    app.kubernetes.io/part-of: agent-context-platform
    app.kubernetes.io/component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sourcebot-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sourcebot-postgres
        app.kubernetes.io/part-of: agent-context-platform
    spec:
      containers:
      - name: postgres
        image: docker.io/postgres:16
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: agent-context-secrets
              key: sourcebot-postgres-password
        - name: POSTGRES_DB
          value: "sourcebot"
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "1"
            memory: "2Gi"
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "postgres"]
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "postgres"]
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: sourcebot-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: sourcebot-postgres
  namespace: ${NAMESPACE}
spec:
  selector:
    app.kubernetes.io/name: sourcebot-postgres
  ports:
  - port: 5432
    targetPort: 5432
  type: ClusterIP
---
# Redis for Sourcebot
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sourcebot-redis
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: sourcebot-redis
    app.kubernetes.io/part-of: agent-context-platform
    app.kubernetes.io/component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sourcebot-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sourcebot-redis
        app.kubernetes.io/part-of: agent-context-platform
    spec:
      initContainers:
      - name: fix-permissions
        image: busybox:1.36
        command: ["sh", "-c", "chown -R 999:999 /data"]
        volumeMounts:
        - name: data
          mountPath: /data
      containers:
      - name: redis
        image: docker.io/redis:8
        command: ["redis-server", "--dir", "/data", "--appendonly", "yes"]
        ports:
        - containerPort: 6379
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        readinessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          exec:
            command: ["redis-cli", "ping"]
          initialDelaySeconds: 15
          periodSeconds: 10
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: sourcebot-redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: sourcebot-redis
  namespace: ${NAMESPACE}
spec:
  selector:
    app.kubernetes.io/name: sourcebot-redis
  ports:
  - port: 6379
    targetPort: 6379
  type: ClusterIP
---
# Sourcebot main application
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sourcebot
  namespace: ${NAMESPACE}
  labels:
    app: sourcebot
    app.kubernetes.io/name: sourcebot
    app.kubernetes.io/part-of: agent-context-platform
    app.kubernetes.io/component: application
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sourcebot
      app.kubernetes.io/component: application
  template:
    metadata:
      labels:
        app: sourcebot
        app.kubernetes.io/name: sourcebot
        app.kubernetes.io/part-of: agent-context-platform
        app.kubernetes.io/component: application
    spec:
      serviceAccountName: ${SERVICE_ACCOUNT}
      initContainers:
      - name: token-init
        image: python:3.11-slim
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -e
            pip install --no-cache-dir PyJWT requests boto3 cryptography 2>/dev/null
            python3 /scripts/github-app-token.py \
              --secret-id "${GITHUB_APP_SECRET_ID}" \
              --region "${SECRETS_MANAGER_REGION}" \
              --output-file /shared/github-token 2>&1 || {
              echo "WARN: GitHub App token generation failed. Falling back to K8s secret."
              # Fall back to token from K8s secret if GitHub App is not configured
              if [ -n "${GITHUB_TOKEN_FALLBACK}" ]; then
                echo "${GITHUB_TOKEN_FALLBACK}" > /shared/github-token
                echo "Using fallback token from environment."
              else
                echo "placeholder" > /shared/github-token
                echo "WARNING: No GitHub token available. Sourcebot will start but cannot sync repos."
              fi
            }
        env:
        - name: GITHUB_TOKEN_FALLBACK
          valueFrom:
            secretKeyRef:
              name: agent-context-secrets
              key: github-token
              optional: true
        volumeMounts:
        - name: shared
          mountPath: /shared
        - name: token-script
          mountPath: /scripts
      containers:
      - name: sourcebot
        image: ${SOURCEBOT_IMAGE}
        ports:
        - containerPort: 3000
          name: http
        command: ["/bin/sh", "-c"]
        args:
          - |
            # Read token from shared volume (written by init container)
            if [ -f /shared/github-token ]; then
              export GITHUB_TOKEN="$(cat /shared/github-token)"
            fi
            # Execute the original Sourcebot entrypoint
            exec /app/entrypoint.sh
        env:
        - name: CONFIG_PATH
          value: /data/config.json
        - name: AUTH_URL
          value: "http://localhost:3000"
        - name: AUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: agent-context-secrets
              key: sourcebot-auth-secret
        - name: SOURCEBOT_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: agent-context-secrets
              key: sourcebot-encryption-key
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: agent-context-secrets
              key: sourcebot-postgres-password
        - name: DATABASE_URL
          value: "postgresql://postgres:$(POSTGRES_PASSWORD)@sourcebot-postgres.${NAMESPACE}.svc.cluster.local:5432/sourcebot"
        - name: REDIS_URL
          value: "redis://sourcebot-redis.${NAMESPACE}.svc.cluster.local:6379"
        volumeMounts:
        - name: shared
          mountPath: /shared
        - name: data
          mountPath: /data
          subPath: sourcebot
        - name: config
          mountPath: /data/config.json
          subPath: config.json
        resources:
          requests:
            cpu: "1"
            memory: "4Gi"
          limits:
            cpu: "2"
            memory: "8Gi"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 5
      volumes:
      - name: shared
        emptyDir: {}
      - name: data
        persistentVolumeClaim:
          claimName: platform-data
      - name: config
        configMap:
          name: sourcebot-config
      - name: token-script
        configMap:
          name: github-app-token-script
---
# Sourcebot Service — exposes both the Next.js web UI (3000) and
# Zoekt webserver (6070) for direct code search without NextAuth.
apiVersion: v1
kind: Service
metadata:
  name: sourcebot
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: sourcebot
    app.kubernetes.io/part-of: agent-context-platform
spec:
  selector:
    app.kubernetes.io/name: sourcebot
    app.kubernetes.io/component: application
  ports:
  - name: http
    port: 3000
    targetPort: 3000
  - name: zoekt
    port: 6070
    targetPort: 6070
  type: ClusterIP
