apiVersion: v1
kind: ConfigMap
metadata:
  name: openviking-config
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: openviking
    app.kubernetes.io/part-of: agent-context-platform
    app.kubernetes.io/component: configuration
data:
  ov.conf: |
    {
      "server": {
        "host": "0.0.0.0",
        "port": 1933,
        "cors_origins": ["*"]
      },
      "storage": {
        "workspace": "/app/data"
      },
      "log": {
        "level": "INFO",
        "output": "stdout"
      },
      "embedding": {
        "max_concurrent": 50,
        "dense": {
          "provider": "openai",
          "api_key": "not-needed",
          "api_base": "http://litellm-proxy.${NAMESPACE}.svc.cluster.local:${LITELLM_PORT}/v1",
          "model": "bedrock/${BEDROCK_EMBEDDING_MODEL}",
          "dimension": ${BEDROCK_EMBEDDING_DIMENSION}
        }
      },
      "vlm": {
        "provider": "openai",
        "api_key": "not-needed",
        "api_base": "http://litellm-proxy.${NAMESPACE}.svc.cluster.local:${LITELLM_PORT}/v1",
        "model": "bedrock/${BEDROCK_VLM_MODEL}",
        "max_concurrent": ${VLM_MAX_CONCURRENT},
        "max_retries": ${VLM_MAX_RETRIES}
      },
      "code": {
        "code_summary_mode": "ast"
      },
      "memory": {
        "agent_scope_mode": "user+agent"
      }
    }
