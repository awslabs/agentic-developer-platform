# Context MCP Server — the verb surface for the Knowledge layer.
# Exposes 6 tools (search, understand, impact, browse, remember, experience)
# at context-mcp.agent-context.svc.cluster.local:5100.
#
# Endpoints:
#   POST /mcp   — Native MCP (Streamable HTTP, JSON-RPC 2.0) for MCP clients (#1602)
#   GET  /tools — Legacy REST tool listing (backward-compat)
#   POST /call  — Legacy REST tool invocation (backward-compat)
#   GET  /health — Health/readiness probe
#
# Issue: #1417, #1602  Parent: #1345
# Design: docs/knowledge-layer-storage-design.md (§6 read path, §12 structural tier)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: context-mcp
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: context-mcp
    app.kubernetes.io/part-of: agent-context-platform
    app.kubernetes.io/component: mcp-server
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: context-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: context-mcp
        app.kubernetes.io/part-of: agent-context-platform
        app.kubernetes.io/component: mcp-server
    spec:
      serviceAccountName: ${SERVICE_ACCOUNT}
      containers:
      - name: context-mcp
        image: ${CONTEXT_MCP_IMAGE}
        ports:
        - containerPort: 5100
          name: http
          protocol: TCP
        envFrom:
        - configMapRef:
            name: agent-context-config
        env:
        - name: MCP_PORT
          value: "5100"
        - name: MCP_HOST
          value: "0.0.0.0"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: agent-context-secrets
              key: DATABASE_URL
              optional: true
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "1Gi"
        readinessProbe:
          httpGet:
            path: /health
            port: 5100
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 5100
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: context-mcp
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: context-mcp
    app.kubernetes.io/part-of: agent-context-platform
    app.kubernetes.io/component: mcp-server
spec:
  selector:
    app.kubernetes.io/name: context-mcp
  ports:
  - name: http
    port: 5100
    targetPort: 5100
    protocol: TCP
  type: ClusterIP
