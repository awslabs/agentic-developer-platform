# Context MCP Server — the verb surface for the Knowledge layer.
# Exposes 6 tools (search, understand, impact, browse, remember, experience)
# at context-mcp.agent-context.svc.cluster.local:5100.
#
# Endpoints:
#   POST /mcp   — Native MCP (Streamable HTTP, JSON-RPC 2.0) for MCP clients (#1602)
#   GET  /tools — Legacy REST tool listing (backward-compat)
#   POST /call  — Legacy REST tool invocation (backward-compat)
#   GET  /health — Health/readiness probe
#
# Issue: #1417, #1602  Parent: #1345
# Design: docs/knowledge-layer-storage-design.md (§6 read path, §12 structural tier)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: context-mcp
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: context-mcp
    app.kubernetes.io/part-of: agent-context-platform
    app.kubernetes.io/component: mcp-server
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: context-mcp
  template:
    metadata:
      annotations:
        adp.dev/door-verification-keys: "${DOOR_VERIFICATION_KEYS_SHA256}"
      # These services do not run a JVM; omit the unused Java agent and JARs.
      annotations:
        cloudwatch.aws.amazon.com/auto-annotate-java: "false"
        instrumentation.opentelemetry.io/inject-java: "false"
      labels:
        app.kubernetes.io/name: context-mcp
        app.kubernetes.io/part-of: agent-context-platform
        app.kubernetes.io/component: mcp-server
    spec:
      # API token is unnecessary; IRSA uses its separate projected web-identity token.
      automountServiceAccountToken: false
      serviceAccountName: ${SERVICE_ACCOUNT}
      # Pod-level security context (#6105 — pod security reconciliation).
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: context-mcp
        image: ${CONTEXT_MCP_IMAGE}
        securityContext:
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          privileged: false
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 5100
          name: http
          protocol: TCP
        envFrom:
        - configMapRef:
            name: agent-context-config
        env:
        - name: MCP_PORT
          value: "5100"
        - name: MCP_HOST
          value: "0.0.0.0"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: agent-context-secrets
              key: DATABASE_URL
              optional: true
        # Private backend credential; never shared with Door callers.
        - name: ZOEKT_API_KEY
          valueFrom:
            secretKeyRef:
              name: zoekt-backend-auth
              key: api-key
        - name: DOOR_VERIFICATION_KEYS
          valueFrom:
            configMapKeyRef:
              name: agent-context-door-identity
              key: keys.json
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "1Gi"
        # Readiness is NOT the same question as liveness here (#5658).
        #
        # /ready reports 503 while the ACL store is unreachable, so a Door that
        # cannot authorise a read is pulled from Service endpoints instead of
        # receiving traffic it would have to refuse. /health stays on liveness:
        # the process is alive and its error is observable, so restarting it
        # would only hide the misconfiguration in a crash loop.
        readinessProbe:
          httpGet:
            path: /ready
            port: 5100
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 5100
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 5
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: context-mcp
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: context-mcp
    app.kubernetes.io/part-of: agent-context-platform
    app.kubernetes.io/component: mcp-server
spec:
  selector:
    app.kubernetes.io/name: context-mcp
  ports:
  - name: http
    port: 5100
    targetPort: 5100
    protocol: TCP
  type: ClusterIP

---
# Keep one ready replica through voluntary node consolidation. Deployment
# rollouts still follow the strategy configured above.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: context-mcp
  namespace: ${NAMESPACE}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: context-mcp
