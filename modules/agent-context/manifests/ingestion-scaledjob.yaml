# Queue access exists only in admission; the worker is skipped by the IRSA webhook.
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: ingestion-worker
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/part-of: agent-context-platform
    app.kubernetes.io/component: ingestion-worker
spec:
  rollout:
    strategy: gradual
  jobTargetRef:
    parallelism: 1
    completions: 1
    backoffLimit: 0
    template:
      metadata:
        annotations:
          karpenter.sh/do-not-disrupt: 'true'
          eks.amazonaws.com/skip-containers: worker
          cloudwatch.aws.amazon.com/auto-annotate-python: 'false'
          instrumentation.opentelemetry.io/inject-python: 'false'
          cloudwatch.aws.amazon.com/auto-annotate-java: 'false'
          instrumentation.opentelemetry.io/inject-java: 'false'
          cloudwatch.aws.amazon.com/auto-annotate-nodejs: 'false'
          instrumentation.opentelemetry.io/inject-nodejs: 'false'
          cloudwatch.aws.amazon.com/auto-annotate-dotnet: 'false'
          instrumentation.opentelemetry.io/inject-dotnet: 'false'
        labels:
          app: ingestion-worker
          adp.io/ingestion-isolation: v1
      spec:
        serviceAccountName: ingestion-receiver
        restartPolicy: Never
        securityContext:
          runAsUser: 10001
          runAsGroup: 10001
          fsGroup: 10001
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile:
            type: RuntimeDefault
        containers:
        - name: worker
          image: ${INGESTION_IMAGE}
          command:
          - python3
          - /app/sqs-worker.py
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop:
              - ALL
          env:
          - name: AWS_REGION
            valueFrom:
              configMapKeyRef:
                name: agent-context-config
                key: AWS_REGION
                optional: true
          - name: S3_BUCKET_NAME
            valueFrom:
              configMapKeyRef:
                name: agent-context-config
                key: S3_BUCKET_NAME
                optional: true
          - name: S3_VECTORS_BUCKET
            valueFrom:
              configMapKeyRef:
                name: agent-context-config
                key: S3_VECTORS_BUCKET
                optional: true
          - name: S3_VECTORS_BUCKET_NAME
            valueFrom:
              configMapKeyRef:
                name: agent-context-config
                key: S3_VECTORS_BUCKET_NAME
                optional: true
          - name: S3_VECTORS_REGION
            valueFrom:
              configMapKeyRef:
                name: agent-context-config
                key: S3_VECTORS_REGION
                optional: true
          - name: S3_CONTENT_PREFIX
            valueFrom:
              configMapKeyRef:
                name: agent-context-config
                key: S3_CONTENT_PREFIX
                optional: true
          - name: ZOEKT_INDEX_ENABLED
            valueFrom:
              configMapKeyRef:
                name: agent-context-config
                key: ZOEKT_INDEX_ENABLED
                optional: true
          - name: ZOEKT_SHARDS_S3_PREFIX
            valueFrom:
              configMapKeyRef:
                name: agent-context-config
                key: ZOEKT_SHARDS_S3_PREFIX
                optional: true
          - name: EMBED_VECTORS_ENABLED
            valueFrom:
              configMapKeyRef:
                name: agent-context-config
                key: EMBED_VECTORS_ENABLED
                optional: true
          - name: SBOM_ENABLED
            valueFrom:
              configMapKeyRef:
                name: agent-context-config
                key: SBOM_ENABLED
                optional: true
          - name: DEEPWIKI_ENABLED
            valueFrom:
              configMapKeyRef:
                name: agent-context-config
                key: DEEPWIKI_ENABLED
                optional: true
          - name: GRAPHRAG_ENABLED
            valueFrom:
              configMapKeyRef:
                name: agent-context-config
                key: GRAPHRAG_ENABLED
                optional: true
          - name: DEEPWIKI_URL
            valueFrom:
              configMapKeyRef:
                name: agent-context-config
                key: DEEPWIKI_URL
                optional: true
          - name: LLM_BASE_URL
            valueFrom:
              configMapKeyRef:
                name: agent-context-config
                key: LLM_BASE_URL
                optional: true
          - name: WIKI_LLM_MODEL
            valueFrom:
              configMapKeyRef:
                name: agent-context-config
                key: WIKI_LLM_MODEL
                optional: true
          - name: NEPTUNE_ENDPOINT
            valueFrom:
              configMapKeyRef:
                name: agent-context-config
                key: NEPTUNE_ENDPOINT
                optional: true
          - name: NEPTUNE_PORT
            valueFrom:
              configMapKeyRef:
                name: agent-context-config
                key: NEPTUNE_PORT
                optional: true
          - name: GATEWAY_CALLBACK_URL
            valueFrom:
              configMapKeyRef:
                name: agent-context-config
                key: GATEWAY_CALLBACK_URL
                optional: true
          - name: INGESTION_JOB_FILE
            value: /admission/job.json
          - name: INGESTION_CONTROL_URL
            value: ${INGESTION_CONTROL_URL}
          - name: INGESTION_ISOLATION_REQUIRED
            value: 'true'
          - name: AWS_EC2_METADATA_DISABLED
            value: 'true'
          - name: AWS_CONFIG_FILE
            value: /dev/null
          - name: AWS_SHARED_CREDENTIALS_FILE
            value: /dev/null
          - name: CLONE_BASE
            value: /tmp/repos
          - name: SCIP_ENABLED
            value: 'true'
          - name: SCIP_ISOLATED_BACKEND
            value: ''
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: MODEL_WIKI
            valueFrom:
              configMapKeyRef:
                name: agent-context-config
                key: MODEL_WIKI
                optional: true
          - name: MODEL_GRAPHRAG
            valueFrom:
              configMapKeyRef:
                name: agent-context-config
                key: MODEL_GRAPHRAG
                optional: true
          - name: EMBED_MODEL
            valueFrom:
              configMapKeyRef:
                name: agent-context-config
                key: EMBED_MODEL
                optional: true
          - name: S3_VECTORS_SHARD_COUNT
            valueFrom:
              configMapKeyRef:
                name: agent-context-config
                key: S3_VECTORS_SHARD_COUNT
                optional: true
          - name: S3_SOURCE_ALLOWLIST
            valueFrom:
              configMapKeyRef:
                name: agent-context-config
                key: S3_SOURCE_ALLOWLIST
                optional: true
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: '2'
              memory: 6Gi
          volumeMounts:
          - name: platform-data
            mountPath: /platform-data
          - name: tmp
            mountPath: /tmp
          - name: home
            mountPath: /home/appuser
          - name: admission
            mountPath: /admission
            readOnly: true
        volumes:
        - name: platform-data
          emptyDir:
            sizeLimit: 2Gi
        - name: tmp
          emptyDir:
            sizeLimit: 10Gi
        - name: home
          emptyDir:
            sizeLimit: 512Mi
        - name: admission
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        automountServiceAccountToken: false
        hostNetwork: false
        hostPID: false
        hostIPC: false
        initContainers:
        - name: admission
          image: ${INGESTION_IMAGE}
          command:
          - python3
          - /app/receive-job.py
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            privileged: false
            capabilities:
              drop:
              - ALL
          env:
          - name: AWS_REGION
            value: ${AWS_REGION}
          - name: SQS_QUEUE_URL
            value: ${SQS_QUEUE_URL}
          - name: INGESTION_CONTROL_URL
            value: ${INGESTION_CONTROL_URL}
          - name: AWS_EC2_METADATA_DISABLED
            value: 'true'
          - name: INGESTION_JOB_FILE
            value: /admission/job.json
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
          - name: admission
            mountPath: /admission
          - name: tmp
            mountPath: /tmp
    activeDeadlineSeconds: 3900
  pollingInterval: 10
  maxReplicaCount: 50
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 10
  triggers:
  - type: aws-sqs-queue
    metadata:
      queueURL: ${SQS_QUEUE_URL}
      queueLength: '1'
      awsRegion: ${AWS_REGION}
    authenticationRef:
      name: keda-aws-auth
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: keda-aws-auth
  namespace: ${NAMESPACE}
spec:
  podIdentity:
    provider: aws-eks
