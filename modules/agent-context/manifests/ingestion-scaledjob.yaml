# KEDA ScaledJob for parallel ingestion from SQS
# Scales 0->50 pods based on SQS queue depth (one pod per message)
#
# Variables substituted by template_file() from _common.sh:
#   NAMESPACE, SERVICE_ACCOUNT, INGESTION_IMAGE, SQS_QUEUE_URL,
#   DYNAMO_TABLE, AWS_REGION, OV_URL, OPENVIKING_ROOT_KEY,
#   DEEPWIKI_URL, NEPTUNE_ENDPOINT, NEPTUNE_PORT, OPENSEARCH_ENDPOINT,
#   LLM_BASE_URL, WIKI_LLM_MODEL, GRAPHRAG_ENABLED, ECR_REGISTRY,
#   GITHUB_APP_ID_SECRET, GITHUB_APP_KEY_SECRET, GITHUB_APP_OWNER
---
apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: ingestion-worker
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/part-of: agent-context-platform
    app.kubernetes.io/component: ingestion-worker
spec:
  jobTargetRef:
    parallelism: 1
    completions: 1
    backoffLimit: 0
    template:
      metadata:
        # Protect in-flight ingestion runs from Karpenter/Auto Mode consolidation
        # (see #1807): long-running, restartPolicy: Never — eviction kills the run
        # silently. On the WORK pod (not per-node), so idle nodes still consolidate.
        annotations:
          karpenter.sh/do-not-disrupt: "true"
        labels:
          app: ingestion-worker
      spec:
        serviceAccountName: ${SERVICE_ACCOUNT}
        restartPolicy: Never
        containers:
          - name: worker
            image: ${INGESTION_IMAGE}
            command: ["python3", "/app/sqs-worker.py"]
            envFrom:
              - configMapRef:
                  name: agent-context-config
              - secretRef:
                  name: agent-context-secrets
                  optional: true
            env:
              # Override: SQS workers clone to ephemeral /tmp (not persistent storage)
              - name: CLONE_BASE
                value: /tmp/repos
              # Secret injected from K8s Secret (not ConfigMap)
              - name: OPENVIKING_ROOT_KEY
                valueFrom:
                  secretKeyRef:
                    name: agent-context-secrets
                    key: openviking-root-key
                    # OpenViking is deprecated/absent in this stack; the worker
                    # defaults this to "" (sqs-worker.py). Without optional:true,
                    # KEDA's strict job-template validation fails to create the
                    # ScaledJob (ScaledJobCheckFailed) when the secret is absent.
                    # Mirrors repo-refresh-cronjob.yaml. (#2213 follow-up)
                    optional: true
            resources:
              requests:
                cpu: "500m"
                memory: "1Gi"
              limits:
                cpu: "2"
                memory: "4Gi"
            volumeMounts:
              - name: platform-data
                mountPath: /platform-data
              - name: tmp
                mountPath: /tmp
        volumes:
          - name: platform-data
            persistentVolumeClaim:
              claimName: platform-data
          - name: tmp
            emptyDir:
              sizeLimit: 10Gi
  pollingInterval: 10
  maxReplicaCount: 50
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 10
  triggers:
    - type: aws-sqs-queue
      metadata:
        queueURL: "${SQS_QUEUE_URL}"
        queueLength: "1"
        awsRegion: "${AWS_REGION}"
      authenticationRef:
        name: keda-aws-auth
---
# KEDA TriggerAuthentication for AWS (uses IRSA)
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: keda-aws-auth
  namespace: ${NAMESPACE}
spec:
  podIdentity:
    provider: aws-eks
