# Mountpoint for Amazon S3 Storage — PV + PVC
# Replaces the previous EFS-over-S3 overlay with direct S3 bucket mount.
# deploy-s3-files.sh handles the bucket name substitution automatically.
#
# Mountpoint semantics:
#   - New file creation + full-object overwrite (--allow-overwrite)
#   - Deletion allowed (--allow-delete)
#   - NO random/partial writes, NO file locking
#   - Writers must produce complete artifacts (never modify in place)
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: agent-context-platform-data
  labels:
    app.kubernetes.io/part-of: agent-context-platform
    app.kubernetes.io/component: s3-mountpoint-storage
spec:
  capacity:
    storage: 1Ti  # Notional — S3 storage is unlimited
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - allow-delete
    - allow-overwrite
  csi:
    driver: s3.csi.aws.com
    volumeHandle: s3-csi-<BUCKET_NAME>
    volumeAttributes:
      bucketName: <BUCKET_NAME>
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: platform-data
  namespace: agent-context
  labels:
    app.kubernetes.io/part-of: agent-context-platform
    app.kubernetes.io/component: s3-mountpoint-storage
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: 1Ti
  volumeName: agent-context-platform-data
