# S3 Files Storage — StorageClass + PV + PVC
# The PV volumeHandle must be set to the EFS file system ID from Terraform output.
# deploy-s3-files.sh handles this substitution automatically.
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: s3-files
provisioner: efs.csi.aws.com
parameters:
  provisioningMode: efs-ap
  directoryPerms: "700"
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: agent-context-s3-files
  labels:
    app.kubernetes.io/part-of: agent-context-platform
    app.kubernetes.io/component: s3-files-storage
spec:
  capacity:
    storage: 500Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: s3-files
  csi:
    driver: efs.csi.aws.com
    volumeHandle: <FILE_SYSTEM_ID>
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: platform-data
  namespace: agent-context
  labels:
    app.kubernetes.io/part-of: agent-context-platform
    app.kubernetes.io/component: s3-files-storage
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: s3-files
  resources:
    requests:
      storage: 500Gi
  volumeName: agent-context-s3-files
