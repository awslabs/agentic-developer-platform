    grounding_snippet: |
      {"name": "agent-skills", "version": "1.0.0", "commands": "commands/",
       "skills": "skills/", "description": "A curated set of agent skills"}
    expected_score: 0

  - id: cal-echo-02
    category: echo
    verb: impact
    query: "copilotkit/packages/react-core/src/hooks/useCopilotChat.ts"
    response:
      target: "copilotkit/packages/react-core/src/hooks/useCopilotChat.ts"
      affected:
        - file: "packages/react-core/src/hooks/useCopilotChat.ts"
          symbol: "useCopilotChat"
