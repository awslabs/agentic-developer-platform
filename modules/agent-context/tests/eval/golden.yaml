# Golden-answer evaluation dataset for the Knowledge Layer.
# ~75 questions (5 per repo) spread across MCP verbs.
#
# Verbs:
#   search_exact    — literal token/symbol/string known to exist
#   search_semantic — concept query using words NOT in the code (vocabulary-mismatch)
#   understand      — explain a specific module/function
#   impact          — what calls / what breaks if X changes
#   browse          — navigate repo structure
#
# Each question has:
#   id, repo, verb, query, expected (verb-specific), pass_criterion, notes

questions:
  # ═══════════════════════════════════════════════════════════════════════════
  # Repo 1: agent-skills (addyosmani/agent-skills) — skills/agent
  # ═══════════════════════════════════════════════════════════════════════════

  - id: agent-skills-01
    repo: agent-skills
    verb: search_exact
    query: "doubt-driven-development"
    expected:
      files: ["skills/doubt-driven-development"]
    pass_criterion: "Expected skill directory/file in top 3 results"

  - id: agent-skills-02
    repo: agent-skills
    verb: search_semantic
    query: "automated code quality review before merging"
    expected:
      files: ["commands/review.toml", "skills/code-review"]
    pass_criterion: "Review-related skill or command file in top 5 results"
    notes: "Vocabulary mismatch: query says 'merging' and 'quality review', repo uses 'review' command and skill names"

  - id: agent-skills-03
    repo: agent-skills
    verb: browse
    query: "/agent-skills/commands"
    expected:
      entries: ["build.toml", "review.toml", "spec.toml", "test.toml", "ship.toml"]
    pass_criterion: "At least 3 of the 7 TOML command files listed"

  - id: agent-skills-04
    repo: agent-skills
    verb: understand
    query: "agent-skills/plugin.json"
    expected:
      location: "plugin.json"
      key_facts: ["agent-skills", "1.0.0", "commands", "skills"]
    pass_criterion: "Response mentions plugin name, version, and structure"

  - id: agent-skills-05
    repo: agent-skills
    verb: search_semantic
    query: "breaking down complex features into smaller implementation tasks"
    expected:
      files: ["commands/planning.toml", "skills/idea-refine"]
    pass_criterion: "Planning command or idea-refine skill in top 5 results"
    notes: "Vocabulary mismatch: query uses 'breaking down' and 'implementation tasks', repo uses 'planning' and 'idea-refine'"

