# Golden-answer evaluation dataset for the Knowledge Layer.
# Per-repo × per-verb grounded questions (5 per applicable verb per repo).
# Total: 325 questions across 15 repos, grounded in actual GitHub repo source.
#
# Verbs:
#   search_exact    — literal token/symbol/string known to exist
#   search_semantic — concept query using words NOT in the code (vocabulary-mismatch)
#   understand      — explain a specific module/function
#   impact          — what calls / what breaks if X changes
#   browse          — navigate repo structure
#
# Each question has:
#   id, repo, verb, query, expected (verb-specific), pass_criterion, notes
#
# Grounding:
#   Every expected answer is verified against the actual repo source on GitHub.
#   Anti-gaming: expected facts are verifiable in code, not echoed from query.
#
# Coverage:
#   - Code repos (6): search_exact, search_semantic, understand, impact, browse
#   - Skill repos with code (1, last30days-skill): all 5 verbs
#   - Skill repos without impact (6): search_exact, search_semantic, understand, browse
#   - List repos (2): search_exact, search_semantic, browse
#   - remember/experience: NOT repo-grounded (store→recall round-trip test only)

questions:
- id: agent-skills-search_exact-1
  repo: agent-skills
  verb: search_exact
  query: code review checklist
  expected:
    files:
    - skills/code-review-and-quality/SKILL.md
    - commands/review.toml
    - references/security-checklist.md
    content:
    - code review
    - checklist
  pass_criterion: Returns skills/code-review-and-quality/SKILL.md and commands/review.toml as top results
