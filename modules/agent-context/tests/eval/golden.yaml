# ═══════════════════════════════════════════════════════════════════════════════
# END-TO-END TASK SCENARIOS: chained verb evaluations
# ═══════════════════════════════════════════════════════════════════════════════
#
# These test whether combined answers from multiple verbs would actually
# unblock an agent task. The judge grades the combined output.

tasks:
  - id: task-01
    description: "Find where review commands are defined and explain the review workflow"
    repo: agent-skills
    steps:
      - verb: search_exact
        query: "review"
      - verb: understand
        query: "agent-skills/commands/review.toml"
    expected_substance: |
      The combined answer should: (1) locate review.toml in commands/, and
      (2) explain what the review command does — its trigger, steps, and
      purpose in the agent workflow. An agent receiving this should be able
      to invoke or modify the review command without further research.
    pass_threshold: 2

  - id: task-02
    description: "Identify all parallel execution capabilities and their dependencies"
    repo: superpowers
    steps:
      - verb: search_semantic
        query: "running tasks in parallel"
      - verb: impact
        query: "superpowers/skills/dispatching-parallel-agents"
    expected_substance: |
      The combined answer should: (1) find the parallel-agents and worktrees
      skills via semantic search, and (2) show what depends on the parallel-agents
      skill (what breaks if it changes). An agent should understand both the
      capability AND its integration surface.
    pass_threshold: 2

  - id: task-03
    description: "Navigate the CopilotKit monorepo and understand the core hook"
    repo: CopilotKit
    steps:
      - verb: browse
        query: "/CopilotKit/packages"
      - verb: understand
        query: "CopilotKit/packages/react-core/src/hooks/useCopilotChat.ts"
    expected_substance: |
      The combined answer should: (1) show the packages directory structure
      (react-core, react-textarea, react-ui, backend, etc.), and (2) explain
      what useCopilotChat does — it's a React hook that provides chat message
      state and a sendMessage function. An agent should understand the monorepo
      layout AND the core hook's API.
    pass_threshold: 2
