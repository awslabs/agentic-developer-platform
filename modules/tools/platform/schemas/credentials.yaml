openapi: 3.0.3
info:
  title: ADP consent-bound credential broker
  version: 1.0.0
servers:
  - url: https://broker.example.invalid
paths:
  /internal/v1/user-credentials:
    get:
      operationId: list
      summary: List only consented credential metadata, never stored values
      parameters:
        - name: service
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Consented credential metadata
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                    service:
                      type: string
                    label:
                      type: string
                    credential_type:
                      type: string
  /internal/v1/proxy-request:
    post:
      operationId: proxy_request
      summary: Make a server-side HTTP request using a consented credential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service, method, url]
              properties:
                service:
                  type: string
                label:
                  type: string
                method:
                  type: string
                url:
                  type: string
                headers:
                  type: object
                  additionalProperties:
                    type: string
                body:
                  type: string
      responses:
        '200':
          description: Upstream response without the credential
  /internal/v1/credential-assume-role:
    post:
      operationId: assume_role
      summary: Return an AWS session of at most 900 seconds for a consented role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                service:
                  type: string
                label:
                  type: string
                purpose:
                  type: string
      responses:
        '200':
          description: Short-lived tagged STS credentials; not a stored secret
  /internal/v1/credential-materialize:
    post:
      operationId: materialize
      summary: Materialize a consented file credential as a short-lived URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service]
              properties:
                service:
                  type: string
                label:
                  type: string
      responses:
        '201':
          description: Short-lived materialization URL
