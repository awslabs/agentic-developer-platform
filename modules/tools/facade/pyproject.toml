[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "adp-tools-facade"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["adp-tools-shared==0.1.0", "fastapi>=0.115,<1", "httpx>=0.27,<1", "boto3>=1.35,<2", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio==1.4.0", "ruff==0.9.6", "PyYAML>=6,<7", "moto[dynamodb]>=5,<6", "setuptools>=75", "wheel>=0.45"]

[tool.setuptools]
packages = ["tools_facade"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
