[project]
name = "bedrockgateway"
version = "0.1.0"
description = "Multi-tenant SaaS proxy for Amazon Bedrock"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "sqlalchemy[asyncio]==2.0.46",
    "asyncpg==0.30.0",
    "alembic==1.14.1",
    "pydantic==2.12.5",
    "pydantic-settings==2.12.0",
    "boto3==1.36.0",
    "httpx==0.28.1",
    "redis==5.2.1",
    "prometheus-client==0.22.0",
    "passlib[bcrypt]==1.7.4",
    "PyJWT[crypto]==2.10.1",
    "python-json-logger==2.0.7",
    "email-validator==2.1.1",
    # Issue #143: Chat logging uses boto3 with asyncio.to_thread for async S3/Comprehend
    # No additional deps needed; aioboto3 could be added for native async support if needed
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "pytest-cov==6.0.0",
    "fakeredis==2.26.2",
    "moto==5.0.27",
    "ruff==0.9.6",
    "pytest-timeout==2.3.1",
    "aiosqlite>=0.20.0",
]
# Issue #20: Playwright browser tests for frontend smoke testing
browser = [
    "playwright>=1.40.0",
    "pytest-playwright>=0.4.0",
]
# Issue #144: OpenTelemetry/X-Ray tracing dependencies (Phase 2)
tracing = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-instrumentation-fastapi>=0.41b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20.0",
    "opentelemetry-propagator-aws-xray>=1.0.0",
    "opentelemetry-sdk-extension-aws>=2.0.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py312"
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "unit: runs against fixtures/mocks (default)",
    "live: hits a deployed environment, requires env vars",
    "live_only: only makes sense in live mode; skipped in unit",
    "browser: requires Playwright",
    "e2e: mark test as end-to-end test",
    "integration: mark test as integration test",
    "slow: mark test as slow running",
    "auth: authentication and token management tests",
    "admin: admin dashboard, RBAC, logging, and metrics tests",
    "proxy: proxy/LLM request and response format tests",
    "budget: budget management and enforcement tests",
    "ratelimit: rate limiting configuration and enforcement tests",
    "pool: Bedrock account pool management tests",
    "frontend: frontend smoke tests (Playwright)",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff.lint.per-file-ignores]
"tests/cli/conftest.py" = ["N802", "E501"]
"tests/shared/test_logging_middleware.py" = ["F841"]
# UP042: str+Enum to StrEnum migration deferred - pre-existing pattern across codebase
"src/admin/config.py" = ["UP042"]
"src/admin/schemas.py" = ["UP042"]
"src/proxy/schemas.py" = ["UP042"]
"src/ratelimit/models.py" = ["UP042"]
"src/shared/schemas/budget.py" = ["UP042"]
"src/usage/config.py" = ["UP042"]
