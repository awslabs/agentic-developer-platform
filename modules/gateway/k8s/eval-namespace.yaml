# Reference only. This namespace is owned by Terraform in
# modules/agent-factory/infra/runner-rbac.tf (kubernetes_namespace.gateway_evals);
# gateway-deploy.yml skips cluster-scoped manifests, so applying this file is a
# manual bootstrap step, never the pipeline path.
apiVersion: v1
kind: Namespace
metadata:
  name: adp-gateway-evals
  labels:
    app.kubernetes.io/part-of: adp
    app.kubernetes.io/component: gateway-evals
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
