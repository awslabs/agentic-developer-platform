# =============================================================================
# Bedrock Gateway Ingress Configuration
# =============================================================================
# This Ingress creates an internal ALB managed by the AWS Load Balancer
# Controller. Traffic reaches the gateway via CloudFront → API Gateway →
# VPC Link v2 → ALB → pod (see modules/gateway/infra/modules/api-gateway).
#
# Subnets are auto-discovered via the `kubernetes.io/role/internal-elb=1`
# tags applied to private subnets in platform/infra/modules/networking. This
# keeps the manifest portable across accounts.
# =============================================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bedrockgateway
  namespace: adp-gateway
  labels:
    app.kubernetes.io/name: bedrockgateway
    app.kubernetes.io/part-of: bedrock-gateway
  annotations:
    # Internal ALB. CloudFront VPC Origin (configured in
    # modules/gateway/infra/modules/cloudfront) terminates public traffic and
    # forwards to this ALB. Direct public access is intentionally not allowed.
    alb.ingress.kubernetes.io/scheme: internal

    # ==========================================================================
    # Subnet Configuration (for internal ALB)
    # ==========================================================================
    # The AWS Load Balancer Controller auto-discovers subnets via the tags
    # `kubernetes.io/role/internal-elb=1` (private) and `kubernetes.io/role/elb=1`
    # (public), applied by `platform/infra/modules/networking/main.tf` to every
    # subnet at EKS bootstrap time. Auto-discovery makes this manifest portable
    # across accounts (the same Terraform creates correctly-tagged subnets in
    # each customer-linked account, and this Ingress works as-is).
    #
    # Hardcoding subnet IDs here would tie this manifest to one VPC and break
    # cross-account deploys (the IDs are unique per account).
    #
    # If you need to override (e.g. for a fixed-subnet test environment), add:
    #   alb.ingress.kubernetes.io/subnets: subnet-xxxxx,subnet-yyyyy
    # ==========================================================================

    # ==========================================================================
    # Standard ALB Configuration
    # ==========================================================================
    # Use AWS Load Balancer Controller (EKS Auto Mode managed)
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "30"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/healthy-threshold-count: "2"
    alb.ingress.kubernetes.io/unhealthy-threshold-count: "2"
    alb.ingress.kubernetes.io/success-codes: "200"
    # ALB idle timeout — must be >= API Gateway integration timeout (900s)
    # to prevent the ALB from dropping long-running Bedrock requests.
    # Default is 60s which causes 504s for requests >60s.
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=900
    # NOTE (#4010): this annotation is a NO-OP on EKS Auto Mode. AWS documents
    # `alb.ingress.kubernetes.io/group.name` as "Not supported — specify groups
    # in IngressClass only", and k8s/ingressclass.yaml uses the Auto Mode
    # controller (`eks.amazonaws.com/alb`). Confirmed live: the ALB is named
    # `k8s-adpgatew-bedrockg-*` and tagged
    # `ingress.eks.amazonaws.com/stack: adp-gateway/bedrockgateway` — the
    # implicit single-Ingress pattern, not a `bedrockgw` group.
    #
    # It is left in place ON PURPOSE: the ALB's identity (and therefore its DNS
    # name) derives from this stack, and grouping on Auto Mode would have to move
    # to `IngressClassParams.spec.group.name`, which REPLACES the load balancer
    # and forces a CloudFront-VPC-origin + API-GW + SSM re-wire. Do not "fix"
    # this by removing it and adding IngressClassParams grouping without a
    # planned DNS migration. See docs/design-notes/4010-internal-plane-alb-separation.md
    alb.ingress.kubernetes.io/group.name: bedrockgw

    # ==========================================================================
    # Internal-plane deny at the edge (Issue #4010) — NOT APPLIED HERE
    # ==========================================================================
    # The `/internal` -> fixed-response 403 rule that makes the internal control
    # plane unreachable from the edge is deliberately NOT in this manifest. It
    # lives in `k8s/patches/edge-internal-deny.yaml` and is applied ONLY by
    # `modules/gateway/scripts/apply-internal-plane-deny.sh`, which first
    # verifies that the API Gateway `/internal/{proxy+}` integration has already
    # been repointed at the internal-plane ALB.
    #
    # WHY IT IS NOT HERE — this ordering is load-bearing, not stylistic.
    # Both apply paths (`gateway-deploy.yml` and `deploy-all.sh`) loop over
    # `k8s/*.yaml` and apply everything unconditionally, with no knowledge of
    # Terraform state. Shipping the deny in this file therefore takes the deny
    # live on merge, while the API-GW integration may still target THIS ALB
    # (`internal_plane_alb_dns` empty -> Terraform falls back to the edge ALB).
    # The result is every SigV4 `/internal/{proxy+}` call — agent provenance
    # writes, credential paths — getting a 403 from this ALB until a human
    # manually re-wires. The deny must be strictly LAST: after the internal ALB
    # exists AND after the integration is confirmed repointed off this one.
    #
    # `k8s/patches/` is a SUBDIRECTORY on purpose: both apply loops glob
    # `k8s/*.yaml` non-recursively, so a partial Ingress placed alongside this
    # file would be applied blindly and would three-way-merge away the real
    # `spec.rules` below. Do not move it up a level.
    #
    # See docs/design-notes/4010-internal-plane-alb-separation.md ("Rollout
    # ordering") for the full ordering argument and the rollback procedure.
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bedrockgateway
                port:
                  number: 80
