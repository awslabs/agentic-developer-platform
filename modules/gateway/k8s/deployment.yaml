apiVersion: apps/v1
kind: Deployment
metadata:
  name: bedrockgateway
  namespace: adp-gateway
  labels:
    app.kubernetes.io/name: bedrockgateway
    app.kubernetes.io/part-of: bedrock-gateway
spec:
  # Baseline replica count; scale-out beyond this is owned by the HPA
  # (k8s/hpa.yaml, min 2). Kept in the manifest (rather than removed, the
  # usual HPA practice) because the deploy workflow client-side-applies this
  # file — dropping the field would prune it and default the Deployment to 1
  # replica for a window on every deploy. The cost of keeping it: a deploy
  # momentarily resets scale to 2 and the HPA re-raises it within a sync
  # period (~15s).
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: bedrockgateway
  template:
    metadata:
      labels:
        app: bedrockgateway
        app.kubernetes.io/name: bedrockgateway
        app.kubernetes.io/part-of: bedrock-gateway
    spec:
      serviceAccountName: gateway-service
      # Let endpoint removal propagate, then allow in-flight model streams to
      # finish during Uvicorn shutdown (the ALB idle timeout is 900 seconds).
      terminationGracePeriodSeconds: 960
      # Issue #5675: pod-level hardening. This pod holds BG_TOKEN_SECRET_KEY (the
      # platform's token-signing key), BG_INTERNAL_API_KEY (the internal shared
      # secret), BG_GITHUB_APP_PRIVATE_KEY and the two agent signing keys. Running
      # it as root meant any code execution here reached every one of them, so a
      # moderate defect became a full platform credential compromise and a forced
      # rotation of everything the platform issues.
      #
      # Set at BOTH levels, here and on the container below. That is not
      # redundancy for its own sake: a container-level securityContext silently
      # OVERRIDES the pod default, so a future container that omits a field it
      # inherits today is not a visible regression. Stating it twice makes the
      # container's own guarantee explicit and independently testable.
      #
      # The image (Dockerfile, USER 65532) is the third layer. runAsNonRoot below
      # only FAILS a root image — it cannot make one non-root — so the image and
      # this block have to agree. They are asserted together in
      # tests/infra/test_gateway_container_hardening.py.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # Volume ownership for the emptyDir mounts below, so the unprivileged
        # user can actually write to its scratch space.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bedrockgateway
          image: REPLACE_WITH_GATEWAY_IMAGE
          lifecycle:
            preStop:
              exec:
                command: ["python", "-S", "-c", "import time; time.sleep(30)"]
          # Container-level hardening (#5675). readOnlyRootFilesystem and
          # capabilities have NO pod-level equivalent — they only exist here — so
          # this block is required, not a restatement of the pod's.
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 8080
              protocol: TCP
          # Memory sized for 4 uvicorn workers + streaming/chat-logging buffers.
          # The memory REQUEST is 1.5Gi. The HPA's utilization math is computed
          # against requests, so this value sets the scale-out line: too low and
          # the idle baseline alone exceeds the 75% target, the autoscaler reads
          # idle as overload, and the fleet pins at maxReplicas with no burst
          # headroom. That has now happened twice — first at a 1Gi request
          # (768Mi line vs ~800Mi baseline), then at 1.25Gi (960Mi line vs a
          # baseline that has since grown to ~900Mi as new routers landed).
          # Measured 2026-09-19: a freshly started pod is 890-900Mi, so 1.25Gi
          # left only ~60Mi of margin. At 1.5Gi the 75% line is ~1152Mi, giving
          # ~250Mi over baseline, so idle settles toward minReplicas and
          # scale-out fires on real load.
          #
          # When adding anything that raises cold-start footprint, re-measure the
          # baseline and keep it under ~60% of this request, or the autoscaler
          # silently degenerates into "always at max" again.
          #
          # The 2Gi LIMIT is unchanged — it stays the OOM ceiling. CPU is
          # untouched: the gateway is async I/O-bound and idles at 1-2% even
          # under full agent traffic. See k8s/hpa.yaml.
          resources:
            requests:
              cpu: 250m
              memory: 1.5Gi
            limits:
              cpu: 1000m
              memory: 2Gi
          # Issue #5675: the writable surface readOnlyRootFilesystem leaves behind.
          #
          # Scoped deliberately: /app (the code, the pricing snapshots, the
          # contracts) stays read-only, which is the point of the control — the
          # served process cannot rewrite its own program or its pinned rate data.
          #
          # I checked what the gateway actually writes before choosing these. No
          # tempfile/mkdtemp/open-for-write exists in src/ — logs go to stdout
          # (BG_LOG_FORMAT=json) and chat records go to S3 (chat_logging/s3_writer).
          # These two mounts are therefore for the RUNTIME's incidental writes, not
          # the application's, and both are known first-use write sites:
          #   /tmp   — Python's default temp dir; stdlib, httpx and botocore all
          #            reach for it, and an OTEL exporter buffering to disk would
          #            too (BG_OTEL_ENABLED=true).
          #   /home/appuser — botocore/boto3 cache credentials and endpoint data
          #            under HOME. The Dockerfile creates this dir for uid 65532.
          #
          # Sized small on purpose. These are caches; an unbounded emptyDir counts
          # against node ephemeral storage and would let a runaway write evict the
          # pod, which is the failure mode this control is supposed to prevent.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/appuser
          # Startup delay sized for 4 uvicorn workers each registering all
          # routes from scratch. New modules (vault, internal, connections)
          # have added ~5-8s to cold start since the last probe tuning.
          # If startup gets slower again, prefer a startupProbe over raising
          # these further — cleaner semantic.
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          envFrom:
            - configMapRef:
                name: bedrockgateway-config
            # Applied by webhook Terraform after the gateway's first bootstrap.
            # Later envFrom entries override the legacy rendered defaults.
            - configMapRef:
                name: adp-worker-authority-config
                optional: true
          env:
            # Shared service keys stay in the gateway; protected workers receive
            # only authenticated own-run service results (#5195/#5210).
            - name: ADP_MARKER_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-run-services
                  key: marker-signing-key
                  optional: true
            - name: ADP_DOOR_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: bedrockgateway-secrets
                  key: internal-api-key
                  optional: true
            # Cap glibc's per-thread malloc arenas. Default is 8 x ncores, and
            # each arena grows in 64Mi steps that are never returned to the OS.
            # proxy/service.py dispatches one asyncio.to_thread per streaming
            # chunk, so threads contend constantly and spread allocations across
            # every arena; measured effect was pod RSS ratcheting up ~400 bytes
            # per streamed delta and never coming back down (all inactive_anon).
            # 2 arenas keeps freed heap reusable and lets trim actually return it.
            - name: MALLOC_ARENA_MAX
              value: "2"
            # Return freed heap to the OS at 128KiB rather than letting glibc's
            # adaptive threshold grow unbounded under streaming churn.
            - name: MALLOC_TRIM_THRESHOLD_
              value: "131072"
            - name: AGENT_RUN_CREDENTIAL_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-authority-signing
                  key: run-credential-key
                  optional: true
            - name: AGENT_CONTROL_ENVELOPE_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-authority-signing
                  key: envelope-signing-key
                  optional: true
            - name: BG_LOG_FORMAT
              value: "json"
            - name: BG_LOG_LEVEL
              value: "INFO"
            # Issue #133: SECURITY FIX - Token secret now from Secrets Manager
            # The BG_TOKEN_SECRET_KEY is stored in AWS Secrets Manager and synced
            # to a Kubernetes Secret. The deploy workflow must create this secret:
            #   kubectl create secret generic bedrockgateway-secrets \
            #     --from-literal=token-secret-key=$(aws secretsmanager get-secret-value ...)
            - name: BG_TOKEN_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: bedrockgateway-secrets
                  key: token-secret-key
                  optional: true  # Optional for local dev; required in production
            # Shared secret used by platform-pod scripts (assume-customer-creds.py
            # via load-deploy-config.sh) to authenticate /internal/v1/* calls.
            # TEMPORARY — auth_deps.py:43 prefers IRSA via API GW (X-Caller-Identity);
            # this fallback path is what unblocks the Phase 1 apply of EPIC #1107
            # and gets removed in Phase 3 (#1110) once both clients use SigV4.
            - name: BG_INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bedrockgateway-secrets
                  key: internal-api-key
                  optional: true
            - name: BG_APIGW_PROVENANCE_SECRET
              valueFrom:
                secretKeyRef:
                  name: bedrockgateway-secrets
                  key: apigw-provenance-secret
                  optional: true
            # Issue #5656 (A05): signing key for single-use identity-linking
            # ("magic link") tokens. Its own key, NOT the session-signing key —
            # src/shared/config.py no longer falls back to BG_TOKEN_SECRET_KEY, so
            # the two are independently rotatable and a leaked magic-link token no
            # longer has to be contained by signing every user out. Generated into
            # Secrets Manager by gateway-deploy.yml and projected here by
            # reference; no literal value is committed or passed as a container argument.
            # Optional so the pod still starts before the secret exists — the
            # magic-link endpoints answer 503 not_configured until it does, rather
            # than quietly issuing tokens under the session key.
            - name: BG_MAGIC_LINK_SECRET
              valueFrom:
                secretKeyRef:
                  name: bedrockgateway-secrets
                  key: magic-link-secret
                  optional: true
            # GitHub App private key — used by the connections "Link GitHub"
            # install-callback to fetch installation metadata (GitHubAppClient).
            # Slug + App ID come from the configmap (BG_GITHUB_APP_SLUG /
            # BG_GITHUB_APP_ID); the key is sensitive so it lives in the secret.
            # Populated by wire-github-app.sh. Optional so the gateway still
            # starts before GitHub is wired.
            - name: BG_GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: bedrockgateway-secrets
                  key: BG_GITHUB_APP_PRIVATE_KEY
                  optional: true
            # Issue #144: Tracing configuration
            # X-Ray tracing via CloudWatch Observability addon's OTLP receiver
            - name: BG_OTEL_ENABLED
              value: "true"
            - name: BG_OTEL_SERVICE_NAME
              value: "bedrock-gateway"
            - name: BG_OTEL_EXPORTER_ENDPOINT
              value: "http://cloudwatch-agent.amazon-cloudwatch.svc.cluster.local:4315"
            - name: OTEL_ENABLED
              value: "true"
            - name: OTEL_SERVICE_NAME
              value: "bedrock-gateway"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://cloudwatch-agent.amazon-cloudwatch.svc.cluster.local:4315"
            # Issue #3566: Module feature gates. All default to enabled (absent = enabled).
            # Set to "false" to hide a module's nav links + routes in the UI.
            # The active entries below reflect the dev deployment's gated modules;
            # removing an entry re-enables that module (fail-open default).
            - name: FEATURE_CHAT_ENABLED
              value: "false"
            - name: FEATURE_SYSTEM_DASHBOARD_ENABLED
              value: "false"
            - name: FEATURE_LOGS_ENABLED
              value: "false"
            # Issue #4209: orchestration engine + graph UI. Fail-closed.
            #
            # Rendered PER ENVIRONMENT, not hard-coded. This one file is applied
            # verbatim to whichever environment gateway-deploy.yml targets, so a
            # literal "true" here would opt EVERY environment in at once —
            # including prod — which ruling D-R20 forbids: legacy GitHub-driven
            # mode is a supported product mode, not a migration state.
            #
            # gateway-deploy.yml substitutes this placeholder from
            # `/adp/<env>/gateway/feature-orchestration-engine`, defaulting to
            # "false" when the parameter is absent — so the opt-in is an operator
            # action on ONE environment and the default stays off. Nothing to
            # merge, nothing to revert: `aws ssm put-parameter` in, delete out.
            #
            # Do NOT replace this with a literal, and do NOT use `kubectl set env`
            # (every deploy re-applies this file and would silently revert it).
            - name: FEATURE_ORCHESTRATION_ENGINE_ENABLED
              value: "__FEATURE_ORCHESTRATION_ENGINE_ENABLED__"
            # Issue #4402 (U-5 of EPIC #4324): the Budget & Spend screen. Fail-closed
            # like the entry above, so absent already means off — but it has to be set
            # HERE rather than with `kubectl set env`, because gateway-deploy.yml
            # re-applies this file on every run and would silently revert an
            # out-of-band change on the next deploy. Enabled in dev so the wave-3
            # evaluation can observe the screen; the rollback is to flip this to
            # "false", which removes the route and the nav entry with no redeploy of
            # the SPA.
            - name: FEATURE_BUDGET_SPEND_ENABLED
              value: "true"
            # Issue #3960: the live-run control path (gateway proxy -> in-pod control
            # listener). Rendered per environment from
            # /adp/<env>/gateway/feature-agent-control, defaulting to "false" —
            # same mechanism and same reason as the entry two above.
            #
            # Per-environment matters more here than for a UI screen. Turning this
            # on opens an authenticated channel into a running agent pod, and the
            # rollout invariant for this story is that ordinary workloads stay off:
            # the one legitimate "true" is an operator-created isolated fixture
            # (evaluation #3967), which is an `aws ssm put-parameter` against a
            # single environment, not a committed literal every environment
            # inherits on its next deploy.
            #
            # Note this flag does not make any control verb work — all four are
            # unsupported in S1 and an authorized caller on a live run gets 501. It
            # gates the route surface, the ping/state read path and the capability
            # report. It also cannot start a listener in an agent pod: the worker
            # reads its own copy of FEATURE_AGENT_CONTROL_ENABLED independently.
            - name: FEATURE_AGENT_CONTROL_ENABLED
              value: "__FEATURE_AGENT_CONTROL_ENABLED__"
            # Issue #5079 (NUI-01 of EPIC #5078): the opt-in /next UI shell. Rendered
            # per environment from /adp/<env>/gateway/feature-new-ui, defaulting to
            # "false" — same mechanism as the two entries above, because the new
            # experience is enabled one environment at a time and a committed literal
            # would arm every environment on its next deploy.
            #
            # Disabling the preview: the "Try the new UI" link and the /next routes
            # disappear, the current UI keeps serving every existing URL, and no
            # configured data, settings or model-routing rule is touched. No SPA
            # rebuild is involved — the SPA reads this value from GET /features at
            # runtime.
            #
            # It takes TWO steps, because this value is baked into the pod env at
            # deploy time:
            #   1. aws ssm put-parameter --name /adp/<env>/gateway/feature-new-ui \
            #        --value false --overwrite
            #   2. re-run gateway-deploy.yml so its deploy-backend job re-renders
            #      this manifest and rolls the pods.
            # Step 1 alone changes nothing about a running pod. A frontend-only push
            # SKIPS deploy-backend entirely, so it will not pick the value up either.
            #
            # For an emergency stop without waiting for a deploy:
            #   kubectl set env deployment/bedrockgateway \
            #     FEATURE_NEW_UI_ENABLED=false -n adp-gateway
            # That is reverted by the next deploy, so still do step 1 to make it
            # durable. Already-open browser sessions request a refresh every
            # FEATURES_REVALIDATE_MS (see useFeatures.ts). Browser throttling and
            # network completion can delay observation; a reload is not required.
            - name: FEATURE_NEW_UI_ENABLED
              value: "__FEATURE_NEW_UI_ENABLED__"
            # Issue #5422: per-persona Agent Models. This remains off until PMM-09
            # certifies models and enables runtime enforcement in this environment.
            # The SSM-backed placeholder is rendered by both deployment paths.
            - name: FEATURE_AGENT_MODELS_ENABLED
              value: "__FEATURE_AGENT_MODELS_ENABLED__"
            # - name: FEATURE_KNOWLEDGE_ENABLED
            #   value: "false"
            # - name: FEATURE_INDEXING_ENABLED
            #   value: "false"
            # - name: FEATURE_CONNECTIONS_ENABLED
            #   value: "false"
            # - name: FEATURE_CREDENTIALS_ENABLED
            #   value: "false"
            # Issue #537: Identity projection feature flags. Backfill complete in dev
            # (v2 table adp-dev-user-identity-index has all 4 distinct users from v1).
            # WRITE=true unblocks the onboarding endpoint; READ stays false through
            # the 48h dual-write soak per the migration plan in #537.
            - name: USER_IDENTITY_INDEX_V2_WRITE
              value: "true"
            - name: USER_IDENTITY_INDEX_V2_READ
              value: "false"
      # Issue #5675: backing store for the read-only-root scratch mounts above.
      # emptyDir (not hostPath) so nothing is shared with the node or survives the
      # pod, and sizeLimit so a runaway write is capped at the pod rather than
      # filling node ephemeral storage and taking neighbours down with it.
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
        - name: home
          emptyDir:
            sizeLimit: 64Mi
      # Pod topology spread constraints for HA across availability zones
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: bedrockgateway
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: bedrockgateway
