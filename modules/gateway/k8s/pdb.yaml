apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: bedrockgateway-pdb
  namespace: adp-gateway
  labels:
    app.kubernetes.io/name: bedrockgateway
    app.kubernetes.io/part-of: bedrock-gateway
spec:
  # Allow one voluntary node disruption at a time while the HPA scales.
  maxUnavailable: 1
  selector:
    matchLabels:
      app: bedrockgateway
