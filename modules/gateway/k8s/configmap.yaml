apiVersion: v1
kind: ConfigMap
metadata:
  name: bedrockgateway-config
  namespace: adp-gateway
  labels:
    app.kubernetes.io/name: bedrockgateway
    app.kubernetes.io/part-of: bedrock-gateway
data:
  # =============================================================================
  # ConfigMap Template for Bedrock Gateway
  # =============================================================================
  # This ConfigMap uses placeholder tokens (__PLACEHOLDER__) that are replaced
  # at deploy time by the backend-deploy workflow using sed.
  #
  # All environment variables use the BG_ prefix to match the Pydantic settings
  # model in src/shared/config.py (model_config = {"env_prefix": "BG_"})
  # =============================================================================

  # AWS Configuration
  BG_AWS_REGION: "__AWS_REGION__"

  # Environment (dev, test, prod)
  BG_ENVIRONMENT: "__ENVIRONMENT__"

  # RDS Database Configuration - IAM authentication (passwordless)
  BG_RDS_IAM_AUTH: "true"
  BG_RDS_HOST: "__DB_HOST__"
  BG_RDS_PORT: "5432"
  BG_RDS_USERNAME: "__DB_USER__"
  BG_RDS_DBNAME: "__DB_NAME__"

  # Fallback DATABASE_URL (used when RDS_IAM_AUTH is false, e.g., local dev)
  BG_DATABASE_URL: "postgresql+asyncpg://__DB_USER__@__DB_HOST__:5432/__DB_NAME__"

  # Redis / ElastiCache Configuration
  # The URL is host/port/TLS only — IAM auth means there is no password to embed.
  # The username + short-lived token are supplied per connection by
  # src/shared/redis_client.py (Issue #4342).
  BG_REDIS_URL: "rediss://__REDIS_HOST__:__REDIS_PORT__/0"
  BG_REDIS_IAM_AUTH: "__REDIS_IAM_AUTH__"
  BG_REDIS_USERNAME: "__REDIS_IAM_USERNAME__"
  # Replication group id, NOT the endpoint host — the connect token is signed
  # against the group id and ElastiCache rejects a token signed for the host.
  BG_REDIS_CACHE_NAME: "__REDIS_CACHE_NAME__"

  # Cognito OAuth Configuration
  BG_COGNITO_USER_POOL_ID: "__COGNITO_USER_POOL_ID__"
  # CLI app client for web CLI login (/auth/cli). Empty until the Terraform
  # that creates the client applies — endpoints answer 503 until then.
  BG_COGNITO_CLI_CLIENT_ID: "__COGNITO_CLI_CLIENT_ID__"
  BG_COGNITO_CLIENT_ID: "__COGNITO_CLIENT_ID__"
  BG_COGNITO_DOMAIN: "__COGNITO_DOMAIN__"

  # CORS allowed origins - CloudFront frontend URL and localhost for development
  CORS_ALLOWED_ORIGINS: "__CORS_ALLOWED_ORIGINS__"

  # Public base URL the app uses to build absolute links (magic-link emails, etc.).
  # Must point at CloudFront so that requests from browsers are reachable
  # without auth headers.
  BG_GATEWAY_BASE_URL: "__GATEWAY_BASE_URL__"

  # S3 bucket + key where the CloudFormation template YAML lives.  The gateway
  # pre-signs a GET URL on this object each time a user clicks "Connect AWS
  # account" - AWS Console's Quick-Create flow requires templateURL to be an
  # S3 host, which is why we host the template in this existing bucket rather
  # than serving it from the gateway directly.
  ADP_CFN_TEMPLATE_BUCKET: "__CFN_TEMPLATE_BUCKET__"
  ADP_CFN_TEMPLATE_KEY: "cfn-templates/aws_role_v1.yaml"

  # Gateway IRSA role ARN - interpolated into the CFN template as the trust
  # principal so the user's newly-created role can be assumed by this pod.
  # Falls back to a placeholder ARN if unset; IAM rejects that placeholder at
  # stack-create time, so this value must be set in every environment.
  ADP_GATEWAY_ROLE_ARN: "__GATEWAY_ROLE_ARN__"

  # Issue #133: SECURITY FIX - BG_TOKEN_SECRET_KEY REMOVED from ConfigMap
  # =============================================================================
  # The legacy token secret key is now stored in AWS Secrets Manager for security.
  # DO NOT add BG_TOKEN_SECRET_KEY to ConfigMap - it must be mounted from a
  # Kubernetes Secret that's populated from Secrets Manager.
  #
  # The deployment workflow should:
  # 1. Generate or retrieve the secret from AWS Secrets Manager
  # 2. Create a Kubernetes Secret from it (see k8s/deployment.yaml)
  # 3. Reference via secretKeyRef in the deployment env section
  #
  # For production, use External Secrets Operator or similar to sync from
  # AWS Secrets Manager to Kubernetes Secrets automatically.
  # =============================================================================

  # =============================================================================
  # Issue #1158: Vault Proxy Request Host Allowlist (SSRF mitigation)
  # =============================================================================
  # Comma-separated list of allowed target hosts for /internal/v1/proxy-request.
  # Supports exact-match ("api.github.com") and wildcard-prefix ("*.atlassian.net").
  # FAIL-CLOSED: if empty, ALL proxy-requests are denied (403).
  # =============================================================================
  BG_VAULT_PROXY_HOST_ALLOWLIST: "__VAULT_PROXY_HOST_ALLOWLIST__"
  BG_VAULT_PROXY_REQUIRE_HTTPS: "true"

  # =============================================================================
  # Issue #4076: Credential -> host egress binding
  # =============================================================================
  # The allowlist above says which hosts we may talk to; this says which hosts a
  # GIVEN service's credential may be sent to (a github credential must not go
  # to slack.com). The service -> host map is a code constant, see
  # src/internal/credential_egress.py.
  # "false" = shadow mode (violations WARN-logged, allowed) — the default, so
  # coverage gaps surface in logs first. "true" = enforce (403 + audit row).
  # Flip via SSM: /adp/{env}/gateway/vault-enforce-credential-host-binding
  # =============================================================================
  BG_VAULT_ENFORCE_CREDENTIAL_HOST_BINDING: "__VAULT_ENFORCE_CREDENTIAL_HOST_BINDING__"

  # Logging Configuration
  BG_LOG_LEVEL: "INFO"

  # =============================================================================
  # Chat Logging Configuration (Issue #143)
  # =============================================================================
  # Async chat logging captures full conversation logs (prompts + responses)
  # with sensitive data scrubbing and stores them in S3.
  #
  # Scrub levels:
  # - off: No scrubbing (debugging only, not for production)
  # - basic: Headers + regex patterns (fast, no AWS API calls)
  # - standard: Headers + regex + Amazon Comprehend PII detection (recommended)
  # =============================================================================
  BG_CHAT_LOGGING_ENABLED: "__CHAT_LOGGING_ENABLED__"
  BG_CHAT_LOGGING_BUCKET: "__CHAT_LOGGING_BUCKET__"
  BG_CHAT_LOGGING_SCRUB_LEVEL: "__CHAT_LOGGING_SCRUB_LEVEL__"
  BG_CHAT_LOGGING_EXCLUDE_MODELS: ""

  # =============================================================================
  # API Gateway Authentication Headers (Issue #241)
  # =============================================================================
  # When requests come through API Gateway with the Lambda authorizer, the
  # authorizer validates the request and passes identity headers to the backend:
  # - X-Auth-Source: jwt | iam
  # - X-Agent-Id, X-Agent-OrgId, X-Agent-TeamId, etc.
  #
  # Set to "true" to trust these headers from API Gateway.
  # CloudFront requests continue to use JWT validation directly.
  # =============================================================================
  BG_TRUST_APIGW_HEADERS: "__TRUST_APIGW_HEADERS__"

  # =============================================================================
  # Agent Registry DynamoDB Table (Issue #260)
  # =============================================================================
  # When requests come through API Gateway /agent/* path with AWS_IAM auth,
  # FastAPI extracts the IAM identity and looks up the agent in DynamoDB.
  # This table stores the agent registry with the by-role-arn GSI.
  # Note: BG_ prefix required to match Pydantic settings env_prefix="BG_"
  # =============================================================================
  BG_AGENT_REGISTRY_TABLE: "__AGENT_REGISTRY_TABLE__"
  AGENT_REGISTRY_TABLE: "__AGENT_REGISTRY_TABLE__"

  # =============================================================================
  # Org-tenant auto-creation (Rule-1, EPIC #2981).
  # Read directly via os.environ in connections/service.py (NOT BG_-prefixed).
  # When "true", registering a GitHub Organization connection automatically
  # creates an org-tenant shell so members can later auto-join.
  #
  # Issue #2724: creating a shell no longer implies TRUSTING it. Shells created
  # by the unauthenticated no-nonce install callback are stamped
  # created_via="install_autocreate", and the webhook-ingress Lambda reads its
  # own ORG_TENANT_AUTO_CREATE (same name, terraform var org_tenant_auto_create,
  # default false) to decide whether such a shell counts as a real tenant for
  # agent dispatch and per-tenant GitHub App credential seeding. Set that one
  # true as well only for deliberately-open deployments (hackathons, demos).
  #
  # So "true" HERE does not mean "trust whoever installs". It means only "let
  # the unauthenticated install callback create a shell so the install UI
  # works". The gateway refuses to promote such a shell itself — no per-tenant
  # App credentials, no routable identity-index row (see
  # _promotion_allowed_for_provenance in connections/service.py) — and leaves
  # promotion entirely to the webhook Lambda's gate. It must stay "true"
  # because the nonce-authenticated install path also relies on it to onboard a
  # signed-in user's not-yet-known org.
  # =============================================================================
  ORG_TENANT_AUTO_CREATE: "true"

  # =============================================================================
  # Knowledge Layer registry (E10 #1736 / #2082).
  # Read directly via os.environ in app.py (NOT BG_-prefixed) — they gate +
  # power the agent-context registry routes mounted into the gateway.
  #   AGENT_CONTEXT_ENABLED: kill switch — routes mount only when "true".
  #   INGESTION_QUEUE_URL:   SQS queue the registry dispatches ingestion to;
  #                          if empty, routes still mount but dispatch returns
  #                          503 (app.py logs a startup warning, does not crash).
  # =============================================================================
  AGENT_CONTEXT_ENABLED: "true"
  INGESTION_QUEUE_URL: "__INGESTION_QUEUE_URL__"
  BG_AGENT_CONTEXT_DBNAME: "agent_context"

  # =============================================================================
  # Agent Run-Logs Transcripts (Issue #3069 / #3105)
  # =============================================================================
  # S3 bucket where agent-worker writes run transcripts. Read by the
  # transcript viewer endpoint (activity/routes.py _get_run_logs_bucket).
  # NOT BG_-prefixed — read directly via os.environ.get("AGENT_RUN_LOGS_BUCKET").
  # =============================================================================
  AGENT_RUN_LOGS_BUCKET: "__AGENT_RUN_LOGS_BUCKET__"

  # =============================================================================
  # bedrock-mantle passthrough (Issue #2709, EPIC #2702)
  # =============================================================================
  # Routes OpenAI Responses-API traffic (POST /openai/v1/responses) through the
  # gateway to bedrock-mantle so Codex gets per-tenant metering + allowlist
  # governance. Upstream auth is SigV4 ONLY via the pod's IRSA chain — the IAM
  # grant is gated by enable_mantle_passthrough in gateway.tfvars (Terraform).
  # Kill switch: set BG_MANTLE_ENABLED "false" and redeploy; route returns 503.
  BG_MANTLE_ENABLED: "true"
  BG_MANTLE_REGION: "us-east-1"

  # =============================================================================
  # Credential-authorization binding (EPIC #3172, S9 #3182).
  # =============================================================================
  # When "true", credential endpoints ENFORCE registry-based user resolution:
  # missing invocation_id or empty authorized_user_id → 403.
  # When "false" (default), shadow mode: resolve from registry, compare to body,
  # emit drift/fallback metrics, but never block.
  # Flipped via credential-binding-flip.yml (gated workflow_dispatch) — NOT
  # editable manually. Reads from SSM: /adp/{env}/gateway/enforce-credential-binding
  # =============================================================================
  BG_ENFORCE_CREDENTIAL_BINDING: "__ENFORCE_CREDENTIAL_BINDING__"

  # =============================================================================
  # Approval (org-assignment) enforcement on the inference path (Issue #4144)
  # =============================================================================
  # When "true", a human caller with no org assignment is rejected with a 409
  # ({"detail": {"error": "user_not_assigned_to_org", ...}}) on the enforced spend
  # paths — so platform-admin approval actually gates Bedrock spend, not just the
  # browser dashboard. Exempt: platform admins (avoids the approver locking
  # themselves out) and agents / service accounts (IAM/SigV4).
  #
  # "Approved" is resolved from Postgres users.org_id keyed on cognito_sub, with
  # the JWT claim only as a fast path. Do NOT "simplify" this to the claim alone:
  # the login-time auto-match approval path never syncs Cognito attributes, so
  # approved users routinely hold tokens with no org_id and would all be locked
  # out. Fails OPEN on a DB error (a transient blip must not down all inference).
  #
  # When "false" (default), the middleware is inert — it still runs, but returns
  # early. Rollback is a value flip + `kubectl rollout restart`; the flag is read
  # per-request via get_settings(), so no image rebuild is needed.
  # =============================================================================
  BG_ENFORCE_ORG_ASSIGNMENT: "false"

  # =============================================================================
  # Per-principal Bedrock account routing — SHADOW MODE (Issue #4743, #4692)
  # =============================================================================
  # When "true", the resolution ladder (user > team > org > platform) runs on the
  # settlement path and its answer is recorded in usage_logs.bedrock_account_id.
  # It does NOT change where any request goes: by the time it runs the call has
  # already been signed and sent with the gateway's ambient IRSA credentials, the
  # same as before. Enforcement is #4744.
  #
  # Leave "true". The captured column is the evidence #4744 is gated on — an
  # operator has to be able to see what routing WOULD do before being asked to
  # let it happen — and with zero mappings authored a 60s existence gate makes it
  # cost zero queries per model call. Set the SSM param
  # /adp/{env}/gateway/bedrock-routing-shadow-mode to "false" +
  # `kubectl rollout restart` to stop observing; read per-request via
  # get_settings(), so no image rebuild is needed.
  #
  # PLATFORM_BEDROCK_ACCOUNT_ID is the account the gateway's own IRSA credentials
  # belong to — the answer for the platform rung, i.e. every call today. It is
  # substituted by gateway-deploy.yml rather than discovered at runtime, because a
  # live sts:get_caller_identity on the settlement path would add a network hop to
  # every request that resolves to platform (before any mapping exists, all of
  # them). If this is ever left EMPTY the platform rung still resolves but the
  # column stays NULL — which reads as "not captured" and makes shadow mode
  # silently unobservable, so it is wired here deliberately rather than defaulted.
  # =============================================================================
  BG_BEDROCK_ROUTING_SHADOW_MODE: "__BEDROCK_ROUTING_SHADOW_MODE__"
  BG_PLATFORM_BEDROCK_ACCOUNT_ID: "__PLATFORM_BEDROCK_ACCOUNT_ID__"

  # Issue #4744 (#4692 · R3): the environment master switch for routing
  # ENFORCEMENT, wired for #4761 (R7). Enforcement is an AND of this flag and the
  # per-org opt-in (organizations.settings["bedrock_routing_enforce"]): this one
  # answers "is the cross-account signing path live in this environment at all"
  # and is set by whoever deploys, while the per-org flag answers "has this tenant
  # been signed off after reviewing its shadow-mode evidence". Until this key
  # existed, no org flag could enable enforcement — not even a designated test
  # org — so R7's enforcement evals had no way to run.
  #
  # Defaults "false": shadow mode (R2) stays the global default and flipping any
  # org to enforce is a deliberate ops action taken AFTER its shadow evidence
  # looks right. Read per-request, so this is also the fast rollback lever — under
  # fail-closed an expired/bad destination is an outage, and the remedy must not
  # require a rebuild. Set the SSM param to "true" + `kubectl rollout restart`.
  BG_BEDROCK_ROUTING_ENFORCE: "__BEDROCK_ROUTING_ENFORCE__"

  # =============================================================================
  # Budget enforcement fail mode (Issue #4075)
  # =============================================================================
  # What happens when the budget CHECK itself fails (DB/IAM error), as opposed
  # to a request genuinely exceeding its cap:
  #   closed (default) — deny. A failed ledger read must not admit the request,
  #                      because that is uncapped model spend no cap will stop.
  #                      A bounded, alarmed grace window (30s of CONSECUTIVE
  #                      failures, shared via Redis) keeps a transient RDS
  #                      IAM-token blip from hard-downing all inference.
  #   open             — allow. This is the ROLLBACK lever, not a normal state.
  #
  # Note the doubled BUDGET: budget/config.py sets env_prefix = "BG_BUDGET_",
  # so the field budget_fail_mode reads BG_BUDGET_BUDGET_FAIL_MODE.
  #
  # Read once at container start (module-level singleton, envFrom), and there is
  # no checksum/config annotation on the Deployment — so a configmap-only
  # `kubectl apply` does NOT change a running pod. Changing this requires
  # SSM put + `kubectl rollout restart` (or a redeploy).
  # Reads from SSM: /adp/{env}/gateway/budget-fail-mode
  # =============================================================================
  BG_BUDGET_BUDGET_FAIL_MODE: "__BUDGET_FAIL_MODE__"

  # =============================================================================
  # Identity Index DynamoDB tables (Issue #375, #537)
  # =============================================================================
  # Write-through to DDB identity-index tables enables the webhook Lambda to
  # resolve users via O(1) DDB lookups. Without these, user approval in the UI
  # does not propagate to the webhook path and agents cannot be triggered.
  #   IDENTITY_INDEX_TABLE:             Old table (always written)
  #   USER_IDENTITY_INDEX_TABLE:        New table (written when V2_WRITE=true)
  #   USER_IDENTITY_INDEX_V2_WRITE:     Gate for dual-write + onboarding flow
  # =============================================================================
  IDENTITY_INDEX_TABLE: "adp-__ENVIRONMENT__-identity-index"
  USER_IDENTITY_INDEX_TABLE: "adp-__ENVIRONMENT__-user-identity-index"
  USER_IDENTITY_INDEX_V2_WRITE: "true"
