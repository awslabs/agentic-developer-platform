apiVersion: v1
kind: ConfigMap
metadata:
  name: bedrockgateway-config
  namespace: adp-gateway
  labels:
    app.kubernetes.io/name: bedrockgateway
    app.kubernetes.io/part-of: bedrock-gateway
data:
  # =============================================================================
  # ConfigMap Template for Bedrock Gateway
  # =============================================================================
  # This ConfigMap uses placeholder tokens (__PLACEHOLDER__) that are replaced
  # at deploy time by the backend-deploy workflow using sed.
  #
  # All environment variables use the BG_ prefix to match the Pydantic settings
  # model in src/shared/config.py (model_config = {"env_prefix": "BG_"})
  # =============================================================================

  # AWS Configuration
  BG_AWS_REGION: "__AWS_REGION__"

  # Environment (dev, test, prod)
  BG_ENVIRONMENT: "__ENVIRONMENT__"

  # Versioned Product inputs retained by L5 admission and read by its workers.
  # Provisioned independently by modules/L5-services/infra/source-snapshots.
  PRODUCT_SOURCE_SNAPSHOT_BUCKET: "__PRODUCT_SOURCE_SNAPSHOT_BUCKET__"

  # RDS Database Configuration - IAM authentication (passwordless)
  BG_RDS_IAM_AUTH: "true"
  BG_RDS_HOST: "__DB_HOST__"
  BG_RDS_PORT: "5432"
  BG_RDS_USERNAME: "__DB_USER__"
  BG_RDS_DBNAME: "__DB_NAME__"

  # Fallback DATABASE_URL (used when RDS_IAM_AUTH is false, e.g., local dev)
  BG_DATABASE_URL: "postgresql+asyncpg://__DB_USER__@__DB_HOST__:5432/__DB_NAME__"

  # Redis / ElastiCache Configuration
  # The URL is host/port/TLS only — IAM auth means there is no password to embed.
  # The username + short-lived token are supplied per connection by
  # src/shared/redis_client.py (Issue #4342).
  RATELIMIT_SECURITY_PROFILE: "production"
  RATELIMIT_BACKEND_TYPE: "redis"
  RATELIMIT_ALLOW_MEMORY_BACKEND: "false"
  BG_REDIS_URL: "rediss://__REDIS_HOST__:__REDIS_PORT__/0"
  BG_REDIS_IAM_AUTH: "__REDIS_IAM_AUTH__"
  BG_REDIS_USERNAME: "__REDIS_IAM_USERNAME__"
  # Replication group id, NOT the endpoint host — the connect token is signed
  # against the group id and ElastiCache rejects a token signed for the host.
  BG_REDIS_CACHE_NAME: "__REDIS_CACHE_NAME__"

  # Cognito OAuth Configuration
  BG_COGNITO_USER_POOL_ID: "__COGNITO_USER_POOL_ID__"
  # CLI app client for web CLI login (/auth/cli). Empty until the Terraform
  # that creates the client applies — endpoints answer 503 until then.
  BG_COGNITO_CLI_CLIENT_ID: "__COGNITO_CLI_CLIENT_ID__"
  BG_COGNITO_AGENT_CLIENT_ID: "__COGNITO_AGENT_CLIENT_ID__"
  BG_COGNITO_GITLAB_CLIENT_ID: "__COGNITO_GITLAB_CLIENT_ID__"
  # Dev-only pentest actor client. Empty outside dev or before agent-factory applies.
  BG_COGNITO_PENTEST_CLIENT_ID: "__COGNITO_PENTEST_CLIENT_ID__"
  BG_AGENT_CLIENTS_TABLE: "__AGENT_CLIENTS_TABLE__"
  BG_COGNITO_CLIENT_ID: "__COGNITO_CLIENT_ID__"
  BG_COGNITO_DOMAIN: "__COGNITO_DOMAIN__"

  # CORS allowed origins - CloudFront frontend URL and localhost for development
  CORS_ALLOWED_ORIGINS: "__CORS_ALLOWED_ORIGINS__"

  # Public base URL the app uses to build absolute links (magic-link emails, etc.).
  # Must point at CloudFront so that requests from browsers are reachable
  # without auth headers.
  BG_GATEWAY_BASE_URL: "__GATEWAY_BASE_URL__"
  BG_OAUTH_WORKLOAD_NAME: "adp-tools-__ENVIRONMENT__-oauth-user"
  BG_OAUTH_RETURN_URL: "__GATEWAY_BASE_URL__/api/auth/connections/oauth/return"
  BG_ATLASSIAN_CONFIG_REF: "__ATLASSIAN_CONFIG_REF__"
  BG_ATLASSIAN_CONTRACT_REVISION: "__ATLASSIAN_CONTRACT_REVISION__"
  BG_ATLASSIAN_METADATA_SHA256: "__ATLASSIAN_METADATA_SHA256__"

  # S3 bucket + key where the CloudFormation template YAML lives.  The gateway
  # pre-signs a GET URL on this object each time a user clicks "Connect AWS
  # account" - AWS Console's Quick-Create flow requires templateURL to be an
  # S3 host, which is why we host the template in this existing bucket rather
  # than serving it from the gateway directly.
  ADP_CFN_TEMPLATE_BUCKET: "__CFN_TEMPLATE_BUCKET__"
  ADP_CFN_TEMPLATE_KEY: "cfn-templates/aws_role_v1.yaml"

  # Gateway IRSA role ARN - interpolated into the CFN template as the trust
  # principal so the user's newly-created role can be assumed by this pod.
  # Falls back to a placeholder ARN if unset; IAM rejects that placeholder at
  # stack-create time, so this value must be set in every environment.
  ADP_GATEWAY_ROLE_ARN: "__GATEWAY_ROLE_ARN__"

  # Issue #133: SECURITY FIX - BG_TOKEN_SECRET_KEY REMOVED from ConfigMap
  # =============================================================================
  # The legacy token secret key is now stored in AWS Secrets Manager for security.
  # DO NOT add BG_TOKEN_SECRET_KEY to ConfigMap - it must be mounted from a
  # Kubernetes Secret that's populated from Secrets Manager.
  #
  # The deployment workflow should:
  # 1. Generate or retrieve the secret from AWS Secrets Manager
  # 2. Create a Kubernetes Secret from it (see k8s/deployment.yaml)
  # 3. Reference via secretKeyRef in the deployment env section
  #
  # For production, use External Secrets Operator or similar to sync from
  # AWS Secrets Manager to Kubernetes Secrets automatically.
  # =============================================================================

  # =============================================================================
  # Issue #1158: Vault Proxy Request Host Allowlist (SSRF mitigation)
  # =============================================================================
  # Comma-separated list of allowed target hosts for /internal/v1/proxy-request.
  # Configure exact tenant-owned SaaS hosts (for example "acme.atlassian.net").
  # Never allow a wildcard spanning independently controlled SaaS tenants.
  # FAIL-CLOSED: if empty, ALL proxy-requests are denied (403).
  # =============================================================================
  BG_VAULT_PROXY_HOST_ALLOWLIST: "__VAULT_PROXY_HOST_ALLOWLIST__"
  BG_VAULT_PROXY_REQUIRE_HTTPS: "true"

  # =============================================================================
  # Issue #4076: Credential -> host egress binding
  # =============================================================================
  # The allowlist above says which hosts we may talk to; this says which hosts a
  # GIVEN service's credential may be sent to (a github credential must not go
  # to slack.com). The service -> host map is a code constant, see
  # src/internal/credential_egress.py.
  # Default "true" = enforce (403 + audit row before secret retrieval).
  # Explicit "false" = temporary shadow mode (violations WARN-logged, allowed).
  # Configure via SSM: /adp/{env}/gateway/vault-enforce-credential-host-binding
  # =============================================================================
  BG_VAULT_ENFORCE_CREDENTIAL_HOST_BINDING: "__VAULT_ENFORCE_CREDENTIAL_HOST_BINDING__"

  # Logging Configuration
  BG_LOG_LEVEL: "INFO"

  # =============================================================================
  # Chat Logging Configuration (Issue #143)
  # =============================================================================
  # Async chat logging captures full conversation logs (prompts + responses)
  # with sensitive data scrubbing and stores them in S3.
  #
  # Scrub levels:
  # - off: No scrubbing (debugging only, not for production)
  # - basic: Headers + regex patterns (fast, no AWS API calls)
  # - standard: Headers + regex + Amazon Comprehend PII detection (DEFAULT)
  #
  # #5672: the deploy pipeline used to substitute the literal "basic" here,
  # overriding the application default in every environment, so personal data in
  # prompts was stored as typed. The value now comes from
  # /adp/<env>/gateway/chat-logging-scrub-level and defaults to "standard" when
  # that parameter is unset. Do not hard-code a weaker level in this file or in a
  # deploy script — a weaker level must be a per-environment, reviewed choice.
  # An unset or unrecognised value resolves UP to "standard" in the app
  # (src/chat_logging/config.py), so a typo cannot silently downgrade redaction.
  # =============================================================================
  BG_CHAT_LOGGING_ENABLED: "__CHAT_LOGGING_ENABLED__"
  BG_CHAT_LOGGING_BUCKET: "__CHAT_LOGGING_BUCKET__"
  BG_CHAT_LOGGING_SCRUB_LEVEL: "__CHAT_LOGGING_SCRUB_LEVEL__"
  BG_CHAT_LOGGING_EXCLUDE_MODELS: ""

  # =============================================================================
  # API Gateway Authentication Headers (Issue #241)
  # =============================================================================
  # When requests come through API Gateway with the Lambda authorizer, the
  # authorizer validates the request and passes identity headers to the backend:
  # - X-Auth-Source: jwt | iam
  # - X-Agent-Id, X-Agent-OrgId, X-Agent-TeamId, etc.
  #
  # Set to "true" to trust these headers from API Gateway.
  # CloudFront requests continue to use JWT validation directly.
  # =============================================================================
  BG_TRUST_APIGW_HEADERS: "__TRUST_APIGW_HEADERS__"

  # =============================================================================
  # Agent Registry DynamoDB Table (Issue #260)
  # =============================================================================
  # When requests come through API Gateway /agent/* path with AWS_IAM auth,
  # FastAPI extracts the IAM identity and looks up the agent in DynamoDB.
  # This table stores the agent registry with the by-role-arn GSI.
  # Note: BG_ prefix required to match Pydantic settings env_prefix="BG_"
  # =============================================================================
  BG_AGENT_REGISTRY_TABLE: "__AGENT_REGISTRY_TABLE__"
  AGENT_REGISTRY_TABLE: "__AGENT_REGISTRY_TABLE__"

  # =============================================================================
  # Org-tenant auto-creation (Rule-1, EPIC #2981).
  # Read directly via os.environ in connections/service.py (NOT BG_-prefixed).
  # When "true", registering a GitHub Organization connection automatically
  # creates an org-tenant shell so members can later auto-join.
  #
  # Issue #2724: creating a shell no longer implies TRUSTING it. Shells created
  # by the unauthenticated no-nonce install callback are stamped
  # created_via="install_autocreate", and the webhook-ingress Lambda reads its
  # own ORG_TENANT_AUTO_CREATE (same name, terraform var org_tenant_auto_create,
  # default false) to decide whether such a shell counts as a real tenant for
  # agent dispatch and per-tenant GitHub App credential seeding. Set that one
  # true as well only for deliberately-open deployments (hackathons, demos).
  #
  # So "true" HERE does not mean "trust whoever installs". It means only "let
  # the unauthenticated install callback create a shell so the install UI
  # works". The gateway refuses to promote such a shell itself — no per-tenant
  # App credentials, no routable identity-index row (see
  # _promotion_allowed_for_provenance in connections/service.py) — and leaves
  # promotion entirely to the webhook Lambda's gate. It must stay "true"
  # because the nonce-authenticated install path also relies on it to onboard a
  # signed-in user's not-yet-known org.
  # =============================================================================
  ORG_TENANT_AUTO_CREATE: "true"

  # =============================================================================
  # Knowledge Layer registry (E10 #1736 / #2082).
  # Read directly via os.environ in app.py (NOT BG_-prefixed) — they gate +
  # power the agent-context registry routes mounted into the gateway.
  #   AGENT_CONTEXT_ENABLED: kill switch — routes mount only when "true".
  #   INGESTION_QUEUE_URL:   SQS queue the registry dispatches ingestion to;
  #                          if empty, routes still mount but dispatch returns
  #                          503 (app.py logs a startup warning, does not crash).
  # =============================================================================
  AGENT_CONTEXT_ENABLED: "true"
  # Enable after Product migration, scoped ingestion workers, and all Door readers.
  SCOPED_KNOWLEDGE_IMPORTS_ENABLED: "__SCOPED_KNOWLEDGE_IMPORTS_ENABLED__"
  INGESTION_QUEUE_URL: "__INGESTION_QUEUE_URL__"
  # Same existing bucket as agent-context/terraform; no new storage.
  AGENT_CONTEXT_S3_BUCKET: "agent-context-platform-data-__PLATFORM_BEDROCK_ACCOUNT_ID__"
  BG_AGENT_CONTEXT_DBNAME: "agent_context"

  # =============================================================================
  # Agent Run-Logs Transcripts (Issue #3069 / #3105)
  # =============================================================================
  # S3 bucket where agent-worker writes run transcripts. Read by the
  # transcript viewer endpoint (activity/routes.py _get_run_logs_bucket).
  # NOT BG_-prefixed — read directly via os.environ.get("AGENT_RUN_LOGS_BUCKET").
  # =============================================================================
  AGENT_RUN_LOGS_BUCKET: "__AGENT_RUN_LOGS_BUCKET__"

  # =============================================================================
  # bedrock-mantle passthrough (Issue #2709, EPIC #2702)
  # =============================================================================
  # Routes OpenAI Responses-API traffic (POST /openai/v1/responses) through the
  # gateway to bedrock-mantle so Codex gets per-tenant metering + allowlist
  # governance. Upstream auth is SigV4 ONLY via the pod's IRSA chain — the IAM
  # grant is gated by enable_mantle_passthrough in gateway.tfvars (Terraform).
  # Kill switch: set BG_MANTLE_ENABLED "false" and redeploy; route returns 503.
  BG_MANTLE_ENABLED: "true"
  BG_MANTLE_REGION: "us-east-1"
  # AWS Bedrock's OpenAI-compatible endpoint (same host family as native
  # bedrock-runtime). Replaces the earlier preview host bedrock-mantle.*.api.aws,
  # which never served newer models (gpt-6-astra → 404). {region} is substituted.
  BG_MANTLE_BASE_URL: "https://bedrock-runtime.{region}.amazonaws.com"
  # bedrock-runtime serves the flagship OpenAI families ONLY via inference
  # profiles, so the route rewrites the forwarded body's model to "<prefix>.<model>"
  # (openai.gpt-6-astra → us.openai.gpt-6-astra). Must match the geo of
  # BG_MANTLE_REGION (us|eu|apac|global). Set "" to disable the rewrite. Bare
  # caller ids stay unchanged.
  BG_MANTLE_INFERENCE_PROFILE_PREFIX: "us"
  # On-demand OpenAI models (bare id, no inference profile) — exempted from the
  # prefix rewrite above. gpt-oss is on-demand; gpt-5.6/gpt-6 are profile-only.
  BG_MANTLE_ON_DEMAND_MODELS: "openai.gpt-oss*"

  # =============================================================================
  # Approval (org-assignment) enforcement on the inference path (Issue #4144)
  # =============================================================================
  # When "true", a human caller with no org assignment is rejected with a 409
  # ({"detail": {"error": "user_not_assigned_to_org", ...}}) on the enforced spend
  # paths — so platform-admin approval actually gates Bedrock spend, not just the
  # browser dashboard. Exempt: platform admins (avoids the approver locking
  # themselves out) and agents / service accounts (IAM/SigV4).
  #
  # "Approved" is resolved from Postgres users.org_id keyed on cognito_sub, with
  # the JWT claim only as a fast path. Do NOT "simplify" this to the claim alone:
  # the login-time auto-match approval path never syncs Cognito attributes, so
  # approved users routinely hold tokens with no org_id and would all be locked
  # out.
  #
  # #5666 (A11): default flipped to "true". Shipping "false" meant the only
  # server-side proof of approval on the paid paths was switched off by default, so
  # a fresh environment billed un-approved callers while the SPA showed them a
  # "request access" screen — a client-side screen a direct curl/SDK caller never
  # sees.
  #
  # Fails CLOSED on a DB error as of #5666: an indeterminate lookup returns a
  # RETRYABLE 503 ({"detail": {"error": "approval_check_unavailable", ...}}) with
  # Retry-After, not a 409, and not an admit. Because every exemption is evaluated
  # before the DB read, a database blip cannot lock out platform admins, agents, or
  # any human whose token carries an org — the 503 reaches only callers whose
  # approval cannot be confirmed without the database. BG_APPROVAL_FAIL_OPEN="true"
  # is the conscious break-glass if an incident calls for availability over the
  # gate.
  #
  # When "false", the middleware is inert — it still runs, but returns early.
  # Rollback is a value flip + `kubectl rollout restart`; the flag is read
  # per-request via get_settings(), so no image rebuild is needed.
  # =============================================================================
  BG_ENFORCE_ORG_ASSIGNMENT: "true"

  # Break-glass for the fail-closed approval check above (#5666 / A11). "true"
  # admits requests whose approval lookup raised, restoring the pre-#5666
  # behaviour. Logged + metered as ApprovalCheckFailedFailOpen so it is visible
  # while active. Leave "false" outside an incident.
  BG_APPROVAL_FAIL_OPEN: "false"

  # =============================================================================
  # Per-principal Bedrock account routing — SHADOW MODE (Issue #4743, #4692)
  # =============================================================================
  # When "true", the resolution ladder (user > team > org > platform) runs on the
  # settlement path and its answer is recorded in usage_logs.bedrock_account_id.
  # It does NOT change where any request goes: by the time it runs the call has
  # already been signed and sent with the gateway's ambient IRSA credentials, the
  # same as before. Enforcement is #4744.
  #
  # Leave "true". The captured column is the evidence #4744 is gated on — an
  # operator has to be able to see what routing WOULD do before being asked to
  # let it happen — and with zero mappings authored a 60s existence gate makes it
  # cost zero queries per model call. Set the SSM param
  # /adp/{env}/gateway/bedrock-routing-shadow-mode to "false" +
  # `kubectl rollout restart` to stop observing; read per-request via
  # get_settings(), so no image rebuild is needed.
  #
  # PLATFORM_BEDROCK_ACCOUNT_ID is the account the gateway's own IRSA credentials
  # belong to — the answer for the platform rung, i.e. every call today. It is
  # substituted by gateway-deploy.yml rather than discovered at runtime, because a
  # live sts:get_caller_identity on the settlement path would add a network hop to
  # every request that resolves to platform (before any mapping exists, all of
  # them). If this is ever left EMPTY the platform rung still resolves but the
  # column stays NULL — which reads as "not captured" and makes shadow mode
  # silently unobservable, so it is wired here deliberately rather than defaulted.
  # =============================================================================
  BG_BEDROCK_ROUTING_SHADOW_MODE: "__BEDROCK_ROUTING_SHADOW_MODE__"

  # PMM-03 (#5420) / #7967: faithful Claude Agent SDK invocability probing. These
  # controls are per-environment configuration rendered from SSM
  # /adp/{env}/gateway/model-probe-* (gateway infra model-probe.tf, values from
  # environments/<env>/modules/gateway.tfvars); an absent parameter renders the
  # fail-closed default (off, zero slots, zero budget, whole catalogue, 24 h).
  # Probing is fail-closed and REQUIRED whenever the chat model-policy posture
  # below is "enforced": without fresh evidence every /v1/chat/model/decision is
  # refused with probing_disabled and chat never answers. The probe CronJob
  # (webhook-ingress persona_model_probe_enabled) must be unsuspended in the same
  # environment; `deploy-all.sh --chat delegated` refuses to roll out while either
  # side is off under "enforced" and warns under "advisory"/"off". The
  # decision-chain mismatch that kept probing off after the 2026-10-13 window
  # (#7596) was fixed by #7605.
  BG_MODEL_PROBE_ENABLED: "__MODEL_PROBE_ENABLED__"
  BG_MODEL_PROBE_MAX_SLOTS_PER_CYCLE: "__MODEL_PROBE_MAX_SLOTS_PER_CYCLE__"
  BG_MODEL_PROBE_BUDGET_USD_PER_CYCLE: "__MODEL_PROBE_BUDGET_USD_PER_CYCLE__"
  BG_MODEL_PROBE_MAX_BUDGET_USD_PER_ATTEMPT: "__MODEL_PROBE_MAX_BUDGET_USD_PER_ATTEMPT__"
  BG_MODEL_PROBE_MODEL_ALLOWLIST: '__MODEL_PROBE_MODEL_ALLOWLIST__'
  BG_MODEL_PROBE_EVIDENCE_TTL_HOURS: "__MODEL_PROBE_EVIDENCE_TTL_HOURS__"
  # Dev Box (#7998), an OPTIONAL module (modules/user-services/dev-box). Its
  # self-managed stage (deploy-all.sh --dev-box on / --dev-box-only ->
  # modules/user-services/dev-box/scripts/deploy-dev-box.sh) publishes these under
  # SSM /adp/<env>/dev-box/* from infra/self_managed.tf; both renderers read them
  # on every deploy. Without the module the parameters do not exist and the
  # renderers put "" / "0" here: src/cloud_desktop/routes.py then answers 403
  # "Dev Box admission is disabled" and the frontend never shows the desktop
  # option (it follows /crew/runtime allowed_targets, which the module's seed
  # sets). Deployment-wide bounds are fail-closed: "0" refuses every admission.
  BG_DEV_BOX_DEPLOYMENT_ID: "__BG_DEV_BOX_DEPLOYMENT_ID__"
  BG_DEV_BOX_MAX_DEPLOYMENT_LIVE_BOXES: "__BG_DEV_BOX_MAX_DEPLOYMENT_LIVE_BOXES__"
  BG_DEV_BOX_MAX_DEPLOYMENT_RUNNING_BOXES: "__BG_DEV_BOX_MAX_DEPLOYMENT_RUNNING_BOXES__"
  BG_DEV_BOX_MAX_DEPLOYMENT_STORAGE_GB: "__BG_DEV_BOX_MAX_DEPLOYMENT_STORAGE_GB__"
  BG_DEV_BOX_MAX_DEPLOYMENT_RUNNING_HOURS: "__BG_DEV_BOX_MAX_DEPLOYMENT_RUNNING_HOURS__"
  BG_DEV_BOX_MAX_DEPLOYMENT_BUDGET_USD: "__BG_DEV_BOX_MAX_DEPLOYMENT_BUDGET_USD__"
  # SSH grant role (#8049) from SSM /adp/<env>/dev-box/ssh-grant-role-arn, created by
  # the module's foundation when gateway_principal_arn names this gateway's IRSA role.
  # src/cloud_desktop/ssh_access.py assumes it for 15-minute, one-instance SSM/EC2
  # Instance Connect credentials behind `adp devbox ssh`; "" => 503 fail-closed.
  BG_DEV_BOX_SSH_GRANT_ROLE_ARN: "__BG_DEV_BOX_SSH_GRANT_ROLE_ARN__"
  # Crew bootstrap mode (#8055): image | user-data, from /adp/<env>/dev-box/crew-bootstrap;
  # exposed as crew_bootstrap on GET /cloud-desktops/{id}. Absent => image.
  BG_DEV_BOX_CREW_BOOTSTRAP: "__BG_DEV_BOX_CREW_BOOTSTRAP__"
  # Model policy posture for chat (#7997): off | advisory | enforced, rendered from
  # SSM /adp/{env}/gateway/chat-model-policy-posture (gateway infra
  # chief-of-staff-flags.tf, value from gateway.tfvars; default advisory).
  # "enforced" is today's fail-closed chat path and needs the probe evidence above;
  # "advisory" still signs and journals every decision but answers the turn on the
  # persona's resolved model when the evidence check is rejected or unverified;
  # "off" consults no evidence. not_permitted refuses in every posture.
  BG_CHAT_MODEL_POLICY_POSTURE: "__CHAT_MODEL_POLICY_POSTURE__"
  BG_PLATFORM_BEDROCK_ACCOUNT_ID: "__PLATFORM_BEDROCK_ACCOUNT_ID__"
  # Exact platform-account role ARNs arranged by the platform administrator for
  # engine operations whose deploy/verify target lives in the platform account
  # (dev AgentCore tools gateway, #7457 TLS-X01). Registering one as a personal AWS
  # connection still requires the role's trust policy to name the connection's
  # ExternalId and owner tag; the list only lifts `platform_account_not_allowed`
  # for these exact ARNs. Empty string disables the exception.
  # Optional protected SSM override: /adp/<env>/gateway/platform-operator-role-arns.
  # The deployment renderer rejects wildcards and roles outside this account.
  BG_PLATFORM_OPERATOR_ROLE_ARNS: "__PLATFORM_OPERATOR_ROLE_ARNS__"

  # PMM-03 / D3: active organization/team model-access constraints.  JSON is
  # keyed by org ID or "org_id:team_id"; the team key wins.  Empty JSON means
  # no explicit tenant policy and therefore the versioned platform baseline.
  # A configured scope with [] is an intentional deny-all policy.
  PERSONA_MODEL_MAPPING_ENABLED: "__PERSONA_MODEL_MAPPING_ENABLED__"
  BG_MODEL_ALLOWED_MODELS_CONFIG: >-
    __MODEL_ALLOWED_MODELS_CONFIG__

  # Saved Bedrock account mappings are always enforced. There is no rollout toggle.

  # =============================================================================
  # Budget enforcement fail mode (Issue #4075)
  # =============================================================================
  # What happens when the budget CHECK itself fails (DB/IAM error), as opposed
  # to a request genuinely exceeding its cap:
  #   closed (default) — deny. A failed ledger read must not admit the request,
  #                      because that is uncapped model spend no cap will stop.
  #                      A bounded, alarmed grace window (30s of CONSECUTIVE
  #                      failures, shared via Redis) keeps a transient RDS
  #                      IAM-token blip from hard-downing all inference.
  #   open             — allow. This is the ROLLBACK lever, not a normal state.
  #
  # Note the doubled BUDGET: budget/config.py sets env_prefix = "BG_BUDGET_",
  # so the field budget_fail_mode reads BG_BUDGET_BUDGET_FAIL_MODE.
  #
  # Read once at container start (module-level singleton, envFrom), and there is
  # no checksum/config annotation on the Deployment — so a configmap-only
  # `kubectl apply` does NOT change a running pod. Changing this requires
  # SSM put + `kubectl rollout restart` (or a redeploy).
  # Reads from SSM: /adp/{env}/gateway/budget-fail-mode
  # =============================================================================
  BG_BUDGET_BUDGET_FAIL_MODE: "__BUDGET_FAIL_MODE__"

  # =============================================================================
  # Identity Index DynamoDB tables (Issue #375, #537)
  # =============================================================================
  # Write-through to DDB identity-index tables enables the webhook Lambda to
  # resolve users via O(1) DDB lookups. Without these, user approval in the UI
  # does not propagate to the webhook path and agents cannot be triggered.
  #   IDENTITY_INDEX_TABLE:             Old table (always written)
  #   USER_IDENTITY_INDEX_TABLE:        New table (written when V2_WRITE=true)
  #   USER_IDENTITY_INDEX_V2_WRITE:     Gate for dual-write + onboarding flow
  # =============================================================================
  IDENTITY_INDEX_TABLE: "adp-__ENVIRONMENT__-identity-index"
  USER_IDENTITY_INDEX_TABLE: "adp-__ENVIRONMENT__-user-identity-index"
  USER_IDENTITY_INDEX_V2_WRITE: "true"

  # =============================================================================
  # Live agent run control (Issue #3960)
  # =============================================================================
  # The authenticated control path: gateway proxy -> in-pod control listener. All
  # four verbs (pause/resume/steer/abort) are UNSUPPORTED in this story — an
  # authorized caller on a live run gets 501 — so turning this on does not make any
  # control action work. What it turns on is the route surface, the ping/state read
  # path, and the capability report (all verbs false).
  #
  # Read directly via os.environ in activity/control_service.py, NOT BG_-prefixed,
  # matching the sibling activity settings (AGENT_RUN_LOGS_BUCKET,
  # WEBHOOK_EVENTS_TABLE) rather than the Pydantic settings model.
  #
  # The flag itself is NOT here — it lives in k8s/deployment.yaml as the
  # __FEATURE_AGENT_CONTROL_ENABLED__ placeholder, rendered per environment by
  # gateway-deploy.yml from /adp/<env>/gateway/feature-agent-control (default
  # "false"), exactly like FEATURE_ORCHESTRATION_ENGINE_ENABLED (#4209 / D-R20).
  #
  # This file is applied verbatim to whichever environment the workflow targets, so
  # a literal here would arm EVERY environment at once. It also matters for how the
  # flag gets turned on: the one legitimate "true" is an operator-created isolated
  # fixture (evaluation #3967), and that has to be an `aws ssm put-parameter`
  # against one environment — not an edit to a committed file that the next deploy
  # of every other environment would pick up.
  #
  # The reader is STRICT (features/routes.py::_is_enabled_strict): absent or any
  # value other than "true" means off. Note the worker reads its own
  # FEATURE_AGENT_CONTROL_ENABLED byte-exactly and independently — neither this
  # namespace nor the gateway's copy can start a listener in an agent pod.

  # The single port the gateway dials and the worker binds. It must equal
  # var.agent_control_port in modules/agent-factory/webhook-ingress/infra — the same
  # value is also the only port the control-listener ingress NetworkPolicy admits,
  # so a mismatch here is not a fallback: every control request becomes a 409
  # "unavailable" while the pod sits there listening on the other port.
  AGENT_CONTROL_PORT: "8770"

  # Comma-separated CIDRs the gateway will dial a control listener inside. This is
  # the SSRF boundary for a proxy that, unlike every other outbound path here,
  # deliberately targets PRIVATE addresses — so the usual "reject private IPs"
  # validator (internal/credential_routes.py) is the mirror image of what is needed
  # and must not be reused.
  #
  # FAIL-CLOSED: empty or unset denies every control request (409, "not
  # configured"). That is why this is not defaulted to a convenient wide range —
  # an operator who forgets it gets a clear misconfiguration rather than a gateway
  # willing to dial any private address, including link-local metadata.
  #
  # Substituted by gateway-deploy.yml from the cluster's pod CIDR. Loopback,
  # unspecified, multicast, reserved, link-local/IMDS and global addresses are
  # rejected in code regardless of what is listed here.
  AGENT_CONTROL_CLUSTER_POD_CIDRS: "__AGENT_CONTROL_CLUSTER_POD_CIDRS__"
  AGENT_AUTHORITY_ENABLED: "__AGENT_AUTHORITY_ENABLED__"
  ADP_WORK_CLAIMS_ENABLED: "__ADP_WORK_CLAIMS_ENABLED__"
  # Use the same explicit rollout setting as the scheduled engine. A missing
  # reader setting otherwise reports a false repository_execution_withheld.
  ADP_PRODUCT_STORY_DISPATCH_ENABLED: "__ADP_PRODUCT_STORY_DISPATCH_ENABLED__"
  ADP_WORK_CLAIM_PRODUCER_ROLES: "__ADP_WORK_CLAIM_PRODUCER_ROLES__"
  AGENT_AUTHORITY_TABLE: "__AGENT_AUTHORITY_TABLE__"
  WEBHOOK_EVENTS_TABLE: "__WEBHOOK_EVENTS_TABLE__"
  ADP_TOOLS_GATEWAY_ROLE_ARN: "__ADP_TOOLS_GATEWAY_ROLE_ARN__"
  ADP_TOOLS_FACADE_ROLE_ARN: "__ADP_TOOLS_FACADE_ROLE_ARN__"
  ADP_TOOLS_ASSERTION_KEY_ARN: "__ADP_TOOLS_ASSERTION_KEY_ARN__"
  # One Terraform-owned manifest binds the adapter endpoint, identities and release.
  ADP_TOOL_ADAPTER_OBSERVE_URL: "__ADP_TOOL_ADAPTER_OBSERVE_URL__"
  ADP_TOOL_ADAPTER_ASSERTION_KEY_ARN: "__ADP_TOOL_ADAPTER_ASSERTION_KEY_ARN__"
  ADP_TOOL_ADAPTER_CORE_ROLE_ARN: "__ADP_TOOL_ADAPTER_CORE_ROLE_ARN__"
  ADP_TOOL_ADAPTER_ADAPTER_ROLE_ARN: "__ADP_TOOL_ADAPTER_ADAPTER_ROLE_ARN__"
  ADP_TOOL_ADAPTER_RELEASE: "__ADP_TOOL_ADAPTER_RELEASE__"
  # Public native recipient configuration; never contains private signing keys.
  ADP_NATIVE_CREDENTIALS_ENABLED: "__ADP_NATIVE_CREDENTIALS_ENABLED__"
  ADP_NATIVE_CREDENTIALS_ISSUER: "__ADP_NATIVE_CREDENTIALS_ISSUER__"
  ADP_NATIVE_CREDENTIALS_APPROVAL_ORIGIN: "__ADP_NATIVE_CREDENTIALS_APPROVAL_ORIGIN__"
  ADP_NATIVE_CREDENTIALS_KEY_ID: "__ADP_NATIVE_CREDENTIALS_KEY_ID__"
  ADP_NATIVE_CREDENTIALS_KEY_ARN: "__ADP_NATIVE_CREDENTIALS_KEY_ARN__"
  # Task API preparation remains default-off until a qualified pilot is enabled.
  ADP_TASK_API_ADMISSION_ENABLED: "__ADP_TASK_API_ADMISSION_ENABLED__"
  ADP_TASK_API_READ_ENABLED: "__ADP_TASK_API_READ_ENABLED__"
  ADP_TASK_API_WORKER_ENABLED: "__ADP_TASK_API_WORKER_ENABLED__"
  ADP_TASK_API_RECOVERY_ENABLED: "__ADP_TASK_API_RECOVERY_ENABLED__"
  TASK_ARTIFACT_BUCKET_NAME: "__TASK_ARTIFACT_BUCKET_NAME__"
  ADP_TASK_API_QUEUE_URL: "__ADP_TASK_API_QUEUE_URL__"
  ADP_TASK_ADMISSION_PRODUCER_ROLES: "__ADP_TASK_ADMISSION_PRODUCER_ROLES__"
  ADP_TASK_DISPATCH_PRODUCER_ROLES: "__ADP_TASK_DISPATCH_PRODUCER_ROLES__"
  ADP_TASK_RECOVERY_PRODUCER_ROLES: "__ADP_TASK_RECOVERY_PRODUCER_ROLES__"
  ADP_TASK_QUALIFICATION_ID: "__ADP_TASK_QUALIFICATION_ID__"
  ADP_TASK_WORKER_IMAGE_DIGESTS: "__ADP_TASK_WORKER_IMAGE_DIGESTS__"
  ADP_TASK_WORKER_SERVICE_ACCOUNT: "__ADP_TASK_WORKER_SERVICE_ACCOUNT__"
  AGENT_DISPATCH_QUEUE_URL: "__AGENT_DISPATCH_QUEUE_URL__"
  # Same queue; this URL does not enable the unrelated legacy migration gate.
  ADP_RUN_TASK_QUEUE_URL: "__AGENT_DISPATCH_QUEUE_URL__"
  AGENT_WORKER_IMAGE_DIGESTS: "__AGENT_WORKER_IMAGE_DIGESTS__"
  AGENT_CONTROL_ENVELOPE_KEY_ID: "__AGENT_AUTHORITY_KEY_ID__"
  # Disabled until the original worker principal is isolated from all platform
  # Kubernetes access through the approved scoped rollout. Checked on each mint.
  AGENT_TASK_SOURCE_ROLE_ARN: "__AGENT_TASK_SOURCE_ROLE_ARN__"
  AGENT_TASK_SOURCE_EKS_CLUSTER: "__AGENT_TASK_SOURCE_EKS_CLUSTER__"
  AGENT_TASK_SOURCE_ISOLATION_CONFIRMED: "__AGENT_TASK_SOURCE_ISOLATION_CONFIRMED__"
  # --- Conversational intake for `adp flow start` (#5331, EPIC #4191) ---
  # All three name agent-factory resources and are published to SSM by that stack
  # (modules/agent-factory/infra/gateway-intake-access.tf), which also grants this
  # role the reads and the InvokeFunction. Substituted by gateway-deploy.yml.
  #
  # Each is INDEPENDENTLY optional, and unset is a supported state rather than an
  # error: the gateway builds an unconfigured reader/dispatcher that answers
  # "unavailable" on every intake verb (503; the CLI maps it to its documented
  # `unavailable` exit code). Raising at import instead would stop a gateway that
  # merely cannot PLAN from also proxying, approving gates and serving the
  # dashboard.
  #
  # The split is deliberate: with only the context table unset, a conversation is
  # still readable — transcript, issue, in-flight state — and just the draft comes
  # back flagged `draft_available: false`. Folding the two together would 503 a
  # readback that mostly works.
  BG_INTAKE_SESSIONS_TABLE: "__BG_INTAKE_SESSIONS_TABLE__"
  ADP_CHAT_RESPONSE_QUEUE_URL: "__ADP_CHAT_RESPONSE_QUEUE_URL__"
  ADP_CHAT_INPUT_QUEUE_URL: "__ADP_CHAT_INPUT_QUEUE_URL__"
  BG_INTAKE_CONTEXT_TABLE: "__BG_INTAKE_CONTEXT_TABLE__"
  # A Lambda FUNCTION NAME, not a queue URL. The turn enters through the ingest
  # Lambda so it gets the session row, the thread, the transcript and the
  # registered run a browser turn gets. `BG_INTAKE_QUEUE_URL` is deliberately not
  # read as a fallback anywhere, so a stale deployment reports unavailable rather
  # than resuming the queue shortcut this replaced.
  BG_INTAKE_INGEST_FUNCTION: "__BG_INTAKE_INGEST_FUNCTION__"


  # PMM-07 producer and ARC registrations are operator-owned deployment data.
  # Empty registrations refuse these paths; rollout does not activate defaults.
  ADP_MODEL_ROOT_BINDINGS: "__ADP_MODEL_ROOT_BINDINGS__"
  ADP_ARC_MODEL_BINDINGS: "__ADP_ARC_MODEL_BINDINGS__"
  ADP_CHAT_WORKER_IMAGE_DIGESTS: "__ADP_CHAT_WORKER_IMAGE_DIGESTS__"
  ADP_CHAT_WORKER_NAMESPACE: "adp-gateway-agents"
  # Chat workload identities verified by src/agentauth/workload.py (#7899). The
  # worker service account is adp-agent for the legacy credentialed worker and
  # adp-chat-supervisor once `deploy-all.sh --chat delegated` publishes the
  # delegated release; sandbox (adp-chat-sandbox) and Crew (adp-crew-pod) pods are
  # admitted only with these pinned digests. All three come from script-owned SSM
  # parameters /adp/<env>/gateway/chat-{worker-service-account,sandbox-image-digests,
  # crew-image-digests}; empty digests refuse the corresponding pods.
  ADP_CHAT_WORKER_SERVICE_ACCOUNT: "__ADP_CHAT_WORKER_SERVICE_ACCOUNT__"
  # Chat data plane for the delegated supervisor/sandboxes; off until --chat delegated.
  ADP_CHAT_DATA_ENABLED: "__ADP_CHAT_DATA_ENABLED__"
  # Delegated chat memory and artifact stores (#8028), served by
  # src/agentauth/chat_data_routes.py (memory_table / artifact_storage). The
  # agent-factory stack owns the tables and the bucket
  # (modules/agent-factory/infra/chat-agent-infra.tf) and publishes the table
  # names to SSM /adp/<env>/gateway/chat-memory-table and chat-artifacts-table;
  # the bucket name is the gateway stack's /adp/<env>/gateway/task-artifact-bucket-name.
  # Both renderers validate the names and fall back to the deterministic
  # adp-<env>-agent-memory / adp-<env>-chat-artifacts; the bucket falls back to
  # empty. The grants are gateway-intake-access.tf (ChatMemoryStore,
  # ChatArtifactCatalog, ChatArtifactObjects). Empty is a supported state, not an
  # error: the data plane answers 503 chat_memory_unconfigured /
  # chat_artifacts_unconfigured and the sandbox answers the turn without memory
  # or artifact tools (one log line), it does not fail.
  MEMORY_TABLE: "__MEMORY_TABLE__"
  ARTIFACTS_TABLE: "__ARTIFACTS_TABLE__"
  ARTIFACTS_BUCKET: "__ARTIFACTS_BUCKET__"
  ADP_CHAT_SANDBOX_IMAGE_DIGESTS: "__ADP_CHAT_SANDBOX_IMAGE_DIGESTS__"
  ADP_CHAT_CREW_IMAGE_DIGESTS: "__ADP_CHAT_CREW_IMAGE_DIGESTS__"

  # Delegated chat sandbox transport (modules/agent-factory/infra/chat-sandbox-tls.md).
  # The supervisor admission/exit workload checks compare sandbox pods against
  # these two public values. platform/scripts/apply-chat-tls.sh publishes the CA
  # ConfigMap name to SSM /adp/<env>/gateway/chat-sandbox-ca-configmap
  # (deploy-all.sh --chat delegated); both renderers read it from there. Empty
  # means delegated chat is not provisioned and sandbox pods are refused. When
  # the name is set, the URL is the fixed in-cluster listener.
  ADP_CHAT_DATA_URL: "__ADP_CHAT_DATA_URL__"
  ADP_CHAT_SANDBOX_CA_CONFIGMAP: "__ADP_CHAT_SANDBOX_CA_CONFIGMAP__"

  # Crew proxy tuning (#7902). Both values are gateway-infra SSM parameters from
  # modules/gateway/infra/chief-of-staff-flags.tf (tfvars crew_proxy_keepalive_seconds,
  # crew_proxy_max_conn_per_user); both renderers read them and default to 25 / 20
  # when the parameter is absent. Keepalive 0 disables the SSE keepalive and the
  # pod-hop WebSocket ping; the browser-hop ping is UVICORN_WS_PING_INTERVAL in
  # deployment.yaml, rendered from the same parameter and dropped when it is 0.
  CREW_PROXY_KEEPALIVE_SECONDS: "__CREW_PROXY_KEEPALIVE_SECONDS__"
  CREW_PROXY_MAX_CONN_PER_USER: "__CREW_PROXY_MAX_CONN_PER_USER__"
  # The Crew dashboard switch and edge origin also live here (not only as gateway
  # Deployment env) because the Dev Box controller shares this ConfigMap and passes the
  # origin to each host's `--configure` (#8223 cause 20; 2026-10-20 a fresh box rendered
  # dashboard.url = 127.0.0.1 because the controller never saw the origin). Same SSM
  # parameters and defaults as the Deployment render; the Deployment env keeps precedence.
  FEATURE_CREW_DASHBOARD: "__FEATURE_CREW_DASHBOARD__"
  CREW_DASHBOARD_ORIGIN: "__CREW_DASHBOARD_ORIGIN__"

  # Crew checkpoints (#7902): written by modules/gateway/infra/crew-checkpoints.tf.
  # crew-checkpoints-enabled and crew-checkpoint-retention-seconds (days * 86400)
  # exist in every environment; crew-checkpoint-bucket only while
  # crew_checkpoints_enabled is on, and an absent parameter renders "" so the
  # checkpoint routes answer 503 checkpoint_storage_unavailable instead of
  # guessing a bucket.
  ADP_CREW_CHECKPOINTS_ENABLED: "__ADP_CREW_CHECKPOINTS_ENABLED__"
  ADP_CREW_CHECKPOINT_BUCKET: "__ADP_CREW_CHECKPOINT_BUCKET__"
  ADP_CREW_CHECKPOINT_RETENTION_SECONDS: "__ADP_CREW_CHECKPOINT_RETENTION_SECONDS__"
  # #8555: the owner's Dev Box gh/git and `adp github token` act as the owner through
  # their connected GitHub account. SSM github-user-access-enabled (gateway infra).
  ADP_GITHUB_USER_ACCESS_ENABLED: "__ADP_GITHUB_USER_ACCESS_ENABLED__"

  # Tools consent posture (#8387): written by modules/gateway/infra/tools-consent.tf
  # as tools-consent-default. "granted" lets every tenant-entitled tool be allowed and
  # consented for a human owner by default (opt-out per tool); "explicit" keeps the
  # opt-in Settings -> Tools contract. A tenant may override it in its settings.
  ADP_TOOLS_CONSENT_DEFAULT: "__ADP_TOOLS_CONSENT_DEFAULT__"

  # Shared AgentCore user memory (#7901, code #7210): the three public values of
  # the memory target, written by modules/gateway/infra/agentcore-memory.tf while
  # agentcore_memory_enabled is on. The fourth value, ADP_AGENTCORE_NAMESPACE_KEY,
  # is a SecureString and reaches the pod only through the bedrockgateway-secrets
  # Secret (deployment.yaml), never this ConfigMap. agentcore_recall() treats all
  # four empty as "memory disabled" and a partial set as an outage, so both
  # renderers refuse to render when some but not all four parameters exist.
  ADP_AGENTCORE_MEMORY_ID: "__ADP_AGENTCORE_MEMORY_ID__"
  ADP_AGENTCORE_MEMORY_STRATEGY_ID: "__ADP_AGENTCORE_MEMORY_STRATEGY_ID__"
  ADP_AGENTCORE_MEMORY_REGION: "__ADP_AGENTCORE_MEMORY_REGION__"
