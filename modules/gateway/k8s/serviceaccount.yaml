apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway-service
  namespace: adp-gateway
  labels:
    app.kubernetes.io/name: bedrockgateway
    app.kubernetes.io/part-of: bedrock-gateway
  annotations:
    # IRSA annotation — links to the platform's gateway service role
    # This allows pods to assume the IAM role for AWS API access
    eks.amazonaws.com/role-arn: arn:aws:iam::879318057152:role/adp-dev-role-gateway-service
