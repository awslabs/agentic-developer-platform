apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway-service
  namespace: adp-gateway
  labels:
    app.kubernetes.io/name: bedrockgateway
    app.kubernetes.io/part-of: bedrock-gateway
  annotations:
    # IRSA annotation — links to the platform's gateway service role.
    # The __GATEWAY_IRSA_ROLE_ARN__ placeholder is replaced at deploy time
    # by gateway-deploy.yml (or deploy-all.sh) with the target account's role.
    eks.amazonaws.com/role-arn: __GATEWAY_IRSA_ROLE_ARN__
