apiVersion: batch/v1
kind: CronJob
metadata:
  name: atlassian-mcp-recovery
  namespace: adp-gateway
  labels:
    app.kubernetes.io/name: atlassian-mcp-recovery
    app.kubernetes.io/part-of: bedrock-gateway
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 600
      backoffLimit: 1
      activeDeadlineSeconds: 240
      template:
        metadata:
          labels:
            app.kubernetes.io/name: atlassian-mcp-recovery
        spec:
          serviceAccountName: gateway-service
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: recovery
              image: REPLACE_WITH_GATEWAY_IMAGE
              command: ["python", "-m", "src.shared.identity.oauth_setup_worker", "--once"]
              securityContext:
                runAsNonRoot: true
                runAsUser: 65532
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              envFrom:
                - configMapRef:
                    name: bedrockgateway-config
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: home
                  mountPath: /home/appuser
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
            - name: home
              emptyDir:
                sizeLimit: 64Mi
