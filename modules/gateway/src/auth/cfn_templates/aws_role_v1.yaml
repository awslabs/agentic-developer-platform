AWSTemplateFormatVersion: '2010-09-09'
Description: ADP - cross-account role for agent delegation
Parameters:
  Nickname:
    Type: String
    Default: default
  ExternalId:
    Type: String
    NoEcho: true
  GatewayRolePrincipal:
    Type: String
    Description: ARN of ADP's gateway pod IRSA role
  GatewayAccountId:
    Type: String
    Description: AWS account ID that hosts the ADP platform (gateway role's home account)
  UserSessionTag:
    Type: String
    Description: ADP user ID, used as a session tag
Resources:
  AdpAgentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "ADP-Agent-${Nickname}"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Trust the platform ACCOUNT root but restrict to the specific gateway
          # role via aws:PrincipalArn condition. This pattern survives role
          # recreation (terraform replace / destroy+create) because AWS does not
          # resolve account-level principals to internal IDs — it only resolves
          # role/user ARNs. When the gateway role is recreated with the same
          # name, the condition still matches without needing to update this
          # trust policy.
          #
          # AssumeRole is further guarded by ExternalId (confused-deputy) and
          # the session tag value.  TagSession is a separate statement because
          # sts:ExternalId is not a valid condition key for that action.
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${GatewayAccountId}:root"
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
                "aws:PrincipalArn": !Ref GatewayRolePrincipal
                "aws:RequestTag/adp:user_id": !Ref UserSessionTag
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${GatewayAccountId}:root"
            Action: sts:TagSession
            Condition:
              StringEquals:
                "aws:PrincipalArn": !Ref GatewayRolePrincipal
                "aws:RequestTag/adp:user_id": !Ref UserSessionTag
      Description: !Sub "ADP delegated role for ${Nickname} - managed by user"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/ReadOnlyAccess
Outputs:
  RoleArn:
    Value: !GetAtt AdpAgentRole.Arn
    Description: The ARN of the created role
