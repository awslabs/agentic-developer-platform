# Orchestration deployment manifest
# =================================
#
# Issue #5150 (ENGINE-D1, parent #5131). The reviewed list of deployment targets
# the orchestration engine is permitted to deploy to, and — for each — exactly
# what a deploy to it may consist of.
#
# Parsed by `src/orchestration/deployment_manifest.py`. The deployed gateway loads
# THIS file via `load_packaged_manifest()`; consumed by #5151 (dispatch) and #5152
# (verification/rollback). Nothing in this repository dispatches a workflow from it
# today.
#
# WHY IT LIVES INSIDE `src/` RATHER THAN IN A ROOT `config/` DIRECTORY
# -------------------------------------------------------------------
# The gateway image is built with `modules/gateway` as its docker build context
# (`codebuild/bs-gateway-build.yml`: `cd modules/gateway && docker build .`), and
# the Dockerfile carries the tree with `COPY src/ src/`. A repository-root
# `config/` directory is outside that context, so no `COPY` could reach it — a
# manifest kept there is unreachable from the running process by construction,
# which would make this an approval the engine cannot read.
#
# WHY THIS FILE EXISTS
# --------------------
# "Deploy" is the one engine action whose blast radius is somebody else's
# infrastructure. Without this file an agent would choose the pipeline, the
# inputs and the release itself at run time. Each entry below turns those
# choices into a lookup of something a human reviewed.
#
# An entry is an APPROVAL. Editing one grants the engine authority it did not
# previously have, so changes here need the same review as a permission change —
# not the lighter review a configuration tweak usually gets.
#
# WHY `definition_revision` IS PINNED
# -----------------------------------
# Pinning only `path` approves a *filename*, and a filename's contents change
# with every merge — so the approval would silently transfer to whatever that
# path contains later, including a rewritten job that deploys somewhere else.
# `definition_revision` is the commit SHA of the workflow definition that was
# actually reviewed. `resolve_manifest_entry` refuses a dispatch whose resolved
# definition does not match it — and also refuses when the caller resolved no
# revision at all, because "we did not check" must not read as "it matches". When a workflow legitimately changes, re-review it and update the
# SHA. Do NOT widen the check to make a drifted definition run.
#
# WHY `allowed_inputs` LISTS VALUES AND NOT JUST NAMES
# ----------------------------------------------------
# Approving the input *name* `environment` would approve `environment: prod`
# wherever it approved `environment: dev`. So each input maps to the exact set
# of permitted values. An input absent from `allowed_inputs` may not be passed
# at all; an input mapped to an empty value (`~`) may be passed only at the
# workflow's own default, which permits pass-through without letting a caller
# choose the value.
#
# WHY THE PILOT ENTRIES BELOW ARE `unresolved`
# --------------------------------------------
# Both entries are deliberately NOT enabled, and this is the honest state rather
# than an oversight. Enabling one requires a registered environment connection
# whose AWS account has been proven by real readback (the platform verifies a
# connection by actually assuming into the account), AND a recorded concrete
# deployment surface — the cluster and namespace, not just the account.
#
# The verified-connection evidence the platform stores today was captured for
# model-invocation routing: it proves the account and role, but it does not
# establish which cluster or namespace a deploy would land in. An account alone
# is too coarse to serialize on (two independent clusters in one account would
# block each other, and a lease people bypass protects nothing).
#
# So these entries record what is missing instead of guessing. No account id and
# no credential is invented here to make an example executable: a fabricated
# account id would name a real deployment surface that nobody verified, which is
# a fabricated authorization. `resolve_manifest_entry` returns a typed block
# naming the owner for an unresolved entry, which is the intended behavior.
#
# TO ENABLE AN ENTRY (deployment prerequisite, not a code change)
# --------------------------------------------------------------
#   1. Register the environment connection and verify it, so its account is
#      proven by provider readback rather than asserted.
#   2. Add the connection id to the accepted plan's permitted deployment targets
#      (`ExecutionPolicy.environment_connection_ids`). The manifest and the
#      in-force policy are checked independently and both must permit the target.
#   3. Record the concrete surface in `resource_kind` / `resource_id`.
#   4. Confirm `definition_revision` is the SHA of the reviewed definition. The
#      engine now compares it against the revision the dispatcher actually
#      resolved and refuses the dispatch on a mismatch — or when no revision was
#      resolved at all — so a stale SHA here blocks rather than silently passes.
#   5. Pin `artifact_revision` to the full 40-character commit SHA of the build
#      this entry is approved to ship. Required for an enabled entry unless
#      `docs_only: true`, and refused unless it is a full SHA — `latest`, `main`
#      and a tag are all resolved by something other than the reviewer. Leave it
#      as `~` while the entry is unresolved; do not invent a SHA to satisfy the
#      check.
#   6. Change `status` to `enabled` and remove `unresolved_reason`.

schema_version: 1

# WHY `path_rules` LIVES HERE (#7457)
# ---------------------------------
# The engine decides which pipeline a merged change needs by mapping the changed
# repository paths to components and then selecting the entries that cover those
# components. That mapping used to be an if-chain in Python, so every new module,
# workflow file or script needed an engine release before its deployment phase
# could even be evaluated — the opposite of letting an agent add a pipeline in
# the same pull request as the code it deploys. As manifest data it is reviewed
# with the pipelines it names, under the same review as the entries below.
#
# Rules are evaluated in order; the first match wins, so put narrower rules
# before broader ones. `pattern` is a shell glob over the full repository path
# (`*` crosses `/`). `component: ignore` marks paths that never need a deployment
# (documentation, CI-only definitions, tests, the engine's own task records). A
# path that matches no rule blocks the deployment phase with
# `deployment_component_unmapped`: unknown stays unknown, and the fix is a rule
# in the pull request that introduces the path.
path_rules:
  # Owned Product qualification fixtures for epic #8394. Exact source pins
  # and accepted repository policy independently restrict these components.
  - { pattern: "qualification-api/*", component: qualification-api }
  - { pattern: "qualification-client/*", component: qualification-client }
  - { pattern: "app.py", component: qualification-api }
  - { pattern: "client.py", component: qualification-client }
  - { pattern: ".github/workflows/qualification-api-deploy.yml", component: qualification-api }
  - { pattern: ".github/workflows/qualification-client-deploy.yml", component: qualification-client }
  - { pattern: ".github/workflows/ci.yml", component: ignore }
  - { pattern: "modules/user-services/dev-box/*", component: dev-box }
  - { pattern: ".github/workflows/dev-box-ci.yml", component: dev-box }
  - { pattern: ".github/workflows/dev-box-deploy.yml", component: dev-box }
  # Worker lifecycle is protected and manual; target authority is never inferred from paths.
  - { pattern: "modules/L5-services/tests/*", component: ignore }
  - { pattern: "modules/L5-services/*.md", component: ignore }
  - { pattern: "modules/L5-services/*", component: l5-security }
  - { pattern: ".github/workflows/l5-services-worker-lifecycle.yml", component: l5-security }
  - { pattern: ".github/workflows/l5-services-release.yml", component: l5-security }
  - { pattern: ".github/workflows/l5-services-ci.yml", component: ignore }
  # Insights
  - { pattern: "modules/insights/*", component: insights }
  - { pattern: ".github/workflows/insights-deploy.yml", component: insights }
  # Gateway: frontend and migrations before the backend catch-all
  - { pattern: "modules/gateway/frontend/*", component: gateway-frontend }
  - { pattern: "modules/gateway/alembic/*", component: gateway-migrations }
  - { pattern: ".github/workflows/run-gateway-migrations.yml", component: gateway-migrations }
  # Tools platform, façade and interceptor
  - { pattern: "modules/tools/platform/*", component: tools-platform }
  - { pattern: ".github/workflows/tools-platform-deploy.yml", component: tools-platform }
  # Adapter source and its release workflow are separate from the tools gateway.
  - { pattern: "modules/tools/adapters/tests/*", component: ignore }
  - { pattern: "modules/tools/adapters/*.md", component: ignore }
  - { pattern: "modules/tools/adapters/*", component: tool-adapters }
  - { pattern: "modules/tools/adp_tools/adapter_contracts.py", component: tool-adapters }
  - { pattern: "codebuild/bs-tools-adapters-build.yml", component: tool-adapters }
  - { pattern: ".github/workflows/tools-adapters-deploy.yml", component: tool-adapters }
  - { pattern: ".github/workflows/tools-adapters-ci.yml", component: ignore }
  - { pattern: "modules/tools/facade/*", component: tools-facade }
  - { pattern: "modules/tools/scripts/facade_receipt.py", component: tools-facade }
  - { pattern: ".github/workflows/tools-facade-deploy.yml", component: tools-facade }
  - { pattern: "modules/tools/interceptor/*", component: tools-interceptor }
  - { pattern: ".github/workflows/tools-interceptor-deploy.yml", component: tools-interceptor }
  # The shared tools deploy entry points release the platform (which carries the targets).
  - { pattern: "modules/tools/deploy.sh", component: tools-platform }
  - { pattern: "modules/tools/orchestrate.sh", component: tools-platform }
  # CI-only definitions never deploy anything.
  - { pattern: ".github/workflows/tools-ci.yml", component: ignore }
  - { pattern: ".github/workflows/tools-platform-ci.yml", component: ignore }
  - { pattern: ".github/workflows/tools-interceptor-ci.yml", component: ignore }
  - { pattern: "codebuild/bs-tools-facade-smoke.yml", component: ignore }
  # Knowledge door
  - { pattern: "modules/agent-context/door/*", component: knowledge-door }
  - { pattern: "modules/agent-context/scripts/door_release_evidence.py", component: knowledge-door }
  - { pattern: ".github/workflows/agent-context-deploy.yml", component: knowledge-door }
  # Tests, documentation and the engine's own records
  - { pattern: "modules/gateway/tests/*", component: ignore }
  - { pattern: "modules/agent-context/tests/*", component: ignore }
  - { pattern: "tests/*", component: ignore }
  - { pattern: "docs/*", component: ignore }
  - { pattern: "aidlc/*", component: ignore }
  - { pattern: "*.md", component: ignore }
  - { pattern: ".adp/*", component: ignore }
  - { pattern: ".gitignore", component: ignore }
  # Gateway backend catch-all (after the narrower gateway rules above)
  - { pattern: "modules/gateway/*", component: gateway-backend }
  - { pattern: ".github/workflows/gateway-deploy.yml", component: gateway-backend }
  # Agent factory
  - { pattern: ".github/workflows/chat-agent-deploy.yml", component: agent-worker }
  - { pattern: "modules/agent-factory/agent-worker-image/*", component: agent-worker }
  - { pattern: "modules/agent-factory/agent/src/complex-task-chat/*", component: chat-worker }
  - { pattern: "modules/agent-factory/agent/*", component: agent-worker }
  - { pattern: "modules/agent-factory/webhook-ingress/*", component: agent-webhook }

