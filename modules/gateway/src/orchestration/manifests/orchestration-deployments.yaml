  # --------------------------------------------------------------------------
  # The existing pilot environment's gateway deployment.
  # --------------------------------------------------------------------------
  - entry_id: adp-dev-embark1-gateway
    status: unresolved
    unresolved_reason: >-
      No registered environment connection for adp-dev-embark1 has been resolved
      to a verified deployment surface. The stored connection evidence proves an
      account and role but does not establish the EKS cluster and namespace a
      deploy would land in, and an account alone is too coarse to serialize on.
      Register and verify the environment connection, record its cluster and
      namespace, then re-review this entry.

    # Left null deliberately: naming a connection id here that is not resolvable
    # to a verified target would look like an approval that had been granted.
    connection_id: ~

    # The components this entry covers. A deploy naming anything outside these is
    # refused, so "deploy the gateway" cannot quietly become "deploy everything".
    component_selectors:
      - gateway-backend
      - gateway-frontend

    # The concrete deployment surface. Unset until readback establishes it — see
    # the header note on why an account id is not a sufficient target.
    resource_kind: ~
    resource_id: ~

    workflow:
      # Real path and the SHA of the definition reviewed for this entry.
      path: .github/workflows/gateway-deploy.yml
      definition_revision: 870a05787075c838313e2a77f4b87747014136a6
      allowed_inputs:
        # Pilot environment only. `prod` is deliberately absent: this entry
        # approves a dev deploy, and adding a value here is a permission change.
        environment:
          - dev
        # Pass-through only, at the workflow's own default. The engine may not
        # choose an account: the account comes from the verified connection, and
        # letting a caller pass one would reintroduce the untrusted account
        # string this story exists to eliminate.
        account_id: ~
        customer_account_id: ~

    # Which build is shipped. Null means "the workflow's own resolution" — honest,
    # because pinning a release SHA we have not got would be invention.
    artifact_revision: ~

    # Adapter NAMES that #5152 owns. Nothing here executes either of them, and a
    # present rollback name is a permission, not an instruction.
    verification_adapter: gateway-health-verification
    rollback_adapter: gateway-revision-rollback

    docs_only: false

  # --------------------------------------------------------------------------
  # The gateway's database migration step. Separate from the deploy above
  # because it is a distinct approval: a migration's failure mode (a schema a
  # running cohort cannot read) is not the deploy's, so approving one must not
  # approve the other.
  # --------------------------------------------------------------------------
  - entry_id: adp-dev-embark1-gateway-migrations
    status: unresolved
    unresolved_reason: >-
      Depends on the same unresolved connection and deployment surface as
      adp-dev-embark1-gateway. Additionally, a migration entry must not be
      enabled until the expected release image is verifiable at dispatch time,
      so that a migration cannot be applied against an image other than the one
      reviewed.

    connection_id: ~

    component_selectors:
      - gateway-migrations

    resource_kind: ~
    resource_id: ~

    workflow:
      path: .github/workflows/run-gateway-migrations.yml
      definition_revision: 870a05787075c838313e2a77f4b87747014136a6
      allowed_inputs:
        environment:
          - dev
        # Pass-through only. The image the migration runs against is the release
        # image the deploy resolved; a caller-chosen value here would let a
        # migration be applied against an unreviewed build.
        expected_image: ~
        account_id: ~
        customer_account_id: ~

    artifact_revision: ~

    verification_adapter: alembic-single-head-verification

    # No rollback adapter, and this omission is the reviewed decision rather than
    # a gap. An automatic schema downgrade against a shared environment can
    # destroy data a forward migration moved, so rollback here is an authorized
    # human procedure and the engine is granted no permission to perform it.
    rollback_adapter: ~

    docs_only: false

