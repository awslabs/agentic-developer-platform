# =============================================================================
# CodeBuild Buildspec — Cyber Worker Docker image
# =============================================================================
# Issue #230: Builds and pushes adp-cyber-worker to ECR.
# Copied from codebuild/bs-chat-agent.yml pattern.
# =============================================================================
version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: us-east-1
    IMAGE_REPO_NAME: adp-cyber-worker
    IMAGE_TAG: latest

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $REGISTRY
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_URI="${REGISTRY}/${IMAGE_REPO_NAME}"
  build:
    commands:
      - echo Building Docker image...
      - cd modules/domain-apps/cyber/workers
      - docker build -t ${IMAGE_REPO_NAME}:${IMAGE_TAG} .
      - docker tag ${IMAGE_REPO_NAME}:${IMAGE_TAG} ${IMAGE_URI}:${IMAGE_TAG}
      - docker tag ${IMAGE_REPO_NAME}:${IMAGE_TAG} ${IMAGE_URI}:${COMMIT_HASH}
  post_build:
    commands:
      - echo Pushing Docker image to ECR...
      - docker push ${IMAGE_URI}:${IMAGE_TAG}
      - docker push ${IMAGE_URI}:${COMMIT_HASH}
      - echo Build completed on $(date)
