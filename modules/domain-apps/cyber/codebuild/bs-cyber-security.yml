version: 0.2
# Uses the existing gateway project with its nonpublishing PR service role.
# Never logs into ECR or uploads artifacts from an untrusted PR build.
phases:
  build:
    commands:
      - |
        set -euo pipefail
        test -n "$ADP_SOURCE_SHA"
        cd modules/domain-apps/cyber
        docker build --pull --target security-test --build-arg IMAGE_TAG="$ADP_SOURCE_SHA" -f workers/Dockerfile -t cyber-worker-security .
        docker build --pull --target kernel-test-tools -f workers/Dockerfile -t cyber-kernel-tools .
        CONTAINER=$(docker create cyber-worker-security)
        docker export "$CONTAINER" -o /tmp/cyber-rootfs.tar
        docker rm "$CONTAINER"
        docker run --rm --network none --memory 6g --mount type=bind,src=/tmp/cyber-rootfs.tar,dst=/input/rootfs.tar,readonly cyber-kernel-tools
