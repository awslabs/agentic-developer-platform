name: Cyber Browser Build
description: Build the independently versioned cyber browser image; no deployment.
runs:
  using: composite
  steps:
  - name: Load cyber configuration
    shell: bash
    env:
      AWS_REGION: us-east-1
      ENVIRONMENT: dev
      ECR_REPO: adp-cyber-browser
      CODEBUILD_PROJECT: adp-dev-cyber-browser
    run: "python3 - <<'PYENV'\nimport os, uuid\nwith open(os.environ[\"GITHUB_ENV\"], \"a\") as stream:\n    for key in ['AWS_REGION',\
      \ 'ENVIRONMENT', 'ECR_REPO', 'CODEBUILD_PROJECT']:\n        marker = uuid.uuid4().hex\n        stream.write(f\"{key}<<{marker}\\\
      n{os.environ[key]}\\n{marker}\\n\")\nPYENV\n"
  - name: Load deployment config
    uses: ./.github/actions/load-deploy-config
  - name: Install zip + AWS CLI
    run: "set -euo pipefail\nfor tool in aws terraform kubectl helm jq zip unzip curl git python3 node npm; do\n  command\
      \ -v \"$tool\" >/dev/null || { echo \"::error::Reviewed runner image is missing $tool\"; exit 1; }\ndone\n"
    shell: bash
  - name: Verify Terraform-managed CodeBuild project
    run: "set -euo pipefail\nEXISTS=$(aws codebuild batch-get-projects \\\n  --names \"${CODEBUILD_PROJECT}\" \\\n  --region\
      \ \"${AWS_REGION}\" \\\n  --query 'projects | length(@)' --output text 2>/dev/null || echo \"0\")\nif [ \"$EXISTS\"\
      \ -ne 1 ]; then\n  echo \"::error::${CODEBUILD_PROJECT} is missing \u2014 apply platform/infra before running this build\
      \ lane.\"\n  exit 1\nfi\n"
    shell: bash
  - name: Build image via CodeBuild
    id: build
    uses: ./.github/actions/codebuild-run
    with:
      project_name: ${{ env.CODEBUILD_PROJECT }}
      region: ${{ env.AWS_REGION }}
      state_bucket: ${{ env.STATE_BUCKET }}
      environment_variables: '"name=AWS_REGION,value=${{ env.AWS_REGION }}" "name=ENVIRONMENT,value=${{ env.ENVIRONMENT }}"
        "name=ACCOUNT_ID,value=${{ env.ACCOUNT_ID }}" "name=REGISTRY,value=${{ env.ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION
        }}.amazonaws.com" "name=IMAGE_TAG,value=${{ github.sha }}"'
  - name: Export build outputs
    id: build_info
    run: 'REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

      echo "image_tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      echo "registry=${REGISTRY}" >> "$GITHUB_OUTPUT"

      '
    shell: bash -e {0}
  - name: Show built image
    shell: bash -e {0}
    run: 'echo "Built ${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/adp-cyber-browser:${{ github.sha }}; resolve its digest
      and review before rollout." >> "$GITHUB_STEP_SUMMARY"

      '
