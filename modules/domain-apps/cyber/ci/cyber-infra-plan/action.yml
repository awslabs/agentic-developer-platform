name: Cyber Infra Plan
description: Cyber-owned implementation for cyber-infra-plan.
runs:
  using: composite
  steps:
  - name: Load cyber configuration
    shell: bash
    env:
      AWS_REGION: us-east-1
      TF_VAR_environment: dev
      MODULE_NAME: cyber
      TF_WORKING_DIR: modules/domain-apps/cyber/infra
      BACKEND_CONFIG: modules/domain-apps/cyber/environments/dev/sandbox-backend.tfvars
      VAR_FILE: modules/domain-apps/cyber/infra/terraform.tfvars
    run: |
      python3 - <<'PYENV'
      import os, uuid
      with open(os.environ["GITHUB_ENV"], "a") as stream:
          for key in ['AWS_REGION', 'TF_VAR_environment', 'MODULE_NAME', 'TF_WORKING_DIR', 'BACKEND_CONFIG', 'VAR_FILE']:
              marker = uuid.uuid4().hex
              stream.write(f"{key}<<{marker}\n{os.environ[key]}\n{marker}\n")
      PYENV
  - name: Install required CLI tools
    run: |
      set -euo pipefail
      for tool in aws terraform kubectl helm jq zip unzip curl git python3 node npm; do
        command -v "$tool" >/dev/null || { echo "::error::Reviewed runner image is missing $tool"; exit 1; }
      done
    shell: bash
  - name: Resolve deployment account
    run: |
      set -euo pipefail
      ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      echo "ACCOUNT_ID=${ACCOUNT_ID}" >> "$GITHUB_ENV"
    shell: bash
  - name: Terraform Init
    working-directory: ${{ env.TF_WORKING_DIR }}
    run: |
      terraform init \
        -backend-config="../../../../${{ env.BACKEND_CONFIG }}" \
        -backend-config="bucket=adp-terraform-state-${ACCOUNT_ID}" \
        -input=false
    shell: bash
  - name: Terraform Plan
    id: plan
    working-directory: ${{ env.TF_WORKING_DIR }}
    run: |
      set -euo pipefail
      terraform plan -input=false -var-file="terraform.tfvars" \
        -var="account_id=${ACCOUNT_ID}" -out=tfplan -no-color 2>&1 | tee /tmp/plan-output.txt
    shell: bash
  - name: Post or update PR comment
    uses: actions/github-script@v9
    if: always() && github.event_name == 'pull_request'
    env:
      PLAN_OUTPUT: ${{ steps.plan.outcome }}
    with:
      script: "const fs = require('fs');\nconst marker = `<!-- tf-plan:${{ env.MODULE_NAME }} -->`;\nlet planText\
        \ = '';\ntry {\n  planText = fs.readFileSync('/tmp/plan-output.txt', 'utf8');\n} catch (e) {\n  planText\
        \ = 'Plan output not available.';\n}\nif (planText.length > 60000) {\n  planText = planText.substring(0,\
        \ 60000) + '\\n\\n... (truncated)';\n}\nconst status = process.env.PLAN_OUTPUT === 'success' ? ':white_check_mark:'\
        \ : ':x:';\nconst body = `${marker}\\n${status} **Terraform Plan \u2014 \\`${{ env.MODULE_NAME }}\\`**\\\
        n\\n<details>\\n<summary>Plan output</summary>\\n\\n\\`\\`\\`\\n${planText}\\n\\`\\`\\`\\n\\n</details>\\\
        n\\n*Updated: ${new Date().toISOString()} | Run: [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})*`;\n\
        \nconst { data: comments } = await github.rest.issues.listComments({\n  owner: context.repo.owner,\n  repo:\
        \ context.repo.repo,\n  issue_number: context.issue.number,\n  per_page: 100,\n});\nconst existing = comments.find(c\
        \ => c.body.startsWith(marker));\nif (existing) {\n  await github.rest.issues.updateComment({\n    owner:\
        \ context.repo.owner,\n    repo: context.repo.repo,\n    comment_id: existing.id,\n    body,\n  });\n} else\
        \ {\n  await github.rest.issues.createComment({\n    owner: context.repo.owner,\n    repo: context.repo.repo,\n\
        \    issue_number: context.issue.number,\n    body,\n  });\n}\n"
  - name: Summary
    if: always()
    run: |
      echo "## Terraform Plan -- ${{ env.MODULE_NAME }}" >> "$GITHUB_STEP_SUMMARY"
      echo "- **Module**: ${{ env.MODULE_NAME }}" >> "$GITHUB_STEP_SUMMARY"
      echo "- **Status**: ${{ steps.plan.outcome }}" >> "$GITHUB_STEP_SUMMARY"
      echo "- **Working dir**: ${{ env.TF_WORKING_DIR }}" >> "$GITHUB_STEP_SUMMARY"
    shell: bash
