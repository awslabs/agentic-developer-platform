[project]
name = "account-factory"
version = "0.1.0"
description = "Canonical Superplane account ownership modes and validation"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["account_factory", "account_factory.*"]

[tool.setuptools.package-data]
account_factory = ["_data/*.yaml", "_data/policies/*.json", "_data/manifests/*.yaml", "_data/vendor/kro-account-factory/*"]
