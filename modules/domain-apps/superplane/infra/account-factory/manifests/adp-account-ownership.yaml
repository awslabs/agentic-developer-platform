# ADP-maintained ResourceGraphDefinition: account ownership — Issues #5530 (w6-07), #5531 (w6-08).
#
# MAINTAINED BY ADP. This is not a vendored file: it is reviewed in the diff like any other
# source, which is why it carries no upstream provenance block and no recorded checksum (see
# `dependencies.py`'s `maintained_resource_graph_definitions` note for that distinction).
#
# ── #5531: this graph no longer CREATES an account, and that is the point ────────────────
#
# It used to declare an ACK `organizations.services.k8s.aws/Account`. Applying the rendered
# stage therefore asked the Organizations controller to call `CreateAccount` on its own
# reconciliation schedule — outside the durable operation store, outside the approval-backed
# executor and its lease, and outside `record_intent`. Every duplicate-spend protection
# #5531 builds lives on that path, so the object that actually opened the account bypassed
# all of it:
#
#   * no intent was committed before the provider call, so a controller restart between the
#     call and the status write left no evidence that a call had been made;
#   * the `CreateAccountRequestId` existed only in controller status, so it was not durably
#     tied to the operation that caused the call, and an unresolved outcome had nothing
#     authoritative to reconcile against;
#   * a reconciliation loop is not bound to an authenticated operation envelope at all, so
#     "who approved this account" had no answer; and
#   * the controller's own retry on a lost response is exactly the second `CreateAccount`
#     that opens a second billable account.
#
# So account creation is no longer declarative. It happens in
# `../../account-provisioning/account_provisioning/creation_runner.py`, under one fenced
# durable operation, and this graph's job is now to BIND to the account that path opened:
# `accountId` is a required input with no default, supplied by the caller from the durable
# record. A graph that cannot create an account cannot create a duplicate one, which is a
# structural guarantee rather than a procedural one — nobody can reintroduce the bypass by
# applying this manifest differently.
#
# The consequence for teardown is unchanged and still load-bearing: because no `Account`
# object exists here, deleting this root cannot close the AWS account. `cleanup.py` keeps
# refusing to delete it anyway (see `_ACCOUNT_ROOT_KINDS`) — defence in depth, since this
# graph is the recorded owner of the account even though it is no longer its creator.
#
# ── Why this graph exists separately from the infrastructure graph ───────────────────────
#
# The vendored `03-full-account-infrastructure.yaml` makes the AWS `Account` a CHILD of the
# same graph instance that owns the VPC and the cluster. That single fact is what made the
# legacy teardown unsafe in both directions:
#
#   * deleting the parent to remove the infrastructure also deleted the `Account`, closing
#     the AWS account into an irreversible 90-day suspension (the defect `cleanup.py`
#     documents); and
#   * retaining the parent to protect the account also retains the DECLARATION of the VPC
#     and cluster — so a controller reconciling that declaration rebuilds whatever a
#     teardown just deleted. A cleanup plan that deletes children while keeping their parent
#     cannot converge, and re-creates spend after reporting success.
#
# Those two are not independently fixable while one object owns both concerns: protecting
# the account and removing the infrastructure are the same edit with opposite requirements.
# So ownership is split. This graph owns ONLY the account and the cross-account role
# reference that depends on it. `adp-workspace-infrastructure.yaml` owns the VPC and the
# cluster, as a separate root object with its own lifecycle.
#
# The consequence is the property cleanup needs: infrastructure can be deleted and STAY
# deleted, because nothing retained still declares it, while the account is retained because
# it is a different object that the cleanup plan does not touch at all.
#
# ── Ordering ─────────────────────────────────────────────────────────────────────────────
#
# `iamRoleSelector` used to read `${account.status.accountID}`, which is how kro knew not to
# create it until the account reported an id. With the `Account` gone there is no status to
# wait for: the id is an INPUT, so the ordering moved out of the graph and became a
# precondition on the rendered stage — the account must already exist, and its id must come
# from the durable record of the operation that opened it.
#
# That is a stronger ordering than the reference was, not a weaker one. A reference orders
# two objects within one graph; the precondition orders this graph against a governed,
# audited provider call. `render.py` states it on stage 1 and refuses to render the stage at
# all without an id (see `_new_account_stages`), so "apply it and see" is not available.
#
# Because the infrastructure graph is a separate root, the ordering BETWEEN the two is not
# expressible inside either one. It is therefore explicit in the rendered plan instead:
# `render.py` emits ordered stages, and stage 2 states that stage 1 must report Ready first.
# That is the staged/resumable boundary rather than a hidden assumption.
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: adp-account-ownership
  labels:
    app.kubernetes.io/managed-by: adp-superplane-account-factory
    adp.aws.dev/issue: '5530'
spec:
  schema:
    apiVersion: v1alpha1
    kind: AccountOwnership
    spec:
      # Required inputs carry no `default=`, which is how `dependencies.py` tells a required
      # input from an optional one when it checks that every rendered object satisfies its
      # graph. Nothing here is defaulted to a target: the legacy `config.env` defaulted the
      # account and that is how a run acted on an account nobody chose.
      accountName: string
      # The account this workspace owns, as a 12-digit id (#5531, w6-08).
      #
      # REQUIRED with no `default=`, and it is an INPUT rather than a status field because
      # this graph no longer creates the account — see the header. The id comes from the
      # durable record of the fenced `CreateAccount` that `creation_runner.py` performed, so
      # applying this object binds to an account whose creation is already audited.
      #
      # A default would be the whole defect back in a new form: a defaulted or optional id
      # means an object that reconciles against SOMETHING when the governed path has not run,
      # and `render.py` would have nothing to refuse.
      accountId: string
      region: string
      # Recorded for audit and for the closure record's workspace comparison. Kept even though
      # nothing creates an account from it any more: `cleanup.ProvisionedAccountRecord` matches
      # an account against the workspace and organization it was opened for, and the contact
      # address is part of the approval-bound payload that `creation_runner.payload_digest`
      # fences. Dropping it would make the applied object unable to evidence which approved
      # request the bound account corresponds to.
      accountEmail: string
      # Where in the organization tree the account was placed (#5531, w6-08). REQUIRED,
      # deliberately with no `default=`: omitting a parent does not mean "no placement", it
      # means the organization ROOT — the least restricted position in the organization,
      # outside every service control policy an OU carries. A default here would make the most
      # permissive placement the one nobody had to choose, which is the same class of defect
      # as the legacy `config.env` defaulting its target account.
      #
      # Now a record of where the governed call placed the account rather than an instruction
      # to place it, since placement happens at creation in `creation_runner.py` — an account
      # created at the root and moved afterwards is live outside its guardrails for the
      # duration of the move.
      organizationalUnitId: string
      accountRoleName: string | default="OrganizationAccountAccessRole"
    status:
      # Echoes the bound id so a later stage and a closure record read it from one place
      # regardless of which object holds it. `cleanup.py` requires a recorded account id
      # before it will build a closure request.
      #
      # Sourced from the input now rather than from `${account.status.accountID}`: there is no
      # `Account` resource to report one, which is exactly the property that stops this graph
      # from opening an account of its own.
      accountId: ${schema.spec.accountId}
      # No `accountArn`: it was `${account.status.ackResourceMetadata.arn}`, a field only the
      # ACK resource could populate. Nothing read it, and synthesizing one from the id here
      # would be inventing provenance rather than reporting it.
  resources:
    # No `Account` resource, deliberately, and this absence is the #5531 fix. See the header:
    # a declared `Account` lets the Organizations controller call `CreateAccount` outside the
    # fenced operation, so the graph that owns an account must not be able to create one.
    - id: iamRoleSelector
      template:
        apiVersion: services.k8s.aws/v1alpha1
        kind: IAMRoleSelector
        metadata:
          name: ${schema.spec.accountName}
          # Explicit, unlike the vendored graph's IAMRoleSelector which omitted
          # `metadata.namespace` entirely and would land wherever the applying context
          # pointed.
          namespace: ${schema.metadata.namespace}
          labels:
            app.kubernetes.io/managed-by: adp-superplane-account-factory
            adp.aws.dev/workspace: ${schema.metadata.name}
        spec:
          # An identity reference, not a credential. This is how ACK reaches the target
          # account, and it is why no Secret appears anywhere in a rendered set.
          #
          # Built from `${schema.spec.accountId}` rather than the old
          # `${account.status.accountID}`: with the `Account` resource gone there is no status
          # to read, and a dangling `${account...}` reference would leave kro unable to resolve
          # this object at all — a workspace with no cross-account access path.
          arn: arn:aws:iam::${schema.spec.accountId}:role/${schema.spec.accountRoleName}
          namespaceSelector:
            names:
              - ${schema.metadata.namespace}
