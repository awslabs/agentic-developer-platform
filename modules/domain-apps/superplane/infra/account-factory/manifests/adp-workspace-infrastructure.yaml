# ADP-maintained ResourceGraphDefinition: workspace infrastructure — Issue #5530 (w6-07).
#
# MAINTAINED BY ADP, not vendored. Reviewed in the diff like any other source.
#
# ── What this fixes ──────────────────────────────────────────────────────────────────────
#
# An EKS cluster cannot be created before the network it sits in exists, because the cluster
# needs the subnet ids and the security group id the network produces. The vendored
# `02-eks-cluster-stack.yaml` states that as two REQUIRED inputs with no defaults:
#
#     subnetIds: '[]string'
#     securityGroupIds: '[]string'
#
# and they are consumed directly by the `Cluster` (`resourcesVPCConfig`) and the `Nodegroup`
# (`subnets`) inside it. The vendored orchestrator supplies them from the network's status:
#
#     subnetIds: ${network.status.privateSubnetIds}
#     securityGroupIds:
#       - ${network.status.securityGroupId}
#
# Rendering a `NetworkStack` and an `EKSClusterStack` as two independent top-level objects —
# which is what existing-account-managed did before this graph existed — omits both fields,
# because nothing is positioned to carry one object's output into another's input. The
# resulting plan is not merely incomplete: it would be rejected, or admitted with empty
# network config, leaving a created VPC, subnets, NAT gateway and IAM roles behind with no
# working cluster. The advertised behaviour of existing-account-managed ("adopt this
# account, build a cluster in it") was therefore not implemented.
#
# A dependency between two resources can only be expressed INSIDE a graph, so the fix is a
# graph. This one is the maintained equivalent of the vendored orchestrator with the account
# removed: it wires network → cluster exactly as upstream does, and stops there.
#
# ── Why the account is deliberately not here ──────────────────────────────────────────────
#
# See `adp-account-ownership.yaml`. Keeping the account out of THIS graph is what lets a
# teardown delete the infrastructure and have it stay deleted: after this object is removed
# nothing retained still declares the VPC or the cluster, so there is nothing for a
# controller to reconcile back into existence. That is the convergence property the previous
# cleanup plan could not have, because it deleted children whose parent it kept.
#
# ── Applies to all three modes' infrastructure ───────────────────────────────────────────
#
# `new-account-managed` and `existing-account-managed` both instantiate this; they differ
# only in whether `adp-account-ownership.yaml` is also instantiated (new) or the account is
# adopted and referenced (existing). `bring-existing-cluster` instantiates NEITHER, because
# it creates no AWS infrastructure at all.
apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: adp-workspace-infrastructure
  labels:
    app.kubernetes.io/managed-by: adp-superplane-account-factory
    adp.aws.dev/issue: '5530'
spec:
  schema:
    apiVersion: v1alpha1
    kind: WorkspaceInfrastructure
    spec:
      # No `default=` means required. Every one of these is supplied by a validated request;
      # `modes.py` already refuses a request that creates a cluster without vpcCidr,
      # availabilityZones and clusterVersion, so the graph's requirement and the request
      # validation agree rather than each assuming the other checked.
      workspaceName: string
      region: string
      vpcCidr: string
      availabilityZones: '[]string'
      clusterVersion: string
      nodeInstanceType: string
      nodeGroupDesiredSize: integer | default=1
      nodeGroupMinSize: integer | default=0
      nodeGroupMaxSize: integer | default=2
    status:
      vpcId: ${network.status.vpcId}
      clusterEndpoint: ${eksCluster.status.clusterEndpoint}
      clusterArn: ${eksCluster.status.clusterArn}
  resources:
    - id: network
      template:
        apiVersion: kro.run/v1alpha1
        kind: NetworkStack
        metadata:
          name: ${schema.spec.workspaceName}
          namespace: ${schema.metadata.namespace}
          labels:
            app.kubernetes.io/managed-by: adp-superplane-account-factory
            adp.aws.dev/workspace: ${schema.metadata.name}
        spec:
          vpcName: ${schema.spec.workspaceName}
          cidrBlock: ${schema.spec.vpcCidr}
          region: ${schema.spec.region}
          availabilityZones: ${schema.spec.availabilityZones}

    - id: eksCluster
      template:
        apiVersion: kro.run/v1alpha1
        kind: EKSClusterStack
        metadata:
          name: ${schema.spec.workspaceName}
          namespace: ${schema.metadata.namespace}
          labels:
            app.kubernetes.io/managed-by: adp-superplane-account-factory
            adp.aws.dev/workspace: ${schema.metadata.name}
        spec:
          clusterName: ${schema.spec.workspaceName}
          region: ${schema.spec.region}
          version: ${schema.spec.clusterVersion}
          # The two fields whose absence was AF-001. Referencing `network.status` is also
          # what orders the two: kro cannot create the cluster until the network reports
          # these values, so "network first" is a consequence of the data dependency rather
          # than an ordering someone has to remember.
          subnetIds: ${network.status.privateSubnetIds}
          securityGroupIds:
            - ${network.status.securityGroupId}
          nodeGroupDesiredSize: ${schema.spec.nodeGroupDesiredSize}
          nodeGroupMinSize: ${schema.spec.nodeGroupMinSize}
          nodeGroupMaxSize: ${schema.spec.nodeGroupMaxSize}
          nodeInstanceType: ${schema.spec.nodeInstanceType}
