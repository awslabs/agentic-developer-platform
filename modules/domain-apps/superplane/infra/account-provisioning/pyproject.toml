[project]
name = "account-provisioning"
version = "0.1.0"
description = "Governed AWS account creation and child-account bootstrap (#5531, w6-08)"
requires-python = ">=3.11"
# No runtime dependencies, deliberately, and for two separate reasons.
#
# No AWS SDK: every AWS client arrives through `ports.py`, so this package cannot
# construct one and is therefore not a place a credential can end up. The composer
# supplies boto3 clients it built.
#
# No `harness-jobs`: the durable executor is consumed STRUCTURALLY through
# `execution.DurableExecutor`, because two tests assert that package is not importable
# from this tree (`src/superplane-api/tests/test_workspaces.py:908` and
# `tests/test_provisioning_adapter.py:828`) -- composing it is #5535's (w6-12) decision,
# not this story's. Declaring it here would defeat both.
#
# `account_factory` is a sibling directory rather than a distribution, so it is put on
# `sys.path` by `account_provisioning_tests/__init__.py` exactly as that module's own suite does.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    # Needed only to read the fixture requests, which are YAML like account-factory's.
    "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["account_provisioning", "account_provisioning.*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["account_provisioning_tests"]

# ADP's ruleset, stated here rather than inherited, for the reason
# `modules/harness/jobs/pyproject.toml` gives: there is no repository-root ruff config,
# so a bare `ruff check` on this directory would silently use ruff's DEFAULT rules --
# a different set from the one ADP's modules select -- and "lint passes" would mean
# something different locally than in CI. Pinning it makes the two the same run.
[tool.ruff]
# 150, matching `modules/gateway/pyproject.toml` -- which is what "ADP conventions" means
# in this repo, and which `modules/domain-apps/superplane/.ruff.toml` cites as the
# ruleset the domain tree is judged by.
#
# NOT 88 (the value `harness-jobs` and `superplane-contracts` use). Those are separate
# distributions linted from their own directories; this package is inside
# `modules/domain-apps/superplane/`, and `superplane-domain-ci.yml:141` lints it as
# `ruff check modules/domain-apps/superplane/` FROM THE REPOSITORY ROOT. A stricter
# width here would be a width CI never applies, so the local run and the gating run
# would disagree about whether this code passes -- the exact confusion the
# harness-jobs comment sets out to avoid, arrived at from the other direction.
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

# Mirrors `harness-jobs`' two exemptions, and for the same reason: this package's
# spelling is fixed by contracts it consumes rather than chosen here.
ignore = [
    # N818 wants an `Error` suffix on every exception. These names mirror
    # `account_factory`'s (`ModeError`, `BootstrapError`, `AccountCreationError`) and the
    # domain contract's (`ProvisioningRefused`), which do not all carry it. Renaming
    # would make two halves of one contract spell the same concept differently.
    "N818",
    # UP042 suggests `enum.StrEnum` over `(str, Enum)`. `CallOutcome` here must stay
    # byte-identical to `harness_jobs.execution.CallOutcome`, which is `(str, Enum)` and
    # whose values are written to a database column. StrEnum changes `str()` and
    # formatting behaviour -- a silent difference in exactly the values that cross the
    # boundary.
    "UP042",
]

# The Organizations and IAM port methods use botocore's PascalCase keyword names
# (`RoleName`, `CreateAccountRequestId`) so that a real boto3 client satisfies the
# Protocol with no adapter layer. Renaming them to snake_case would require a
# translation shim whose only purpose is to satisfy a linter.
[tool.ruff.lint.per-file-ignores]
"account_provisioning/ports.py" = ["N803"]
"account_provisioning/creation_runner.py" = ["N803"]
"account_provisioning/bootstrap_runner.py" = ["N803"]
"account_provisioning_tests/*.py" = ["N803"]

[tool.ruff.lint.isort]
# Both are local source in this tree, not third-party dependencies. Without this, isort
# groups them with `pytest` and the resulting "fix" contradicts every other module.
known-first-party = ["account_provisioning", "account_factory"]
