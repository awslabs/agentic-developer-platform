version: 0.2
phases:
  build:
    commands:
      - >-
        python3 -B modules/domain-apps/superplane/images/native-node/producer.py
        --source-attestation "$NATIVE_SOURCE_ATTESTATION"
        --plan "$NATIVE_IMAGE_PLAN"
        --inputs "$NATIVE_UPSTREAM_INPUTS"
        --packer "$NATIVE_PACKER_BINARY"
        --amazon-plugin "$NATIVE_AMAZON_PLUGIN_BINARY"
        --output "$NATIVE_IMAGE_OUTPUT"
