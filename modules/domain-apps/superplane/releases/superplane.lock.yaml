# unresolved builds remain in pending_images with no fabricated digest.
# S21 promotion records scoped build evidence, not live deployment or whole-image cleanliness.

schema_version: 1

# ── Historical origin (provenance, NOT a build input) ────────────────────────────────
#
# U22 (#5326) transferred the three components into ADP ownership, so this block changed
# meaning: it is now the HISTORICAL ORIGIN of the transferred files, recorded separately
# from the ADP commit that maintains them (see `maintained_source` below). The issue
# requires those two facts be kept apart — conflating them is how a reader loses the
# ability to say whether a file has been changed since the transfer.
#
# The revision below remains the exact revision the maintained tree was adopted at. All
# 161 transferred files were byte-identical at adoption, verified by Git blob id. The
# maintained tree's intentional test-only divergences are recorded in
# ../src/TRANSFER-MANIFEST.md. This revision still matches
# spike/provenance.py:UPSTREAM_REVISION, which U12's parity fixtures cite, and
# tests/test_lock.py asserts the two have not drifted.
#
# Upstream is now a historical origin only. Future maintained changes land in ADP.
upstream:
  repository: https://github.com/aws-innovate/AISuperPlane
  revision: 5d543c952493f0765133b92e93301b0b24d028ee
  role: historical origin of the transferred components; not a build input and not a
    maintenance target after U22

# ── Maintained source (what builds actually read) ────────────────────────────────────
#
# The answer to "where does the code being built live" after U22. Build lanes read these
# in-repository paths, which is why `source_access` below is resolved: no upstream access,
# no PAT and no reference tree is involved in building any of the three components.
maintained_source:
  repository: this repository (aws-e/adp)
  root: modules/domain-apps/superplane/src
  transferred_by:
    issue: 5326
    unit: U22
  # The ADP commit the files were adopted FROM (the pinned reference the issue names).
  # Recorded separately from `upstream.revision` on purpose: this is an ADP fact, that is
  # an upstream fact, and a single "revision" field could only carry one of them.
  adopted_from_adp_commit: 8f01c1edfc6052671e214bc944cedaab51cc939b
  components:
    superplane-api: src/superplane-api
    superplane-controller: src/superplane-controller
    superplane-platform-monitor: src/superplane-platform-monitor
    superplane-executor: executor
    superplane-paid-worker: executor

# ── How the pinned source is obtained ────────────────────────────────────────────────
#
# RESOLVED BY U22 (#5326) via the third candidate mechanism that was recorded here while
# this was unresolved: "a transferred source location inside ADP's control". The grant
# question that blocked these lanes — read access to a repository ADP does not own — no
# longer applies to these three components, because ADP now maintains their source.
#
# This is a source-location fact, not an authorization claim. It does NOT assert the
# components are deployable, that their inherited defects are repaired, or that any
# credential was granted: U13 still owns migration repair, U14 auth enforcement, and U23
# the deployable full release.
source_access:
  status: resolved
  mechanism: a transferred source location inside ADP's control
  resolved_by:
    issue: 5326
    unit: U22
  # Kept after resolution: these remain the wrong ways to obtain this source, and
  # tests/test_build_source_is_declared.py still enforces that no lane uses either.
  ruled_out:
    - why: the hosted agent token is scoped to this repository, so a checkout of the
        upstream repository fails for everyone rather than only in CI — and after U22
        there is no reason to reach upstream for these components at all
      mechanism: actions/checkout of aws-innovate/AISuperPlane
    - why: it is read-only evidence at the revision above, verified inert; building from
        it would ship evidence as a product, and it must not become a second writable
        runtime tree alongside the maintained one
      mechanism: the reference snapshot on the planning branch

