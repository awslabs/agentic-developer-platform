# ── SkyPilot configuration inputs ────────────────────────────────────────────────────
#
# Pinned alongside the image because a reproducible runtime with a floating configuration
# is not reproducible. U2 owns these release inputs; U3 owns deployment
# (docs/design-notes/4910-skypilot-eks-migration-amendment.md).
#
# Values that would name an environment are deliberately absent: the approved plan records
# no AWS account and no adp-cred label, and upstream's infra/skypilot-api/config.env
# carries UPSTREAM's account id (605440105851), which is not ADP's target and must not be
# adopted as one by being copied into a lock file.
skypilot_config:
  # From infra/skypilot-api/sky-config.yaml at the pinned revision.
  allowed_clouds:
    - aws
    - lambda
    - nebius
    - kubernetes
  namespace: skypilot
  # Postgres-backed, not the SQLite variant: SQLite loses SkyPilot's cluster/job state on
  # pod replacement, and U19's handover work needs that state to survive a restart.
  state_backend: postgres
  api_manifest: infra/skypilot-api/03-skypilot-api-postgres.yaml
  deployment_target:
    status: unresolved
    needs:
      - AWS account id and region
      - adp-cred label
    note: >-
      Required by emission lint Rule 2 and not invented here. Upstream's config.env account
      id is upstream's, not ADP's.

# ── Schema compatibility ─────────────────────────────────────────────────────────────
#
# Recorded as OBSERVED, not asserted as a version.
#
# CHAIN REPAIRED BY U13 (#5045). `single_head` is now true. What the chain looked like
# before, kept because it is the defect this field exists to track: revision id `006` was
# declared by three files and `007` by three more, and three files declared a parent of
# `"005"` — an id no file declares (the real one is `005_add_research_proposals`).
#
# The earlier note here, and the issue, both described that as "two heads with no merge".
# It was worse. Alembic's own `ScriptDirectory` raised `KeyError: '005'` building its
# revision map, so the chain could not be LOADED — no alembic command worked against it,
# not `upgrade`, not `heads`, not `current`. That distinction is why the repair relinked
# the six conflicting files onto unique ids and explicit parents instead of adding a merge
# revision: a merge point resolves two VALID heads, and this graph failed before a merge
# could be consulted.
#
# Revisions 001-005 were left byte-identical. They are the only revisions that could
# plausibly have been applied anywhere, and rewriting an applied migration invalidates a
# deployed database's recorded history. Every id that changed belonged to a file that was
# unreachable by construction, so no recorded history can reference it.
#
# Two tables the models declare (`api_keys`, `budget_alerts`) were created by no migration
# at all; 008 and 009 add them. U14's 010 then adds the server-held workspace grant table,
# and U15's 011 adds observation receipts and leases. The chain now renders 20 CREATE
# TABLEs for the 20 tables `Base.metadata` declares.
#
# WHY `status` IS STILL `unverified`, AND WHY THAT IS NOT A LEFTOVER
#
# `status: verified` in this file means verified AGAINST A REAL DATABASE. That has not
# happened and cannot happen from CI: `superplane-domain-ci.yml` is a deliberately
# credential-free offline lane with no PostgreSQL service, and the issue's own live smoke
# check (`alembic upgrade head` against an ephemeral empty database) plus R4 acceptance 3
# (the data-preserving upgrade) are recorded as DEFERRED behind an account, authorized
# database access and a backup target that remain unresolved.
#
# What has been established offline, by `src/superplane-api/tests/test_migrations.py`:
# exactly one head and one base, every revision on the path to head, no duplicate ids, no
# dangling parent, model/migration table parity, 001-005 pinned by content hash, and the
# whole chain rendering as PostgreSQL DDL through Alembic's offline (`--sql`) mode. That
# last one COMPILES every migration for the real dialect; it never opens a connection, so
# it does not observe anything that depends on existing rows.
#
# So `check_migration_contract.py` still refuses — now on the unverified status and the
# missing runner-image digest rather than on the chain — and that is the intended state.
# Flipping `status` here would assert exactly the claim the deferred acceptance exists to
# gate. Whoever runs that live verification owns this field.
schema:
  migration_tool: alembic
  config: src/superplane-api/alembic.ini
  status: unverified
  single_head: true
  observed:
    # U13 repaired the transferred chain and added two missing-table revisions;
    # U14 added 010 for workspace grants; U15 added 011 for observation receipts
    # and leases. U13b (#5046) adds 012, which replaces the copied secret ARN in
    # credential_registry/cloud_accounts with an opaque ADP credential reference.
    # All additions extend the same linear head.
    #
    # U13b authored its revision as `011` on 010 before U15 merged its own `011` onto
    # that same parent. Both files coexisting is not a Git conflict, but it leaves the
    # chain two-headed, and `alembic upgrade head` then applies NOTHING rather than
    # choosing. U13b was renumbered to 012 onto U15's revision instead. Free to do:
    # `status` below is still `unverified`, so no database has this chain applied.
    #
    # U11c (#5054) adds 013 for `provider_operations`: the durable record of a provider
    # operation's idempotency identity, written before the provider call it identifies.
    # It adds four tables for operations, allocation serialization, reference conflicts
    # and allocation resource inventory, extending 012. U7b (#5053) adds 014 for
    # provider connections and workspace bindings, extending 013 on the same head.
    # U23 adds an explicit nullable ADP binding for fresh installations only.
    #
    # w6-10 (#5533) adds 017 for `workspace_bootstrap_reservations`: the durable claim
    # `workspace_bootstrap`'s registration store takes before it mutates a BYOC cluster,
    # extending 016 on the same linear head. It creates one table and no foreign key, and
    # observes nothing that depends on existing rows. `status` below stays `unverified`:
    # the revision has been applied only to databases the tests create and drop, never to
    # a live system, so it changes what the chain IS without changing what has been
    # verified about it.
    # CLI-24 adds three credential/operation revisions on the 016 branch. The
    # explicit 020 merge joins both histories without rewriting either parent.
    # 021 then adds durable deployment target and provider UID provenance.
    #
    # #5925 (AWS milestone, story 1/6) adds 034 for `controller_provider_requests.region`:
    # which approved region a multi-region launch actually used, filled in once known so a
    # later recovery run does not have to re-derive it by re-checking every approved
    # region. Extends 033 on the same linear head; adds one nullable column, no new table.
    # #5926 adds durable network resources, effects, memberships and completion evidence.
    # #6127 scopes domain user subject uniqueness to each organization.
    # #6048 adds explicit cluster sharing eligibility and per-workspace memberships.
    # Explicit cluster scope children preserve maintained organization grant authority.
    # #5927 adds the original-instance native command journal.
    # #5928 records cleanup ownership and exact pre-POST workload specifications.
    version_files: 55
    # declared `revision =` id: number of files declaring it. NOT a filename-prefix count.
    # Empty since the repair; kept as a key so the contract test that derives this from the
    # tree keeps asserting it stays empty rather than skipping a missing field.
    duplicate_revision_ids: {}
    head: 041_controller_workload_submissions
    base: 001_initial
  compatible_with: null
  blocked_by:
    issue: 5045
    unit: U13
    why: >-
      the chain is single-headed as of #5045, but no schema compatibility claim is made
      here until `alembic upgrade head` has run against a real database — the live smoke
      check and R4 acceptance 3 that would establish it are deferred behind an unresolved
      account, database access and backup target.
      Head 012 (#5046, U13b) adds a second, independent live gate on top of that one: it
      refuses to run against a database whose credential rows still hold secret ARNs,
      because an ADP credential ID cannot be derived from one. Remapping those rows onto
      credentials verified as ADP-owned and ADP-readable is the audited vault-owned
      migration (R7 acceptances 6-7, owned by U7), which has not run. So a deployed
      database with existing credential rows will be REFUSED by `alembic upgrade head`
      until that audited migration completes — by design, leaving the database unchanged.
