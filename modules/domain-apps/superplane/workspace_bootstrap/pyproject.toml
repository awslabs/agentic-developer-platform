[project]
name = "superplane-bootstrap"
version = "0.1.0"
description = "Operation-scoped Superplane workspace bootstrap and readiness"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["superplane_bootstrap", "superplane_bootstrap.*"]

[tool.setuptools.package-data]
superplane_bootstrap = ["_data/outputs.tf"]
