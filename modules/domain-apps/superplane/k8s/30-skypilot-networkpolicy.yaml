---
# =============================================================================
# Network boundary for the SkyPilot API server — Issue #5042 (U3), EPIC #4910.
# =============================================================================
# READ THIS BEFORE TREATING THESE OBJECTS AS ISOLATION.
#
# A NetworkPolicy is a DECLARATION. Something must read it, work out which pods it selects,
# and program the dataplane. On EKS that is the VPC CNI's network-policy controller, and
# **EKS Auto Mode ships it disabled** — so on a cluster without it these objects are accepted
# by the API server, appear in `kubectl get networkpolicy`, and enforce nothing. The failure is
# silent in both directions: an unenforced policy never errors.
#
# Enabling the controller is a PLATFORM-OWNED prerequisite, **#4999**, which is still open. It
# is not this lane's to enable — `platform-infra-apply.yml` is manual-dispatch-only and
# enabling it makes every existing policy in the cluster take effect simultaneously, which is
# why `docs/runbooks/network-policy-enforcement.md` is an ordered procedure rather than a flag.
#
# Therefore: rendering these objects, and `kubectl apply` reporting success, are NOT evidence
# of network isolation. `check_rendered_manifests.py` checks their PRESENCE and says so in its
# own output. The evidence that would establish enforcement is:
#
#     kubectl get policyendpoints -A     # empty  -> NOT enforced
#
# plus the positive/negative probes in Section 5 of that runbook. Both belong to the gated live
# acceptance, which this story is not authorized to run.
#
# The objects are declared now anyway, because they must exist and be correct BEFORE
# enforcement is switched on. The runbook's Section 2 lesson is precisely that: enabling
# enforcement with a deny policy in place and no matching allow cut all agent telemetry, with
# no pod restart and no error. Shipping the allow alongside the deny is what avoids repeating
# that.
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: REPLACE_WITH_SKYPILOT_NAMESPACE
  labels:
    app.kubernetes.io/part-of: adp-superplane
spec:
  # Every pod in the namespace, both directions. The allow policies below are additive.
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: skypilot-api-ingress
  namespace: REPLACE_WITH_SKYPILOT_NAMESPACE
  labels:
    app.kubernetes.io/name: skypilot-api
    app.kubernetes.io/part-of: adp-superplane
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: skypilot-api
  policyTypes:
    - Ingress
  ingress:
    # Only the Superplane control-plane namespace may call the API server. The controller
    # reaches it at skypilot-api.<ns>.svc.cluster.local:46580 (spike/baseline_inventory.py,
    # SKYPILOT_DEFAULT_BASE_URL, derived from the upstream controller's skypilot/client.go).
    #
    # A namespaceSelector by LABEL, not by name: `namespaceSelector` cannot match on
    # `metadata.name` portably, and the label is applied by 00-namespace.yaml. The consequence
    # to be aware of is that any namespace carrying this label can reach the API server, which
    # is why the label is domain-specific rather than something generic like `tier: app`.
    - from:
        - namespaceSelector:
            matchLabels:
              adp.aws-e.io/domain-app: superplane
      ports:
        - protocol: TCP
          port: 46580
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: skypilot-api-egress
  namespace: REPLACE_WITH_SKYPILOT_NAMESPACE
  labels:
    app.kubernetes.io/name: skypilot-api
    app.kubernetes.io/part-of: adp-superplane
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: skypilot-api
  policyTypes:
    - Egress
  egress:
    # DNS. First, and both protocols: without it every other rule below is unreachable
    # because the hostname never resolves, and blocked DNS presents as a generic timeout
    # rather than as a policy error. This is the mistake the ADOT collector incident in
    # #4999's runbook was made of.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # HTTPS to AWS regional endpoints: STS (to exchange the IRSA token), Secrets Manager,
    # and the cloud APIs SkyPilot provisions through. Not narrowable to CIDRs here —
    # regional AWS endpoint addresses are not stable, and pinning a stale CIDR fails closed
    # in a way that looks like an application bug.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              # The link-local range carrying the EC2 IMDS. A pod with an IRSA identity has
              # no reason to reach the node's instance metadata, and reaching it is the
              # standard route to the NODE's role — which is broader than this domain's.
              - 169.254.0.0/16
      ports:
        - protocol: TCP
          port: 443
    # The Postgres state backend. U2 pinned `state_backend: postgres` so cluster and job
    # state survives pod replacement.
    #
    # DECISION 2 (database hosting) IS UNRESOLVED, so this rule cannot name a destination
    # more precisely than the port: whether the instance is shared or separate is exactly
    # what is undecided, and this manifest set must not decide it by writing a CIDR. No
    # isolation, backup, retention or restore property is claimed about whatever the
    # connection secret points at.
    - ports:
        - protocol: TCP
          port: 5432
