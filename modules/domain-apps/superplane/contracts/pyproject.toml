[project]
name = "superplane-contracts"
version = "0.1.0"
requires-python = ">=3.11"
# Standard library only, deliberately. The receiver (superplane-api) and the
# tests that gate it have very different dependency sets, and a contract package
# that dragged in either one could not be consumed by the other.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Explicit, because hatchling would otherwise guess `superplane_contracts` from
# the distribution name `superplane-contracts` and happen to be right — the same
# implicit guess that produced an empty wheel for `adp-common` when the two names
# diverged. Stated so a rename cannot silently ship nothing.
packages = ["superplane_contracts"]
