---
apiVersion: v1
kind: Namespace
metadata:
  name: superplane-system

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: superplane-platform-monitor-config
  namespace: superplane-system
data:
  POLL_INTERVAL: "30s"
  HEARTBEAT_DEGRADED_THRESHOLD: "5m"
  HEARTBEAT_UNREACHABLE_THRESHOLD: "30m"
  COST_ANOMALY_MULTIPLIER: "2.0"
  LOCK_TTL: "2m"
  LOG_LEVEL: "info"
  METRICS_ADDR: ":9090"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: superplane-platform-monitor
  namespace: superplane-system
  labels:
    app: superplane-platform-monitor
    component: control-plane
spec:
  replicas: 2  # HA: two replicas with distributed locking
  selector:
    matchLabels:
      app: superplane-platform-monitor
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: superplane-platform-monitor
        component: control-plane
    spec:
      serviceAccountName: superplane-platform-monitor
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: platform-monitor
          image: superplane-platform-monitor:latest
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: superplane-platform-monitor-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: superplane-db-credentials
                  key: url
            - name: MONITOR_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: superplane-platform-monitor
  namespace: superplane-system
  annotations:
    # For IRSA (IAM Roles for Service Accounts) to access Aurora via IAM auth
    eks.amazonaws.com/role-arn: "arn:aws:iam::role/superplane-platform-monitor"

---
apiVersion: v1
kind: Service
metadata:
  name: superplane-platform-monitor
  namespace: superplane-system
  labels:
    app: superplane-platform-monitor
spec:
  selector:
    app: superplane-platform-monitor
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
