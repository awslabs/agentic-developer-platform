# ============================================================================
# Example NodePool CR for Testing
# ============================================================================
# This NodePool configures auto-provisioning of GPU nodes across multiple
# clouds with cost controls and consolidation policies.
# ============================================================================
apiVersion: superplane.ai/v1
kind: NodePool
metadata:
  name: gpu-pool-default
spec:
  # Clouds in priority order - cheapest first
  clouds:
    - lambda
    - nebius
    - aws

  # Allowed GPU types
  gpuTypes:
    - H100
    - A100

  # Maximum number of nodes in this pool
  maxNodes: 10

  # Cost cap: $50/hr across all nodes in this pool
  maxCostPerHour: 50.0

  # Prefer spot instances when available
  preferSpot: true

  # Remove empty nodes after 5 minutes (300 seconds)
  ttlSecondsAfterEmpty: 300

  # Maximum concurrent provisioning operations
  maxConcurrentProvisioning: 3

  # Consolidation settings
  consolidation:
    enabled: true
    policy: WhenUnderutilized

  # Node template defaults
  template:
    diskSizeGB: 256
    k8sVersion: "1.33"
    wireguard: true

  # Disruption budget
  disruption:
    maxUnavailable: 1
---
# ============================================================================
# Example: Single-cloud, on-demand-only pool
# ============================================================================
apiVersion: superplane.ai/v1
kind: NodePool
metadata:
  name: gpu-pool-aws-ondemand
spec:
  clouds:
    - aws
  gpuTypes:
    - H100
  maxNodes: 5
  maxCostPerHour: 100.0
  preferSpot: false
  ttlSecondsAfterEmpty: 600
  maxConcurrentProvisioning: 2
  consolidation:
    enabled: false
    policy: Never
  template:
    diskSizeGB: 512
    k8sVersion: "1.33"
    wireguard: true
  disruption:
    maxUnavailable: 0
