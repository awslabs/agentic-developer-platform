[project]
name = "superplane-api"
version = "0.1.0"
description = "Superplane control plane API server"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.3.0",
    # Issue #5601 (S02). PyJWT, NOT python-jose. `python-jose` declares `ecdsa` as an
    # UNCONDITIONAL requirement — `Requires-Dist: ecdsa!=0.15`, outside every extra —
    # so `[cryptography]` adds the modern backend without removing `ecdsa`. That
    # resolved to ecdsa 0.19.2 here, carrying GHSA-wj6h-64fc-37mp (a P-256 timing
    # attack) with NO fixed version published: there is no upgrade to take, so the
    # package can only be removed.
    #
    # The vulnerable code was not reachable before this change, and that is recorded
    # so the severity is not overstated: with the `cryptography` extra, jose routes
    # every algorithm — ES256 included — to `CryptographyECKey`, and `ecdsa` is never
    # imported into the process. This service additionally pins HS256/RS256 and
    # rejects any other `alg`, so no caller could steer it onto a curve path. It was
    # an unfixable package in the tree, not a live exploit.
    #
    # `PyJWT[crypto]` installs `cryptography` and NOTHING else transitively — no
    # ecdsa, no rsa, no pyasn1 — and it is already this repository's JWT library
    # (modules/gateway/pyproject.toml, modules/gateway/lambda/api-authorizer). The
    # supported range starts at the gateway's tested version and excludes a new
    # major JWT API. `tests/test_jwt_dependency.py` asserts no
    # jose-shaped requirement returns here, so a future edit reintroducing `ecdsa`
    # fails a test rather than shipping.
    "PyJWT[crypto]>=2.13.0,<3",
    "passlib[bcrypt]>=1.7.4",
    "boto3>=1.34.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "kubernetes>=29.0.0",
    # Issue #6116 (security residual). Replace stdlib xml.etree.ElementTree with
    # defusedxml in scanner feed parsers to reject XXE, entity expansion, and DTD
    # attacks. Pure-Python, zero transitive dependencies. Image rebuild coordinated
    # via #6124 image owner.
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# Issue #5055 (U14). `app/auth.py` imports `superplane_auth.policy` — the domain
# authorization policy owned by this module at `modules/domain-apps/superplane/auth`
# (issue #5044, U9). It is imported rather than copied so the token and
# authorization rules have ONE definition; a copy is how the two drift and how a
# tightened rule silently fails to reach the service enforcing it.
#
# It is deliberately NOT listed in `[project.dependencies]` above. That list is
# resolved from a package index, and this package is not published to one — a
# named requirement there would make `pip install .` fail looking for it.
# Instead it is installed from its in-repository path:
#
#     pip install -e ../../auth          # CI and local development
#     scripts/stage-domain-auth.sh       # before `docker build` (see the script)
#
# The image needs the staging step because `releases/build-image.sh` pins the
# Docker build context to this directory, and the policy package lives above it.
# Nothing has shipped in the gap: `pending_images` in the release lock records
# that no API image has been built yet.

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
