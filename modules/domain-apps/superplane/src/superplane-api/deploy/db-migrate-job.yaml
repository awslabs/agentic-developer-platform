# One-shot Job to run Alembic migrations against the integration-test DB
apiVersion: batch/v1
kind: Job
metadata:
  name: superplane-db-migrate
  namespace: superplane
  labels:
    app.kubernetes.io/name: superplane-api
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-db
          image: public.ecr.aws/docker/library/postgres:16-alpine
          securityContext:
            allowPrivilegeEscalation: false
          command: ['sh', '-c', 'until pg_isready -h postgres.superplane.svc.cluster.local -p 5432 -U superplane; do echo "Waiting for postgres..."; sleep 2; done']
      containers:
        - name: migrate
          image: 605440105851.dkr.ecr.us-east-1.amazonaws.com/superplane/api:latest
          securityContext:
            allowPrivilegeEscalation: false
          command: ['python', '-m', 'alembic', 'upgrade', 'head']
          env:
            # Resolved at runtime from a Secret, never written here (issue #5683, A04).
            # This field previously held a connection URI with the username and
            # password inline. Because this file is applied, that value would come to
            # exist in a cluster, in shell history and in CI logs, and rotating it
            # would mean rotating every one of those copies.
            #
            # `optional: false` is deliberate: without the Secret the Job must fail to
            # start rather than run with DATABASE_URL unset and produce a confusing
            # connection error. See docs/runbooks/superplane-jwt-and-db-credential-rotation.md
            # for how the Secret is created.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: superplane-api-db
                  key: DATABASE_URL
                  optional: false
            # Verified database transport for the migration path too (issue
            # #5676, A22). The migration job is not a lesser surface than the
            # service: it authenticates with a role that can alter every table
            # in the domain schema, so an unverified connection here hands that
            # role's credential to whatever answered.
            #
            # This job and db-seed-job.yaml are applied separately from the
            # Deployment, which makes them the most likely place a missing
            # secret reference surfaces first. Apply them in a non-production
            # environment before production.
            - name: SUPERPLANE_DATABASE_CA
              valueFrom:
                secretKeyRef:
                  name: superplane-api-db
                  key: ca-pem
                  optional: false
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
