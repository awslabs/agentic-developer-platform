# ============================================================================
# Superplane API Server — Integration Test Deployment
# Deploys API server + PostgreSQL for end-to-end testing
#
# THROWAWAY LOCAL FIXTURE — NOT A DEPLOYMENT. DO NOT APPLY TO A SHARED CLUSTER.
# Apply only with `bash apply-integration-test-fixture.sh`; it refuses non-local
# cluster contexts and API servers.
#
# Issue #5683 (A04). Everything here is disposable by construction: the database
# is an in-cluster Postgres on an `emptyDir` (its data is destroyed with the
# pod), its signing key is generated at apply time, and its static database fixture
# credential is confined by a dedicated namespace and PostgreSQL NetworkPolicy.
#
# The values below are NOT secrets and are not treated as such — they are
# fixtures for a database that exists only for the duration of a test run and
# holds only the synthetic rows in the seed Job below.
# They are named to make that unmistakable, because the hazard this file used to
# carry was not the weak password itself but that it was indistinguishable from
# a real deployment manifest: it previously shipped a plaintext
# `JWT_SECRET_KEY` in a `kind: Secret` and a database URI with inline
# credentials, in the same shape a production manifest would use.
#
# The signing key is generated inside the disposable namespace by the Job below,
# so no key material is committed. Deleting the fixture namespace also deletes
# its key; a real deployment instead injects a managed reference from its secret
# store — see `installation/manifests.py`.
# ============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: superplane-integration-test
  labels:
    app.kubernetes.io/part-of: superplane-integration-test
    superplane.aws/test-fixture: "true"
---
# PostgreSQL for integration testing (in-cluster, NOT production Aurora)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: superplane-integration-test-postgres
  namespace: superplane-integration-test
  labels:
    app.kubernetes.io/name: superplane-integration-test-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: superplane-integration-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: superplane-integration-test-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: superplane-integration-test-postgres
    spec:
      containers:
        - name: superplane-integration-test-postgres
          image: public.ecr.aws/docker/library/postgres:16-alpine
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: POSTGRES_USER
              value: superplane
            - name: POSTGRES_PASSWORD
              value: superplane
            - name: POSTGRES_DB
              value: superplane
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "superplane"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: superplane-integration-test-postgres
  namespace: superplane-integration-test
spec:
  selector:
    app.kubernetes.io/name: superplane-integration-test-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: superplane-integration-test-postgres
  namespace: superplane-integration-test
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: superplane-integration-test-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: superplane-integration-test
      ports:
        - protocol: TCP
          port: 5432
---
# API Server ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: superplane-integration-test-api-config
  namespace: superplane-integration-test
data:
  APP_NAME: "superplane-api"
  APP_VERSION: "0.1.0"
  DEBUG: "true"
  AWS_REGION: "us-east-1"
  AWS_ACCOUNT_ID: "605440105851"
  # CORS (issue #5682, A02). Was '["*"]' with a warning that production must
  # differ. Removed rather than re-warned: the wildcard is now refused at
  # startup, so this value would fail the integration run it was meant to
  # enable. Nothing here needs it — these tests call the API in-cluster over
  # the service DNS name, not from a browser, and CORS only governs
  # browser-enforced cross-origin requests.
  CORS_ORIGINS: '[]'
  JWT_ALGORITHM: "HS256"
  JWT_EXPIRE_MINUTES: "60"
  RATE_LIMIT_PER_MINUTE: "60"
---
# API Server Secret — GENERATED AT APPLY TIME, NOT COMMITTED.
#
# Issue #5683 (A04). This used to be a `stringData` block holding a plaintext
# signing key. Two problems, only one of which was the weak value: a committed key
# is identical in every checkout and every environment that ever applied this file,
# and a `kind: Secret` full of literals is the exact shape a reader would copy for a
# real deployment.
#
# The empty Secret is applied before either workload. The Job below patches it with
# a freshly generated signing key, so no key material exists in Git. The API names
# both required keys explicitly, so Kubernetes keeps its containers in
# CreateContainerConfigError until this Job has populated them.
# The database URL points at the throwaway in-cluster Postgres above, whose
# credentials are the non-secret fixtures declared in this file.
#
# RBAC is namespace-scoped and limited to getting and patching this existing Secret
# by name. Kubernetes cannot constrain `create` with resourceNames because a create
# authorization request targets the collection and has no resource name, so this
# fixture deliberately has no permission to create or read any other Secret.
apiVersion: v1
kind: Secret
metadata:
  name: superplane-integration-test-api-secrets
  namespace: superplane-integration-test
type: Opaque
data: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: superplane-integration-test-secret-init
  namespace: superplane-integration-test
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: superplane-integration-test-secret-init
  namespace: superplane-integration-test
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "patch"]
    resourceNames: ["superplane-integration-test-api-secrets"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: superplane-integration-test-secret-init
  namespace: superplane-integration-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: superplane-integration-test-secret-init
subjects:
  - kind: ServiceAccount
    name: superplane-integration-test-secret-init
    namespace: superplane-integration-test
---
apiVersion: batch/v1
kind: Job
metadata:
  name: superplane-integration-test-secret-init
  namespace: superplane-integration-test
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: superplane-integration-test-secret-init
      containers:
        - name: generate
          image: public.ecr.aws/bitnami/kubectl:latest
          securityContext:
            allowPrivilegeEscalation: false
          command:
            - sh
            - -c
            - |
              set -eu
              # 32 bytes of kernel randomness, hex-encoded. The completed Job is
              # retained so reapplying this fixture does not rotate the key beneath
              # existing pods; deleting the namespace starts a fresh fixture.
              KEY=$(od -An -tx1 -N32 /dev/urandom | tr -d ' \n')
              # The client-only create renders the data payload; the server request
              # is a patch against the precreated named Secret. The Role cannot
              # create a Secret.
              #
              # The generated key does appear in this container's argv, which is
              # acceptable *here* and would not be in a deployment: the value never
              # leaves this throwaway namespace and protects only synthetic test
              # data. It is not committed, which was the finding.
              kubectl create secret generic superplane-integration-test-api-secrets \
                --namespace superplane-integration-test \
                --from-literal=JWT_SECRET_KEY="$KEY" \
                --from-literal=DATABASE_URL="postgresql+asyncpg://superplane:superplane@superplane-integration-test-postgres.superplane-integration-test.svc.cluster.local:5432/superplane" \
                --dry-run=client -o json \
                | kubectl patch secret superplane-integration-test-api-secrets \
                    --namespace superplane-integration-test \
                    --type=merge \
                    --patch-file=/dev/stdin
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
# Apply the schema before the fixture API or seed data are used.
apiVersion: batch/v1
kind: Job
metadata:
  name: superplane-integration-test-db-migrate
  namespace: superplane-integration-test
  labels:
    app.kubernetes.io/name: superplane-integration-test-db-migrate
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: superplane-integration-test
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: superplane-integration-test-db-migrate
        app.kubernetes.io/component: migration
        app.kubernetes.io/part-of: superplane-integration-test
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-db
          image: public.ecr.aws/docker/library/postgres:16-alpine
          securityContext:
            allowPrivilegeEscalation: false
          command: ['sh', '-c', 'until pg_isready -h superplane-integration-test-postgres.superplane-integration-test.svc.cluster.local -p 5432 -U superplane; do echo "Waiting for postgres..."; sleep 2; done']
      containers:
        - name: migrate
          image: 605440105851.dkr.ecr.us-east-1.amazonaws.com/superplane/api:latest
          securityContext:
            allowPrivilegeEscalation: false
          command: ['python', '-m', 'alembic', 'upgrade', 'head']
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: superplane-integration-test-api-secrets
                  key: DATABASE_URL
                  optional: false
            # THE DOCUMENTED LOCAL-ONLY EXCEPTION (issue #5676, A22).
            #
            # Verified database TLS is mandatory everywhere else. It cannot apply
            # here because the thing this connects to is the throwaway in-cluster
            # Postgres defined at the top of this file: it serves no certificate,
            # so there is nothing to verify and no CA that would make it
            # verifiable. Pointing a verifying client at it would not be more
            # secure, it would simply not start.
            #
            # Why this is safe HERE and nowhere else: the fixture refuses to
            # apply outside a loopback kind/k3d/minikube context (see
            # apply-integration-test-fixture.sh), the database lives on an
            # emptyDir destroyed with the pod, and it holds only the synthetic
            # rows seeded below. There are no tenant records, no spend rows and
            # no audit history on the wire to expose.
            #
            # This value must never appear in a real deployment manifest. The
            # three under deploy/ (deployment.yaml, db-migrate-job.yaml,
            # db-seed-job.yaml) reference the CA secret instead, and a test
            # enumerates them to keep it that way.
            - name: SUPERPLANE_DATABASE_ALLOW_UNVERIFIED_LOCAL_TLS
              value: "true"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
# Seed only after Alembic reports that the fixture schema is current.
apiVersion: batch/v1
kind: Job
metadata:
  name: superplane-integration-test-db-seed
  namespace: superplane-integration-test
  labels:
    app.kubernetes.io/name: superplane-integration-test-db-seed
    app.kubernetes.io/component: seed
    app.kubernetes.io/part-of: superplane-integration-test
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: superplane-integration-test-db-seed
        app.kubernetes.io/component: seed
        app.kubernetes.io/part-of: superplane-integration-test
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-schema
          image: 605440105851.dkr.ecr.us-east-1.amazonaws.com/superplane/api:latest
          securityContext:
            allowPrivilegeEscalation: false
          command: ['sh', '-c', 'until python -m alembic check; do echo "Waiting for migrations..."; sleep 2; done']
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: superplane-integration-test-api-secrets
                  key: DATABASE_URL
                  optional: false
            # Local-only exception: `alembic check` opens a real connection to the
            # certificate-less throwaway Postgres. See the migrate Job above.
            - name: SUPERPLANE_DATABASE_ALLOW_UNVERIFIED_LOCAL_TLS
              value: "true"
      containers:
        - name: seed
          image: public.ecr.aws/docker/library/postgres:16-alpine
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: superplane-integration-test-api-secrets
                  key: DATABASE_URL
                  optional: false
            # This container is `psql` (libpq), not our Python image, so it would
            # not read the exception variable. It is declared anyway so that every
            # connection in this fixture states its posture in one consistent way
            # and the enumerating test in tests/test_deploy_database_tls.py has a
            # uniform thing to assert. libpq's own default here is `prefer`, which
            # is what the throwaway Postgres can actually serve.
            - name: SUPERPLANE_DATABASE_ALLOW_UNVERIFIED_LOCAL_TLS
              value: "true"
          command:
            - sh
            - -c
            - |
              set -eu
              PGURL=$(printf '%s' "$DATABASE_URL" | sed -e 's|^postgresql+asyncpg://|postgresql://|')
              psql "$PGURL" <<'EOSQL'
              INSERT INTO organizations (id, name, billing_plan)
              VALUES ('11111111-1111-1111-1111-111111111111', 'test-org', 'pro')
              ON CONFLICT (id) DO NOTHING;

              INSERT INTO clusters (id, org_id, name, status, health_status, endpoint, eks_cluster_arn)
              VALUES (
                '22222222-2222-2222-2222-222222222222',
                '11111111-1111-1111-1111-111111111111',
                'superplane-test',
                'Active',
                'Healthy',
                'https://ABCDEF.gr7.us-east-1.eks.amazonaws.com',
                'arn:aws:eks:us-east-1:938500344975:cluster/superplane-test'
              )
              ON CONFLICT (id) DO NOTHING;
              EOSQL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
# API Server ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: superplane-integration-test-api
  namespace: superplane-integration-test
  labels:
    app.kubernetes.io/name: superplane-integration-test-api
    app.kubernetes.io/component: api-server
    app.kubernetes.io/part-of: superplane-integration-test
---
# API Server Service
apiVersion: v1
kind: Service
metadata:
  name: superplane-integration-test-api
  namespace: superplane-integration-test
  labels:
    app.kubernetes.io/name: superplane-integration-test-api
    app.kubernetes.io/component: api-server
    app.kubernetes.io/part-of: superplane-integration-test
spec:
  selector:
    app.kubernetes.io/name: superplane-integration-test-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
---
# API Server Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: superplane-integration-test-api
  namespace: superplane-integration-test
  labels:
    app.kubernetes.io/name: superplane-integration-test-api
    app.kubernetes.io/component: api-server
    app.kubernetes.io/part-of: superplane-integration-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: superplane-integration-test-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: superplane-integration-test-api
        app.kubernetes.io/component: api-server
        app.kubernetes.io/part-of: superplane-integration-test
    spec:
      serviceAccountName: superplane-integration-test-api
      terminationGracePeriodSeconds: 30
      # Wait for postgres to be ready
      initContainers:
        - name: wait-for-db
          image: public.ecr.aws/docker/library/postgres:16-alpine
          securityContext:
            allowPrivilegeEscalation: false
          command: ['sh', '-c', 'until pg_isready -h superplane-integration-test-postgres.superplane-integration-test.svc.cluster.local -p 5432 -U superplane; do echo "Waiting for postgres..."; sleep 2; done']
        - name: wait-for-schema
          image: 605440105851.dkr.ecr.us-east-1.amazonaws.com/superplane/api:latest
          securityContext:
            allowPrivilegeEscalation: false
          command: ['sh', '-c', 'until python -m alembic check; do echo "Waiting for migrations..."; sleep 2; done']
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: superplane-integration-test-api-secrets
                  key: DATABASE_URL
                  optional: false
            # Local-only exception, same reason as the migrate Job above: this
            # runs `alembic check` against the certificate-less throwaway
            # Postgres. Set here too because this is a SEPARATE container and
            # the exception is per-process — omitting it would leave this init
            # container failing to start while the ones around it succeed, which
            # is a confusing way to learn about a missing variable.
            - name: SUPERPLANE_DATABASE_ALLOW_UNVERIFIED_LOCAL_TLS
              value: "true"
      containers:
        - name: api
          image: 605440105851.dkr.ecr.us-east-1.amazonaws.com/superplane/api:latest
          securityContext:
            allowPrivilegeEscalation: false
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: superplane-integration-test-api-config
          env:
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: superplane-integration-test-api-secrets
                  key: JWT_SECRET_KEY
                  optional: false
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: superplane-integration-test-api-secrets
                  key: DATABASE_URL
                  optional: false
            # Local-only exception for the fixture API, same reason as the Jobs
            # above (issue #5676, A22): the throwaway Postgres serves no
            # certificate. See the migrate Job for the full rationale.
            - name: SUPERPLANE_DATABASE_ALLOW_UNVERIFIED_LOCAL_TLS
              value: "true"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
