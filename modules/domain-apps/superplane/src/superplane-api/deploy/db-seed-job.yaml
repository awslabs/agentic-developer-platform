# One-shot Job to seed integration test data
apiVersion: batch/v1
kind: Job
metadata:
  name: superplane-db-seed
  namespace: superplane
  labels:
    app.kubernetes.io/name: superplane-api
    app.kubernetes.io/component: seed
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      # Pod-level security context (#6105 — pod security reconciliation).
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-db
          image: public.ecr.aws/docker/library/postgres:16-alpine
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          command: ['sh', '-c', 'until pg_isready -h postgres.superplane.svc.cluster.local -p 5432 -U superplane; do echo "Waiting for postgres..."; sleep 2; done']
      containers:
        - name: seed
          image: public.ecr.aws/docker/library/postgres:16-alpine
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            # Resolved at runtime from a Secret (issue #5683, A04). The psql
            # invocation below previously carried a connection URI with the username
            # and password inline; `psql "$DATABASE_URL"` keeps the credential out of
            # this file and out of the container's argv, where `ps` and any process
            # listing would expose it to every other process in the pod.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: superplane-api-db
                  key: DATABASE_URL
                  optional: false
            # Verified transport for the seed path (issue #5676, A22), supplied
            # DIFFERENTLY from the service and the migration job, and the
            # difference is the point rather than an inconsistency.
            #
            # This container runs `psql`, which is libpq, not asyncpg. libpq
            # does not read SUPERPLANE_DATABASE_CA and cannot take a CA from an
            # environment variable at all — it wants a FILE and a mode. So the
            # bundle is mounted from the same `ca-pem` key the other two read
            # (one source of truth, so a rotated bundle reaches all three), and
            # pointed at with the two variables libpq does understand.
            #
            # `verify-full` is the mode that checks BOTH the certificate chain
            # and the hostname. `require` would encrypt while verifying
            # neither, which is the posture this story exists to remove.
            - name: PGSSLMODE
              value: verify-full
            - name: PGSSLROOTCERT
              value: /database-ca/ca.pem
          volumeMounts:
            - name: database-ca
              mountPath: /database-ca
              readOnly: true
          command:
            - sh
            - -c
            - |
              set -eu
              # The shared Secret holds the SQLAlchemy form (`postgresql+asyncpg://`)
              # because that is what the API and Alembic need. libpq does not
              # understand the `+driver` suffix and psql would fail to parse it, so
              # the scheme is normalized here. Normalized rather than stored twice:
              # two copies of one password in a Secret is a rotation hazard, and this
              # keeps a single source of truth.
              #
              # `sed` rather than `${VAR/a/b}`: this container's shell is busybox ash,
              # where bash pattern substitution is a "Bad substitution" error (checked
              # — it fails under dash too).
              #
              # Scope of what this fixes, stated precisely: the credential is no longer
              # in this FILE, which is the A04 finding. It is still passed to psql as an
              # argument, so it remains visible to a process listing inside this
              # container for the life of the Job. That is a smaller exposure than a
              # committed literal (it is not in Git, CI logs or shell history, and it
              # rotates with the Secret), but it is not zero, and libpq offers no
              # environment variable that accepts a full connection URI.
              PGURL=$(printf '%s' "$DATABASE_URL" | sed -e 's|^postgresql+asyncpg://|postgresql://|')
              psql "$PGURL" <<'EOSQL'
              -- Integration test seed data
              -- Test organization
              INSERT INTO organizations (id, name, billing_plan)
              VALUES ('11111111-1111-1111-1111-111111111111', 'test-org', 'pro')
              ON CONFLICT (id) DO NOTHING;

              -- Test cluster (for heartbeat testing)
              INSERT INTO clusters (id, org_id, name, status, health_status, endpoint, eks_cluster_arn)
              VALUES (
                '22222222-2222-2222-2222-222222222222',
                '11111111-1111-1111-1111-111111111111',
                'superplane-test',
                'Active',
                'Healthy',
                'https://ABCDEF.gr7.us-east-1.eks.amazonaws.com',
                'arn:aws:eks:us-east-1:938500344975:cluster/superplane-test'
              )
              ON CONFLICT (id) DO NOTHING;

              -- Verify
              SELECT 'Organizations:' AS info, count(*) FROM organizations;
              SELECT 'Clusters:' AS info, count(*) FROM clusters;
              EOSQL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        # Same `ca-pem` key the API and migration job read as an env var, mounted
        # as a file here because libpq requires a path (issue #5676, A22).
        - name: database-ca
          secret:
            secretName: superplane-api-db
            items:
              - key: ca-pem
                path: ca.pem
            optional: false
