# ============================================================================
# Superplane API Server — K8s Deployment + Service
# Deploys to 'superplane' namespace on the control plane cluster
# ============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: superplane
  labels:
    app.kubernetes.io/part-of: superplane
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: superplane-api
  namespace: superplane
  labels:
    app.kubernetes.io/name: superplane-api
    app.kubernetes.io/component: api-server
    app.kubernetes.io/part-of: superplane
---
apiVersion: v1
kind: Service
metadata:
  name: superplane-api
  namespace: superplane
  labels:
    app.kubernetes.io/name: superplane-api
    app.kubernetes.io/component: api-server
    app.kubernetes.io/part-of: superplane
spec:
  selector:
    app.kubernetes.io/name: superplane-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: superplane-api
  namespace: superplane
  labels:
    app.kubernetes.io/name: superplane-api
    app.kubernetes.io/component: api-server
    app.kubernetes.io/part-of: superplane
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: superplane-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: superplane-api
        app.kubernetes.io/component: api-server
        app.kubernetes.io/part-of: superplane
      annotations:
        kubectl.kubernetes.io/default-container: api
    spec:
      serviceAccountName: superplane-api
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: 605440105851.dkr.ecr.us-east-1.amazonaws.com/superplane/api:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: superplane-api-config
                optional: true
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: superplane-api-db
                  key: DATABASE_URL
                  optional: true
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
