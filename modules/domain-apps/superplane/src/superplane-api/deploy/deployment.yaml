# ============================================================================
# Superplane API Server — K8s Deployment + Service
# Deploys to 'superplane' namespace on the control plane cluster
# ============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: superplane
  labels:
    app.kubernetes.io/part-of: superplane
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: superplane-api
  namespace: superplane
  labels:
    app.kubernetes.io/name: superplane-api
    app.kubernetes.io/component: api-server
    app.kubernetes.io/part-of: superplane
---
apiVersion: v1
kind: Service
metadata:
  name: superplane-api
  namespace: superplane
  labels:
    app.kubernetes.io/name: superplane-api
    app.kubernetes.io/component: api-server
    app.kubernetes.io/part-of: superplane
spec:
  selector:
    app.kubernetes.io/name: superplane-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: superplane-api
  namespace: superplane
  labels:
    app.kubernetes.io/name: superplane-api
    app.kubernetes.io/component: api-server
    app.kubernetes.io/part-of: superplane
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: superplane-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: superplane-api
        app.kubernetes.io/component: api-server
        app.kubernetes.io/part-of: superplane
      annotations:
        kubectl.kubernetes.io/default-container: api
    spec:
      serviceAccountName: superplane-api
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: 605440105851.dkr.ecr.us-east-1.amazonaws.com/superplane/api:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: superplane-api-config
                optional: true
          env:
            # `optional: false` on both (issue #5683, A04). These were `true`, which
            # is a fail-OPEN reference: a missing or misnamed Secret let the pod start
            # with the variable simply unset. For the database that surfaces as a
            # confusing connection error; for the signing key it used to mean falling
            # back to the placeholder default in app/config.py and serving traffic on
            # a key committed to this repository.
            #
            # With `false`, a missing Secret is a pod that never starts and says why,
            # which is the failure an operator can act on.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: superplane-api-db
                  key: DATABASE_URL
                  optional: false
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: superplane-api-secrets
                  key: JWT_SECRET_KEY
                  optional: false
            # The trusted PEM bundle for this environment's database endpoint
            # (issue #5676, A22). Without it the API refuses to start, because
            # it can no longer verify that the endpoint answering on the other
            # end of the connection is actually our database.
            #
            # `optional: false` for the same reason as the two above, and it
            # matters more here than it looks: if this reference were optional,
            # a missing or misnamed key would leave the variable unset, and an
            # unset CA is exactly the state the A22 finding describes. Fail to
            # start instead.
            #
            # PROVISION THIS BEFORE ROLLING THIS MANIFEST. A pod that cannot
            # resolve the key will not start, so an environment that has never
            # had a CA bundle needs it created first — see
            # docs/runbooks/superplane-database-tls.md.
            - name: SUPERPLANE_DATABASE_CA
              valueFrom:
                secretKeyRef:
                  name: superplane-api-db
                  key: ca-pem
                  optional: false
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
