const copy = value => JSON.parse(JSON.stringify(value));
const e = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon = name => `<svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${icons[name] || icons.box}</svg>`;
const uid = () => crypto.randomUUID();
const now = () => new Date().toISOString();
const tenant = 'example-organization', actor = 'example-user';
const storageKey = 'adp.product-onboarding.prototype.v2';
const steps = [['information','Product info'],['basic','Connections'],['advanced','Environments'],['financials','Financials']];
const sourceFields = {repository:['basic','repositories'], tracker:['basic','trackers'], document:['basic','documents'], environment:['advanced','environments'], pipeline:['advanced','pipelines'], support:['advanced','support']};
const checkKinds = {repository:'repository', planning:'tracker', documents:'document', environment:'environment', pipeline:'pipeline', operations:'support'};
const kindChecks = Object.fromEntries(Object.entries(checkKinds).map(([a,b])=>[b,a]));
const labels = {information:'Product information', project_scope:'Delivery scope ready', repository:'Repository', planning:'Planning source', documents:'Documents', team_mapping:'Product team', environment:'Environment', pipeline:'Delivery pipeline', operations:'Operations context', financials:'Financial plan'};
const teams = [{id:'example-platform-team',name:'Platform team'},{id:'example-product-team',name:'Product team'}];
const catalog = [
 {key:'repository',name:'example-org/planner',kind:'repository',provider:'github',native:'424242',connection:'example-github-installation'},
 {key:'tracker',name:'Product roadmap',kind:'tracker',provider:'github',native:'board-4',connection:'example-github-installation'},
 {key:'document',name:'Planner documentation',kind:'document',provider:'github',native:'424242/docs',connection:'example-github-installation'},
 {key:'environment',name:'Development',kind:'environment',provider:'aws',native:'example-development-environment',connection:'example-aws-credential'},
 {key:'pipeline',name:'Planner build and test',kind:'pipeline',provider:'github',native:'424242/workflows/build.yml',connection:'example-github-installation'},
 {key:'support',name:'On-call and recovery runbook',kind:'support',provider:'github',native:'424242/docs/operations',connection:'example-github-installation'}
];
const blankDraft = () => ({name:'',purpose:'',users:'',starting_point:'idea',domain:'',project_mode:'create',project_id:''});
let state = {version:2,products:[],unbound:[],productId:null,projectId:null,tab:'products',section:'information',newDraft:blankDraft(),drafts:{},receipts:{},operations:[],controls:{role:'admin',discovery:'complete',pause:false,offline:false,uncertain:false},notice:'',chat:[],history:[]};
let storageOk = true, conflict = null, responses = [], requests = [];
function persist(){try{localStorage.setItem(storageKey,JSON.stringify(state));}catch{storageOk=false;}}
function product(){return state.products.find(p=>p.id===state.productId);}
function project(){return product()?.projects.find(p=>p.record.id===state.projectId);}
function ref(type,id,revision=product()?.recordRevision||'example-registry-seed',projectId=state.projectId,source='adp.profile'){
 return {tenant_id:tenant,project_id:projectId,source_connection_id:source,record_type:type,record_id:id,record_revision:String(revision)};
}
function evidence(paths,method='manual',sources=null){
 const timestamp=now();
 return {paths,state:'accepted',method,source_refs:sources||[ref('product',state.productId)],authority_mapping_ref:ref('authority_mapping',method==='manual'?'manual-editor':'source-reader',1),observed_at:timestamp,confirmed_by:{kind:'user',id:actor},confirmed_at:timestamp};
}
function track(schema,value){responses.push({schema,value:copy(value)});return value;}
function request(schema,value,operation){requests.push({schema,value:copy(value),operation});}
function newProject(name,id=uid()){
 return {record:{id,tenant_id:tenant,name,owner_user_id:actor,state:'registered'},configuration:{},provenance:[],bindings:[],session:{id:uid(),proposals:[]},members:[]};
}
function seed(){
 const id=uid(), a=newProject('Core platform'), b=newProject('Developer CLI');
 state.products=[{id,revision:1,recordRevision:uid(),data:{name:'Example Planner',purpose:'Help teams coordinate small releases.',intended_users:['Maintainers'],owner_ref:{kind:'user',id:actor},starting_point:'idea',lifecycle_status:'draft'},projects:[a,b],provenance:[]}];
 state.unbound=[newProject('Existing sandbox')];state.productId=id;state.projectId=a.record.id;
 product().provenance=[evidence(['/product/name','/product/purpose','/product/intended_users','/product/owner_ref','/product/starting_point','/product/lifecycle_status'])];
 persist();
}
try{const saved=JSON.parse(localStorage.getItem(storageKey)||'null');if(saved?.version===2)state=saved;else seed();}catch{storageOk=false;seed();}
function applicability(id){return project().configuration.applicability?.find(a=>a.check_id===id);}
function selectCheck(id,status='applicable',reason){
 const j=project(); j.configuration.applicability ||= [];
 j.configuration.applicability=j.configuration.applicability.filter(a=>a.check_id!==id);
 j.configuration.applicability.push({check_id:id,state:status,...(reason?{reason}:{})});
}
function bindingStatus(b){return b.status==='healthy'&&b.stale_after&&Date.parse(b.stale_after)<=Date.now()?'degraded':b.status;}
function healthy(kind){return project().bindings.some(b=>b.selection.kind===kind&&bindingStatus(b)==='healthy');}
function requiredCheck(id){return id==='information'||id==='project_scope'||(id==='repository'&&product().data.starting_point!=='idea')||(['environment','pipeline','operations'].includes(id)&&product().data.starting_point==='running_product');}
function progress(){
 const p=product(),j=project(),ids=new Set(['information','project_scope']);
 Object.keys(labels).filter(requiredCheck).forEach(id=>ids.add(id));
 (j.configuration.applicability||[]).forEach(a=>ids.add(a.check_id));
 if(p.data.team_id)ids.add('team_mapping');
 const checks=[...ids].map(id=>{
  const app=applicability(id),required=requiredCheck(id);let complete=false;
  if(id==='information')complete=!!(p.data.name.trim()&&p.data.purpose.trim()&&p.data.intended_users.length);
  else if(id==='project_scope')complete=true;
  else if(id==='team_mapping')complete=!!p.data.team_id;
  else if(id==='financials')complete=!!j.configuration.financials?.allocations?.length;
  else complete=healthy(checkKinds[id]);
  let status=complete?'complete':'missing';
  if(app?.state==='not_applicable'&&!required)status='not_applicable';
  else if(!complete&&app?.state==='later')status='later';
  else if(!complete&&j.bindings.some(b=>b.selection.kind===checkKinds[id]&&['degraded','revoked'].includes(bindingStatus(b))))status='stale';
  return {id,status,required,reason:status==='not_applicable'?app.reason:status==='complete'?'Saved with current evidence':status==='later'?'Chosen for later; still part of this Project':status==='stale'?'Connection needs attention':required?'Required for the selected starting point':'Selected for this Project'};
 });
 const applicable=checks.filter(c=>c.status!=='not_applicable').length,completed=checks.filter(c=>c.status==='complete').length;
 let maturity='saved';if(healthy('repository'))maturity='getting_started';if(maturity==='getting_started'&&healthy('environment')&&healthy('pipeline'))maturity='advanced';if(maturity==='advanced'&&healthy('support')&&completed===applicable)maturity='pro';
 const missing=checks.filter(c=>!['complete','not_applicable'].includes(c.status));
 return {rule_version:'profile-1',completed,applicable,percentage:Math.floor(100*completed/applicable),maturity,checks,next_steps:missing.length?missing.slice(0,2).map(c=>'Add or review '+labels[c.id].toLowerCase()):[healthy('repository')?'Keep this profile current as your product grows.':'Connect a repository when you are ready to work with code.']};
}
function visibleConfiguration(){
 const j=project(),config=copy(j.configuration);
 for(const [section,field] of Object.values(sourceFields))if(config[section]?.[field])config[section][field]=config[section][field].filter(r=>j.bindings.some(b=>JSON.stringify(b.verified_ref)===JSON.stringify(r)&&bindingStatus(b)==='healthy'));
 return config;
}
function pointer(value,path){return path.slice(1).split('/').reduce((v,k)=>v?.[k],value);}
function profile(){
 const p=product(),j=project();
 const result={schema_version:'1.0',tenant_id:tenant,product_id:p.id,project_id:j.record.id,revision:p.revision,product:copy(p.data),project:copy(j.record),configuration:visibleConfiguration(),provenance:[],progress:progress(),context_status:'unavailable'};
 result.provenance=[...p.provenance,...j.provenance].filter(entry=>entry.paths.every(path=>pointer(result,path)!==undefined));
 return track('Profile',result);
}
const sectionChecks={information:['information','project_scope'],basic:['repository','planning','documents','team_mapping'],advanced:['environment','pipeline','operations'],financials:['financials']};
function operationSection(o){
 const binding=project().bindings.find(b=>b.id===state.operationDetails?.[o.id]?.binding_id);
 return binding?sourceFields[binding.selection.kind][0]:['assign_team','create_repository'].includes(o.kind)?'basic':state.operationSections?.[o.id]||'basic';
}
function sectionState(name,pr,operations){
 const checks=pr.checks.filter(c=>sectionChecks[name].includes(c.id)),refs=[];
 for(const c of checks.filter(c=>c.status==='complete')){
  if(checkKinds[c.id])refs.push(...project().bindings.filter(b=>b.selection.kind===checkKinds[c.id]&&bindingStatus(b)==='healthy').map(b=>b.verified_ref));
  else refs.push(ref(['information','team_mapping'].includes(c.id)?'product':'project',['information','team_mapping'].includes(c.id)?state.productId:state.projectId));
 }
 const evidence_refs=[...new Map(refs.filter(Boolean).map(r=>[JSON.stringify(r),r])).values()];
 const ops=operations.filter(o=>operationSection(o)===name),pending=ops.find(o=>['pending','waiting_external','outcome_unknown'].includes(o.state));
 if(pending)return {status:'waiting_external',evidence_refs,operation_id:pending.id,reason:pending.next_action};
 const failed=ops.find(o=>o.state==='failed');
 if(failed)return {status:'blocked',evidence_refs,operation_id:failed.id,reason:failed.next_action};
 if(!checks.length)return {status:'not_started',evidence_refs};
 if(checks.every(c=>c.status==='not_applicable'))return {status:'not_applicable',evidence_refs,reason:checks[0].reason};
 const remaining=checks.filter(c=>!['complete','not_applicable'].includes(c.status));
 if(remaining.some(c=>c.status==='stale'))return {status:'blocked',evidence_refs,reason:'Verify the connection again to refresh its evidence.'};
 if(remaining.length&&remaining.every(c=>c.status==='later'))return {status:'later',evidence_refs,reason:remaining[0].reason};
 return {status:remaining.length?'in_progress':'complete',evidence_refs};
}
function session(){
 const j=project(),p=product(),pr=progress();
 j.session.proposals=j.session.proposals.filter(proposal=>Date.parse(proposal.expires_at)>Date.now()&&proposal.remaining_paths.length);
 const operations=state.operations.filter(o=>o.product_id===p.id&&o.project_id===j.record.id);
 const stepStates=Object.fromEntries(steps.map(([name])=>[name,sectionState(name,pr,operations)])),statuses=Object.values(stepStates).map(s=>s.status);
 const result={id:j.session.id,tenant_id:tenant,product_id:p.id,project_id:j.record.id,revision:p.revision,state:statuses.includes('waiting_external')?'waiting_external':statuses.some(s=>['in_progress','blocked','later'].includes(s))?'open':'completed',steps:stepStates,progress:pr,resume_path:`/products/${p.id}/projects/${j.record.id}/onboarding/${j.session.id}`,proposals:copy(j.session.proposals),operation_ids:operations.map(o=>o.id)};
 return track('Session',result);
}
function bindingView(b){

 if(state.controls.offline)return {error:'offline'};

 const allocation={id:previous?.id||uid(),name:'AI budget',target_ref:ref('product',state.productId),amount:{amount:v.amount,currency:v.currency},category:'ai',period_start:v.period_start,period_end:v.period_end,approval_status:'proposed',owner_ref:{kind:'user',id:actor}};
 current.allocations=[...(current.allocations||[]).filter(a=>a.id!==previous?.id),allocation];
 if(v.initiative)current.initiatives=[ref('initiative',v.initiative,1,state.projectId,'example-portfolio')];else delete current.initiatives;
 if(v.release_target_date)current.release_target_date=v.release_target_date;else delete current.release_target_date;
 return current;
}
function saveDraft(force=false){
 const section=state.section,d=getDraft(),changes=draftChanges(d);d.validation='';
 if(section==='information'){d.validation=identityErrors(d.values);}else{
  if(!/^(0|[1-9][0-9]{0,13})(\.[0-9]{1,6})?$/.test(d.values.amount))d.validation='Enter a non-negative budget amount.';
  else if(!d.values.period_start||!d.values.period_end||d.values.period_start>d.values.period_end)d.validation='Choose a budget period with its end on or after its start.';
 }
 if(d.validation){persist();render();return;}
 if(!Object.keys(changes).length&&section==='information'){notify('Your product information is already up to date.');return;}
 if(force){const latest=section==='information'?{name:product().data.name,purpose:product().data.purpose,users:product().data.intended_users.join(', '),domain:product().data.domain||'',starting_point:product().data.starting_point}:financialValues();d.values={...latest,...changes};d.original=latest;d.revision=product().revision;d.key=uid();delete d.body;}
 // Keep the exact body and key after an uncertain outcome; editing the draft clears them.
 const body=d.body||(section==='information'?identityBody(d.values):{action:'save',configuration:{financials:financialBody(d.values)}});d.body=copy(body);
 request(section==='information'?'ProductPatch':'StepUpdate',body,section==='information'?'updateProduct':'updateStep');
 const result=mutate(section==='information'?'updateProduct':'updateStep',body,d.revision,d.key,()=>{
  if(section==='information'){for(const [k,v] of Object.entries(body)){if(v===null)delete product().data[k];else product().data[k]=v;}product().provenance=[evidence(Object.keys(product().data).map(k=>'/product/'+k))];}
  else{const old=project().configuration.financials||{};project().configuration.financials=copy(body.configuration.financials);selectCheck('financials');for(const field of ['allocations','initiatives','release_target_date'])if(JSON.stringify(old[field])!==JSON.stringify(body.configuration.financials[field])){const path='/configuration/financials/'+field;project().provenance=project().provenance.filter(p=>!p.paths.includes(path));if(body.configuration.financials[field]!==undefined)project().provenance.push(evidence([path]));}}
 });
 if(result.error==='stale_revision'){d.error=result.error;conflict=section;persist();showConflict();return;}
 if(result.error){d.error=result.error;persist();render();return;}
 clearDraft(section);closeModal();notify('Changes saved.');
}

 state.operationDetails ||= {};state.operationDetails[o.id]={binding_id:b.id};persist();closeModal();render();

 if(o.kind==='assign_team'&&state.controls.role!=='admin'){notify('Waiting for an organization administrator. You can continue the other sections.');closeModal();return;}
 if(['denied','unavailable'].includes(state.controls.discovery)&&o.kind!=='assign_team'){o.state='failed';o.next_action=state.controls.discovery==='denied'?'Connection access denied. Review access or choose another source.':'Provider unavailable. Retry when it is available.';persist();render();return;}

  if(detail.binding_id){const b=project().bindings.find(b=>b.id===detail.binding_id);if(b?.status==='revoked'||b?.status==='unlinked'){o.state='failed';o.next_action='This selection was removed or revoked.';return;}if(b){b.status='healthy';b.observed_at=now();b.stale_after=new Date(Date.now()+86400000*2).toISOString();b.source_revision='example-source-1';b.verified_ref=ref(b.selection.kind,b.selection.native_id,b.source_revision,state.projectId,b.selection.connection_ref.id);if(b.selection.kind==='environment')b.verified_environment={provider:'aws',account_id:'123456789012',regions:['us-east-1'],role_ref:'example-read-role',permission_tier:'read_only',verified_at:now(),source_revision:'example-source-1'};const [section,field]=sourceFields[b.selection.kind];project().configuration[section]||={};project().configuration[section][field]=[b.verified_ref];track('Binding',bindingView(b));}}
  if(o.kind==='assign_team'){product().data.team_id=detail.team_id||teams[0].id;}
  if(o.kind==='create_repository'){const selection=makeSelection({...catalog[0],native:'created-'+o.id});project().bindings.push({id:uid(),project_id:state.projectId,selection,status:'unverified',generation:1,revision:product().revision});selectCheck('repository');}
  if(o.kind==='connect'){state.notice='Connection handoff completed. Choose the source to use for this Project.';}
  o.state='succeeded';o.revision=product().revision;o.next_action='Completed';
 }))return;
 track('Operation',o);closeModal();if(o.state!=='succeeded'){notify(o.next_action);return;}notify(o.kind==='assign_team'?'Team mapped. Other Project information is unchanged.':o.kind==='create_repository'?'Repository created in the preview. Verify its connection when ready.':'Connection checked. Your profile progress is updated.');

function acceptProposal(id){
 const proposal=project().session.proposals.find(p=>p.id===id),paths=[...document.querySelectorAll('.proposal-path:checked')].map(n=>n.value);
 if(!proposal||!paths.length)return modalError('Select at least one field, or close to keep the suggestions for later.');

 if(paths.some(path=>!proposal.remaining_paths.includes(path)))return modalError('This suggestion changed. Close and review it again.');
 if(paths.some(path=>(JSON.stringify(pointer({configuration:project().configuration},path))??'undefined')!==state.proposalBases[id][path]))return modalError('A selected field changed after this suggestion was created. Keep the saved value or refresh the suggestion before replacing it.');

 if(!write('updateStep',body,()=>{
  project().configuration.financials||={};
  for(const path of paths){const field=path.split('/').at(-1);project().configuration.financials[field]=copy(proposal.configuration.financials[field]);project().provenance=project().provenance.filter(p=>!p.paths.includes(path));project().provenance.push(evidence([path],'extracted',proposal.provenance.find(p=>p.paths.includes(path)).source_refs));}

 })){return;}

function relationships(){modal('How your work connects',`<div class="relationship-explanation"><p><strong>Portfolio</strong> — an optional collection of products, such as Commerce. A product can belong to more than one collection.</p><p><strong>Product</strong> — the enduring thing you build.</p><p><strong>Project</strong> — its delivery, operating and evidence scope. Most products start with one.</p><p><strong>Initiative</strong> — a business objective across products. Each Product contributes an agreed outcome.</p><p><strong>Release</strong> — a planned shipment of selected work and artifacts. It can connect contributions from several products.</p></div><div class="callout" style="margin-top:18px"><div><strong>Example: improve customer checkout</strong><p>Commerce groups Checkout and Accounts. Accounts also belongs to Shared services. The checkout Initiative brings their contributions together: a faster purchase flow and sign-in changes. Each Product can ship on its own release schedule.</p></div></div><p class="hint" style="margin-top:16px">Work, tests, deployments and cost retain their original identities in Engineering Insights. Business links do not change access or count the same work twice.</p>`);}
function previewControls(){modal('Preview scenarios',`<p class="hint">These controls are for reviewing this prototype. They are outside the proposed product workflow.</p><label class="field"><span>Current role</span><select id="preview-role">${['admin','editor'].map(v=>`<option ${state.controls.role===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="field"><span>Discovery</span><select id="preview-discovery">${['complete','partial','unavailable','denied'].map(v=>`<option ${state.controls.discovery===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="check-option"><input id="preview-pause" type="checkbox" ${state.controls.pause?'checked':''}><span>Pause connection and administrator handoffs</span></label><label class="check-option"><input id="preview-offline" type="checkbox" ${state.controls.offline?'checked':''}><span>Offline</span></label><label class="check-option"><input id="preview-uncertain" type="checkbox" ${state.controls.uncertain?'checked':''}><span>Lose the next edit’s save response</span></label>${state.tab!=='products'&&state.tab!=='new'?button('revoke-repository','Revoke the selected repository in this preview'):''}<div class="rule"></div>${button('reset','Reset all sample data')}`,button('apply-preview','Apply scenario',true));}
function exportProfile(){const data=JSON.stringify(profile(),null,2),blob=new Blob([data+'\n'],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='product-profile.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
const actions={
 close:closeModal,products:()=>navigate('products'),'new-product':()=>{state.createError='';navigate('new');},
 'open-product':b=>{state.productId=b.dataset.id;state.projectId=product().projects[0].record.id;navigate('overview');},
 'edit-info':()=>navigate('setup','information'),dismiss:()=>{state.notice='';persist();render();},
 'suggest-next':()=>{const next=progress().checks.find(c=>!['complete','not_applicable'].includes(c.status));const section=next?.id==='financials'?'financials':['environment','pipeline','operations'].includes(next?.id)?'advanced':'basic';navigate('setup',section);},
 source:b=>sourceModal(b.dataset.kind),'select-source':b=>selectSource(b.dataset.kind),'verify-source':b=>verifySource(b.dataset.kind),'unlink-source':b=>unlinkSource(b.dataset.id),'connect-source':b=>connectSource(b.dataset.kind),
 'start-connection':()=>{const body={target:document.getElementById('provider').value,action:'connect'};request('HandoffRequest',body,'startHandoff');const o=operation('connect','Complete the provider connection, then check again.');closeModal();render();if(!state.controls.pause)completeOperation(o.id);},
 'resume-operation':b=>completeOperation(b.dataset.id),team:teamModal,'save-team':saveTeam,'create-team':createTeam,
 'confirm-team':()=>{if(state.controls.role!=='admin')return modalError('An administrator must create the team.');const name=document.getElementById('new-team-name').value.trim();if(!name)return modalError('Enter a team name.');const team={id:uid(),name};teams.push(team);state.extraTeams||=[];state.extraTeams.push(team);if(write('updateProduct',{team_id:team.id},()=>{product().data.team_id=team.id;})){closeModal();notify('Team created in Engineering and mapped to the Product.');}},
 member:memberModal,'save-member':()=>{if(state.controls.role!=='admin')return modalError('An administrator must change membership.');state.teamMembers||={};const members=state.teamMembers[product().data.team_id]||=[];if(!members.includes('Sam Taylor'))members.push('Sam Taylor');persist();closeModal();notify('Existing organization member added to the team in this preview.');},
 'review-import':reviewImport,'accept-proposal':b=>acceptProposal(b.dataset.id),'financial-later':financialLater,'financial-na':financialNA,'save-na':saveNA,
 'use-latest':()=>{clearDraft(conflict);conflict=null;closeModal();render();},'merge-draft':()=>{state.section=conflict;saveDraft(true);conflict=null;},'check-save':checkSave,
 'manage-projects':manageProjects,'add-project':()=>addProject(false),'bind-existing':()=>addProject(true),'unbind-project':unbindProject,
 'create-repository':createRepository,'confirm-repository':confirmRepository,cli,'cli-edit':cliEdit,export:exportProfile,relationships,
 preview:previewControls,'apply-preview':()=>{state.controls={role:document.getElementById('preview-role').value,discovery:document.getElementById('preview-discovery').value,pause:document.getElementById('preview-pause').checked,offline:document.getElementById('preview-offline').checked,uncertain:document.getElementById('preview-uncertain').checked};persist();closeModal();render();},
 'revoke-repository':()=>{const b=project()?.bindings.find(b=>b.selection.kind==='repository'&&b.status!=='unlinked');if(b){b.status='revoked';b.generation++;product().revision++;product().recordRevision=uid();project().provenance=project().provenance.filter(p=>!p.source_refs.some(r=>r.record_id===b.selection.native_id&&r.source_connection_id===b.selection.connection_ref.id));project().session.proposals=[];persist();}closeModal();notify('Source access revoked. Protected source details are cleared from views and export.');},
 reset:()=>{localStorage.removeItem(storageKey);location.reload();},
 placement:()=>modal('Placement in ADP','<p class="small muted">Products uses the existing ADP shell. Connections, Credentials, Organizations and Budget & Spend retain their existing destinations. Product setup does not add another account onboarding flow.</p>'),
 'existing-route':b=>modal(b.dataset.label,`<p class="small muted">This remains an existing ADP page. The preview keeps your profile progress while you visit it.</p><p class="hint">${e(b.dataset.route)}</p>`),
 'logout-preview':()=>modal('Account control','<p class="small muted">This preview has no authenticated session to end.</p>'),
 'mobile-nav':()=>modal('Menu',`<nav class="mobile-nav-preview">${navMarkup()}</nav>`)
};
function captureField(n){
 if(state.tab==='new'){state.newDraft[n.dataset.edit]=n.value;persist();return;}
 const d=getDraft();if(d.error==='outcome_unknown')return;
 d.values[n.dataset.edit]=n.value;d.key=uid();delete d.body;d.error=null;d.validation='';persist();
 const label=document.getElementById('save-state');if(label)label.textContent=saveState(d);
}
document.addEventListener('input',event=>{if(event.target.dataset.edit)captureField(event.target);});
document.addEventListener('change',event=>{const n=event.target;if(n.id==='project-selector'){state.projectId=n.value;state.notice='';persist();render();focusPage();return;}if(n.dataset.edit){captureField(n);if(state.tab==='new'&&n.dataset.edit==='project_mode')render();}});
document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;if(b.dataset.section){navigate('setup',b.dataset.section);return;}if(b.dataset.tab){navigate(b.dataset.tab);return;}if(b.dataset.action){event.preventDefault();actions[b.dataset.action]?.(b);}});
document.addEventListener('submit',event=>{event.preventDefault();if(event.target.id==='create-form')createProduct();else if(['information-form','financials-form'].includes(event.target.id))saveDraft();else if(event.target.id==='chat-form'){const text=document.getElementById('chat-input').value.trim();if(text){state.chat.push(/initiative/i.test(text)?'An initiative can span several products. Link an existing initiative when you have a contribution to plan; it is optional for onboarding.':progress().next_steps[0]);persist();render();}}});
for(const team of state.extraTeams||[])if(!teams.some(t=>t.id===team.id))teams.push(team);
window.adpPrototype={profile,session,listProducts,bindings:()=>track('BindingPage',{items:project().bindings.map(bindingView),next_cursor:null}),evidence:()=>copy({requests,responses}),snapshot:()=>copy(state)};
render();

</script>
</body>
</html>
