rules:
- id: gitlab.nodejs_scan.javascript-ssrf-rule-node_ssrf
  languages:
  - javascript
  message: "This application allows user-controlled URLs to be passed directly to\
    \ HTTP client libraries.  This can result in Server-Side Request Forgery (SSRF).\
    \ SSRF refers to an attack where the attacker can abuse functionality on  the\
    \ server to force it to make requests to other internal systems within your  infrastructure\
    \ that are not directly exposed to the internet.  This allows the attacker to\
    \ access internal resources they do not have direct access to.\nSome risks of\
    \ SSRF are:\n- Access and manipulation of internal databases, APIs, or administrative\
    \ panels - Ability to scan internal network architecture and services - Can be\
    \ used to pivot attacks into the internal network - Circumvent network segregation\
    \ and firewall rules\nTo avoid this, try using hardcoded HTTP request calls or\
    \ a whitelisting object to  check whether the user input is trying to access allowed\
    \ resources or not.\nHere is an example: ``` var whitelist = [\n  \"https://example.com\"\
    , \n  \"https://example.com/sample\"\n]\napp.get('/ssrf/node-ssrf/axios/safe/3',\
    \ function (req, res) {\n  if(whitelist.includes(req.query.url)){\n      axios.get(url,\
    \ {})\n          .then(function (response) {\n              console.log(response);\n\
    \          })\n          .catch(function (response) {\n              console.log(response);\
    \  \n          })\n  }\n}); ```  For more information on SSRF see OWASP: https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html\n"
  metadata:
    category: security
    cwe: CWE-918
    license: MIT
    owasp:
    - A1:2017-Injection
    - A03:2021-Injection
    primary_identifier: nodejs_scan.javascript-ssrf-rule-node_ssrf
    secondary_identifiers:
    - name: NodeJS Scan ID javascript-ssrf-rule-node_ssrf
      type: njsscan_rule_type
      value: User controlled URL in http client libraries can result in Server Side
        Request Forgery (SSRF).
    security-severity: CRITICAL
    semgrep.dev:
      rule:
        origin: community
        r_id: 144435
        rule_id: AbU9DZO
        rv_id: 920526
        url: https://semgrep.dev/playground/r/YDTYbzN/gitlab.nodejs_scan.javascript-ssrf-rule-node_ssrf
        version_id: YDTYbzN
    shortDescription: Server-side request forgery (SSRF)
    shortlink: https://sg.run/ZqdGn
    source: https://semgrep.dev/r/gitlab.nodejs_scan.javascript-ssrf-rule-node_ssrf
    vulnerability_class:
    - Other
  mode: taint
  pattern-sanitizers:
  - patterns:
    - pattern-either:
      - pattern: "if($VALIDATION){\n...\n} \n"
      - pattern: '$A = $VALIDATION

          ...

          if($A){

          ...

          }

          '
    - metavariable-pattern:
        metavariable: $VALIDATION
        pattern-either:
        - pattern: "$AL.includes(...)  \n"
        - pattern: '$AL.indexOf(...) !== -1

            '
        - pattern: '$AL.find(...) !== undefined

            '
        - pattern: '$ALS.has(...)

            '
  pattern-sinks:
  - pattern-either:
    - patterns:
      - pattern-either:
        - pattern-inside: '$NEEDLE = require(''needle'');

            ...

            '
        - pattern-inside: 'import $NEEDLE from ''needle''

            ...

            '
      - pattern-either:
        - pattern: $NEEDLE('$VERB', ...)
        - pattern: $NEEDLE.$VERB($REQ. ...,...)
      - metavariable-regex:
          metavariable: $VERB
          regex: ^(get|put|post|patch|delete|head)$
  - patterns:
    - pattern-either:
      - pattern-inside: '$AXIOS = require(''axios'');

          ...

          '
      - pattern-inside: 'import $AXIOS from ''axios''

          ...

          '
    - pattern-either:
      - patterns:
        - pattern: $AXIOS(...)
        - pattern-not-inside: 'if($ARR.indexof(<...$REQ...>) != -1){...}

            '
      - patterns:
        - pattern: $AXIOS.$VERB(...)
        - metavariable-regex:
            metavariable: $VERB
            regex: ^(get|put|post|patch|delete|head)$
  - patterns:
    - pattern-either:
      - pattern-inside: '{..., request, ... } = require(''urllib'');

          ...

          '
      - pattern-inside: 'import {..., request, ... } from ''urllib''

          ...

          '
    - pattern: request(...)
  - patterns:
    - pattern-either:
      - pattern-inside: '$URLLIIB = require(''urllib'');

          ...

          '
      - pattern-inside: 'import $URLLIIB from ''urllib''

          ...

          '
    - pattern: $URLLIIB.request(...)
  - patterns:
    - pattern-either:
      - pattern-inside: "$SA = require('superagent');\n ...\n"
      - pattern-inside: 'import $SA from ''superagent''

          ...

          '
    - patterns:
      - pattern: $SA.$VERB(...)
      - metavariable-regex:
          metavariable: $VERB
          regex: ^(get|put|post|patch|delete|head)$
  - pattern: fetch(...)
  - patterns:
    - pattern-either:
      - pattern-inside: '$HTTP = require(''$PKG'');

          ...

          '
      - pattern-inside: 'import $HTTP from $PKG

          ...

          '
    - pattern-either:
      - patterns:
        - pattern: $HTTP.$VERB(...)
        - metavariable-regex:
            metavariable: $VERB
            regex: ^(get|put|post|patch|delete|head)$
    - metavariable-regex:
        metavariable: $PKG
        regex: ^(http|https)$
  - patterns:
    - pattern-either:
      - pattern-inside: '$IO = require(''socket.io-client'');

          ...

          '
      - pattern-inside: 'import $IO from ''socket.io-client''

          ...

          '
    - pattern: $IO(...)
  - patterns:
    - pattern-either:
      - pattern-inside: '$NET = require(''net'');

          ...

          $NETCLIENT = new $NET.Socket()

          ...

          '
      - pattern-inside: 'import $NET from ''net''

          ...

          $NETCLIENT = new $NET.Socket()

          ...

          '
    - pattern: $NETCLIENT.connect(...)
  - patterns:
    - pattern-either:
      - pattern-inside: '$BENT = require(''bent'');

          ...

          '
      - pattern-inside: 'import $BENT from ''bent'';

          ...

          '
    - pattern: $BENT(...)
  - patterns:
    - pattern-either:
      - pattern-inside: '$BENT = require(''bent'');

          ...

          $MTD = $BENT(...)

          '
      - pattern-inside: 'import $BENT from ''bent'';

          ...

          $MTD = $BENT(...)

          '
    - pattern: $MTD(...)
  - patterns:
    - pattern-either:
      - pattern-inside: '$BENT = require(''bent'');

          ...

          $GETBENT = $BENT(''$PKG'')

          ...

          '
      - pattern-inside: 'import $BENT from ''bent'';

          ...

          $GETBENT = $BENT(''$PKG'')

          ...

          '
    - pattern: $GETBENT(...)
    - metavariable-regex:
        metavariable: $PKG
        regex: ^(json|buffer)$
  - patterns:
    - pattern-either:
      - pattern-inside: 'import $GOT from ''got'';

          ...

          '
    - pattern: $GOT.$VERB(...)
    - metavariable-regex:
        metavariable: $VERB
        regex: ^(get|put|post|patch|delete|head)$
  - patterns:
    - pattern-either:
      - pattern-inside: '$REQUEST = require(''request'');

          ...

          '
      - pattern-inside: 'import $REQUEST from ''request'';

          ...

          '
    - pattern: $REQUEST(...)
  pattern-sources:
  - patterns:
    - focus-metavariable: $REQ
    - pattern: function ($REQ, $RES, ...) {...}
  - patterns:
    - focus-metavariable: $REQ
    - pattern: function $FUNC($REQ, $RES, ...) {...}
  severity: ERROR
